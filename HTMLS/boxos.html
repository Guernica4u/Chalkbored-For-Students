  /* ---- a small Hacker News reader ---- */
  async function renderHN(my){
    setAddr("hn");
    win.setTitle("Hacker News");
    spinner("Loading Hacker News" + String.fromCharCode(8230));
    try {
      const res = await grab("https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30", 9000);
      if (my !== reqId) return;
      const j = await res.json();
      if (my !== reqId) return;
      const p = page();
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Hacker News front page"));
      (j.hits || []).forEach((h, i) => {
        const b = el("button", "wb-result");
        b.appendChild(el("div", "wb-result-t", (i + 1) + ". " + h.title));
        let host = "news.ycombinator.com";
        try { if (h.url) host = new URL(h.url).hostname.replace(/^www\./, ""); } catch (e){}
        b.appendChild(el("div", "wb-result-s", (h.points || 0) + " points - " + (h.num_comments || 0) + " comments - " + host));
        b.onclick = () => go(h.url ? { kind: "web", url: h.url } : { kind: "search", q: h.title });
        s.appendChild(b);
      });
      p.appendChild(s);
    } catch (e){
      if (my !== reqId) return;
      errorPage("Could not reach Hacker News", "The request failed or timed out.", null);
    }
  }

  /* ---- start page ---- */
  function drawHome(){
    current = null;
    setAddr("");
    win.setTitle("Browser");
    const p = page();
    const hero = el("div", "hero");
    hero.innerHTML =
      '<span class="logo"><svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">' +
      '<path d="M32 4 58 17v30L32 60 6 47V17z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>' +
      '<path d="M6 17l26 13 26-13M32 30v30" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>' +
      "</svg></span>";
    hero.append(el("h1", null, "BOX Browser"));
    hero.append(el("p", null, "Search, read Wikipedia and Stack Overflow, browse GitHub, open your own pages."));
    const form = el("div", "wb-search");
    const q = el("input");
    q.placeholder = "Search, or type an address";
    const gob = el("button", "btn primary", "Go");
    gob.style.cssText = "height:38px;border-radius:19px;padding:0 20px";
    const submit = () => { if (q.value.trim()) go(q.value); };
    gob.onclick = submit;
    q.onkeydown = e => { if (e.key === "Enter" || e.key === "Return") submit(); };
    form.append(q, gob);
    hero.appendChild(form);
    p.appendChild(hero);

    const pages = [];
    walkFS((path, n, name) => { if (n.type === "file" && isHtml(name)) pages.push(path); });
    const s1 = el("div", "wb-sect");
    s1.appendChild(el("h2", null, "Pages on this computer"));
    if (pages.length){
      const grid = el("div", "wb-links");
      for (const path of pages){
        const b = el("button", "wb-link");
        b.append(el("span", null, String.fromCodePoint(0x1F310)), el("span", null, baseName(path)));
        b.title = tilde(path);
        b.onclick = () => go("box:" + path);
        grid.appendChild(b);
      }
      s1.appendChild(grid);
    } else {
      s1.appendChild(el("div", "wb-none", "No HTML files yet. Import one in Files, or make one with New File."));
    }
    p.appendChild(s1);

    const s2 = el("div", "wb-sect");
    s2.appendChild(el("h2", null, "Places to start"));
    const grid2 = el("div", "wb-links");
    const picks = [
      ["Hacker News", () => go({ kind: "hn" })],
      ["Stack Overflow", () => go({ kind: "so", q: "javascript" })],
      ["GitHub search", () => go({ kind: "gh", q: "operating system" })],
      ["Operating system", () => go({ kind: "wiki", title: "Operating_system" })],
      ["Linux Mint", () => go({ kind: "wiki", title: "Linux_Mint" })],
      ["Today in history", () => go({ kind: "search", q: "on this day" })],
      ["Random article", () => go({ kind: "wiki", title: "Special:Random" })]
    ];
    for (const [label, fn] of picks){
      const b = el("button", "wb-link");
      b.textContent = label;
      b.onclick = fn;
      grid2.appendChild(b);
    }
    s2.appendChild(grid2);
    p.appendChild(s2);
    syncNav();
    setTimeout(() => q.focus(), 30);
  }

  /* links clicked inside a fetched article come back here as a message */
  const onMsg = e => {
    if (!frame || e.source !== frame.contentWindow) return;
    const href = e.data && e.data.boxnav;
    if (!href) return;
    const title = wikiTitleFromHref(href);
    if (title){
      /* image pages and citation anchors are not somewhere to navigate to */
      if (/^(File|Image|Media):/i.test(title)) return;
      if (href.includes("#") && current && current.kind === "wiki" && current.title === title) return;
      return go({ kind: "wiki", title });
    }
    if (/^https?:/i.test(href)) return go({ kind: "web", url: href });
  };
  addEventListener("message", onMsg);

  bb("back").onclick   = () => { if (hi > 0){ hi--; render(hist[hi]); } };
  bb("fwd").onclick    = () => { if (hi < hist.length - 1){ hi++; render(hist[hi]); } };
  bb("reload").onclick = () => { if (current) render(current); else drawHome(); };
  bb("home").onclick   = drawHome;
  bb("ext").onclick    = () => { const u = externalUrl(current); if (u) window.open(u, "_blank", "noopener"); };
  addr.onkeydown = e => { if (e.key === "Enter" || e.key === "Return") go(addr.value); };
  addr.onfocus = () => addr.select();

  if (startTarget) go(startTarget); else drawHome();
  return { go, onClose(){ removeEventListener("message", onMsg); return true; } };
}

/* ============================================================
   11. Terminal
   ============================================================ */
function terminalApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="term-wrap"><div class="term-out"></div>' +
    '<div class="term-in-row"><span class="ps1"></span>' +
    '<input class="term-in" spellcheck="false" autocomplete="off" autocapitalize="off"></div></div>';
  const wrap = $(".term-wrap", B), out = $(".term-out", B), ps1 = $(".ps1", B), inp = $(".term-in", B);

  let cwd = HOME;
  const hist = [];
  let hi = 0;

  const scroll = () => { wrap.scrollTop = wrap.scrollHeight; };
  function line(parts, cls){
    const row = el("div", "term-row" + (cls ? " " + cls : ""));
    if (typeof parts === "string") row.textContent = parts;
    else for (const [txt, c] of parts) row.appendChild(el("span", c || null, txt));
    out.appendChild(row);
    return row;
  }
  function block(text, cls){
    const pre = el("div", cls || null);
    pre.style.whiteSpace = "pre-wrap";
    pre.textContent = text;
    out.appendChild(pre);
  }
  const err = m => line([[m, "t-err"]]);

  function drawPs1(){
    ps1.innerHTML = "";
    ps1.append(el("span", "ps1-u", "box@boxos"), el("span", "ps1-s", ":"),
               el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "));
  }
  function refreshFiles(){
    for (const w of windows.values())
      if (w.appId === "files" && w.api && w.api.navigate) w.api.navigate(".", true);
  }

  const CMDS = {
    help(){
      block(
"Available commands\n\n" +
"  ls [path]          list a directory        pwd            print working directory\n" +
"  cd [path]          change directory        cat <file>     print a file\n" +
"  mkdir <name>       make a directory        touch <file>   create an empty file\n" +
"  rm [-r] <path>     remove a file/dir       echo <text>    print text (supports > file)\n" +
"  open <path>        open in the right app   edit <file>    open in the Files editor\n" +
"  web <url|words>    open in the Browser     tree [path]    show the tree\n" +
"  find <name>        search the filesystem   shortcut <t>   put something on the desktop\n" +
"  notify <text>      raise a notification    apps           list applications\n" +
"  launch <app>       start an application    theme [l|d]    switch light/dark\n" +
"  date               current date/time       uptime         session uptime\n" +
"  whoami             current user            uname [-a]     system info\n" +
"  neofetch           system summary          history        command history\n" +
"  clear              clear the screen        exit           close this terminal\n\n" +
"Paths accept ~ for home and .. for parent. Up/Down arrows walk history.");
    },
    pwd(){ line(cwd); },
    whoami(){ line("box"); },
    date(){ line(new Date().toString()); },
    uptime(){ line("up " + fmtDuration(Date.now() - BOOT_TIME) + ", " + windows.size + " window(s) open"); },
    clear(){ out.innerHTML = ""; },
    exit(){ win.close(); },
    history(){ hist.forEach((h, i) => line(String(i + 1).padStart(4) + "  " + h)); },
    apps(){
      for (const id in APPS)
        if (!APPS[id].hidden) line([[id.padEnd(12), "t-key"], [APPS[id].name + " - " + APPS[id].desc, ""]]);
    },
    uname(a){ line(a[0] === "-a" ? "BOX OS boxos 1.3 single-file " + (navigator.platform || "web") + " browser" : "BOX OS"); },
    theme(a){
      const t = (a[0] || "").toLowerCase();
      const next = (t === "l" || t === "light") ? "light" : (t === "d" || t === "dark") ? "dark" : (State.theme === "dark" ? "light" : "dark");
      setTheme(next, $("#traytheme"));
      line([["theme set to ", "t-dim"], [next, "t-ok"]]);
    },
    notify(a, raw){
      if (!raw) return err("notify: nothing to say");
      notify("Terminal", raw, "\u2328\uFE0F");
      line([["notification raised", "t-dim"]]);
    },
    shortcut(a, raw){
      if (!raw) return err("shortcut: give an app name, a path or a URL");
      const s = guessShortcut(raw);
      if (!s) return err("shortcut: cannot resolve " + raw);
      addShortcut(s);
      line([["added ", "t-dim"], [s.label, "t-ok"], [" to the desktop", "t-dim"]]);
    },
    web(a, raw){
      if (!raw) return err("web: give a URL or something to search for");
      openInBrowser(raw);
      line([["opening in the Browser", "t-dim"]]);
    }
  };

  CMDS.ls = function(a){
    const target = a.find(x => !x.startsWith("-")) || ".";
    const p = absPath(target, cwd), n = node(p);
    if (!n) return err("ls: " + target + ": no such file or directory");
    if (n.type === "file") return line(baseName(p));
    const names = listDir(n);
    if (!names.length) return;
    const row = el("div", "term-row");
    names.forEach(name => {
      const c = n.children[name];
      const s = el("span", c.type === "dir" ? "t-dir" : c.kind === "image" ? "t-img" : null, name + (c.type === "dir" ? "/" : ""));
      s.style.marginRight = "18px";
      row.appendChild(s);
    });
    out.appendChild(row);
  };
  CMDS.cd = function(a){
    const t = a[0] || "~", p = absPath(t, cwd), n = node(p);
    if (!n) return err("cd: " + t + ": no such file or directory");
    if (n.type !== "dir") return err("cd: " + t + ": not a directory");
    cwd = p;
    drawPs1();
  };
  CMDS.cat = function(a){
    if (!a.length) return err("cat: missing operand");
    for (const t of a){
      const n = node(absPath(t, cwd));
      if (!n){ err("cat: " + t + ": no such file or directory"); continue; }
      if (n.type === "dir"){ err("cat: " + t + ": is a directory"); continue; }
      if (n.kind !== "text"){ err("cat: " + t + ": binary file (" + fmtBytes(nodeSize(n)) + ")"); continue; }
      block(n.content);
    }
  };
  CMDS.mkdir = function(a){
    if (!a.length) return err("mkdir: missing operand");
    for (const t of a){
      const p = absPath(t, cwd);
      if (node(p)){ err("mkdir: " + t + ": file exists"); continue; }
      if (!node(dirName(p))){ err("mkdir: " + t + ": no such parent directory"); continue; }
      ensureDir(p);
    }
    refreshFiles();
  };
  CMDS.touch = function(a){
    if (!a.length) return err("touch: missing operand");
    for (const t of a){
      const p = absPath(t, cwd);
      if (node(p)) continue;
      if (!writeFile(p, "", "text")) err("touch: " + t + ": cannot create");
    }
    refreshFiles();
  };
  CMDS.rm = function(a){
    const rec = a.some(x => x === "-r" || x === "-rf" || x === "-fr");
    const targets = a.filter(x => !x.startsWith("-"));
    if (!targets.length) return err("rm: missing operand");
    for (const t of targets){
      const p = absPath(t, cwd), n = node(p);
      if (!n){ err("rm: " + t + ": no such file or directory"); continue; }
      if (n.type === "dir" && !rec){ err("rm: " + t + ": is a directory (use -r)"); continue; }
      if (p === "/"){ err("rm: refusing to remove /"); continue; }
      removePath(p);
    }
    refreshFiles();
  };
  CMDS.echo = function(a, raw){
    const gt = raw.indexOf(">");
    if (gt >= 0){
      const text = raw.slice(0, gt).trim(), target = raw.slice(gt + 1).trim();
      if (!target) return err("echo: missing file after >");
      const p = absPath(target, cwd);
      if (!node(dirName(p))) return err("echo: " + target + ": no such directory");
      writeFile(p, text + "\n", "text");
      refreshFiles();
      return;
    }
    line(raw);
  };
  CMDS.open = function(a){
    if (!a.length) return err("open: missing operand");
    const p = absPath(a[0], cwd), n = node(p);
    if (!n) return err("open: " + a[0] + ": no such file or directory");
    openNode(p);
    line([["opening ", "t-dim"], [tilde(p), "t-ok"]]);
  };
  CMDS.edit = function(a){
    if (!a.length) return err("edit: missing operand");
    const p = absPath(a[0], cwd), n = node(p);
    if (!n) return err("edit: " + a[0] + ": no such file or directory");
    if (n.type !== "file" || n.kind !== "text") return err("edit: " + a[0] + ": not an editable text file");
    openInFiles(p);
    line([["editing ", "t-dim"], [tilde(p), "t-ok"]]);
  };
  CMDS.launch = function(a){
    const id = (a[0] || "").toLowerCase();
    if (!APPS[id] || APPS[id].hidden) return err("launch: unknown application: " + (a[0] || ""));
    launch(id);
    line([["started ", "t-dim"], [APPS[id].name, "t-ok"]]);
  };
  CMDS.tree = function(a){
    const p = absPath(a[0] || ".", cwd), root = node(p);
    if (!root) return err("tree: " + (a[0] || ".") + ": no such directory");
    const lines = [tilde(p)];
    (function walk(n, prefix){
      if (n.type !== "dir") return;
      const names = listDir(n);
      names.forEach((name, i) => {
        const last = i === names.length - 1;
        lines.push(prefix + (last ? "`-- " : "|-- ") + name + (n.children[name].type === "dir" ? "/" : ""));
        walk(n.children[name], prefix + (last ? "    " : "|   "));
      });
    })(root, "");
    block(lines.join("\n"));
  };
  CMDS.find = function(a){
    if (!a.length) return err("find: missing search term");
    const q = a.join(" ").toLowerCase();
    let hits = 0;
    walkFS((p, n, name) => {
      if (name.toLowerCase().includes(q)){ line([[tilde(p), n.type === "dir" ? "t-dir" : ""]]); hits++; }
    });
    if (!hits) line([["no matches for " + a.join(" "), "t-dim"]]);
  };

  CMDS.mv = function(a){
    if (a.length < 2) return err("mv: needs a source and a destination");
    const dest = absPath(a[a.length - 1], cwd);
    const srcs = a.slice(0, -1).map(x => absPath(x, cwd));
    const destNode = node(dest);
    if (srcs.length > 1 && (!destNode || destNode.type !== "dir"))
      return err("mv: " + a[a.length - 1] + ": not a directory");
    for (const src of srcs){
      if (!node(src)){ err("mv: " + tilde(src) + ": no such file or directory"); continue; }
      if (destNode && destNode.type === "dir"){
        if (!movePath(src, dest)) err("mv: cannot move " + tilde(src) + " in there");
      } else {
        if (!node(dirName(dest))){ err("mv: no such directory"); continue; }
        const moved = movePath(src, dirName(dest));
        if (moved) renamePath(dirName(dest) + "/" + moved, baseName(dest));
        else err("mv: cannot move " + tilde(src));
      }
    }
    refreshFiles();
  };
  CMDS.cp = function(a){
    const rec = a.some(x => x === "-r" || x === "-R");
    const rest = a.filter(x => !x.startsWith("-"));
    if (rest.length < 2) return err("cp: needs a source and a destination");
    const dest = absPath(rest[rest.length - 1], cwd);
    const destNode = node(dest);
    for (const s of rest.slice(0, -1)){
      const src = absPath(s, cwd), n = node(src);
      if (!n){ err("cp: " + s + ": no such file or directory"); continue; }
      if (n.type === "dir" && !rec){ err("cp: " + s + ": is a directory (use -r)"); continue; }
      if (destNode && destNode.type === "dir") copyPath(src, dest);
      else {
        if (!node(dirName(dest))){ err("cp: no such directory"); continue; }
        const placed = copyPath(src, dirName(dest));
        if (placed) renamePath(dirName(dest) + "/" + placed, baseName(dest));
      }
    }
    refreshFiles();
  };
  CMDS.trash = function(a){
    if (!a.length) return err("trash: missing operand");
    let n = 0;
    for (const t of a){
      const p = absPath(t, cwd);
      if (!node(p)){ err("trash: " + t + ": no such file or directory"); continue; }
      if (trashPath(p)) n++;
    }
    refreshFiles();
    if (n) line([[n + " item(s) moved to Trash", "t-dim"]]);
  };
  CMDS.backup = function(){ downloadBackup(); line([["backup written to your downloads", "t-ok"]]); };
  CMDS.neofetch = function(){
    const art =
"      +---------+\n" +
"     /         /|\n" +
"    /         / |\n" +
"   +---------+  |\n" +
"   |         |  |\n" +
"   |   BOX   |  +\n" +
"   |         | /\n" +
"   |         |/\n" +
"   +---------+";
    const info = [
      ["box", "@", "boxos"], null,
      ["OS", "BOX OS 1.3 (single file)"],
      ["Kernel", "javascript " + (navigator.hardwareConcurrency || "?") + "-core"],
      ["Shell", "bsh 1.3"],
      ["Uptime", fmtDuration(Date.now() - BOOT_TIME)],
      ["WM", "boxwm" + (State.wobbly ? " (wobbly)" : "") + " - " + windows.size + " window(s)"],
      ["Theme", (State.theme === "dark" ? "Dark" : "Light") + " / " + State.accent],
      ["Search", ENGINES[State.engine].name],
      ["Disk", countFiles() + " files"],
      ["Display", innerWidth + "x" + innerHeight]
    ];
    const artLines = art.split("\n");
    const holder = el("div", "term-row");
    holder.style.display = "flex";
    const left = el("div");
    left.style.whiteSpace = "pre";
    left.style.color = "#8bae5a";
    left.style.marginRight = "20px";
    left.textContent = art;
    const right = el("div");
    right.style.whiteSpace = "pre";
    for (let i = 0; i < Math.max(artLines.length, info.length); i++){
      const it = info[i], r = el("div");
      if (it === null) r.append(el("span", "t-dim", "----------------------"));
      else if (it && it.length === 3) r.append(el("span", "t-ok", it[0]), el("span", "t-dim", it[1]), el("span", "t-ok", it[2]));
      else if (it) r.append(el("span", "t-key", it[0] + ": "), el("span", null, it[1]));
      else r.textContent = " ";
      right.appendChild(r);
    }
    holder.append(left, right);
    out.appendChild(holder);
  };
  CMDS.ll = CMDS.ls;
  CMDS.dir = CMDS.ls;
  CMDS["?"] = CMDS.help;

  function run(raw){
    const cmdline = raw.trim();
    const echoRow = el("div", "term-row");
    echoRow.append(el("span", "ps1-u", "box@boxos"), el("span", "ps1-s", ":"),
                   el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "), el("span", null, cmdline));
    out.appendChild(echoRow);
    if (!cmdline) return;
    hist.push(cmdline);
    hi = hist.length;
    const parts = cmdline.split(/\s+/), cmd = parts[0], args = parts.slice(1);
    const rest = cmdline.slice(cmd.length).trim();
    if (CMDS[cmd]){
      try { CMDS[cmd](args, rest); } catch (e){ err(cmd + ": " + e.message); }
    } else {
      err("bsh: command not found: " + cmd);
      line([["Type ", "t-dim"], ["help", "t-key"], [" for a list of commands.", "t-dim"]]);
    }
  }

  inp.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === "Return"){
      const v = inp.value;
      inp.value = "";
      run(v);
      drawPs1();
      scroll();
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      if (hi > 0){ hi--; inp.value = hist[hi] || ""; setTimeout(() => inp.setSelectionRange(999, 999), 0); }
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      if (hi < hist.length - 1){ hi++; inp.value = hist[hi] || ""; }
      else { hi = hist.length; inp.value = ""; }
    } else if (e.key === "l" && e.ctrlKey){
      e.preventDefault();
      out.innerHTML = "";
    }
  });
  wrap.addEventListener("pointerdown", e => {
    if (!e.target.closest("input") && !getSelection().toString()) setTimeout(() => inp.focus(), 0);
  });

  const motd = node("/etc/motd");
  block(motd ? motd.content : "BOX OS 1.3", "t-dim");
  drawPs1();
  setTimeout(() => inp.focus(), 30);
  return { focusInput: () => inp.focus() };
}

/* ============================================================
   12b. Paint - draws to a canvas and saves a real PNG into Pictures
   ============================================================ */
const PAINT_COLORS = ["#1e1e1e","#ffffff","#c9534b","#e08a3c","#d8bd6a","#8bae5a",
                      "#3aa99f","#4a90d9","#9268b8","#d0699e","#7a5c46","#8a8a8a"];

function paintApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="pt-tb">' +
      '<div class="pt-swatches"></div>' +
      '<span class="pt-sep"></span>' +
      '<div class="seg pt-sizes"></div>' +
      '<button class="tb-btn" data-p="erase" title="Eraser">Eraser</button>' +
      '<span class="ed-sp"></span>' +
      '<button class="tb-btn" data-p="clear">Clear</button>' +
      '<button class="tb-btn accent" data-p="save">Save to Pictures</button>' +
    '</div>' +
    '<div class="pt-stage"><canvas></canvas></div>' +
    '<div class="pt-status"></div>';

  const cv = $("canvas", B), ctx = cv.getContext("2d");
  const stage = $(".pt-stage", B), status = $(".pt-status", B);
  let color = "#1e1e1e", size = 4, erasing = false, drawing = false, last = null, dirty = false;

  function fit(){
    const w = Math.max(200, stage.clientWidth - 24), h = Math.max(160, stage.clientHeight - 24);
    if (cv.width === w && cv.height === h) return;
    const keep = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = w; cv.height = h;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    if (keep) ctx.putImageData(keep, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }
  const swatches = $(".pt-swatches", B);
  PAINT_COLORS.forEach(c => {
    const b = el("button", "pt-sw" + (c === color ? " on" : ""));
    b.style.background = c;
    b.onclick = () => {
      color = c; erasing = false;
      $$(".pt-sw", B).forEach(o => o.classList.toggle("on", o.style.background === b.style.background));
      $('[data-p="erase"]', B).classList.remove("on");
      say();
    };
    swatches.appendChild(b);
  });
  const sizes = $(".pt-sizes", B);
  [2, 4, 9, 18].forEach(n => {
    const b = el("button", n === size ? "on" : null, String(n));
    b.onclick = () => { size = n; $$("button", sizes).forEach(o => o.classList.toggle("on", o === b)); say(); };
    sizes.appendChild(b);
  });
  const eraseBtn = $('[data-p="erase"]', B);
  eraseBtn.onclick = () => { erasing = !erasing; eraseBtn.classList.toggle("on", erasing); say(); };
  $('[data-p="clear"]', B).onclick = async () => {
    if (dirty && !(await osConfirm("Clear canvas", "Throw away this drawing?", "Clear", true))) return;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    dirty = false;
    say();
  };
  $('[data-p="save"]', B).onclick = async () => {
    const name = await osPrompt("Save drawing", "File name", "drawing.png");
    if (!name) return;
    const fname = /\.png$/i.test(name) ? name : name + ".png";
    ensureDir(HOME + "/Pictures");
    const saved = addUnique(HOME + "/Pictures", fname, cv.toDataURL("image/png"), "image", "image/png");
    dirty = false;
    say();
    notify("Drawing saved", "Pictures/" + saved, String.fromCodePoint(0x1F3A8));
    openImage(HOME + "/Pictures/" + saved);
  };

  const at = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  };
  cv.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    drawing = true;
    last = at(e);
    stroke(last, last);
  });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = at(e); stroke(last, p); last = p; });
  const stop = () => { if (drawing) say(); drawing = false; last = null; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  function stroke(a, b){
    ctx.strokeStyle = erasing ? "#ffffff" : color;
    ctx.lineWidth = erasing ? size * 2.5 : size;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    dirty = true;
  }
  function say(){
    status.textContent = (erasing ? "Eraser" : "Brush") + " - " + size + "px - " +
      cv.width + " x " + cv.height + (dirty ? " - unsaved" : "");
  }
  const ro = new ResizeObserver(() => { fit(); say(); });
  ro.observe(stage);
  setTimeout(() => { fit(); say(); }, 0);
  return { onClose(){ ro.disconnect(); return true; } };
}

/* ============================================================
   12c. Minesweeper
   ============================================================ */
const MINE_LEVELS = {
  easy:   { w: 9,  h: 9,  m: 10, label: "Easy" },
  medium: { w: 16, h: 16, m: 40, label: "Medium" },
  hard:   { w: 24, h: 16, m: 70, label: "Hard" }
};

function minesApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="ms-tb">' +
      '<div class="seg ms-levels"></div>' +
      '<span class="ed-sp"></span>' +
      '<div class="ms-stat"><span class="ms-flags">0</span> left</div>' +
      '<button class="tb-btn ms-face">Reset</button>' +
      '<div class="ms-stat"><span class="ms-time">0</span>s</div>' +
    '</div>' +
    '<div class="ms-stage"><div class="ms-grid"></div></div>';

  const grid = $(".ms-grid", B), flagsEl = $(".ms-flags", B), timeEl = $(".ms-time", B);
  let level = "easy", cells = [], W = 0, H = 0, M = 0;
  let started = false, over = false, t0 = 0, timer = 0, revealed = 0;

  const seg = $(".ms-levels", B);
  for (const id in MINE_LEVELS){
    const b = el("button", id === level ? "on" : null, MINE_LEVELS[id].label);
    b.onclick = () => { level = id; $$("button", seg).forEach(o => o.classList.toggle("on", o === b)); reset(); };
    seg.appendChild(b);
  }
  $(".ms-face", B).onclick = reset;

  const idx = (x, y) => y * W + x;
  function neighbours(x, y){
    const out = [];
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++){
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.push(cells[idx(nx, ny)]);
      }
    return out;
  }
  function reset(){
    const L = MINE_LEVELS[level];
    W = L.w; H = L.h; M = L.m;
    started = over = false;
    revealed = 0;
    clearInterval(timer);
    timeEl.textContent = "0";
    flagsEl.textContent = String(M);
    cells = [];
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = "repeat(" + W + ", 22px)";
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++){
        const b = el("button", "ms-cell");
        const c = { x, y, el: b, mine: false, open: false, flag: false, n: 0 };
        b.onclick = () => open(c);
        b.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); flag(c); };
        cells.push(c);
        grid.appendChild(b);
      }
    $(".ms-face", B).textContent = "Reset";
    win.setTitle("Minesweeper");
  }
  function layMines(safe){
    const pool = cells.filter(c => c !== safe && !neighbours(safe.x, safe.y).includes(c));
    for (let i = 0; i < M && pool.length; i++){
      const k = Math.floor(Math.random() * pool.length);
      pool[k].mine = true;
      pool.splice(k, 1);
    }
    for (const c of cells) c.n = neighbours(c.x, c.y).filter(o => o.mine).length;
  }
  function open(c){
    if (over || c.open || c.flag) return;
    if (!started){
      started = true;
      layMines(c);
      t0 = Date.now();
      timer = setInterval(() => { timeEl.textContent = String(Math.floor((Date.now() - t0) / 1000)); }, 500);
    }
    if (c.mine) return boom(c);
    const stack = [c];
    while (stack.length){
      const cur = stack.pop();
      if (cur.open || cur.flag) continue;
      cur.open = true;
      revealed++;
      cur.el.classList.add("open");
      if (cur.n){ cur.el.textContent = String(cur.n); cur.el.dataset.n = String(cur.n); }
      else neighbours(cur.x, cur.y).forEach(o => { if (!o.open && !o.mine) stack.push(o); });
    }
    if (revealed === W * H - M) win_();
  }
  function flag(c){
    if (over || c.open) return;
    c.flag = !c.flag;
    c.el.classList.toggle("flag", c.flag);
    c.el.textContent = c.flag ? String.fromCodePoint(0x1F6A9) : "";
    flagsEl.textContent = String(M - cells.filter(o => o.flag).length);
  }
  function boom(c){
    over = true;
    clearInterval(timer);
    c.el.classList.add("boom");
    for (const o of cells){
      if (o.mine){ o.el.classList.add("open", "mine"); o.el.textContent = String.fromCodePoint(0x1F4A3); }
      else if (o.flag && !o.mine) o.el.textContent = String.fromCodePoint(0x274C);
    }
    $(".ms-face", B).textContent = "Try again";
    win.setTitle("Minesweeper - boom");
    notify("Minesweeper", "You hit a mine on " + MINE_LEVELS[level].label.toLowerCase() + ".", String.fromCodePoint(0x1F4A3));
  }
  function win_(){
    over = true;
    clearInterval(timer);
    const secs = Math.floor((Date.now() - t0) / 1000);
    for (const o of cells) if (o.mine && !o.flag){ o.el.classList.add("flag"); o.el.textContent = String.fromCodePoint(0x1F6A9); }
    $(".ms-face", B).textContent = "Play again";
    win.setTitle("Minesweeper - cleared");
    notify("Minesweeper cleared", MINE_LEVELS[level].label + " in " + secs + " seconds.", String.fromCodePoint(0x1F3C6));
  }
  reset();
  return { onClose(){ clearInterval(timer); return true; } };
}

/* ============================================================
   12d. Calculator
   ============================================================ */
function calcApp(win){
  const B = win.body;
  const keys = [["C","+/-","%","/"],["7","8","9","x"],["4","5","6","-"],["1","2","3","+"],["0",".","="]];
  B.innerHTML = '<div class="ca-out"><div class="ca-sub"></div><div class="ca-main">0</div></div><div class="ca-pad"></div>';
  const out = $(".ca-main", B), sub = $(".ca-sub", B), pad = $(".ca-pad", B);

  let acc = null, op = null, cur = "0", fresh = true;
  const show = () => {
    const n = parseFloat(cur);
    out.textContent = (cur.length > 12 && Number.isFinite(n)) ? String(+n.toPrecision(9)) : cur;
    sub.textContent = acc === null ? "" : acc + " " + (op || "");
  };
  function digit(d){
    if (fresh){ cur = d === "." ? "0." : d; fresh = false; }
    else if (d === "." && cur.includes(".")) return;
    else cur = cur === "0" && d !== "." ? d : cur + d;
    show();
  }
  const compute = (a, b, o) =>
    o === "+" ? a + b : o === "-" ? a - b : o === "x" ? a * b : o === "/" ? (b === 0 ? NaN : a / b) : b;
  function setOp(o){
    const v = parseFloat(cur);
    if (acc !== null && op && !fresh) acc = compute(acc, v, op);
    else acc = v;
    op = o;
    fresh = true;
    cur = String(acc);
    show();
    cur = String(acc);
  }
  function equals(){
    if (acc === null || !op) return;
    const r = compute(acc, parseFloat(cur), op);
    cur = Number.isFinite(r) ? String(+r.toFixed(10)) : "Cannot divide by zero";
    acc = null; op = null; fresh = true;
    show();
  }
  function press(k){
    if (/^[0-9.]$/.test(k)) return digit(k);
    if (k === "C"){ acc = null; op = null; cur = "0"; fresh = true; return show(); }
    if (k === "+/-"){ cur = String(parseFloat(cur) * -1); return show(); }
    if (k === "%"){ cur = String(parseFloat(cur) / 100); return show(); }
    if (k === "=") return equals();
    return setOp(k);
  }
  keys.forEach(rowKeys => {
    const row = el("div", "ca-row");
    rowKeys.forEach(k => {
      const b = el("button", "ca-key" + (/[+\-x\/=]/.test(k) && k.length === 1 ? " op" : "") + (k === "0" ? " wide" : ""), k);
      b.onclick = () => press(k);
      row.appendChild(b);
    });
    pad.appendChild(row);
  });
  B.tabIndex = 0;
  B.addEventListener("keydown", e => {
    const map = { Enter: "=", "*": "x", Escape: "C", Backspace: "C" };
    const k = map[e.key] || e.key;
    if (/^([0-9.]|[+\-x/=%]|C)$/.test(k)){ e.preventDefault(); press(k); }
  });
  setTimeout(() => B.focus(), 0);
  show();
  return {};
}

/* ============================================================
   12e. Trash - real, with restore
   ============================================================ */
function trashApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="fm-tb">' +
      '<span class="tr-count"></span><span class="ed-sp"></span>' +
      '<button class="tb-btn" data-t="restore" disabled>Put back</button>' +
      '<button class="tb-btn" data-t="del" disabled>Delete forever</button>' +
      '<button class="tb-btn" data-t="empty">Empty Trash</button>' +
    '</div>' +
    '<div class="fm-list"><table class="fm-tab">' +
      '<thead><tr><th>Name</th><th class="col-type">Was in</th><th class="col-size">Deleted</th></tr></thead><tbody></tbody>' +
    '</table></div>' +
    '<div class="fm-status"></div>';
  const tbody = $("tbody", B), status = $(".fm-status", B);
  let sel = null;

  function draw(){
    tbody.innerHTML = "";
    for (const t of Trash.items){
      const tr = el("tr");
      tr.dataset.id = t.id;
      const td = el("td", "col-name");
      td.append(el("span", "fi", nodeIcon(t.name, t.node)), document.createTextNode(t.name));
      tr.append(td, el("td", "col-type", tilde(t.from)), el("td", "col-size", fmtAgo(t.when)));
      if (t.id === sel) tr.classList.add("sel");
      tr.onclick = () => { sel = t.id; draw(); };
      tr.ondblclick = () => putBack(t.id);
      tbody.appendChild(tr);
    }
    if (!Trash.items.length){
      const tr = el("tr"), td = el("td", "fm-empty", "Trash is empty");
      td.colSpan = 3;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    $(".tr-count", B).textContent = Trash.items.length + (Trash.items.length === 1 ? " item" : " items");
    $('[data-t="restore"]', B).disabled = !sel;
    $('[data-t="del"]', B).disabled = !sel;
    $('[data-t="empty"]', B).disabled = !Trash.items.length;
    status.textContent = Trash.items.length
      ? Trash.items.length + " item(s) \u00b7 " + fmtBytes(trashBytes()) + " \u00b7 double-click to put something back"
      : "Nothing here. Deleted files land in Trash until you empty it.";
    win.setTitle("Trash" + (Trash.items.length ? " (" + Trash.items.length + ")" : ""));
  }
  function putBack(id){
    const to = restoreTrash(id);
    sel = null;
    draw();
    refreshFilesViews();
    if (to) notify("Put back", tilde(to), "\u21A9\uFE0F");
  }
  $('[data-t="restore"]', B).onclick = () => sel && putBack(sel);
  $('[data-t="del"]', B).onclick = async () => {
    const t = Trash.items.find(x => x.id === sel);
    if (!t) return;
    if (!(await osConfirm("Delete forever", "Permanently delete " + t.name + "?", "Delete forever", true))) return;
    Trash.items = Trash.items.filter(x => x.id !== sel);
    sel = null;
    saveTrash();
    draw();
  };
  $('[data-t="empty"]', B).onclick = async () => {
    if (!Trash.items.length) return;
    if (!(await osConfirm("Empty Trash", "Permanently delete all " + Trash.items.length + " item(s)?\n\nThis cannot be undone.", "Empty Trash", true))) return;
    emptyTrash();
    sel = null;
    draw();
  };
  draw();
  return { refresh: draw };
}

/* ============================================================
   12f. Music - plays audio straight out of the filesystem
   ============================================================ */
function openAudio(path){
  for (const w of windows.values())
    if (w.appId === "music"){ focusWin(w); w.api.play(path); return w; }
  return launch("music", path);
}
function musicApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="mu-now">' +
      '<div class="mu-art">\uD83C\uDFB5</div>' +
      '<div class="mu-meta"><div class="mu-title">Nothing playing</div><div class="mu-sub">Pick a track below</div></div>' +
    '</div>' +
    '<div class="mu-controls">' +
      '<button class="tb-btn" data-m="prev" title="Previous">&#9198;</button>' +
      '<button class="tb-btn accent" data-m="play" title="Play or pause">&#9654;</button>' +
      '<button class="tb-btn" data-m="next" title="Next">&#9197;</button>' +
      '<input class="mu-seek" type="range" min="0" max="1000" value="0">' +
      '<span class="mu-time">0:00</span>' +
      '<input class="mu-vol" type="range" min="0" max="100" value="90" title="Volume">' +
    '</div>' +
    '<div class="mu-list"></div>';

  const audio = new Audio();
  const listEl = $(".mu-list", B), seek = $(".mu-seek", B), timeEl = $(".mu-time", B);
  const playBtn = $('[data-m="play"]', B);
  let tracks = [], at = -1, seeking = false;

  const fmtTime = s => {
    if (!Number.isFinite(s)) return "0:00";
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  };
  function scan(){
    tracks = [];
    walkFS((p, n, name) => { if (n.type === "file" && isAudio(name)) tracks.push(p); });
    drawList();
  }
  function drawList(){
    listEl.innerHTML = "";
    if (!tracks.length){
      listEl.appendChild(el("div", "wb-none",
        "No audio here yet. Import a music file in Files - or drag one straight onto the Files window - and it will appear."));
      return;
    }
    tracks.forEach((p, i) => {
      const b = el("button", "mu-row" + (i === at ? " on" : ""));
      b.append(el("span", "g", (i === at && !audio.paused) ? "\u25B6" : "\uD83C\uDFB5"),
               el("span", "mu-n", baseName(p)),
               el("span", "mu-d", tilde(dirName(p))));
      b.onclick = () => playIndex(i);
      listEl.appendChild(b);
    });
  }
  function playIndex(i){
    if (i < 0 || i >= tracks.length) return;
    at = i;
    const p = tracks[i], n = node(p);
    if (!n) return scan();
    audio.src = n.content;
    audio.play().catch(() => {});
    $(".mu-title", B).textContent = baseName(p);
    $(".mu-sub", B).textContent = tilde(dirName(p));
    win.setTitle(baseName(p));
    drawList();
  }
  function play(path){
    scan();
    const i = tracks.indexOf(path);
    if (i >= 0) playIndex(i);
  }
  playBtn.onclick = () => {
    if (!tracks.length) return;
    if (at < 0) return playIndex(0);
    audio.paused ? audio.play().catch(() => {}) : audio.pause();
  };
  $('[data-m="next"]', B).onclick = () => { if (tracks.length) playIndex((at + 1) % tracks.length); };
  $('[data-m="prev"]', B).onclick = () => { if (tracks.length) playIndex((at - 1 + tracks.length) % tracks.length); };
  audio.onplay = audio.onpause = () => {
    playBtn.innerHTML = audio.paused ? "&#9654;" : "&#10074;&#10074;";
    drawList();
  };
  audio.onended = () => { if (at + 1 < tracks.length) playIndex(at + 1); };
  audio.ontimeupdate = () => {
    if (seeking || !audio.duration) return;
    seek.value = String(Math.round(audio.currentTime / audio.duration * 1000));
    timeEl.textContent = fmtTime(audio.currentTime) + " / " + fmtTime(audio.duration);
  };
  audio.onerror = () => { $(".mu-sub", B).textContent = "That file could not be played."; };
  seek.oninput = () => { seeking = true; };
  seek.onchange = () => {
    if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
    seeking = false;
  };
  const vol = $(".mu-vol", B);
  audio.volume = 0.9;
  vol.oninput = () => { audio.volume = vol.value / 100; };

  scan();
  if (startPath) play(startPath);
  return { play, refresh: scan, onClose(){ audio.pause(); audio.src = ""; return true; } };
}

function applyTheme(){
  document.documentElement.dataset.theme = State.theme;
  $("#traytheme").textContent = State.theme === "dark" ? "\u2600\uFE0F" : "\uD83C\uDF19";
  $("#traytheme").title = State.theme === "dark" ? "Switch to light" : "Switch to dark";
}
function applyAccent(){
  document.documentElement.style.setProperty("--accent", State.accent);
  document.documentElement.style.setProperty("--sel", State.accent);
  saveSettings();
}
function applyWallpaper(){
  const w = $("#wallpaper");
  document.documentElement.style.setProperty("--wall", State.wallColor);
  if (State.customWall){
    w.style.backgroundImage = "url(" + State.customWall + ")";
    w.style.backgroundRepeat = State.wallFit === "tile" ? "repeat" : "no-repeat";
    w.style.backgroundSize = State.wallFit === "tile" ? "auto" : State.wallFit;
  } else {
    w.style.backgroundImage = "";
  }
  saveSettings();
}
function applyChrome(){
  document.body.classList.toggle("anim", State.animations);
  document.body.classList.toggle("panel-top", State.panelPos === "top");
  document.body.classList.remove("icons-small", "icons-large");
  if (State.iconSize !== "medium") document.body.classList.add("icons-" + State.iconSize);
  saveSettings();
}
/* the theme change: no sweep, no overlay - every surface just eases from one
   palette to the other in place. The tray icon still spins. */
function setTheme(next, originEl){
  if (next === State.theme) return;
  if (originEl){
    originEl.classList.remove("spin");
    void originEl.offsetWidth;          /* restart the animation */
    originEl.classList.add("spin");
    setTimeout(() => originEl.classList.remove("spin"), 620);
  }
  const root = document.documentElement;
  if (State.animations){
    root.classList.add("theming");
    setTimeout(() => root.classList.remove("theming"), 340);
  }
  State.theme = next;
  applyTheme();
  saveSettings();
  refreshSettings();
}
function toggleTheme(originEl){ setTheme(State.theme === "dark" ? "light" : "dark", originEl || $("#traytheme")); }
function restartMessage(){
  return Store.on
    ? "Reload BOX OS?\n\nYour saved files, settings and shortcuts will still be here."
    : "Reload BOX OS?\n\nSaving is off, so everything in the filesystem will be lost.";
}
function refreshSettings(){
  for (const w of windows.values())
    if (w.appId === "settings" && w.api && w.api.refresh) w.api.refresh();
}

    tick();
  }

  let dds = [];
  function tick(){
    if (!dds.length || !B.isConnected) return;
    dds[1].textContent = fmtDuration(Date.now() - BOOT_TIME);
    dds[2].textContent = windows.size + " open";
    dds[3].textContent = countFiles() + " files";
    dds[4].textContent = State.shortcuts.length + " custom, " +
      BUILTIN_ICONS.filter(b => State.builtins[b.id]).length + " default";
    dds[5].textContent = innerWidth + " x " + innerHeight;
    dds[6].textContent = !Store.available ? "Unavailable in this browser"
      : Store.on ? "Saving to this browser"
      : "Volatile - everything resets on reload";
  }
  const timer = setInterval(tick, 1000);

  function pickWallpaper(){
    const inp = $("#wallpicker");
    inp.value = "";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      inp.onchange = null;
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        State.customWall = r.result;
        applyWallpaper();
        render();
        notify("Wallpaper changed", f.name, "\uD83D\uDDBC\uFE0F");
      };
      r.readAsDataURL(f);
    };
    inp.click();
  }

  render();
  return { refresh: render, onClose(){ clearInterval(timer); return true; } };
}

/* ============================================================
   15. shell: menu, panel, clock, notification centre
   ============================================================ */
const menuEl = $("#menu"), menuBtn = $("#menubtn"), searchEl = $("#msearch"), appsEl = $("#mapps");
const npEl = $("#npanel"), clockBtn = $("#clockbtn");
let menuOpen = false, npOpen = false;

function drawMenu(filter){
  appsEl.innerHTML = "";
  const q = (filter || "").toLowerCase();
  const ids = Object.keys(APPS).filter(id => !APPS[id].hidden &&
    (!q || APPS[id].name.toLowerCase().includes(q) || APPS[id].desc.toLowerCase().includes(q) || id.includes(q)));
  if (!ids.length){
    appsEl.appendChild(el("div", "fm-empty", "No applications match"));
    return;
  }
  ids.forEach((id, i) => {
    const a = APPS[id];
    const b = el("button", "mapp" + (i === 0 && q ? " hl" : ""));
    const txt = el("span");
    txt.append(el("div", "n", a.name), el("div", "d", a.desc));
    b.append(el("span", "g", a.icon), txt);
    b.onclick = () => { closeMenu(); launch(id); };
    b.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      showCtx(e.clientX, e.clientY, [
        { icon: a.icon, label: "Open " + a.name, run: () => { closeMenu(); launch(id); } },
        { icon: "\uD83D\uDCCC", label: "Add to Desktop", run: () => {
            closeMenu();
            if (State.shortcuts.some(s => s.kind === "app" && s.target === id))
              return notify("Already there", a.name + " is already on the desktop.", "\u2139\uFE0F");
            addShortcut({ kind: "app", target: id, icon: a.icon, label: a.name });
          } }
      ]);
    };
    appsEl.appendChild(b);
  });
}
function openMenu(){
  closeNp();
  menuOpen = true;
  menuEl.classList.remove("hidden");
  menuBtn.classList.add("on");
  searchEl.value = "";
  drawMenu("");
  setTimeout(() => searchEl.focus(), 0);
}
function closeMenu(){
  menuOpen = false;
  menuEl.classList.add("hidden");
  menuBtn.classList.remove("on");
}
function openNp(){
  closeMenu();
  npOpen = true;
  npEl.classList.remove("hidden");
  clockBtn.classList.add("on");
  clockBtn.classList.remove("unread");
  drawCalendar();
  drawNotifications();
  npTick();
}
function closeNp(){
  npOpen = false;
  npEl.classList.add("hidden");
  clockBtn.classList.remove("on");
}
function npTick(){
  if (!npOpen) return;
  const d = new Date();
  $("#np-time").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: !State.clock24 });
  $("#np-date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}
menuBtn.onclick = e => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); };
clockBtn.onclick = e => { e.stopPropagation(); npOpen ? closeNp() : openNp(); };
menuEl.addEventListener("pointerdown", e => e.stopPropagation());
npEl.addEventListener("pointerdown", e => e.stopPropagation());
$("#np-clear").onclick = () => { State.notifications = []; drawNotifications(); };
searchEl.addEventListener("input", () => drawMenu(searchEl.value));
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === "Return"){ const f = $(".mapp", appsEl); if (f) f.click(); }
  else if (e.key === "Escape") closeMenu();
});
$("#mset").onclick     = () => { closeMenu(); launch("settings"); };
$("#mterm").onclick    = () => { closeMenu(); launch("terminal"); };
$("#mrestart").onclick = async () => {
  closeMenu();
  if (await osConfirm("Restart", restartMessage(), "Restart", !Store.on)) location.reload();
};

document.addEventListener("pointerdown", e => {
  if (menuOpen && !e.target.closest("#menu") && !e.target.closest("#menubtn")) closeMenu();
  if (npOpen && !e.target.closest("#npanel") && !e.target.closest("#clockbtn")) closeNp();
  if (!e.target.closest("#ctx")) hideCtx();
  if (!e.target.closest(".dicon")) $$(".dicon").forEach(d => d.classList.remove("sel"));
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ hideCtx(); if (menuOpen) closeMenu(); if (npOpen) closeNp(); }

  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "") || e.target.isContentEditable;

  /* Ctrl+Alt+... : tile, launch, show desktop. Chosen over the Super key
     because Windows swallows that one before the page ever sees it. */
  if (e.ctrlKey && e.altKey && !e.shiftKey){
    const w = activeWin;
    const zone = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "max", ArrowDown: "bottom" }[e.key];
    if (zone && w){ e.preventDefault(); return applySnap(w, zone); }
    const k = (e.key || "").toLowerCase();
    if (k === "t"){ e.preventDefault(); return launch("terminal"); }
    if (k === "f"){ e.preventDefault(); return launch("files"); }
    if (k === "b"){ e.preventDefault(); return launch("browser"); }
    if (k === "d"){ e.preventDefault(); return $("#traydesk").click(); }
  }
  /* Alt+Tab cycles the open windows */
  if (e.altKey && e.key === "Tab"){
    e.preventDefault();
    const list = Array.from(windows.values()).filter(o => !o.min);
    if (list.length < 2) return;
    const i = list.indexOf(activeWin);
    focusWin(list[(i + (e.shiftKey ? -1 : 1) + list.length) % list.length]);
    return;
  }
  /* a bare Super press opens the menu, the way Mint does */
  if (e.key === "Meta" && !typing && !menuOpen){ e.preventDefault(); openMenu(); }
});
addEventListener("contextmenu", e => {
  if (e.target.closest(".win") || e.target.closest("#panel") ||
      e.target.closest("#menu") || e.target.closest("#npanel") || e.target.closest(".dicon")) return;
  e.preventDefault();
  showCtx(e.clientX, e.clientY, [
    { icon: "\uD83C\uDF10", label: "Open Browser",  run: () => launch("browser") },
    { icon: "\u2328\uFE0F", label: "Open Terminal", run: () => launch("terminal") },
    { icon: "\uD83D\uDCC1", label: "Open Files",    run: () => launch("files") },
    "-",
    { icon: "\uD83D\uDCCC", label: "New shortcut\u2026",   run: newShortcutDialog },
    { icon: "\uD83D\uDDBC\uFE0F", label: "Change wallpaper\u2026", run: () => launch("settings") },
    { icon: "\uD83C\uDF19", label: "Toggle theme",   run: () => toggleTheme($("#traytheme")) }
  ]);
});

$("#traytheme").onclick = e => { e.stopPropagation(); toggleTheme(e.currentTarget); };
$("#traydesk").onclick = () => {
  const anyVisible = Array.from(windows.values()).some(w => !w.min);
  for (const w of windows.values()) anyVisible ? minimizeWin(w) : restoreWin(w);
};

function clockTick(){
  const d = new Date();
  $("#clk-t").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: !State.clock24 });
  $("#clk-d").textContent = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
  clockBtn.title = d.toLocaleString() + " \u2014 click for notifications";
  npTick();
}

/* ============================================================
   16. boot
   ============================================================ */
(function boot(){
  /* a restored disk wins; otherwise lay down the demo files, once */
  const restored = loadState();
  if (!restored) seedDisk();
  applyTheme(); applyAccent(); applyWallpaper(); applyChrome();
  drawDesktop(); drawNotifications(); clockTick();
  setInterval(clockTick, 1000);

  const b = $("#boot"), bar = $("#bootbar");
  requestAnimationFrame(() => { bar.style.width = "100%"; });
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(t);
    b.style.opacity = "0";
    setTimeout(() => b.remove(), 500);
    BOOT_TIME = Date.now();
    /* wait until the viewport actually has a size (embedded/hidden frames) */
    let fired = false, tries = 0;
    const open = () => {
      if (fired) return;
      fired = true;
      launch("files");
      setTimeout(() => notify(restored ? "Welcome back" : "Welcome to BOX OS",
        restored
          ? "Your files and settings were restored from this browser."
          : "Right-click the desktop for a menu. Turn on saving in Settings to keep your files.",
        "\uD83D\uDCE6"), 700);
    };
    const poll = setInterval(() => {
      if ($("#windows").clientWidth > 200 || ++tries > 50){ clearInterval(poll); open(); }
    }, 60);
    if ($("#windows").clientWidth > 200){ clearInterval(poll); open(); }
  };
  const t = setTimeout(finish, 1600);
  b.addEventListener("click", finish);
})();
</script>
