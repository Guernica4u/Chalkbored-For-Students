/* ============================================================
   6. window manager
   ============================================================ */
const windows = new Map();
let winSeq = 0, zTop = 10, cascade = 0, activeWin = null;

/* --- wobbly windows: a spring that skews the frame while it is dragged --- */
function wobbleStart(w){
  if (!State.wobbly || w.max) return;
  w.wob = { sx: 0, sy: 0, vx: 0, vy: 0, tx: 0, ty: 0, held: true, raf: 0 };
  w.el.style.transformOrigin = "50% 0%";
  const step = () => {
    const o = w.wob;
    if (!o) return;
    const k = 0.22, damp = 0.76;
    o.vx = (o.vx + (o.tx - o.sx) * k) * damp;
    o.vy = (o.vy + (o.ty - o.sy) * k) * damp;
    o.sx += o.vx;
    o.sy += o.vy;
    const settled = Math.abs(o.sx) < 0.03 && Math.abs(o.vx) < 0.03 &&
                    Math.abs(o.sy) < 0.03 && Math.abs(o.vy) < 0.03;
    if (settled && !o.held){
      w.el.style.transform = "";
      w.wob = null;
      return;
    }
    w.el.style.transform = "skew(" + o.sx.toFixed(2) + "deg," + o.sy.toFixed(2) + "deg)";
    o.raf = requestAnimationFrame(step);
  };
  w.wob.raf = requestAnimationFrame(step);
}
function wobblePull(w, vx, vy){
  if (!w.wob) return;
  w.wob.tx = clamp(-vx * 0.42, -15, 15);
  w.wob.ty = clamp(-vy * 0.14, -6, 6);
}
function wobbleRelease(w){
  if (!w.wob) return;
  w.wob.held = false;
  w.wob.tx = 0;
  w.wob.ty = 0;
}

function dragify(handle, onStart, onMove, onEnd){
  handle.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    if (e.target.closest("button")) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let lx = sx, ly = sy, lt = performance.now();
    const ctx = onStart(e) || {};
    if (ctx.abort) return;
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add("dragging");
    const move = ev => {
      const now = performance.now();
      const dt = Math.max(1, now - lt);
      const vx = (ev.clientX - lx) * 16 / dt, vy = (ev.clientY - ly) * 16 / dt;
      lx = ev.clientX; ly = ev.clientY; lt = now;
      onMove(ev.clientX - sx, ev.clientY - sy, ctx, vx, vy, ev);
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      document.body.classList.remove("dragging");
      if (onEnd) onEnd(ctx);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
}

function createWindow(opts){
  const area = $("#windows");
  const id = "w" + (++winSeq);
  /* guard against being called before the viewport has been laid out */
  const aw = Math.max(area.clientWidth, 480), ah = Math.max(area.clientHeight, 340);
  const W = clamp(opts.w || 620, 340, Math.max(340, aw - 20));
  const H = clamp(opts.h || 420, 190, Math.max(190, ah - 20));
  const off = (cascade++ % 7) * 26;
  const x = clamp(Math.round((aw - W) / 2) - 70 + off, 8, Math.max(8, aw - W - 8));
  const y = clamp(Math.round((ah - H) / 2) - 60 + off, 8, Math.max(8, ah - H - 8));

  const root = el("div", "win" + (opts.cls ? " " + opts.cls : ""));
  root.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + W + "px;height:" + H + "px;z-index:" + (++zTop);
  if (State.animations){
    root.classList.add("opening");
    setTimeout(() => root.classList.remove("opening"), 220);
  }

  const bar = el("div", "win-title");
  const tt = el("span", "t", opts.title || "Window");
  const bMin = el("button", "wb", "\u2212"); bMin.title = "Minimize";
  const bMax = el("button", "wb", "\u2610"); bMax.title = "Maximize";
  const bCls = el("button", "wb close", "\u2715"); bCls.title = "Close";
  bar.append(el("span", "g", opts.icon || "\u25AB\uFE0F"), tt, bMin, bMax, bCls);

  const body = el("div", "win-body");
  const rzR = el("div", "rz r"), rzB = el("div", "rz b"), rzC = el("div", "rz c");
  root.append(bar, body, rzR, rzB, rzC);
  area.appendChild(root);

  const task = el("button", "task");
  task.append(el("span", "g", opts.icon || "\u25AB\uFE0F"), el("span", "t", opts.title || "Window"));
  task.title = opts.title || "Window";
  $("#tasks").appendChild(task);

  const w = {
    id, el: root, body, task, appId: opts.appId, api: {},
    min: false, max: false, prev: null, wob: null,
    setTitle(t){ tt.textContent = t; task.querySelector(".t").textContent = t; task.title = t; },
    close(){ closeWin(w); }
  };
  windows.set(id, w);

  root.addEventListener("pointerdown", () => focusWin(w), true);
  bCls.onclick = () => closeWin(w);
  bMin.onclick = () => minimizeWin(w);
  bMax.onclick = () => toggleMax(w);
  bar.addEventListener("dblclick", e => { if (!e.target.closest("button")) toggleMax(w); });

  dragify(bar,
    () => {
      if (w.max) return { abort: true };
      w.snapZone = null;
      wobbleStart(w);
      return { x: root.offsetLeft, y: root.offsetTop };
    },
    (dx, dy, c, vx, vy, ev) => {
      const maxX = area.clientWidth - 60, maxY = area.clientHeight - 34;
      root.style.left = clamp(c.x + dx, -(root.offsetWidth - 60), maxX) + "px";
      root.style.top  = clamp(c.y + dy, 0, maxY) + "px";
      wobblePull(w, vx, vy);
      c.snap = snapZoneFor(ev);
      showSnapGhost(c.snap);
    },
    c => { wobbleRelease(w); hideSnapGhost(); if (c.snap) applySnap(w, c.snap); });

  const startSize = () => (w.max ? { abort: true } : { w: root.offsetWidth, h: root.offsetHeight });
  dragify(rzR, startSize, (dx, _dy, c) => { root.style.width  = Math.max(340, c.w + dx) + "px"; });
  dragify(rzB, startSize, (_dx, dy, c) => { root.style.height = Math.max(190, c.h + dy) + "px"; });
  dragify(rzC, startSize, (dx, dy, c) => {
    root.style.width  = Math.max(340, c.w + dx) + "px";
    root.style.height = Math.max(190, c.h + dy) + "px";
  });

  task.onclick = () => {
    if (w.min) { restoreWin(w); focusWin(w); }
    else if (activeWin === w) minimizeWin(w);
    else focusWin(w);
  };
  return w;
}

/* ---- edge snapping: shove a window at a screen edge to tile it ---- */
function snapZoneFor(ev){
  const r = $("#windows").getBoundingClientRect();
  const edge = 14;
  if (ev.clientY <= r.top + edge) return "max";
  if (ev.clientX <= r.left + edge) return "left";
  if (ev.clientX >= r.right - edge) return "right";
  if (ev.clientY >= r.bottom - edge) return "bottom";
  return null;
}
function snapRect(zone){
  const a = $("#windows");
  const W = a.clientWidth, H = a.clientHeight;
  if (zone === "max")    return { left: 0, top: 0, width: W, height: H };
  if (zone === "left")   return { left: 0, top: 0, width: Math.round(W / 2), height: H };
  if (zone === "right")  return { left: Math.round(W / 2), top: 0, width: W - Math.round(W / 2), height: H };
  if (zone === "bottom") return { left: 0, top: Math.round(H / 2), width: W, height: H - Math.round(H / 2) };
  return null;
}
function showSnapGhost(zone){
  const g = $("#snapghost");
  const r = snapRect(zone);
  if (!r){ g.classList.remove("on"); return; }
  g.style.left = r.left + "px";
  g.style.top = r.top + "px";
  g.style.width = r.width + "px";
  g.style.height = r.height + "px";
  g.classList.add("on");
}
function hideSnapGhost(){ $("#snapghost").classList.remove("on"); }
function applySnap(w, zone, silent){
  const r = snapRect(zone);
  if (!r) return;
  w.snapZone = zone;
  if (w.max){ w.max = false; w.el.classList.remove("max"); }
  if (!w.prev) w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
  if (State.animations && !silent) w.el.style.transition = "left .13s ease, top .13s ease, width .13s ease, height .13s ease";
  w.el.style.left = r.left + "px";
  w.el.style.top = r.top + "px";
  w.el.style.width = r.width + "px";
  w.el.style.height = r.height + "px";
  setTimeout(() => { w.el.style.transition = ""; }, 160);
}
function focusWin(w){
  if (!w || !windows.has(w.id)) return;
  if (w.min) restoreWin(w);
  for (const o of windows.values()){ o.el.classList.remove("active"); o.task.classList.remove("active"); }
  w.el.style.zIndex = ++zTop;
  w.el.classList.add("active");
  w.task.classList.add("active");
  activeWin = w;
}
/* the genie: fly the frame down into its taskbar button, then hide it */
function minimizeWin(w){
  if (w.min) return;
  w.min = true;
  w.el.classList.remove("active");
  w.task.classList.add("min");
  w.task.classList.remove("active");
  if (activeWin === w) activeWin = null;
  const finish = () => {
    w.el.style.display = "none";
    w.el.style.transition = "";
    w.el.style.transform = "";
    w.el.style.opacity = "";
    focusTopmost();
  };
  if (!State.animations) return finish();
  const r = w.el.getBoundingClientRect(), t = w.task.getBoundingClientRect();
  if (!r.width || !t.width) return finish();
  const sx = Math.max(0.06, t.width / r.width), sy = Math.max(0.04, t.height / r.height);
  const dx = t.left + t.width / 2 - (r.left + r.width / 2);
  const dy = t.top + t.height / 2 - (r.top + r.height / 2);
  w.el.style.transformOrigin = "50% 50%";
  w.el.style.transition = "transform .21s cubic-bezier(.4,0,.7,.4), opacity .21s ease-in";
  requestAnimationFrame(() => {
    w.el.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
    w.el.style.opacity = "0";
  });
  setTimeout(finish, 220);
}
function restoreWin(w){
  if (!w.min) return;
  w.min = false;
  w.task.classList.remove("min");
  w.el.style.display = "";
  if (!State.animations) return;
  const r = w.el.getBoundingClientRect(), t = w.task.getBoundingClientRect();
  if (!r.width || !t.width) return;
  const sx = Math.max(0.06, t.width / r.width), sy = Math.max(0.04, t.height / r.height);
  const dx = t.left + t.width / 2 - (r.left + r.width / 2);
  const dy = t.top + t.height / 2 - (r.top + r.height / 2);
  w.el.style.transition = "none";
  w.el.style.transformOrigin = "50% 50%";
  w.el.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
  w.el.style.opacity = "0";
  requestAnimationFrame(() => {
    w.el.style.transition = "transform .21s cubic-bezier(.3,.6,.4,1), opacity .18s ease-out";
    w.el.style.transform = "";
    w.el.style.opacity = "1";
    setTimeout(() => { w.el.style.transition = ""; w.el.style.opacity = ""; }, 230);
  });
}
function toggleMax(w){
  const area = $("#windows");
  if (w.max){
    w.max = false;
    w.el.classList.remove("max");
    Object.assign(w.el.style, w.prev);
  } else {
    w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
    w.max = true;
    w.el.classList.add("max");
    Object.assign(w.el.style, { left: "0px", top: "0px", width: area.clientWidth + "px", height: area.clientHeight + "px" });
  }
}
function closeWin(w){
  if (w.api && typeof w.api.onClose === "function" && w.api.onClose() === false) return;
  const done = () => {
    w.el.remove();
    w.task.remove();
    windows.delete(w.id);
    if (activeWin === w) activeWin = null;
    focusTopmost();
  };
  if (State.animations && !w.min){
    w.el.classList.add("closing");
    setTimeout(done, 150);
  } else done();
}
function focusTopmost(){
  let best = null;
  for (const o of windows.values())
    if (!o.min && (!best || +o.el.style.zIndex > +best.el.style.zIndex)) best = o;
  if (best) focusWin(best);
}
addEventListener("resize", () => {
  const area = $("#windows");
  for (const w of windows.values()){
    if (w.max){
      w.el.style.width  = area.clientWidth + "px";
      w.el.style.height = area.clientHeight + "px";
    } else if (w.snapZone){
      applySnap(w, w.snapZone, true);
    } else {
      w.el.style.left = clamp(w.el.offsetLeft, -(w.el.offsetWidth - 60), area.clientWidth - 60) + "px";
      w.el.style.top  = clamp(w.el.offsetTop, 0, area.clientHeight - 34) + "px";
    }
  }
});

/* ============================================================
   7. app registry + routing
   ============================================================ */
const APPS = {
  files:    { name: "Files",     desc: "Browse and edit your files",   icon: "\uD83D\uDCC1", w: 880, h: 560, cls: "app-files", run: filesApp },
  browser:  { name: "Browser",   desc: "The web and local pages",      icon: "\uD83C\uDF10", w: 900, h: 600, cls: "app-web",   run: browserApp },
  terminal: { name: "Terminal",  desc: "A small shell",                icon: "\u2328\uFE0F", w: 700, h: 430, cls: "app-term",  run: terminalApp },
  music:    { name: "Music",      desc: "Play audio from your files",     icon: "\uD83C\uDFB5", w: 620, h: 520, cls: "app-music", run: musicApp },
  trash:    { name: "Trash",      desc: "Put deleted files back",         icon: "\uD83D\uDDD1\uFE0F", w: 660, h: 440, cls: "app-trash", run: trashApp, single: true },
  paint:    { name: "Paint",      desc: "Draw something and keep it",     icon: "\uD83C\uDFA8", w: 760, h: 560, cls: "app-paint", run: paintApp },
  mines:    { name: "Minesweeper",desc: "The classic, with three sizes",  icon: "\uD83D\uDCA3", w: 520, h: 480, cls: "app-mines", run: minesApp },
  calc:     { name: "Calculator", desc: "Sums, with keyboard support",    icon: "\uD83E\uDDEE", w: 320, h: 440, cls: "app-calc",  run: calcApp },
  settings: { name: "Settings",  desc: "Appearance, desktop, system",  icon: "\u2699\uFE0F", w: 640, h: 580, cls: "app-set",   run: settingsApp, single: true },
  viewer:   { name: "Image Viewer", desc: "View pictures",             icon: "\uD83D\uDDBC\uFE0F", w: 740, h: 540, cls: "app-view", run: viewerApp, hidden: true }
};

function launch(appId, arg){
  const app = APPS[appId];
  if (!app) return null;
  if (app.single){
    for (const w of windows.values())
      if (w.appId === appId){ focusWin(w); return w; }
  }
  const w = createWindow({ title: app.name, icon: app.icon, w: app.w, h: app.h, appId, cls: app.cls });
  w.api = app.run(w, arg) || {};
  focusWin(w);
  return w;
}
function openInFiles(path){
  let target = null;
  for (const w of windows.values()) if (w.appId === "files") target = w;
  if (target){ focusWin(target); target.api.reveal(path); return target; }
  const w = launch("files");
  w.api.reveal(path);
  return w;
}
function openImage(path){
  const w = createWindow({ title: baseName(path), icon: APPS.viewer.icon, w: APPS.viewer.w, h: APPS.viewer.h, appId: "viewer", cls: "app-view" });
  w.api = viewerApp(w, path);
  focusWin(w);
  return w;
}
function openInBrowser(target){
  let reuse = null;
  for (const w of windows.values()) if (w.appId === "browser") reuse = w;
  if (reuse){ focusWin(reuse); reuse.api.go(target); return reuse; }
  return launch("browser", target);
}
/* one place that decides what opening a thing means */
function openNode(path){
  const n = node(path);
  if (!n) return;
  if (n.type === "dir") openInFiles(path);
  else if (isHtml(baseName(path))) openInBrowser("box:" + path);
  else if (n.kind === "text") openInFiles(path);
  else if (n.kind === "image") openImage(path);
  else osAlert(baseName(path), "No preview available for this file type yet.\n\n" + fmtBytes(nodeSize(n)) + " \u00b7 " + (n.mime || "unknown"));
}

/* ============================================================
   8. desktop shortcuts
   ============================================================ */
function runShortcut(s){
  if (s.kind === "trash") return launch("trash");
  if (s.kind === "app")   return launch(s.target);
  if (s.kind === "url")   return openInBrowser(s.target);
  if (s.kind === "path"){
    if (!node(s.target)) return osAlert("Broken shortcut", "\u201c" + s.label + "\u201d points at " + s.target + ", which no longer exists.");
    return openNode(s.target);
  }
}
function guessShortcut(target, label){
  target = target.trim();
  if (/^https?:\/\//i.test(target))
    return { kind: "url", target, icon: "\uD83C\uDF10", label: label || target.replace(/^https?:\/\//, "").split("/")[0] };
  if (APPS[target.toLowerCase()] && !APPS[target.toLowerCase()].hidden){
    const id = target.toLowerCase();
    return { kind: "app", target: id, icon: APPS[id].icon, label: label || APPS[id].name };
  }
  if (target.startsWith("/") || target.startsWith("~")){
    const p = absPath(target, HOME);
    const n = node(p);
    if (!n) return null;
    return { kind: "path", target: p, icon: nodeIcon(baseName(p), n), label: label || baseName(p) };
  }
  if (/^[\w-]+\.[a-z]{2,}(\/|$)/i.test(target))
    return { kind: "url", target: "https://" + target, icon: "\uD83C\uDF10", label: label || target.split("/")[0] };
  return null;
}
function addShortcut(s){
  if (!s) return null;
  const item = { id: uid("sc"), label: s.label, icon: s.icon, kind: s.kind, target: s.target };
  State.shortcuts.push(item);
  drawDesktop();
  refreshSettings();
  notify("Shortcut added", "\u201c" + item.label + "\u201d is on your desktop.", item.icon);
  return item;
}
function addPathShortcut(path){
  const n = node(path);
  if (!n) return;
  if (State.shortcuts.some(s => s.kind === "path" && s.target === path))
    return notify("Already there", "\u201c" + baseName(path) + "\u201d is already on the desktop.", "\u2139\uFE0F");
  addShortcut({ kind: "path", target: path, icon: nodeIcon(baseName(path), n), label: baseName(path) });
}
function removeShortcut(id){
  State.shortcuts = State.shortcuts.filter(s => s.id !== id);
  drawDesktop();
  refreshSettings();
}
async function newShortcutDialog(){
  const vals = await modal({
    title: "New Shortcut",
    message: "Point it at an app, a file or a web address.",
    fields: [
      { label: "Target", value: "", placeholder: "browser  /  ~/notes.md  /  duckduckgo.com" },
      { label: "Name (optional)", value: "" }
    ],
    ok: "Create"
  });
  if (!vals) return;
  const s = guessShortcut(vals[0], vals[1]);
  if (!s) return osAlert("New Shortcut", "Could not work out what \u201c" + vals[0] + "\u201d is.\n\nTry an app name (files, browser, terminal, settings), a path like ~/notes.md, or a web address.");
  addShortcut(s);
}
/* everything on the desktop, built-ins and user shortcuts together */
function desktopItems(){
  const out = [];
  for (const b of BUILTIN_ICONS) if (State.builtins[b.id]){
    const item = Object.assign({ builtin: true }, b);
    if (b.kind === "trash" && Trash.items.length) item.label = "Trash (" + Trash.items.length + ")";
    out.push(item);
  }
  for (const s of State.shortcuts) out.push(s);
  return out;
}
function drawDesktop(){
  saveShortcuts();
  const box = $("#icons");
  box.innerHTML = "";
  for (const s of desktopItems()){
    const d = el("div", "dicon");
    d.append(el("span", "g", s.icon), el("span", "l", s.label));
    d.title = s.kind === "app" ? APPS[s.target].name : (s.target || s.label);
    d.addEventListener("pointerdown", () => {
      $$(".dicon").forEach(o => o.classList.remove("sel"));
      d.classList.add("sel");
    });
    d.addEventListener("dblclick", () => runShortcut(s));
    d.addEventListener("contextmenu", e => {
      e.preventDefault(); e.stopPropagation();
      $$(".dicon").forEach(o => o.classList.remove("sel"));
      d.classList.add("sel");
      const items = [{ icon: "\uD83D\uDCC2", label: "Open", run: () => runShortcut(s) }, "-"];
      if (s.builtin){
        items.push({ icon: "\uD83D\uDC41\uFE0F", label: "Hide this icon", run: () => {
          State.builtins[s.id] = false; drawDesktop(); refreshSettings();
          notify("Icon hidden", "Turn \u201c" + s.label + "\u201d back on in Settings \u203a Desktop.", s.icon);
        }});
      } else {
        items.push({ icon: "\u270F\uFE0F", label: "Rename\u2026", run: async () => {
          const name = await osPrompt("Rename shortcut", "New name", s.label);
          if (name){ s.label = name; drawDesktop(); refreshSettings(); }
        }});
        items.push({ icon: "\uD83D\uDDD1\uFE0F", label: "Remove from desktop", run: () => removeShortcut(s.id) });
      }
      showCtx(e.clientX, e.clientY, items);
    });
    box.appendChild(d);
  }
}


/* ============================================================
   8b. shared odds and ends: drag state, markdown, backup
   ============================================================ */
let dragging = [];          /* paths currently being dragged between folders */

const AUDIO_EXT = ["mp3","wav","ogg","oga","m4a","aac","flac","opus","weba"];
const isAudio = name => AUDIO_EXT.includes(extOf(name));

/* a deliberately small Markdown renderer - headings, emphasis, code,
   links, lists, quotes and rules. Everything is escaped first. */
/* Strip the actively dangerous bits. The frame is already sandboxed with an
   opaque origin so it cannot reach BOX OS, but README HTML is still someone
   else's markup and there is no reason to run its scripts. */
function sanitizeHtml(html){
  return String(html)
    .replace(/<script\b[\s\S]*?<\/script\s*>/gi, "")
    .replace(/<iframe\b[\s\S]*?<\/iframe\s*>/gi, "")
    .replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, "")
    .replace(/\son[a-z]+\s*=\s*'[^']*'/gi, "")
    .replace(/\son[a-z]+\s*=\s*[^\s>]+/gi, "")
    .replace(/(href|src)\s*=\s*(["'])\s*javascript:[^"']*\2/gi, '$1="#"');
}
function markdownToHtml(src, allowHtml){
  /* GitHub READMEs freely mix raw HTML into Markdown, so callers that trust
     the source can let those blocks through instead of showing them as text */
  const esc = t => allowHtml ? String(t) : String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const blocks = [];
  let text = String(src).replace(/\r\n/g, "\n");
  text = text.replace(/```([\s\S]*?)```/g, (m, code) => {
    blocks.push("<pre><code>" + esc(code.replace(/^\n/, "")) + "</code></pre>");
    return "\u0000B" + (blocks.length - 1) + "\u0000";
  });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  const out = [];
  let list = null;
  const closeList = () => { if (list){ out.push("</" + list + ">"); list = null; } };
  const lines = text.split("\n");
  for (let li = 0; li < lines.length; li++){
    const raw = lines[li];
    const line = raw.replace(/\s+$/, "");
    let m;
    if (/^\u0000B\d+\u0000$/.test(line)){ closeList(); out.push(blocks[+line.slice(2, -1)]); continue; }
    if (allowHtml && /^\s*<\/?[a-zA-Z][\w-]*(\s|\/?>)/.test(line)){ closeList(); out.push(line); continue; }
    if (!line.trim()){ closeList(); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())){ closeList(); out.push("<hr>"); continue; }
    /* GFM tables: a header row, a dashed divider, then the body rows */
    if (line.includes("|")){
      const nxt = lines[li + 1] || "";
      if (/^\s*\|?[\s:|-]*-[\s:|-]*$/.test(nxt) && nxt.includes("-") && nxt.includes("|")){
        closeList();
        const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
        const head = cells(line);
        const rows = [];
        li += 2;
        while (li < lines.length && lines[li].includes("|") && lines[li].trim()){
          rows.push(cells(lines[li]));
          li++;
        }
        li--;
        out.push("<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") +
          "</tr></thead><tbody>" +
          rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
          "</tbody></table>");
        continue;
      }
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))){
      closeList();
      out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">");
      continue;
    }
    if ((m = line.match(/^\s*>\s?(.*)$/))){ closeList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); continue; }
    if ((m = line.match(/^\s*[-*+]\s+\[( |x|X)\]\s+(.*)$/))){
      if (list !== "ul"){ closeList(); out.push("<ul>"); list = "ul"; }
      out.push('<li class="md-task"><input type="checkbox" disabled' + (m[1] === " " ? "" : " checked") + "> " + inline(m[2]) + "</li>");
      continue;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))){
      if (list !== "ul"){ closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>");
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))){
      if (list !== "ol"){ closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>");
      continue;
    }
    closeList();
    out.push("<p>" + inline(line) + "</p>");
  }
  closeList();
  return out.join("\n");
}

/* ---- backup and restore: the whole machine in one file ---- */
function backupBlob(){
  const settings = {};
  for (const k of SETTING_KEYS) settings[k] = State[k];
  return JSON.stringify({
    boxos: 1, version: "1.3", saved: new Date().toISOString(),
    fs: FS.root, settings, shortcuts: State.shortcuts, builtins: State.builtins, trash: Trash.items
  });
}
function downloadBackup(){
  const name = "boxos-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  const blob = new Blob([backupBlob()], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  notify("Backup saved", name + " went to your downloads.", "\uD83D\uDCBE");
}
async function restoreBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e){ return osAlert("Restore failed", "That file is not readable JSON."); }
  if (!data || !data.boxos || !data.fs || data.fs.type !== "dir")
    return osAlert("Restore failed", "That does not look like a BOX OS backup.");
  const ok = await osConfirm("Restore backup",
    "Replace everything currently in BOX OS with the contents of this backup?\n\n" +
    "Saved " + (data.saved ? new Date(data.saved).toLocaleString() : "at an unknown time") + ".",
    "Replace everything", true);
  if (!ok) return;
  FS.root = data.fs;
  if (data.settings) for (const k of SETTING_KEYS) if (data.settings[k] !== undefined) State[k] = data.settings[k];
  if (Array.isArray(data.shortcuts)) State.shortcuts = data.shortcuts;
  if (data.builtins) State.builtins = Object.assign({}, State.builtins, data.builtins);
  Trash.items = Array.isArray(data.trash) ? data.trash : [];
  applyTheme(); applyAccent(); applyWallpaper(); applyChrome();
  drawDesktop();
  markDirty(); saveSettings(); saveShortcuts(); saveTrash();
  for (const w of windows.values()) if (w.appId === "files" && w.api.navigate) w.api.navigate(HOME);
  refreshTrashViews();
  refreshSettings();
  notify("Backup restored", "Everything was replaced with the contents of the backup.", "\uD83D\uDCE6");
}

function filesApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="fm-tb">' +
      '<button class="tb-btn" data-a="back" title="Back">&#8592;</button>' +
      '<button class="tb-btn" data-a="up" title="Up one level">&#8593;</button>' +

      '<button class="tb-btn" data-a="newdir" title="New folder">New Folder</button>' +
      '<button class="tb-btn" data-a="newfile" title="New text file">New File</button>' +
      '<button class="tb-btn accent" data-a="import" title="Import files from your computer">Import&hellip;</button>' +
    '</div>' +
    '<div class="fm-main">' +
      '<div class="fm-side"></div>' +
      '<div class="fm-list"><table class="fm-tab">' +
        '<thead><tr><th>Name</th><th class="col-size">Size</th><th class="col-type">Type</th></tr></thead><tbody></tbody>' +
      '</table><div class="fm-drop">Drop files here to import</div></div>' +
      '<div class="fm-edit">' +
        '<div class="ed-head">' +
          '<span class="ed-name"></span><span class="ed-dot">&bull;</span><span class="ed-sp"></span>' +
          '<button class="tb-btn" data-e="preview" title="Toggle Markdown preview">Preview</button>' +
          '<button class="tb-btn" data-e="save">Save</button>' +
          '<button class="tb-btn" data-e="revert">Revert</button>' +
          '<button class="tb-btn" data-e="close" title="Close editor">&#10005;</button>' +
        '</div>' +
        '<textarea class="ed-area" spellcheck="false" wrap="off"></textarea>' +
        '<div class="ed-view"></div>' +
        '<div class="ed-foot"><span class="ed-info"></span><span>Ctrl+S saves</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="fm-status"></div>';

  const main   = $(".fm-main", B),  side   = $(".fm-side", B);
  const crumbs = $(".crumbs", B),   tbody  = $(".fm-tab tbody", B);
  const list   = $(".fm-list", B),  status = $(".fm-status", B);
  const edit   = $(".fm-edit", B),  edName = $(".ed-name", B);
  const edArea = $(".ed-area", B),  edInfo = $(".ed-info", B);
  const edView = $(".ed-view", B),  drop   = $(".fm-drop", B);
  const btn    = a => $('[data-a="' + a + '"]', B);

  let cwd = HOME, sel = new Set(), anchor = null, history = [], editing = null, previewing = false;

  const selPaths = () => Array.from(sel).map(n => absPath(n, cwd));
  const only = () => (sel.size === 1 ? Array.from(sel)[0] : null);

  const PLACES = [
    { label: "Home",      icon: "\uD83C\uDFE0", path: HOME },
    { label: "Documents", icon: "\uD83D\uDCC4", path: HOME + "/Documents" },
    { label: "Pictures",  icon: "\uD83D\uDDBC\uFE0F", path: HOME + "/Pictures" },
    { label: "Music",     icon: "\uD83C\uDFB5", path: HOME + "/Music" },
    { label: "Sites",     icon: "\uD83C\uDF10", path: HOME + "/Sites" },
    { label: "Downloads", icon: "\uD83D\uDCE5", path: HOME + "/Downloads" },
    "-",
    { label: "Computer",  icon: "\uD83D\uDDA5\uFE0F", path: "/" }
  ];
  function drawSide(){
    side.innerHTML = "";
    side.appendChild(el("div", "side-h", "Places"));
    for (const p of PLACES){
      if (p === "-"){ side.appendChild(el("hr")); continue; }
      const b = el("button", "place" + (p.path === cwd ? " on" : ""));
      b.append(el("span", "g", p.icon), el("span", null, p.label));
      b.onclick = () => go(p.path);
      /* places double as drop targets, so you can file something away in one drag */
      b.ondragover = e => { if (dragging.length){ e.preventDefault(); b.classList.add("dropping"); } };
      b.ondragleave = () => b.classList.remove("dropping");
      b.ondrop = e => { e.preventDefault(); b.classList.remove("dropping"); dropOnto(p.path); };
      side.appendChild(b);
    }
    const t = el("button", "place");
    t.append(el("span", "g", "\uD83D\uDDD1\uFE0F"), el("span", null, "Trash"));
    if (Trash.items.length) t.append(el("span", "place-n", String(Trash.items.length)));
    t.onclick = () => launch("trash");
    side.appendChild(t);
  }

  function go(path, noHistory){
    const abs = absPath(path, cwd);
    const n = node(abs);
    if (!n || n.type !== "dir") return false;
    if (!noHistory && abs !== cwd) history.push(cwd);
    cwd = abs;
    sel.clear();
    anchor = null;
    draw();
    return true;
  }
  function drawCrumbs(){
    crumbs.innerHTML = "";
    const parts = segs(cwd, "/");
    const root = el("button", "crumb" + (parts.length ? "" : " last"), "\uD83D\uDDA5\uFE0F Computer");
    root.onclick = () => go("/");
    crumbs.appendChild(root);
    let acc = "";
    parts.forEach((p, i) => {
      acc += "/" + p;
      crumbs.appendChild(el("span", "crumb-sep", "\u203A"));
      const b = el("button", "crumb" + (i === parts.length - 1 ? " last" : ""), p);
      const target = acc;
      b.onclick = () => go(target);
      b.ondragover = e => { if (dragging.length){ e.preventDefault(); b.classList.add("dropping"); } };
      b.ondragleave = () => b.classList.remove("dropping");
      b.ondrop = e => { e.preventDefault(); b.classList.remove("dropping"); dropOnto(target); };
      crumbs.appendChild(b);
    });
    crumbs.scrollLeft = 9999;
  }
  function draw(){
    drawCrumbs(); drawSide();
    tbody.innerHTML = "";
    const dir = node(cwd);
    const names = dir ? listDir(dir) : [];
    names.forEach(name => {
      const n = dir.children[name];
      const path = absPath(name, cwd);
      const tr = el("tr");
      tr.dataset.name = name;
      tr.draggable = true;
      const td1 = el("td", "col-name");
      td1.append(el("span", "fi", nodeIcon(name, n)), document.createTextNode(name));
      td1.title = name;
      const size = nodeSize(n);
      tr.append(td1, el("td", "col-size", size == null ? "" : fmtBytes(size)), el("td", "col-type", typeLabel(name, n)));
      if (sel.has(name)) tr.classList.add("sel");
      if (Clip.mode === "cut" && Clip.paths.includes(path)) tr.classList.add("cut");
      if (Store.on && Store.unsaved.has(path)){
        tr.classList.add("nosave");
        td1.title = name + " - too big for browser storage, so it will be gone after a reload";
      }
      tr.onclick = e => click(name, e);
      tr.ondblclick = () => activate(name);
      tr.oncontextmenu = e => rowMenu(e, name);
      tr.ondragstart = e => {
        if (!sel.has(name)) click(name, {});
        dragging = selPaths();
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", dragging.join("\n"));
      };
      tr.ondragend = () => { dragging = []; $$("tr.dropping", tbody).forEach(o => o.classList.remove("dropping")); };
      if (n.type === "dir"){
        tr.ondragover = e => {
          if (dragging.length && !dragging.includes(path)){ e.preventDefault(); tr.classList.add("dropping"); }
        };
        tr.ondragleave = () => tr.classList.remove("dropping");
        tr.ondrop = e => { e.preventDefault(); tr.classList.remove("dropping"); dropOnto(path); };
      }
      tbody.appendChild(tr);
    });
    if (!names.length){
      const tr = el("tr"), td = el("td", "fm-empty", "This folder is empty");
      td.colSpan = 3;
      tr.appendChild(td); tbody.appendChild(tr);
    }
    btn("back").disabled = !history.length;
    btn("up").disabled = cwd === "/";
    win.setTitle(cwd === "/" ? "Computer" : baseName(cwd));
    refreshSel();
  }
  /* click, ctrl-click and shift-click, the way every file manager does it */
  function click(name, e){
    const names = listDir(node(cwd));
    if (e.shiftKey && anchor !== null){
      const a = names.indexOf(anchor), b = names.indexOf(name);
      if (a >= 0 && b >= 0){
        sel.clear();
        for (let i = Math.min(a, b); i <= Math.max(a, b); i++) sel.add(names[i]);
      }
    } else if (e.ctrlKey || e.metaKey){
      sel.has(name) ? sel.delete(name) : sel.add(name);
      anchor = name;
    } else {
      sel.clear();
      sel.add(name);
      anchor = name;
    }
    refreshSel();
  }
  function refreshSel(){
    $$("tr", tbody).forEach(tr => tr.classList.toggle("sel", sel.has(tr.dataset.name)));
    const dir = node(cwd);
    const count = dir ? Object.keys(dir.children).length : 0;
    if (sel.size === 1){
      const name = only(), n = dir.children[name];
      if (n){
        const size = nodeSize(n);
        status.textContent = '"' + name + '" selected \u00b7 ' + typeLabel(name, n) + (size == null ? "" : " \u00b7 " + fmtBytes(size));
        return;
      }
    }
    if (sel.size > 1){
      let bytes = 0;
      for (const p of selPaths()){ const n = node(p); if (n && n.type === "file") bytes += nodeSize(n) || 0; }
      status.textContent = sel.size + " items selected" + (bytes ? " \u00b7 " + fmtBytes(bytes) : "");
      return;
    }
    status.textContent = count + (count === 1 ? " item" : " items") + " \u00b7 " + tilde(cwd) +
      (Clip.paths.length ? "  \u00b7  " + Clip.paths.length + " on the clipboard (" + Clip.mode + ")" : "");
  }
  function activate(name){
    const path = absPath(name, cwd);
    const n = node(path);
    if (!n) return;
    if (n.type === "dir") go(path);
    else if (isHtml(name)) openInBrowser("box:" + path);
    else if (isAudio(name)) openAudio(path);
    else if (n.kind === "text") openEditor(path);
    else if (n.kind === "image") openImage(path);
    else osAlert(name, "No preview available for this file type yet.\n\n" + fmtBytes(nodeSize(n)) + " \u00b7 " + (n.mime || "unknown"));
  }

  /* ---- clipboard and moving ---- */
  function doCopy(){
    if (!sel.size) return;
    Clip.mode = "copy"; Clip.paths = selPaths();
    draw();
  }
  function doCut(){
    if (!sel.size) return;
    Clip.mode = "cut"; Clip.paths = selPaths();
    draw();
  }
  function doPaste(){
    if (!Clip.paths.length) return;
    const done = [];
    for (const p of Clip.paths){
      const placed = Clip.mode === "cut" ? movePath(p, cwd) : copyPath(p, cwd);
      if (placed) done.push(placed);
    }
    if (Clip.mode === "cut"){ Clip.mode = null; Clip.paths = []; }
    sel = new Set(done);
    draw();
    refreshOtherFiles();
    if (done.length) status.textContent = done.length + " item(s) pasted into " + tilde(cwd);
  }
  function dropOnto(dirPath){
    const moving = dragging.slice();
    dragging = [];
    if (!moving.length) return;
    let n = 0;
    for (const p of moving) if (movePath(p, dirPath)) n++;
    draw();
    refreshOtherFiles();
    if (n) notify("Moved", n + " item" + (n === 1 ? "" : "s") + " into " + tilde(dirPath), "\uD83D\uDCC1");
  }
  function refreshOtherFiles(){
    for (const w of windows.values())
      if (w.appId === "files" && w !== win && w.api && w.api.refresh) w.api.refresh();
  }

  async function doRename(){
    const name = only();
    if (!name) return;
    const next = await osPrompt("Rename", 'New name for "' + name + '"', name);
    if (!next || next === name) return;
    if (next.includes("/")) return osAlert("Rename", "A name cannot contain a slash.");
    if (node(cwd).children[next]) return osAlert("Rename", next + " already exists here.");
    const oldPath = absPath(name, cwd);
    if (renamePath(oldPath, next)){
      if (editing && editing.path === oldPath){ editing.path = absPath(next, cwd); edName.textContent = next; }
      for (const sc of State.shortcuts) if (sc.kind === "path" && sc.target === oldPath){ sc.target = absPath(next, cwd); sc.label = next; }
      drawDesktop();
      sel = new Set([next]);
      draw();
    }
  }
  async function doDelete(permanent){
    if (!sel.size) return;
    const paths = selPaths();
    const label = paths.length === 1 ? '"' + baseName(paths[0]) + '"' : paths.length + " items";
    if (permanent){
      const ok = await osConfirm("Delete forever", "Permanently delete " + label + "?\n\nThis cannot be undone.", "Delete forever", true);
      if (!ok) return;
    }
    for (const p of paths){
      if (editing && (editing.path === p || editing.path.startsWith(p + "/"))) closeEditor(true);
      permanent ? removePath(p) : trashPath(p);
    }
    const gone = State.shortcuts.filter(sc => sc.kind === "path" && paths.some(p => sc.target === p || sc.target.startsWith(p + "/")));
    if (gone.length){
      State.shortcuts = State.shortcuts.filter(sc => !gone.includes(sc));
      drawDesktop();
      refreshSettings();
    }
    sel.clear();
    draw();
    refreshOtherFiles();
    if (!permanent) notify("Moved to Trash", label + " can be put back from Trash.", "\uD83D\uDDD1\uFE0F");
  }
  async function doNewDir(){
    const name = await osPrompt("New Folder", "Folder name", "Untitled Folder");
    if (!name) return;
    if (name.includes("/")) return osAlert("New Folder", "A folder name cannot contain a slash.");
    if (node(cwd).children[name]) return osAlert("New Folder", name + " already exists here.");
    ensureDir(absPath(name, cwd));
    sel = new Set([name]);
    draw();
  }
  async function doNewFile(){
    const name = await osPrompt("New File", "File name", "untitled.txt");
    if (!name) return;
    if (node(cwd).children[name]) return osAlert("New File", name + " already exists here.");
    writeFile(absPath(name, cwd), "", "text");
    sel = new Set([name]);
    draw();
    openEditor(absPath(name, cwd));
  }
  function ingest(files){
    if (!files.length) return;
    let pending = files.length;
    const added = [];
    Array.from(files).forEach(f => {
      const kind = kindFor(f.name, f.type || "");
      const r = new FileReader();
      r.onload = () => {
        const name = addUnique(cwd, f.name, r.result, kind, f.type || "application/octet-stream");
        if (name) added.push(name);
        if (--pending === 0) finish();
      };
      r.onerror = () => { if (--pending === 0) finish(); };
      if (kind === "text") r.readAsText(f); else r.readAsDataURL(f);
    });
    function finish(){
      sel = new Set(added);
      draw();
      notify("Import finished",
        added.length + " file" + (added.length === 1 ? "" : "s") + " added to " + tilde(cwd) +
        (added.some(isHtml) ? "\nDouble-click an HTML file to open it in the Browser." : ""),
        "\uD83D\uDCE5");
    }
  }
  function doImport(){
    const inp = $("#importer");
    inp.value = "";
    inp.onchange = () => { const f = Array.from(inp.files || []); inp.onchange = null; ingest(f); };
    inp.click();
  }
  /* files dragged in from the real desktop */
  let dragDepth = 0;
  list.addEventListener("dragenter", e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes("Files")) return;
    e.preventDefault();
    if (++dragDepth === 1) drop.classList.add("on");
  });
  list.addEventListener("dragover", e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files")) e.preventDefault();
  });
  list.addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; drop.classList.remove("on"); } });
  list.addEventListener("drop", e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    dragDepth = 0;
    drop.classList.remove("on");
    ingest(e.dataTransfer.files);
  });

  /* ---- editor, with a Markdown preview ---- */
  function setDirty(d){ edit.classList.toggle("dirty", !!d); if (editing) editing.dirty = !!d; }
  function openEditor(path){
    const n = node(path);
    if (!n || n.type !== "file" || n.kind !== "text") return;
    editing = { path, orig: n.content, dirty: false };
    edName.textContent = baseName(path);
    edName.title = path;
    edArea.value = n.content;
    main.classList.add("editing");
    previewing = false;
    applyPreview();
    setDirty(false);
    updateEdInfo();
    sel = new Set([baseName(path)]);
    refreshSel();
    setTimeout(() => edArea.focus(), 0);
  }
  function applyPreview(){
    const md = editing && /\.(md|markdown)$/i.test(editing.path);
    $('[data-e="preview"]', B).style.display = md ? "" : "none";
    edit.classList.toggle("previewing", previewing && md);
    $('[data-e="preview"]', B).classList.toggle("on", previewing && md);
    if (previewing && md) edView.innerHTML = markdownToHtml(edArea.value);
  }
  function updateEdInfo(){
    const v = edArea.value;
    edInfo.textContent = v.split("\n").length + " lines \u00b7 " + v.length + " chars \u00b7 " + (editing ? tilde(editing.path) : "");
  }
  function saveFile(){
    if (!editing) return;
    writeFile(editing.path, edArea.value, "text");
    editing.orig = edArea.value;
    setDirty(false);
    updateEdInfo();
    draw();
    status.textContent = "Saved " + tilde(editing.path);
  }
  async function closeEditor(force){
    if (editing && editing.dirty && !force){
      const ok = await osConfirm("Unsaved changes", baseName(editing.path) + " has unsaved changes.\n\nClose the editor and lose them?", "Discard", true);
      if (!ok) return;
    }
    editing = null;
    previewing = false;
    main.classList.remove("editing");
    edit.classList.remove("previewing");
    edArea.value = "";
  }
  edArea.addEventListener("input", () => {
    if (editing) setDirty(edArea.value !== editing.orig);
    updateEdInfo();
    if (previewing) applyPreview();
  });
  edArea.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); saveFile(); }
    if (e.key === "Tab"){
      e.preventDefault();
      const a = edArea.selectionStart, b = edArea.selectionEnd;
      edArea.value = edArea.value.slice(0, a) + "  " + edArea.value.slice(b);
      edArea.selectionStart = edArea.selectionEnd = a + 2;
      if (editing) setDirty(edArea.value !== editing.orig);
    }
  });
  $('[data-e="save"]',    B).onclick = saveFile;
  $('[data-e="revert"]',  B).onclick = () => { if (!editing) return; edArea.value = editing.orig; setDirty(false); updateEdInfo(); applyPreview(); };
  $('[data-e="close"]',   B).onclick = () => closeEditor();
  $('[data-e="preview"]', B).onclick = () => { previewing = !previewing; applyPreview(); };

  /* ---- menus, toolbar, keys ---- */
  function rowMenu(e, name){
    e.preventDefault(); e.stopPropagation();
    if (!sel.has(name)) click(name, {});
    const n = node(absPath(name, cwd));
    const many = sel.size > 1;
    const items = [{ icon: n.type === "dir" ? "\uD83D\uDCC2" : "\uD83D\uDCC4", label: many ? "Open " + sel.size + " items" : "Open",
                     run: () => Array.from(sel).forEach(activate) }];
    if (!many && n.type === "file" && n.kind === "text" && isHtml(name))
      items.push({ icon: "\u270F\uFE0F", label: "Edit source", run: () => openEditor(absPath(name, cwd)) });
    items.push("-",
      { icon: "\u2702\uFE0F", label: "Cut",  run: doCut },
      { icon: "\uD83D\uDCCB", label: "Copy", run: doCopy },
      { icon: "\uD83D\uDCC4", label: "Paste", disabled: !Clip.paths.length, run: doPaste }, "-");
    if (!many) items.push({ icon: "\uD83D\uDCCC", label: "Add to Desktop", run: () => addPathShortcut(absPath(name, cwd)) },
                          { icon: "\u270F\uFE0F", label: "Rename\u2026", run: doRename });
    items.push({ icon: "\uD83D\uDDD1\uFE0F", label: many ? "Move " + sel.size + " to Trash" : "Move to Trash", run: () => doDelete(false) });
    showCtx(e.clientX, e.clientY, items);
  }
  list.addEventListener("contextmenu", e => {
    if (e.target.closest("tr[data-name]")) return;
    e.preventDefault(); e.stopPropagation();
    sel.clear(); refreshSel();
    showCtx(e.clientX, e.clientY, [
      { icon: "\uD83D\uDCC1", label: "New Folder\u2026", run: doNewDir },
      { icon: "\uD83D\uDCC4", label: "New File\u2026",   run: doNewFile },
      "-",
      { icon: "\uD83D\uDCC4", label: "Paste", disabled: !Clip.paths.length, run: doPaste },
      { icon: "\uD83D\uDCE5", label: "Import\u2026",     run: doImport },
      { icon: "\uD83D\uDCCC", label: "Add folder to Desktop", run: () => addPathShortcut(cwd) },
      { icon: "\uD83D\uDD04", label: "Refresh",          run: draw }
    ]);
  });
  btn("back").onclick    = () => { const p = history.pop(); if (p != null) go(p, true); };
  btn("up").onclick      = () => go(dirName(cwd));
  btn("newdir").onclick  = doNewDir;
  btn("newfile").onclick = doNewFile;
  btn("import").onclick  = doImport;

  B.addEventListener("keydown", e => {
    if (e.target === edArea) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "c"){ e.preventDefault(); return doCopy(); }
    if (mod && e.key.toLowerCase() === "x"){ e.preventDefault(); return doCut(); }
    if (mod && e.key.toLowerCase() === "v"){ e.preventDefault(); return doPaste(); }
    if (mod && e.key.toLowerCase() === "a"){
      e.preventDefault();
      sel = new Set(listDir(node(cwd)));
      return refreshSel();
    }
    if (e.key === "Enter" && sel.size){ e.preventDefault(); return Array.from(sel).forEach(activate); }
    if (e.key === "Delete" && sel.size){ e.preventDefault(); return doDelete(e.shiftKey); }
    if (e.key === "F2" && sel.size === 1){ e.preventDefault(); return doRename(); }
    if (e.key === "Backspace"){ e.preventDefault(); return go(dirName(cwd)); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const names = listDir(node(cwd));
      if (!names.length) return;
      const i = anchor ? names.indexOf(anchor) : -1;
      const next = names[clamp(i + (e.key === "ArrowDown" ? 1 : -1), 0, names.length - 1)];
      click(next, { shiftKey: e.shiftKey });
      anchor = next;
      const row = $('tr[data-name="' + next.replace(/"/g, '\\"') + '"]', tbody);
      if (row) row.scrollIntoView({ block: "nearest" });
    }
  });
  B.tabIndex = 0;

  if (startPath){
    const n = node(startPath);
    if (n) cwd = n.type === "dir" ? absPath(startPath) : dirName(startPath);
  }
  draw();
  if (startPath && node(startPath) && node(startPath).type === "file") activate(baseName(startPath));

  return {
    navigate: go,
    refresh: draw,
    reveal(path){
      const n = node(path);
      if (!n) return;
      if (n.type === "dir") go(path);
      else { go(dirName(path)); activate(baseName(path)); }
    },
    onClose(){
      if (editing && editing.dirty){
        osConfirm("Unsaved changes", baseName(editing.path) + " has unsaved changes.\n\nClose Files and lose them?", "Discard", true)
          .then(ok => { if (ok){ editing = null; win.close(); } });
        return false;
      }
      return true;
    }
  };
}

/* ============================================================
   10. Browser

   Public relays are all dead or key-walled now, so nothing here goes
   through a middleman. Instead the browser speaks directly to sources
   that allow cross-origin reads: Wikipedia's REST API, DuckDuckGo's
   instant-answer API, Hacker News. Local box: pages render as before.
   Anything else gets an honest page instead of a white one.
   ============================================================ */
const WIKI_CSS =
  "<style>" +

  "h1{font-size:31px;margin:0 0 18px;border-bottom:1px solid #ddd;padding-bottom:10px}" +
  "h2{font-size:23px;margin:34px 0 10px;border-bottom:1px solid #eee;padding-bottom:6px}" +
  "h3{font-size:18px;margin:26px 0 8px}" +
  "a{color:#3366cc;text-decoration:none}a:hover{text-decoration:underline}" +
  "img{max-width:100%;height:auto}" +
  "figure{margin:18px 0;text-align:center}" +
  "figcaption{font-size:13px;color:#666;font-family:'Segoe UI',sans-serif;margin-top:6px}" +

  "</style>";

/* every link inside a fetched article is handed back to BOX OS instead of
   navigating the frame, so reading actually chains from article to article */
const WIKI_NAV =
  "<script>document.addEventListener('click',function(e){" +
  "var a=e.target.closest&&e.target.closest('a');if(!a)return;" +
  "e.preventDefault();parent.postMessage({boxnav:a.getAttribute('href')||''},'*');" +
  "},true);<" + "/script>";

const READER_CSS =
  "<style>" +
  "body{margin:0 auto;padding:32px 30px 70px;max-width:780px;" +
  "font:15px/1.65 'Segoe UI',system-ui,sans-serif;color:#222;background:#fff}" +
  "h1{font-size:26px;line-height:1.25;margin:0 0 18px;border-bottom:1px solid #ddd;padding-bottom:10px}" +
  "h2{font-size:20px;margin:28px 0 8px}h3{font-size:17px;margin:22px 0 6px}" +
  "a{color:#3366cc;text-decoration:none}a:hover{text-decoration:underline}" +
  "img{max-width:100%;height:auto}" +
  "code{background:#f2f2ef;padding:1px 5px;border-radius:3px;font:13px ui-monospace,Consolas,monospace}" +
  "pre{background:#f6f6f3;border:1px solid #e2e2dc;padding:12px 14px;border-radius:6px;overflow-x:auto}" +
  "pre code{background:none;padding:0}" +
  "blockquote{margin:14px 0;padding-left:14px;border-left:3px solid #ddd;color:#555}" +
  "table{border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}" +
  "table td,table th{border:1px solid #ddd;padding:5px 9px}" +
  ".ans{border:1px solid #e2e2dc;border-radius:7px;padding:4px 18px 14px;margin:0 0 20px;background:#fcfcfa}" +
  ".meta{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;" +
  "color:#5f8039;margin:14px 0 6px}" +
  "ul,ol{padding-left:24px}" +
  "</style>";

const escapeHtml = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function decodeEntities(t){
  const d = document.createElement("textarea");
  d.innerHTML = String(t);
  return d.value;
}
function readerDocument(bodyHtml, baseHref){
  return "<!doctype html><html><head><meta charset=\"utf-8\">" +
    (baseHref ? '<base href="' + baseHref.replace(/"/g, "&quot;") + '">' : "") +
    READER_CSS + "</head><body>" + bodyHtml + WIKI_NAV + "</body></html>";
}

function wikiDocument(html){
  const inject = '<base href="https://en.wikipedia.org/wiki/">' + WIKI_CSS;
  let out = /<head[^>]*>/i.test(html)
    ? html.replace(/<head[^>]*>/i, m => m + inject)
    : "<!doctype html><html><head>" + inject + "</head><body>" + html + "</body></html>";
  return /<\/body>/i.test(out) ? out.replace(/<\/body>/i, WIKI_NAV + "</body>") : out + WIKI_NAV;
}
const wikiTitleFromHref = href => {
  if (!href) return null;
  const m = String(href).match(/^(?:\.\/|https?:\/\/[a-z.]*wikipedia\.org\/wiki\/)([^#?]+)/i);
  return m ? decodeURIComponent(m[1]) : null;
};

function browserApp(win, startTarget){
  const B = win.body;
  B.innerHTML =
    '<div class="wb-tb">' +
      '<button class="tb-btn" data-b="back" title="Back">&#8592;</button>' +
      '<button class="tb-btn" data-b="fwd" title="Forward">&#8594;</button>' +
      '<button class="tb-btn" data-b="reload" title="Reload">&#8635;</button>' +
      '<button class="tb-btn" data-b="home" title="Start page">&#8962;</button>' +
      '<input class="wb-addr" spellcheck="false" autocomplete="off" placeholder="Search, or type an address">' +
      '<select class="wb-eng" title="Search engine"></select>' +
      '<button class="tb-btn" data-b="ext" title="Open in a real browser tab">&#8599;</button>' +
    '</div>' +
    '<div class="wb-stage"></div>';

  const addr  = $(".wb-addr", B), engSel = $(".wb-eng", B), stage = $(".wb-stage", B);
  const bb    = k => $('[data-b="' + k + '"]', B);
  let hist = [], hi = -1, current = null, frame = null, reqId = 0;

  for (const id in ENGINES){
    const o = el("option", null, ENGINES[id].name);
    o.value = id;
    engSel.appendChild(o);
  }
  engSel.value = State.engine;
  engSel.onchange = () => {
    State.engine = engSel.value;
    saveSettings();
    refreshSettings();
    if (current && current.kind === "search") render(current);
    else if (!current) drawHome();
  };

  /* ---- what did the user mean? ---- */
  function resolve(input){
    const s = String(input).trim();
    if (!s) return null;
    if (s.startsWith("box:")) return { kind: "local", path: absPath(s.slice(4), HOME) };
    if (s.startsWith("wiki:")) return { kind: "wiki", title: s.slice(5).trim() };
    if (/^(hn|news|hackernews)$/i.test(s)) return { kind: "hn" };
    if (/^so:/i.test(s)) return { kind: "so", q: s.slice(3).trim() };
    if (/^gh:/i.test(s)){
      const v = s.slice(3).trim();
      return /^[\w.-]+\/[\w.-]+$/.test(v) ? { kind: "ghrepo", repo: v } : { kind: "gh", q: v };
    }
    if (/^(wikt|define):/i.test(s)) return { kind: "wikt", title: s.split(":").slice(1).join(":").trim() };
    const gh = s.match(/^(?:https?:\/\/)?github\.com\/([\w.-]+\/[\w.-]+)\/?$/i);
    if (gh) return { kind: "ghrepo", repo: gh[1] };
    const w = s.match(/^(?:https?:\/\/)?[a-z]*\.?wikipedia\.org\/wiki\/([^#?]+)/i);
    if (w) return { kind: "wiki", title: decodeURIComponent(w[1]) };
    if (/^https?:\/\//i.test(s)) return { kind: "web", url: s };
    if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(s) && !s.includes(" ")) return { kind: "web", url: "https://" + s };
    if (s.startsWith("/") || s.startsWith("~")){
      const p = absPath(s, HOME);
      if (node(p)) return { kind: "local", path: p };
    }
    return { kind: "search", q: s };
  }
  function go(input, noHistory){
    const t = typeof input === "object" ? input : resolve(input);
    if (!t) return;
    if (!noHistory){
      hist = hist.slice(0, hi + 1);
      hist.push(t);
      hi = hist.length - 1;
    }
    render(t);
  }
  const setAddr = v => { addr.value = v; };
  function syncNav(){
    bb("back").disabled = hi <= 0;
    bb("fwd").disabled  = hi >= hist.length - 1;
    bb("ext").disabled  = !current || !(current.kind === "web" || current.kind === "wiki" || current.kind === "search");
  }
  function externalUrl(t){
    if (!t) return null;
    if (t.kind === "web") return t.url;
    if (t.kind === "wiki") return "https://en.wikipedia.org/wiki/" + encodeURIComponent(t.title);
    if (t.kind === "search") return ENGINES[State.engine].url + encodeURIComponent(t.q);
    return null;
  }

  /* ---- chrome for the native (non-iframe) pages ---- */
  function page(){
    stage.innerHTML = "";
    frame = null;
    const p = el("div", "wb-home");
    stage.appendChild(p);
    return p;
  }
  function spinner(label){
    const p = page();
    const h = el("div", "hero");
    h.append(el("div", "wb-spin"), el("p", null, label));
    p.appendChild(h);
  }
  function errorPage(title, msg, target){
    const p = page();
    const h = el("div", "hero");
    h.append(el("div", "wb-sad", ":("), el("h1", null, title), el("p", null, msg));
    const url = externalUrl(target);
    if (url){
      const b = el("button", "btn primary", "Open in a real browser tab");
      b.style.height = "34px";
      b.onclick = () => window.open(url, "_blank", "noopener");
      h.appendChild(b);
    }
    p.appendChild(h);
  }
  function mountFrame(srcdoc){
    /* reuse the existing frame where possible - creating a new sandboxed
       iframe spins up a fresh renderer process and flashes white between pages */
    const existing = stage.querySelector("iframe");
    if (existing){
      Array.from(stage.children).forEach(n => { if (n !== existing) n.remove(); });
      frame = existing;
      frame.srcdoc = srcdoc;
      return;
    }
    stage.innerHTML = "";
    frame = el("iframe");
    /* no allow-same-origin: fetched pages get an opaque origin and cannot
       reach into BOX OS, but their own scripts still run */
    frame.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-popups");
    frame.srcdoc = srcdoc;
    stage.appendChild(frame);
  }
  async function grab(url, ms){
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms || 12000);
    try { return await fetch(url, { signal: ctl.signal, redirect: "follow" }); }
    finally { clearTimeout(timer); }
  }

  /* ---- the renderers ---- */
  async function render(t){
    current = t;
    const my = ++reqId;
    syncNav();

    if (t.kind === "local"){
      setAddr("box:" + t.path);
      const n = node(t.path);
      if (!n || n.type !== "file"){
        win.setTitle("Browser");
        return errorPage("File not found", tilde(t.path) + " is not in the filesystem any more.", null);
      }
      win.setTitle(baseName(t.path));
      return mountFrame(n.kind === "text" ? n.content : "<!doctype html><pre>Not a text file.</pre>");
    }

    if (t.kind === "wiki"){
      setAddr("wiki:" + t.title);
      win.setTitle(t.title.replace(/_/g, " "));
      spinner("Fetching " + t.title.replace(/_/g, " ") + String.fromCharCode(8230));
      try {
        const res = await grab("https://en.wikipedia.org/api/rest_v1/page/html/" + encodeURIComponent(t.title));
        if (my !== reqId) return;
        if (res.status === 404) return errorPage("No such article", "Wikipedia has no page called " + t.title.replace(/_/g, " ") + ".", null);
        if (!res.ok) return errorPage("Wikipedia said no", "The request came back with status " + res.status + ".", t);
        const html = await res.text();
        if (my !== reqId) return;
        mountFrame(wikiDocument(html));
      } catch (e){
        if (my !== reqId) return;
        errorPage("Could not reach Wikipedia",
          "The request failed or timed out. Check that you are online.", t);
      }
      return;
    }

    if (t.kind === "search") return renderSearch(t, my);
    if (t.kind === "hn")     return renderHN(my);
    if (t.kind === "so")     return renderSO(t, my);
    if (t.kind === "sopost") return renderSOPost(t, my);
    if (t.kind === "gh")     return renderGH(t, my);
    if (t.kind === "ghrepo") return renderGHRepo(t, my);
    if (t.kind === "wikt")   return renderWikt(t, my);

    /* a plain web address: worth trying, since some sites do allow it */
    setAddr(t.url);
    let host = t.url;
    try { host = new URL(t.url).hostname.replace(/^www\./, ""); } catch (e){}
    win.setTitle(host);
    spinner("Contacting " + host + String.fromCharCode(8230));
    try {
      const res = await grab(t.url, 9000);
      if (my !== reqId) return;
      const body = await res.text();
      if (my !== reqId) return;
      const base = '<base href="' + t.url.replace(/"/g, "&quot;") + '">';
      mountFrame(/<head[^>]*>/i.test(body) ? body.replace(/<head[^>]*>/i, m => m + base) : base + body);
    } catch (e){
      if (my !== reqId) return;
      errorPage(host + " will not open here",
        "Sites have to allow other pages to read them, and most large ones do not. " +
        "Wikipedia articles and searches work inside BOX OS; everything else needs a real browser tab.", t);
    }
  }

  /* ---- Stack Overflow ---- */
  async function renderSO(t, my){
    setAddr("so:" + t.q);
    win.setTitle(t.q + " - Stack Overflow");
    spinner("Searching Stack Overflow" + String.fromCharCode(8230));
    try {
      const res = await grab("https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&site=stackoverflow" +
        "&filter=withbody&pagesize=10&q=" + encodeURIComponent(t.q), 12000);
      if (my !== reqId) return;
      const j = await res.json();
      if (my !== reqId) return;
      const p = page();
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Stack Overflow: " + t.q));
      const hits = (j.items || []).filter(x => x.title);
      if (!hits.length) s.appendChild(el("div", "wb-none", "Nothing found for that."));
      for (const h of hits){
        const b = el("button", "wb-result");
        b.appendChild(el("div", "wb-result-t", decodeEntities(h.title)));
        b.appendChild(el("div", "wb-result-s",
          (h.is_answered ? "answered" : "unanswered") + " \u00b7 " + h.score + " votes \u00b7 " +
          h.answer_count + " answers \u00b7 " + (h.tags || []).slice(0, 4).join(", ")));
        b.onclick = () => go({ kind: "sopost", id: h.question_id, title: decodeEntities(h.title) });
        s.appendChild(b);
      }
      p.appendChild(s);
    } catch (e){
      if (my !== reqId) return;
      errorPage("Could not reach Stack Overflow", "The request failed or timed out.", null);
    }
  }
  async function renderSOPost(t, my){
    setAddr("so:#" + t.id);
    win.setTitle(t.title);
    spinner("Loading the answers" + String.fromCharCode(8230));
    try {
      const res = await grab("https://api.stackexchange.com/2.3/questions/" + t.id +
        "/answers?order=desc&sort=votes&site=stackoverflow&filter=withbody&pagesize=5", 12000);
      if (my !== reqId) return;
      const j = await res.json();
      if (my !== reqId) return;
      const parts = ['<h1>' + escapeHtml(t.title) + "</h1>"];
      const answers = j.items || [];
      if (!answers.length) parts.push("<p><em>No answers on this question yet.</em></p>");
      answers.forEach((a, i) => {
        parts.push('<div class="ans"><div class="meta">' +
          (a.is_accepted ? "Accepted answer" : "Answer " + (i + 1)) + " \u00b7 " + a.score + " votes</div>" +
          a.body + "</div>");
      });
      mountFrame(readerDocument(parts.join("\n"), "https://stackoverflow.com/"));
    } catch (e){
      if (my !== reqId) return;
      errorPage("Could not load the answers", "The request failed or timed out.", null);
    }
  }

  async function renderGHRepo(t, my){

    spinner("Fetching the README" + String.fromCharCode(8230));
    try {
      const res = await grab("https://api.github.com/repos/" + t.repo + "/readme", 12000);

  /* ---- search: DuckDuckGo instant answers + Wikipedia, side by side ---- */
  async function renderSearch(t, my){
    setAddr(t.q);
    win.setTitle(t.q + " - search");
    spinner("Searching for " + t.q + String.fromCharCode(8230));
    let ddg = null, wiki = [];
    try {
      const [a, b] = await Promise.allSettled([
        grab("https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&q=" + encodeURIComponent(t.q), 9000),
        grab("https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=8&srsearch=" + encodeURIComponent(t.q), 9000)
      ]);
      if (my !== reqId) return;
      if (a.status === "fulfilled" && a.value.ok) ddg = await a.value.json().catch(() => null);
      if (b.status === "fulfilled" && b.value.ok){
        const j = await b.value.json().catch(() => null);
        if (j && j.query && j.query.search) wiki = j.query.search;
      }
    } catch (e){ /* handled below */ }
    if (my !== reqId) return;

    const p = page();
    const head = el("div", "wb-sect");
    const hq = el("h1");
    hq.style.cssText = "font-size:20px;margin:0 0 3px;font-family:inherit";
    hq.textContent = t.q;
    head.append(hq, el("div", "wb-none", "Results from DuckDuckGo and Wikipedia, read directly - no page you visit is sent anywhere else."));
    p.appendChild(head);

    if (ddg && (ddg.AbstractText || ddg.Answer)){
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, ddg.Answer ? "Answer" : "Summary"));
      const card = el("div", "wb-card");
      if (ddg.Heading) card.appendChild(el("div", "wb-card-h", ddg.Heading));
      card.appendChild(el("p", null, ddg.Answer ? String(ddg.Answer).replace(/<[^>]+>/g, "") : ddg.AbstractText));
      if (ddg.AbstractSource) card.appendChild(el("div", "wb-none", "via " + ddg.AbstractSource));
      s.appendChild(card);
      p.appendChild(s);
    }

    if (wiki.length){
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Wikipedia"));
      for (const r of wiki){
        const b = el("button", "wb-result");
        b.appendChild(el("div", "wb-result-t", r.title));
        const snip = el("div", "wb-result-s");
        snip.textContent = String(r.snippet || "").replace(/<[^>]+>/g, "") + String.fromCharCode(8230);
        b.appendChild(snip);
        b.onclick = () => go({ kind: "wiki", title: r.title.replace(/ /g, "_") });
        s.appendChild(b);
      }
      p.appendChild(s);
    }

    const rel = (ddg && ddg.RelatedTopics ? ddg.RelatedTopics : []).filter(x => x.Text).slice(0, 8);
    if (rel.length){
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Related"));
      const grid = el("div", "wb-links");
      for (const r of rel){
        const b = el("button", "wb-link");
        b.textContent = r.Text.length > 60 ? r.Text.slice(0, 60) + String.fromCharCode(8230) : r.Text;
        b.title = r.Text;
        b.onclick = () => go({ kind: "search", q: r.Text.split(" - ")[0] });
        grid.appendChild(b);
      }
      s.appendChild(grid);
      p.appendChild(grid.children.length ? s : el("span"));
    }

    const more = el("div", "wb-sect");
    more.appendChild(el("h2", null, "Look somewhere else"));
    const grid3 = el("div", "wb-links");
    const elsewhere = [
      ["Stack Overflow", () => go({ kind: "so", q: t.q })],
      ["GitHub", () => go({ kind: "gh", q: t.q })],
      ["Definition", () => go({ kind: "wikt", title: t.q })],
      ["Open in a real tab", () => window.open(externalUrl(t), "_blank", "noopener")]
    ];
    for (const [label, fn] of elsewhere){
      const b = el("button", "wb-link");
      b.textContent = label;
      b.onclick = fn;
      grid3.appendChild(b);
    }
    more.appendChild(grid3);
    p.appendChild(more);

    if (!wiki.length && !(ddg && (ddg.AbstractText || ddg.Answer))){
      const s = el("div", "wb-sect");
      s.appendChild(el("div", "wb-none", "Nothing came back for that. Try different words, or open it in a real browser tab."));
      const b = el("button", "btn primary", "Search " + ENGINES[State.engine].name + " in a real tab");
      b.onclick = () => window.open(externalUrl(t), "_blank", "noopener");
      s.appendChild(b);
      p.appendChild(s);
    }
  }

  /* ---- Wiktionary ---- */
  async function renderWikt(t, my){
    setAddr("define:" + t.title);
    win.setTitle(t.title + " - definition");
    spinner("Looking up " + t.title + String.fromCharCode(8230));
    try {
      const res = await grab("https://en.wiktionary.org/api/rest_v1/page/html/" + encodeURIComponent(t.title), 12000);
      if (my !== reqId) return;
      if (res.status === 404) return errorPage("No entry", "Wiktionary has nothing for " + t.title + ".", null);
      const html = await res.text();
      if (my !== reqId) return;
      const inject = '<base href="https://en.wiktionary.org/wiki/">' + WIKI_CSS;
      let out = html.replace(/<head[^>]*>/i, m => m + inject);
      out = out.replace(/<\/body>/i, WIKI_NAV + "</body>");
      mountFrame(out);
    } catch (e){
      if (my !== reqId) return;
      errorPage("Could not reach Wiktionary", "The request failed or timed out.", null);
