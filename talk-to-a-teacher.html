<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk Your Teacher — ChalkBored</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #171717;
    --muted: #8a8580;
    --line: #d9d5cf;
    --accent: #3d4f4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 2rem 1.75rem 0;
    max-width: 760px;
    margin: 0 auto;
  }
  .back-link {
    display: inline-block;
    font-size: 0.9rem;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .back-link:hover { color: var(--ink); border-color: var(--ink); }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 5rem 1.75rem 8rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    line-height: 1.15;
    margin: 0 0 1.75rem;
  }
  .rule {
    width: 48px;
    height: 1px;
    background: var(--accent);
    margin-bottom: 2.5rem;
  }
  p {
    font-size: clamp(1.05rem, 1.6vw, 1.2rem);
    line-height: 1.75;
    color: #3a3a3a;
    max-width: 62ch;
    margin: 0 0 1.25rem;
  }
  .chat-frame-wrap {
    margin-top: 3rem;
    display: flex;
    justify-content: center;
  }
  iframe {
    border: 1px solid var(--line);
    width: 100%;
    max-width: 420px;
    height: 620px;
  }
  footer {
    text-align: center;
    padding: 2.5rem 1.5rem 3rem;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    margin: 0 1.75rem;
  }
</style>
</head>
<body>
  <header>
    <a class="back-link" href="index.html">&larr; Back to ChalkBored</a>
  </header>
  <main>
    <div class="rule"></div>
    <h1>Talk Your Teacher</h1>
    <p>A way to contact your teacher, requires them to give you their room password.</p>
    <p>Response times depend on who's online — check the FAQ for what to expect.</p>
    <div class="chat-frame-wrap">
      <iframe src="chat.html" title="ChalkBored chat"></iframe>
    </div>
  </main>
  <footer>
    ChalkBored &middot; built for students, kept free
  </footer>
</body>
</html>
