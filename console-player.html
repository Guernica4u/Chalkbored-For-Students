<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalk Console</title>
<style>
  :root {
    --bg: #0c0d10;
    --ink: #e8e8e6;
    --muted: #6f7680;
    --line: #23262c;
    --accent: #6ee7a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game { width: 100%; height: 100%; }
  .notice {
    max-width: 52ch;
    padding: 2rem;
    font-size: 0.82rem;
    line-height: 1.8;
    color: var(--muted);
  }
  .notice h2 {
    margin: 0 0 1rem;
    font-size: 0.95rem;
    color: var(--ink);
    font-weight: 500;
  }
  .notice code {
    color: var(--accent);
    background: #12161a;
    border: 1px solid var(--line);
    padding: 0.1rem 0.35rem;
  }
  .notice ol { padding-left: 1.2rem; margin: 0.75rem 0 0; }
  .notice li { margin-bottom: 0.5rem; }
</style>
</head>
<body>
  <div id="game"></div>

  <script>
    const DATA_PATH = 'emulatorjs/data/';
    const stage = document.getElementById('game');

    function notice(html) {
      stage.innerHTML = '<div class="notice">' + html + '</div>';
      stage.style.height = 'auto';
    }

    function setupMissing() {
      notice(
        '<h2>Emulator files not installed yet</h2>' +
        'The console runs on a self-hosted copy of EmulatorJS, which isn\'t in this site yet.' +
        '<ol>' +
          '<li>Download the latest release zip from the EmulatorJS repo on GitHub.</li>' +
          '<li>Put its <code>data</code> folder here as <code>' + DATA_PATH.replace(/\/$/, '') + '</code>.</li>' +
          '<li>Delete every core except the NES and SNES ones to keep the site small.</li>' +
        '</ol>'
      );
    }

    // Start a game. `src` is either a path on this site or a blob address.
    function boot(core, name, src) {
      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = src;
      window.EJS_gameName = name || '';
      window.EJS_pathtodata = DATA_PATH;
      window.EJS_startOnLoaded = true;
      window.EJS_color = '#6ee7a8';

      const s = document.createElement('script');
      s.src = DATA_PATH + 'loader.js';
      s.onerror = setupMissing;
      document.body.appendChild(s);
    }

    async function start(core, name, src) {
      try {
        const probe = await fetch(DATA_PATH + 'loader.js', { method: 'HEAD' });
        if (!probe.ok) return setupMissing();
      } catch (e) {
        return setupMissing();
      }
      boot(core, name, src);
    }

    // The vault sends the game over; a blob arrives as a File and never touches the network.
    window.addEventListener('message', (e) => {
      if (e.origin !== location.origin) return;
      const d = e.data;
      if (!d || d.type !== 'boot') return;
      const src = d.file ? URL.createObjectURL(d.file) : d.src;
      start(d.core, d.name, src);
    });

    // Also works on its own: console-player.html?core=nes&rom=roms/nes/game.nes
    const q = new URLSearchParams(location.search);
    if (q.get('rom')) start(q.get('core') || 'nes', q.get('name') || '', q.get('rom'));

    if (window.parent !== window) window.parent.postMessage({ type: 'player-ready' }, location.origin);
  </script>
</body>
</html>
