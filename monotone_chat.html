<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Site Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* --- THEME (matches chalkbored.win) --- */
  :root {
    --bg: #ffffff; --panel: #ffffff; --panel-2: #f5f4f1; --border: #d9d5cf;
    --accent: #3d4f4a; --accent-ink: #ffffff; --text: #171717; --muted: #8a8580;
    --bubble-mine: #171717; --bubble-mine-text: #ffffff; --bubble-theirs: #f0efeb; --danger: #b3261e;
    --shadow: 0 10px 28px rgba(0,0,0,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #171717; --panel: #171717; --panel-2: #232323; --border: rgba(255,255,255,0.12);
    --accent: #9db8ac; --accent-ink: #171717; --text: #f5f4f1; --muted: #9a958d;
    --bubble-mine: #3d4f4a; --bubble-mine-text: #ffffff; --bubble-theirs: #232323; --danger: #e8776d;
    --shadow: 0 10px 28px rgba(0,0,0,0.4);
  }

  /* --- BASE STYLES --- */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Source Serif 4', Georgia, serif; background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .widget {
    position: relative; width: 100%; max-width: 420px; height: 600px; max-height: 90vh;
    background: var(--panel); border-radius: 2px; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border);
  }

  /* --- HEADER & CONTROLS --- */
  header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header h1 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; margin: 0; letter-spacing: 0; }
  .header-right { display: flex; align-items: center; gap: 6px; }
  
  .theme-toggle, .presence {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 2px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .theme-toggle { width: 30px; height: 26px; }
  .theme-toggle:hover, .presence:hover { color: var(--text); border-color: var(--accent); }
  .presence { gap: 6px; font-size: 11px; padding: 4px 8px; font-family: 'Source Serif 4', serif; }
  
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  .channel-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #channel-select { flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 2px; padding: 6px 8px; font-size: 12px; font-family: 'Source Serif 4', serif; outline: none; }
  
  .icon-btn { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); border-radius: 2px; padding: 6px 10px; font-size: 12px; font-weight: 500; font-family: 'Source Serif 4', serif; cursor: pointer; }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }

  /* --- MESSAGES --- */
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
  .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
  
  .avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--accent-ink); flex-shrink: 0; }
  .bubble { background: var(--bubble-theirs); padding: 8px 12px; border-radius: 2px; font-size: 14px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
  .msg-row.mine .bubble { background: var(--bubble-mine); color: var(--bubble-mine-text); }
  
  .meta { font-size: 10px; color: var(--muted); margin: 0 2px 3px; display: flex; align-items: center; gap: 6px; }

  /* --- COMPOSER --- */
  form#composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
  #text-input { flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 2px; padding: 10px 14px; color: var(--text); font-family: 'Source Serif 4', serif; font-size: 14px; outline: none; }
  #text-input:focus { border-color: var(--accent); }
  
  button.primary { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 2px; padding: 0 18px; font-weight: 500; font-family: 'Source Serif 4', serif; cursor: pointer; font-size: 14px; }
  button.primary:hover { filter: brightness(1.1); }

  /* --- AUTH SCREEN --- */
  #auth-screen { position: absolute; inset: 0; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; z-index: 2; text-align: center; }
  #auth-screen h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin: 0; }
  .auth-input { width: 100%; max-width: 240px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 2px; padding: 10px 12px; color: var(--text); font-family: 'Source Serif 4', serif; text-align: center; outline: none; }
  .auth-input:focus { border-color: var(--accent); }
  .auth-btn-group { display: flex; gap: 10px; margin-top: 8px; }
  .auth-btn-group button { padding: 10px 20px; }
  #auth-error { color: var(--danger); font-size: 12px; min-height: 14px; }

  /* --- MODAL --- */
  .modal-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; z-index: 5; padding: 24px; }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 2px; padding: 20px; width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 10px; }
  .modal-box h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; margin: 0; }
  .modal-box p { font-size: 13px; color: var(--muted); margin: -4px 0 0; }
  .modal-box input { background: var(--panel-2); border: 1px solid var(--border); border-radius: 2px; padding: 8px 10px; color: var(--text); font-family: 'Source Serif 4', serif; font-size: 14px; outline: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .modal-actions button { padding: 8px 14px; font-size: 13px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="widget">

  <div id="auth-screen">
    <h2>Welcome to Chat</h2>
    <input id="auth-username" class="auth-input" maxlength="20" placeholder="Username" autocomplete="off" />
    <input id="auth-password" class="auth-input" type="password" placeholder="Password" />
    <div id="auth-error"></div>
    <div class="auth-btn-group">
      <button id="login-btn" class="primary" type="button">Login</button>
      <button id="register-btn" class="icon-btn" type="button">Register</button>
    </div>
  </div>

  <header>
    <h1>ChalkBored Chat</h1>
    <div class="header-right">
      <button id="theme-toggle" class="theme-toggle" title="Change Theme">🌙</button>
      <button id="presence-btn" class="presence">
        <span class="dot"></span><span id="online-count">— here</span>
      </button>
    </div>
  </header>

  <div class="channel-bar">
    <select id="channel-select"></select>
    <button id="new-channel-btn" class="icon-btn">+ New</button>
  </div>

  <div id="messages"></div>

  <form id="composer">
    <input id="text-input" maxlength="500" placeholder="Say something…" autocomplete="off" />
    <button type="submit" class="primary">Send</button>
  </form>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>
      <input id="modal-input" type="text" autocomplete="off" />
      <input id="modal-input-2" type="password" placeholder="Password (leave blank for public)" style="display:none;" autocomplete="off" />
      <div id="modal-error" style="color:var(--danger); font-size:12px;"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="icon-btn" type="button">Cancel</button>
        <button id="modal-confirm" class="primary" type="button">OK</button>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>
<script>
  // =========================================================
  // PASTE YOUR FIREBASE CONFIG HERE
  // =========================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAUlrcrPp7ngmLHmQffq7B6A0wcJ9s2Yl4",
    authDomain: "jf0isjiofser.firebaseapp.com",
    databaseURL: "https://jf0isjiofser-default-rtdb.firebaseio.com",
    projectId: "jf0isjiofser",
    messagingSenderId: "940625765565",
    appId: "1:940625765565:web:cca0f18c08e362e4f883d4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // --- STATE ---
  let myUsername = '';
  let currentChannel = 'general';
  let messagesRef = null;
  const themes = ['light', 'dark'];
  let currentThemeIndex = 0;

  // --- DOM ELEMENTS ---
  const authScreen = document.getElementById('auth-screen');
  const authUser = document.getElementById('auth-username');
  const authPass = document.getElementById('auth-password');
  const authError = document.getElementById('auth-error');
  const messagesEl = document.getElementById('messages');
  const channelSelect = document.getElementById('channel-select');
  const textInput = document.getElementById('text-input');
  const modalOverlay = document.getElementById('modal-overlay');
  
  // --- THEME CYCLING ---
  document.getElementById('theme-toggle').addEventListener('click', () => {
    currentThemeIndex = (currentThemeIndex + 1) % themes.length;
    document.documentElement.setAttribute('data-theme', themes[currentThemeIndex]);
    const icons = ['🌙', '☀️'];
    document.getElementById('theme-toggle').textContent = icons[currentThemeIndex];
  });

  // --- UTILS ---
  function slugify(str) { return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').slice(0, 30) || 'x'; }
  function colorFor(name) { let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h); return `hsl(${Math.abs(h)%360}, 65%, 60%)`; }
  
  // --- MODAL SYSTEM ---
  let modalCallback = null;
  function openModal(opts) {
    document.getElementById('modal-title').textContent = opts.title;
    document.getElementById('modal-message').textContent = opts.message || '';
    document.getElementById('modal-message').style.display = opts.message ? 'block' : 'none';
    document.getElementById('modal-input').style.display = opts.showInput ? 'block' : 'none';
    document.getElementById('modal-input-2').style.display = opts.showInput2 ? 'block' : 'none';
    document.getElementById('modal-input').placeholder = opts.placeholder || '';
    document.getElementById('modal-input').value = '';
    document.getElementById('modal-input-2').value = '';
    document.getElementById('modal-error').textContent = '';
    modalCallback = opts.onConfirm;
    modalOverlay.classList.remove('hidden');
    if (opts.showInput) document.getElementById('modal-input').focus();
  }
  function closeModal() { modalOverlay.classList.add('hidden'); }
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', () => {
    const val1 = document.getElementById('modal-input').value.trim();
    const val2 = document.getElementById('modal-input-2').value.trim();
    if(modalCallback) modalCallback(val1, val2);
  });

  // --- AUTHENTICATION ---
  // Google Sites' embed sandbox gives the page an opaque origin, which browsers treat as an
  // "insecure context" — and crypto.subtle silently refuses to run there. This pure-JS SHA-256
  // is the fallback for that case (verified to match crypto.subtle's output byte-for-byte).
  const SHA256_K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  function sha256Fallback(str) {
    function rrot(x, n) { return (x >>> n) | (x << (32 - n)); }
    let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const bytes = Array.from(new TextEncoder().encode(str));
    const bitLenLow = (bytes.length * 8) >>> 0;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bytes.push(0, 0, 0, 0);
    bytes.push((bitLenLow >>> 24) & 0xff, (bitLenLow >>> 16) & 0xff, (bitLenLow >>> 8) & 0xff, bitLenLow & 0xff);

    for (let chunkStart = 0; chunkStart < bytes.length; chunkStart += 64) {
      const w = new Array(64).fill(0);
      for (let i = 0; i < 16; i++) {
        w[i] = ((bytes[chunkStart + i*4] << 24) | (bytes[chunkStart + i*4 + 1] << 16) | (bytes[chunkStart + i*4 + 2] << 8) | (bytes[chunkStart + i*4 + 3])) >>> 0;
      }
      for (let i = 16; i < 64; i++) {
        const s0 = rrot(w[i-15], 7) ^ rrot(w[i-15], 18) ^ (w[i-15] >>> 3);
        const s1 = rrot(w[i-2], 17) ^ rrot(w[i-2], 19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,hh] = h;
      for (let i = 0; i < 64; i++) {
        const S1 = rrot(e,6) ^ rrot(e,11) ^ rrot(e,25);
        const ch = (e & f) ^ (~e & g);
        const temp1 = (hh + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
        const S0 = rrot(a,2) ^ rrot(a,13) ^ rrot(a,22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) >>> 0;
        hh = g; g = f; f = e; e = (d + temp1) >>> 0;
        d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
      }
      h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
      h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+hh)>>>0;
    }
    return h.map(x => x.toString(16).padStart(8, '0')).join('');
  }

  async function hashPassword(pass) {
    if (window.crypto && window.crypto.subtle) {
      try {
        const data = new TextEncoder().encode(pass);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) {
        // crypto.subtle exists but refused to run (e.g. insecure/opaque-origin context) — fall through.
      }
    }
    return sha256Fallback(pass);
  }

  async function handleAuth(isRegister) {
    const user = authUser.value.trim().toLowerCase();
    const pass = authPass.value.trim();
    if(!user || !pass) return authError.textContent = "Enter a username and password.";
    if(!/^[a-z0-9_]{3,20}$/.test(user)) return authError.textContent = "Usernames: 3-20 letters, numbers, or underscores.";

    authError.textContent = "Checking...";
    const passHash = await hashPassword(pass);
    db.ref(`users/${user}`).once('value').then(snap => {
      const exists = snap.exists();
      if (isRegister) {
        if (exists) return authError.textContent = "Username taken bro, pick another.";
        return db.ref(`users/${user}`).set({ password: passHash }).then(() => loginSuccess(user));
      } else {
        if (!exists) return authError.textContent = "Account not found.";
        if (snap.val().password !== passHash) return authError.textContent = "Wrong password.";
        loginSuccess(user);
      }
    }).catch(err => {
      authError.textContent = "Couldn't reach the database (" + (err.code || err.message) + "). Check your Firebase rules.";
    });
  }

  function loginSuccess(user) {
    myUsername = user;
    authScreen.style.display = 'none';
    loadChannels();
    setupPresence();
  }

  document.getElementById('login-btn').addEventListener('click', () => handleAuth(false));
  document.getElementById('register-btn').addEventListener('click', () => handleAuth(true));

  // --- CHANNELS & MESSAGES ---
  function loadChannels() {
    db.ref('channelNames').on('value', snap => {
      const names = snap.val() || { general: 'General' };
      db.ref('channelPasswords').once('value', passSnap => {
        const locked = passSnap.val() || {};
        channelSelect.innerHTML = '';
        Object.keys(names).forEach(slug => {
          const opt = document.createElement('option');
          opt.value = slug;
          opt.textContent = locked[slug] ? `🔒 ${names[slug]}` : names[slug];
          channelSelect.appendChild(opt);
        });
        channelSelect.value = currentChannel;
      });
    });
    switchChannel('general');
  }

  channelSelect.addEventListener('change', () => {
    const selected = channelSelect.value;
    
    // Check if room is private
    db.ref(`channelPasswords/${selected}`).once('value', snap => {
      if (snap.exists() && selected !== 'general') {
        const actualHash = snap.val();
        openModal({
          title: "Private Room",
          message: "This channel requires a password.",
          showInput: true,
          placeholder: "Room Password",
          onConfirm: async (inputPass) => {
            const inputHash = await hashPassword(inputPass);
            if (inputHash === actualHash) {
              closeModal();
              switchChannel(selected);
            } else {
              document.getElementById('modal-error').textContent = "Incorrect room password.";
            }
          }
        });
        // Revert dropdown visually if they cancel/fail
        channelSelect.value = currentChannel; 
      } else {
        switchChannel(selected);
      }
    });
  });

  function switchChannel(slug) {
    if (messagesRef) messagesRef.off();
    currentChannel = slug;
    channelSelect.value = slug;
    messagesEl.innerHTML = '';
    
    messagesRef = db.ref(`channels/${slug}/messages`).limitToLast(100);
    messagesRef.on('child_added', snap => {
      const msg = snap.val();
      const isMine = msg.name === myUsername;
      const row = document.createElement('div');
      row.className = 'msg-row' + (isMine ? ' mine' : '');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.style.background = colorFor(msg.name || '?');
      avatar.textContent = (msg.name || '?').slice(0, 2).toUpperCase();

      const wrap = document.createElement('div');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = isMine ? 'You' : (msg.name || 'Someone');
      meta.appendChild(nameSpan);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.text || ''; // textContent (never innerHTML) keeps this XSS-safe

      wrap.appendChild(meta);
      wrap.appendChild(bubble);
      row.appendChild(avatar);
      row.appendChild(wrap);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  // --- CREATE NEW CHANNEL ---
  document.getElementById('new-channel-btn').addEventListener('click', () => {
    openModal({
      title: 'Create Channel',
      showInput: true, placeholder: 'Channel Name',
      showInput2: true, // For optional password
      onConfirm: async (name, pass) => {
        if (!name) return document.getElementById('modal-error').textContent = 'Name required';
        const slug = slugify(name);
        db.ref(`channelNames/${slug}`).set(name);
        if (pass) db.ref(`channelPasswords/${slug}`).set(await hashPassword(pass)); // Store hashed, never plain text
        closeModal();
        switchChannel(slug);
      }
    });
  });

  // --- SEND MESSAGE ---
  document.getElementById('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text) return;
    db.ref(`channels/${currentChannel}/messages`).push({ name: myUsername, text, ts: Date.now() });
    textInput.value = '';
  });

  // --- PRESENCE (ONLINE COUNT) ---
  function setupPresence() {
    const pRef = db.ref('presence');
    db.ref('.info/connected').on('value', snap => {
      if (snap.val() === true) {
        const myRef = pRef.push({ name: myUsername });
        myRef.onDisconnect().remove();
      }
    });
    pRef.on('value', snap => {
      document.getElementById('online-count').textContent = `${snap.numChildren()} here`;
    });
  }
</script>
</body>
</html>
