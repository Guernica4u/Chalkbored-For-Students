<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Chalk TV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0c0d10; }
  #stage { position: fixed; inset: 0; background: #000; }
  #stage iframe { width: 100%; height: 100%; border: none; background: #000; display: block; }
  #overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: center; align-items: center;
    background: rgba(0,0,0,0.8); z-index: 1000;
  }
  #prompt-box {
    background: #1a1a1a; padding: 40px; border-radius: 8px; max-width: calc(100% - 32px);
    text-align: center; color: #e8e8e6; font-family: system-ui, sans-serif;
  }
  #prompt-box h2 { margin: 0 0 20px; font-size: 18px; }
  #prompt-box input {
    display: block; width: 300px; max-width: 100%; padding: 12px; margin: 10px 0;
    background: #2a2a2a; border: 1px solid #444; border-radius: 4px;
    color: #e8e8e6; font-size: 14px;
  }
  #prompt-box input:focus { outline: none; border-color: #6ee7a8; }
  #prompt-box button {
    padding: 12px 30px; background: #6ee7a8; color: #000;
    border: none; border-radius: 4px; font-size: 14px; cursor: pointer;
  }
  #prompt-box button:hover { background: #5cd698; }
  #prompt-box button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 15px; font-size: 13px; color: #c9534b; min-height: 18px; max-width: 300px; }
  #hint, #no-key { margin-top: 10px; font-size: 12px; color: #8a8a88; max-width: 300px; }
  #toast {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 6px;
    background: #1a1a1a; color: #e8e8e6; font: 13px system-ui, sans-serif;
    z-index: 1001; opacity: 0; transition: opacity 0.4s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  /* the address bar: tucked away as a small tab so video stays full screen */
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 900;
    display: flex; gap: 6px; align-items: center; padding: 8px;
    background: #1a1a1a; border-bottom: 1px solid #333;
    font: 14px system-ui, sans-serif; color: #e8e8e6;
    transform: translateY(-100%); transition: transform 0.2s;
  }
  #bar.open { transform: none; }
  #bar button {
    flex: none; min-width: 34px; height: 34px; padding: 0 10px;
    background: #2a2a2a; color: #e8e8e6; border: 1px solid #444; border-radius: 4px;
    font-size: 15px; cursor: pointer;
  }
  #bar button:hover { border-color: #6ee7a8; }
  #bar #go { background: #6ee7a8; color: #000; border-color: #6ee7a8; }
  #url {
    flex: 1; min-width: 0; height: 34px; padding: 0 10px;
    background: #2a2a2a; color: #e8e8e6; border: 1px solid #444; border-radius: 4px; font-size: 14px;
  }
  #url:focus { outline: none; border-color: #6ee7a8; }
  #handle {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 899;
    width: 64px; height: 16px; padding: 0; border: none; border-radius: 0 0 8px 8px;
    background: rgba(26,26,26,0.85); color: #8a8a88; font-size: 10px; line-height: 16px; cursor: pointer;
  }
  #edge { position: fixed; top: 0; left: 0; right: 0; height: 6px; z-index: 898; }
  #bar[hidden], #handle[hidden], #edge[hidden] { display: none; }
  @media (max-width: 480px) { #bar #back, #bar #fwd { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="edge" hidden></div>
<button id="handle" type="button" title="Address bar" aria-label="Show address bar" hidden>&#9660;</button>
<form id="bar" hidden>
  <button id="back" type="button" title="Back" aria-label="Back">&#8249;</button>
  <button id="fwd" type="button" title="Forward" aria-label="Forward">&#8250;</button>
  <button id="reload" type="button" title="Reload" aria-label="Reload">&#8635;</button>
  <button id="home" type="button" title="Back to the start page" aria-label="Home">&#8962;</button>
  <input id="url" type="text" placeholder="Type an address or search" autocomplete="off" spellcheck="false" aria-label="Address">
  <button id="go" type="submit">Go</button>
  <button id="hide" type="button" title="Hide" aria-label="Hide address bar">&#9650;</button>
</form>
<div id="overlay">
  <div id="prompt-box">
    <h2>Enter tide key</h2>
    <input type="password" id="key-input" placeholder="tide key" autocomplete="off" spellcheck="false">
    <button id="submit-btn" type="button">Go</button>
    <div id="status"></div>
    <div id="hint"></div>
    <div id="no-key">No key? The owner needs to give you one, or you need to self-host your own tide.</div>
  </div>
</div>
<div id="toast"></div>
<script>
// ============================================================
// CONFIGURATION: Set the page Chalk TV starts on here
// (the address bar at the top can go anywhere after that)
// ============================================================
const TARGET_URL = "youtube.com";

// ============================================================
// Do not edit below this line
// ============================================================

/* Chalk TV opens TARGET_URL through the tide, the same way Seahorse does in
   CHALK OS: the tide server on your own machine opens the connections, and
   Scramjet 2 rewrites what comes back so the site works.

   It borrows CHALK OS's tide files and its service worker instead of keeping
   copies. Scramjet 2 runs the tide from this page, and the service worker
   only hands each request over to it.

   The key is never written in this file. It is only kept in this browser if
   "Remember tide key" is turned on in Notebook's settings. */
const WISP_HOST = "tide.chalkbored.win";
const TIDE_KEY_STORE = "chalk-tv.tide";
const SETTINGS_STORE = "vault-settings";          /* Notebook's settings */
const TIDE_BASE = location.pathname.replace(/[^/]*$/, "") + "TOOLS/CHALK-OS/";

const overlay = document.getElementById("overlay");
const keyInput = document.getElementById("key-input");
const submitBtn = document.getElementById("submit-btn");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");
const stage = document.getElementById("stage");
const toastEl = document.getElementById("toast");

/* ---- the key ---- */
function rememberOn() {
  try { return !!(JSON.parse(localStorage.getItem(SETTINGS_STORE) || "null") || {}).rememberTide; }
  catch (e) { return false; }
}
function savedKey() {
  try { return localStorage.getItem(TIDE_KEY_STORE) || ""; } catch (e) { return ""; }
}
function saveKey(key) {
  try { if (rememberOn()) localStorage.setItem(TIDE_KEY_STORE, key); } catch (e) {}
}
function forgetKey() {
  try { localStorage.removeItem(TIDE_KEY_STORE); } catch (e) {}
}
/* the old version kept a key under this name that nothing could use */
try { localStorage.removeItem("chalk-tv.tide.enc"); } catch (e) {}
if (!rememberOn()) forgetKey();

/* ---- where to go ---- */
function targetUrl() {
  let raw = String(TARGET_URL || "").trim();
  if (!raw || raw === "PUT_YOUR_URL_HERE") return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(raw)) raw = "https://" + raw;
  try {
    const u = new URL(raw);
    return /^https?:$/.test(u.protocol) ? u.href : null;
  } catch (e) { return null; }
}

/* ---- the connection: always encrypted, never plain ws:// ---- */
function wispHostOk() {
  return /^[a-z0-9.-]+(:\d+)?$/i.test(WISP_HOST);
}
function tideWisp(key) {
  return "wss://" + WISP_HOST + "/wisp/" + encodeURIComponent(key) + "/";
}
function secureReason() {
  if (location.protocol !== "https:" && !window.isSecureContext)
    return "Chalk TV only runs on an https:// address, so nothing goes out unencrypted.";
  if (!("serviceWorker" in navigator))
    return "This browser cannot run the tide here. Private windows in Firefox block it.";
  if (!wispHostOk())
    return "The tide address in this file is not valid.";
  return "";
}
/* a plain connection to the server, which is exactly what it checks the key on */
function testKey(key) {
  return new Promise(resolve => {
    let done = false;
    const finish = r => { if (!done) { done = true; resolve(r); } };
    let ws;
    try { ws = new WebSocket(tideWisp(key)); }
    catch (e) { return finish({ ok: false, why: "The tide address will not do." }); }
    const timer = setTimeout(() => {
      try { ws.close(); } catch (e) {}
      finish({ ok: false, why: "No answer from the tide. Is the machine on?" });
    }, 9000);
    ws.onopen = () => { clearTimeout(timer); try { ws.close(); } catch (e) {} finish({ ok: true }); };
    ws.onerror = ws.onclose = () => {
      clearTimeout(timer);
      finish({ ok: false, why: "Turned away. Check the tide key and try again." });
    };
  });
}

/* ---- starting the tide (kept in step with tideStart() in CHALK OS) ---- */
function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => ok();
    s.onerror = () => fail(new Error("The tide files did not load. Is TOOLS/CHALK-OS/tide/ uploaded?"));
    document.head.appendChild(s);
  });
}
/* navigator.serviceWorker.ready only settles for a worker that covers this
   page, and this page sits outside TOOLS/CHALK-OS/ - so wait on the
   registration itself */
function workerActive(reg) {
  if (reg.active) return Promise.resolve(reg.active);
  const w = reg.installing || reg.waiting;
  return new Promise((ok, fail) => {
    const timer = setTimeout(() => fail(new Error("The tide's service worker did not start.")), 15000);
    w.addEventListener("statechange", () => {
      if (w.state === "activated") { clearTimeout(timer); ok(reg.active || w); }
      else if (w.state === "redundant") { clearTimeout(timer); fail(new Error("The tide's service worker did not start.")); }
    });
  });
}
async function startTide(key) {
  const reg = await navigator.serviceWorker.register(TIDE_BASE + "sw.js", { scope: TIDE_BASE, updateViaCache: "none" });
  const sw = await workerActive(reg);
  await loadScript(TIDE_BASE + "tide/scram/scramjet.js");
  await loadScript(TIDE_BASE + "tide/controller/controller.api.js");
  await loadScript(TIDE_BASE + "tide/libcurl/libcurl-client.js");
  if (!window.$scramjet || !window.$scramjetController || !window.LibcurlTransport)
    throw new Error("The tide files did not load properly.");
  const ctl = new $scramjetController.Controller({
    serviceworker: sw,
    transport: new LibcurlTransport.LibcurlClient({ wisp: tideWisp(key) }),
    config: {
      prefix: TIDE_BASE + "tide/go/",
      scramjetPath: TIDE_BASE + "tide/scram/scramjet.js",
      injectPath: TIDE_BASE + "tide/controller/controller.inject.js",
      wasmPath: TIDE_BASE + "tide/scram/scramjet.wasm"
    }
  });
  await ctl.wait();
  return ctl;
}
function tvFrame(ctl) {
  const sf = ctl.createFrame();
  const { Tap, BareResponse } = $scramjet;
  /* Chalk TV has nowhere to put downloads, so they are dropped rather than saved */
  Tap.tap(sf.hooks.fetch.preresponse, (ctx, props) => {
    const r = props.response;
    const dest = ctx.parsed.destination || ctx.request.rawDestination;
    if (!/^\s*attachment/i.test(r.headers.get("content-disposition") || "") || (dest !== "document" && dest !== "iframe")) return;
    try { r.body && r.body.cancel(); } catch (e) {}
    props.response = BareResponse.fromNativeResponse(new Response(null, { status: 204 }));
  });
  /* where streams cannot be passed on, each answer goes over whole */
  if (!canStream()) Tap.tap(sf.hooks.fetch.response, async (ctx, props) => {
    const body = props.response.body;
    if (body instanceof ReadableStream) props.response.body = await new Response(body).arrayBuffer();
  });
  return sf;
}

/* Firefox cannot pass a stream between pages, so video mostly will not play */
function canStream() {
  try {
    const ch = new MessageChannel();
    const rs = new ReadableStream();
    ch.port1.postMessage(rs, [rs]);
    return true;
  } catch (e) { return false; }
}
function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 8000);
}

/* ---- the panic key ----
   Notebook arms the panic key on this page when it opens Chalk TV in a new
   tab, but key presses on the site itself land in the tide frame and never
   get here. Hand each one up as a copy, so whatever key is set in Notebook
   still works. Typing into a box on the site is left alone. */
function passKeysUp(frame) {
  const attach = () => {
    let win;
    try { win = frame.contentWindow; if (!win || win.__chalkKeys) return; win.__chalkKeys = true; }
    catch (e) { return; }
    win.addEventListener("keydown", e => {
      const el = e.target;
      if (el && el.closest && el.closest("input, textarea, select, [contenteditable=''], [contenteditable='true']")) return;
      document.dispatchEvent(new KeyboardEvent("keydown", {
        key: e.key, code: e.code, ctrlKey: e.ctrlKey, altKey: e.altKey,
        shiftKey: e.shiftKey, metaKey: e.metaKey, bubbles: true, cancelable: true
      }));
    }, true);
  };
  frame.addEventListener("load", attach);
  attach();
}

/* ---- the address bar ---- */
const bar = document.getElementById("bar");
const urlInput = document.getElementById("url");
const handle = document.getElementById("handle");
const edge = document.getElementById("edge");

/* An address as typed: a full link, a bare site name, or else a search */
function typedUrl(text) {
  const t = String(text || "").trim();
  if (!t) return null;
  if (/^https?:\/\//i.test(t)) { try { return new URL(t).href; } catch (e) { return null; } }
  if (!/\s/.test(t) && /^[^\/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(t)) {
    try { return new URL("https://" + t).href; } catch (e) {}
  }
  return "https://duckduckgo.com/?q=" + encodeURIComponent(t);
}
function openBar() { bar.classList.add("open"); handle.hidden = true; }
function closeBar() {
  if (bar.contains(document.activeElement)) document.activeElement.blur();
  bar.classList.remove("open"); handle.hidden = false;
}
function setupBar(sf) {
  bar.hidden = false; edge.hidden = false; handle.hidden = false;
  handle.onclick = () => { openBar(); urlInput.focus(); urlInput.select(); };
  edge.onmouseenter = openBar;
  bar.onmouseleave = () => { if (!bar.contains(document.activeElement)) closeBar(); };
  document.getElementById("hide").onclick = closeBar;
  document.getElementById("back").onclick = () => sf.back();
  document.getElementById("fwd").onclick = () => sf.forward();
  document.getElementById("reload").onclick = () => sf.reload();
  document.getElementById("home").onclick = () => { sf.go(targetUrl()); closeBar(); };
  bar.onsubmit = e => {
    e.preventDefault();
    const url = typedUrl(urlInput.value);
    if (!url) return;
    sf.go(url);
    closeBar();
  };
  urlInput.onkeydown = e => { if (e.key === "Escape") closeBar(); };

  /* keep the box showing the real address of whatever is open, including
     links clicked and pages that change their own address */
  let last = "";
  const check = () => {
    let href;
    try { href = sf.element.contentWindow.location.href; } catch (e) { return; }
    if (!href || !href.startsWith(sf.context.prefix.href)) return;
    let url;
    try { url = $scramjet.unrewriteUrl(href, sf.context); } catch (e) { return; }
    if (!url || url === last) return;
    last = url;
    if (document.activeElement !== urlInput) urlInput.value = url;
  };
  sf.element.addEventListener("load", check);
  setInterval(check, 1000);
}

/* ---- going ---- */
let busy = false;
async function connect(key, fromSaved) {
  if (busy) return;
  const why = secureReason();
  if (why) return showPrompt(why);
  const url = targetUrl();
  if (!url) return showPrompt("No target URL configured. Edit this file and set TARGET_URL.");

  busy = true;
  submitBtn.disabled = true;
  statusEl.textContent = "Connecting...";
  const test = await testKey(key);
  if (!test.ok) {
    busy = false;
    /* a saved key the tide turns away is no good any more */
    if (fromSaved && /Turned away/.test(test.why)) forgetKey();
    return showPrompt(test.why);
  }
  let ctl;
  try { ctl = await startTide(key); }
  catch (err) {
    busy = false;
    return showPrompt(err.message || "The tide would not start.");
  }
  saveKey(key);
  keyInput.value = "";
  const sf = tvFrame(ctl);
  sf.element.title = "Chalk TV";
  sf.element.allow = "fullscreen; autoplay; encrypted-media; picture-in-picture";
  sf.element.allowFullscreen = true;
  stage.appendChild(sf.element);
  passKeysUp(sf.element);
  setupBar(sf);
  urlInput.value = url;
  sf.go(url);
  overlay.style.display = "none";
  if (!canStream()) toast("Video mostly won't play through the tide in Firefox. Chrome or Edge can do it.");
}

function showPrompt(message) {
  overlay.style.display = "flex";
  submitBtn.disabled = false;
  statusEl.textContent = message || "";
  hintEl.textContent = rememberOn()
    ? "This browser will remember the key."
    : "To stay signed in, turn on Remember tide key in Notebook's settings.";
  keyInput.focus();
}

submitBtn.onclick = () => {
  const key = keyInput.value.trim();
  if (!key) { statusEl.textContent = "Please enter a tide key"; return; }
  connect(key, false);
};
keyInput.onkeydown = e => { if (e.key === "Enter") submitBtn.click(); };

/* Start: go straight in with a remembered key, otherwise ask */
const remembered = rememberOn() ? savedKey() : "";
if (remembered) { showPrompt(""); connect(remembered, true); }
else showPrompt("");
</script>
</body>
</html>
