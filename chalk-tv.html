<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalk TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --ink: #e8e8e6;
    --muted: #6f7680;
    --line: #23262c;
    --accent: #6ee7a8;
    --accent-dim: #2f6b4f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  .set {
    width: 132px;
    margin: 0 auto 2rem;
    color: var(--accent-dim);
  }

  .set svg { width: 100%; height: auto; display: block; }

  /* the screen gently flickers, like a set warming up */
  .screen { animation: warm 3.2s ease-in-out infinite; }
  @keyframes warm { 50% { opacity: 0.55; } }

  h1 {
    margin: 0 0 0.6rem;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .soon {
    margin: 0 0 1rem;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }

  p.line {
    margin: 0 auto;
    max-width: 38ch;
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="set" aria-hidden="true">
      <svg viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M44 6 60 20 76 6"/>
        <rect x="6" y="20" width="108" height="64" rx="8"/>
        <rect class="screen" x="16" y="30" width="72" height="44" rx="4" fill="currentColor" fill-opacity="0.15"/>
        <circle cx="101" cy="40" r="4"/>
        <circle cx="101" cy="56" r="4"/>
        <path d="M30 84v6M90 84v6"/>
      </svg>
    </div>
    <p class="soon">Coming soon</p>
    <h1>Chalk TV</h1>
    <p class="line">Something to watch, right here in the vault. It's being built.</p>
  </main>
</body>
</html>
