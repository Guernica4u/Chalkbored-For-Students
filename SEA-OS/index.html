    const now = asVideo ? video : audio;
    const other = asVideo ? audio : video;
    try { other.removeAttribute("src"); other.load(); } catch (e){}

  }

  /* ---- YouTube, in YouTube's own player, driven by Media's controls ---- */
  async function playYouTube(t){

    const holder = el("div");

      host: "https://www.youtube-nocookie.com",

      events: {
        onReady: e => { e.target.setVolume(Number(vol.value)); e.target.playVideo(); },
        onStateChange: e => {
          if (tracks[at] !== t) return;
          if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.PAUSED){
            playBtn.innerHTML = e.data === YT.PlayerState.PLAYING ? "&#10074;&#10074;" : "&#9654;";
            /* a playlist moves on by itself, so follow its title */
            const d = yt && yt.getVideoData ? yt.getVideoData() : null;
            if (t.list && d && d.title) $(".mu-title", B).textContent = d.title;
            nowPlaying(win, (d && d.title) || t.title, e.data === YT.PlayerState.PLAYING);
            drawList();
          } else if (e.data === YT.PlayerState.ENDED && !t.list && at + 1 < tracks.length){
            playIndex(at + 1);
          }
        },
        onError: e => {
          if (tracks[at] !== t) return;
          const why = e.data === 101 || e.data === 150
            ? "Whoever uploaded this does not let it play outside YouTube."
            : e.data === 100 ? "That video is private, or has been removed."
            : e.data === 2 ? "That does not look like a real video link."
            : "YouTube could not play this one (error " + e.data + ").";
          $(".mu-sub", B).textContent = why;
          openBtn.classList.add("on");
          openBtn.onclick = () => window.open(t.url, "_blank", "noopener");
        }
      }
    });
    clearInterval(ytPoll);
    ytPoll = setInterval(() => {
      if (!yt || !yt.getDuration || seeking) return;
      const d = yt.getDuration(), c = yt.getCurrentTime();
      if (d) seek.value = String(Math.round(c / d * 1000));
      timeEl.textContent = fmtTime(c) + " / " + fmtTime(d);
    }, 500);
  }

  /* ---- the link button ---- */
  async function playLink(){
    const raw = await osPrompt("Play a link", "Paste a YouTube link, or a direct link to an audio or video file.", "");
    if (!raw) return;
    const url = raw.trim();
    const y = parseYouTube(url);
    let item;
    if (y){
      const canonical = y.id
        ? "https://www.youtube.com/watch?v=" + y.id + (y.list ? "&list=" + encodeURIComponent(y.list) : "")
        : "https://www.youtube.com/playlist?list=" + encodeURIComponent(y.list);
      $(".mu-sub", B).textContent = "Looking it up…";
      const info = await youTubeInfo(canonical);
      item = { kind: "yt", url: canonical, id: y.id, list: y.list,
               title: (info && info.title) || (y.id ? "YouTube video" : "YouTube playlist"),
               author: (info && info.author) || "YouTube", thumb: (info && info.thumb) || "" };
    } else if (/^https?:\/\//i.test(url) && (isAudio(pathOfUrl(url)) || isVideo(pathOfUrl(url)))){
      item = { kind: "file", url, title: baseName(pathOfUrl(url)) || url, author: hostOfUrl(url) };
    } else {
      return osAlert("That link will not play here",
        "Media plays YouTube links, and links straight to an audio or video file - ones ending in .mp3, .mp4 and so on. " +
        "Other sites only play in their own players, which cannot be shown here.");
    }
    rememberWebMedia(item);
    scan();
    playIndex(tracks.findIndex(x => isWeb(x) && x.url === item.url));
  }

  function play(path){
    scan();
    const i = tracks.indexOf(path);
    if (i >= 0) playIndex(i);
  }
  function toggle(){
    if (!tracks.length) return;
    if (at < 0) return playIndex(0);
    if (mode === "yt"){
      if (!yt || !yt.getPlayerState) return;
      ytPlaying() ? yt.pauseVideo() : yt.playVideo();
    } else {
      media.paused ? media.play().catch(() => {}) : media.pause();
    }
  }
  function step(dir){
    if (!tracks.length) return;
    const t = tracks[at];
    if (mode === "yt" && t && t.list && yt && yt.nextVideo) return dir > 0 ? yt.nextVideo() : yt.previousVideo();
    playIndex((at + dir + tracks.length) % tracks.length);
  }

  playBtn.onclick = toggle;
  $('[data-m="next"]', B).onclick = () => step(1);
  $('[data-m="prev"]', B).onclick = () => step(-1);
  $('[data-m="link"]', B).onclick = playLink;
  for (const m of [audio, video]){
    m.onplay = m.onpause = () => {
      if (m !== media || mode !== "file") return;
      playBtn.innerHTML = m.paused ? "&#9654;" : "&#10074;&#10074;";
      drawList();
      nowPlaying(win, at >= 0 ? titleOf(tracks[at]) : "", !m.paused);
    };
    m.onended = () => { if (m === media && mode === "file" && at + 1 < tracks.length) playIndex(at + 1); };
    m.ontimeupdate = () => {
      if (m !== media || mode !== "file" || seeking || !m.duration) return;
      seek.value = String(Math.round(m.currentTime / m.duration * 1000));
      timeEl.textContent = fmtTime(m.currentTime) + " / " + fmtTime(m.duration);
    };
    m.onerror = () => {
      if (m !== media || mode !== "file" || at < 0) return;
      $(".mu-sub", B).textContent = isWeb(tracks[at])
        ? "That link would not play - the file may be gone, or the site blocks playing it elsewhere."
        : "That file could not be played.";
    };
    m.volume = 0.9;
  }
  seek.oninput = () => { seeking = true; };
  seek.onchange = () => {
    if (mode === "yt"){
      if (yt && yt.getDuration && yt.getDuration()) yt.seekTo(seek.value / 1000 * yt.getDuration(), true);
    } else if (media.duration) media.currentTime = seek.value / 1000 * media.duration;
    seeking = false;
  };
  vol.oninput = () => {
    audio.volume = video.volume = vol.value / 100;
    if (yt && yt.setVolume) yt.setVolume(Number(vol.value));
  };

  scan();
  if (startPath) play(startPath);
  return {
    play,
    refresh: scan,
    menus(){
      return {
        File: [
          { label: "Play a link…", run: playLink },
          { label: "Open from Files…", run: async () => {
              const p = await pickFile({ title: "Play something", ok: "Play", start: HOME + "/Music",
                                         accept: nm => isAudio(nm) || isVideo(nm) });
              if (p) play(p);
            } },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "Rescan library", run: scan },
          { label: "Next", run: () => step(1) },
          { label: "Previous", run: () => step(-1) }
        ]
      };
    },
    toggle,
    next: () => step(1),
    onClose(){
      if (NowPlaying.win === win) nowPlaying(null);
      stopAll();
      audio.src = "";
      video.removeAttribute("src");
      return true;
    }
  };
}

/* ============================================================
   12g. Chat - runs chat.html, which lives beside this file

   This one is first-party: it ships with SEA OS rather than being
   something you imported, so it gets same-origin privileges and can
   talk to Firebase normally. Files you import stay in an opaque-origin
   sandbox as before.
   ============================================================ */
function chatApp(win){
  const B = win.body;
  B.innerHTML = '<div class="chat-wrap"><div class="chat-loading">Opening chat\u2026</div></div>';
  const wrap = $(".chat-wrap", B);
  let settled = false;

  function missing(why){
    if (settled) return;
    settled = true;
    wrap.innerHTML = "";
    const p = el("div", "chat-missing");
    p.append(
      el("div", "chat-missing-g", "\uD83D\uDCAC"),
      el("h2", null, "chat.html is not here"),
      el("p", null, why || "Chat lives in its own file. Put chat.html in the same folder as SEA OS and open this again."),
      el("p", "wb-none", "On GitHub Pages that means committing chat.html next to index.html.")
    );
    const again = el("button", "btn primary", "Try again");
    again.onclick = () => { win.close(); launch("chat"); };
    p.appendChild(again);
    wrap.appendChild(p);
  }
  /* Paint the chat in the desktop's colours, and keep it in step with the
     theme. chat.html keeps its own palette when opened on its own. */
  function sendTheme(){
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    const dark = State.theme === "dark";
    const frame = $(".chat-frame", B);
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ boxtheme: {
      bg: v("--bg"), panel: v("--surface"), panel2: v("--surface-2"),
      border: v("--border-soft"), accent: v("--accent"), accentInk: v("--accent-fg"),
      text: v("--text"), muted: v("--dim"),
      mine: v("--accent") + (dark ? "33" : "22"),
      theirs: v("--surface-2"), danger: "#c9534b"
    } }, "*");
  }
  /* setInterval hands back a number, so the last value it sent lives here */
  let themeSent = "";
  const themeWatch = setInterval(() => {
    const now = State.theme + State.accent;
    if (themeSent !== now){ themeSent = now; sendTheme(); }
  }, 600);

  function mount(html){
    wrap.innerHTML = "";
    const frame = el("iframe", "chat-frame");
    frame.title = "Chat";
    /* first-party: it ships with SEA OS, so it runs same-origin and can reach
       Firebase normally. HTML you import yourself stays sandboxed. */
    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-modals");
    frame.addEventListener("load", () => {
      try {
        const d = frame.contentDocument;
        if (!d || !d.body || !d.body.children.length) return missing();
      } catch (e){ /* cross-origin means it genuinely loaded */ }
      settled = true;
      sendTheme();
      aiStatusToChat();
      chatSeen();
    });
    /* Mounted from the copy we already fetched, so it is never a stale
       cached one and the browser only asks for the file once. */
    if (html) frame.srcdoc = html; else frame.src = "chat.html";
    wrap.appendChild(frame);
    setTimeout(() => { if (!settled) missing("chat.html did not finish loading."); }, 8000);
  }

  /* A 404 page still has content, so "is the document empty" is not enough -
     ask the server what it thinks first. On file:// fetch is blocked, and we
     fall back to the emptiness check, which does work there. */
  (async () => {
    try {
      const res = await fetch("chat.html", { cache: "no-store" });
      if (!res.ok) return missing("The folder next to SEA OS has no chat.html (the server returned " + res.status + ").");
      const text = await res.text();
      if (!/<html|<body|firebase/i.test(text)) return missing("chat.html is there but does not look like the chat page.");
      if (!settled) return mount(text);
    } catch (e){
      /* file:// or offline - let the frame try on its own */
    }
    if (!settled) mount();
  })();

  return { onClose(){ clearInterval(themeWatch); return true; } };
}
/* ============================================================
   12g2. Videos - a library with posters and a player meant for
   watching, rather than the track list Media uses
   ============================================================ */
function videosApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="vd-bar">' +
      '<button class="tb-btn vd-back" title="Back to the library">&#8592;</button>' +
      '<span class="vd-title">Videos</span>' +
      '<span style="flex:1"></span>' +
      '<input class="vd-find" spellcheck="false" autocomplete="off" placeholder="Filter">' +
      '<button class="tb-btn" data-v="refresh" title="Look again">&#8635;</button>' +
    '</div>' +
    '<div class="vd-grid"></div>' +
    '<div class="vd-player">' +
      '<video playsinline></video>' +
      '<div class="vd-oops"><b>This one will not play here</b>' +
      'Your browser has no decoder for this format. Ogg Theora (.ogv) is the usual ' +
      'culprit - Chrome dropped it, and Wikimedia Commons is full of it.<br>' +
      '<small>MP4 and WebM both work. Try another result from unbox.</small></div>' +
      '<div class="vd-ctl">' +
        '<button class="tb-btn" data-v="prev" title="Previous">&#9198;</button>' +
        '<button class="tb-btn accent" data-v="play" title="Play or pause">&#9654;</button>' +
        '<button class="tb-btn" data-v="next" title="Next">&#9197;</button>' +
        '<input class="vd-seek" type="range" min="0" max="1000" value="0" title="Seek">' +
        '<span class="vd-time">0:00 / 0:00</span>' +
        '<input class="vd-vol" type="range" min="0" max="100" value="90" title="Volume">' +
        '<button class="tb-btn" data-v="full" title="Full screen">&#9974;</button>' +
      '</div>' +
    '</div>';

  const grid = $(".vd-grid", B), video = $(".vd-player video", B);
  const seek = $(".vd-seek", B), vol = $(".vd-vol", B), timeEl = $(".vd-time", B);
  const find = $(".vd-find", B), titleEl = $(".vd-title", B);
  const vb = k => $('[data-v="' + k + '"]', B);
  let all = [], shown = [], at = -1, seeking = false;

  const fmtTime = s => (Number.isFinite(s)
    ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0")
    : "0:00");
  const watching = () => B.classList.contains("playing");

  function scan(){
    all = [];
    walkFS((p, n, name) => { if (n.type === "file" && isVideo(name)) all.push(p); });
    draw();
  }
  function draw(){
    const q = find.value.trim().toLowerCase();
    const playingPath = at >= 0 ? shown[at] : null;
    shown = q ? all.filter(p => baseName(p).toLowerCase().includes(q)) : all.slice();
    at = playingPath ? shown.indexOf(playingPath) : -1;
    grid.innerHTML = "";
    if (!shown.length){
      grid.appendChild(el("div", "vd-none", all.length
        ? "Nothing here matches that."
        : "No videos yet. Put an .mp4 in the videos folder of the repo, import one " +
          "in Files, or run  unbox video <words>  in the Terminal."));
      return;
    }
    const jobs = [];
    shown.forEach((p, i) => {
      const tile = el("button", "vd-tile" + (i === at ? " on" : ""));
      const shot = el("div", "vd-shot");
      const cv = el("canvas");
      shot.append(cv, el("span", "ph", "🎬"), el("span", "vd-dur", ""));
      const cap = el("div", "vd-cap");
      cap.append(el("div", "vd-n", baseName(p)), el("div", "vd-w", tilde(dirName(p))));
      tile.append(shot, cap);
      tile.title = baseName(p);
      tile.onclick = () => openAt(i);
      tile.oncontextmenu = e => {
        e.preventDefault(); e.stopPropagation();
        showCtx(e.clientX, e.clientY, [
          { icon: "▶", label: "Play", run: () => openAt(i) },
          { icon: "📁", label: "Show in Files", run: () => openInFiles(p) },
          "-",
          { icon: "🖼️", label: "Set as wallpaper", run: () => setWallpaperFrom(p) },
          { icon: "⏻", label: "Set as boot screen", run: () => setBootFrom(p) }
        ]);
      };
      grid.appendChild(tile);
      jobs.push({ path: p, cv, tile });
    });
    queuePosters(jobs);
  }

  /* posters are taken one video at a time, in the order the tiles are laid
     out, so a dozen of them do not all seek at once and stall the desktop */
  const queue = [];
  let busy = false, generation = 0;
  function queuePosters(jobs){
    const mine = ++generation;
    queue.length = 0;
    jobs.slice(0, 60).forEach(j => queue.push(Object.assign({ gen: mine }, j)));
    pump();
  }
  function pump(){
    if (busy) return;
    const job = queue.shift();
    if (!job) return;
    if (job.gen !== generation) return pump();
    const n = node(job.path);
    if (!n) return pump();
    busy = true;
    const v = document.createElement("video");
    v.preload = "metadata";
    v.muted = true;
    v.playsInline = true;
    let over = false;
    const timer = setTimeout(() => done(), 9000);
    function done(){
      if (over) return;
      over = true;
      clearTimeout(timer);
      try { v.removeAttribute("src"); v.load(); } catch (e){}
      busy = false;
      pump();
    }
    function shoot(){
      try {
        const w = v.videoWidth || 16, h = v.videoHeight || 9;
        job.cv.width = 320;
        job.cv.height = Math.round(320 * h / w);
        /* a frame from another origin taints the canvas, but it is only ever
           shown and never read back, so drawing it is still allowed */
        job.cv.getContext("2d").drawImage(v, 0, 0, job.cv.width, job.cv.height);
        job.cv.classList.add("got");
        const d = $(".vd-dur", job.tile);
        if (d && Number.isFinite(v.duration) && v.duration) d.textContent = fmtTime(v.duration);
      } catch (e){ /* a frame that will not paint just leaves the placeholder */ }
      done();
    }
    v.onloadeddata = () => {
      const want = Math.min(4, (v.duration || 8) / 5);
      if (Number.isFinite(want) && want > 0.1){ try { v.currentTime = want; return; } catch (e){} }
      shoot();
    };
    v.onseeked = shoot;
    v.onerror = () => {
      /* nothing to show for a format this browser will not decode */
      const d = $(".vd-dur", job.tile);
      if (d) d.textContent = "—";
      job.tile.classList.add("unplayable");
      job.tile.title = baseName(job.path) + " - this browser cannot play this format";
      done();
    };
    v.src = n.content;
  }

  function openAt(i){
    if (i < 0 || i >= shown.length) return;
    at = i;
    const p = shown[i], n = node(p);
    if (!n) return scan();
    B.classList.add("playing");
    B.classList.remove("badmedia");
    video.src = n.content;
    video.play().catch(() => {});
    titleEl.textContent = baseName(p);
    win.setTitle(baseName(p));
    vb("prev").disabled = i <= 0;
    vb("next").disabled = i >= shown.length - 1;
    drawMenuBar();
  }
  function library(){
    video.pause();
    B.classList.remove("playing");
    titleEl.textContent = "Videos";
    win.setTitle("Videos");
    draw();
    drawMenuBar();
  }
  function play(path){
    scan();
    let i = shown.indexOf(path);
    if (i < 0 && find.value){        /* it may be hidden by the filter */
      find.value = "";
      draw();
      i = shown.indexOf(path);
    }
    if (i >= 0) openAt(i);
  }

  $(".vd-back", B).onclick = library;
  vb("refresh").onclick = scan;
  vb("play").onclick = () => { if (video.paused) video.play().catch(() => {}); else video.pause(); };
  vb("prev").onclick = () => openAt(at - 1);
  vb("next").onclick = () => openAt(at + 1);
  vb("full").onclick = () => {
    const box = $(".vd-player", B);
    if (document.fullscreenElement) document.exitFullscreen();
    else if (box.requestFullscreen) box.requestFullscreen().catch(() => {});
  };
  find.oninput = draw;
  video.onerror = () => { if (video.src) B.classList.add("badmedia"); };
  video.onloadeddata = () => B.classList.remove("badmedia");
  video.onplay = () => { vb("play").innerHTML = "&#10073;&#10073;"; };
  video.onpause = () => { vb("play").innerHTML = "&#9654;"; };
  video.onended = () => { if (at < shown.length - 1) openAt(at + 1); };
  video.ontimeupdate = () => {
    if (!seeking && video.duration) seek.value = String(Math.round(video.currentTime / video.duration * 1000));
    timeEl.textContent = fmtTime(video.currentTime) + " / " + fmtTime(video.duration);
  };
  seek.oninput = () => { seeking = true; };
  seek.onchange = () => {
    seeking = false;
    if (video.duration) video.currentTime = video.duration * (seek.value / 1000);
  };
  vol.oninput = () => { video.volume = vol.value / 100; };
  video.volume = 0.9;

  scan();
  if (startPath) play(startPath);

  return {
    play,
    refresh: scan,
    menus(){
      return {
        File: [
          { label: "Open a video from Files…", run: async () => {
              const p = await pickFile({ title: "Play a video", ok: "Play", start: HOME + "/Videos",
                                         accept: nm => isVideo(nm) });
              if (p) play(p);
            } },
          { label: "Look for videos again", run: scan },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "Library", run: library, disabled: !watching() },
          { label: "Full screen", run: () => vb("full").click(), disabled: !watching() },
          "-",
          { label: "Set as wallpaper", disabled: at < 0, run: () => setWallpaperFrom(shown[at]) },
          { label: "Set as boot screen", disabled: at < 0, run: () => setBootFrom(shown[at]) }
        ]
      };
    },
    onClose(){ generation++; video.pause(); return true; }
  };
}

function helpApp(win, startTopic){
  const B = win.body;
  B.innerHTML =
    '<div class="hp-side"><div class="side-h">Help</div><div class="hp-list"></div></div>' +
    '<div class="hp-main"><input class="hp-find" spellcheck="false" autocomplete="off" ' +
    'placeholder="Search the help"><div class="hp-body"></div></div>';
  const list = $(".hp-list", B), body = $(".hp-body", B), find = $(".hp-find", B);
  let at = startTopic || HELP_TOPICS[0].id;

  const textOf = t => t.title + " " + t.body.map(b =>
    Array.isArray(b[1]) ? b[1].join(" ") : b[1]).join(" ");

  function drawList(){
    const q = find.value.trim().toLowerCase();
    list.innerHTML = "";
    const hits = q ? HELP_TOPICS.filter(t => textOf(t).toLowerCase().includes(q)) : HELP_TOPICS;
    if (!hits.length){
      list.appendChild(el("div", "hp-none", "Nothing about that."));
      return;
    }
    hits.forEach(t => {
      const b = el("button", "place" + (t.id === at ? " on" : ""));
      b.append(el("span", "g", t.icon), el("span", null, t.title));
      b.onclick = () => { at = t.id; drawList(); drawBody(); };
      list.appendChild(b);
    });
  }
  function drawBody(){
    const t = HELP_TOPICS.find(x => x.id === at) || HELP_TOPICS[0];
    body.innerHTML = "";
    body.appendChild(el("h1", null, t.title));
    t.body.forEach(part => {
      const [kind, val] = part;
      if (kind === "h") return body.appendChild(el("h2", null, val));
      if (kind === "p") return body.appendChild(el("p", null, val));
      if (kind === "c"){
        const pre = el("pre", "hp-code", val);
        return body.appendChild(pre);
      }
      if (kind === "l"){
        const ul = el("ul");
        val.forEach(li => ul.appendChild(el("li", null, li)));
        body.appendChild(ul);
      }
    });
    body.scrollTop = 0;
    win.setTitle("Help - " + t.title);
  }
  find.oninput = () => {
    drawList();
    const q = find.value.trim().toLowerCase();
    if (!q) return;
    const first = HELP_TOPICS.find(t => textOf(t).toLowerCase().includes(q));
    if (first && first.id !== at){ at = first.id; drawList(); drawBody(); }
  };
  drawList();
  drawBody();

  return {
    show(id){ at = id; drawList(); drawBody(); },
    menus(){
      return {
        File: [{ label: "Close Window", run: () => win.close() }],
        View: HELP_TOPICS.map(t => ({
          label: (t.id === at ? "• " : "   ") + t.title,
          run: () => { at = t.id; drawList(); drawBody(); }
        }))
      };
    }
  };
}
/* ============================================================
   12i. SEA Store - apps that are just HTML files

   An app is one .html file in the repo's apps/ folder, or one you made
   yourself and installed from Files. Its <title> is its name; optional
   <meta name="description">, <meta name="box-icon" content="emoji"> and
   <meta name="box-size" content="640x480"> fill in the rest.

   Apps run in the same opaque-origin sandbox as any imported page, so they
   cannot touch SEA OS, its storage or the AI key. What they can do goes
   through window.box, and every call is answered here:
     box.notify(title, body)
     box.saveFile(name, text)   into ~/Documents/<App name>/
     box.readFile(name)         from that same folder
     box.listFiles()
     box.openFile()             only what you pick in a dialog
   plus --box-* CSS variables that follow the desktop theme.
   ============================================================ */
const Bridged = new Set();      /* { frame, app, win } for each frame speaking window.box */

const BOX_BRIDGE = "\x3Cscript>(function(){" +
  "var n=0,wait={};" +
  "function call(op,args){return new Promise(function(ok,no){var id=++n;wait[id]=[ok,no];" +
    "parent.postMessage({boxapp:op,id:id,args:args||{}},'*');});}" +
  "addEventListener('message',function(e){if(e.source!==parent)return;var d=e.data||{};" +
    "if(d.boxtheme){var s=document.documentElement.style;for(var k in d.boxtheme)s.setProperty('--box-'+k,d.boxtheme[k]);" +
      "window.box.theme=d.boxtheme;try{dispatchEvent(new CustomEvent('boxtheme',{detail:d.boxtheme}));}catch(x){}return;}" +
    "var w=d.boxreply&&wait[d.boxreply];if(!w)return;delete wait[d.boxreply];" +
    "if(d.error)w[1](new Error(d.error));else w[0](d.value);});" +
  "window.box={theme:null," +
    "notify:function(t,b){return call('notify',{title:t,body:b});}," +
    "openFile:function(){return call('openFile');}," +
    "saveFile:function(name,content){return call('saveFile',{name:name,content:content});}," +
    "readFile:function(name){return call('readFile',{name:name});}," +
    "listFiles:function(){return call('listFiles');}," +
    "getHighScore:function(){return call('getHighScore');}," +
    "submitScore:function(n){return call('submitScore',{score:n});}};" +
  "parent.postMessage({boxapp:'hello',id:0,args:{}},'*');" +
  "})();</scr" + "ipt>";

function withBridge(html, base){
  const inject = (base ? '<base href="' + base.replace(/"/g, "%22") + '">' : "") + BOX_BRIDGE;
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + inject) : inject + html;
}
function boxPalette(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  return { bg: v("--bg"), surface: v("--surface"), "surface-2": v("--surface-2"), text: v("--text"),
           dim: v("--dim"), accent: v("--accent"), "accent-fg": v("--accent-fg"), border: v("--border-soft"),
           mode: State.theme };
}
function postTheme(b){
  try { if (b.frame && b.frame.contentWindow) b.frame.contentWindow.postMessage({ boxtheme: boxPalette() }, "*"); } catch (e){}
}
let bridgeThemeSent = "";
setInterval(() => {
  for (const b of Bridged) if (b.frame && !b.frame.isConnected) Bridged.delete(b);
  const now = State.theme + State.accent;
  if (now === bridgeThemeSent) return;
  bridgeThemeSent = now;
  Bridged.forEach(postTheme);
}, 700);

/* a name an app hands us becomes one plain file name, never a path */
const safeName = x => String(x || "").replace(/[\\/:*?"<>|]/g, "-").replace(/^[.\s]+/, "").trim().slice(0, 80);

addEventListener("message", async e => {
  const d = e.data;
  if (!d || typeof d.boxapp !== "string") return;
  const hit = Array.from(Bridged).find(b => b.frame && b.frame.contentWindow === e.source);
  if (!hit) return;
  const app = hit.app, args = d.args || {};
  const answer = (value, error) => {
    if (!d.id) return;
    try { e.source.postMessage({ boxreply: d.id, value: value === undefined ? null : value, error: error || null }, "*"); } catch (x){}
  };
  const dir = HOME + "/Documents/" + (safeName(app.name) || "App");
  try {
    switch (d.boxapp){
      case "hello":
        return postTheme(hit);
      case "notify":
        notify(String(args.title || app.name).slice(0, 80), String(args.body || "").slice(0, 300), app.icon);
        return answer(true);
      case "saveFile": {
        const name = safeName(args.name);
        if (!name) return answer(null, "saveFile needs a file name");
        ensureDir(dir);
        const text = typeof args.content === "string" ? args.content : JSON.stringify(args.content, null, 2);
        writeFile(dir + "/" + name, text, "text", "text/plain");
        refreshFilesViews();
        return answer(tilde(dir + "/" + name));
      }
      case "readFile": {
        const n = node(dir + "/" + safeName(args.name));
        return answer(n && n.type === "file" ? String(n.content) : null);
      }
      case "listFiles": {
        const n = node(dir);
        return answer(n && n.type === "dir" ? listDir(n).filter(k => n.children[k].type === "file") : []);
      }
      case "openFile": {
        const p = await pickFile({ title: app.name + " wants to open a file", ok: "Give it to " + app.name, start: HOME + "/Documents" });
        if (!p) return answer(null);
        const n = node(p);
        return answer({ name: baseName(p), kind: n.kind, mime: n.mime || "", content: n.content });
      }
      case "getHighScore":
        return answer((State.highScores || {})[app.id] || 0);
      case "submitScore": {
        const score = Math.max(0, Math.min(1e9, Math.floor(Number(args.score) || 0)));
        const old = (State.highScores || {})[app.id] || 0;
        if (score > old){
          State.highScores = Object.assign({}, State.highScores, { [app.id]: score });
          saveSettings();
          refreshGamesViews();
        }
        return answer({ best: Math.max(old, score), isNew: score > old });
      }
      default:
        return answer(null, "box." + d.boxapp + " does not exist");
    }
  } catch (err){
    answer(null, String((err && err.message) || err));
  }
});

/* ---- the catalogue ---- */
function storeMeta(html, src, prefix){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const meta = n => { const m = doc.querySelector('meta[name="' + n + '"]'); return m ? (m.getAttribute("content") || "").trim() : ""; };
  const size = /^(\d{3,4})\s*x\s*(\d{3,4})$/i.exec(meta("box-size"));
  const file = baseName(src.replace(/^fs:/, "")).replace(/\.html?$/i, "");
  /* an icon is text only - setAppIcon would render markup, and markup from
     an app has no business running in the desktop itself */
  const icon = meta("box-icon").replace(/[<>]/g, "").slice(0, 8);
  const title = doc.querySelector("title");
  const color = /^#[0-9a-f]{3,8}$/i.test(meta("box-color")) ? meta("box-color") : "";
  return {
    color,
    id: (prefix || "app") + ":" + (src.startsWith("fs:") ? "my-" : "") + (file.toLowerCase().replace(/[^a-z0-9]+/g, "-") || "app"),
    src,
    name: ((title && title.textContent) || "").trim().slice(0, 40) || file,
    desc: (meta("description") || "An app from the SEA Store").slice(0, 120),
    icon: icon || "🧩",
    w: size ? Math.min(1400, Math.max(280, +size[1])) : 720,
    h: size ? Math.min(1000, Math.max(200, +size[2])) : 520
  };
}
/* the file names in a repo folder: GitHub's API on a Pages site, the folder's
   manifest.js anywhere else */
function loadFolderManifest(dir, globalName){
  return new Promise(resolve => {
    if (Array.isArray(window[globalName])) return resolve(window[globalName]);
    const s = document.createElement("script");
    s.src = dir + "/manifest.js";
    s.onload = () => resolve(Array.isArray(window[globalName]) ? window[globalName] : []);
    s.onerror = () => resolve([]);
    document.head.appendChild(s);
  });
}
async function discoverHtmlFolder(dir, globalName, prefix){
  let paths = null;
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/i);
  if (m){
    const seg = location.pathname.split("/").filter(Boolean);
    const repo = seg.length ? seg[0] : m[1] + ".github.io";
    try {
      const r = await fetch("https://api.github.com/repos/" + m[1] + "/" + repo + "/contents/" + dir);
      if (r.ok){
        const list = await r.json();
        if (Array.isArray(list)) paths = list.filter(f => f.type === "file" && isHtml(f.name)).map(f => dir + "/" + f.name);
      }
    } catch (err){ /* rate limited or offline - the manifest is the fallback */ }
  }
  if (!paths) paths = await loadFolderManifest(dir, globalName);
  const found = await Promise.all(paths.map(async p => {
    try {
      const res = await fetch(p, { cache: "no-store" });
      return res.ok ? storeMeta(await res.text(), p, prefix) : null;
    } catch (err){ return null; }
  }));
  return found.filter(Boolean);
}
let storeCatalogue = null;
async function discoverStoreApps(){
  storeCatalogue = await discoverHtmlFolder("apps", "BOXOS_APPS", "app");
  return storeCatalogue;
}

/* ---- installing ---- */
function registerStoreApp(a){
  APPS[a.id] = { name: a.name, desc: a.desc, icon: a.icon, w: a.w, h: a.h, cls: "app-ext", store: true,
                 run: win => storeAppRun(win, a) };
}
function refreshStoreViews(){
  for (const w of windows.values()) if (w.appId === "store" && w.api.refresh) w.api.refresh();
}
function storeInstall(a){
  const rec = { id: a.id, src: a.src, name: a.name, desc: a.desc, icon: a.icon, w: a.w, h: a.h };
  const had = State.installed.some(x => x.id === a.id);
  State.installed = had ? State.installed.map(x => (x.id === a.id ? rec : x)) : State.installed.concat(rec);
  registerStoreApp(rec);
  if (!had && !State.dock.includes(a.id)) State.dock = State.dock.concat(a.id);
  saveSettings();
  drawDock();
  refreshStoreViews();
  notify(had ? "Updated" : "Installed", had ? a.name + " was reinstalled." : a.name + " is in the menu and the Dock.", a.icon);
}
function storeRemove(id){
  const a = APPS[id];
  for (const w of Array.from(windows.values())) if (w.appId === id) closeWin(w);
  delete APPS[id];
  State.installed = State.installed.filter(x => x.id !== id);
  State.dock = State.dock.filter(x => x !== id);
  State.shortcuts = State.shortcuts.filter(s => !(s.kind === "app" && s.target === id));
  saveSettings();
  drawDock();
  drawDesktop();
  refreshStoreViews();
  if (a) notify("Removed", a.name + " is gone from the menu and the Dock.", a.icon);
}
function storeInstallFromPath(path){
  const n = node(path);
  if (!n || n.type !== "file" || !isHtml(baseName(path)) || typeof n.content !== "string")
    return osAlert("Not an app", baseName(path) + " is not an HTML file SEA OS can install.");
  const a = storeMeta(n.content, "fs:" + path);
  storeInstall(a);
  return a;
}

/* ---- running one ---- */
async function storeSource(a){
  if (a.src.startsWith("fs:")){
    const n = node(a.src.slice(3));
    if (!n || n.type !== "file")
      throw new Error(a.name + " was installed from " + tilde(a.src.slice(3)) + ", which is not there any more.");
    return String(n.content);
  }
  const res = await fetch(a.src, { cache: "no-store" });
  if (!res.ok) throw new Error(a.name + " could not be loaded - the server answered " + res.status + ".");
  return res.text();
}
function storeAppRun(win, a){

      return;

    frame.srcdoc = withBridge(html, base);
    wrap.innerHTML = "";
    wrap.appendChild(frame);
    entry.frame = frame;
    Bridged.add(entry);
    frame.addEventListener("load", () => { if (activeWin === win) try { frame.contentWindow.focus(); } catch (x){} });
  })();
  return {

    focusFrame(){ try { if (entry.frame) entry.frame.contentWindow.focus(); } catch (x){} },

      el("p", null, "Inside, window.box lets it send notifications and keep its own files. Help › SEA Store has the details."));

function photosApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="vd-bar">' +
      '<button class="tb-btn ph-back" title="Back to all photos">&#8592;</button>' +
      '<span class="vd-title">Photos</span>' +
      '<span class="ph-count"></span>' +
      '<span style="flex:1"></span>' +
      '<input class="vd-find" spellcheck="false" autocomplete="off" placeholder="Filter">' +
      '<button class="tb-btn" data-p="show" title="Slideshow">&#9654; Slideshow</button>' +
      '<button class="tb-btn" data-p="refresh" title="Look again">&#8635;</button>' +
    '</div>' +
    '<div class="ph-grid"></div>' +
    '<div class="ph-view">' +
      '<div class="ph-stage"><img alt=""><button class="ph-nav prev" title="Previous">&#8249;</button>' +
      '<button class="ph-nav next" title="Next">&#8250;</button></div>' +
      '<div class="vw-bar"><span class="vw-info ph-info"></span><span style="flex:1"></span>' +
        '<button class="tb-btn" data-p="play">&#9654; Slideshow</button>' +
        '<button class="tb-btn" data-p="wall">Set as wallpaper</button>' +
        '<button class="tb-btn" data-p="files">Show in Files</button>' +
        '<button class="tb-btn" data-p="paint">Edit in Paint</button>' +
        '<button class="tb-btn" data-p="fit">Actual size</button>' +
      '</div>' +
    '</div>';

  const grid = $(".ph-grid", B), find = $(".vd-find", B), img = $(".ph-stage img", B);
  const stage = $(".ph-stage", B), info = $(".ph-info", B), countEl = $(".ph-count", B);
  const titleEl = $(".vd-title", B);
  const pb = k => $('[data-p="' + k + '"]', B);
  let all = [], shown = [], at = -1, show = 0;

  function scan(){
    all = [];
    walkFS((p, n) => { if (n.type === "file" && fileIsImage(p)) all.push(p); });
    draw();
  }
  function draw(){
    const q = find.value.trim().toLowerCase();
    const current = at >= 0 ? shown[at] : null;
    shown = q ? all.filter(p => baseName(p).toLowerCase().includes(q)) : all.slice();
    at = current ? shown.indexOf(current) : -1;
    countEl.textContent = all.length ? shown.length + (shown.length === all.length ? "" : " of " + all.length) : "";
    grid.innerHTML = "";
    if (!shown.length){
      grid.appendChild(el("div", "vd-none", all.length ? "Nothing here matches that."
        : "No pictures yet. Import some in Files, draw one in Paint, put images in the repo's pictures/ folder, " +
          "or run  unbox image <words>  in the Terminal."));
      return;
    }
    shown.forEach((p, i) => {
      const n = node(p);
      const tile = el("button", "ph-tile");
      const pic = el("img");
      pic.loading = "lazy";
      pic.decoding = "async";
      pic.alt = baseName(p);
      pic.src = n.content;
      pic.onerror = () => tile.classList.add("broken");
      tile.append(pic, el("span", "ph-cap", baseName(p)));
      tile.title = tilde(p);
      tile.onclick = () => openAt(i);
      tile.oncontextmenu = e => {
        e.preventDefault(); e.stopPropagation();
        showCtx(e.clientX, e.clientY, [
          { icon: "🖼️", label: "Open", run: () => openAt(i) },
          { icon: "🎨", label: "Edit in Paint", run: () => launch("paint", p) },
          { icon: "📁", label: "Show in Files", run: () => openInFiles(p) },
          "-",
          { icon: "🖼️", label: "Set as wallpaper", run: () => setWallpaperFrom(p) }
        ]);
      };
      grid.appendChild(tile);
    });
  }
  function openAt(i){
    if (!shown.length) return;
    at = (i + shown.length) % shown.length;
    const p = shown[at], n = node(p);
    if (!n) return scan();
    B.classList.add("viewing");
    stage.classList.add("fit");
    pb("fit").textContent = "Actual size";
    img.classList.remove("in");
    img.onload = () => {
      img.classList.add("in");
      info.textContent = baseName(p) + " · " + img.naturalWidth + "×" + img.naturalHeight +
                         " · " + (at + 1) + " of " + shown.length;
    };
    img.onerror = () => { info.textContent = baseName(p) + " · could not be displayed"; };
    img.src = n.content;
    titleEl.textContent = baseName(p);
    win.setTitle(baseName(p));
    drawMenuBar();
  }
  function grid_(){
    stopShow();
    B.classList.remove("viewing");
    titleEl.textContent = "Photos";
    win.setTitle("Photos");
    draw();
    drawMenuBar();
  }
  function startShow(){
    if (!shown.length) return;
    if (at < 0) openAt(0);
    clearInterval(show);
    show = setInterval(() => openAt(at + 1), 3500);
    B.classList.add("showing");
    pb("play").innerHTML = "&#10074;&#10074; Pause";
  }
  function stopShow(){
    clearInterval(show);
    show = 0;
    B.classList.remove("showing");
    pb("play").innerHTML = "&#9654; Slideshow";
  }
  function play(path){
    scan();
    let i = shown.indexOf(path);
    if (i < 0 && find.value){ find.value = ""; draw(); i = shown.indexOf(path); }
    if (i >= 0) openAt(i);
  }

  $(".ph-back", B).onclick = grid_;
  $(".ph-nav.prev", B).onclick = () => { stopShow(); openAt(at - 1); };
  $(".ph-nav.next", B).onclick = () => { stopShow(); openAt(at + 1); };
  pb("show").onclick = startShow;
  pb("play").onclick = () => (show ? stopShow() : startShow());
  pb("refresh").onclick = scan;
  pb("wall").onclick = () => { if (at >= 0) setWallpaperFrom(shown[at]); };
  pb("files").onclick = () => { if (at >= 0) openInFiles(shown[at]); };
  pb("paint").onclick = () => { if (at >= 0) launch("paint", shown[at]); };
  pb("fit").onclick = () => {
    const fit = stage.classList.toggle("fit");
    pb("fit").textContent = fit ? "Actual size" : "Fit";
  };
  find.oninput = draw;
  /* arrows page, Escape goes back, space runs the slideshow - only while
     this window is the one in front */
  const onKey = e => {
    if (activeWin !== win || !B.classList.contains("viewing")) return;
    if (e.target.closest && e.target.closest("input,textarea")) return;
    if (e.key === "ArrowRight"){ e.preventDefault(); stopShow(); openAt(at + 1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); stopShow(); openAt(at - 1); }
    else if (e.key === "Escape"){ e.preventDefault(); grid_(); }
    else if (e.key === " "){ e.preventDefault(); show ? stopShow() : startShow(); }
  };
  document.addEventListener("keydown", onKey);

  scan();
  if (startPath) play(startPath);

  return {
    play,
    refresh: scan,
    menus(){
      const viewing = B.classList.contains("viewing");
      return {
        File: [
          { label: "Look for pictures again", run: scan },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "All photos", run: grid_, disabled: !viewing },
          { label: "Next", run: () => openAt(at + 1), disabled: !viewing },
          { label: "Previous", run: () => openAt(at - 1), disabled: !viewing },
          { label: show ? "Stop slideshow" : "Slideshow", run: () => (show ? stopShow() : startShow()) }
        ]
      };
    },
    onClose(){ stopShow(); document.removeEventListener("keydown", onKey); return true; }
  };
}
