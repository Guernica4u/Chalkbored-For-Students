  function selectTab(t){
    if (t === active) return;
    stash();
    if (active) active.stage.classList.add("off");
    active = t;
    hist = t.hist; hi = t.hi; current = t.current; frame = t.frame; stage = t.stage;
    stage.classList.remove("off");
    stage.scrollTop = t.scroll || 0;
    win.setTitle(t.title || "Seahorse");
    addr.value = t.addr || "";
    syncNav();
    drawTabs();
    drawMenuBar();
  }
  function newTab(target){
    stash();
    if (active) active.stage.classList.add("off");
    const t = { hist: [], hi: -1, current: null, frame: null, title: "New tab",
                stage: el("div", "wb-stage"), scroll: 0 };
    stages.appendChild(t.stage);
    tabs.push(t);
    active = t;
    hist = t.hist; hi = t.hi; current = t.current; frame = null; stage = t.stage;
    drawTabs();
    if (target) go(target); else drawHome();
    drawMenuBar();
    return t;
  }
  function closeTab(t){
    const i = tabs.indexOf(t);
    if (i < 0) return;
    if (tabs.length === 1) return win.close();
    t.stage.remove();
    tabs.splice(i, 1);
    if (t === active){ active = null; selectTab(tabs[Math.min(i, tabs.length - 1)]); }
    else drawTabs();
  }
  $(".wb-newtab", tabbar).onclick = () => newTab();

  /* ---- what did the user mean? ---- */
  function resolve(input){
    const s = String(input).trim();
    if (!s) return null;
    if (s.startsWith("box:")) return { kind: "local", path: absPath(s.slice(4), HOME) };
    if (s.startsWith("wiki:")) return { kind: "wiki", title: s.slice(5).trim() };
    if (/^(hn|news|hackernews)$/i.test(s)) return { kind: "hn" };
    if (/^so:/i.test(s)) return { kind: "so", q: s.slice(3).trim() };
    if (/^gh:/i.test(s)){
      const v = s.slice(3).trim();
      return /^[\w.-]+\/[\w.-]+$/.test(v) ? { kind: "ghrepo", repo: v } : { kind: "gh", q: v };
    }
    if (/^(wikt|define):/i.test(s)) return { kind: "wikt", title: s.split(":").slice(1).join(":").trim() };
    const gh = s.match(/^(?:https?:\/\/)?github\.com\/([\w.-]+\/[\w.-]+)\/?$/i);
    if (gh) return { kind: "ghrepo", repo: gh[1] };
    const w = s.match(/^(?:https?:\/\/)?[a-z]*\.?wikipedia\.org\/wiki\/([^#?]+)/i);
    if (w) return { kind: "wiki", title: decodeURIComponent(w[1]) };
    if (/^https?:\/\//i.test(s)) return { kind: "web", url: s };
    if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(s) && !s.includes(" ")) return { kind: "web", url: "https://" + s };
    if (s.startsWith("/") || s.startsWith("~")){
      const p = absPath(s, HOME);
      if (node(p)) return { kind: "local", path: p };
    }
    return { kind: "search", q: s };
  }
  function go(input, noHistory){
    const t = typeof input === "object" ? input : resolve(input);
    if (!t) return;
    if (!noHistory){
      hist = hist.slice(0, hi + 1);
      hist.push(t);
      hi = hist.length - 1;
    }
    render(t);
  }
  const setAddr = v => { addr.value = v; if (active) active.addr = v; };
  function syncNav(){
    bb("back").disabled = hi <= 0;
    bb("fwd").disabled  = hi >= hist.length - 1;
    bb("ext").disabled  = !current || !(current.kind === "web" || current.kind === "wiki" || current.kind === "search");
  }
  function externalUrl(t){
    if (!t) return null;
    if (t.kind === "web") return t.url;
    if (t.kind === "wiki") return "https://en.wikipedia.org/wiki/" + encodeURIComponent(t.title);
    if (t.kind === "search") return ENGINES[State.engine].url + encodeURIComponent(t.q);
    return null;
  }

  /* ---- chrome for the native (non-iframe) pages ---- */
  function page(){
    stage.innerHTML = "";
    frame = null;
    const p = el("div", "wb-home");
    stage.appendChild(p);
    return p;
  }
  function spinner(label){
    const p = page();
    const h = el("div", "hero");
    h.append(el("div", "wb-spin"), el("p", null, label));
    p.appendChild(h);
  }
  function errorPage(title, msg, target){
    const p = page();
    const h = el("div", "hero");
    h.append(el("div", "wb-sad", ":("), el("h1", null, title), el("p", null, msg));
    const url = externalUrl(target);
    if (url){
      const b = el("button", "btn primary", "Open in a real browser tab");
      b.style.height = "34px";
      b.onclick = () => window.open(url, "_blank", "noopener");
      h.appendChild(b);
    }
    p.appendChild(h);
  }
  function mountFrame(srcdoc){
    /* reuse the existing frame where possible - creating a new sandboxed
       iframe spins up a fresh renderer process and flashes white between pages */
    const existing = stage.querySelector("iframe");
    if (existing){
      Array.from(stage.children).forEach(n => { if (n !== existing) n.remove(); });
      frame = existing;
      frame.srcdoc = srcdoc;
      return;
    }
    stage.innerHTML = "";
    frame = el("iframe");
    /* no allow-same-origin: fetched pages get an opaque origin and cannot
       reach into SEA OS, but their own scripts still run */
    frame.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-popups");
    frame.srcdoc = srcdoc;
    stage.appendChild(frame);
  }
  async function grab(url, ms){
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms || 12000);
    try { return await fetch(url, { signal: ctl.signal, redirect: "follow" }); }
    finally { clearTimeout(timer); }
  }

  /* ---- the renderers ---- */
  async function render(t){
    current = t;
    const my = ++reqId;
    syncNav();

    if (t.kind === "local"){
      setAddr("box:" + t.path);
      const n = node(t.path);
      if (!n || n.type !== "file"){
        setTitle("Seahorse");
        return errorPage("File not found", tilde(t.path) + " is not in the filesystem any more.", null);
      }
      setTitle(baseName(t.path));
      if (n.kind !== "text")
        return mountFrame("<!doctype html><pre>Not a text file.</pre>");
      /* only an actual web page is handed over as markup; anything else is
         shown as what it is, with its line breaks intact */
      if (isHtml(t.path)) return mountFrame(n.content);
      const esc = n.content.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return mountFrame(
        "<!doctype html><meta charset='utf-8'><style>" +
        "body{margin:0;background:" + (State.theme === "dark" ? "#1e1e1e;color:#e4e4e4" : "#fff;color:#222") + ";}" +
        "pre{margin:0;padding:22px 26px;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;" +
        "white-space:pre-wrap;word-wrap:break-word}" +
        "</style><pre>" + esc + "</pre>");
    }

    if (t.kind === "wiki"){
      setAddr("wiki:" + t.title);
      setTitle(t.title.replace(/_/g, " "));
      spinner("Fetching " + t.title.replace(/_/g, " ") + String.fromCharCode(8230));
      try {
        const res = await grab("https://en.wikipedia.org/api/rest_v1/page/html/" + encodeURIComponent(t.title));
        if (my !== reqId) return;
        if (res.status === 404) return errorPage("No such article", "Wikipedia has no page called " + t.title.replace(/_/g, " ") + ".", null);
        if (!res.ok) return errorPage("Wikipedia said no", "The request came back with status " + res.status + ".", t);
        const html = await res.text();
        if (my !== reqId) return;
        mountFrame(wikiDocument(html));
      } catch (e){
        if (my !== reqId) return;
        errorPage("Could not reach Wikipedia",
          "The request failed or timed out. Check that you are online.", t);
      }
      return;
    }

    if (t.kind === "search") return renderSearch(t, my);
    if (t.kind === "hn")     return renderHN(my);
    if (t.kind === "so")     return renderSO(t, my);
    if (t.kind === "sopost") return renderSOPost(t, my);
    if (t.kind === "gh")     return renderGH(t, my);
    if (t.kind === "ghrepo") return renderGHRepo(t, my);
    if (t.kind === "wikt")   return renderWikt(t, my);

    /* A plain web address. Only a site that allows other pages to read it
       comes back; the rest are refused by the browser, and the page says so. */
    setAddr(t.url);
    let host = t.url;
    try { host = new URL(t.url).hostname.replace(/^www\./, ""); } catch (e){}
    setTitle(host);

    const cached = PageCache.get(t.url);
    if (cached) return showPage(cached, t, host);
    spinner("Fetching " + host + String.fromCharCode(8230));

    let body = null;
    try {
      const res = await grab(t.url, 9000);
      if (my !== reqId) return;
      if (!res.ok)
        return errorPage(host + " said no (" + res.status + ")",
          res.status === 404 || res.status === 410
            ? host + " says there is no such page."
            : host + " answered with status " + res.status + " instead of a page.", t);
      if (isFileResponse(res.headers.get("content-type"), t.url)){
        const saved = await saveDownload(await res.blob(), t.url);
        if (my !== reqId) return;
        return showDownloaded(saved, t);
      }
      body = await res.text();
    } catch (e){ /* refused by the browser, or offline */ }
    if (my !== reqId) return;

    if (body === null)
      return errorPage(host + " will not open here",
        "Sites have to allow other pages to read them, and almost none do. Seahorse can still open " +
        "Wikipedia, Stack Overflow, GitHub, Hacker News, dictionary look-ups and your own files.", t);
    PageCache.put(t.url, body);
    showPage(body, t, host);
  }
  function showDownloaded(path, t){
    const p = page();
    const h = el("div", "hero");
    if (!path){
      h.append(el("div", "wb-sad", ":("), el("h1", null, "Not downloaded"),
               el("p", null, "That file was too big, or could not be saved. The notification says which."));
      p.appendChild(h);
      return;
    }
    h.append(el("div", "wb-sad", "\u2B07\uFE0F"), el("h1", null, baseName(path)),
      el("p", null, "This address is a file rather than a page, so Seahorse saved it into Downloads. " +
                    "It stays inside SEA OS - nothing was saved onto this computer."));
    const open = el("button", "btn primary", "Open it");
    open.style.cssText = "height:34px;margin:0 4px";
    open.onclick = () => openNode(path);
    const show = el("button", "btn", "Show in Files");
    show.style.cssText = "height:34px;margin:0 4px";
    show.onclick = () => openInFiles(path);
    h.append(open, show);
    p.appendChild(h);
  }
  /* a link to a file downloads it and leaves the page where it is */
  async function downloadInBackground(url, given){
    const name = downloadName(url, "", given);
    notify("Downloading", name, "\u2B07\uFE0F");
    try {
      const res = await grab(url, 60000);
      if (!res.ok) return notify("Download failed", name + ": the site answered " + res.status + ".", "\u26A0\uFE0F");
      /* it turned out to be a page after all */
      if (!given && !isFileResponse(res.headers.get("content-type"), url)) return go({ kind: "web", url });
      await saveDownload(await res.blob(), url, given);
    } catch (err){
      notify("Download failed", name + " would not come - that site does not let other pages fetch its files.", "\u26A0\uFE0F");
    }
  }
  function showPage(body, t, host){
    /* an empty answer is a site checking for a real browser, not a blank page */
    if (!body.trim())
      return errorPage(host + " sent back nothing",
        host + " answered, but with an empty page. That is usually a check that only lets real browsers through.", t);
    if (!looksScriptBuilt(body)) return mountFrame(webDocument(body, t.url));
    const p = page();
    const h = el("div", "hero");
    h.append(el("div", "wb-sad", "{ }"), el("h1", null, host + " builds itself with JavaScript"),
      el("p", null, "The page arrived, but it is almost all script and hardly any text. Sites like this put " +
                    "themselves together after they load, using cookies and storage that a page inside SEA OS " +
                    "is not allowed to touch - so here they stay blank, however long you wait."));
    const anyway = el("button", "btn", "Show it anyway");
    anyway.style.cssText = "height:34px;margin:0 4px";
    anyway.onclick = () => mountFrame(webDocument(body, t.url));
    h.appendChild(anyway);
    const url = externalUrl(t);
    if (url){
      const b = el("button", "btn primary", "Open in a real browser tab");
      b.style.cssText = "height:34px;margin:0 4px";
      b.onclick = () => window.open(url, "_blank", "noopener");
      h.appendChild(b);
    }
    p.appendChild(h);
  }

  /* <base> makes the page's own images and stylesheets load straight from the
     real site, and the click handler gives links
     back to Seahorse instead of the sandboxed frame trying to navigate. */
  function webDocument(body, url){
    const base = '<base href="' + url.replace(/"/g, "&quot;") + '">';
    const doc = /<head[^>]*>/i.test(body)
      ? body.replace(/<head[^>]*>/i, m => m + base)
      : "<!doctype html><html><head>" + base + "</head><body>" + body + "</body></html>";
    return /<\/body>/i.test(doc) ? doc.replace(/<\/body>/i, WIKI_NAV + "</body>") : doc + WIKI_NAV;
  }

  /* ---- Stack Overflow ---- */
  async function renderSO(t, my){
    setAddr("so:" + t.q);
    setTitle(t.q + " - Stack Overflow");
    spinner("Searching Stack Overflow" + String.fromCharCode(8230));
    try {
      const res = await grab("https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&site=stackoverflow" +
        "&filter=withbody&pagesize=10&q=" + encodeURIComponent(t.q), 12000);
      if (my !== reqId) return;
      const j = await res.json();
      if (my !== reqId) return;
      const p = page();
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Stack Overflow: " + t.q));
      const hits = (j.items || []).filter(x => x.title);
      if (!hits.length) s.appendChild(el("div", "wb-none", "Nothing found for that."));
      for (const h of hits){
        const b = el("button", "wb-result");
        b.appendChild(el("div", "wb-result-t", decodeEntities(h.title)));
        b.appendChild(el("div", "wb-result-s",
          (h.is_answered ? "answered" : "unanswered") + " \u00b7 " + h.score + " votes \u00b7 " +
          h.answer_count + " answers \u00b7 " + (h.tags || []).slice(0, 4).join(", ")));
        b.onclick = () => go({ kind: "sopost", id: h.question_id, title: decodeEntities(h.title) });
        s.appendChild(b);
      }
      p.appendChild(s);
    } catch (e){
      if (my !== reqId) return;
      errorPage("Could not reach Stack Overflow", "The request failed or timed out.", null);
    }
  }
  async function renderSOPost(t, my){
    setAddr("so:#" + t.id);
    setTitle(t.title);
    spinner("Loading the answers" + String.fromCharCode(8230));
    try {
      const res = await grab("https://api.stackexchange.com/2.3/questions/" + t.id +
        "/answers?order=desc&sort=votes&site=stackoverflow&filter=withbody&pagesize=5", 12000);
      if (my !== reqId) return;
      const j = await res.json();
      if (my !== reqId) return;
      const parts = ['<h1>' + escapeHtml(t.title) + "</h1>"];
      const answers = j.items || [];
      if (!answers.length) parts.push("<p><em>No answers on this question yet.</em></p>");
      answers.forEach((a, i) => {
        parts.push('<div class="ans"><div class="meta">' +
          (a.is_accepted ? "Accepted answer" : "Answer " + (i + 1)) + " \u00b7 " + a.score + " votes</div>" +
          a.body + "</div>");
      });
      mountFrame(readerDocument(parts.join("\n"), "https://stackoverflow.com/"));
    } catch (e){
      if (my !== reqId) return;
      errorPage("Could not load the answers", "The request failed or timed out.", null);
    }
  }

  async function renderGHRepo(t, my){

  /* ---- search: DuckDuckGo instant answers + Wikipedia, side by side ---- */
  async function renderSearch(t, my){
    setAddr(t.q);
    setTitle(t.q + " - search");
    spinner("Searching for " + t.q + String.fromCharCode(8230));
    let ddg = null, wiki = [];
    try {
      const [a, b] = await Promise.allSettled([
        grab("https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&q=" + encodeURIComponent(t.q), 9000),
        grab("https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=8&srsearch=" + encodeURIComponent(t.q), 9000)
      ]);
      if (my !== reqId) return;
      if (a.status === "fulfilled" && a.value.ok) ddg = await a.value.json().catch(() => null);
      if (b.status === "fulfilled" && b.value.ok){
        const j = await b.value.json().catch(() => null);
        if (j && j.query && j.query.search) wiki = j.query.search;
      }
    } catch (e){ /* handled below */ }
    if (my !== reqId) return;

    const p = page();
    const head = el("div", "wb-sect");
    const hq = el("h1");
    hq.style.cssText = "font-size:20px;margin:0 0 3px;font-family:inherit";
    hq.textContent = t.q;
    head.append(hq, el("div", "wb-none", "Results from DuckDuckGo and Wikipedia, read directly - no page you visit is sent anywhere else."));
    p.appendChild(head);

    if (ddg && (ddg.AbstractText || ddg.Answer)){
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, ddg.Answer ? "Answer" : "Summary"));
      const card = el("div", "wb-card");
      if (ddg.Heading) card.appendChild(el("div", "wb-card-h", ddg.Heading));
      card.appendChild(el("p", null, ddg.Answer ? String(ddg.Answer).replace(/<[^>]+>/g, "") : ddg.AbstractText));
      if (ddg.AbstractSource) card.appendChild(el("div", "wb-none", "via " + ddg.AbstractSource));
      s.appendChild(card);
      p.appendChild(s);
    }

    if (wiki.length){
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Wikipedia"));
      for (const r of wiki){
        const b = el("button", "wb-result");
        b.appendChild(el("div", "wb-result-t", r.title));
        const snip = el("div", "wb-result-s");
        snip.textContent = String(r.snippet || "").replace(/<[^>]+>/g, "") + String.fromCharCode(8230);
        b.appendChild(snip);
        b.onclick = () => go({ kind: "wiki", title: r.title.replace(/ /g, "_") });
        s.appendChild(b);
      }
      p.appendChild(s);
    }

    const rel = (ddg && ddg.RelatedTopics ? ddg.RelatedTopics : []).filter(x => x.Text).slice(0, 8);
    if (rel.length){
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Related"));
      const grid = el("div", "wb-links");
      for (const r of rel){
        const b = el("button", "wb-link");
        b.textContent = r.Text.length > 60 ? r.Text.slice(0, 60) + String.fromCharCode(8230) : r.Text;
        b.title = r.Text;
        b.onclick = () => go({ kind: "search", q: r.Text.split(" - ")[0] });
        grid.appendChild(b);
      }
      s.appendChild(grid);
      p.appendChild(grid.children.length ? s : el("span"));
    }

    const more = el("div", "wb-sect");
    more.appendChild(el("h2", null, "Look somewhere else"));
    const grid3 = el("div", "wb-links");
    const elsewhere = [
      ["Stack Overflow", () => go({ kind: "so", q: t.q })],
      ["GitHub", () => go({ kind: "gh", q: t.q })],
      ["Definition", () => go({ kind: "wikt", title: t.q })],
      ["Open in a real tab", () => window.open(externalUrl(t), "_blank", "noopener")]
    ];
    for (const [label, fn] of elsewhere){
      const b = el("button", "wb-link");
      b.textContent = label;
      b.onclick = fn;
      grid3.appendChild(b);
    }
    more.appendChild(grid3);
    p.appendChild(more);

    if (!wiki.length && !(ddg && (ddg.AbstractText || ddg.Answer))){
      const s = el("div", "wb-sect");
      s.appendChild(el("div", "wb-none", "Nothing came back for that. Try different words, or open it in a real browser tab."));
      const b = el("button", "btn primary", "Search " + ENGINES[State.engine].name + " in a real tab");
      b.onclick = () => window.open(externalUrl(t), "_blank", "noopener");
      s.appendChild(b);
      p.appendChild(s);
    }
  }

  /* ---- a small Hacker News reader ---- */
  async function renderHN(my){
    setAddr("hn");
    setTitle("Hacker News");
    spinner("Loading Hacker News" + String.fromCharCode(8230));
    try {
      const res = await grab("https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=30", 9000);
      if (my !== reqId) return;
      const j = await res.json();
      if (my !== reqId) return;
      const p = page();
      const s = el("div", "wb-sect");
      s.appendChild(el("h2", null, "Hacker News front page"));
      (j.hits || []).forEach((h, i) => {
        const b = el("button", "wb-result");
        b.appendChild(el("div", "wb-result-t", (i + 1) + ". " + h.title));
        let host = "news.ycombinator.com";
        try { if (h.url) host = new URL(h.url).hostname.replace(/^www\./, ""); } catch (e){}
        b.appendChild(el("div", "wb-result-s", (h.points || 0) + " points - " + (h.num_comments || 0) + " comments - " + host));
        b.onclick = () => go(h.url ? { kind: "web", url: h.url } : { kind: "search", q: h.title });
        s.appendChild(b);
      });
      p.appendChild(s);
    } catch (e){
      if (my !== reqId) return;
      errorPage("Could not reach Hacker News", "The request failed or timed out.", null);
    }
  }

  /* ---- start page ---- */
  function drawHome(){
    current = null;
    setAddr("");
    setTitle("Seahorse");
    const p = page();
    const hero = el("div", "hero");
    hero.innerHTML =
      '<span class="logo"><svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">' +
      '<path d="M30 8V42H11Z" fill="currentColor"/><path d="M35 17V42H51Z" fill="currentColor" fill-opacity=".72"/><path d="M9 46H55L48 55H16Z" fill="currentColor"/>' +
      "</svg></span>";
    hero.append(el("h1", null, "Seahorse"));
    hero.append(el("p", null, "Search, read Wikipedia and Stack Overflow, browse GitHub, open your own pages."));
    const form = el("div", "wb-search");
    const q = el("input");
    q.placeholder = "Search, or type an address";
    const gob = el("button", "btn primary", "Go");
    gob.style.cssText = "height:38px;border-radius:19px;padding:0 20px";
    const submit = () => { if (q.value.trim()) go(q.value); };
    gob.onclick = submit;
    q.onkeydown = e => { if (e.key === "Enter" || e.key === "Return") submit(); };
    form.append(q, gob);
    hero.appendChild(form);
    p.appendChild(hero);

    const pages = [];
    walkFS((path, n, name) => { if (n.type === "file" && isHtml(name)) pages.push(path); });
    const s1 = el("div", "wb-sect");
    s1.appendChild(el("h2", null, "Pages on this computer"));
    if (pages.length){
      const grid = el("div", "wb-links");
      for (const path of pages){
        const b = el("button", "wb-link");
        b.append(el("span", null, String.fromCodePoint(0x1F310)), el("span", null, baseName(path)));
        b.title = tilde(path);
        b.onclick = () => go("box:" + path);
        grid.appendChild(b);
      }
      s1.appendChild(grid);
    } else {
      s1.appendChild(el("div", "wb-none", "No HTML files yet. Import one in Files, or make one with New File."));
    }
    p.appendChild(s1);

    const s2 = el("div", "wb-sect");
    s2.appendChild(el("h2", null, "Places to start"));
    const grid2 = el("div", "wb-links");
    const picks = [
      ["Hacker News", () => go({ kind: "hn" })],
      ["Stack Overflow", () => go({ kind: "so", q: "javascript" })],
      ["GitHub search", () => go({ kind: "gh", q: "operating system" })],
      ["Operating system", () => go({ kind: "wiki", title: "Operating_system" })],
      ["Linux Mint", () => go({ kind: "wiki", title: "Linux_Mint" })],
      ["Today in history", () => go({ kind: "search", q: "on this day" })],
      ["Random article", () => go({ kind: "wiki", title: "Special:Random" })]
    ];
    for (const [label, fn] of picks){
      const b = el("button", "wb-link");
      b.textContent = label;
      b.onclick = fn;
      grid2.appendChild(b);
    }
    s2.appendChild(grid2);
    p.appendChild(s2);
    syncNav();
    setTimeout(() => q.focus(), 30);
  }

  /* bookmarks live with your settings; history is per session */
  function targetLabel(t){
    if (!t) return "Start page";
    if (t.kind === "wiki") return t.title.replace(/_/g, " ");
    if (t.kind === "wikt") return t.title + " (definition)";
    if (t.kind === "local") return baseName(t.path);
    if (t.kind === "search") return t.q;
    if (t.kind === "so") return t.q + " (Stack Overflow)";
    if (t.kind === "sopost") return t.title;
    if (t.kind === "gh") return t.q + " (GitHub)";
    if (t.kind === "ghrepo") return t.repo;
    if (t.kind === "hn") return "Hacker News";
    if (t.kind === "web") return t.url;
    return "Page";
  }
  function bookmarkThis(){
    if (!current) return notify("Nothing to save", "The start page cannot be bookmarked.", "\u2139\uFE0F");
    const label = targetLabel(current);
    State.bookmarks = State.bookmarks || [];
    if (State.bookmarks.some(b => JSON.stringify(b.t) === JSON.stringify(current)))
      return notify("Already saved", label + " is already bookmarked.", "\u2139\uFE0F");
    State.bookmarks.push({ id: uid("bm"), label, t: current });
    saveSettings();
    notify("Bookmarked", label, "\u2B50");
  }
  function bookmarkMenu(){
    const items = [{ label: "Bookmark this page", run: bookmarkThis, disabled: !current }];
    const list = State.bookmarks || [];
    if (list.length){
      items.push("-");
      for (const b of list.slice(-12).reverse())
        items.push({ label: b.label.length > 42 ? b.label.slice(0, 42) + "\u2026" : b.label, run: () => go(b.t) });
      items.push("-", { label: "Clear bookmarks", run: () => { State.bookmarks = []; saveSettings(); } });
    }
    return items;
  }
  function historyMenu(){
    if (!hist.length) return [{ label: "Nothing visited yet", disabled: true, run(){} }];
    return hist.slice(-14).reverse().map((t, i) => ({
      label: (hist.length - 1 - i === hi ? "\u2022 " : "   ") + targetLabel(t),
      run: () => { hi = hist.length - 1 - i; render(hist[hi]); }
    }));
  }
  function seahorseMenus(){
    return {
      File: [
        { label: "New Tab", run: () => newTab() },
        { label: "Close Tab", run: () => closeTab(active), disabled: tabs.length < 2 },
        "-",
        { label: "New Seahorse window", run: () => launch("browser") },
        { label: "Open a page from Files\u2026", run: async () => {
            const p = await pickFile({ title: "Open a page", ok: "Open", start: HOME + "/Sites",
                                       accept: name => isHtml(name) });
            if (p) go("box:" + p);
          } },
        "-",
        { label: "Bookmark this page", run: bookmarkThis, disabled: !current },
        { label: "Save page text to Files", disabled: !current, run: savePageText },
        { label: "Show Downloads", run: () => { ensureDir(HOME + "/Downloads"); openInFiles(HOME + "/Downloads"); } },
        "-",
        { label: "Close Window", run: () => win.close() }
      ],
      Edit: [
        { label: "Copy address", run: () => { addr.select(); document.execCommand("copy"); } },
        { label: "Focus address bar", run: () => addr.focus() }
      ],
      View: [
        { label: "Start page", run: drawHome },
        { label: "Reload", run: () => { if (current) render(current); else drawHome(); } },
        "-",
        { label: "Back", run: () => { if (hi > 0){ hi--; render(hist[hi]); } }, disabled: hi <= 0 },
        { label: "Forward", run: () => { if (hi < hist.length - 1){ hi++; render(hist[hi]); } }, disabled: hi >= hist.length - 1 },
        "-",
        { label: "Bookmarks", run(){}, disabled: true },
        ...bookmarkMenu().slice(1),
        "-",
        { label: "History", run(){}, disabled: true },
        ...historyMenu()
      ]
    };
  }
  async function savePageText(){
    const frameDoc = frame && (() => { try { return frame.contentDocument; } catch (e){ return null; } })();
    let text = "";
    if (frameDoc && frameDoc.body) text = frameDoc.body.innerText;
    else text = stage.innerText || "";
    if (!text.trim()) return notify("Nothing to save", "This page has no text to keep.", "\u2139\uFE0F");
    const name = (targetLabel(current) || "page").replace(/[^\w -]+/g, "").slice(0, 40).trim() || "page";
    ensureDir(HOME + "/Documents");
    const saved = addUnique(HOME + "/Documents", name + ".txt", text, "text", "text/plain");
    notify("Saved to Files", "Documents/" + saved, "\uD83D\uDCC4");
  }

  /* links clicked inside a fetched article come back here as a message */
  const onMsg = e => {
    stash();
    const owner = tabs.find(t => t.frame && e.source === t.frame.contentWindow);
    if (!owner) return;
    const href = e.data && e.data.boxnav;
    if (!href) return;
    if (owner !== active) selectTab(owner);
    const title = wikiTitleFromHref(href);
    if (title){
      /* image pages and citation anchors are not somewhere to navigate to */
      if (/^(File|Image|Media):/i.test(title)) return;
      if (href.includes("#") && current && current.kind === "wiki" && current.title === title) return;
      return go({ kind: "wiki", title });
    }
    /* a relative link on a fetched page is relative to that page */
    let url = href;
    if (!/^https?:/i.test(url) && current && current.kind === "web"){
      try { url = new URL(href, current.url).href; } catch (err){ return; }
    }
    if (!/^https?:/i.test(url)) return;
    if (e.data.boxdl || looksLikeDownload(url)) return downloadInBackground(url, String(e.data.boxdl || "").trim());
    return go({ kind: "web", url });
  };
  addEventListener("message", onMsg);

  bb("back").onclick   = () => { if (hi > 0){ hi--; render(hist[hi]); } };
  bb("fwd").onclick    = () => { if (hi < hist.length - 1){ hi++; render(hist[hi]); } };
  bb("reload").onclick = () => {
    if (current && current.kind === "web") PageCache.map.delete(current.url);
    if (current) render(current); else drawHome();
  };
  bb("home").onclick   = drawHome;
  bb("ext").onclick    = () => { const u = externalUrl(current); if (u) window.open(u, "_blank", "noopener"); };
  addr.onkeydown = e => { if (e.key === "Enter" || e.key === "Return") go(addr.value); };
  addr.onfocus = () => addr.select();

  newTab(startTarget);
  return {
    go, newTab, menus: seahorseMenus,
    closeTab: () => closeTab(active),
    cycleTab(step){ const i = tabs.indexOf(active);
                    if (tabs.length > 1) selectTab(tabs[(i + step + tabs.length) % tabs.length]); },
    onClose(){ removeEventListener("message", onMsg); return true; }
  };
}

/* ============================================================
   11. Terminal
   ============================================================ */
function terminalApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="term-wrap"><div class="term-out"></div>' +
    '<div class="term-in-row"><span class="ps1"></span>' +
    '<input class="term-in" spellcheck="false" autocomplete="off" autocapitalize="off"></div></div>';
  const wrap = $(".term-wrap", B), out = $(".term-out", B), ps1 = $(".ps1", B), inp = $(".term-in", B);

  let cwd = HOME;
  const hist = [];
  let hi = 0;

  const scroll = () => { wrap.scrollTop = wrap.scrollHeight; };
  function line(parts, cls){
    const row = el("div", "term-row" + (cls ? " " + cls : ""));
    if (typeof parts === "string") row.textContent = parts;
    else for (const [txt, c] of parts) row.appendChild(el("span", c || null, txt));
    out.appendChild(row);
    return row;
  }
  function block(text, cls){
    const pre = el("div", cls || null);
    pre.style.whiteSpace = "pre-wrap";
    pre.textContent = text;
    out.appendChild(pre);
  }
  let failed = false;
  const err = m => { failed = true; line([[m, "t-err"]]); };

  function drawPs1(){
    ps1.innerHTML = "";
    ps1.append(el("span", "ps1-u", "box@seaos"), el("span", "ps1-s", ":"),
               el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "));
  }
  function refreshFiles(){
    for (const w of windows.values())
      if (w.appId === "files" && w.api && w.api.navigate) w.api.navigate(".", true);
  }

  const CMDS = {
    help(){
      block(
"Available commands\n\n" +
"  ls [path]          list a directory        pwd            print working directory\n" +
"  cd [path]          change directory        cat <file>     print a file\n" +
"  mkdir <name>       make a directory        touch <file>   create an empty file\n" +
"  cp [-r] a b        copy                    mv a b         move or rename\n" +
"  rm [-r] <path>     remove for good         trash <path>   move to Trash\n" +
"  echo <text>        print text (> file)     save <file>    copy it to your computer\n" +
"  open <path>        open in the right app   edit <file>    open in the Files editor\n" +
"  web <url|words>    open in Seahorse        tree [path]    show the tree\n" +
"  find <name>        search the filesystem   shortcut <t>   put something on the desktop\n" +
"  unbox <words>      fetch from the web     unbox search   list what is out there\n" +
"  wallpaper <file>   set the wallpaper       bootscreen <f> set the boot screen\n" +
"  backup             save everything to a file\n" +
"  notify <text>      raise a notification    apps           list applications\n" +
"  launch <app>       start an application    theme [l|d]    switch light/dark\n" +
"  date               current date/time       uptime         session uptime\n" +
"  whoami             current user            uname [-a]     system info\n" +
"  neofetch           system summary          history        command history\n" +
"  clear              clear the screen        exit           close this terminal\n\n" +
"Tab completes commands and paths. Up/Down walk the history.\n" +
"Paths accept ~ for home and .. for parent.");
    },
    pwd(){ line(cwd); },
    whoami(){ line("box"); },
    date(){ line(new Date().toString()); },
    uptime(){ line("up " + fmtDuration(Date.now() - BOOT_TIME) + ", " + windows.size + " window(s) open"); },
    clear(){ out.innerHTML = ""; },
    exit(){ win.close(); },
    history(){ hist.forEach((h, i) => line(String(i + 1).padStart(4) + "  " + h)); },
    apps(){
      for (const id in APPS)
        if (!APPS[id].hidden) line([[id.padEnd(12), "t-key"], [APPS[id].name + " - " + APPS[id].desc, ""]]);
    },
    uname(a){ line(a[0] === "-a" ? "SEA OS seaos 0.92 single-file " + (navigator.platform || "web") + " browser" : "SEA OS"); },
    theme(a){
      const t = (a[0] || "").toLowerCase();
      const next = (t === "l" || t === "light") ? "light" : (t === "d" || t === "dark") ? "dark" : (State.theme === "dark" ? "light" : "dark");
      setTheme(next, $("#traytheme"));
      line([["theme set to ", "t-dim"], [next, "t-ok"]]);
    },
    notify(a, raw){
      if (!raw) return err("notify: nothing to say");
      notify("Terminal", raw, "\u2328\uFE0F");
      line([["notification raised", "t-dim"]]);
    },
    shortcut(a, raw){
      if (!raw) return err("shortcut: give an app name, a path or a URL");
      const s = guessShortcut(raw);
      if (!s) return err("shortcut: cannot resolve " + raw);
      addShortcut(s);
      line([["added ", "t-dim"], [s.label, "t-ok"], [" to the desktop", "t-dim"]]);
    },
    web(a, raw){
      if (!raw) return err("web: give a URL or something to search for");
      openInBrowser(raw);
      line([["opening in Seahorse", "t-dim"]]);
    }
  };

  CMDS.ls = function(a){
    const target = a.find(x => !x.startsWith("-")) || ".";
    const p = absPath(target, cwd), n = node(p);
    if (!n) return err("ls: " + target + ": no such file or directory");
    if (n.type === "file") return line(baseName(p));
    const names = listDir(n);
    if (!names.length) return;
    const row = el("div", "term-row");
    names.forEach(name => {
      const c = n.children[name];
      const s = el("span", c.type === "dir" ? "t-dir" : c.kind === "image" ? "t-img" : null, name + (c.type === "dir" ? "/" : ""));
      s.style.marginRight = "18px";
      row.appendChild(s);
    });
    out.appendChild(row);
  };
  CMDS.cd = function(a){
    const t = a[0] || "~", p = absPath(t, cwd), n = node(p);
    if (!n) return err("cd: " + t + ": no such file or directory");
    if (n.type !== "dir") return err("cd: " + t + ": not a directory");
    cwd = p;
    drawPs1();
  };
  CMDS.cat = function(a){
    if (!a.length) return err("cat: missing operand");
    for (const t of a){
      const n = node(absPath(t, cwd));
      if (!n){ err("cat: " + t + ": no such file or directory"); continue; }
      if (n.type === "dir"){ err("cat: " + t + ": is a directory"); continue; }
      if (n.kind !== "text"){ err("cat: " + t + ": binary file (" + fmtBytes(nodeSize(n)) + ")"); continue; }
      block(n.content);
    }
  };
  CMDS.mkdir = function(a){
    if (!a.length) return err("mkdir: missing operand");
    for (const t of a){
      const p = absPath(t, cwd);
      if (node(p)){ err("mkdir: " + t + ": file exists"); continue; }
      if (!node(dirName(p))){ err("mkdir: " + t + ": no such parent directory"); continue; }
      ensureDir(p);
    }
    refreshFiles();
  };
  CMDS.touch = function(a){
    if (!a.length) return err("touch: missing operand");
    for (const t of a){
      const p = absPath(t, cwd);
      if (node(p)) continue;
      if (!writeFile(p, "", "text")) err("touch: " + t + ": cannot create");
    }
    refreshFiles();
  };
  CMDS.rm = function(a){
    const rec = a.some(x => x === "-r" || x === "-rf" || x === "-fr");
    const targets = a.filter(x => !x.startsWith("-"));
    if (!targets.length) return err("rm: missing operand");
    for (const t of targets){
      const p = absPath(t, cwd), n = node(p);
      if (!n){ err("rm: " + t + ": no such file or directory"); continue; }
      if (n.type === "dir" && !rec){ err("rm: " + t + ": is a directory (use -r)"); continue; }
      if (p === "/"){ err("rm: refusing to remove /"); continue; }
      removePath(p);
    }
    refreshFiles();
  };
  CMDS.echo = function(a, raw){
    const gt = raw.indexOf(">");
    if (gt >= 0){
      const text = raw.slice(0, gt).trim(), target = raw.slice(gt + 1).trim();
      if (!target) return err("echo: missing file after >");
      const p = absPath(target, cwd);
      if (!node(dirName(p))) return err("echo: " + target + ": no such directory");
      writeFile(p, text + "\n", "text");
      refreshFiles();
      return;
    }
    line(raw);
  };
  CMDS.open = function(a){
    if (!a.length) return err("open: missing operand");
    const p = absPath(a[0], cwd), n = node(p);
    if (!n) return err("open: " + a[0] + ": no such file or directory");
    openNode(p);
    line([["opening ", "t-dim"], [tilde(p), "t-ok"]]);
  };
  CMDS.edit = function(a){
    if (!a.length) return err("edit: missing operand");
    const p = absPath(a[0], cwd), n = node(p);
    if (!n) return err("edit: " + a[0] + ": no such file or directory");
    if (n.type !== "file" || n.kind !== "text") return err("edit: " + a[0] + ": not an editable text file");
    openInFiles(p);
    line([["editing ", "t-dim"], [tilde(p), "t-ok"]]);
  };
  CMDS.launch = function(a){
    const id = (a[0] || "").toLowerCase();
    if (!APPS[id] || APPS[id].hidden) return err("launch: unknown application: " + (a[0] || ""));
    launch(id);
    line([["started ", "t-dim"], [APPS[id].name, "t-ok"]]);
  };
  CMDS.tree = function(a){
    const p = absPath(a[0] || ".", cwd), root = node(p);
    if (!root) return err("tree: " + (a[0] || ".") + ": no such directory");
    const lines = [tilde(p)];
    (function walk(n, prefix){
      if (n.type !== "dir") return;
      const names = listDir(n);
      names.forEach((name, i) => {
        const last = i === names.length - 1;
        lines.push(prefix + (last ? "`-- " : "|-- ") + name + (n.children[name].type === "dir" ? "/" : ""));
        walk(n.children[name], prefix + (last ? "    " : "|   "));
      });
    })(root, "");
    block(lines.join("\n"));
  };
  CMDS.find = function(a){
    if (!a.length) return err("find: missing search term");
    const q = a.join(" ").toLowerCase();
    let hits = 0;
    walkFS((p, n, name) => {
      if (name.toLowerCase().includes(q)){ line([[tilde(p), n.type === "dir" ? "t-dir" : ""]]); hits++; }
    });
    if (!hits) line([["no matches for " + a.join(" "), "t-dim"]]);
  };

  CMDS.mv = function(a){
    if (a.length < 2) return err("mv: needs a source and a destination");
    const dest = absPath(a[a.length - 1], cwd);
    const srcs = a.slice(0, -1).map(x => absPath(x, cwd));
    const destNode = node(dest);
    if (srcs.length > 1 && (!destNode || destNode.type !== "dir"))
      return err("mv: " + a[a.length - 1] + ": not a directory");
    for (const src of srcs){
      if (!node(src)){ err("mv: " + tilde(src) + ": no such file or directory"); continue; }
      if (destNode && destNode.type === "dir"){
        if (!movePath(src, dest)) err("mv: cannot move " + tilde(src) + " in there");
      } else {
        if (!node(dirName(dest))){ err("mv: no such directory"); continue; }
        const moved = movePath(src, dirName(dest));
        if (moved) renamePath(dirName(dest) + "/" + moved, baseName(dest));
        else err("mv: cannot move " + tilde(src));
      }
    }
    refreshFiles();
  };
  CMDS.cp = function(a){
    const rec = a.some(x => x === "-r" || x === "-R");
    const rest = a.filter(x => !x.startsWith("-"));
    if (rest.length < 2) return err("cp: needs a source and a destination");
    const dest = absPath(rest[rest.length - 1], cwd);
    const destNode = node(dest);
    for (const s of rest.slice(0, -1)){
      const src = absPath(s, cwd), n = node(src);
      if (!n){ err("cp: " + s + ": no such file or directory"); continue; }
      if (n.type === "dir" && !rec){ err("cp: " + s + ": is a directory (use -r)"); continue; }
      if (destNode && destNode.type === "dir") copyPath(src, dest);
      else {
        if (!node(dirName(dest))){ err("cp: no such directory"); continue; }
        const placed = copyPath(src, dirName(dest));
        if (placed) renamePath(dirName(dest) + "/" + placed, baseName(dest));
      }
    }
    refreshFiles();
  };
  CMDS.trash = function(a){
    if (!a.length) return err("trash: missing operand");
    let n = 0;
    for (const t of a){
      const p = absPath(t, cwd);
      if (!node(p)){ err("trash: " + t + ": no such file or directory"); continue; }
      if (trashPath(p)) n++;
    }
    refreshFiles();
    if (n) line([[n + " item(s) moved to Trash", "t-dim"]]);
  };
  CMDS.backup = function(){ downloadBackup(); line([["backup written to your downloads", "t-ok"]]); };
  CMDS.save = function(a){
    if (!a.length) return err("save: which file? (save <path> copies it to your computer)");
    for (const t of a){
      const p = absPath(t, cwd), n = node(p);
      if (!n){ err("save: " + t + ": no such file or directory"); continue; }
      if (n.type === "dir"){ err("save: " + t + ": is a directory"); continue; }
      saveToComputer(p);
      line([["saving ", "t-dim"], [baseName(p), "t-ok"], [" to your computer", "t-dim"]]);
    }
  };
  CMDS.wallpaper = function(a){
    if (!a.length) return err("wallpaper: which image or video?");

  CMDS.unbox = async function(a, raw){
    const words = raw.trim();
    if (!words || words === "help"){
      block(
"unbox - bring music, video and pictures in from the open web\n\n" +
"  unbox <words>            find audio and install the best match\n" +
"  unbox search <words>     list what is out there, without installing\n" +
"  unbox video <words>      look for video\n" +
"  unbox image <words>      look for pictures\n" +
"  unbox search video <w>   the words above combine, in any order\n" +
"  unbox list               what you have brought in so far\n" +
"  unbox remove <words>     take one back out\n\n" +
"Sources are Openverse (which covers Jamendo, Freesound and ccMixter),\n" +
"Wikimedia Commons and the Internet Archive. Everything is freely licensed.\n" +
"Files are linked rather than copied - they play straight from the source\n" +
"and use none of your storage.");
      return;
    }
    /* Leading words choose the mode and the kind, in whatever order, and the
       rest is the search. Only leading ones count, so "unbox video game
       music" still searches video for "game music" rather than guessing. */
    let mode = "install", kind = "audio";
    const tokens = words.split(/\s+/);
    while (tokens.length){
      const t = tokens[0].toLowerCase();
      if (t === "search" || t === "find") mode = "search";
      else if (t === "list") mode = "list";
      else if (t === "remove" || t === "rm") mode = "remove";
      else if (t === "video" || t === "videos" || t === "film") kind = "video";
      else if (t === "image" || t === "images" || t === "picture" || t === "pictures") kind = "image";
      else if (t === "audio" || t === "music" || t === "song" || t === "songs") kind = "audio";
      else break;
      tokens.shift();
    }
    const query = tokens.join(" ");
    const kindWord = kind === "audio" ? "" : kind + " ";

    if (mode === "list"){
      const have = unboxInstalled();
      if (!have.length) return line([["nothing brought in yet", "t-dim"]]);
      have.forEach(h => line([[tilde(h.path), ""],
                              ["  " + (h.url.match(/\/\/([^/]+)/) || [, "?"])[1], "t-dim"]]));
      line([[have.length + " item(s)", "t-dim"]]);
      return;
    }
    if (mode === "remove"){
      if (!query) return err("unbox remove: which one? try unbox list");
      const hit = unboxInstalled().find(h => h.name.toLowerCase().includes(query.toLowerCase()));
      if (!hit) return err("unbox remove: nothing matching " + query);
      removePath(hit.path);
      refreshFilesViews();
      for (const w of windows.values())
        if ((w.appId === "music" || w.appId === "videos") && w.api.refresh) w.api.refresh();
      return line([["removed ", "t-dim"], [hit.name, "t-ok"]]);
    }
    if (!query) return err("unbox: what should I look for?");

    line([["searching for ", "t-dim"], [query, "t-key"],
          [kind === "audio" ? "" : " (" + kind + ")", "t-dim"], ["\u2026", "t-dim"]]);
    let found;
    try { found = await unboxSearch(query, kind); }
    catch (e){ return err("unbox: could not reach the catalogues (" + e.name + ")"); }
    if (!found.length) return err("unbox: nothing found for " + query);

    const mins = s => s ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : "";
    if (mode === "search"){
      found.slice(0, 12).forEach((f, i) => {
        line([[String(i + 1).padStart(3) + "  ", "t-dim"],
              [f.title.length > 40 ? f.title.slice(0, 40) + "\u2026" : f.title, ""],
              ["  " + (f.seconds ? mins(f.seconds) : fmtBytes(f.bytes)), "t-dim"],
              ["  " + f.from + (f.license ? " " + f.license : ""), "t-img"]]);
      });
      line([[found.length + " found - run ", "t-dim"],
            ["unbox " + kindWord + query, "t-key"], [" to install the first", "t-dim"]]);
      return;
    }
    const already = unboxInstalled().find(h => h.url === found[0].url);
    if (already) return line([["already here: ", "t-dim"], [tilde(already.path), "t-ok"]]);

    const at = unboxInstall(found[0], kind);
    const f = found[0];
    line([["installed ", "t-dim"], [baseName(at), "t-ok"],
          ["  " + (f.seconds ? mins(f.seconds) : fmtBytes(f.bytes)) + "  " + f.from +
           (f.license ? " " + f.license : ""), "t-dim"]]);
    if (found.length > 1)
      line([[found.length - 1 + " other matches - ", "t-dim"],
            ["unbox search " + kindWord + query, "t-key"]]);
    notify("Unboxed", baseName(at) + " is in " + tilde(dirName(at)) + ".", "\uD83D\uDCE6");
  };
  CMDS.neofetch = function(){
    const art =
"          |\\\n" +
"          | \\\n" +
"          |  \\   |\\\n" +
"          |   \\  | \\\n" +
"          |____\\ |__\\\n" +
"    ______|______|______\n" +
"    \\                  /\n" +
"     \\________________/";

      if (it === null) r.append(el("span", "t-dim", "----------------------"));
      else if (it && it.length === 3) r.append(el("span", "t-ok", it[0]), el("span", "t-dim", it[1]), el("span", "t-ok", it[2]));
      else if (it) r.append(el("span", "t-key", it[0] + ": "), el("span", null, it[1]));
      else r.textContent = " ";

  };
  CMDS.ll = CMDS.ls;
  CMDS.dir = CMDS.ls;
  CMDS["?"] = CMDS.help;

  /* a command line can hold several commands: ";" runs the next one whatever
     happened, "&&" only if the one before it worked */
  function splitChain(s){
    const outp = [];
    let buf = "", sep = ";", quote = "";
    for (let i = 0; i < s.length; i++){
      const c = s[i];
      if (quote){ if (c === quote) quote = ""; buf += c; continue; }
      if (c === '"' || c === "'"){ quote = c; buf += c; continue; }
      if (c === "&" && s[i + 1] === "&"){ outp.push({ sep, text: buf.trim() }); buf = ""; sep = "&&"; i++; continue; }
      if (c === ";"){ outp.push({ sep, text: buf.trim() }); buf = ""; sep = ";"; continue; }
      buf += c;
    }
    outp.push({ sep, text: buf.trim() });
    return outp.filter(x => x.text);
  }
  /* the closest command by edit distance, for "did you mean"; swapped
     letters count as one slip, so "hlep" still finds "help" */
  function nearest(word){
    const dist = (a, b) => {
      const d = Array.from({ length: a.length + 1 }, (_, i) => [i].concat(new Array(b.length).fill(0)));
      for (let j = 0; j <= b.length; j++) d[0][j] = j;
      for (let i = 1; i <= a.length; i++)
        for (let j = 1; j <= b.length; j++){
          d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
          if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1])
            d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
        }
      return d[a.length][b.length];
    };
    let best = null, score = 99;
    for (const c of Object.keys(CMDS)){
      const n = dist(word.toLowerCase(), c);
      if (n < score){ score = n; best = c; }
    }
    return score <= (word.length <= 3 ? 1 : 2) ? best : null;
  }

  async function runOne(cmdline){
    const parts = cmdline.split(/\s+/), cmd = parts[0], args = parts.slice(1);
    const rest = cmdline.slice(cmd.length).trim();
    if (!CMDS[cmd]){
      err("bsh: command not found: " + cmd);
      const guess = nearest(cmd);
      if (guess) line([["Did you mean ", "t-dim"], [guess, "t-key"], ["?", "t-dim"]]);
      else line([["Type ", "t-dim"], ["help", "t-key"], [" for a list of commands.", "t-dim"]]);
      return false;
    }
    failed = false;
    try { await CMDS[cmd](args, rest); }
    catch (e){ err(cmd + ": " + e.message); return false; }
    return !failed;
  }
  async function run(raw){
    let cmdline = raw.trim();
    /* !! repeats the last command, the way a real shell does */
    if (cmdline === "!!") cmdline = hist[hist.length - 1] || "";
    const echoRow = el("div", "term-row");
    echoRow.append(el("span", "ps1-u", "box@seaos"), el("span", "ps1-s", ":"),
                   el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "), el("span", null, cmdline));
    out.appendChild(echoRow);
    if (!cmdline) return;
    hist.push(cmdline);
    hi = hist.length;
    let ok = true;
    for (const step of splitChain(cmdline)){
      if (step.sep === "&&" && !ok) continue;    /* the rest of this chain is skipped */
      if (step.sep === ";") ok = true;
      ok = await runOne(step.text);
      scroll();
    }
  }

  inp.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === "Return"){
      const v = inp.value;
      inp.value = "";
      run(v);
      drawPs1();
      scroll();
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      if (hi > 0){ hi--; inp.value = hist[hi] || ""; setTimeout(() => inp.setSelectionRange(999, 999), 0); }
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      if (hi < hist.length - 1){ hi++; inp.value = hist[hi] || ""; }
      else { hi = hist.length; inp.value = ""; }
    } else if (e.key === "Tab"){
      e.preventDefault();
      const value = inp.value;
      const parts = value.split(/\s+/);
      const word = parts[parts.length - 1] || "";
      let options, replaceFrom = word;

      if (parts.length <= 1){
        options = Object.keys(CMDS).filter(c => c.startsWith(word)).sort();
      } else {
        /* complete a path: split off the directory the user already typed */
        const slash = word.lastIndexOf("/");
        const dirPart = slash >= 0 ? word.slice(0, slash + 1) : "";
        const stem = slash >= 0 ? word.slice(slash + 1) : word;
        const dir = node(absPath(dirPart || ".", cwd));
        if (!dir || dir.type !== "dir") return;
        options = listDir(dir)
          .filter(nm => nm.toLowerCase().startsWith(stem.toLowerCase()))
          .map(nm => dirPart + nm + (dir.children[nm].type === "dir" ? "/" : ""));
        replaceFrom = word;
      }
      if (!options.length) return;

      /* one match completes, several fill in the shared prefix and list */
      let insert = options[0];
      if (options.length > 1){
        let prefix = options[0];
        for (const o of options) while (!o.startsWith(prefix)) prefix = prefix.slice(0, -1);
        insert = prefix.length >= replaceFrom.length ? prefix : replaceFrom;
        const row = el("div", "term-row");
        options.forEach(o => {
          const sp = el("span", o.endsWith("/") ? "t-dir" : null, o);
          sp.style.marginRight = "18px";
          row.appendChild(sp);
        });
        out.appendChild(row);
        scroll();
      }
      parts[parts.length - 1] = insert;
      inp.value = parts.join(" ") + (options.length === 1 && !insert.endsWith("/") ? " " : "");
      setTimeout(() => inp.setSelectionRange(999, 999), 0);
    } else if (e.ctrlKey && !e.altKey && !e.metaKey){
      /* the line-editing keys a real shell gives you */
      const k = (e.key || "").toLowerCase();
      const pos = inp.selectionStart;
      const put = (v, caret) => {
        inp.value = v;
        const c = caret === undefined ? v.length : caret;
        setTimeout(() => inp.setSelectionRange(c, c), 0);
      };
      if (k === "l"){ e.preventDefault(); out.innerHTML = ""; }
      else if (k === "a"){ e.preventDefault(); inp.setSelectionRange(0, 0); }
      else if (k === "e"){ e.preventDefault(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      else if (k === "u"){ e.preventDefault(); put(inp.value.slice(pos), 0); }
      else if (k === "k"){ e.preventDefault(); put(inp.value.slice(0, pos), pos); }
      else if (k === "w"){
        e.preventDefault();
        const head = inp.value.slice(0, pos).replace(/\S+\s*$/, "");
        put(head + inp.value.slice(pos), head.length);
      }
      else if (k === "c" && !getSelection().toString()){
        /* nothing to copy, so treat it as abandoning the line */
        e.preventDefault();
        const row = el("div", "term-row");
        row.append(el("span", "ps1-u", "box@seaos"), el("span", "ps1-s", ":"),
                   el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "),
                   el("span", null, inp.value + "^C"));
        out.appendChild(row);
        inp.value = "";
        hi = hist.length;
        scroll();
      }
    }
  });
  wrap.addEventListener("pointerdown", e => {
    if (!e.target.closest("input") && !getSelection().toString()) setTimeout(() => inp.focus(), 0);
  });

  const motd = node("/etc/motd");
  block(motd ? motd.content : "SEA OS", "t-dim");
  drawPs1();
  setTimeout(() => inp.focus(), 30);
  return {
    focusInput: () => inp.focus(),
    /* a file dropped on the terminal types its path at the prompt */
    insert(text){
      inp.value += (inp.value && !/\s$/.test(inp.value) ? " " : "") + text;
      inp.focus();
      setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length), 0);
    },
    menus(){
      return {
        File: [
          { label: "New Terminal", run: () => launch("terminal") },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        Edit: [
          { label: "Clear screen", run: () => { out.innerHTML = ""; } },
          { label: "Copy", run: () => document.execCommand("copy") }
        ],
        View: [
          { label: "Go home", run: () => { cwd = HOME; drawPs1(); } },
          { label: "Show help", run: () => { run("help"); drawPs1(); scroll(); } }
        ]
      };
    }
  };
}

             '<button class="tb-btn" data-v="boot">Set as boot screen</button>'

    '<button class="tb-btn" data-v="fit">Fit</button><button class="tb-btn" data-v="full">100%</button></div>';
  const stage = $(".vw-stage", B), info = $(".vw-info", B);

  if (!n || n.type !== "file"){ info.textContent = "File not found."; return {}; }
  media.src = n.content;

  if (video){
    media.onloadedmetadata = () => {
      info.textContent = baseName(path) + " \u00b7 " + media.videoWidth + "x" + media.videoHeight +
        " \u00b7 " + Math.round(media.duration) + "s \u00b7 " + size;

  } else {
    media.onload = () => { info.textContent = baseName(path) + " \u00b7 " + media.naturalWidth + "x" + media.naturalHeight + " \u00b7 " + size; };
    media.onerror = () => { info.textContent = baseName(path) + " \u00b7 could not be displayed"; };

  $('[data-v="save"]', B).onclick = () => saveToComputer(path);

  $('[data-v="full"]', B).onclick = () => stage.classList.remove("fit");
  return { onClose(){ if (video){ media.pause(); media.removeAttribute("src"); } return true; } };

/* ============================================================
   12b. Paint - draws to a canvas and saves a real PNG into Pictures
   ============================================================ */
const PAINT_COLORS = ["#1e1e1e","#ffffff","#c9534b","#e08a3c","#d8bd6a","#8bae5a",
                      "#3aa99f","#4a90d9","#9268b8","#d0699e","#7a5c46","#8a8a8a"];

function paintApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="pt-tb">' +
      '<div class="pt-swatches"></div>' +
      '<span class="pt-sep"></span>' +
      '<div class="seg pt-sizes"></div>' +
      '<button class="tb-btn" data-p="erase" title="Eraser">Eraser</button>' +
      '<span class="ed-sp"></span>' +
      '<button class="tb-btn" data-p="clear">Clear</button>' +
      '<button class="tb-btn accent" data-p="save">Save to Pictures</button>' +
    '</div>' +
    '<div class="pt-stage"><canvas></canvas></div>' +
    '<div class="pt-status"></div>';

  const cv = $("canvas", B), ctx = cv.getContext("2d");
  const stage = $(".pt-stage", B), status = $(".pt-status", B);
  let color = "#1e1e1e", size = 4, erasing = false, drawing = false, last = null, dirty = false;

  function fit(){
    const w = Math.max(200, stage.clientWidth - 24), h = Math.max(160, stage.clientHeight - 24);
    if (cv.width === w && cv.height === h) return;
    const keep = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = w; cv.height = h;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
    if (keep) ctx.putImageData(keep, 0, 0);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
  }
  const swatches = $(".pt-swatches", B);
  PAINT_COLORS.forEach(c => {
    const b = el("button", "pt-sw" + (c === color ? " on" : ""));
    b.style.background = c;
    b.onclick = () => {
      color = c; erasing = false;
      $$(".pt-sw", B).forEach(o => o.classList.toggle("on", o.style.background === b.style.background));
      $('[data-p="erase"]', B).classList.remove("on");
      say();
    };
    swatches.appendChild(b);
  });
  const sizes = $(".pt-sizes", B);
  [2, 4, 9, 18].forEach(n => {
    const b = el("button", n === size ? "on" : null, String(n));
    b.onclick = () => { size = n; $$("button", sizes).forEach(o => o.classList.toggle("on", o === b)); say(); };
    sizes.appendChild(b);
  });
  const eraseBtn = $('[data-p="erase"]', B);
  eraseBtn.onclick = () => { erasing = !erasing; eraseBtn.classList.toggle("on", erasing); say(); };
  $('[data-p="clear"]', B).onclick = async () => {
    if (dirty && !(await osConfirm("Clear canvas", "Throw away this drawing?", "Clear", true))) return;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, cv.width, cv.height);
    dirty = false;
    say();
  };
  $('[data-p="save"]', B).onclick = async () => {
    const name = await osPrompt("Save drawing", "File name", "drawing.png");
    if (!name) return;
    const fname = /\.png$/i.test(name) ? name : name + ".png";
    ensureDir(HOME + "/Pictures");
    let data;
    try { data = cv.toDataURL("image/png"); }
    catch (e){
      return osAlert("Cannot save this one",
        "The picture on the canvas came from a site that will not let the page read it back, " +
        "so it cannot be written to a file.");
    }
    const saved = addUnique(HOME + "/Pictures", fname, data, "image", "image/png");
    dirty = false;
    say();
    notify("Drawing saved", "Pictures/" + saved, String.fromCodePoint(0x1F3A8));
    openImage(HOME + "/Pictures/" + saved);
  };

  const at = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  };
  cv.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    drawing = true;
    last = at(e);
    stroke(last, last);
  });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const p = at(e); stroke(last, p); last = p; });
  const stop = () => { if (drawing) say(); drawing = false; last = null; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  function stroke(a, b){
    ctx.strokeStyle = erasing ? "#ffffff" : color;
    ctx.lineWidth = erasing ? size * 2.5 : size;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    dirty = true;
  }
  function say(){
    status.textContent = (erasing ? "Eraser" : "Brush") + " - " + size + "px - " +
      cv.width + " x " + cv.height + (dirty ? " - unsaved" : "");
  }
  /* an image dropped on Paint is drawn onto the canvas, scaled to fit */
  function loadImage(p){
    const n = node(p);
    if (!n || n.type !== "file") return;
    const img = new Image();
    /* a picture linked from the web taints the canvas unless its host
       allows the read; most of the catalogues do, and if this one does
       not the drawing simply cannot be saved back out */
    if (/^https?:/i.test(n.content)) img.crossOrigin = "anonymous";
    img.onload = () => {
      fit();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cv.width, cv.height);
      const s = Math.min(cv.width / img.width, cv.height / img.height, 1);
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      ctx.drawImage(img, Math.round((cv.width - w) / 2), Math.round((cv.height - h) / 2), w, h);
      dirty = true;
      say();
      win.setTitle(baseName(p));
    };
    img.onerror = () => osAlert("Cannot open that", baseName(p) + " would not load as a picture.");
    img.src = n.content;
  }
  const ro = new ResizeObserver(() => { fit(); say(); });
  ro.observe(stage);
  setTimeout(() => { fit(); say(); if (startPath) loadImage(startPath); }, 0);
  return { loadImage, onClose(){ ro.disconnect(); return true; } };
}

/* ============================================================
   12c. Minesweeper
   ============================================================ */
const MINE_LEVELS = {
  easy:   { w: 9,  h: 9,  m: 10, label: "Easy" },
  medium: { w: 16, h: 16, m: 40, label: "Medium" },
  hard:   { w: 24, h: 16, m: 70, label: "Hard" }
};

function minesApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="ms-tb">' +
      '<div class="seg ms-levels"></div>' +
      '<span class="ed-sp"></span>' +
      '<div class="ms-stat"><span class="ms-flags">0</span> left</div>' +
      '<button class="tb-btn ms-face">Reset</button>' +
      '<div class="ms-stat"><span class="ms-time">0</span>s</div>' +
    '</div>' +
    '<div class="ms-stage"><div class="ms-grid"></div></div>';

  const grid = $(".ms-grid", B), flagsEl = $(".ms-flags", B), timeEl = $(".ms-time", B);
  let level = "easy", cells = [], W = 0, H = 0, M = 0;
  let started = false, over = false, t0 = 0, timer = 0, revealed = 0;

  const seg = $(".ms-levels", B);
  for (const id in MINE_LEVELS){
    const b = el("button", id === level ? "on" : null, MINE_LEVELS[id].label);
    b.onclick = () => { level = id; $$("button", seg).forEach(o => o.classList.toggle("on", o === b)); reset(); };
    seg.appendChild(b);
  }
  $(".ms-face", B).onclick = reset;

  const idx = (x, y) => y * W + x;
  function neighbours(x, y){
    const out = [];
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++){
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.push(cells[idx(nx, ny)]);
      }
    return out;
  }
  function reset(){
    const L = MINE_LEVELS[level];
    W = L.w; H = L.h; M = L.m;
    started = over = false;
    revealed = 0;
    clearInterval(timer);
    timeEl.textContent = "0";
    flagsEl.textContent = String(M);
    cells = [];
    grid.innerHTML = "";
    grid.style.gridTemplateColumns = "repeat(" + W + ", 22px)";
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++){
        const b = el("button", "ms-cell");
        const c = { x, y, el: b, mine: false, open: false, flag: false, n: 0 };
        b.onclick = () => open(c);
        b.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); flag(c); };
        cells.push(c);
        grid.appendChild(b);
      }
    $(".ms-face", B).textContent = "Reset";
    win.setTitle("Minesweeper");
  }
  function layMines(safe){
    const pool = cells.filter(c => c !== safe && !neighbours(safe.x, safe.y).includes(c));
    for (let i = 0; i < M && pool.length; i++){
      const k = Math.floor(Math.random() * pool.length);
      pool[k].mine = true;
      pool.splice(k, 1);
    }
    for (const c of cells) c.n = neighbours(c.x, c.y).filter(o => o.mine).length;
  }
  function open(c){
    if (over || c.open || c.flag) return;
    if (!started){
      started = true;
      layMines(c);
      t0 = Date.now();
      timer = setInterval(() => { timeEl.textContent = String(Math.floor((Date.now() - t0) / 1000)); }, 500);
    }
    if (c.mine) return boom(c);
    const stack = [c];
    while (stack.length){
      const cur = stack.pop();
      if (cur.open || cur.flag) continue;
      cur.open = true;
      revealed++;
      cur.el.classList.add("open");
      if (cur.n){ cur.el.textContent = String(cur.n); cur.el.dataset.n = String(cur.n); }
      else neighbours(cur.x, cur.y).forEach(o => { if (!o.open && !o.mine) stack.push(o); });
    }
    if (revealed === W * H - M) win_();
  }
  function flag(c){
    if (over || c.open) return;
    c.flag = !c.flag;
    c.el.classList.toggle("flag", c.flag);
    c.el.textContent = c.flag ? String.fromCodePoint(0x1F6A9) : "";
    flagsEl.textContent = String(M - cells.filter(o => o.flag).length);
  }
  function boom(c){
    over = true;
    clearInterval(timer);
    c.el.classList.add("boom");
    for (const o of cells){
      if (o.mine){ o.el.classList.add("open", "mine"); o.el.textContent = String.fromCodePoint(0x1F4A3); }
      else if (o.flag && !o.mine) o.el.textContent = String.fromCodePoint(0x274C);
    }
    $(".ms-face", B).textContent = "Try again";
    win.setTitle("Minesweeper - boom");
    notify("Minesweeper", "You hit a mine on " + MINE_LEVELS[level].label.toLowerCase() + ".", String.fromCodePoint(0x1F4A3));
  }
  function win_(){
    over = true;
    clearInterval(timer);
    const secs = Math.floor((Date.now() - t0) / 1000);
    for (const o of cells) if (o.mine && !o.flag){ o.el.classList.add("flag"); o.el.textContent = String.fromCodePoint(0x1F6A9); }
    $(".ms-face", B).textContent = "Play again";
    win.setTitle("Minesweeper - cleared");
    notify("Minesweeper cleared", MINE_LEVELS[level].label + " in " + secs + " seconds.", String.fromCodePoint(0x1F3C6));
  }
  reset();
  return { onClose(){ clearInterval(timer); return true; } };
}

/* ============================================================
   12d. Calculator
   ============================================================ */
function calcApp(win){
  const B = win.body;
  const keys = [["C","+/-","%","/"],["7","8","9","x"],["4","5","6","-"],["1","2","3","+"],["0",".","="]];
  B.innerHTML = '<div class="ca-out"><div class="ca-sub"></div><div class="ca-main">0</div></div><div class="ca-pad"></div>';
  const out = $(".ca-main", B), sub = $(".ca-sub", B), pad = $(".ca-pad", B);

  let acc = null, op = null, cur = "0", fresh = true;
  const show = () => {
    const n = parseFloat(cur);
    out.textContent = (cur.length > 12 && Number.isFinite(n)) ? String(+n.toPrecision(9)) : cur;
    sub.textContent = acc === null ? "" : acc + " " + (op || "");
  };
  function digit(d){
    if (fresh){ cur = d === "." ? "0." : d; fresh = false; }
    else if (d === "." && cur.includes(".")) return;
    else cur = cur === "0" && d !== "." ? d : cur + d;
    show();
  }
  const compute = (a, b, o) =>
    o === "+" ? a + b : o === "-" ? a - b : o === "x" ? a * b : o === "/" ? (b === 0 ? NaN : a / b) : b;
  function setOp(o){
    const v = parseFloat(cur);
    if (acc !== null && op && !fresh) acc = compute(acc, v, op);
    else acc = v;
    op = o;
    fresh = true;
    cur = String(acc);
    show();
    cur = String(acc);
  }
  function equals(){
    if (acc === null || !op) return;
    const r = compute(acc, parseFloat(cur), op);
    cur = Number.isFinite(r) ? String(+r.toFixed(10)) : "Cannot divide by zero";
    acc = null; op = null; fresh = true;
    show();
  }
  function press(k){
    if (/^[0-9.]$/.test(k)) return digit(k);
    if (k === "C"){ acc = null; op = null; cur = "0"; fresh = true; return show(); }
    if (k === "+/-"){ cur = String(parseFloat(cur) * -1); return show(); }
    if (k === "%"){ cur = String(parseFloat(cur) / 100); return show(); }
    if (k === "=") return equals();
    return setOp(k);
  }
  keys.forEach(rowKeys => {
    const row = el("div", "ca-row");
    rowKeys.forEach(k => {
      const b = el("button", "ca-key" + (/[+\-x\/=]/.test(k) && k.length === 1 ? " op" : "") + (k === "0" ? " wide" : ""), k);
      b.onclick = () => press(k);
      row.appendChild(b);
    });
    pad.appendChild(row);
  });
  B.tabIndex = 0;
  B.addEventListener("keydown", e => {
    const map = { Enter: "=", "*": "x", Escape: "C", Backspace: "C" };
    const k = map[e.key] || e.key;
    if (/^([0-9.]|[+\-x/=%]|C)$/.test(k)){ e.preventDefault(); press(k); }
  });
  setTimeout(() => B.focus(), 0);
  show();
  return {};
}

function trashApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="fm-tb">' +
      '<span class="tr-count"></span><span class="ed-sp"></span>' +
      '<button class="tb-btn" data-t="restore" disabled>Put back</button>' +

      '<button class="tb-btn" data-t="empty">Empty Trash</button>' +
    '</div>' +
    '<div class="fm-list"><table class="fm-tab">' +
      '<thead><tr><th>Name</th><th class="col-type">Was in</th><th class="col-size">Deleted</th></tr></thead><tbody></tbody>' +
    '</table></div>' +
    '<div class="fm-status"></div>';
  const tbody = $("tbody", B), status = $(".fm-status", B);
  let sel = null;

  function draw(){
    tbody.innerHTML = "";
    for (const t of Trash.items){
      const tr = el("tr");
      tr.dataset.id = t.id;
      const td = el("td", "col-name");
      td.append(el("span", "fi", nodeIcon(t.name, t.node)), document.createTextNode(t.name));
      tr.append(td, el("td", "col-type", tilde(t.from)), el("td", "col-size", fmtAgo(t.when)));
      if (t.id === sel) tr.classList.add("sel");
      tr.onclick = () => { sel = t.id; draw(); };
      tr.ondblclick = () => putBack(t.id);
      tbody.appendChild(tr);
    }
    if (!Trash.items.length){
      const tr = el("tr"), td = el("td", "fm-empty", "Trash is empty");
      td.colSpan = 3;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    $(".tr-count", B).textContent = Trash.items.length + (Trash.items.length === 1 ? " item" : " items");
    $('[data-t="restore"]', B).disabled = !sel;
    $('[data-t="del"]', B).disabled = !sel;
    $('[data-t="empty"]', B).disabled = !Trash.items.length;
    status.textContent = Trash.items.length
      ? Trash.items.length + " item(s) \u00b7 " + fmtBytes(trashBytes()) + " \u00b7 double-click to put something back"
      : "Nothing here. Deleted files land in Trash until you empty it.";
    win.setTitle("Trash" + (Trash.items.length ? " (" + Trash.items.length + ")" : ""));
  }
  function putBack(id){
    const to = restoreTrash(id);
    sel = null;
    draw();
    refreshFilesViews();
    if (to) notify("Put back", tilde(to), "\u21A9\uFE0F");
  }
  $('[data-t="restore"]', B).onclick = () => sel && putBack(sel);
  $('[data-t="del"]', B).onclick = async () => {
    const t = Trash.items.find(x => x.id === sel);
    if (!t) return;
    if (!(await osConfirm("Delete forever", "Permanently delete " + t.name + "?", "Delete forever", true))) return;
    Trash.items = Trash.items.filter(x => x.id !== sel);
    sel = null;
    saveTrash();
    draw();
  };
  $('[data-t="empty"]', B).onclick = async () => {
    if (!Trash.items.length) return;
    if (!(await osConfirm("Empty Trash", "Permanently delete all " + Trash.items.length + " item(s)?\n\nThis cannot be undone.", "Empty Trash", true))) return;
    emptyTrash();
    sel = null;
    draw();
  };
  draw();
  return { refresh: draw };
}

   links Media can play: YouTube, and direct links to media files
   ============================================================ */
/* YouTube links arrive in every shape they get shared in */
function parseYouTube(raw){
  let u;
  try { u = new URL(String(raw || "").trim()); } catch (e){ return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, "");
  let id = null;
  const list = u.searchParams.get("list") || null;
  if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
  else if (host === "youtube.com" || host === "youtube-nocookie.com"){
    if (u.pathname === "/watch") id = u.searchParams.get("v");
    else {
      const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]+)/);
      if (m) id = m[1];
    }
  } else return null;
  if (id && !/^[\w-]{6,20}$/.test(id)) id = null;
  if (!id && !list) return null;
  return { id, list };
}
let youTubeApiLoading = null;
function loadYouTubeApi(){
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (!youTubeApiLoading){
    youTubeApiLoading = new Promise((ok, fail) => {
      const before = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (typeof before === "function") before(); ok(); };
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      s.onerror = () => { youTubeApiLoading = null; fail(new Error("YouTube's player would not load. Check you are online.")); };
      document.head.appendChild(s);
    });
  }
  return youTubeApiLoading;
}
/* YouTube lets any page ask for a video's title, channel and thumbnail */
async function youTubeInfo(url){
  try {
    const res = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(url));
    if (!res.ok) return null;
    const j = await res.json();
    return { title: j.title || "", author: j.author_name || "", thumb: j.thumbnail_url || "" };
  } catch (e){ return null; }
}

function musicApp(win, startPath, only){
  const B = win.body;
  B.innerHTML =
    '<video class="mu-video" playsinline></video>' +
    '<div class="mu-yt"></div>' +
    '<div class="mu-now">' +

    '</div>' +
    '<div class="mu-controls">' +
      '<button class="tb-btn" data-m="prev" title="Previous">&#9198;</button>' +

      '<span class="mu-time">0:00</span>' +
      '<input class="mu-vol" type="range" min="0" max="100" value="90" title="Volume">' +
    '</div>' +
    '<div class="mu-list"></div>';

  const audio = new Audio();
  const video = $(".mu-video", B), ytBox = $(".mu-yt", B);
  const listEl = $(".mu-list", B), seek = $(".mu-seek", B), timeEl = $(".mu-time", B), vol = $(".mu-vol", B);
  const playBtn = $('[data-m="play"]', B), openBtn = $('[data-m="open"]', B), art = $(".mu-art", B);
  let media = audio;                 /* the element playing a file, local or linked */
  let mode = "file";                 /* "file" or "yt" */
  let yt = null, ytPoll = 0;
  let tracks = [], at = -1, seeking = false;

  const fmtTime = s => {
    if (!Number.isFinite(s)) return "0:00";
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  };
  const isWeb = t => typeof t !== "string";
  const titleOf = t => (isWeb(t) ? t.title : baseName(t));
  const pathOfUrl = url => { try { return decodeURIComponent(new URL(url).pathname); } catch (e){ return ""; } };
  const hostOfUrl = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e){ return ""; } };
  const ytPlaying = () => !!(yt && yt.getPlayerState && window.YT && yt.getPlayerState() === YT.PlayerState.PLAYING);
  const isPlaying = () => (mode === "yt" ? ytPlaying() : !media.paused);

  function setNow(title, sub, thumb){
    $(".mu-title", B).textContent = title;
    $(".mu-sub", B).textContent = sub;
    art.style.backgroundImage = thumb ? 'url("' + String(thumb).replace(/"/g, "%22") + '")' : "";
    art.classList.toggle("thumb", !!thumb);
    art.textContent = thumb ? "" : "🎵";
  }

  function scan(){
    const current = at >= 0 ? tracks[at] : null;
    tracks = [];
    walkFS((p, n, name) => {
      if (n.type !== "file") return;
      const v = isVideo(name), a = isAudio(name);
      if (only === "video" ? v : only === "audio" ? a : (v || a)) tracks.push(p);
    });
    tracks = tracks.concat(State.webMedia || []);
    /* keep pointing at the same track wherever the list moved it, or "next"
       after a rescan or a removal starts again from the top */
    at = current == null ? -1 : tracks.indexOf(current);
    drawList();
  }
  function drawList(){
    listEl.innerHTML = "";
    if (!tracks.length){
      listEl.appendChild(el("div", "wb-none", only === "video"
        ? "No videos yet. Drop an .mp4 into the repo's videos/ folder, or import one in Files."
        : "Nothing to play yet. Import a file in Files, add one to the repo's music/ folder, or play a link."));
      return;
    }
    let webHeading = false;
    tracks.forEach((t, i) => {
      if (isWeb(t) && !webHeading){
        webHeading = true;
        listEl.appendChild(el("div", "mu-sec", "From the web"));
      }
      const on = i === at;
      const b = el("button", "mu-row" + (on ? " on" : ""));
      const icon = on && isPlaying() ? "▶"
                 : isWeb(t) ? (t.kind === "yt" ? "📺" : "🔗")

      b.append(el("span", "g", icon), el("span", "mu-n", titleOf(t)),
               el("span", "mu-d", isWeb(t) ? (t.author || hostOfUrl(t.url)) : tilde(dirName(t))));
      b.onclick = () => playIndex(i);
      if (isWeb(t)) b.oncontextmenu = e => {
        e.preventDefault();
        e.stopPropagation();
        showCtx(e.clientX, e.clientY, [
          { icon: "▶", label: "Play", run: () => playIndex(i) },
          { icon: "↗️", label: t.kind === "yt" ? "Open on YouTube" : "Open the link", run: () => window.open(t.url, "_blank", "noopener") },
          "-",
          { icon: "✖", label: "Remove from the list", run: () => {
              if (i === at) stopAll();
              State.webMedia = (State.webMedia || []).filter(x => x.url !== t.url);
              saveSettings();
              scan();
            } }
        ]);
      };
      listEl.appendChild(b);
    });
  }

  function stopAll(){
    audio.pause();
    video.pause();

    mode = "file";
    let src, asVideo, title, sub;

      const n = node(t);

      sub = tilde(dirName(t));
