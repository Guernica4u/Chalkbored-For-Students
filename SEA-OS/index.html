<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEA OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%230F6E56'/><path d='M30 8V42H11Z' fill='%23fff'/><path d='M35 17V42H51Z' fill='%23fff' fill-opacity='.72'/><path d='M9 46H55L48 55H16Z' fill='%23fff'/></svg>">
<style>
/* ============================================================
   SEA OS 0.92 - a mini desktop in a single HTML file
   Flat colours, no gradients.
   ============================================================ */
/* an app icon that is inline SVG rather than an emoji */
.app-svg{width:1em;height:1em;display:block;color:var(--seahorse)}
.dock-app .app-svg{width:30px;height:30px}
.mapp .g .app-svg,.win-title .g .app-svg{width:19px;height:19px}
.task .g .app-svg{width:15px;height:15px}
:root{--seahorse:#2b7fd4}
[data-theme="dark"]{--seahorse:#4d9ee8}
:root{
  --accent:#8bae5a;
  --accent-fg:#ffffff;
  --bg:#f6f6f6;
  --surface:#ffffff;
  --surface-2:#f0f0f0;
  --surface-3:#e4e4e4;
  --border:#c6c6c6;
  --border-soft:#dedede;
  --text:#2b2b2b;
  --dim:#767676;
  --sel:#8bae5a;
  --sel-fg:#ffffff;
  --panel:#2c2c2c;
  --panel-fg:#dcdcdc;
  --panel-hover:#3b3b3b;
  --title:#e7e7e7;
  --title-off:#f4f4f4;
  --shadow:0 12px 34px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.16);
  --shadow-off:0 4px 14px rgba(0,0,0,.16);
  --panel-h:42px;
  --wall:#3a3a3a;
  --dicon-w:100px;
  --dicon-g:30px;
}
[data-theme="dark"]{
  --bg:#2a2a2a;
  --surface:#323232;
  --surface-2:#3a3a3a;
  --surface-3:#454545;
  --border:#565656;
  --border-soft:#454545;
  --text:#e6e6e6;
  --dim:#a2a2a2;
  --title:#414141;
  --title-off:#373737;
  --shadow:0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  --shadow-off:0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font:13.5px/1.45 "Segoe UI",Ubuntu,Cantarell,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);background:#111;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none !important}
body.dragging,body.dragging *{user-select:none !important}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.75);background-clip:content-box;border:3px solid transparent}
.btn{
  height:26px;padding:0 11px;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border);border-radius:4px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:#c9534b;border-color:#c9534b;color:#fff}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- boot ---------- */
#boot{
  position:fixed;inset:0;z-index:9000;background:#12160f;color:#c8dcb4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .45s ease;cursor:pointer;
}
#boot .logo{color:#9fc47a}
#boot .name{font-size:26px;letter-spacing:.42em;padding-left:.42em;font-weight:600;color:#e6f0dc}
#boot .sub{font-size:11.5px;letter-spacing:.18em;color:#7d8f6c;text-transform:uppercase}
#boot .ver{margin-top:5px;font-size:11px;letter-spacing:.1em;color:#5f6c53}
#boot .bar{width:230px;height:3px;background:#26301f;border-radius:3px;overflow:hidden;margin-top:8px}
#boot .bar i{display:block;height:100%;width:0;background:#8bae5a;transition:width 1.5s cubic-bezier(.3,.8,.4,1)}
#boot .tip{font-size:11px;color:#5d6b52;margin-top:10px}

/* ---------- desktop ---------- */
#desktop{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#wallpaper{position:absolute;inset:0;background-color:var(--wall);background-size:cover;background-position:center;z-index:0;overflow:hidden}
#wallvideo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:none;pointer-events:none;background:var(--wall);
}
#wallvideo.on{display:block}
#bootvideo,#bootimage{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;
}
#boot.media .boot-default{display:none}
#boot.media #bootvideo.on,#boot.media #bootimage.on{display:block}
#boot .skip{
  position:absolute;right:20px;bottom:16px;font-size:11px;letter-spacing:.06em;
  color:rgba(255,255,255,.55);text-shadow:0 1px 3px rgba(0,0,0,.7);display:none;
}
#boot.media .skip{display:block}
#icons{
  position:absolute;left:0;top:0;bottom:var(--panel-h);width:calc(var(--dicon-w) + 18px);z-index:1;
  padding:12px 0 0 8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;
  flex-wrap:wrap;
}
.dicon{
  width:var(--dicon-w);padding:8px 4px 6px;border-radius:5px;text-align:center;cursor:default;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75);border:1px solid transparent;user-select:none;
}
.dicon .g{font-size:var(--dicon-g);line-height:1.1;display:block}
.dicon .l{display:block;font-size:12px;margin-top:3px;word-break:break-word}
.dicon:hover{background:rgba(255,255,255,.12)}
.dicon.sel{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5)}
/* the window layer spans the whole desktop, so it must let clicks fall
   through to the icons underneath - only the windows themselves catch them */
#windows{position:absolute;left:0;right:0;top:0;bottom:var(--panel-h);z-index:2;pointer-events:none}
.win{pointer-events:auto}

body.panel-top #panel{top:0;bottom:auto;box-shadow:0 1px 0 rgba(0,0,0,.35)}
body.panel-top #windows,body.panel-top #icons{top:var(--panel-h);bottom:0}
body.panel-top #menu{top:calc(var(--panel-h) + 6px);bottom:auto;transform-origin:top left}
body.panel-top #npanel{top:calc(var(--panel-h) + 6px);bottom:auto;transform-origin:top right}
body.icons-small{--dicon-w:82px;--dicon-g:23px}
body.icons-large{--dicon-w:122px;--dicon-g:40px}

/* ---------- panel ---------- */
#panel{
  position:absolute;left:0;right:0;bottom:0;height:var(--panel-h);z-index:5000;
  background:var(--panel);color:var(--panel-fg);display:flex;align-items:center;gap:5px;padding:0 6px;
  box-shadow:0 -1px 0 rgba(0,0,0,.35);
}
#menubtn{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 9px;
  background:transparent;border:0;border-radius:4px;cursor:pointer;font-weight:600;
}
#menubtn:hover,#menubtn.on{background:var(--panel-hover)}
#menubtn .logo{color:var(--accent);display:flex}
.psep{width:1px;height:22px;background:rgba(255,255,255,.14);flex:0 0 auto}
#tasks{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;min-width:0}
.task{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;max-width:190px;min-width:52px;
  background:transparent;border:0;border-bottom:2px solid transparent;border-radius:3px 3px 0 0;
  color:var(--panel-fg);cursor:pointer;opacity:.82;
}
.task .g{font-size:14px;flex:0 0 auto}
.task .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task:hover{background:var(--panel-hover);opacity:1}
.task.active{background:var(--panel-hover);border-bottom-color:var(--accent);opacity:1}
.task.min{opacity:.5;font-style:italic}
body.panel-top .task{border-bottom:0;border-top:2px solid transparent;border-radius:0 0 3px 3px}
body.panel-top .task.active{border-top-color:var(--accent)}
#tray{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.tray-btn{width:30px;height:30px;background:transparent;border:0;border-radius:4px;cursor:pointer;font-size:14px}
.tray-btn:hover{background:var(--panel-hover)}
.tray-btn.spin{animation:spin .55s cubic-bezier(.4,1.4,.5,1)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#clockbtn{
  padding:0 10px;height:34px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15;
  background:transparent;border:0;border-radius:4px;cursor:pointer;position:relative;color:inherit;
}
#clockbtn:hover,#clockbtn.on{background:var(--panel-hover)}
#clockbtn .t{font-size:13px}
#clockbtn .d{font-size:10.5px;opacity:.65}
#clockbtn .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
#clockbtn.unread .dot{display:block}

/* ---------- menu ---------- */
#menu{
  position:absolute;left:6px;bottom:calc(var(--panel-h) + 6px);width:296px;max-height:440px;z-index:5100;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom left;animation:pop .12s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
#menu .search{padding:9px;border-bottom:1px solid var(--border-soft);background:var(--surface-2)}
#menu .search input{
  width:100%;height:28px;padding:0 9px;background:var(--surface);
  border:1px solid var(--border);border-radius:4px;outline:none;
}
#menu .search input:focus{border-color:var(--accent)}
#menu .apps{flex:1;overflow:auto;padding:5px}
.mapp{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  background:transparent;border:0;border-radius:4px;cursor:pointer;text-align:left;
}
.mapp .g{font-size:19px;width:24px;text-align:center;flex:0 0 auto}
.mapp .n{font-weight:500}
.mapp .d{font-size:11.5px;color:var(--dim)}
.mapp:hover,.mapp.hl{background:var(--sel);color:var(--sel-fg)}
.mapp:hover .d,.mapp.hl .d{color:rgba(255,255,255,.8)}
#menu .foot{
  display:flex;align-items:center;gap:6px;padding:7px 9px;
  border-top:1px solid var(--border-soft);background:var(--surface-2);
}
#menu .foot .who{flex:1;font-size:12px;color:var(--dim)}
.mfoot-btn{width:28px;height:28px;border:0;background:transparent;border-radius:4px;cursor:pointer}
.mfoot-btn:hover{background:var(--surface-3)}

/* ---------- notification centre ---------- */
#npanel{
  position:absolute;right:6px;bottom:calc(var(--panel-h) + 6px);width:310px;max-height:480px;z-index:5100;
  background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;animation:pop .12s ease-out;
}
.np-head{padding:12px 14px 10px;border-bottom:1px solid var(--border-soft);background:var(--surface-2)}
.np-time{font-size:25px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
.np-date{font-size:12px;color:var(--dim);margin-top:2px}
.np-cal{padding:9px 12px;border-bottom:1px solid var(--border-soft)}
.np-cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.np-cal th{font-size:10px;font-weight:600;color:var(--dim);padding:3px 0;text-align:center}
.np-cal td{font-size:11.5px;text-align:center;padding:3px 0;border-radius:3px;color:var(--text)}
.np-cal td.out{color:var(--dim);opacity:.4}
.np-cal td.today{background:var(--accent);color:var(--accent-fg);font-weight:700}
.np-list{flex:1;overflow:auto;padding:6px;min-height:60px}
.np-empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:12.5px}
.note{
  display:flex;gap:9px;padding:9px 10px;border-radius:5px;background:var(--surface-2);
  margin-bottom:6px;border:1px solid var(--border-soft);position:relative;
}
.note .g{font-size:17px;flex:0 0 auto;line-height:1.2}
.note .body{flex:1;min-width:0}
.note .nt{font-weight:600;font-size:12.5px}
.note .nb{font-size:12px;color:var(--dim);white-space:pre-wrap;word-break:break-word}
.note .nw{font-size:10.5px;color:var(--dim);opacity:.75;margin-top:3px}
.note .x{
  position:absolute;top:5px;right:5px;width:19px;height:19px;border:0;background:transparent;
  border-radius:3px;cursor:pointer;color:var(--dim);font-size:12px;line-height:1;opacity:0;
}
.note:hover .x{opacity:1}
.note .x:hover{background:var(--surface-3);color:var(--text)}
.np-foot{
  display:flex;align-items:center;gap:8px;padding:8px 11px;
  border-top:1px solid var(--border-soft);background:var(--surface-2);font-size:12px;color:var(--dim);
}
.np-foot span{flex:1}

/* ---------- toasts ---------- */
#toasts{
  position:absolute;right:10px;z-index:5400;display:flex;flex-direction:column;gap:8px;
  width:300px;pointer-events:none;bottom:calc(var(--panel-h) + 10px);
}
body.panel-top #toasts{top:calc(var(--panel-h) + 10px);bottom:auto}
.toast{
  display:flex;gap:9px;padding:10px 11px;background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:5px;box-shadow:var(--shadow);cursor:pointer;
  pointer-events:auto;animation:toastIn .22s cubic-bezier(.2,1.2,.4,1);
}
.toast.out{animation:toastOut .2s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(24px)}}
.toast .g{font-size:17px;flex:0 0 auto}
.toast .nt{font-weight:600;font-size:12.5px}
.toast .nb{font-size:12px;color:var(--dim);word-break:break-word}

/* ---------- theme cross-fade ----------
   Applied only while the theme is switching, so every surface eases from one
   palette to the other in place. Longhand on purpose: inline transitions (the
   minimise flight) and more specific rules still win, so nothing else breaks. */
.theming,.theming *,.theming *::before,.theming *::after{
  transition-property:background-color,color,border-color,box-shadow,fill;
  transition-duration:.28s;
  transition-timing-function:ease;
}

/* a "broken" tag for a settings row */
.badge{
  display:inline-block;margin-left:7px;padding:1px 6px;border-radius:9px;
  background:#c9534b;color:#fff;font-size:9.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;vertical-align:1px;
}

/* a file too big to fit in storage */
.fm-tab tr.nosave .col-name::after{
  content:"not saved";margin-left:9px;padding:0 5px;font-size:9.5px;
  letter-spacing:.04em;text-transform:uppercase;color:#c2822c;
  border:1px solid currentColor;border-radius:8px;vertical-align:1px;
}
.fm-tab tr.sel.nosave .col-name::after{color:#fff;border-color:#fff}
.store-bar{
  flex:1;min-width:90px;height:7px;border-radius:4px;background:var(--surface-3);
  overflow:hidden;border:1px solid var(--border-soft);
}
.store-bar i{display:block;height:100%;background:var(--accent)}
.store-bar.full i{background:#c9534b}
.store-note{font-size:11.5px;color:var(--dim);margin-top:2px}

/* ---------- windows ---------- */
.win{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;
  min-width:340px;min-height:190px;background:var(--surface);
  border:1px solid var(--border);border-radius:7px 7px 5px 5px;box-shadow:var(--shadow-off);
}
.win.active{box-shadow:var(--shadow)}
.win.max{border-radius:0;border-width:0 0 1px 0}
body.anim .win.opening{animation:winIn .19s cubic-bezier(.2,1.1,.4,1)}
body.anim .win.closing{animation:winOut .15s ease-in forwards}
@keyframes winIn{from{opacity:0;transform:scale(.93) translateY(10px)}to{opacity:1;transform:none}}
@keyframes winOut{to{opacity:0;transform:scale(.94)}}
.win-title{
  flex:0 0 auto;height:33px;display:flex;align-items:center;gap:8px;padding:0 3px 0 11px;
  background:var(--title-off);color:var(--dim);border-bottom:1px solid var(--border-soft);
  user-select:none;cursor:default;
}
.win.active .win-title{background:var(--title);color:var(--text)}
.win-title .g{font-size:14px;flex:0 0 auto}
.win-title .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:13px}
.wb{width:28px;height:26px;border:0;background:transparent;border-radius:4px;cursor:pointer;font-size:13px;line-height:1;color:inherit;opacity:.8}
.wb:hover{background:rgba(128,128,128,.22);opacity:1}
.wb.close:hover{background:#d4574f;color:#fff}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;background:var(--surface)}
/* resize from every edge and corner; handles overhang the frame a little
   so the corners stay easy to grab on rounded macOS windows */
.rz{position:absolute;z-index:4}
.rz.n{top:-4px;left:12px;right:12px;height:9px;cursor:ns-resize}
.rz.s{bottom:-4px;left:12px;right:12px;height:9px;cursor:ns-resize}
.rz.w{left:-4px;top:12px;bottom:12px;width:9px;cursor:ew-resize}
.rz.e{right:-4px;top:12px;bottom:12px;width:9px;cursor:ew-resize}
.rz.nw{left:-5px;top:-5px;width:17px;height:17px;cursor:nwse-resize}
.rz.ne{right:-5px;top:-5px;width:17px;height:17px;cursor:nesw-resize}
.rz.sw{left:-5px;bottom:-5px;width:17px;height:17px;cursor:nesw-resize}
.rz.se{right:-5px;bottom:-5px;width:17px;height:17px;cursor:nwse-resize}
.win.max .rz{display:none}

/* ---------- files ---------- */
.app-files .win-body{overflow:hidden}
.fm-tb{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:6px 7px;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.tb-btn{
  height:26px;min-width:26px;padding:0 9px;background:transparent;border:1px solid transparent;
  border-radius:4px;cursor:pointer;white-space:nowrap;
}
.tb-btn:hover:not(:disabled){background:var(--surface-3);border-color:var(--border-soft)}
.tb-btn:disabled{opacity:.35;cursor:default}
.tb-btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tb-btn.accent:hover{filter:brightness(1.07);background:var(--accent);border-color:var(--accent)}
.crumbs{
  flex:1 1 110px;min-width:110px;display:flex;align-items:center;gap:1px;overflow:hidden;
  background:var(--surface);border:1px solid var(--border);border-radius:4px;height:26px;padding:0 3px;
}
.crumb{
  background:transparent;border:0;border-radius:3px;height:20px;padding:0 7px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;
}
.crumb:hover{background:var(--surface-3)}
.crumb.last{font-weight:600}
.crumb-sep{color:var(--dim);opacity:.6;flex:0 0 auto}
.fm-main{flex:1;min-height:0;display:flex}
.fm-side{flex:0 0 152px;overflow:auto;padding:7px 6px;background:var(--surface-2);border-right:1px solid var(--border-soft)}
.side-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:6px 8px 4px}
.place{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;background:transparent;border:0;
  border-radius:4px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.place:hover{background:var(--surface-3)}
.place.on{background:var(--sel);color:var(--sel-fg)}
.fm-list{flex:1;min-width:0;overflow:auto;background:var(--surface)}
.fm-tab{width:100%;border-collapse:collapse;table-layout:fixed}
.fm-tab th{
  position:sticky;top:0;z-index:1;text-align:left;font-size:11.5px;font-weight:600;color:var(--dim);
  padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.fm-tab td{padding:5px 10px;border-bottom:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-tab tr:hover td{background:rgba(128,128,128,.1)}
.fm-tab tr.sel td{background:var(--sel);color:var(--sel-fg)}
.col-size{width:88px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.col-type{width:112px;color:var(--dim)}
.fm-tab tr.sel .col-size,.fm-tab tr.sel .col-type{color:rgba(255,255,255,.85)}
.fi{display:inline-block;width:20px;margin-right:5px;text-align:center}
.fm-empty{padding:26px;text-align:center;color:var(--dim)}
.fm-main.editing .fm-list{flex:0 0 232px;border-right:1px solid var(--border-soft)}
.fm-main.editing .col-size,.fm-main.editing .col-type,
.fm-main.editing .fm-tab th:nth-child(2),.fm-main.editing .fm-tab th:nth-child(3){display:none}
.fm-edit{flex:1;min-width:0;display:none;flex-direction:column;background:var(--surface)}
.fm-main.editing .fm-edit{display:flex}
.ed-head{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 6px;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.ed-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-dot{color:var(--accent);font-size:17px;line-height:1;visibility:hidden}
.fm-edit.dirty .ed-dot{visibility:visible}
.ed-sp{flex:1}
.ed-area{
  flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;padding:11px 13px;
  background:var(--surface);color:var(--text);
  font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;tab-size:4;
}
.ed-foot{
  flex:0 0 auto;padding:4px 10px;font-size:11.5px;color:var(--dim);
  background:var(--surface-2);border-top:1px solid var(--border-soft);display:flex;gap:14px;
}
.fm-status{
  flex:0 0 auto;padding:5px 11px;font-size:11.5px;color:var(--dim);
  background:var(--surface-2);border-top:1px solid var(--border-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- terminal ---------- */
.app-term .win-body{background:#1c1d1a;padding:0}
.term-wrap{
  flex:1;min-height:0;overflow:auto;padding:10px 12px;cursor:text;
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;color:#d6d6ce;
}
.term-out{white-space:pre-wrap;word-break:break-word}
.term-row{display:flex;flex-wrap:wrap;align-items:baseline}
.term-in-row{display:flex;align-items:baseline}
.term-in{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#e8e8e0;font:inherit;padding:0;caret-color:#8bae5a}
.ps1-u{color:#8bae5a;font-weight:600}
.ps1-p{color:#6c9fd0;font-weight:600}
.ps1-s{color:#d6d6ce}
.t-dir{color:#6c9fd0;font-weight:600}
.t-img{color:#c98ed6}
.t-err{color:#e2726a}
.t-ok{color:#8bae5a}
.t-dim{color:#8d8d84}
.t-key{color:#d8bd6a}

/* a drop target lighting up while a file is held over it */
.drop-on{outline:2px solid var(--accent) !important;outline-offset:-2px}
.dock-app.drop-on,.task.drop-on{background:var(--accent);color:var(--accent-fg)}
.win.drop-on{box-shadow:0 0 0 2px var(--accent),var(--shadow)}

/* ---------- Videos: a library of its own, not the Media list ---------- */
.app-vid .win-body{overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.vd-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 9px;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.vd-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.vd-find{
  width:150px;height:26px;padding:0 10px;background:var(--surface);
  border:1px solid var(--border);border-radius:13px;outline:none;font-size:12.5px;
}
.vd-find:focus{border-color:var(--accent)}
.app-vid .vd-back{display:none}
.app-vid .win-body.playing .vd-back{display:block}
.vd-grid{
  flex:1;min-height:0;overflow:auto;padding:14px;
  display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));align-content:start;
}
.app-vid .win-body.playing .vd-grid{display:none}
.vd-tile{
  border:1px solid var(--border-soft);border-radius:7px;overflow:hidden;background:var(--surface-2);
  cursor:default;text-align:left;padding:0;color:var(--text);
}
.vd-tile:hover{border-color:var(--accent)}
.vd-tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.vd-shot{position:relative;aspect-ratio:16/9;background:#151515;display:flex;align-items:center;justify-content:center}
.vd-shot canvas{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s ease}
.vd-shot canvas.got{opacity:1}
.vd-shot .ph{position:absolute;font-size:26px;opacity:.4}
.vd-shot canvas.got ~ .ph{display:none}
.vd-dur{
  position:absolute;right:5px;bottom:5px;padding:1px 5px;border-radius:3px;
  background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-variant-numeric:tabular-nums;
}
.vd-cap{padding:7px 9px 9px}
.vd-n{font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vd-w{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vd-none{grid-column:1/-1;padding:36px 10px;text-align:center;color:var(--dim);line-height:1.6}
.vd-tile.unplayable .vd-shot{background:#241d1d}
.vd-tile.unplayable .vd-n{color:var(--dim)}
.vd-oops{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  padding:0 28px;text-align:center;color:#ddd;font-size:13px;line-height:1.6;display:none;
}
.vd-oops b{display:block;font-size:15px;margin-bottom:6px}
.vd-oops small{color:#9a9a9a}
.app-vid .win-body.badmedia .vd-oops{display:block}
.app-vid .win-body.badmedia .vd-player video{opacity:.08}
.vd-player{position:relative}
.vd-player{flex:1;min-height:0;display:none;flex-direction:column;background:#0d0d0d}
.app-vid .win-body.playing .vd-player{display:flex}
.vd-player video{flex:1;min-height:0;width:100%;background:#0d0d0d;object-fit:contain}
.vd-ctl{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 10px;
  background:#1b1b1b;border-top:1px solid #2c2c2c;color:#ddd;
}
.vd-ctl .tb-btn{background:#2a2a2a;border-color:#3a3a3a;color:#e4e4e4}
.vd-ctl .tb-btn:hover:not(:disabled){background:#343434;border-color:#484848}
.vd-ctl .tb-btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.vd-seek{flex:1;min-width:60px}
.vd-time{font-size:11.5px;color:#aaa;font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
.vd-vol{width:74px;flex:0 0 auto}

/* ---------- Help ---------- */
.app-help .win-body{display:flex;flex-direction:row;overflow:hidden;background:var(--surface)}
.hp-side{
  flex:0 0 186px;min-width:0;overflow:auto;padding:8px 7px;
  background:var(--surface-2);border-right:1px solid var(--border-soft);
}
.hp-list{display:flex;flex-direction:column;gap:1px}
.hp-none{padding:10px 9px;font-size:12.5px;color:var(--dim)}
.hp-main{flex:1;min-width:0;display:flex;flex-direction:column}
.hp-find{
  flex:0 0 auto;margin:9px 14px;height:28px;padding:0 12px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:14px;outline:none;
}
.hp-find:focus{border-color:var(--accent)}
.hp-body{flex:1;min-height:0;overflow:auto;padding:4px 26px 30px;max-width:660px;line-height:1.62}
.hp-body h1{font-size:21px;margin:10px 0 4px}
.hp-body h2{font-size:14px;margin:22px 0 6px;color:var(--accent);letter-spacing:.02em}
.hp-body p{margin:9px 0;color:var(--text)}
.hp-body ul{margin:8px 0;padding-left:20px}
.hp-body li{margin:5px 0}
.hp-code{
  margin:9px 0;padding:10px 13px;background:#1f1f1f;color:#d6d6ce;border-radius:5px;
  font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;
}

/* ---------- SEA Store, and the apps it runs ---------- */
.app-store .win-body{overflow:hidden;display:flex;flex-direction:column}
.st-bar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--border-soft)}
.st-title{font-weight:600}
.st-body{flex:1;min-height:0;overflow:auto;padding:6px 16px 22px}
.st-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
.st-card{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--border-soft);border-radius:8px;background:var(--surface-2)}
.st-ic{flex:0 0 44px;height:44px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:26px}
.st-txt{flex:1;min-width:0}
.st-n{font-weight:600}
.st-d{font-size:12.5px;color:var(--text);opacity:.85;margin-top:1px}
.st-src{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-acts{display:flex;gap:6px;flex:0 0 auto}
.st-none{padding:8px 2px 4px;color:var(--dim);font-size:12.5px}
.st-how{margin-top:18px;border-top:1px solid var(--border-soft)}
.st-how p{font-size:12.5px;line-height:1.55;margin:8px 0}
.app-ext .win-body{overflow:hidden;background:var(--surface)}
.ext-wrap{flex:1;min-height:0;display:flex}
.ext-frame{flex:1;border:0;width:100%;height:100%;background:#fff}
.ext-msg{margin:auto;padding:24px;max-width:380px;text-align:center;color:var(--dim);line-height:1.6}

/* ---------- Photos ---------- */
.app-photos .win-body{overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.ph-count{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.app-photos .ph-back{display:none}
.app-photos .win-body.viewing .ph-back{display:block}
.app-photos .win-body.viewing .vd-find,.app-photos .win-body.viewing [data-p="show"],
.app-photos .win-body.viewing .ph-count{display:none}
.ph-grid{flex:1;min-height:0;overflow:auto;padding:12px;display:grid;gap:8px;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr));align-content:start}
.app-photos .win-body.viewing .ph-grid{display:none}
.ph-tile{position:relative;aspect-ratio:1;padding:0;border:1px solid var(--border-soft);border-radius:6px;
  overflow:hidden;background:var(--surface-2);cursor:default}
.ph-tile:hover{border-color:var(--accent)}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.ph-tile:hover img{transform:scale(1.04)}
.ph-tile.broken img{visibility:hidden}
.ph-tile.broken::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:24px}
.ph-cap{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;font-size:11px;color:#fff;text-align:left;
  background:rgba(0,0,0,.62);opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-tile:hover .ph-cap{opacity:1}
.ph-view{flex:1;min-height:0;display:none;flex-direction:column}
.app-photos .win-body.viewing .ph-view{display:flex}
.ph-stage{position:relative;flex:1;min-height:0;overflow:auto;background:#111;display:flex}
.ph-stage img{margin:auto;opacity:0;transition:opacity .35s ease}
.ph-stage img.in{opacity:1}
.ph-stage.fit img{max-width:100%;max-height:100%;object-fit:contain}
.ph-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border:0;border-radius:6px;
  background:rgba(0,0,0,.4);color:#fff;font-size:30px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s}
.ph-stage:hover .ph-nav{opacity:1}
.ph-nav.prev{left:10px}
.ph-nav.next{right:10px}
.app-photos .win-body.showing .ph-nav{opacity:0}

/* ---------- Playground ---------- */
.app-play .win-body{overflow:hidden;display:flex;flex-direction:column}
.app-play .win-body .ed-dot{visibility:hidden}
.app-play .win-body.dirty .ed-dot{visibility:visible}
.pg-tb .seg button{padding:3px 9px;font-size:12px}
.pg-live{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim);margin:0 4px}
.pg-main{flex:1;min-height:0;display:flex}
.pg-main.stack{flex-direction:column}
.pg-edit{flex:1;min-width:0;min-height:0;display:flex;background:#1d1e1b}
.pg-main.view .pg-edit,.pg-main.code .pg-out{display:none}
.pg-gutter{margin:0;padding:10px 8px 10px 10px;min-width:44px;text-align:right;color:#62655c;background:#1a1b18;
  border-right:1px solid #2c2e29;overflow:hidden;user-select:none;
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.pg-code{position:relative;flex:1;min-width:0}
.pg-hl,.pg-area{position:absolute;inset:0;margin:0;padding:10px 12px;border:0;white-space:pre;tab-size:2;letter-spacing:0;
  font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.pg-hl{color:#d6d6ce;pointer-events:none;overflow:hidden}
.pg-area{overflow:auto;background:transparent;color:transparent;caret-color:#e8e8e0;resize:none;outline:none}
.pg-area::selection{background:rgba(139,174,90,.35);color:transparent}
.pg-hl .t{color:#e6a25a}
.pg-hl .a{color:#9fc3e7}
.pg-hl .s{color:#a9c97c}
.pg-hl .c{color:#737a6c;font-style:italic}
.pg-hl .k{color:#d58fc7}
.pg-hl .n{color:#e3c46e}
.pg-out{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--border-soft)}
.pg-main.stack .pg-out{border-left:0;border-top:1px solid var(--border-soft)}
.pg-frame{flex:1;min-height:0;width:100%;border:0;background:#fff}
.pg-con{flex:0 0 118px;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--border-soft)}
.pg-con-h{display:flex;align-items:center;gap:8px;padding:3px 8px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--border-soft)}
.pg-con-h .tb-btn{padding:1px 8px;font-size:11px}
.pg-con-n{color:#c9534b}
.pg-con-list{flex:1;overflow:auto;padding:4px 8px;font:12px/1.5 ui-monospace,Consolas,monospace}
.pg-log{white-space:pre-wrap;word-break:break-word;border-bottom:1px solid var(--border-soft);padding:1px 0}
.pg-log.warn{color:#d8a53c}
.pg-log.error{color:#d9665d}

/* ---------- desktop widgets ---------- */
#widgets{position:absolute;left:0;right:0;top:0;bottom:var(--panel-h);z-index:1;pointer-events:none}
body.panel-top #widgets{top:var(--panel-h);bottom:0}
body.shell-macos #widgets{top:var(--menubar-h);bottom:var(--panel-h)}
body.shell-hypr #widgets{display:none}
.wdg{position:absolute;pointer-events:auto;min-width:150px;padding:12px 14px;border-radius:14px;color:#fff;
  background:rgba(18,18,18,.46);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 22px rgba(0,0,0,.25);
  user-select:none;cursor:grab;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.wdg.drag{cursor:grabbing;opacity:.9}
.wdg-clock .t{font-size:44px;font-weight:300;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.wdg-clock .s{font-size:16px;opacity:.6;margin-left:5px}
.wdg-clock .d{font-size:13px;opacity:.82;margin-top:6px}
.wdg-weather{min-width:210px}
.wdg-w-top{display:flex;align-items:center;gap:10px}
.wdg-w-ic{font-size:36px;line-height:1}
.wdg-w-temp{font-size:34px;font-weight:300;line-height:1}
.wdg-w-sub{font-size:12px;opacity:.82;margin-top:2px}
.wdg-w-days{display:flex;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14)}
.wdg-w-day{flex:1;text-align:center;font-size:11.5px;white-space:nowrap}
.wdg-w-day b{display:block;font-size:18px;font-weight:400;margin:2px 0}
.wdg-music{min-width:230px;max-width:280px}
.wdg-m-t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wdg-m-s{font-size:11.5px;opacity:.72}
.wdg-m-ctl{display:flex;gap:6px;margin-top:8px}
.wdg button{font:inherit;font-size:12px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  border-radius:6px;padding:3px 10px;cursor:pointer}
.wdg button:hover{background:rgba(255,255,255,.24)}

/* ---------- Games ---------- */
.app-games .win-body{overflow:hidden;display:flex;flex-direction:column}
.gm-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 22px}
.gm-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.gm-tile{padding:0;text-align:left;border:1px solid var(--border-soft);border-radius:10px;overflow:hidden;
  background:var(--surface-2);color:var(--text);cursor:default;transition:transform .12s ease,border-color .12s ease}
.gm-tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.gm-art{height:96px;display:flex;align-items:center;justify-content:center;font-size:48px;line-height:1}
.gm-cap{padding:8px 10px 10px}
.gm-n{font-weight:600}
.gm-d{font-size:12px;opacity:.8;margin-top:1px;line-height:1.35;height:2.7em;overflow:hidden}
.gm-best{font-size:11.5px;color:var(--accent);margin-top:5px;font-variant-numeric:tabular-nums}

/* ---------- menu bar: the fold button and the show-desktop icon ---------- */
#menubar .mb-fold{
  display:flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;
  border:0;background:none;color:inherit;opacity:.6;border-radius:6px;cursor:pointer;
}
#menubar .mb-fold:hover{opacity:1;background:rgba(128,128,128,.2)}
#menubar .mb-fold svg{transition:transform .18s ease;transform:rotate(180deg)}
#menubar .mb-fold.folded svg{transform:none}
#traydesk svg{display:block;margin:auto}
#traydesk.restore{color:var(--accent)}

/* ---------- macOS: Liquid Glass ----------
   See-through surfaces that blur whatever is behind them, a thin bright rim
   where the light catches an edge, and rounder corners. No gradients - the
   shine is an inset highlight, not a painted sheen. */
body.shell-macos.sub-glass{
  --glass:rgba(255,255,255,.3);
  --glass-strong:rgba(255,255,255,.6);
  --glass-rim:rgba(255,255,255,.6);
  --glass-edge:rgba(0,0,0,.08);
  --glass-blur:blur(26px) saturate(185%);
}
[data-theme="dark"] body.shell-macos.sub-glass{
  --glass:rgba(38,38,42,.32);
  --glass-strong:rgba(32,32,36,.64);
  --glass-rim:rgba(255,255,255,.17);
  --glass-edge:rgba(0,0,0,.35);
}

/* the menu bar goes clear, and its words keep a soft shadow so they read on any wallpaper */
body.shell-macos.sub-glass #menubar,
[data-theme="dark"] body.shell-macos.sub-glass #menubar{
  background:transparent;border-bottom-color:transparent;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
}
body.shell-macos.sub-glass #menubar svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
body.shell-macos.sub-glass #menubar .mb-logo:hover,
body.shell-macos.sub-glass #menubar .mb-item:hover,
body.shell-macos.sub-glass #menubar .mb-fold:hover,
body.shell-macos.sub-glass #menubar .tray-btn:hover,
body.shell-macos.sub-glass #menubar #clockbtn:hover,
body.shell-macos.sub-glass #menubar #clockbtn.on{background:rgba(255,255,255,.22)}

/* the dock */
body.shell-macos.sub-glass #panel,
[data-theme="dark"] body.shell-macos.sub-glass #panel{
  background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-rim);border-radius:26px;padding:8px;
  box-shadow:inset 0 1px 0 var(--glass-rim),inset 0 0 0 1px var(--glass-edge),0 12px 40px rgba(0,0,0,.25);
}
body.shell-macos.sub-glass .dock-app{border-radius:14px}

/* windows */
body.shell-macos.sub-glass .win,
[data-theme="dark"] body.shell-macos.sub-glass .win{
  border-radius:18px;border:1px solid var(--glass-rim);
  background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 var(--glass-rim),0 22px 60px rgba(0,0,0,.32),0 3px 12px rgba(0,0,0,.16);
}
body.shell-macos.sub-glass .win.max{border-radius:0}
body.shell-macos.sub-glass .win-title,
body.shell-macos.sub-glass .win.active .win-title{background:transparent;border-bottom-color:var(--glass-edge)}
body.shell-macos.sub-glass .win-body{background:color-mix(in srgb, var(--surface) 74%, transparent)}
body.shell-macos.sub-glass .wb{width:13px;height:13px;margin-top:-6.5px}

/* menus, notifications, right-click menus and dialogs */
body.shell-macos.sub-glass #menu,
body.shell-macos.sub-glass #npanel,
body.shell-macos.sub-glass #ctx,
body.shell-macos.sub-glass .modal{
  background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-rim);box-shadow:inset 0 1px 0 var(--glass-rim),0 18px 48px rgba(0,0,0,.3);
}
body.shell-macos.sub-glass #menu,
body.shell-macos.sub-glass #npanel,
body.shell-macos.sub-glass .modal{border-radius:18px}
body.shell-macos.sub-glass #ctx{border-radius:13px}

/* controls turn into capsules */
body.shell-macos.sub-glass .btn,
body.shell-macos.sub-glass .tb-btn,
body.shell-macos.sub-glass .seg{border-radius:999px}

/* ---------- Playground: tabs, Python ---------- */
.pg-tabs{
  flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 8px;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.pg-tabs button{
  position:relative;border:0;background:none;color:var(--dim);padding:7px 13px 6px;
  font:600 12px/1 inherit;letter-spacing:.04em;border-bottom:2px solid transparent;cursor:pointer;
}
.pg-tabs button:hover{color:var(--text)}
.pg-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
/* a small dot on a tab that has something in it */
.pg-tabs button.has::after{
  content:"";position:absolute;top:6px;right:5px;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.8;
}
.pg-kind{margin-left:auto;font-size:11.5px;color:var(--dim)}
.app-play .win-body.py .pg-tabs button{display:none}
.app-play .win-body.py .pg-tabs .pg-kind{margin-left:4px;padding:7px 0 6px;color:var(--text);font-weight:600}
.app-play .win-body.py .pg-frame,
.app-play .win-body.py .pg-live{display:none}
.app-play .win-body.py .pg-con{flex:1}
.pg-stop{display:none}
.app-play .win-body.py .pg-stop{display:inline-flex}
.pg-stdin{display:none;align-items:flex-start;gap:8px;padding:5px 8px;border-bottom:1px solid var(--border-soft)}
.app-play .win-body.py .pg-stdin{display:flex}
.pg-stdin span{font-size:11.5px;color:var(--dim);padding-top:4px}
.pg-stdin textarea{
  flex:1;height:44px;min-height:26px;resize:vertical;padding:4px 7px;border-radius:4px;outline:none;
  font:12px/1.45 ui-monospace,Consolas,monospace;background:var(--surface-2);color:var(--text);border:1px solid var(--border-soft);
}
.pg-stdin textarea:focus{border-color:var(--accent)}
.pg-log.info{color:var(--dim);font-style:italic}

/* ---------- Media: links and YouTube ---------- */
.mu-link{margin-left:auto;flex:0 0 auto;white-space:nowrap}
.mu-open{display:none;flex:0 0 auto;white-space:nowrap}
.mu-open.on{display:inline-flex;margin-left:auto}
.mu-open.on + .mu-link{margin-left:0}
.mu-art.thumb{background-size:cover;background-position:center}
.mu-yt{display:none;width:100%;aspect-ratio:16/9;max-height:46%;background:#000;flex:0 0 auto}
.mu-yt iframe{display:block;width:100%;height:100%;border:0}
.app-music .win-body.showing-yt .mu-yt{display:block}
.mu-sec{padding:12px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

/* ---------- browser ---------- */
.app-web .win-body{overflow:hidden;background:var(--surface)}
.wb-tabs{
  flex:0 0 auto;display:flex;align-items:stretch;gap:2px;padding:5px 6px 0;
  background:var(--surface-3);overflow-x:auto;scrollbar-width:none;
}
.wb-tabs::-webkit-scrollbar{display:none}
.wb-tab{
  display:flex;align-items:center;gap:6px;max-width:190px;min-width:78px;
  padding:0 6px 0 10px;height:28px;border-radius:7px 7px 0 0;cursor:default;
  background:transparent;color:var(--dim);border:1px solid transparent;border-bottom:0;
  font-size:12.5px;white-space:nowrap;flex:0 1 auto;
}
.wb-tab:hover{background:var(--surface-2)}
.wb-tab.on{background:var(--surface-2);color:var(--fg);border-color:var(--border-soft)}
.wb-tab .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.wb-tab .x{
  flex:0 0 auto;width:16px;height:16px;line-height:14px;text-align:center;border-radius:50%;
  opacity:0;font-size:13px;color:var(--dim);
}
.wb-tab:hover .x,.wb-tab.on .x{opacity:.75}
.wb-tab .x:hover{background:var(--surface-3);color:var(--fg);opacity:1}
.wb-newtab{
  flex:0 0 auto;align-self:center;width:24px;height:24px;margin-left:3px;border:0;border-radius:6px;
  background:transparent;color:var(--dim);font-size:16px;line-height:1;cursor:pointer;
}
.wb-newtab:hover{background:var(--surface-2);color:var(--fg)}
.wb-tb{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:6px 7px;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.wb-addr{
  flex:1;min-width:80px;height:28px;padding:0 11px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;outline:none;
}
.wb-addr:focus{border-color:var(--accent)}
.wb-eng{
  height:28px;background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:0 4px;cursor:pointer;max-width:130px;
}
.wb-stages{flex:1;min-height:0;position:relative;display:flex}
.wb-stage{flex:1;min-height:0;position:relative;background:#fff}
.wb-stage.off{display:none}
[data-theme="dark"] .wb-stage{background:#1e1e1e}
.wb-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.wb-blocked{
  position:absolute;left:0;right:0;bottom:0;padding:11px 14px;background:var(--surface-2);
  border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--dim);
}
.wb-blocked b{color:var(--text);display:block;font-size:13px}
.wb-blocked .sp{flex:1}
.wb-home{position:absolute;inset:0;overflow:auto;padding:44px 30px;background:var(--surface);color:var(--text)}
.wb-home .hero{text-align:center;max-width:560px;margin:0 auto 34px}
.wb-home .hero .logo{color:var(--accent)}
.wb-home .hero h1{font-size:23px;font-weight:600;margin:12px 0 4px;letter-spacing:.02em}
.wb-home .hero p{color:var(--dim);margin:0 0 20px;font-size:13px}
.wb-search{display:flex;gap:8px;max-width:520px;margin:0 auto}
.wb-search input{
  flex:1;height:38px;padding:0 15px;border:1px solid var(--border);border-radius:19px;
  background:var(--surface);outline:none;font-size:14px;
}
.wb-search input:focus{border-color:var(--accent)}
.wb-sect{max-width:560px;margin:0 auto 22px}
.wb-sect h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
.wb-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.wb-link{
  display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--surface-2);
  border:1px solid var(--border-soft);border-radius:5px;cursor:pointer;text-align:left;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.wb-link:hover{border-color:var(--accent);background:var(--surface-3)}
.wb-none{color:var(--dim);font-size:12.5px;padding:4px 2px}
.wb-card{
  padding:14px 16px;background:var(--surface-2);border:1px solid var(--border-soft);
  border-left:3px solid var(--accent);border-radius:5px;
}
.wb-card-h{font-weight:600;margin-bottom:5px}
.wb-card p{margin:0 0 6px;line-height:1.55}
.wb-result{
  display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:7px;
  background:transparent;border:1px solid transparent;border-radius:5px;cursor:pointer;
}
.wb-result:hover{background:var(--surface-2);border-color:var(--border-soft)}
.wb-result-t{color:#3366cc;font-size:15px;margin-bottom:2px}
[data-theme="dark"] .wb-result-t{color:#7ab0ff}
.wb-result:hover .wb-result-t{text-decoration:underline}
.wb-result-s{font-size:12.5px;color:var(--dim);line-height:1.5}
.wb-spin{
  width:26px;height:26px;margin:0 auto 14px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--accent);
  animation:wbspin .8s linear infinite;
}
@keyframes wbspin{to{transform:rotate(360deg)}}
.wb-sad{font-size:44px;color:var(--dim);margin-bottom:6px;font-family:ui-monospace,monospace}

/* ---------- image viewer ---------- */
.app-view .win-body{overflow:hidden;background:var(--surface-2)}
.vw-stage{
  flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px;
  background-color:#e0e0e0;
}
.vw-stage img{display:block;box-shadow:0 2px 14px rgba(0,0,0,.28);background:#fff}
.vw-stage.fit img,.vw-stage.fit video{max-width:100%;max-height:100%;object-fit:contain}
.vw-stage video{display:block;max-width:100%;background:#000}
.vw-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--surface-2);border-top:1px solid var(--border-soft);font-size:12px;color:var(--dim);
}

/* ---------- settings ---------- */
.app-set .win-body{overflow:auto;padding:0}
.set-sec{padding:15px 18px;border-bottom:1px solid var(--border-soft)}
.set-sec:last-child{border-bottom:0}
.set-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 11px}
.set-row{display:flex;align-items:center;gap:11px;margin-bottom:11px;flex-wrap:wrap}
.set-row:last-child{margin-bottom:0}
.set-lab{flex:0 0 104px;color:var(--dim)}
.seg{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden}
.seg button{padding:5px 14px;background:var(--surface);border:0;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--border) inset}
.sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.wall{
  height:56px;border-radius:5px;border:2px solid transparent;cursor:pointer;position:relative;
  overflow:hidden;box-shadow:0 0 0 1px var(--border);background-size:cover;background-position:center;
}
.wall.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wall .cap{
  position:absolute;left:0;right:0;bottom:0;padding:2px 6px;font-size:10.5px;color:#fff;
  background:rgba(0,0,0,.45);text-align:left;
}
.colorin{width:32px;height:26px;padding:0;border:1px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer}
.switch{
  position:relative;width:42px;height:23px;border-radius:12px;background:var(--surface-3);
  border:1px solid var(--border);cursor:pointer;flex:0 0 auto;transition:background .16s;
}
.switch i{
  position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .16s;
}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on i{left:21px}
.sw-lab{flex:1;min-width:0}
.sw-lab small{display:block;color:var(--dim);font-size:11.5px}
.shortlist{display:flex;flex-direction:column;gap:6px}
.shortrow{
  display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--surface-2);
  border:1px solid var(--border-soft);border-radius:5px;
}
.shortrow .g{font-size:17px;flex:0 0 auto;width:22px;text-align:center}
.shortrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shortrow .n small{display:block;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:24px;height:24px;border:1px solid var(--border);background:var(--surface);border-radius:4px;cursor:pointer;color:var(--dim);flex:0 0 auto}
.xbtn:hover{background:#c9534b;border-color:#c9534b;color:#fff}
.about{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:12.5px}
.about dt{color:var(--dim)}
.about dd{margin:0;font-variant-numeric:tabular-nums}


/* ---------- snap ghost ---------- */
#snapghost{
  position:absolute;z-index:3;pointer-events:none;border-radius:6px;
  background:rgba(255,255,255,.16);border:2px solid var(--accent);
  opacity:0;transition:opacity .12s ease,left .1s ease,top .1s ease,width .1s ease,height .1s ease;
}
#snapghost.on{opacity:1}

/* ---------- paint ---------- */
.app-paint .win-body{overflow:hidden}
.pt-tb{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 8px;flex-wrap:wrap;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.pt-swatches{display:flex;gap:4px}
.pt-sw{width:20px;height:20px;border-radius:4px;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--border) inset}
.pt-sw.on{border-color:var(--text)}
.pt-sep{width:1px;height:20px;background:var(--border)}
.pt-sizes button{padding:3px 10px}
.tb-btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pt-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--surface-3)}
.pt-stage canvas{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25);cursor:crosshair;touch-action:none;max-width:100%;max-height:100%}
.pt-status{flex:0 0 auto;padding:5px 11px;font-size:11.5px;color:var(--dim);background:var(--surface-2);border-top:1px solid var(--border-soft)}

/* ---------- minesweeper ---------- */
.app-mines .win-body{overflow:hidden}
.ms-tb{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:7px 9px;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.ms-levels button{padding:4px 11px}
.ms-stat{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);min-width:52px;text-align:center}
.ms-stat span{font-weight:700;color:var(--text);font-size:15px}
.ms-stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:14px;background:var(--surface-3)}
.ms-grid{display:grid;gap:2px}
.ms-cell{
  width:22px;height:22px;padding:0;border:0;border-radius:3px;cursor:pointer;
  background:var(--surface);box-shadow:0 1px 0 rgba(0,0,0,.16);
  font:700 12px/1 "Segoe UI",system-ui,sans-serif;
}
.ms-cell:hover:not(.open){background:var(--surface-2)}
.ms-cell.open{background:var(--surface-3);box-shadow:none;cursor:default}
.ms-cell.flag{background:var(--surface);font-size:11px}
.ms-cell.mine{background:#e0b4b0}
.ms-cell.boom{background:#c9534b}
.ms-cell[data-n="1"]{color:#4a90d9}
.ms-cell[data-n="2"]{color:#5f8039}
.ms-cell[data-n="3"]{color:#c9534b}
.ms-cell[data-n="4"]{color:#5a4a9c}
.ms-cell[data-n="5"]{color:#8c4a2f}
.ms-cell[data-n="6"]{color:#3aa99f}
.ms-cell[data-n="7"]{color:#7a3f6d}
.ms-cell[data-n="8"]{color:#777}

/* ---------- calculator ---------- */
.app-calc .win-body{overflow:hidden;background:var(--surface-2)}
.ca-out{
  flex:0 0 auto;padding:16px 18px 12px;text-align:right;background:var(--surface);
  border-bottom:1px solid var(--border-soft);
}
.ca-sub{font-size:12px;color:var(--dim);min-height:16px;font-variant-numeric:tabular-nums}
.ca-main{font-size:33px;font-weight:300;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.2}
.ca-pad{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:10px}
.ca-row{flex:1;display:flex;gap:6px}
.ca-key{
  flex:1;border:1px solid var(--border);background:var(--surface);border-radius:6px;
  cursor:pointer;font-size:17px;
}
.ca-key:hover{background:var(--surface-3)}
.ca-key:active{transform:translateY(1px)}
.ca-key.op{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.ca-key.op:hover{filter:brightness(1.08)}
.ca-key.wide{flex:2.08}


/* ---------- files: selection, clipboard, drop target ---------- */
.fm-tab tr.cut td{opacity:.45;font-style:italic}
.fm-tab tr.dropping td{background:var(--accent);color:var(--accent-fg);opacity:.85}
.place.dropping,.crumb.dropping{background:var(--accent);color:var(--accent-fg)}
.place-n{
  margin-left:auto;font-size:10.5px;background:var(--surface-3);color:var(--dim);
  border-radius:9px;padding:0 6px;min-width:18px;text-align:center;
}
.place.on .place-n{background:rgba(255,255,255,.3);color:#fff}
.fm-list{position:relative}
.fm-drop{
  position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:7px;
  display:none;align-items:center;justify-content:center;pointer-events:none;
  background:var(--surface);opacity:.94;font-weight:600;color:var(--accent);z-index:5;
}
.fm-drop.on{display:flex}

/* ---------- markdown preview ---------- */
.ed-view{
  flex:1;min-height:0;overflow:auto;padding:18px 22px;display:none;
  background:var(--surface);line-height:1.65;
}
.fm-edit.previewing .ed-area{display:none}
.fm-edit.previewing .ed-view{display:block}
.ed-view h1,.ed-view h2,.ed-view h3{line-height:1.25;margin:20px 0 8px}
.ed-view h1{font-size:23px;border-bottom:1px solid var(--border-soft);padding-bottom:6px;margin-top:0}
.ed-view h2{font-size:19px;border-bottom:1px solid var(--border-soft);padding-bottom:4px}
.ed-view h3{font-size:16px}
.ed-view p{margin:0 0 11px}
.ed-view ul,.ed-view ol{margin:0 0 11px;padding-left:24px}
.ed-view li{margin:3px 0}
.ed-view li.md-task{list-style:none;margin-left:-20px}
.ed-view code{background:var(--surface-2);padding:1px 5px;border-radius:3px;font:12.5px ui-monospace,Consolas,monospace}
.ed-view pre{background:var(--surface-2);padding:11px 13px;border-radius:5px;overflow-x:auto;border:1px solid var(--border-soft)}
.ed-view pre code{background:none;padding:0}
.ed-view blockquote{margin:0 0 11px;padding-left:13px;border-left:3px solid var(--border);color:var(--dim)}
.ed-view hr{border:0;border-top:1px solid var(--border-soft);margin:16px 0}
.ed-view a{color:var(--accent)}
.ed-view img{max-width:100%}

/* ---------- trash ---------- */
.app-trash .win-body{overflow:hidden}
.tr-count{font-weight:600;padding-left:4px}

/* ---------- music ---------- */
.app-music .win-body{overflow:hidden}
.mu-now{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:var(--surface-2);border-bottom:1px solid var(--border-soft);
}
.mu-art{
  width:52px;height:52px;border-radius:7px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;font-size:25px;flex:0 0 auto;
}
.mu-meta{min-width:0}
.mu-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-sub{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-controls{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--border-soft);
}
.mu-seek{flex:1;min-width:60px}
.mu-vol{width:74px;flex:0 0 auto}
.mu-time{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
/* the video pane only appears while a video is the current track */
.mu-video{display:none;width:100%;background:#000;max-height:46%;flex:0 0 auto}
.app-music .win-body.showing-video .mu-video{display:block}
.app-music .win-body.showing-video .mu-art{display:none}
.mu-list{flex:1;min-height:0;overflow:auto;padding:6px}
.mu-row{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  background:transparent;border:0;border-radius:5px;cursor:pointer;text-align:left;
}
.mu-row:hover{background:var(--surface-2)}
.mu-row.on{background:var(--sel);color:var(--sel-fg)}
.mu-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-d{font-size:11.5px;color:var(--dim);flex:0 0 auto}
.mu-row.on .mu-d{color:rgba(255,255,255,.8)}

/* ============================================================
   macOS-style desktop environment
   Everything below only applies while body has .shell-macos, so the
   Mint shell is untouched. Structural bits live in applyShell().
   ============================================================ */
body.shell-macos{
  --panel-h:64px;
  --menubar-h:30px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
#menubar{display:none}
body.shell-macos #menubar{
  position:absolute;left:0;right:0;top:0;height:var(--menubar-h);z-index:5000;
  display:flex;align-items:center;gap:4px;padding:0 12px;font-size:13px;letter-spacing:.01em;

/* ============================================================
   Hyprland-style tiling shell

   is in retile(); this is only how it looks.

body.shell-hypr{
  --panel-h:0px;
  --hypr-bar:28px;
  --hypr-gap:9px;
  --hypr-edge:11px;
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

body.shell-hypr #menubar{
  position:absolute;left:0;right:0;top:0;height:var(--hypr-bar);z-index:5000;
  display:flex;align-items:center;gap:14px;padding:0 10px;font-size:12px;
  background:rgba(16,16,20,.92);color:#cfd2e0;border-bottom:1px solid rgba(255,255,255,.07);

body.shell-hypr #menu{top:calc(var(--hypr-bar) + 6px);bottom:auto;left:8px;transform-origin:top left}

/* windows: thick accent border, no shadow, slim bar */
body.shell-hypr .win{
  border-radius:9px;border:2px solid rgba(255,255,255,.10);box-shadow:none;
  /* deliberately no transition on size or position: retile() runs several
     times in a row as windows appear, and interrupting a width/height
     transition leaves the window stuck at whatever it had reached. Tiling
     window managers snap instantly anyway. */
  transition:border-color .13s ease;
}
body.shell-hypr .win.active{

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let idSeq = 0;
const uid = p => (p || "id") + "_" + (++idSeq) + "_" + Math.random().toString(36).slice(2, 6);

function fmtBytes(n){
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function fmtDuration(ms){
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h) return h + "h " + m + "m";
  if (m) return m + "m " + sec + "s";
  return sec + "s";
}
function fmtAgo(t){
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 90) return "a minute ago";
  if (s < 3600) return Math.floor(s / 60) + " minutes ago";
  if (s < 7200) return "an hour ago";
  return Math.floor(s / 3600) + " hours ago";
}

/* ============================================================
   1. virtual file system  (in memory, session only)
   ============================================================ */
const HOME = "/home/box";
const FS = { root: { type: "dir", children: {} } };

const dirNode  = () => ({ type: "dir", children: {} });
const fileNode = (content, kind, mime) => ({ type: "file", content, kind: kind || "text", mime: mime || "text/plain" });

function expand(p){
  if (p === "~") return HOME;
  if (p.startsWith("~/")) return HOME + p.slice(1);
  return p;
}
function segs(path, cwd){
  path = expand(String(path));
  const abs = path.startsWith("/") ? path : (cwd || "/").replace(/\/+$/, "") + "/" + path;
  const out = [];
  for (const s of abs.split("/")){
    if (!s || s === ".") continue;
    if (s === ".."){ out.pop(); continue; }
    out.push(s);
  }
  return out;
}
const joinSegs = parts => "/" + parts.join("/");
function absPath(path, cwd){ return joinSegs(segs(path, cwd)); }
function baseName(path){ const p = segs(path, "/"); return p.length ? p[p.length - 1] : "/"; }
function dirName(path){ const p = segs(path, "/"); p.pop(); return joinSegs(p); }
function tilde(path){ return path === HOME ? "~" : path.startsWith(HOME + "/") ? "~" + path.slice(HOME.length) : path; }

function node(path, cwd){
  let n = FS.root;
  for (const s of segs(path, cwd || "/")){
    if (n.type !== "dir") return null;
    n = n.children[s];
    if (!n) return null;
  }
  return n;
}
function ensureDir(path){
  let n = FS.root;
  for (const s of segs(path, "/")){
    if (!n.children[s]) n.children[s] = dirNode();
    n = n.children[s];
    if (n.type !== "dir") return null;
  }
  markDirty();
  return n;
}

/* the two places that used to poke children{} directly now come through here,
   so nothing can change the disk without the save layer noticing */
function addUnique(parentPath, name, content, kind, mime){
  const parent = node(parentPath);
  if (!parent || parent.type !== "dir") return null;
  const final = uniqueName(parent, name);
  parent.children[final] = fileNode(content, kind, mime);
  markDirty();
  return final;
}
function writeFile(path, content, kind, mime){
  const p = segs(path, "/"), name = p.pop();
  const parent = node(joinSegs(p));
  if (!parent || parent.type !== "dir" || !name) return false;
  const prev = parent.children[name];
  parent.children[name] = fileNode(content, kind || (prev && prev.kind) || "text", mime || (prev && prev.mime));
  markDirty();
  return true;
}
function removePath(path){
  const p = segs(path, "/"), name = p.pop();
  const parent = node(joinSegs(p));
  if (!parent || !parent.children[name]) return false;
  delete parent.children[name];
  markDirty();
  return true;
}
function renamePath(path, newName){
  const p = segs(path, "/"), name = p.pop();
  const parent = node(joinSegs(p));
  if (!parent || !parent.children[name] || parent.children[newName]) return false;
  const rebuilt = {};
  for (const [k, v] of Object.entries(parent.children)) rebuilt[k === name ? newName : k] = v;
  parent.children = rebuilt;
  markDirty();
  return true;
}
function uniqueName(parent, name){
  if (!parent.children[name]) return name;
  const dot = name.lastIndexOf(".");
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext  = dot > 0 ? name.slice(dot) : "";
  let i = 1;
  while (parent.children[stem + " (" + i + ")" + ext]) i++;
  return stem + " (" + i + ")" + ext;
}
function countFiles(n = FS.root){
  let c = 0;
  if (n.type === "dir") for (const k in n.children) c += countFiles(n.children[k]);
  else c = 1;
  return c;
}
function listDir(n){
  return Object.keys(n.children).sort((a, b) => {
    const A = n.children[a].type === "dir", B = n.children[b].type === "dir";
    if (A !== B) return A ? -1 : 1;
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
  });
}
function walkFS(fn, n = FS.root, path = ""){
  if (n.type !== "dir") return;
  for (const name of listDir(n)){
    const child = n.children[name], p = path + "/" + name;
    fn(p, child, name);
    walkFS(fn, child, p);
  }
}

const TEXT_EXT = ["txt","md","markdown","html","htm","css","js","mjs","json","csv","tsv","xml","log","sh","py","rb","c","h","cpp","java","ts","tsx","jsx","yml","yaml","ini","conf","cfg","sql","rs","go","php"];
const IMG_EXT  = ["png","jpg","jpeg","gif","webp","svg","bmp","ico","avif"];
const HTML_EXT = ["html","htm"];
const extOf    = name => (name.includes(".") ? name.split(".").pop().toLowerCase() : "");
const isHtml   = name => HTML_EXT.includes(extOf(name));

function kindFor(name, mime){
  const e = extOf(name);
  if ((mime && mime.startsWith("image/")) || IMG_EXT.includes(e)) return "image";
  if ((mime && (mime.startsWith("text/") || /json|xml|javascript|ecmascript/.test(mime))) || TEXT_EXT.includes(e)) return "text";
  return "binary";
}
function nodeSize(n){
  if (n.type === "dir") return null;
  if (n.kind === "link") return null;      /* it lives in the repo, not here */
  if (n.kind === "text") return new Blob([n.content]).size;
  const i = n.content.indexOf(",");
  return Math.max(0, Math.round((n.content.length - i - 1) * 3 / 4));
}
function nodeIcon(name, n){
  if (!n) return "\u2753";
  if (n.type === "dir") return "\uD83D\uDCC1";
  if (n.kind === "image" || IMG_EXT.includes(extOf(name))) return "\uD83D\uDDBC\uFE0F";
  if (isVideo(name)) return "\uD83C\uDFAC";
  if (isAudio(name)) return "\uD83C\uDFB5";
  if (n.kind === "binary") return "\uD83D\uDCE6";
  const e = extOf(name);
  if (isHtml(name)) return "\uD83C\uDF10";
  if (e === "md" || e === "markdown") return "\uD83D\uDCDD";
  if (e === "js" || e === "mjs" || e === "json") return "\uD83D\uDCDC";
  if (e === "css") return "\uD83C\uDFA8";
  return "\uD83D\uDCC4";
}
function typeLabel(name, n){
  if (n.type === "dir") return "Folder";
  if (n.kind === "link")
    return (isVideo(name) ? "Video" : isAudio(name) ? "Audio"
            : IMG_EXT.includes(extOf(name)) ? "Picture" : "File") +
           (/^https?:/i.test(n.content) ? " from the web" : " in repo");
  const e = extOf(name);
  if (n.kind === "image") return (e ? e.toUpperCase() : "Image") + " image";
  if (isVideo(name)) return (e ? e.toUpperCase() : "Video") + " video";
  if (isAudio(name)) return (e ? e.toUpperCase() : "Audio") + " audio";
  if (n.kind === "binary") return (e ? e.toUpperCase() + " file" : "Binary");
  if (isHtml(name)) return "Web page";
  return e ? e.toUpperCase() + " text" : "Text";
}

/* ---- video: wallpapers, boot screens and playback ---- */
const VIDEO_EXT = ["mp4","webm","ogv","m4v","mov","mkv"];
const isVideo = name => VIDEO_EXT.includes(extOf(name));

/* Videos are far too big to sit in a settings string, so they live in the
   filesystem like any other file and the setting just points at the path.
   That way the existing "too big to save" handling applies to them too. */
function mediaSource(path){
  if (!path) return null;
  const n = node(path);
  return (n && n.type === "file") ? n : null;
}
function importMediaFile(file, dir){
  return new Promise(resolve => {
    ensureDir(dir);
    const r = new FileReader();
    r.onload = () => resolve(addUnique(dir, file.name, r.result, isVideo(file.name) ? "binary" : kindFor(file.name, file.type || ""), file.type || ""));
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}

   1b. clipboard, trash and the move/copy primitives
   ============================================================ */
const Clip = { mode: null, paths: [] };
const Trash = { items: [] };   /* {id, name, node, from, when} */

const cloneNode = n => JSON.parse(JSON.stringify(n));

/* put a node into a directory, never overwriting something already there */
function placeNode(dirPath, name, n){
  const parent = node(dirPath);
  if (!parent || parent.type !== "dir") return null;
  const final = uniqueName(parent, name);
  parent.children[final] = n;
  markDirty();
  return final;
}
function copyPath(from, toDir){
  const n = node(from);
  if (!n) return null;
  return placeNode(toDir, baseName(from), cloneNode(n));
}
function movePath(from, toDir){
  const n = node(from);
  if (!n) return null;
  if (dirName(from) === toDir) return baseName(from);
  /* refuse to drop a folder inside itself */
  if (n.type === "dir" && (toDir === from || toDir.startsWith(from + "/"))) return null;
  const placed = placeNode(toDir, baseName(from), n);
  if (placed) removePath(from);
  return placed;
}
function trashPath(p){
  const n = node(p);
  if (!n) return false;
  Trash.items.unshift({ id: uid("tr"), name: baseName(p), node: n, from: dirName(p), when: Date.now() });
  removePath(p);
  saveTrash();
  return true;
}
function restoreTrash(id){
  const i = Trash.items.findIndex(t => t.id === id);
  if (i < 0) return null;
  const t = Trash.items[i];
  let dest = t.from;
  if (!node(dest) || node(dest).type !== "dir"){ ensureDir(HOME); dest = HOME; }
  const placed = placeNode(dest, t.name, t.node);
  Trash.items.splice(i, 1);
  saveTrash();
  return placed ? dest + "/" + placed : null;
}
function emptyTrash(){ Trash.items = []; saveTrash(); }
function trashBytes(){
  let n = 0;
  const walk = x => {
    if (x.type === "dir") for (const k in x.children) walk(x.children[k]);
    else n += nodeSize(x) || 0;
  };
  Trash.items.forEach(t => walk(t.node));
  return n;
}
function saveTrash(){
  /* the views must refresh even when nothing is being persisted, or the
     Trash count on the desktop silently stops matching reality */
  if (Store.on){
    try {
      localStorage.setItem(K.trash, JSON.stringify(Trash.items));
      Store.lastSaved = Date.now();
    } catch (e){ storageFull(); }
  }
  refreshTrashViews();
}
function refreshTrashViews(){
  for (const w of windows.values())
    if (w.appId === "trash" && w.api && w.api.refresh) w.api.refresh();
  drawDesktop();
}
