const Weather = { data: null, at: 0, key: "", busy: false, err: "" };
async function loadWeather(force){
  const p = State.weatherPlace;
  if (!p || Weather.busy) return;
  const key = p.lat + "," + p.lon + "," + State.tempUnit;
  if (!force && Weather.key === key && Date.now() - Weather.at < 20 * 60000) return;
  Weather.busy = true;
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
      "&current=temperature_2m,weather_code,wind_speed_10m,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4" +
      (State.tempUnit === "f" ? "&temperature_unit=fahrenheit&wind_speed_unit=mph" : "");
    const res = await fetch(url);
    if (!res.ok) throw new Error(String(res.status));
    Weather.data = await res.json();
    Weather.at = Date.now();
    Weather.key = key;
    Weather.err = "";
  } catch (e){
    Weather.err = "Could not reach the weather service.";
  }
  Weather.busy = false;
  drawWidgets();
}
async function chooseWeatherPlace(){
  const q = await osPrompt("Weather", "Which town or city?", State.weatherPlace ? State.weatherPlace.name : "");
  if (!q) return;
  try {
    const res = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=" + encodeURIComponent(q));
    const g = await res.json();
    const hit = g.results && g.results[0];
    if (!hit) return osAlert("Weather", "Could not find “" + q + "”. Try a nearby larger town.");
    State.weatherPlace = { name: hit.name, region: [hit.admin1, hit.country].filter(Boolean).join(", "),
                           lat: hit.latitude, lon: hit.longitude };
    State.widgets = Object.assign({}, State.widgets, { weather: true });
    Weather.key = "";
    saveSettings();
    drawWidgets();
    refreshSettings();
    loadWeather(true);
  } catch (e){
    osAlert("Weather", "Could not reach the weather service. Check your connection and try again.");
  }
}
function setWidget(id, on){
  State.widgets = Object.assign({}, State.widgets, { [id]: !!on });
  saveSettings();
  drawWidgets();
  refreshSettings();
  if (on && id === "weather"){
    if (!State.weatherPlace) chooseWeatherPlace();
    else loadWeather(false);
  }
}

function placeWidget(box, id){
  const layer = $("#widgets");
  const pos = State.widgetPos[id];
  if (pos){
    const W = layer.clientWidth || innerWidth, H = layer.clientHeight || innerHeight;
    box.style.right = "auto";
    box.style.left = Math.round(Math.min(pos.x, 0.97) * W) + "px";
    box.style.top = Math.round(Math.min(pos.y, 0.95) * H) + "px";
  } else {
    /* unplaced widgets stack down the right-hand side */
    const order = WIDGETS.filter(w => State.widgets[w] && !State.widgetPos[w]).indexOf(id);
    box.style.left = "auto";
    box.style.right = "24px";
    box.style.top = (24 + Math.max(0, order) * 150) + "px";
  }
}
function widgetMenu(id){
  const items = [];
  if (id === "weather"){
    items.push({ icon: "📍", label: "Change place…", run: chooseWeatherPlace },
               { icon: "🌡️", label: State.tempUnit === "f" ? "Show °C" : "Show °F",
                 run: () => { State.tempUnit = State.tempUnit === "f" ? "c" : "f"; saveSettings(); loadWeather(true); refreshSettings(); } },
               { icon: "🔄", label: "Refresh", run: () => loadWeather(true) }, "-");
  }
  items.push({ icon: "↩️", label: "Put back in the corner", disabled: !State.widgetPos[id],
               run: () => { const p = Object.assign({}, State.widgetPos); delete p[id]; State.widgetPos = p; saveSettings(); drawWidgets(true); } },
             { icon: "✖", label: "Remove " + WIDGET_NAMES[id], run: () => setWidget(id, false) },
             { icon: "⚙️", label: "Widget settings…", run: () => launch("settings") });
  return items;
}
function makeWidget(id){
  const box = el("div", "wdg wdg-" + id);
  box.dataset.w = id;
  box.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button")) return;
    const layer = $("#widgets").getBoundingClientRect(), r = box.getBoundingClientRect();
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    box.setPointerCapture(e.pointerId);
    box.classList.add("drag");
    const move = ev => {
      box.style.right = "auto";
      box.style.left = Math.max(0, Math.min(layer.width - r.width, ev.clientX - layer.left - dx)) + "px";
      box.style.top = Math.max(0, Math.min(layer.height - r.height, ev.clientY - layer.top - dy)) + "px";
    };
    const up = () => {
      box.removeEventListener("pointermove", move);
      box.removeEventListener("pointerup", up);
      box.classList.remove("drag");
      State.widgetPos = Object.assign({}, State.widgetPos,
        { [id]: { x: box.offsetLeft / layer.width, y: box.offsetTop / layer.height } });
      saveSettings();
    };
    box.addEventListener("pointermove", move);
    box.addEventListener("pointerup", up);
  });
  box.addEventListener("contextmenu", e => {
    e.preventDefault();
    e.stopPropagation();
    showCtx(e.clientX, e.clientY, widgetMenu(id));
  });
  return box;
}
function renderWidget(box, id){
  box.innerHTML = "";
  if (id === "clock"){
    const d = new Date();
    const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: !State.clock24 });
    const t = el("div", "t", hm);
    t.appendChild(el("span", "s", String(d.getSeconds()).padStart(2, "0")));
    box.append(t, el("div", "d", d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })));
  } else if (id === "weather"){
    const p = State.weatherPlace;
    if (!p){
      box.appendChild(el("div", "wdg-m-t", "Weather"));
      const b = el("button", null, "Choose a place…");
      b.style.marginTop = "8px";
      b.onclick = chooseWeatherPlace;
      box.appendChild(b);
      return;
    }
    const w = Weather.data;
    if (!w || !w.current){
      box.append(el("div", "wdg-m-t", p.name), el("div", "wdg-w-sub", Weather.err || "Loading…"));
      return;
    }
    const unit = "°";
    const [label, icon] = wmo(w.current.weather_code);
    const top = el("div", "wdg-w-top");
    const txt = el("div");
    txt.append(el("div", "wdg-w-temp", Math.round(w.current.temperature_2m) + unit),
               el("div", "wdg-w-sub", label + " · " + p.name));
    top.append(el("div", "wdg-w-ic", w.current.is_day === 0 && w.current.weather_code <= 1 ? "🌙" : icon), txt);
    box.appendChild(top);
    if (w.daily && w.daily.time){
      const days = el("div", "wdg-w-days");
      w.daily.time.slice(0, 4).forEach((iso, i) => {
        const day = el("div", "wdg-w-day");
        const name = i === 0 ? "Today" : new Date(iso + "T12:00").toLocaleDateString([], { weekday: "short" });
        day.append(document.createTextNode(name), el("b", null, wmo(w.daily.weather_code[i])[1]),
                   document.createTextNode(Math.round(w.daily.temperature_2m_max[i]) + unit + " " +
                                           Math.round(w.daily.temperature_2m_min[i]) + unit));
        days.appendChild(day);
      });
      box.appendChild(days);
    }
    box.title = p.name + (p.region ? ", " + p.region : "") + " - updated " + fmtAgo(Weather.at) + ". Right-click for options.";
  } else if (id === "music"){
    const live = NowPlaying.win && windows.has(NowPlaying.win.id) && NowPlaying.title;
    box.append(el("div", "wdg-m-s", live ? (NowPlaying.playing ? "Now playing" : "Paused") : "Now playing"),
               el("div", "wdg-m-t", live ? NowPlaying.title : "Nothing yet"));
    const ctl = el("div", "wdg-m-ctl");
    if (live){
      const toggle = el("button", null, NowPlaying.playing ? "❚❚ Pause" : "▶ Play");
      toggle.onclick = () => NowPlaying.win.api.toggle && NowPlaying.win.api.toggle();
      const next = el("button", null, "Next ▶▶");
      next.onclick = () => NowPlaying.win.api.next && NowPlaying.win.api.next();
      const show = el("button", null, "Show");
      show.onclick = () => focusWin(NowPlaying.win);
      ctl.append(toggle, next, show);
    } else {
      const open = el("button", null, "Open Media");
      open.onclick = () => launch("music");
      ctl.appendChild(open);
    }
    box.appendChild(ctl);
  }
}
function drawWidgets(replace){
  const layer = $("#widgets");
  if (!layer) return;
  for (const id of WIDGETS){
    let box = layer.querySelector('[data-w="' + id + '"]');
    if (!State.widgets[id]){ if (box) box.remove(); continue; }
    if (!box){
      box = makeWidget(id);
      layer.appendChild(box);
      placeWidget(box, id);
    } else if (replace) placeWidget(box, id);
    renderWidget(box, id);
  }
}
setInterval(() => {
  const box = State.widgets.clock && $('#widgets [data-w="clock"]');
  if (box) renderWidget(box, "clock");
}, 1000);
setInterval(() => { if (State.widgets.weather) loadWeather(false); }, 5 * 60000);
addEventListener("resize", () => drawWidgets(true));

/* ============================================================
   16. boot
   ============================================================ */
/* ============================================================
   16b. first run

   Shown when the browser holds nothing for SEA OS yet. Say yes to saving and
   it never appears again; decline and it returns next time, which is honest -
   without saving, every boot really is a first boot.
   ============================================================ */
async function firstRun(){
  const wantSaving = await modal({
    title: "Enable file saving?",
    message: "SEA OS can keep your files, settings and shortcuts in this browser, " +
             "so they are still here next time.\n\n" +
             "Leave it off and everything resets when you reload.",
    ok: "Enable saving",
    cancelText: "Not now"
  });
  if (wantSaving && Store.available) setSaving(true);
  else if (wantSaving && !Store.available)
    await osAlert("Not available", "This browser is blocking storage for local files, so saving cannot be turned on.");

  await modal({
    title: "One more thing",
    message: "Click the box in the top left to open a new app.",
    ok: "Got it",
    cancel: false
  });
}

(function boot(){
  /* a restored disk wins; otherwise lay down the demo files, once */
  const restored = loadState();
  if (!restored) seedDisk();
  /* Help sits in the Dock for the very first boot, and steps aside on the
     next one. Pin it back after that and it stays. With saving off every
     boot is a first boot, so it keeps coming back - as the welcome does. */
  if (!Store.on){
    if (!State.dock.includes("help")) State.dock = State.dock.concat("help");
    State.helpDockPhase = "shown";
  } else if (State.helpDockPhase === "shown"){
    State.dock = State.dock.filter(id => id !== "help");
    State.helpDockPhase = "done";
    saveSettings();
  }
  (State.installed || []).forEach(registerStoreApp);
  applyTheme(); applyAccent(); applyWallpaper(); applyChrome();
  drawDesktop(); drawNotifications(); clockTick();
  drawWidgets();
  if (State.widgets.weather) loadWeather(false);
  siblingReady.then(() => { if (Sibling.wall) applyWallpaper(); });
  mountRepoMedia().then(n => {
    if (n) notify("Media loaded", n + " file" + (n === 1 ? "" : "s") + " from the repo are in Videos and Music.", "\uD83C\uDFAC");
  });
  /* a game kept in the Dock or on the desktop needs its catalogue before it can open */
  if ((State.dock || []).concat(State.shortcuts.map(x => x.target)).some(id => String(id).startsWith("game:"))) discoverGames();
  setInterval(clockTick, 1000);

  const b = $("#boot"), bar = $("#bootbar");
  let done = false;
  let t = 0;
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(t);
    const bv = $("#bootvideo");
    bv.pause();
    b.style.opacity = "0";
    setTimeout(() => b.remove(), 500);
    BOOT_TIME = Date.now();
    /* wait until the viewport actually has a size (embedded/hidden frames) */
    let fired = false, tries = 0;
    const open = () => {
      if (fired) return;
      fired = true;
      dockIntroPending = true;
      drawDock();
      launch("files");
      /* nothing stored for us yet means this is a fresh machine */
      if (!restored && !Store.on){
        setTimeout(firstRun, 900);
        return;
      }
      setTimeout(() => notify(restored ? "Welcome back" : "Welcome to SEA OS",
        restored
          ? "Your files and settings were restored from this browser."
          : "Right-click the desktop for a menu. Turn on saving in Settings to keep your files.",
        "\uD83D\uDCE6"), 700);
    };
    const poll = setInterval(() => {
      if ($("#windows").clientWidth > 200 || ++tries > 50){ clearInterval(poll); open(); }
    }, 60);
    if ($("#windows").clientWidth > 200){ clearInterval(poll); open(); }
  };

  /* a custom boot screen replaces the splash entirely */
  const chosenBoot = mediaSource(State.bootMedia);
  const startSplash = () => {
    requestAnimationFrame(() => { bar.style.width = "100%"; });
    t = setTimeout(finish, 1600);
  };
  if (!chosenBoot){
    /* nothing chosen: give the sibling probe a moment, showing the splash meanwhile */
    startSplash();
    Promise.race([siblingReady, new Promise(r => setTimeout(r, 1100))]).then(() => {
      if (done || !Sibling.boot) return;
      clearTimeout(t);
      showBootMedia(Sibling.boot.url, Sibling.boot.video);
    });
  } else {
    showBootMedia(chosenBoot.content, isVideo(baseName(State.bootMedia)));
  }

  function showBootMedia(src, video){
    b.classList.add("media");
    if (video){
      const bv = $("#bootvideo");
      bv.muted = true;               /* the property, not just the attribute - autoplay depends on it */
      bv.playsInline = true;
      bv.src = src;
      bv.classList.add("on");
      bv.onended = finish;
      bv.onerror = finish;
      /* Cap it either way: when the video plays we wait for it (up to 15s);
         when autoplay is refused we hold the first frame briefly instead of
         flashing past a frozen screen. */
      t = setTimeout(finish, 15000);
      const go = bv.play();
      if (go && go.catch) go.catch(err => {
        window.__bootPlayErr = err && (err.name + ": " + err.message);
        clearTimeout(t);
        t = setTimeout(finish, 2600);
      });
    } else {
      const bi = $("#bootimage");
      bi.src = src;
      bi.classList.add("on");
      bi.onerror = finish;
      t = setTimeout(finish, 2600);
    }
  }
  b.addEventListener("click", finish);
})();

</script>
