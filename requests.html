<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* same three themes as the notebook; the notebook tells us which one */
  :root {
    --paper: #fbfbf7; --paper-2: #f3f3ec; --card: #ffffff; --ink: #1f2d44; --pencil: #66708a;
    --rule-line: #dde6f2; --edge: #d9dde4; --accent: #2c5fb8; --highlight: #ffe680; --highlight-ink: #1f2d44;
    --danger: #c0473a; --good: #2f7d4f;
    --shadow: 0 1px 2px rgba(31, 45, 68, 0.08), 0 4px 14px rgba(31, 45, 68, 0.06);
    --hand: 'Kalam', 'Segoe Print', cursive;
    --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    --radius: 6px;
    color-scheme: light;
  }
  body[data-theme="chalkboard"] {
    --paper: #1e2a25; --paper-2: #24322c; --card: #26352f; --ink: #eef0ea; --pencil: #9fb0a7;
    --rule-line: #34453d; --edge: #34453d; --accent: #f2d479; --highlight: #f2d479; --highlight-ink: #1e2a25;
    --danger: #f08c7e; --good: #8fd6a4;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(0, 0, 0, 0.18);
    color-scheme: dark;
  }
  body[data-theme="terminal"] {
    --paper: #0c0d10; --paper-2: #171b20; --card: #101216; --ink: #e8e8e6; --pencil: #6f7680;
    --rule-line: #23262c; --edge: #23262c; --accent: #6ee7a8; --highlight: #6ee7a8; --highlight-ink: #0c0d10;
    --danger: #e8776d; --good: #6ee7a8;
    --shadow: none;
    --hand: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --body: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --radius: 0;
    color-scheme: dark;
  }
  body[data-theme="night"] {
    --paper: #16181d; --paper-2: #1f232a; --card: #1c1f26; --ink: #d9d5cc; --pencil: #8b909a;
    --rule-line: #2b3039; --edge: #2b3039; --accent: #8fb3d9; --highlight: #2f4157; --highlight-ink: #e8e4db;
    --danger: #d98b7f; --good: #8fcfa6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.18);
    --hand: var(--body);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  body[data-theme="terminal"] { font-size: 13px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 820px; padding: 0.4rem 0.2rem 2rem; display: flex; flex-direction: column; gap: 1.3rem; }

  .intro h2 { margin: 0; font-family: var(--hand); font-size: 1.6rem; line-height: 1.2; }
  .intro p { margin: 0.2rem 0 0; color: var(--pencil); max-width: 60ch; }

  .box { padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow); }
  .box h3 { margin: 0 0 0.6rem; font-family: var(--hand); font-size: 1.15rem; }

  .row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .field {
    flex: 1 1 200px;
    padding: 0.55rem 0.75rem;
    background: var(--paper);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    outline: none;
  }
  .field:focus { border-color: var(--accent); }
  select.field { flex: 0 0 auto; }
  .btn { padding: 0.55rem 1.1rem; background: var(--paper-2); border: 1px solid var(--edge); border-radius: var(--radius); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 700; }
  body[data-theme="chalkboard"] .btn.primary, body[data-theme="terminal"] .btn.primary, body[data-theme="night"] .btn.primary { color: var(--paper); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .msg { min-height: 1.3em; margin: 0.5rem 0 0; font-size: 0.88rem; color: var(--danger); }
  .msg.ok { color: var(--good); }
  .link-btn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
  .small { font-size: 0.85rem; color: var(--pencil); }

  .tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tabs button { padding: 0.35rem 0.8rem; background: var(--paper-2); border: 1px solid var(--edge); border-radius: 999px; font-size: 0.85rem; cursor: pointer; }
  body[data-theme="terminal"] .tabs button { border-radius: 0; }
  .tabs button.on { background: var(--highlight); border-color: var(--highlight); color: var(--highlight-ink); font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: 0.7rem; }
  .req {
    display: grid;
    grid-template-columns: 3.4rem minmax(0, 1fr);
    gap: 0.9rem;
    padding: 0.8rem 0.9rem;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .req.is-hidden { opacity: 0.5; }
  .vote {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem;
    height: 3.4rem;
    background: var(--paper-2);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }
  .vote:hover { border-color: var(--accent); }
  .vote:active { transform: scale(0.94); }
  .vote svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .vote b { font-size: 1rem; line-height: 1; }
  .vote.on { background: var(--highlight); border-color: var(--highlight); color: var(--highlight-ink); }
  .req-title { font-weight: 700; overflow-wrap: anywhere; }
  .req-reason { margin: 0.15rem 0 0; color: var(--pencil); font-size: 0.9rem; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.7rem; margin-top: 0.4rem; font-size: 0.8rem; color: var(--pencil); }
  .chip { padding: 0.05rem 0.5rem; border: 1px solid var(--edge); border-radius: 999px; font-size: 0.75rem; }
  .chip.planned { border-color: var(--accent); color: var(--accent); }
  .chip.added { border-color: var(--good); color: var(--good); }
  .chip.declined { border-color: var(--danger); color: var(--danger); }
  .mod { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-left: auto; }
  .mod select, .mod button { padding: 0.15rem 0.45rem; font-size: 0.78rem; background: var(--paper-2); border: 1px solid var(--edge); border-radius: 4px; cursor: pointer; }
  .empty { font-family: var(--hand); font-size: 1.1rem; color: var(--pencil); }

  /* ---------------- the poll ---------------- */
  .poll { display: flex; flex-direction: column; gap: 0.7rem; }
  .opt-wrap { display: flex; flex-direction: column; gap: 0.3rem; }
  .opt {
    position: relative;
    display: grid;
    grid-template-columns: 1.3rem minmax(0, 1fr) auto;
    align-items: center;
    gap: 0.9rem;
    width: 100%;
    padding: 0.95rem 1.05rem;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(0.995); }
  .opt:disabled { cursor: default; }
  .opt > * { position: relative; z-index: 1; }
  .opt .bar {
    position: absolute;
    inset: 0 auto 0 0;
    z-index: 0;
    width: 0;
    background: var(--highlight);
    opacity: 0.35;
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .opt.on .bar { opacity: 0.55; }
  .radio { width: 1.15rem; height: 1.15rem; border: 2px solid var(--edge); border-radius: 50%; }
  .opt.on .radio { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 42%, transparent 46%); }
  .opt-title { font-weight: 700; overflow-wrap: anywhere; }
  .opt-reason { display: block; margin-top: 0.1rem; color: var(--pencil); font-size: 0.88rem; font-weight: 400; overflow-wrap: anywhere; }
  .opt-count { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .opt-count b { display: block; font-size: 1.05rem; }
  .opt-count span { color: var(--pencil); font-size: 0.78rem; }
  .opt-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
  .opt-tags .chip { font-weight: 400; }
  .mod-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; padding-left: 0.2rem; font-size: 0.78rem; color: var(--pencil); }
  .mod-row select, .mod-row button { padding: 0.15rem 0.45rem; font-size: 0.78rem; background: var(--paper-2); border: 1px solid var(--edge); border-radius: 4px; cursor: pointer; }
  .poll-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; color: var(--pencil); font-size: 0.85rem; }
  .sub { margin: 0.4rem 0 0.5rem; font-family: var(--hand); font-size: 1.15rem; color: var(--pencil); font-weight: 400; }
  .done { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .done .chip { padding: 0.2rem 0.65rem; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <h2>What should we add next?</h2>
    <p>Pick one. You can change your pick any time, and the most-voted option gets looked at first. You need a Chalk Chat account to vote.</p>
  </header>

  <!-- signed out -->
  <section class="box" id="signin" hidden>
    <h3>Sign in with your Chalk Chat account</h3>
    <div class="row">
      <input class="field" id="u" maxlength="20" placeholder="Username" autocomplete="username">
      <input class="field" id="p" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn primary" id="login" type="button">Log in</button>
      <button class="btn" id="register" type="button">Register</button>
    </div>
    <p class="msg" id="signin-msg"></p>
  </section>

  <!-- the poll -->
  <section class="poll" id="poll" aria-label="Poll options"><p class="empty">Loading…</p></section>
  <p class="msg" id="poll-msg" role="status"></p>
  <div class="poll-foot" id="poll-foot" hidden>
    <span id="poll-total"></span>
    <span>Voting as <b id="me-name">—</b> · <button class="link-btn" id="sign-out" type="button">sign out</button></span>
  </div>

  <section id="done-wrap" hidden>
    <h3 class="sub">Already added thanks to votes</h3>
    <div class="done" id="done"></div>
  </section>

  <!-- moderators add the options -->
  <section class="box" id="suggest" hidden>
    <h3>Add a poll option (moderators)</h3>
    <form id="suggest-form" autocomplete="off">
      <div class="row">
        <input class="field" id="title" maxlength="60" placeholder="Option name, e.g. Geometry Dash" required>
        <select class="field" id="kind" aria-label="Type">
          <option value="game">Game</option>
          <option value="feature">Feature</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="row" style="margin-top:0.6rem">
        <input class="field" id="reason" maxlength="140" placeholder="One line about it (optional)">
        <button class="btn primary" type="submit">Add option</button>
      </div>
    </form>
    <p class="msg" id="suggest-msg"></p>
  </section>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/+esm';

// same project as Chalk Chat, so the same accounts (and the same sign-in) work here
const SUPABASE_URL = 'https://ifyhdysaugcivmvltuyb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CBXtSVX-0r8a0GGV9B4znA_8JXfxaOD';
const MAIL_DOMAIN = 'users.chalkbored.win';
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const state = { me: null, rows: [], mine: new Set() };

// ---- theme: from the address first, then live updates from the notebook ----
function applyLook(theme) {
  document.body.dataset.theme = ['notebook', 'chalkboard', 'terminal', 'night'].includes(theme) ? theme : 'notebook';
}
const q = new URLSearchParams(location.search);
applyLook(q.get('theme'));
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'look') return;
  applyLook(e.data.theme);
});

// ---- signing in (same trick as the chat: usernames become hidden emails) ----
async function signIn(mode) {
  const username = $('u').value.trim();
  const password = $('p').value;
  const msg = $('signin-msg');
  msg.textContent = '';
  if (!/^[A-Za-z0-9_.-]{2,20}$/.test(username)) { msg.textContent = 'Usernames: 2–20 characters, letters, numbers, _ . - only.'; return; }
  if (password.length < 6) { msg.textContent = 'Passwords need at least 6 characters.'; return; }

  const email = username.toLowerCase() + '@' + MAIL_DOMAIN;
  const res = mode === 'register'
    ? await db.auth.signUp({ email, password, options: { data: { username } } })
    : await db.auth.signInWithPassword({ email, password });
  if (res.error) {
    msg.textContent = res.error.message.includes('already registered') ? 'That name already has an account — use Log in.'
      : res.error.message.includes('Invalid login') ? 'Wrong name or password.' : res.error.message;
    return;
  }
  await start();
}
$('login').onclick = () => signIn('login');
$('register').onclick = () => signIn('register');
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn('login'); });
$('sign-out').onclick = async () => { await db.auth.signOut(); location.reload(); };

const SETUP_HINT = 'The poll isn\u2019t set up yet. Run SCRIPTS/requests-poll.sql in Supabase.';

// ---- moderators add options ----
$('suggest-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('suggest-msg');
  msg.className = 'msg';
  const { data: why, error } = await db.rpc('submit_request', {
    p_title: $('title').value, p_reason: $('reason').value, p_kind: $('kind').value,
  });
  if (error || why) { msg.textContent = error ? error.message : why; return; }
  msg.className = 'msg ok';
  msg.textContent = 'Added to the poll.';
  $('title').value = '';
  $('reason').value = '';
  await load();
});

// ---- the poll ----
async function load() {
  const [{ data, error }, votes] = await Promise.all([
    db.from('requests')
      .select('id, title, reason, kind, status, hidden, votes, created_at')
      .order('created_at', { ascending: true })
      .limit(200),
    db.from('request_votes').select('request_id').eq('user_id', state.me.id),
  ]);
  if (error) {
    $('poll').innerHTML = '<p class="empty"></p>';
    $('poll').firstChild.textContent = /requests|schema/.test(error.message) ? SETUP_HINT : error.message;
    return;
  }
  state.rows = data || [];
  state.mine = new Set((votes.data || []).map((v) => v.request_id));
  paint();
}

async function pick(r) {
  const msg = $('poll-msg');
  msg.className = 'msg';
  msg.textContent = '';
  const { data: why, error } = await db.rpc('vote_for', { p_request: r.id });
  if (error || why) {
    msg.textContent = error ? (/vote_for/.test(error.message) ? SETUP_HINT : error.message) : why;
    return;
  }
  await load();
}

function paint() {
  const open = state.rows.filter((r) => (r.status === 'open' || r.status === 'planned') && (!r.hidden || state.me.is_mod));
  const total = open.reduce((n, r) => n + (r.hidden ? 0 : r.votes), 0);

  const poll = $('poll');
  poll.innerHTML = '';
  if (!open.length) {
    poll.innerHTML = '<p class="empty"></p>';
    poll.firstChild.textContent = state.me.is_mod
      ? 'No options yet. Add some below, or run SCRIPTS/requests-poll.sql for the starter three.'
      : 'No options to vote on yet. Check back soon.';
  }

  open.forEach((r) => {
    const wrap = document.createElement('div');
    wrap.className = 'opt-wrap';
    const mine = state.mine.has(r.id);
    const pct = total ? Math.round((r.votes / total) * 100) : 0;

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (mine ? ' on' : '');
    b.setAttribute('aria-pressed', String(mine));
    b.innerHTML = '<span class="bar"></span><span class="radio" aria-hidden="true"></span>' +
      '<span><span class="opt-title"></span><span class="opt-reason"></span><span class="opt-tags"></span></span>' +
      '<span class="opt-count"><b></b><span></span></span>';
    b.querySelector('.opt-title').textContent = r.title;
    const reason = b.querySelector('.opt-reason');
    if (r.reason) reason.textContent = r.reason; else reason.remove();
    const tags = b.querySelector('.opt-tags');
    const addTag = (text, cls) => { const t = document.createElement('span'); t.className = 'chip' + (cls ? ' ' + cls : ''); t.textContent = text; tags.appendChild(t); };
    addTag(r.kind);
    if (r.status === 'planned') addTag('planned', 'planned');
    if (r.hidden) addTag('hidden');
    if (mine) addTag('your pick', 'added');
    b.querySelector('.opt-count b').textContent = pct + '%';
    b.querySelector('.opt-count span').textContent = r.votes + (r.votes === 1 ? ' vote' : ' votes');
    b.setAttribute('aria-label', r.title + ', ' + r.votes + ' votes' + (mine ? ', your pick. Click to take your vote back.' : '. Click to vote.'));
    b.onclick = () => pick(r);
    wrap.appendChild(b);
    // grow the bar after it's on screen so it animates
    requestAnimationFrame(() => { b.querySelector('.bar').style.width = pct + '%'; });

    if (state.me.is_mod) wrap.appendChild(modRow(r));
    poll.appendChild(wrap);
  });

  $('poll-total').textContent = total + (total === 1 ? ' vote so far' : ' votes so far') +
    (state.mine.size ? '' : ' · pick one to vote');
  $('poll-foot').hidden = false;

  const done = state.rows.filter((r) => r.status === 'added' && !r.hidden);
  $('done-wrap').hidden = !done.length;
  $('done').innerHTML = '';
  done.forEach((r) => {
    const c = document.createElement('span');
    c.className = 'chip added';
    c.textContent = r.title;
    $('done').appendChild(c);
  });
}

// site mods: set status, hide/unhide
function modRow(r) {
  const row = document.createElement('div');
  row.className = 'mod-row';
  row.append('mod: ');
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', 'Status of ' + r.title);
  ['open', 'planned', 'added', 'declined'].forEach((st) => {
    const o = document.createElement('option');
    o.value = st; o.textContent = st; o.selected = st === r.status;
    sel.appendChild(o);
  });
  sel.onchange = async () => { await db.rpc('set_request_status', { p_request: r.id, p_status: sel.value, p_hidden: null }); load(); };
  const hide = document.createElement('button');
  hide.type = 'button';
  hide.textContent = r.hidden ? 'unhide' : 'hide';
  hide.onclick = async () => { await db.rpc('set_request_status', { p_request: r.id, p_status: null, p_hidden: !r.hidden }); load(); };
  row.append(sel, hide);
  return row;
}

// ---- go ----
async function start() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    $('signin').hidden = false;
    $('suggest').hidden = true;
    $('poll').innerHTML = '<p class="empty">Sign in to see the poll and vote.</p>';
    return;
  }
  const { data: me } = await db.from('profiles').select('id, username, is_mod, banned').eq('id', user.id).maybeSingle();
  if (!me) {
    $('signin').hidden = false;
    $('signin-msg').textContent = 'Signed in, but this account has no profile yet.';
    return;
  }
  state.me = me;
  $('signin').hidden = true;
  $('suggest').hidden = !me.is_mod;
  $('me-name').textContent = me.username;
  await load();

  // new options and vote counts show up live
  db.channel('requests')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => load())
    .subscribe();
}

start();
</script>
</body>
</html>
