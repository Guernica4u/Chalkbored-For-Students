<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* same three themes as the notebook; the notebook tells us which one */
  :root {
    --paper: #fbfbf7; --paper-2: #f3f3ec; --card: #ffffff; --ink: #1f2d44; --pencil: #66708a;
    --rule-line: #dde6f2; --edge: #d9dde4; --accent: #2c5fb8; --highlight: #ffe680; --highlight-ink: #1f2d44;
    --danger: #c0473a; --good: #2f7d4f;
    --shadow: 0 1px 2px rgba(31, 45, 68, 0.08), 0 4px 14px rgba(31, 45, 68, 0.06);
    --hand: 'Kalam', 'Segoe Print', cursive;
    --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    --radius: 6px;
    color-scheme: light;
  }
  body[data-theme="chalkboard"] {
    --paper: #1e2a25; --paper-2: #24322c; --card: #26352f; --ink: #eef0ea; --pencil: #9fb0a7;
    --rule-line: #34453d; --edge: #34453d; --accent: #f2d479; --highlight: #f2d479; --highlight-ink: #1e2a25;
    --danger: #f08c7e; --good: #8fd6a4;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(0, 0, 0, 0.18);
    color-scheme: dark;
  }
  body[data-theme="terminal"] {
    --paper: #0c0d10; --paper-2: #171b20; --card: #101216; --ink: #e8e8e6; --pencil: #6f7680;
    --rule-line: #23262c; --edge: #23262c; --accent: #6ee7a8; --highlight: #6ee7a8; --highlight-ink: #0c0d10;
    --danger: #e8776d; --good: #6ee7a8;
    --shadow: none;
    --hand: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --body: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --radius: 0;
    color-scheme: dark;
  }
  body[data-theme="night"] {
    --paper: #16181d; --paper-2: #1f232a; --card: #1c1f26; --ink: #d9d5cc; --pencil: #8b909a;
    --rule-line: #2b3039; --edge: #2b3039; --accent: #8fb3d9; --highlight: #2f4157; --highlight-ink: #e8e4db;
    --danger: #d98b7f; --good: #8fcfa6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.18);
    --hand: var(--body);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  body[data-theme="terminal"] { font-size: 13px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 820px; padding: 0.4rem 0.2rem 2rem; display: flex; flex-direction: column; gap: 1.3rem; }

  .intro h2 { margin: 0; font-family: var(--hand); font-size: 1.6rem; line-height: 1.2; }
  .intro p { margin: 0.2rem 0 0; color: var(--pencil); max-width: 60ch; }

  .box { padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--edge); border-radius: var(--radius); box-shadow: var(--shadow); }
  .box h3 { margin: 0 0 0.6rem; font-family: var(--hand); font-size: 1.15rem; }

  .row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .field {
    flex: 1 1 200px;
    padding: 0.55rem 0.75rem;
    background: var(--paper);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    outline: none;
  }
  .field:focus { border-color: var(--accent); }
  select.field { flex: 0 0 auto; }
  .btn { padding: 0.55rem 1.1rem; background: var(--paper-2); border: 1px solid var(--edge); border-radius: var(--radius); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 700; }
  body[data-theme="chalkboard"] .btn.primary, body[data-theme="terminal"] .btn.primary, body[data-theme="night"] .btn.primary { color: var(--paper); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .msg { min-height: 1.3em; margin: 0.5rem 0 0; font-size: 0.88rem; color: var(--danger); }
  .msg.ok { color: var(--good); }
  .small { font-size: 0.85rem; color: var(--pencil); }

  .tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tabs button { padding: 0.35rem 0.8rem; background: var(--paper-2); border: 1px solid var(--edge); border-radius: 999px; font-size: 0.85rem; cursor: pointer; }
  body[data-theme="terminal"] .tabs button { border-radius: 0; }
  .tabs button.on { background: var(--highlight); border-color: var(--highlight); color: var(--highlight-ink); font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: 0.7rem; }
  .req {
    display: grid;
    grid-template-columns: 3.4rem minmax(0, 1fr);
    gap: 0.9rem;
    padding: 0.8rem 0.9rem;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .req.is-hidden { opacity: 0.5; }
  .vote {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem;
    height: 3.4rem;
    background: var(--paper-2);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: transform 0.15s ease, background-color 0.15s ease;
  }
  .vote:hover { border-color: var(--accent); }
  .vote:active { transform: scale(0.94); }
  .vote svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .vote b { font-size: 1rem; line-height: 1; }
  .vote.on { background: var(--highlight); border-color: var(--highlight); color: var(--highlight-ink); }
  .req-title { font-weight: 700; overflow-wrap: anywhere; }
  .req-reason { margin: 0.15rem 0 0; color: var(--pencil); font-size: 0.9rem; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.7rem; margin-top: 0.4rem; font-size: 0.8rem; color: var(--pencil); }
  .chip { padding: 0.05rem 0.5rem; border: 1px solid var(--edge); border-radius: 999px; font-size: 0.75rem; }
  .chip.planned { border-color: var(--accent); color: var(--accent); }
  .chip.added { border-color: var(--good); color: var(--good); }
  .chip.declined { border-color: var(--danger); color: var(--danger); }
  .mod { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-left: auto; }
  .mod select, .mod button { padding: 0.15rem 0.45rem; font-size: 0.78rem; background: var(--paper-2); border: 1px solid var(--edge); border-radius: 4px; cursor: pointer; }
  .empty { font-family: var(--hand); font-size: 1.1rem; color: var(--pencil); }
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <h2>What should we add next?</h2>
    <p>Suggest a game or a feature, and vote for the ones you want. The most-voted ideas get looked at first. You need a Chalk Chat account to post or vote.</p>
  </header>

  <!-- signed out -->
  <section class="box" id="signin" hidden>
    <h3>Sign in with your Chalk Chat account</h3>
    <div class="row">
      <input class="field" id="u" maxlength="20" placeholder="Username" autocomplete="username">
      <input class="field" id="p" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn primary" id="login" type="button">Log in</button>
      <button class="btn" id="register" type="button">Register</button>
    </div>
    <p class="msg" id="signin-msg"></p>
  </section>

  <!-- signed in -->
  <section class="box" id="suggest" hidden>
    <h3>Suggest something</h3>
    <form id="suggest-form" autocomplete="off">
      <div class="row">
        <input class="field" id="title" maxlength="60" placeholder="What is it? e.g. Slope, Cookie Clicker, dark mode" required>
        <select class="field" id="kind" aria-label="Type">
          <option value="game">Game</option>
          <option value="feature">Feature</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="row" style="margin-top:0.6rem">
        <input class="field" id="reason" maxlength="140" placeholder="Why? (optional)">
        <button class="btn primary" type="submit">Post it</button>
      </div>
    </form>
    <p class="msg" id="suggest-msg"></p>
    <p class="small">Signed in as <b id="me-name">—</b>. <button class="btn" id="sign-out" type="button" style="padding:0.1rem 0.5rem;font-size:0.8rem">Sign out</button></p>
  </section>

  <div class="tabs" id="tabs" role="tablist">
    <button type="button" data-view="top" class="on">Top</button>
    <button type="button" data-view="new">New</button>
    <button type="button" data-view="planned">Planned</button>
    <button type="button" data-view="added">Added</button>
  </div>

  <div class="list" id="list"><p class="empty">Loading…</p></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// same project as Chalk Chat, so the same accounts (and the same sign-in) work here
const SUPABASE_URL = 'https://ifyhdysaugcivmvltuyb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CBXtSVX-0r8a0GGV9B4znA_8JXfxaOD';
const MAIL_DOMAIN = 'users.chalkbored.win';
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const state = { me: null, view: 'top', rows: [], mine: new Set() };

// ---- theme: from the address first, then live updates from the notebook ----
function applyLook(theme) {
  document.body.dataset.theme = ['notebook', 'chalkboard', 'terminal', 'night'].includes(theme) ? theme : 'notebook';
}
const q = new URLSearchParams(location.search);
applyLook(q.get('theme'));
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'look') return;
  applyLook(e.data.theme);
});

// ---- signing in (same trick as the chat: usernames become hidden emails) ----
async function signIn(mode) {
  const username = $('u').value.trim();
  const password = $('p').value;
  const msg = $('signin-msg');
  msg.textContent = '';
  if (!/^[A-Za-z0-9_.-]{2,20}$/.test(username)) { msg.textContent = 'Usernames: 2–20 characters, letters, numbers, _ . - only.'; return; }
  if (password.length < 6) { msg.textContent = 'Passwords need at least 6 characters.'; return; }

  const email = username.toLowerCase() + '@' + MAIL_DOMAIN;
  const res = mode === 'register'
    ? await db.auth.signUp({ email, password, options: { data: { username } } })
    : await db.auth.signInWithPassword({ email, password });
  if (res.error) {
    msg.textContent = res.error.message.includes('already registered') ? 'That name already has an account — use Log in.'
      : res.error.message.includes('Invalid login') ? 'Wrong name or password.' : res.error.message;
    return;
  }
  await start();
}
$('login').onclick = () => signIn('login');
$('register').onclick = () => signIn('register');
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn('login'); });
$('sign-out').onclick = async () => { await db.auth.signOut(); location.reload(); };

// ---- posting ----
$('suggest-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('suggest-msg');
  msg.className = 'msg';
  const { data: why, error } = await db.rpc('submit_request', {
    p_title: $('title').value, p_reason: $('reason').value, p_kind: $('kind').value,
  });
  if (error || why) {
    msg.textContent = error ? (error.message.includes('submit_request') ? 'Requests aren’t set up yet. Run SCRIPTS/requests.sql in Supabase.' : error.message) : why;
    return;
  }
  msg.className = 'msg ok';
  msg.textContent = 'Posted. Your vote is already on it.';
  $('title').value = '';
  $('reason').value = '';
  await load();
});

// ---- the list ----
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-view]');
  if (!b) return;
  state.view = b.dataset.view;
  document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
  paint();
});

async function load() {
  const [{ data, error }, votes] = await Promise.all([
    db.from('requests')
      .select('id, user_id, title, reason, kind, status, hidden, votes, created_at, profiles(username)')
      .order('votes', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(200),
    db.from('request_votes').select('request_id').eq('user_id', state.me.id),
  ]);
  if (error) {
    $('list').innerHTML = '<p class="empty"></p>';
    $('list').firstChild.textContent = /requests|schema/.test(error.message)
      ? 'Requests aren’t set up yet. Run SCRIPTS/requests.sql in Supabase.' : error.message;
    return;
  }
  state.rows = data || [];
  state.mine = new Set((votes.data || []).map((v) => v.request_id));
  paint();
}

function paint() {
  let rows = state.rows.slice();
  if (state.view === 'top') rows = rows.filter((r) => r.status === 'open' || r.status === 'planned');
  if (state.view === 'new') rows = rows.filter((r) => r.status === 'open').sort((a, b) => b.created_at.localeCompare(a.created_at));
  if (state.view === 'planned') rows = rows.filter((r) => r.status === 'planned');
  if (state.view === 'added') rows = rows.filter((r) => r.status === 'added');

  const list = $('list');
  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<p class="empty"></p>';
    list.firstChild.textContent = state.view === 'added' ? 'Nothing added from here yet.'
      : state.view === 'planned' ? 'Nothing planned yet.' : 'No suggestions yet. Be the first.';
    return;
  }

  rows.forEach((r) => {
    const item = document.createElement('div');
    item.className = 'req' + (r.hidden ? ' is-hidden' : '');

    const vote = document.createElement('button');
    vote.type = 'button';
    vote.className = 'vote' + (state.mine.has(r.id) ? ' on' : '');
    vote.setAttribute('aria-pressed', String(state.mine.has(r.id)));
    vote.setAttribute('aria-label', (state.mine.has(r.id) ? 'Remove your vote for ' : 'Vote for ') + r.title);
    vote.innerHTML = '<svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg><b></b>';
    vote.querySelector('b').textContent = r.votes;
    vote.disabled = r.status === 'added' || r.status === 'declined';
    vote.onclick = async () => {
      const { data: n, error } = await db.rpc('toggle_request_vote', { p_request: r.id });
      if (error || n < 0) return;
      if (state.mine.has(r.id)) state.mine.delete(r.id); else state.mine.add(r.id);
      r.votes = n;
      paint();
    };

    const body = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'req-title';
    title.textContent = r.title;
    body.appendChild(title);
    if (r.reason) {
      const reason = document.createElement('p');
      reason.className = 'req-reason';
      reason.textContent = r.reason;
      body.appendChild(reason);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const kind = document.createElement('span');
    kind.className = 'chip';
    kind.textContent = r.kind;
    meta.appendChild(kind);
    if (r.status !== 'open') {
      const st = document.createElement('span');
      st.className = 'chip ' + r.status;
      st.textContent = r.status;
      meta.appendChild(st);
    }
    const who = document.createElement('span');
    who.textContent = 'by ' + (!r.user_id ? 'ChalkBored' : (r.profiles && r.profiles.username) || 'someone');
    meta.appendChild(who);
    if (r.hidden) {
      const h = document.createElement('span');
      h.textContent = 'hidden';
      meta.appendChild(h);
    }

    // site mods get controls
    if (state.me.is_mod) {
      const mod = document.createElement('span');
      mod.className = 'mod';
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', 'Status');
      ['open', 'planned', 'added', 'declined'].forEach((s) => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s; o.selected = s === r.status;
        sel.appendChild(o);
      });
      sel.onchange = async () => { await db.rpc('set_request_status', { p_request: r.id, p_status: sel.value, p_hidden: null }); load(); };
      const hide = document.createElement('button');
      hide.type = 'button';
      hide.textContent = r.hidden ? 'unhide' : 'hide';
      hide.onclick = async () => { await db.rpc('set_request_status', { p_request: r.id, p_status: null, p_hidden: !r.hidden }); load(); };
      mod.append(sel, hide);
      meta.appendChild(mod);
    }

    body.appendChild(meta);
    item.append(vote, body);
    list.appendChild(item);
  });
}

// ---- go ----
async function start() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    $('signin').hidden = false;
    $('suggest').hidden = true;
    $('list').innerHTML = '<p class="empty">Sign in to see and vote on suggestions.</p>';
    return;
  }
  const { data: me } = await db.from('profiles').select('id, username, is_mod, banned').eq('id', user.id).maybeSingle();
  if (!me) {
    $('signin').hidden = false;
    $('signin-msg').textContent = 'Signed in, but this account has no profile yet.';
    return;
  }
  state.me = me;
  $('signin').hidden = true;
  $('suggest').hidden = !!me.banned;
  $('me-name').textContent = me.username;
  await load();

  // new suggestions and vote counts show up live
  db.channel('requests')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => load())
    .subscribe();
}

start();
</script>
</body>
</html>
