<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids — ChalkBored</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #171717;
    --muted: #8a8580;
    --line: #d9d5cf;
    --accent: #3d4f4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 2rem 1.75rem 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .back-link {
    display: inline-block;
    font-size: 0.9rem;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .back-link:hover { color: var(--ink); border-color: var(--ink); }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 5rem 1.75rem 8rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    line-height: 1.15;
    margin: 0 0 1.75rem;
  }
  .rule {
    width: 48px;
    height: 1px;
    background: var(--accent);
    margin-bottom: 2.5rem;
  }
  p {
    font-size: clamp(1.05rem, 1.6vw, 1.2rem);
    line-height: 1.75;
    color: #3a3a3a;
    max-width: 62ch;
    margin: 0 0 1.25rem;
  }
  .play-frame {
    margin-top: 2.5rem;
    border: 1px solid var(--line);
    aspect-ratio: 16 / 9;
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--panel, #fff);
  }
  .play-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }
  .play-btn {
    padding: 0.9rem 1.8rem;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-family: 'Source Serif 4', serif;
    font-size: 1.05rem;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .play-btn:hover {
    background: #fff;
    color: var(--ink);
  }
  footer {
    text-align: center;
    padding: 2.5rem 1.5rem 3rem;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    margin: 0 1.75rem;
  }
</style>
</head>
<body>
  <header>
    <a class="back-link" href="resources.html">&larr; Back to Resources</a>
  </header>
  <main>
    <div class="rule"></div>
    <h1>Boids</h1>
    <p>A flocking simulation — simple rules for individual movement that produce realistic group behavior, like birds or fish moving together.</p>
    <div class="play-frame" id="play-frame">
      <button class="play-btn" id="play-btn">Load Simulation</button>
      <iframe id="boids-frame" src="" title="Boids simulation"></iframe>
    </div>
  </main>
  <footer>
    ChalkBored &middot; built for students, kept free
  </footer>

  <script>
    // Lazy-load: the simulation file only loads once the button is clicked,
    // not when this page loads. Change the src below to match your actual filename.
    document.getElementById('play-btn').addEventListener('click', function () {
      var frame = document.getElementById('boids-frame');
      frame.src = 'boids.html';
      frame.style.display = 'block';
      this.style.display = 'none';
    });
  </script>
</body>
</html>
