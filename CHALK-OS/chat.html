<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalk Chat</title>
<style>
  /* CHALK OS's own colours. Inside CHALK OS the desktop sends its current
     palette - light or dark, and your accent - and these are replaced. */
  :root {
    --bg: #f6f6f6;
    --panel: #ffffff;
    --panel-2: #f0f0f0;
    --panel-3: #e4e4e4;
    --ink: #2b2b2b;
    --muted: #767676;
    --line: #dedede;
    --accent: #8bae5a;
    --accent-fg: #ffffff;
    --mine: #8bae5a22;
    --danger: #c9534b;
    --shadow: 0 12px 34px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a2a2a; --panel: #323232; --panel-2: #3a3a3a; --panel-3: #454545;
      --ink: #e6e6e6; --muted: #a2a2a2; --line: #454545; --mine: #8bae5a33;
      --shadow: 0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a2a2a; --panel: #323232; --panel-2: #3a3a3a; --panel-3: #454545;
    --ink: #e6e6e6; --muted: #a2a2a2; --line: #454545; --mine: #8bae5a33;
    --shadow: 0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: 210px 1fr; height: 100%; }

  /* ---------------- the side: rooms, channels, you ---------------- */
  .rail {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel-2); border-right: 1px solid var(--line); overflow-y: auto;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; padding: 14px 14px 6px;
    font-weight: 600; font-size: 14px;
  }
  .brand .g { font-size: 17px; }
  .rail-section { padding: 10px 8px 6px; }
  .rail-head {
    display: flex; align-items: center; justify-content: space-between; padding: 0 6px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .mini {
    height: 22px; padding: 0 8px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--muted); font-size: 11.5px; cursor: pointer;
  }
  .mini:hover, .mini:focus-visible { color: var(--ink); border-color: var(--accent); outline: none; }
  .mini.danger:hover { color: var(--danger); border-color: var(--danger); }

  .list { display: flex; flex-direction: column; gap: 1px; }
  .item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px;
    border: 0; border-radius: 7px; background: none; color: var(--ink);
    font-size: 13px; text-align: left; cursor: pointer;
  }
  .item .g { width: 16px; text-align: center; color: var(--muted); flex: 0 0 auto; }
  .item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item:hover, .item:focus-visible { background: var(--panel-3); outline: none; }
  .item.on { background: var(--accent); color: var(--accent-fg); }
  .item.on .g, .item.on .lock { color: var(--accent-fg); }
  .item .lock { font-size: 11px; color: var(--muted); }
  .item .x {
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    opacity: 0; font-size: 12px;
  }
  .item:hover .x { opacity: .75; }
  .item .x:hover { opacity: 1; background: var(--danger); color: #fff; }

  .rail-foot {
    margin-top: auto; padding: 12px 14px 14px; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: var(--muted);
  }
  .me { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 12px;
  }
  .me b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent-fg); background: var(--accent); border-radius: 999px; padding: 1px 7px;
  }
  .link {
    background: none; border: 0; padding: 0; color: var(--muted); font-size: 12px;
    text-align: left; cursor: pointer;
  }
  .link:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------------- the conversation ---------------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header h1 .dim { color: var(--muted); font-weight: 400; }
  header .spacer { margin-left: auto; }
  .menu-btn { display: none; }
  .presence { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  #messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; gap: 8px; max-width: min(78%, 62ch); align-items: flex-end; }
  .row .avatar { width: 28px; height: 28px; font-size: 12px; background: var(--panel-3); color: var(--ink); }
  .row .col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .row.mine .col { align-items: flex-end; }
  .row.mine .avatar { display: none; }
  .row.cont .avatar { visibility: hidden; }
  .row.cont .meta { display: none; }
  .meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; padding: 0 4px; }
  .meta .who { color: var(--ink); font-weight: 600; }
  .bubble {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px;
    padding: 7px 11px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .row.mine .bubble {
    background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
    border-radius: 14px 14px 4px 14px;
  }
  .kill {
    background: none; border: 0; color: var(--muted); font-size: 11px; cursor: pointer;
    opacity: 0; padding: 0;
  }
  .row:hover .kill { opacity: 1; }
  .kill:hover { color: var(--danger); }
  .day {
    align-self: center; font-size: 11px; color: var(--muted); padding: 2px 10px;
    border-radius: 999px; background: var(--panel-2);
  }
  .empty { margin: auto; color: var(--muted); text-align: center; line-height: 1.7; max-width: 300px; }
  .empty .g { display: block; font-size: 34px; margin-bottom: 6px; }

  form {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel);
  }
  .field {
    width: 100%; height: 32px; padding: 0 12px; background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .field:disabled { color: var(--muted); }
  #text { flex: 1; height: 34px; border-radius: 999px; padding: 0 16px; }

  .btn {
    height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--panel-3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  #send { height: 34px; border-radius: 999px; }

  /* ---------------- signing in ---------------- */
  .gate {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: safe center; padding: 24px;
    background: var(--bg); overflow: auto;
  }
  .gate.hide { display: none; }
  .gate-box {
    width: min(340px, 100%); padding: 26px 24px 20px; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .gate-box .logo { font-size: 36px; }
  .gate h2 { margin: 6px 0 6px; font-size: 18px; font-weight: 600; }
  .gate p { margin: 0 0 16px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .gate .field { margin-bottom: 8px; text-align: center; height: 34px; }
  .gate-row { display: flex; gap: 8px; margin-top: 6px; }
  .gate-row .btn { flex: 1; }
  .err { min-height: 18px; margin: 10px 0 0; font-size: 12px; color: var(--danger); }

  /* ---------------- the little dialog ---------------- */
  .veil {
    position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; padding: 24px;
    background: rgba(0, 0, 0, .28);
  }
  .veil.hide { display: none; }
  .card {
    width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; animation: pop .12s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .card-b { padding: 14px 16px 12px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .card p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.55; color: var(--muted); white-space: pre-wrap; }
  .card .field { margin-bottom: 8px; }
  .card label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; cursor: pointer; }
  .card .err { margin: 0; min-height: 0; }
  .card-f {
    display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px;
    background: var(--panel-2); border-top: 1px solid var(--line);
  }
  .card-f .btn { height: 28px; padding: 0 14px; border-radius: 6px; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* ---------------- a narrow window: the side slides over ---------------- */
  .scrim { display: none; }
  @media (max-width: 600px) {
    .app { grid-template-columns: 1fr; }
    .rail {
      position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 4;
      transform: translateX(-102%); transition: transform .22s cubic-bezier(.2,.8,.3,1);
      box-shadow: var(--shadow);
    }
    body.drawer .rail { transform: none; }
    body.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 3; background: rgba(0,0,0,.25); }
    .menu-btn { display: inline-grid; place-items: center; width: 30px; padding: 0; }
    .row { max-width: 88%; }
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail">
    <div class="brand"><span class="g">&#128172;</span><span id="brand-name">Chalk Chat</span></div>

    <div class="rail-section">
      <div class="rail-head"><span>Rooms</span><button class="mini" id="new-room" type="button">+ Room</button></div>
      <div class="list" id="rooms"></div>
    </div>

    <div class="rail-section">
      <div class="rail-head"><span>Channels</span><button class="mini" id="new-channel" type="button" hidden>+ Channel</button></div>
      <div class="list" id="channels"></div>
    </div>

    <div class="rail-foot">
      <span class="me"><span class="avatar" id="me-avatar">?</span><b id="me-name">&mdash;</b><span class="tag" id="me-tag" hidden>mod</span></span>
      <button class="link" id="become-mod" type="button">Moderator login</button>
      <button class="link" id="mod-tools" type="button" hidden>Ban or unban someone</button>
      <button class="link" id="room-mods" type="button" hidden>Room moderators</button>
      <button class="link" id="sign-out" type="button">Sign out</button>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header>
      <button class="btn menu-btn" id="menu-btn" type="button" title="Rooms and channels">&#9776;</button>
      <h1><span id="room-name">&mdash;</span><span class="dim" id="channel-name"></span></h1>
      <span class="spacer"></span>
      <span class="presence"><span class="dot"></span><span id="online">&mdash;</span></span>
      <button class="mini danger" id="delete-room" type="button" hidden>Delete room</button>
    </header>

    <div id="messages"></div>

    <form id="composer" autocomplete="off">
      <input class="field" id="text" maxlength="500" placeholder="Message" disabled>
      <button class="btn primary" id="send" type="submit" disabled>Send</button>
    </form>
  </div>
</div>

<div class="gate hide" id="gate">
  <div class="gate-box">
    <div class="logo">&#128172;</div>
    <h2 id="gate-title">Chalk Chat</h2>
    <p>Pick a name and a password. No email and nothing to verify - the password is hashed on the server and never leaves your browser in the clear.</p>
    <input class="field" id="u" maxlength="20" placeholder="Username" autocomplete="username" spellcheck="false">
    <input class="field" id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="gate-row">
      <button class="btn" id="register" type="button">Register</button>
      <button class="btn primary" id="login" type="button">Log in</button>
    </div>
    <p class="err" id="gate-err"></p>
  </div>
</div>

<div class="veil hide" id="veil">
  <div class="card">
    <div class="card-b">
      <h3 id="ask-title"></h3>
      <p id="ask-text"></p>
      <label id="ask-check-wrap" hidden><input type="checkbox" id="ask-check"> <span id="ask-check-label"></span></label>
      <input class="field" id="ask-1" autocomplete="off" spellcheck="false">
      <input class="field" id="ask-2" autocomplete="off" hidden>
      <p class="err" id="ask-err"></p>
    </div>
    <div class="card-f">
      <button class="btn" id="ask-cancel" type="button">Cancel</button>
      <button class="btn primary" id="ask-ok" type="button">OK</button>
    </div>
  </div>
</div>

<script>
/* Inside CHALK OS the desktop sends its palette, so the chat is always in the
   desktop's colours - light or dark, and whichever accent you picked. */
(function () {
  var map = { bg: '--bg', panel: '--panel', panel2: '--panel-2', panel3: '--panel-3', border: '--line',
              accent: '--accent', accentInk: '--accent-fg', text: '--ink', muted: '--muted', mine: '--mine', danger: '--danger' };
  addEventListener('message', function (e) {
    var t = e.data && e.data.boxtheme;
    if (!t || typeof t !== 'object') return;
    var root = document.documentElement;
    for (var k in map) if (typeof t[k] === 'string' && t[k]) root.style.setProperty(map[k], t[k]);
    if (t.mode) root.dataset.theme = t.mode === 'dark' ? 'dark' : 'light';
    if (t.brand) {
      var name = t.brand === 'sea' ? 'SEA Chat' : 'Chalk Chat';
      document.getElementById('brand-name').textContent = name;
      document.getElementById('gate-title').textContent = name;
      document.title = name;
    }
  });
})();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ------------------------------------------------------------------ setup
   The project's two public values. Both are safe in a public repo: the
   publishable key only lets people do what the database rules allow. */
const SUPABASE_URL = 'https://ifyhdysaugcivmvltuyb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CBXtSVX-0r8a0GGV9B4znA_8JXfxaOD';

// usernames become addresses behind the scenes, so nobody has to give an email
const MAIL_DOMAIN = 'users.chalkbored.win';

const CONFIGURED = !SUPABASE_URL.startsWith('PASTE') && !SUPABASE_ANON_KEY.startsWith('PASTE');
const db = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = (id) => document.getElementById(id);
const state = { me: null, rooms: [], room: null, channels: [], channel: null, membership: {}, presence: null, feed: null, structure: null, names: {} };
const inDesktop = window.parent !== window;

// ------------------------------------------------------------------ the dialog
/* One card for questions, notices and "are you sure", in place of the
   browser's own grey boxes. */
function ask({ title, text, placeholder, second, check, ok, cancel, danger, fields = true }) {
  return new Promise((resolve) => {
    $('ask-title').textContent = title;
    $('ask-text').textContent = text || '';
    $('ask-text').hidden = !text;
    $('ask-err').textContent = '';
    const one = $('ask-1'), two = $('ask-2');
    one.hidden = !fields || placeholder == null;
    one.value = '';
    one.placeholder = placeholder || '';
    one.type = (placeholder || '').toLowerCase().includes('password') ? 'password' : 'text';
    two.value = '';
    two.hidden = !second;
    if (second) { two.placeholder = second; two.type = 'password'; }
    $('ask-check-wrap').hidden = !check;
    $('ask-check').checked = false;
    if (check) $('ask-check-label').textContent = check;
    $('ask-ok').textContent = ok || 'OK';
    $('ask-ok').className = 'btn ' + (danger ? 'danger' : 'primary');
    $('ask-cancel').hidden = cancel === false;
    $('ask-cancel').textContent = cancel || 'Cancel';
    $('veil').classList.remove('hide');
    setTimeout(() => (one.hidden ? $('ask-ok') : one).focus(), 0);

    const done = (value) => {
      $('veil').classList.add('hide');
      $('ask-ok').onclick = $('ask-cancel').onclick = null;
      document.removeEventListener('keydown', onKey, true);
      resolve(value);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
      else if (e.key === 'Enter') { e.preventDefault(); $('ask-ok').click(); }
    };
    document.addEventListener('keydown', onKey, true);
    $('ask-ok').onclick = () => done({ one: one.value.trim(), two: two.value, checked: $('ask-check').checked });
    $('ask-cancel').onclick = () => done(null);
  });
}
const tell = (title, text) => ask({ title, text, cancel: false, fields: false });
const sure = (title, text, ok) => ask({ title, text, ok, danger: true, fields: false }).then(Boolean);

// ------------------------------------------------------------------ signing in
async function signIn(mode) {
  const username = $('u').value.trim();
  const password = $('p').value;
  const err = $('gate-err');
  err.textContent = '';

  if (!/^[A-Za-z0-9_.-]{2,20}$/.test(username)) {
    err.textContent = 'Usernames are 2 to 20 letters, numbers, _ . or -.';
    return;
  }
  if (password.length < 6) { err.textContent = 'Passwords need at least 6 characters.'; return; }

  $('login').disabled = $('register').disabled = true;
  const email = username.toLowerCase() + '@' + MAIL_DOMAIN;
  const res = mode === 'register'
    ? await db.auth.signUp({ email, password, options: { data: { username } } })
    : await db.auth.signInWithPassword({ email, password });
  $('login').disabled = $('register').disabled = false;

  if (res.error) {
    err.textContent = res.error.message.includes('already registered')
      ? 'That name already has an account - use Log in.'
      : res.error.message.includes('Invalid login')
        ? 'Wrong name or password.'
        : res.error.message;
    return;
  }
  await start();
}

$('login').onclick = () => signIn('login');
$('register').onclick = () => signIn('register');
$('u').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('p').focus(); });
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn('login'); });

$('sign-out').onclick = async () => {
  if (!(await sure('Sign out', 'You can sign back in with the same name and password.', 'Sign out'))) return;
  await db.auth.signOut();
  location.reload();
};

// the side, as a drawer in a narrow window
const drawer = (on) => document.body.classList.toggle('drawer', on);
$('menu-btn').onclick = () => drawer(!document.body.classList.contains('drawer'));
$('scrim').onclick = () => drawer(false);

// ------------------------------------------------------------------ rooms
async function loadRooms() {
  const [{ data: rooms }, { data: mine }] = await Promise.all([
    db.from('rooms').select('id, name, is_private, is_global, owner_id').order('is_global', { ascending: false }).order('name'),
    db.from('room_members').select('room_id, role').eq('user_id', state.me.id),
  ]);

  state.rooms = rooms || [];
  state.membership = {};
  (mine || []).forEach((m) => { state.membership[m.room_id] = m.role; });
  if (state.room && !state.rooms.some((r) => r.id === state.room.id)) state.room = null;
  paintRooms();

  if (!state.room && state.rooms.length) {
    const first = state.rooms.find((r) => r.is_global) || state.rooms[0];
    openRoom(first);
  }
}

function item(icon, name, on) {
  const btn = document.createElement('button');
  btn.className = 'item' + (on ? ' on' : '');
  btn.type = 'button';
  const g = document.createElement('span');
  g.className = 'g';
  g.textContent = icon;
  const n = document.createElement('span');
  n.className = 'n';
  n.textContent = name;
  btn.append(g, n);
  return btn;
}

function paintRooms() {
  const wrap = $('rooms');
  wrap.innerHTML = '';
  state.rooms.forEach((room) => {
    const joined = !!state.membership[room.id];
    const btn = item(room.is_global ? '\u{1F310}' : room.is_private ? '\u{1F512}' : '\u{1F4AC}', room.name,
                     state.room && state.room.id === room.id);
    if (room.is_private && !joined && !state.me.is_mod) {
      const lock = document.createElement('span');
      lock.className = 'lock';
      lock.textContent = 'locked';
      btn.appendChild(lock);
    }
    btn.onclick = () => { drawer(false); openRoom(room); };
    wrap.appendChild(btn);
  });
}

async function openRoom(room) {
  const joined = !!state.membership[room.id];

  if (!joined) {
    let password = null;
    if (room.is_private && !state.me.is_mod) {
      const answer = await ask({ title: room.name, text: 'This room is private.', placeholder: 'Room password', ok: 'Join' });
      if (!answer) return;
      password = answer.one;
    }
    const { data: ok, error } = await db.rpc('join_room', { p_room: room.id, p_password: password });
    if (error) return tell('Could not join', error.message);
    if (!ok) return tell('Wrong password', 'That is not the password for ' + room.name + '.');
    state.membership[room.id] = 'member';
  }

  state.room = room;
  state.channel = null;
  $('room-name').textContent = room.name;
  $('delete-room').hidden = !(state.me.is_mod || room.owner_id === state.me.id) || room.is_global;
  $('room-mods').hidden = !(state.me.is_mod || state.membership[room.id] === 'owner');
  $('new-channel').hidden = !canAddChannel(room);
  paintRooms();
  await loadChannels();
  watchPresence();
}

function canAddChannel(room) {
  if (state.me.is_mod) return true;
  if (room.is_global) return false;
  return ['owner', 'mod'].includes(state.membership[room.id]);
}

function canManage(room) {
  return state.me.is_mod || ['owner', 'mod'].includes(state.membership[room.id]);
}

$('new-room').onclick = async () => {
  const answer = await ask({
    title: 'New room',
    text: state.me.is_mod
      ? 'Leave the password blank for a public room.'
      : 'Anyone with the password can join. You get one private room.',
    placeholder: 'Room name',
    second: 'Room password',
    ok: 'Create',
  });
  if (!answer || !answer.one) return;

  const isPrivate = !!answer.two || !state.me.is_mod;
  const { error } = await db.rpc('create_room', { p_name: answer.one, p_private: isPrivate, p_password: answer.two || null });
  if (error) return tell('Could not make the room', error.message);
  await loadRooms();
};

$('delete-room').onclick = async () => {
  if (!state.room) return;
  if (!(await sure('Delete ' + state.room.name, 'Every channel and message in it goes too. This cannot be undone.', 'Delete'))) return;
  const { error } = await db.from('rooms').delete().eq('id', state.room.id);
  if (error) return tell('Could not delete it', error.message);
  state.room = null;
  await loadRooms();
};

$('room-mods').onclick = async () => {
  const answer = await ask({
    title: 'Room moderators',
    text: 'A room mod can add and delete channels here, and delete anyone’s messages in this room.',
    placeholder: 'Username',
    check: 'Remove instead (back to member)',
  });
  if (!answer || !answer.one) return;
  const { error } = await db.rpc('set_room_role', {
    p_room: state.room.id, p_username: answer.one, p_role: answer.checked ? 'member' : 'mod',
  });
  tell('Room moderators', error ? error.message : (answer.checked ? answer.one + ' is a member again.' : answer.one + ' is now a room mod.'));
};

// ------------------------------------------------------------------ channels
async function loadChannels() {
  const { data } = await db.from('channels').select('id, name, room_id').eq('room_id', state.room.id).order('created_at');
  state.channels = data || [];
  const still = state.channel && state.channels.find((c) => c.id === state.channel.id);
  paintChannels();
  if (still) return;
  if (state.channels.length) openChannel(state.channels[0]);
  else { state.channel = null; $('channel-name').textContent = ''; renderEmpty('\u{1F4ED}', 'No channels in this room yet.'); lockComposer(true); }
}

function paintChannels() {
  const wrap = $('channels');
  wrap.innerHTML = '';
  state.channels.forEach((ch) => {
    const btn = item('#', ch.name, state.channel && state.channel.id === ch.id);
    btn.onclick = () => { drawer(false); openChannel(ch); };
    if (canManage(state.room)) {
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '×';
      x.title = 'Delete channel';
      x.onclick = async (e) => {
        e.stopPropagation();
        if (!(await sure('Delete #' + ch.name, 'Its messages go with it.', 'Delete'))) return;
        const { error } = await db.from('channels').delete().eq('id', ch.id);
        if (error) tell('Could not delete it', error.message); else loadChannels();
      };
      btn.appendChild(x);
    }
    wrap.appendChild(btn);
  });
}

$('new-channel').onclick = async () => {
  const answer = await ask({ title: 'New channel', text: 'In ' + state.room.name + '.', placeholder: 'Channel name', ok: 'Create' });
  if (!answer || !answer.one) return;
  const { error } = await db.from('channels').insert({ room_id: state.room.id, name: answer.one, created_by: state.me.id });
  if (error) return tell('Could not make the channel', error.message);
  loadChannels();
};

// ------------------------------------------------------------------ messages
let last = null;   /* the message above, so one person's run of messages sits together */

async function openChannel(ch) {
  state.channel = ch;
  $('channel-name').textContent = '  ›  # ' + ch.name;
  paintChannels();
  lockComposer(!!state.me.banned);

  const { data } = await db
    .from('messages')
    .select('id, body, created_at, user_id, profiles(username)')
    .eq('channel_id', ch.id)
    .order('id', { ascending: false })
    .limit(80);

  if (state.channel !== ch) return;       /* another channel was picked while this loaded */
  const rows = (data || []).reverse();
  $('messages').innerHTML = '';
  last = null;
  if (!rows.length) renderEmpty('\u{1F44B}', 'Nothing here yet. Say something.');
  rows.forEach(addMessage);
  scrollDown();
  watchFeed();
  if (!state.me.banned) $('text').focus();
}

function renderEmpty(icon, text) {
  const p = document.createElement('p');
  p.className = 'empty';
  const g = document.createElement('span');
  g.className = 'g';
  g.textContent = icon;
  p.append(g, document.createTextNode(text));
  $('messages').innerHTML = '';
  $('messages').appendChild(p);
  last = null;
}

const initial = (name) => (String(name || '?').trim().charAt(0) || '?').toUpperCase();
const dayOf = (d) => d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

function addMessage(m) {
  const empty = $('messages').querySelector('.empty');
  if (empty) empty.remove();

  const mine = m.user_id === state.me.id;
  const name = (m.profiles && m.profiles.username) || (mine ? state.me.username : 'someone');
  const at = new Date(m.created_at);

  if (!last || dayOf(last.at) !== dayOf(at)) {
    const day = document.createElement('div');
    day.className = 'day';
    day.textContent = dayOf(at) === dayOf(new Date()) ? 'Today' : dayOf(at);
    $('messages').appendChild(day);
    last = null;
  }
  const cont = last && last.user === m.user_id && at - last.at < 5 * 60000;

  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' mine' : '') + (cont ? ' cont' : '');
  row.dataset.id = m.id;

  const av = document.createElement('span');
  av.className = 'avatar';
  av.textContent = initial(name);

  const col = document.createElement('div');
  col.className = 'col';
  const meta = document.createElement('div');
  meta.className = 'meta';
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = mine ? 'You' : name;
  const when = document.createElement('span');
  when.textContent = at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  meta.append(who, when);

  if (mine || canManage(state.room)) {
    const kill = document.createElement('button');
    kill.className = 'kill';
    kill.type = 'button';
    kill.textContent = 'Delete';
    kill.onclick = async () => {
      const { error } = await db.from('messages').delete().eq('id', m.id);
      if (error) tell('Could not delete it', error.message);
    };
    meta.appendChild(kill);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = m.body;
  bubble.title = at.toLocaleString();

  col.append(meta, bubble);
  row.append(av, col);
  $('messages').appendChild(row);
  last = { user: m.user_id, at };
}

function scrollDown() { $('messages').scrollTop = $('messages').scrollHeight; }
const nearBottom = () => { const b = $('messages'); return b.scrollHeight - b.scrollTop - b.clientHeight < 120; };

function lockComposer(locked) {
  $('text').disabled = locked;
  $('send').disabled = locked;
  $('text').placeholder = state.me && state.me.banned ? 'Your account is banned' : locked ? 'No channel open' : 'Message #' + (state.channel ? state.channel.name : '');
}

$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = $('text').value.trim();
  if (!body || !state.channel) return;
  $('text').value = '';
  const { error } = await db.from('messages').insert({ channel_id: state.channel.id, user_id: state.me.id, body });
  if (error) { tell('Not sent', error.message); $('text').value = body; }
});

async function nameOf(id) {
  if (state.names[id]) return state.names[id];
  const { data } = await db.from('profiles').select('username').eq('id', id).single();
  return (state.names[id] = (data && data.username) || 'someone');
}

// live messages for the open channel
function watchFeed() {
  if (state.feed) db.removeChannel(state.feed);
  const ch = state.channel;
  state.feed = db
    .channel('feed:' + ch.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: 'channel_id=eq.' + ch.id },
      async ({ new: row }) => {
        const mine = row.user_id === state.me.id;
        const username = mine ? state.me.username : await nameOf(row.user_id);
        const stay = mine || nearBottom();
        addMessage({ ...row, profiles: { username } });
        if (stay) scrollDown();
        /* CHALK OS counts it on the Dock and shows a notification when the chat is not in front */
        if (!mine && inDesktop) {
          window.parent.postMessage({ boxchat: 'message', from: username, channel: ch.name, text: row.body }, '*');
        }
      })
    .on('postgres_changes',
      { event: 'DELETE', schema: 'public', table: 'messages' },
      ({ old: row }) => {
        const el = $('messages').querySelector('[data-id="' + row.id + '"]');
        if (!el) return;
        /* the next message keeps its name if it was riding on this one's */
        const next = el.nextElementSibling;
        if (next && next.classList.contains('cont') && !el.classList.contains('cont')) next.classList.remove('cont');
        el.remove();
      })
    .subscribe();
}

// who's in the room
function watchPresence() {
  if (state.presence) db.removeChannel(state.presence);
  state.presence = db.channel('who:' + state.room.id, { config: { presence: { key: state.me.id } } });
  state.presence
    .on('presence', { event: 'sync' }, () => {
      const count = Object.keys(state.presence.presenceState()).length;
      $('online').textContent = count + ' here';
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await state.presence.track({ username: state.me.username });
    });
}

// ------------------------------------------------------------------ moderator
$('become-mod').onclick = async () => {
  const answer = await ask({ title: 'Moderator login', text: 'Type the moderator password.', placeholder: 'Password', ok: 'Log in' });
  if (!answer || !answer.one) return;
  const { data: ok, error } = await db.rpc('claim_mod', { p_password: answer.one });
  if (error) return tell('Moderator login', error.message);
  if (!ok) return tell('Moderator login', 'Wrong password.');
  state.me.is_mod = true;
  paintMe();
  await loadRooms();
};

$('mod-tools').onclick = async () => {
  const answer = await ask({
    title: 'Ban someone',
    text: 'A banned account cannot post anywhere.',
    placeholder: 'Username',
    check: 'Unban instead',
  });
  if (!answer || !answer.one) return;
  const { error } = await db.rpc('set_banned', { p_username: answer.one, p_banned: !answer.checked });
  tell(answer.checked ? 'Unban' : 'Ban', error ? error.message : answer.one + (answer.checked ? ' is unbanned.' : ' is banned.'));
};

function paintMe() {
  $('me-name').textContent = state.me.username;
  $('me-avatar').textContent = initial(state.me.username);
  $('me-tag').hidden = !state.me.is_mod;
  $('mod-tools').hidden = !state.me.is_mod;
  $('become-mod').hidden = state.me.is_mod;
}

// ------------------------------------------------------------------ go
async function start() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) { $('gate').classList.remove('hide'); $('u').focus(); return; }

  // signed in, but is the database actually set up?
  const { data: me, error } = await db
    .from('profiles').select('id, username, is_mod, banned').eq('id', user.id).maybeSingle();

  if (error) {
    $('gate').classList.remove('hide');
    $('gate-err').textContent = error.message.includes('schema cache')
      ? 'Signed in, but the database tables are missing. Run supabase-schema.sql.'
      : error.message;
    return;
  }
  if (!me) {
    $('gate').classList.remove('hide');
    $('gate-err').textContent = 'Signed in, but this account has no profile yet. Run the backfill SQL.';
    return;
  }

  state.me = me;
  state.names[me.id] = me.username;
  $('gate').classList.add('hide');
  paintMe();

  if (me.banned) {
    renderEmpty('\u{1F6AB}', 'Your account is banned.');
    lockComposer(true);
  }

  await loadRooms();

  // rooms and channels appearing or vanishing for everyone
  if (state.structure) db.removeChannel(state.structure);
  state.structure = db.channel('structure')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadRooms())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'channels' }, () => { if (state.room) loadChannels(); })
    .subscribe();
}

if (!CONFIGURED) {
  $('gate').classList.remove('hide');
  $('gate-err').textContent = 'Not connected yet - paste the project URL and key near the top of this file.';
  $('login').disabled = true;
  $('register').disabled = true;
} else {
  start().catch((err) => {
    $('gate').classList.remove('hide');
    $('gate-err').textContent = 'Could not reach the chat server: ' + (err && err.message || err);
  });
}
</script>
</body>
</html>
