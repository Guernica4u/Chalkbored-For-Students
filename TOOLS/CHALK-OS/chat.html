<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalk Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* The chat follows the theme picked in ChalkBored (Settings -> Look).
     Terminal is the default, and what you get with no ChalkBored settings. */
  :root, body[data-theme="terminal"] {
    --bg: #0c0d10;
    --panel: #101216;
    --panel-2: #171b20;
    --ink: #e8e8e6;
    --muted: #6f7680;
    --line: #23262c;
    --accent: #6ee7a8;
    --accent-dim: #2f6b4f;
    --danger: #e8776d;
    --sel: #12171a;          /* selected room / channel / tab */
    --mine: #13201a;         /* your own messages */
    --btn: #12211a;
    --btn-hover: #16352a;
    --flash: #1b3a2c;        /* message you jumped to */
    --at-bg: rgba(110, 231, 168, 0.15);
    --veil: rgba(5, 6, 8, 0.75);
    --font: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  body[data-theme="notebook"] {
    --bg: #fbfbf7;
    --panel: #f1f2ec;
    --panel-2: #ffffff;
    --ink: #1f2d44;
    --muted: #66708a;
    --line: #d9dde4;
    --accent: #2c5fb8;
    --accent-dim: #9db4de;
    --danger: #c0473a;
    --sel: #e6edf9;
    --mine: #eaf1fd;
    --btn: #e6edf9;
    --btn-hover: #d6e2f6;
    --flash: #fff1a8;
    --at-bg: #ffe680;
    --veil: rgba(31, 45, 68, 0.35);
    --font: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    color-scheme: light;
  }
  body[data-theme="chalkboard"] {
    --bg: #1e2a25;
    --panel: #19231f;
    --panel-2: #26352f;
    --ink: #eef0ea;
    --muted: #9fb0a7;
    --line: #34453d;
    --accent: #f2d479;
    --accent-dim: #8a7a45;
    --danger: #f08c7e;
    --sel: #2c3d35;
    --mine: #2f3a2b;
    --btn: #2f3a2b;
    --btn-hover: #3b4833;
    --flash: #4a4a2a;
    --at-bg: rgba(242, 212, 121, 0.18);
    --veil: rgba(10, 15, 12, 0.7);
    --font: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  body[data-theme="night"] {
    --bg: #16181d;
    --panel: #14161a;
    --panel-2: #1f232a;
    --ink: #d9d5cc;
    --muted: #8b909a;
    --line: #2b3039;
    --accent: #8fb3d9;
    --accent-dim: #4b6480;
    --danger: #d98b7f;
    --sel: #232a34;
    --mine: #1f2a36;
    --btn: #22303f;
    --btn-hover: #2a3a4c;
    --flash: #2e3d50;
    --at-bg: rgba(143, 179, 217, 0.16);
    --veil: rgba(8, 9, 12, 0.7);
    --font: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  /* Inside CHALK OS the desktop sends its palette - light or dark, and your
     accent - and the chat wears it; the colours arrive as variables on body. */
  body[data-theme="desktop"] {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
  }
  /* the readable themes run a touch bigger than the monospace one */
  body[data-theme="notebook"], body[data-theme="chalkboard"], body[data-theme="night"] { font-size: 17px; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: 100%;
  }

  /* ---------------- rail ---------------- */

  .rail {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
  }

  .rail-section { padding: 1rem 0.9rem; border-bottom: 1px solid var(--line); }

  .rail-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.7rem;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .mini {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.7rem;
    padding: 0.15rem 0.4rem;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .mini:hover, .mini:focus-visible { color: var(--accent); border-color: var(--accent-dim); outline: none; }

  .list { display: flex; flex-direction: column; gap: 2px; }

  .item {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    width: 100%;
    padding: 0.45rem 0.55rem;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    text-align: left;
    cursor: pointer;
    transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
  }

  .item:hover, .item:focus-visible { color: var(--ink); background: var(--panel-2); outline: none; }
  .item.on { color: var(--accent); background: var(--sel); border-left-color: var(--accent); }
  .item .lock { margin-left: auto; font-size: 0.66rem; color: var(--muted); }
  .item .x {
    margin-left: auto;
    opacity: 0;
    color: var(--muted);
    font-size: 0.75rem;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .item:hover .x { opacity: 1; }
  .item .x:hover { color: var(--danger); }

  .rail-foot {
    margin-top: auto;
    padding: 0.9rem;
    font-size: 0.7rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .me { display: flex; align-items: center; gap: 0.4rem; }
  .me b { color: var(--ink); font-weight: 500; }
  .tag {
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 0.05rem 0.3rem;
  }

  .link {
    background: none;
    border: none;
    padding: 0;
    color: var(--muted);
    font: inherit;
    font-size: 0.7rem;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    text-align: left;
  }

  .link:hover { color: var(--accent); }

  /* ---------------- main ---------------- */

  .main { display: flex; flex-direction: column; min-width: 0; }

  header {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    margin: 0;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  header h1 .dim { color: var(--muted); }
  header .spacer { margin-left: auto; }

  .presence { display: flex; align-items: center; gap: 0.4rem; font-size: 0.7rem; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .row { display: flex; flex-direction: column; gap: 0.2rem; max-width: 62ch; }
  .row.mine { align-self: flex-end; align-items: flex-end; }

  .meta { font-size: 0.62rem; color: var(--muted); display: flex; gap: 0.5rem; align-items: center; }
  .meta .who { color: var(--accent-dim); }
  .row.mine .meta .who { color: var(--muted); }

  .bubble {
    position: relative;
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 0.5rem 0.75rem;
    font-size: 0.82rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .row.mine .bubble { background: var(--mine); border-color: var(--accent-dim); }

  .kill {
    background: none;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.66rem;
    cursor: pointer;
    opacity: 0;
    padding: 0;
    transition: opacity 0.15s ease, color 0.15s ease;
  }

  .row:hover .kill { opacity: 1; }
  .kill:hover { color: var(--danger); }
  .kill:focus-visible { opacity: 1; outline: 1px solid var(--accent-dim); }

  .compose-note {
    margin: 0;
    padding: 0 1.25rem 0.7rem;
    font-size: 0.72rem;
    color: var(--danger);
  }
  .compose-note:empty { display: none; }

  /* ---------------- reports ---------------- */

  .card.wide { width: min(600px, 100%); max-height: 82vh; display: flex; flex-direction: column; }
  .rp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
  .rp-head h3 { margin: 0; }
  #reports-list { overflow-y: auto; display: flex; flex-direction: column; gap: 0.7rem; }
  .rp {
    border: 1px solid var(--line);
    background: var(--panel-2);
    padding: 0.75rem 0.85rem;
    font-size: 0.74rem;
    line-height: 1.6;
  }
  .rp.auto { border-left: 2px solid var(--danger); }
  .rp-top { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; color: var(--muted); font-size: 0.64rem; }
  .rp-top b { color: var(--ink); font-weight: 500; }
  .rp-body {
    margin: 0.45rem 0;
    padding: 0.4rem 0.6rem;
    border-left: 2px solid var(--line);
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .rp-why { color: var(--muted); }
  .rp-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.55rem; }
  .rp-actions .danger:hover { color: var(--danger); border-color: var(--danger); }
  .count-badge { color: var(--danger); }

  .empty { margin: auto; font-size: 0.78rem; color: var(--muted); text-align: center; line-height: 1.8; }

  form {
    position: relative;
    display: flex;
    gap: 0.6rem;
    padding: 0.9rem 1.25rem;
    border-top: 1px solid var(--line);
  }

  input, button.primary {
    font: inherit;
    font-size: 0.82rem;
  }

  #text {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.6rem 0.8rem;
    outline: none;
  }

  #text:focus { border-color: var(--accent-dim); }
  #text:disabled { color: var(--muted); }

  button.primary {
    background: var(--btn);
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  button.primary:hover { background: var(--btn-hover); }
  button.primary:disabled { opacity: 0.4; cursor: default; }

  /* ---------------- sign in ---------------- */

  .gate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: var(--bg);
    padding: 2rem;
  }

  .gate.hide { display: none; }

  .gate-box { width: min(320px, 100%); text-align: center; }
  .gate h2 { margin: 0 0 0.5rem; font-size: 1.1rem; font-weight: 500; }
  .gate p { margin: 0 0 1.5rem; font-size: 0.74rem; line-height: 1.7; color: var(--muted); }

  .gate input {
    width: 100%;
    margin-bottom: 0.6rem;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.65rem 0.8rem;
    outline: none;
    text-align: center;
  }

  .gate input:focus { border-color: var(--accent-dim); }
  .gate-row { display: flex; gap: 0.6rem; margin-top: 0.4rem; }
  .gate-row button { flex: 1; cursor: pointer; padding: 0.65rem 0; }

  .ghost {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .ghost:hover { color: var(--ink); border-color: var(--accent-dim); }

  .gate p.safe { margin: -0.2rem 0 1rem; font-size: 0.7rem; letter-spacing: 0.08em; color: var(--accent); }
  .safe-tag { font-size: 0.62rem; letter-spacing: 0.08em; color: var(--accent-dim); }
  @media (max-width: 680px) { .safe-tag { display: none; } }

  .err { min-height: 1.2rem; margin-top: 0.7rem; font-size: 0.72rem; color: var(--danger); }
  .note { font-size: 0.72rem; color: var(--muted); }

  /* ---------------- prompt ---------------- */

  .veil {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: grid;
    place-items: center;
    background: var(--veil);
    padding: 2rem;
  }

  .veil.hide { display: none; }

  .card {
    width: min(340px, 100%);
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    padding: 1.25rem;
  }

  .card h3 { margin: 0 0 0.4rem; font-size: 0.9rem; font-weight: 500; }
  .card p { margin: 0 0 1rem; font-size: 0.74rem; line-height: 1.6; color: var(--muted); }
  .card input { width: 100%; margin-bottom: 0.6rem; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); padding: 0.6rem 0.7rem; outline: none; }
  .card .gate-row { margin-top: 0.8rem; }
  .card label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.7rem; cursor: pointer; }

  /* ---------------- people ---------------- */

  .app.people-open { grid-template-columns: 220px 1fr 230px; }
  .people { display: none; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  .app.people-open .people { display: flex; }
  .people-head { display: flex; flex-direction: column; gap: 0.6rem; padding: 0.9rem 0.9rem 0.7rem; border-bottom: 1px solid var(--line); }
  .people-tabs { display: flex; gap: 0.3rem; }
  .people-tabs button {
    flex: 1;
    padding: 0.3rem 0.4rem;
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    font: inherit;
    font-size: 0.66rem;
    cursor: pointer;
  }
  .people-tabs button.on { color: var(--accent); border-color: var(--accent-dim); background: var(--sel); }
  #people-filter { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 0.75rem; padding: 0.4rem 0.55rem; outline: none; }
  #people-filter:focus { border-color: var(--accent-dim); }
  #people-list { flex: 1; overflow-y: auto; padding: 0.3rem 0.4rem; }
  .people-group { margin: 0.7rem 0.5rem 0.25rem; font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .person {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.38rem 0.5rem;
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 0.78rem;
    text-align: left;
    cursor: pointer;
  }
  .person:hover, .person:focus-visible { background: var(--panel-2); outline: none; }
  .pdot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .person.online .pdot, .suggest .online .pdot { background: var(--accent); }
  .person:not(.online) .pname { color: var(--muted); }
  .ptag { margin-left: auto; font-size: 0.56rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-dim); }
  .people-close { display: none; }
  .people-note { margin: 0; padding: 0.6rem 0.9rem 0.9rem; font-size: 0.66rem; color: var(--muted); }

  /* ---------------- mentions ---------------- */

  .badge {
    display: inline-block;
    min-width: 1.3em;
    margin-left: 0.35rem;
    padding: 0 0.3rem;
    background: var(--danger);
    color: var(--bg);
    font-size: 0.6rem;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    border-radius: 999px;
  }
  .at { color: var(--accent); }
  .at.at-me { background: var(--at-bg); padding: 0 0.15rem; }
  .row.pinged .bubble { border-color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
  .row.flash .bubble { animation: flash 1.8s ease; }
  @keyframes flash { 0%, 45% { background: var(--flash); } }

  .mn { display: block; width: 100%; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .mn:hover, .mn:focus-visible { border-color: var(--accent-dim); outline: none; }
  .mn.unseen { border-left: 2px solid var(--accent); }
  .rp-head .btns { display: flex; gap: 0.4rem; }

  /* @ autocomplete above the text box */
  .suggest {
    position: absolute;
    left: 1.25rem;
    bottom: calc(100% - 0.35rem);
    z-index: 4;
    min-width: 220px;
    max-height: 230px;
    overflow-y: auto;
    padding: 0.25rem;
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .suggest button {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.35rem 0.5rem;
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 0.78rem;
    text-align: left;
    cursor: pointer;
  }
  .suggest button.on, .suggest button:hover { background: var(--sel); color: var(--accent); }
  .suggest .ptag { color: var(--muted); }

  /* pop-up when someone @s you */
  #toasts { position: fixed; right: 1rem; bottom: 4.6rem; z-index: 9; display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; }
  .toast {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    max-width: 330px;
    padding: 0.7rem 0.85rem;
    background: var(--panel);
    border: 1px solid var(--accent-dim);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    font-size: 0.76rem;
    line-height: 1.5;
    animation: toastin 0.25s ease;
  }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } }

  @media (max-width: 680px) {
    .app.people-open { grid-template-columns: 1fr; }
    .people { position: fixed; top: 0; right: 0; bottom: 0; z-index: 6; width: min(290px, 86vw); box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5); }
    .people-close { display: block; align-self: flex-end; }
  }

  @media (max-width: 680px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .rail-section { border-bottom: none; border-right: 1px solid var(--line); min-width: 190px; }
    .rail-foot { display: none; }
  }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--line); }
</style>
</head>
<body>
<script>
  // match ChalkBored's theme (same browser storage the Notebook uses) - or,
  // inside CHALK OS, the desktop's own colours, which it sends and keeps sending
  (function () {
    const THEMES = ['notebook', 'chalkboard', 'terminal', 'night'];
    let fromDesktop = false;
    window.addEventListener('message', (e) => {
      const t = e.data && e.data.boxtheme;
      if (!t || typeof t !== 'object' || !t.bg) return;
      fromDesktop = true;
      const b = document.body, dark = t.mode === 'dark';
      const mix = (a, pct, c) => 'color-mix(in srgb, ' + a + ' ' + pct + '%, ' + c + ')';
      const vars = {
        '--bg': t.panel, '--panel': t.panel2, '--panel-2': t.panel, '--ink': t.text, '--muted': t.muted,
        '--line': t.border, '--accent': t.accent, '--danger': t.danger || '#c9534b',
        '--accent-dim': mix(t.accent, 55, t.panel), '--sel': mix(t.accent, 18, t.panel2),
        '--mine': mix(t.accent, dark ? 24 : 15, t.panel), '--btn': mix(t.accent, 18, t.panel),
        '--btn-hover': mix(t.accent, 30, t.panel), '--flash': mix(t.accent, 35, t.panel),
        '--at-bg': mix(t.accent, 25, 'transparent'), '--veil': dark ? 'rgba(0, 0, 0, 0.55)' : 'rgba(0, 0, 0, 0.28)'
      };
      for (const k in vars) if (vars[k]) b.style.setProperty(k, vars[k]);
      b.style.colorScheme = dark ? 'dark' : 'light';
      b.dataset.theme = 'desktop';
      if (t.brand) document.title = t.brand === 'sea' ? 'SEA Chat' : 'Chalk Chat';
    });
    function apply() {
      if (fromDesktop) return;
      let theme = 'terminal';
      try {
        const saved = JSON.parse(localStorage.getItem('vault-settings') || 'null');
        if (saved && saved.plain) theme = 'night';
        else if (saved && THEMES.includes(saved.theme)) theme = saved.theme;
      } catch (e) {}
      document.body.dataset.theme = theme;
    }
    apply();
    // change the theme in ChalkBored and an open chat follows along
    window.addEventListener('storage', (e) => { if (e.key === 'vault-settings') apply(); });
  })();
</script>

<div class="app" id="app">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ------------------------------------------------------------------ setup
   Paste your project's two public values here. Both are safe in a public
   repo: the anon key only lets people do what the database rules allow. */
const SUPABASE_URL = 'https://ifyhdysaugcivmvltuyb.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CBXtSVX-0r8a0GGV9B4znA_8JXfxaOD';

// usernames become addresses behind the scenes, so nobody has to give an email
const MAIL_DOMAIN = 'users.chalkbored.win';

const CONFIGURED = !SUPABASE_URL.startsWith('PASTE') && !SUPABASE_ANON_KEY.startsWith('PASTE');
const db = CONFIGURED ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $ = (id) => document.getElementById(id);
const state = {
  me: null, rooms: [], room: null, channels: [], channel: null, membership: {}, presence: null, feed: null,
  members: [], everyone: [], online: new Set(), peopleScope: 'room', unseen: 0, mentionsReady: true,
};

// ------------------------------------------------------------------ prompt
function ask({ title, text, placeholder, second, check }) {
  return new Promise((resolve) => {
    $('ask-title').textContent = title;
    $('ask-text').textContent = text || '';
    $('ask-err').textContent = '';
    $('ask-1').value = '';
    $('ask-1').placeholder = placeholder || '';
    $('ask-1').type = (placeholder || '').toLowerCase().includes('password') ? 'password' : 'text';
    $('ask-2').value = '';
    $('ask-2').hidden = !second;
    if (second) { $('ask-2').placeholder = second; $('ask-2').type = 'password'; }
    $('ask-check-wrap').hidden = !check;
    $('ask-check').checked = false;
    if (check) $('ask-check-label').textContent = check;
    $('veil').classList.remove('hide');
    $('ask-1').focus();

    const done = (value) => {
      $('veil').classList.add('hide');
      $('ask-ok').onclick = null;
      $('ask-cancel').onclick = null;
      resolve(value);
    };
    $('ask-ok').onclick = () => done({ one: $('ask-1').value.trim(), two: $('ask-2').value, checked: $('ask-check').checked });
    $('ask-cancel').onclick = () => done(null);
  });
}

// ------------------------------------------------------------------ signing in
async function loadMe() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return null;
  const { data } = await db.from('profiles').select('id, username, is_mod, banned').eq('id', user.id).single();
  return data || null;
}

async function signIn(mode) {
  const username = $('u').value.trim();
  const password = $('p').value;
  const err = $('gate-err');
  err.textContent = '';

  if (!/^[A-Za-z0-9_.-]{2,20}$/.test(username)) {
    err.textContent = 'Usernames: 2–20 characters, letters, numbers, _ . - only.';
    return;
  }
  if (password.length < 6) { err.textContent = 'Passwords need at least 6 characters.'; return; }

  const email = username.toLowerCase() + '@' + MAIL_DOMAIN;
  const res = mode === 'register'
    ? await db.auth.signUp({ email, password, options: { data: { username } } })
    : await db.auth.signInWithPassword({ email, password });

  if (res.error) {
    err.textContent = res.error.message.includes('already registered')
      ? 'That name already has an account — use Log in.'
      : res.error.message.includes('Invalid login')
        ? 'Wrong name or password.'
        : res.error.message;
    return;
  }
  await start();
}

$('login').onclick = () => signIn('login');
$('register').onclick = () => signIn('register');
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn('login'); });

$('sign-out').onclick = async () => { await db.auth.signOut(); location.reload(); };

// ------------------------------------------------------------------ rooms
async function loadRooms() {
  const [{ data: rooms }, { data: mine }] = await Promise.all([
    db.from('rooms').select('id, name, is_private, is_global, owner_id').order('is_global', { ascending: false }).order('name'),
    db.from('room_members').select('room_id, role').eq('user_id', state.me.id),
  ]);

  state.rooms = rooms || [];
  state.membership = {};
  (mine || []).forEach((m) => { state.membership[m.room_id] = m.role; });
  paintRooms();
  paintMe();
  refreshReportCount();
  watchReports();

  if (!state.room && state.rooms.length) {
    const first = state.rooms.find((r) => r.is_global) || state.rooms[0];
    await openRoom(first);
  }
}

function paintRooms() {
  const wrap = $('rooms');
  wrap.innerHTML = '';

  state.rooms.forEach((room) => {
    const joined = !!state.membership[room.id];
    const btn = document.createElement('button');
    btn.className = 'item' + (state.room && state.room.id === room.id ? ' on' : '');
    btn.type = 'button';
    btn.innerHTML = '<span></span>';
    btn.querySelector('span').textContent = room.name;

    if (room.is_private && !joined && !state.me.is_mod) {
      const lock = document.createElement('span');
      lock.className = 'lock';
      lock.textContent = 'locked';
      btn.appendChild(lock);
    }

    btn.onclick = () => openRoom(room);
    wrap.appendChild(btn);
  });
}

async function openRoom(room) {
  const joined = !!state.membership[room.id];

  if (!joined) {
    let password = null;
    if (room.is_private && !state.me.is_mod) {
      const answer = await ask({ title: room.name, text: 'This room is private.', placeholder: 'Room password' });
      if (!answer) return;
      password = answer.one;
    }
    const { data: ok, error } = await db.rpc('join_room', { p_room: room.id, p_password: password });
    if (error) return alert(error.message);
    if (!ok) return alert('Wrong password.');
    state.membership[room.id] = 'member';
  }

  state.room = room;
  state.channel = null;
  $('room-name').textContent = room.name;
  $('delete-room').hidden = !(state.me.is_mod || room.owner_id === state.me.id) || room.is_global;
  $('room-mods').hidden = !(state.me.is_mod || state.membership[room.id] === 'owner');
  $('new-channel').hidden = !canAddChannel(room);
  paintRooms();
  await loadChannels();
  watchPresence();
  loadMembers();
}

function canAddChannel(room) {
  if (state.me.is_mod) return true;
  if (room.is_global) return false;
  return ['owner', 'mod'].includes(state.membership[room.id]);
}

function canManage(room) {
  return state.me.is_mod || ['owner', 'mod'].includes(state.membership[room.id]);
}

$('new-room').onclick = async () => {
  const answer = await ask({
    title: 'New room',
    text: state.me.is_mod
      ? 'Leave the password blank for a public room.'
      : 'Anyone with the password can join. You get one private room.',
    placeholder: 'Room name',
    second: 'Room password',
  });
  if (!answer || !answer.one) return;

  const isPrivate = !!answer.two || !state.me.is_mod;
  const { error } = await db.rpc('create_room', { p_name: answer.one, p_private: isPrivate, p_password: answer.two || null });
  if (error) return alert(error.message);
  await loadRooms();
};

$('delete-room').onclick = async () => {
  if (!state.room || !confirm('Delete "' + state.room.name + '" and everything in it?')) return;
  const { error } = await db.from('rooms').delete().eq('id', state.room.id);
  if (error) return alert(error.message);
  state.room = null;
  await loadRooms();
};

$('room-mods').onclick = async () => {
  const answer = await ask({
    title: 'Room moderators',
    text: 'A room mod can add and delete channels here, and delete anyone’s messages in this room.',
    placeholder: 'Username',
    check: 'Remove instead (back to member)',
  });
  if (!answer || !answer.one) return;
  const { error } = await db.rpc('set_room_role', {
    p_room: state.room.id, p_username: answer.one, p_role: answer.checked ? 'member' : 'mod',
  });
  alert(error ? error.message : (answer.checked ? answer.one + ' is a member again.' : answer.one + ' is now a room mod.'));
};

// ------------------------------------------------------------------ channels
async function loadChannels() {
  const room = state.room;
  const { data } = await db.from('channels').select('id, name, room_id').eq('room_id', room.id).order('created_at');
  if (state.room !== room) return;   // switched rooms while this was loading
  const keep = state.channel && (data || []).find((c) => c.id === state.channel.id);
  if (keep) { state.channels = data; paintChannels(); return; }
  state.channels = data || [];
  paintChannels();
  if (state.channels.length) openChannel(state.channels[0]);
  else { state.channel = null; $('channel-name').textContent = ''; renderEmpty('No channels in this room yet.'); lockComposer(true); }
}

function paintChannels() {
  const wrap = $('channels');
  wrap.innerHTML = '';

  state.channels.forEach((ch) => {
    const btn = document.createElement('button');
    btn.className = 'item' + (state.channel && state.channel.id === ch.id ? ' on' : '');
    btn.type = 'button';
    btn.innerHTML = '<span></span>';
    btn.querySelector('span').textContent = '# ' + ch.name;
    btn.onclick = () => openChannel(ch);

    if (canManage(state.room)) {
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '×';
      x.title = 'Delete channel';
      x.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm('Delete #' + ch.name + '?')) return;
        const { error } = await db.from('channels').delete().eq('id', ch.id);
        if (error) alert(error.message); else loadChannels();
      };
      btn.appendChild(x);
    }
    wrap.appendChild(btn);
  });
}

$('new-channel').onclick = async () => {
  const answer = await ask({ title: 'New channel', text: 'In ' + state.room.name + '.', placeholder: 'Channel name' });
  if (!answer || !answer.one) return;
  const { error } = await db.from('channels').insert({ room_id: state.room.id, name: answer.one, created_by: state.me.id });
  if (error) return alert(error.message);
  loadChannels();
};

// ------------------------------------------------------------------ messages
async function openChannel(ch) {
  state.channel = ch;
  $('channel-name').textContent = '  /  # ' + ch.name;
  paintChannels();
  lockComposer(false);

  const { data } = await db
    .from('messages')
    .select('id, body, created_at, user_id, profiles(username)')
    .eq('channel_id', ch.id)
    .order('id', { ascending: false })
    .limit(80);

  if (state.channel !== ch) return;   // clicked somewhere else while this was loading
  const rows = (data || []).reverse();
  $('messages').innerHTML = '';
  if (!rows.length) renderEmpty('Nothing here yet. Say something.');
  rows.forEach(addMessage);
  scrollDown();
  markChannelSeen(ch.id);
  watchFeed();
}

function renderEmpty(text) {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = text;
  $('messages').innerHTML = '';
  $('messages').appendChild(p);
}

function addMessage(m) {
  const empty = $('messages').querySelector('.empty');
  if (empty) empty.remove();

  const mine = m.user_id === state.me.id;
  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' mine' : '');
  row.dataset.id = m.id;

  const meta = document.createElement('div');
  meta.className = 'meta';
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = (m.profiles && m.profiles.username) || (mine ? state.me.username : 'someone');
  const when = document.createElement('span');
  when.textContent = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  meta.append(who, when);

  if (!mine) {
    const flag = document.createElement('button');
    flag.className = 'kill';
    flag.type = 'button';
    flag.textContent = 'report';
    flag.onclick = () => reportMessage(m.id);
    meta.appendChild(flag);
  }

  if (mine || canManage(state.room)) {
    const kill = document.createElement('button');
    kill.className = 'kill';
    kill.type = 'button';
    kill.textContent = 'delete';
    kill.onclick = async () => {
      const { error } = await db.from('messages').delete().eq('id', m.id);
      if (error) alert(error.message);
    };
    meta.appendChild(kill);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (renderBody(bubble, m.body) && !mine) row.classList.add('pinged');

  row.append(meta, bubble);
  $('messages').appendChild(row);
}

function scrollDown() { $('messages').scrollTop = $('messages').scrollHeight; }

function lockComposer(locked) {
  $('text').disabled = locked;
  $('composer').querySelector('button').disabled = locked;
}

$('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = $('text').value.trim();
  if (!body || !state.channel) return;
  $('text').value = '';
  // the database checks it (auto mod) and answers with a reason if it said no
  const { data: why, error } = await db.rpc('send_message', { p_channel: state.channel.id, p_body: body });
  if (error || why) {
    composeNote(error ? error.message : why);
    $('text').value = body;
  } else {
    composeNote('');
  }
});

let noteTimer = null;
function composeNote(text) {
  clearTimeout(noteTimer);
  $('compose-note').textContent = text;
  if (text) noteTimer = setTimeout(() => { $('compose-note').textContent = ''; }, 7000);
}

// live messages for the open channel
function watchFeed() {
  if (state.feed) db.removeChannel(state.feed);
  state.feed = db
    .channel('feed:' + state.channel.id)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: 'channel_id=eq.' + state.channel.id },
      async ({ new: row }) => {
        if (row.user_id === state.me.id) {
          addMessage({ ...row, profiles: { username: state.me.username } });
        } else {
          const { data } = await db.from('profiles').select('username').eq('id', row.user_id).single();
          addMessage({ ...row, profiles: data });
          if (window.parent !== window && state.channel) {
            window.parent.postMessage({ boxchat: 'message', from: (data && data.username) || 'someone',
                                        channel: state.channel.name, text: row.body }, '*');
          }
        }
        scrollDown();
      })
    .on('postgres_changes',
      { event: 'DELETE', schema: 'public', table: 'messages' },
      ({ old: row }) => {
        const el = $('messages').querySelector('[data-id="' + row.id + '"]');
        if (el) el.remove();
      })
    .subscribe();
}

// who's in the room
function watchPresence() {
  if (state.presence) db.removeChannel(state.presence);
  state.presence = db.channel('who:' + state.room.id, { config: { presence: { key: state.me.id } } });

  state.presence
    .on('presence', { event: 'sync' }, () => {
      const count = Object.keys(state.presence.presenceState()).length;
      $('online').textContent = count + (count === 1 ? ' here' : ' here');
      // the vault's Home app shows this too
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'presence', count }, location.origin);
      }
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') await state.presence.track({ username: state.me.username });
    });
}

// ------------------------------------------------------------------ moderator
$('become-mod').onclick = async () => {
  const answer = await ask({ title: 'Moderator login', text: 'Type the moderator password.', placeholder: 'Password' });
  if (!answer || !answer.one) return;
  const { data: ok, error } = await db.rpc('claim_mod', { p_password: answer.one });
  if (error) return alert(error.message);
  if (!ok) return alert('Wrong password.');
  state.me.is_mod = true;
  paintMe();
  await loadRooms();
};

$('mod-tools').onclick = async () => {
  const answer = await ask({
    title: 'Ban someone',
    text: 'A banned account can’t post anywhere.',
    placeholder: 'Username',
    check: 'Unban instead',
  });
  if (!answer || !answer.one) return;
  const { error } = await db.rpc('set_banned', { p_username: answer.one, p_banned: !answer.checked });
  alert(error ? error.message : answer.one + (answer.checked ? ' is unbanned.' : ' is banned.'));
};

function paintMe() {
  $('me-name').textContent = state.me.username;
  $('me-tag').hidden = !state.me.is_mod;
  $('mod-tools').hidden = !state.me.is_mod;
  $('word-list').hidden = !state.me.is_mod;
  $('become-mod').hidden = state.me.is_mod;
  $('open-reports').hidden = !runsSomething();
}

// site mods, and anyone who owns or mods at least one room, get the report queue
function runsSomething() {
  return state.me.is_mod || Object.values(state.membership).some((r) => r === 'owner' || r === 'mod');
}

// ------------------------------------------------------------------ reports
async function reportMessage(id) {
  const answer = await ask({
    title: 'Report message',
    text: 'The mods will see the message and your reason. Three reports from different people remove it automatically.',
    placeholder: 'What’s wrong? (optional)',
  });
  if (!answer) return;
  const { data, error } = await db.rpc('report_message', { p_message: id, p_reason: answer.one || null });
  alert(error ? error.message : data);
}

async function loadReports() {
  const { data, error } = await db
    .from('reports')
    .select('id, kind, msg_ref, message_id, room_id, body, reason, auto_removed, created_at, ' +
            'reported:profiles!reports_reported_user_fkey(username), reporter:profiles!reports_reporter_id_fkey(username)')
    .eq('status', 'open')
    .order('created_at', { ascending: false })
    .limit(150);
  if (error) return { error };

  // several people reporting one message = one entry
  const groups = new Map();
  (data || []).forEach((r) => {
    const key = r.msg_ref ? 'm' + r.msg_ref : 'r' + r.id;
    if (!groups.has(key)) groups.set(key, { ...r, reporters: [], reasons: [] });
    const g = groups.get(key);
    if (r.reporter) g.reporters.push(r.reporter.username);
    if (r.reason) g.reasons.push(r.reason);
    if (r.auto_removed) g.auto_removed = true;
  });
  return { groups: [...groups.values()] };
}

async function refreshReportCount() {
  if (!runsSomething()) return;
  const { count } = await db.from('reports').select('id', { count: 'exact', head: true }).eq('status', 'open');
  $('open-reports').innerHTML = count ? 'Reports <span class="count-badge">(' + count + ')</span>' : 'Reports';
}

async function paintReports() {
  const list = $('reports-list');
  list.innerHTML = '<p class="note">Loading…</p>';
  const { groups, error } = await loadReports();
  list.innerHTML = '';

  if (error) {
    const p = document.createElement('p');
    p.className = 'err';
    p.textContent = /reports|relationship|schema/.test(error.message)
      ? 'The reports table is missing. Run SCRIPTS/chat-automod.sql in Supabase.'
      : error.message;
    list.appendChild(p);
    return;
  }
  if (!groups.length) { list.innerHTML = '<p class="note">Nothing to review.</p>'; return; }

  const roomName = (id) => (state.rooms.find((r) => r.id === id) || {}).name || 'a deleted room';

  groups.forEach((g) => {
    const box = document.createElement('div');
    box.className = 'rp' + (g.kind === 'automod' ? ' auto' : '');

    const top = document.createElement('div');
    top.className = 'rp-top';
    const add = (label, value) => {
      const span = document.createElement('span');
      span.append(label);
      if (value) { const b = document.createElement('b'); b.textContent = value; span.append(b); }
      top.appendChild(span);
    };
    add(g.kind === 'automod' ? 'auto mod · ' : 'about ', (g.reported && g.reported.username) || 'someone');
    if (g.kind !== 'automod') add('reported by ', g.reporters.join(', ') || 'someone');
    add('in ', roomName(g.room_id));
    add(new Date(g.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
    box.appendChild(top);

    if (g.body) {
      const body = document.createElement('div');
      body.className = 'rp-body';
      body.textContent = g.body;
      box.appendChild(body);
    }

    const notes = g.reasons.slice();
    if (g.auto_removed) notes.push('Removed automatically after 3 reports.');
    else if (g.kind !== 'automod' && !g.message_id) notes.push('The message has since been deleted.');
    if (notes.length) {
      const why = document.createElement('div');
      why.className = 'rp-why';
      why.textContent = notes.join(' · ');
      box.appendChild(why);
    }

    const actions = document.createElement('div');
    actions.className = 'rp-actions';
    const act = (label, action, cls, confirmText) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mini' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.onclick = async () => {
        if (confirmText && !confirm(confirmText)) return;
        const { data, error } = await db.rpc('resolve_report', { p_report: g.id, p_action: action });
        if (error || data) return alert(error ? error.message : data);
        paintReports();
        refreshReportCount();
      };
      actions.appendChild(b);
    };
    act(g.kind === 'automod' ? 'Seen it' : 'Dismiss', 'dismiss');
    if (g.message_id) act('Delete message', 'remove', 'danger');
    const who = (g.reported && g.reported.username) || 'this person';
    if (state.me.is_mod) {
      act('Time out 1 hour', 'timeout', 'danger');
      act('Ban', 'ban', 'danger', 'Ban ' + who + '? They won’t be able to post anywhere.');
    }
    box.appendChild(actions);
    list.appendChild(box);
  });
}

$('open-reports').onclick = () => {

$('reports-close').onclick = () => $('reports-veil').classList.add('hide');
$('reports-veil').addEventListener('click', (e) => { if (e.target.id === 'reports-veil') $('reports-close').click(); });

// ------------------------------------------------------------------ @names in messages
// same pattern the database uses, so what's highlighted is what pings
const AT_RX = /(^|[^A-Za-z0-9_@])@([A-Za-z0-9_.-]{2,20})/g;

// writes the message into `el` with @names highlighted; true if it @s you
function renderBody(el, body) {
  const me = state.me ? state.me.username.toLowerCase() : '';
  let last = 0, pingsMe = false, match;
  AT_RX.lastIndex = 0;
  while ((match = AT_RX.exec(body))) {
    const start = match.index + match[1].length;
    const name = match[2].replace(/[.-]+$/, '');
    el.append(body.slice(last, start));
    const at = document.createElement('span');
    const isMe = name.toLowerCase() === me;
    at.className = 'at' + (isMe ? ' at-me' : '');
    at.textContent = '@' + name;
    el.append(at);
    if (isMe) pingsMe = true;
    last = start + 1 + name.length;
  }
  el.append(body.slice(last));
  return pingsMe;
}

// ------------------------------------------------------------------ people
async function loadMembers() {
  if (!state.room) return;
  const room = state.room;
  const { data } = await db.from('room_members')
    .select('user_id, role, profiles(username, is_mod)')
    .eq('room_id', room.id)
    .limit(1000);
  if (state.room !== room) return;
  state.members = (data || []).filter((m) => m.profiles).map((m) => ({
    id: m.user_id, username: m.profiles.username, is_mod: m.profiles.is_mod, role: m.role,
  }));
  paintPeople();
}

let loadingEveryone = null;
function loadEveryone() {
  if (!loadingEveryone) {
    loadingEveryone = db.from('profiles').select('id, username, is_mod').order('username').limit(2000)
      .then(({ data }) => {
        state.everyone = (data || []).map((p) => ({ id: p.id, username: p.username, is_mod: p.is_mod, role: null }));
        paintPeople();
      });
  }
  return loadingEveryone;
}

// who's online anywhere in the chat
function watchEveryone() {
  const ch = db.channel('who:everyone', { config: { presence: { key: state.me.id } } });
  ch.on('presence', { event: 'sync' }, () => {
    state.online = new Set(Object.keys(ch.presenceState()));
    paintPeople();
  }).subscribe(async (status) => {
    if (status === 'SUBSCRIBED') await ch.track({ username: state.me.username });
  });
}

function personTag(p) {
  if (p.id === state.me.id) return 'you';
  if (p.role === 'owner') return 'owner';
  if (p.role === 'mod') return 'room mod';
  if (p.is_mod) return 'site mod';
  return '';
}

function paintPeople() {
  const list = $('people-list');
  if (!$('people').offsetParent && !$('app').classList.contains('people-open')) return;
  const q = $('people-filter').value.trim().toLowerCase();
  $('scope-room').textContent = 'This room (' + state.members.length + ')';
  $('scope-all').textContent = 'Everyone (' + (state.everyone.length || '…') + ')';

  const pool = (state.peopleScope === 'room' ? state.members : state.everyone)
    .filter((p) => !q || p.username.toLowerCase().includes(q))
    .sort((a, b) => a.username.localeCompare(b.username));
  const online = pool.filter((p) => state.online.has(p.id));
  const offline = pool.filter((p) => !state.online.has(p.id));

  list.innerHTML = '';
  if (!pool.length) {
    const none = document.createElement('p');
    none.className = 'people-note';
    none.textContent = q ? 'No one matches “' + q + '”.' : 'No one here yet.';
    list.appendChild(none);
    return;
  }

  const group = (label, people) => {
    if (!people.length) return;
    const head = document.createElement('p');
    head.className = 'people-group';
    head.textContent = label + ' — ' + people.length;
    list.appendChild(head);
    people.forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'person' + (state.online.has(p.id) ? ' online' : '');
      b.innerHTML = '<span class="pdot"></span><span class="pname"></span><span class="ptag"></span>';
      b.querySelector('.pname').textContent = p.username;
      b.querySelector('.ptag').textContent = personTag(p);
      b.title = p.id === state.me.id ? 'That’s you' : 'Mention @' + p.username;
      if (p.id !== state.me.id) b.onclick = () => insertMention(p.username);
      list.appendChild(b);
    });
  };
  group('Online', online);
  group('Offline', offline);
}

function insertMention(name) {
  const box = $('text');
  if (box.disabled) return;
  const v = box.value;
  box.value = (v && !/\s$/.test(v) ? v + ' ' : v) + '@' + name + ' ';
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
}

function setPeopleOpen(open) {
  $('app').classList.toggle('people-open', open);
  $('toggle-people').setAttribute('aria-expanded', String(open));
  try { localStorage.setItem('chat-people-open', open ? '1' : '0'); } catch (e) {}
  if (open) { loadEveryone(); paintPeople(); }
}
function restorePeople() {
  let open = false;
  try { open = localStorage.getItem('chat-people-open') === '1'; } catch (e) {}
  if (open && window.innerWidth > 680) setPeopleOpen(true);
}

$('toggle-people').onclick = () => setPeopleOpen(!$('app').classList.contains('people-open'));
$('people-close').onclick = () => setPeopleOpen(false);
$('people-filter').addEventListener('input', paintPeople);
document.querySelectorAll('.people-tabs button').forEach((b) => {
  b.onclick = () => {
    state.peopleScope = b.dataset.scope;
    document.querySelectorAll('.people-tabs button').forEach((x) => x.classList.toggle('on', x === b));
    if (state.peopleScope === 'all') loadEveryone();
    paintPeople();
  };
});

// ------------------------------------------------------------------ @ autocomplete
const suggestEl = $('suggest');
let suggestItems = [];
let suggestAt = 0;

// the @word the caret is in, if any
function mentionQuery() {
  const box = $('text');
  const pos = box.selectionStart;
  const m = box.value.slice(0, pos).match(/(?:^|[^A-Za-z0-9_@])@([A-Za-z0-9_.-]{0,20})$/);
  return m ? { q: m[1].toLowerCase(), start: pos - m[1].length - 1, end: pos } : null;
}

function candidates(q) {
  const seen = new Set();
  const out = [];
  const add = (p) => {
    if (p.id === state.me.id || seen.has(p.id) || !p.username.toLowerCase().startsWith(q)) return;
    seen.add(p.id);
    out.push(p);
  };
  // people in this room first, online before offline, then everyone else
  const byOnline = (list) => list.slice().sort((a, b) => (state.online.has(b.id) - state.online.has(a.id)) || a.username.localeCompare(b.username));
  byOnline(state.members).forEach(add);
  byOnline(state.everyone).forEach(add);
  return out.slice(0, 8);
}

function hideSuggest() {
  suggestEl.hidden = true;
  suggestItems = [];
  suggestAt = 0;
}

function updateSuggest() {
  const mq = mentionQuery();
  if (!mq) return hideSuggest();
  if (!state.everyone.length) loadEveryone().then(() => { if (mentionQuery()) updateSuggest(); });
  suggestItems = candidates(mq.q);
  if (!suggestItems.length) return hideSuggest();
  suggestAt = Math.min(suggestAt, suggestItems.length - 1);

  suggestEl.innerHTML = '';
  suggestItems.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', String(i === suggestAt));
    b.className = (i === suggestAt ? 'on ' : '') + (state.online.has(p.id) ? 'online' : '');
    b.innerHTML = '<span class="pdot"></span><span></span><span class="ptag"></span>';
    b.children[1].textContent = '@' + p.username;
    b.querySelector('.ptag').textContent = state.members.some((m) => m.id === p.id) ? 'in room' : '';
    b.addEventListener('mousedown', (e) => e.preventDefault());   // keep focus in the box
    b.onclick = () => pickSuggest(i);
    suggestEl.appendChild(b);
  });
  suggestEl.hidden = false;
}

function pickSuggest(i) {
  const mq = mentionQuery();
  const p = suggestItems[i];
  if (!mq || !p) return hideSuggest();
  const box = $('text');
  box.value = box.value.slice(0, mq.start) + '@' + p.username + ' ' + box.value.slice(mq.end);
  const caret = mq.start + p.username.length + 2;
  box.setSelectionRange(caret, caret);
  hideSuggest();
  box.focus();
}

$('text').addEventListener('input', () => { suggestAt = 0; updateSuggest(); });
$('text').addEventListener('click', updateSuggest);
$('text').addEventListener('blur', () => setTimeout(hideSuggest, 150));
$('text').addEventListener('keydown', (e) => {
  if (suggestEl.hidden) return;
  const n = suggestItems.length;
  if (e.key === 'ArrowDown') { e.preventDefault(); suggestAt = (suggestAt + 1) % n; updateSuggest(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); suggestAt = (suggestAt - 1 + n) % n; updateSuggest(); }
  else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickSuggest(suggestAt); }
  else if (e.key === 'Escape') { e.preventDefault(); hideSuggest(); }
});

// ------------------------------------------------------------------ mentions inbox
async function refreshMentionBadge() {
  const { count, error } = await db.from('mentions').select('id', { count: 'exact', head: true })
    .eq('user_id', state.me.id).eq('seen', false);
  state.mentionsReady = !error;
  state.unseen = error ? 0 : (count || 0);
  const badge = $('mention-badge');
  badge.hidden = !state.unseen;
  badge.textContent = state.unseen > 99 ? '99+' : String(state.unseen);
  document.title = (state.unseen ? '(' + state.unseen + ') ' : '') + 'Chalk Chat';
}

async function markSeen(ids) {
  await db.rpc('mark_mentions_seen', { p_ids: ids });
  refreshMentionBadge();
}

async function markChannelSeen(channelId) {
  if (!state.unseen) return;
  const { data } = await db.from('mentions').select('id').eq('user_id', state.me.id).eq('seen', false).eq('channel_id', channelId);
  if (data && data.length) markSeen(data.map((d) => d.id));
}

async function paintMentions() {
  const list = $('mentions-list');
  list.innerHTML = '<p class="note">Loading…</p>';
  const { data, error } = await db.from('mentions')
    .select('id, seen, created_at, room_id, channel_id, message_id, messages(body), author:profiles!mentions_by_user_fkey(username), rooms(name), channels(name)')
    .eq('user_id', state.me.id)
    .order('created_at', { ascending: false })
    .limit(50);
  list.innerHTML = '';

  if (error) {
    const p = document.createElement('p');
    p.className = 'err';
    p.textContent = /mentions|relationship|schema/.test(error.message)
      ? 'Mentions aren’t set up yet. Run SCRIPTS/chat-mentions.sql in Supabase.' : error.message;
    list.appendChild(p);
    return;
  }
  if (!data.length) {
    const p = document.createElement('p');
    p.className = 'note';
    p.textContent = 'No mentions yet. When someone writes @' + state.me.username + ', it shows up here.';
    list.appendChild(p);
    return;
  }

  data.forEach((r) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'rp mn' + (r.seen ? '' : ' unseen');
    const top = document.createElement('div');
    top.className = 'rp-top';
    const who = document.createElement('span');
    who.innerHTML = '<b></b> in ';
    who.querySelector('b').textContent = '@' + ((r.author && r.author.username) || 'someone');
    who.append(((r.rooms && r.rooms.name) || 'a room') + ' / #' + ((r.channels && r.channels.name) || '…'));
    const when = document.createElement('span');
    when.textContent = new Date(r.created_at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    top.append(who, when);
    const body = document.createElement('div');
    body.className = 'rp-body';
    if (r.messages) renderBody(body, r.messages.body);
    else body.textContent = '(message deleted)';
    b.append(top, body);
    b.onclick = async () => {
      $('mentions-veil').classList.add('hide');
      if (!r.seen) markSeen([r.id]);
      if (r.messages) jumpTo(r.room_id, r.channel_id, r.message_id);
    };
    list.appendChild(b);
  });
}

$('open-mentions').onclick = () => { $('mentions-veil').classList.remove('hide'); paintMentions(); };
$('mentions-close').onclick = () => $('mentions-veil').classList.add('hide');
$('mentions-veil').addEventListener('click', (e) => { if (e.target.id === 'mentions-veil') $('mentions-close').click(); });
$('mentions-read').onclick = async () => { await markSeen(null); paintMentions(); };

// go to a message: open its room and channel, then scroll to it
async function jumpTo(roomId, channelId, msgId) {
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room) return;
  if (!state.room || state.room.id !== roomId) await openRoom(room);
  if (!state.room || state.room.id !== roomId) return;   // wrong password, or cancelled
  const ch = state.channels.find((c) => c.id === channelId);
  if (ch && (!state.channel || state.channel.id !== ch.id)) await openChannel(ch);
  if (!msgId) return;
  const el = $('messages').querySelector('[data-id="' + msgId + '"]');
  if (!el) return;
  el.scrollIntoView({ block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 2000);
}

// live: someone @s you
function watchMentions() {
  db.channel('mentions:' + state.me.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'mentions', filter: 'user_id=eq.' + state.me.id },
      ({ eventType, new: row }) => {
        if (eventType === 'INSERT') onMention(row);
        else refreshMentionBadge();
      })
    .subscribe();
}

async function onMention(row) {
  // already looking at that channel: it counts as read
  if (state.channel && state.channel.id === row.channel_id && !document.hidden) { markSeen([row.id]); return; }
  refreshMentionBadge();
  const [{ data: author }, { data: ch }] = await Promise.all([
    db.from('profiles').select('username').eq('id', row.by_user).maybeSingle(),
    db.from('channels').select('name').eq('id', row.channel_id).maybeSingle(),
  ]);
  const text = '@' + ((author && author.username) || 'someone') + ' mentioned you in #' + ((ch && ch.name) || 'a channel');
  showToast(text, async () => { await jumpTo(row.room_id, row.channel_id, row.message_id); markSeen([row.id]); });
  desktopAlert(text);
}

function showToast(text, onOpen) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  const span = document.createElement('span');
  span.textContent = text;
  const open = document.createElement('button');
  open.className = 'mini';
  open.type = 'button';
  open.textContent = 'open';
  open.onclick = () => { t.remove(); onOpen(); };
  t.append(span, open);
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 8000);
}

// ------------------------------------------------------------------ desktop alerts (opt in)
const ALERT_STORE = 'chat-desktop-alerts';
function alertsOn() {
  try {
    return localStorage.getItem(ALERT_STORE) === '1' && 'Notification' in window && Notification.permission === 'granted';
  } catch (e) { return false; }
}
function paintAlerts() { $('desk-alerts').textContent = 'Desktop alerts: ' + (alertsOn() ? 'on' : 'off'); }
function desktopAlert(text) {
  if (!alertsOn() || !document.hidden) return;   // only when you're not looking
  try { new Notification('New mention', { body: text, tag: 'chalk-mention' }); } catch (e) {}
}
$('desk-alerts').onclick = async () => {
  if (!('Notification' in window)) return alert('This browser can’t show desktop alerts.');
  if (alertsOn()) {
    try { localStorage.setItem(ALERT_STORE, '0'); } catch (e) {}
    return paintAlerts();
  }
  const answer = await Notification.requestPermission();
  if (answer === 'granted') { try { localStorage.setItem(ALERT_STORE, '1'); } catch (e) {} }
  else alert('Desktop alerts are blocked for this site. You can allow them in your browser’s site settings.');
  paintAlerts();
};

// ------------------------------------------------------------------ go
async function start() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) { $('gate').classList.remove('hide'); return; }

  // signed in, but is the database actually set up?
  const { data: me, error } = await db
    .from('profiles').select('id, username, is_mod, banned').eq('id', user.id).maybeSingle();

  if (error) {
    $('gate').classList.remove('hide');
    $('gate-err').textContent = error.message.includes('schema cache')
      ? 'Signed in, but the database tables are missing. Run supabase-schema.sql.'
      : error.message;
    return;
  }

  if (!me) {
    $('gate').classList.remove('hide');
    $('gate-err').textContent = 'Signed in, but this account has no profile row yet. Run the backfill SQL.';
    return;
  }

  state.me = me;
  $('gate').classList.add('hide');
  paintMe();

  if (me.banned) {
    renderEmpty('Your account is banned.');
    lockComposer(true);
  }

  await loadRooms();

  watchEveryone();
  watchMentions();
  refreshMentionBadge();
  paintAlerts();
  restorePeople();

  // opened from a mention alert: chalk-chat.html?room=…&channel=…&msg=…
  const link = new URLSearchParams(location.search);
  if (link.get('room')) jumpTo(link.get('room'), link.get('channel'), link.get('msg'));

  // rooms and channels appearing or vanishing for everyone
  db.channel('structure')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadRooms())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'channels' }, () => { if (state.room) loadChannels(); })
    .subscribe();
}

if (!CONFIGURED) {
  $('gate').classList.remove('hide');
  $('gate-err').textContent = 'Not connected yet — paste the project URL and anon key near the top of this file.';
  $('login').disabled = true;
  $('register').disabled = true;
} else {
  start();
}
