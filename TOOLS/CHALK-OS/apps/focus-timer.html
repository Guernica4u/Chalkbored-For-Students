<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Timer</title>
<meta name="description" content="Work in focused blocks, with a nudge when it is time for a break">
<meta name="box-icon" content="⏱️">
<meta name="box-size" content="380x460">
<style>
  :root {
    --box-surface: #262626; --box-surface-2: #2e2e2e; --box-text: #e6e6e6;
    --box-dim: #9a9a9a; --box-accent: #8bae5a; --box-accent-fg: #10140c; --box-border: #3a3a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 "Segoe UI", -apple-system, system-ui, sans-serif;
    background: var(--box-surface); color: var(--box-text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px;
  }
  .modes { display: flex; border: 1px solid var(--box-border); border-radius: 6px; overflow: hidden; }
  .modes button { border: 0; border-radius: 0; background: var(--box-surface-2); }
  .modes button + button { border-left: 1px solid var(--box-border); }
  .modes button.on { background: var(--box-accent); color: var(--box-accent-fg); }
  .ring { position: relative; width: 210px; height: 210px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .track { stroke: var(--box-surface-2); }
  .ring .bar { stroke: var(--box-accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
  .time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .time b { font-size: 46px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .time span { color: var(--box-dim); font-size: 12px; }
  .row { display: flex; gap: 8px; }
  button { font: inherit; border: 1px solid var(--box-border); background: var(--box-surface-2); color: var(--box-text); border-radius: 6px; padding: 6px 16px; cursor: pointer; }
  button.go { background: var(--box-accent); border-color: var(--box-accent); color: var(--box-accent-fg); font-weight: 600; min-width: 96px; }
  .done { color: var(--box-dim); font-size: 12px; }
</style>
</head>
<body>
<div class="modes">
  <button data-min="25" class="on">Focus 25</button>
  <button data-min="5">Break 5</button>
  <button data-min="15">Long break</button>
</div>
<div class="ring">
  <svg viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="96"/><circle class="bar" cx="110" cy="110" r="96"/></svg>
  <div class="time"><b id="clock">25:00</b><span id="label">Focus</span></div>
</div>
<div class="row">
  <button class="go" id="go">Start</button>
  <button id="reset">Reset</button>
</div>
<div class="done" id="done">0 focus blocks today</div>
<script>
  const bar = document.querySelector(".bar");
  const full = 2 * Math.PI * 96;
  bar.style.strokeDasharray = full;
  const clock = document.getElementById("clock"), label = document.getElementById("label");
  const go = document.getElementById("go"), doneEl = document.getElementById("done");
  let total = 25 * 60, left = total, running = false, ticker = 0, endsAt = 0, blocks = 0;
  let mode = "Focus";

  function paint() {
    const m = Math.floor(left / 60), s = left % 60;
    clock.textContent = m + ":" + String(s).padStart(2, "0");
    bar.style.strokeDashoffset = full * (1 - left / total);
    document.title = running ? clock.textContent + " - Focus Timer" : "Focus Timer";
  }
  function stop() {
    running = false;
    clearInterval(ticker);
    go.textContent = left < total ? "Resume" : "Start";
  }
  function finish() {
    stop();
    left = 0;
    paint();
    if (mode === "Focus") { blocks++; doneEl.textContent = blocks + " focus block" + (blocks === 1 ? "" : "s") + " today"; }
    const body = mode === "Focus" ? "Nice work. Time for a break." : "Break is over - back to it.";
    if (window.box) box.notify("Focus Timer", body);
    go.textContent = "Start";
    left = total;
  }
  go.onclick = () => {
    if (running) return stop();
    running = true;
    go.textContent = "Pause";
    endsAt = Date.now() + left * 1000;
    ticker = setInterval(() => {
      left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
      paint();
      if (!left) finish();
    }, 250);
  };
  document.getElementById("reset").onclick = () => { stop(); left = total; go.textContent = "Start"; paint(); };
  document.querySelectorAll(".modes button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(".modes button").forEach(o => o.classList.toggle("on", o === b));
      stop();
      total = left = +b.dataset.min * 60;
      mode = b.textContent.startsWith("Focus") ? "Focus" : "Break";
      label.textContent = mode;
      go.textContent = "Start";
      paint();
    };
  });
  paint();
</script>
</body>
</html>
