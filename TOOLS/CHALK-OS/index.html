function pickFile(opts){
  opts = opts || {};
  const accept = opts.accept || (() => true);
  return new Promise(resolve => {
    const layer = $("#modals");
    layer.innerHTML = "";
    let cwd = opts.start && node(opts.start) ? opts.start : HOME;
    let chosen = null;

    const box = el("div", "modal pick");
    const title = el("div", "modal-t", opts.title || "Open");
    const crumbs = el("div", "pick-path");
    const list = el("div", "pick-list");
    const foot = el("div", "modal-f");
    const hint = el("span", "pick-hint", opts.hint || "");
    hint.style.cssText = "flex:1;font-size:11.5px;color:var(--dim);text-align:left";
    const cancel = el("button", "btn", "Cancel");
    const ok = el("button", "btn primary", opts.ok || "Open");
    ok.disabled = true;
    foot.append(hint, cancel, ok);

    const done = v => {
      document.removeEventListener("keydown", onKey, true);
      layer.style.display = "none";
      layer.innerHTML = "";
      resolve(v);
    };
    cancel.onclick = () => done(null);
    ok.onclick = () => done(chosen);
    const onKey = e => {
      if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); done(null); }
      else if (e.key === "Enter" && chosen){ e.preventDefault(); e.stopPropagation(); done(chosen); }
    };
    document.addEventListener("keydown", onKey, true);

    function draw(){
      crumbs.innerHTML = "";
      const up = el("button", "crumb", "\u2191 Up");
      up.disabled = cwd === "/";
      up.onclick = () => { cwd = dirName(cwd); chosen = null; ok.disabled = true; draw(); };
      crumbs.append(up, el("span", "pick-here", tilde(cwd)));

      list.innerHTML = "";
      const dir = node(cwd);
      const names = dir ? listDir(dir) : [];
      let shown = 0;
      for (const name of names){
        const n = dir.children[name];
        const path = absPath(name, cwd);
        const usable = n.type === "dir" || accept(name, n);
        if (!usable) continue;
        shown++;
        const row = el("button", "pick-row" + (path === chosen ? " on" : ""));
        row.append(el("span", "g", nodeIcon(name, n)), el("span", "pick-n", name));
        if (n.type === "file") row.append(el("span", "pick-s", fmtBytes(nodeSize(n))));
        row.onclick = () => {
          if (n.type === "dir"){ cwd = path; chosen = null; ok.disabled = true; draw(); return; }
          chosen = path;
          ok.disabled = false;
          draw();
        };
        row.ondblclick = () => { if (n.type !== "dir") done(path); };
        list.appendChild(row);
      }
      if (!shown) list.appendChild(el("div", "wb-none", "Nothing here that can be opened."));
    }
    draw();
    box.append(title, crumbs, list, foot);
    layer.appendChild(box);
    layer.style.display = "flex";
  });
}

/* ============================================================
   8d. unbox - fetching things from the open web into your filesystem

   Wikimedia Commons is one of the few places that lets a browser read it
   directly, and it holds a great deal of public-domain and freely licensed
   audio and pictures. Results are linked rather than copied, the same as
   repo media: a 5 MB song would not fit in browser storage, and streaming
   it from Commons costs nothing.
   ============================================================ */
/* Two places a browser is allowed to read directly. Commons is curated and
   small; the Internet Archive is enormous. Both are searched at once and the
   results merged, smallest first so something starts playing quickly. */
const COMMONS = "https://commons.wikimedia.org/w/api.php?origin=*&format=json&";
const IA_SEARCH = "https://archive.org/advancedsearch.php?";

async function withTimeout(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 14000);
  try { return await fetch(url, { signal: ctl.signal }); }
  finally { clearTimeout(timer); }
}
/* Openverse aggregates Jamendo, Freesound, ccMixter and others, and is the
   only one of these that reports how long a track is - which is a far better
   signal than file size for "is this actual music or a five-second clip". */
async function searchOpenverse(query, kind){
  if (kind === "video") return [];              /* it does not index video */
  const type = kind === "image" ? "images" : "audio";
  const url = "https://api.openverse.org/v1/" + type + "/?page_size=14&q=" + encodeURIComponent(query);
  const j = await (await withTimeout(url, 15000)).json();
  const okExt = kind === "image" ? /^(jpg|jpeg|png|gif|webp|svg)$/ : /^(mp3|ogg|oga|wav|flac|m4a)$/;
  return (j.results || []).filter(x => x.url).map(x => {
    /* jamendo reports its bitrate as the file type, so "mp32" comes back
       where mp3 was meant; anything else unfamiliar gets the plain default */
    let ext = String(x.filetype || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    if (ext === "mp32" || ext === "mpeg" || ext === "mpga") ext = "mp3";
    if (!okExt.test(ext)) ext = kind === "image" ? "jpg" : "mp3";
    let name = (x.title || "untitled").trim().replace(/[\\\/:*?"<>|]/g, "-");
    if (name.toLowerCase().slice(-(ext.length + 1)) !== "." + ext) name += "." + ext;
    return {
      title: name,
      url: x.url,
      bytes: x.filesize || 0,
      seconds: x.duration ? Math.round(x.duration / 1000) : 0,
      mime: (kind === "image" ? "image/" : "audio/") + (ext === "jpg" ? "jpeg" : ext),
      license: (x.license || "").toUpperCase(),
      from: x.provider || "openverse"
    };
  });
}
async function searchCommons(query, kind){
  const params = new URLSearchParams({
    action: "query", generator: "search", gsrnamespace: "6", gsrlimit: "10",
    gsrsearch: (kind === "image" ? "filetype:bitmap " : kind === "video" ? "filetype:video " : "filetype:audio ") + query,
    prop: "imageinfo", iiprop: "url|size|mime"
  });
  const json = await (await withTimeout(COMMONS + params)).json();
  return Object.values((json.query && json.query.pages) || {}).map(p => {
    const ii = (p.imageinfo || [])[0] || {};
    return { title: p.title.replace(/^File:/, ""), url: ii.url || "",
             bytes: ii.size || 0, mime: ii.mime || "", from: "commons" };
  }).filter(x => x.url);
}
/* the Archive needs two hops: find items, then list the files inside one */
async function searchArchive(query, kind){
  const media = kind === "image" ? "image" : kind === "video" ? "movies" : "audio";
  const url = IA_SEARCH + "q=" + encodeURIComponent(query + " AND mediatype:(" + media + ")") +
              "&fl%5B%5D=identifier&fl%5B%5D=title&rows=18&page=1&output=json";
  const j = await (await withTimeout(url)).json();
  const docs = (j.response && j.response.docs || []).filter(d => d.identifier);
  const out = [];
  await Promise.all(docs.map(async d => {
    try {
      const mj = await (await withTimeout("https://archive.org/metadata/" + d.identifier, 10000)).json();
      const want = kind === "image" ? /\.(jpg|jpeg|png|gif)$/i : kind === "video" ? /\.(mp4|webm|ogv|m4v)$/i : /\.(mp3|ogg|m4a|flac)$/i;
      const seenBase = new Set();
      const files = (mj.files || []).filter(f => want.test(f.name) && (f.size | 0) > 0)
                                    .sort((a, b) => (b.size | 0) - (a.size | 0))
                                    /* archive keeps the same recording in two or three formats;
                                       they share a base name, so one of each is plenty */
                                    .filter(f => { const b = f.name.replace(/\.[^.]+$/, "").toLowerCase();
                                                   return !seenBase.has(b) && seenBase.add(b); });
      const lic = ((mj.metadata || {}).licenseurl || "").replace(/^.*\/(by[\w-]*|publicdomain|zero)\/.*$/i, "$1").toUpperCase();
      /* a couple per item: one file was far too thin a catalogue, but a
         whole album would drown everything else */
      files.slice(0, 2).forEach(f => {
        out.push({
          title: (d.title ? d.title + " - " : "") + f.name,
          url: "https://archive.org/download/" + d.identifier + "/" + encodeURIComponent(f.name),
          bytes: f.size | 0,
          seconds: Math.round(parseFloat(f.length) || 0) || 0,
          mime: kind === "image" ? "image/*" : kind === "video" ? "video/*" : "audio/*",
          license: lic,
          from: "archive"
        });
      });
    } catch (e){ /* skip an item that will not describe itself */ }
  }));
  return out;
}
/* Chrome dropped Ogg Theora, and Commons is full of it, so there is no
   point offering a file the browser has no decoder for. Asked once. */
const playableProbe = { v: null, a: null };
function canPlayExt(ext, kind){
  if (kind === "image") return true;
  const tag = kind === "video" ? "v" : "a";
  if (!playableProbe[tag]) playableProbe[tag] = document.createElement(kind === "video" ? "video" : "audio");
  const types = {
    mp4: "video/mp4", m4v: "video/mp4", mov: "video/mp4", webm: "video/webm",
    mkv: "video/webm", ogv: 'video/ogg; codecs="theora"',
    mp3: "audio/mpeg", m4a: "audio/mp4", aac: "audio/aac", wav: "audio/wav",
    flac: "audio/flac", opus: 'audio/ogg; codecs="opus"', oga: "audio/ogg",
    ogg: kind === "video" ? 'video/ogg; codecs="theora"' : "audio/ogg", weba: "audio/webm"
  };
  const t = types[String(ext).toLowerCase()];
  if (!t) return true;                    /* unknown, give it the benefit of the doubt */
  return playableProbe[tag].canPlayType(t) !== "";
}
/* Rank on how long the thing is where that is known, because duration says
   "real piece of music" far better than byte count does. Fall back to size
   only when no duration came back. Nothing is excluded, just ordered. */
function unboxScore(item, kind, terms){
  let score;
  if (kind === "audio" && item.seconds > 0){
    score = item.seconds >= 45 && item.seconds <= 900 ? 0
          : item.seconds < 45 ? (45 - item.seconds) / 45 * 2.5
          : (item.seconds - 900) / 1800;
  } else if (kind === "video" && item.seconds > 0){
    /* long enough to be a real clip, short enough not to be a lecture */
    score = item.seconds >= 30 && item.seconds <= 1200 ? 0
          : item.seconds < 30 ? (30 - item.seconds) / 30 * 2
          : Math.min((item.seconds - 1200) / 1800, 1.5);
  } else {
    const mb = item.bytes / 1048576;
    if (!mb) score = 1.2;                     /* unknown size, mild penalty */
    else {
      const lo = kind === "video" ? 3 : kind === "image" ? 0.02 : 0.7;
      const hi = kind === "video" ? 2000 : kind === "image" ? 20 : 200;
      score = mb >= lo && mb <= hi ? 0.2      /* plausible, but duration wins */
            : mb < lo ? (lo - mb) / lo * 2.5 : 0.5;
    }
  }
  /* a file the browser cannot decode is worse than any other fault here */
  if (!canPlayExt(extOf(item.title), kind)) score += 12;
  /* the catalogues match on description too, so a thing whose own name says
     nothing about what you asked for is usually not what you meant */
  if (terms && terms.length){
    const t = item.title.toLowerCase();
    const hits = terms.filter(w => t.includes(w)).length;
    score += (1 - hits / terms.length) * 1.6;
  }
  return score;
}
async function unboxSearch(query, kind){
  const [ov, cm, ia] = await Promise.allSettled([
    searchOpenverse(query, kind), searchCommons(query, kind), searchArchive(query, kind)
  ]);
  const pick = r => (r.status === "fulfilled" ? r.value : []);
  const all = pick(ov).concat(pick(cm)).concat(pick(ia));
  if (!all.length){
    const bad = [ov, cm, ia].find(r => r.status === "rejected");
    if (bad) throw bad.reason;
  }
  const terms = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
  const seen = new Set(), sameThing = new Set();
  return all
    .filter(x => x.url && !seen.has(x.url) && seen.add(x.url))
    /* two catalogues often hold the same recording, and archive keeps
       alternate cuts of one; a squashed title catches both */
    .filter(x => { const k = x.title.toLowerCase().replace(/\.[^.]+$/, "").replace(/[^a-z0-9]+/g, "");
                   return !k || (!sameThing.has(k) && sameThing.add(k)); })
    .map((x, i) => Object.assign({ seconds: 0, license: "" }, x, { rank: unboxScore(x, kind, terms) + i * 0.012 }))
    .sort((x, y) => x.rank - y.rank);
}
/* what has been brought in already, so nothing lands twice */
function unboxInstalled(){
  const out = [];
  walkFS((p, n, name) => {
    if (n.type === "file" && n.kind === "link" && /^https?:/i.test(n.content))
      out.push({ path: p, name: name, url: n.content });
  });
  return out;
}
function unboxInstall(item, kind){
  const dir = HOME + (kind === "image" ? "/Pictures" : kind === "video" ? "/Videos" : "/Music");
  ensureDir(dir);
  let name = item.title.replace(/[\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim();
  if (!/\.[a-z0-9]{2,5}$/i.test(name)){
    const m = item.url.match(/\.([a-z0-9]{2,5})(?:\?|$)/i);
    if (m) name += "." + m[1];
  }
  if (name.length > 64){
    const dot = name.lastIndexOf(".");
    name = name.slice(0, 56).trim() + (dot > 0 ? name.slice(dot) : "");
  }
  const parent = node(dir);
  const final = uniqueName(parent, name);
  parent.children[final] = { type: "file", kind: "link", content: item.url, mime: item.mime };
  markDirty();
  refreshFilesViews();
  for (const w of windows.values())
    if ((w.appId === "music" || w.appId === "videos") && w.api.refresh) w.api.refresh();
  return dir + "/" + final;
}

      if (n.type === "dir"){
        tr.ondragover = e => {
          if (dragging.length && !dragging.includes(path)){ e.preventDefault(); tr.classList.add("dropping"); }
        };
        tr.ondragleave = () => tr.classList.remove("dropping");
        tr.ondrop = e => { e.preventDefault(); tr.classList.remove("dropping"); dropOnto(path); };
      }
      tbody.appendChild(tr);
    });
    if (!names.length){
      const tr = el("tr"), td = el("td", "fm-empty", "This folder is empty");
      td.colSpan = 3;
      tr.appendChild(td); tbody.appendChild(tr);
    }
    btn("back").disabled = !history.length;
    btn("up").disabled = cwd === "/";
    win.setTitle(cwd === "/" ? "Computer" : baseName(cwd));
    refreshSel();
  }
  /* click, ctrl-click and shift-click, the way every file manager does it */
  function click(name, e){
    const names = listDir(node(cwd));
    if (e.shiftKey && anchor !== null){
      const a = names.indexOf(anchor), b = names.indexOf(name);
      if (a >= 0 && b >= 0){
        sel.clear();
        for (let i = Math.min(a, b); i <= Math.max(a, b); i++) sel.add(names[i]);
      }
    } else if (e.ctrlKey || e.metaKey){
      sel.has(name) ? sel.delete(name) : sel.add(name);
      anchor = name;
    } else {
      sel.clear();
      sel.add(name);
      anchor = name;
    }
    refreshSel();
  }
  function refreshSel(){
    $$("tr", tbody).forEach(tr => tr.classList.toggle("sel", sel.has(tr.dataset.name)));
    const dir = node(cwd);
    const count = dir ? Object.keys(dir.children).length : 0;
    if (sel.size === 1){
      const name = only(), n = dir.children[name];
      if (n){
        const size = nodeSize(n);
        status.textContent = '"' + name + '" selected \u00b7 ' + typeLabel(name, n) + (size == null ? "" : " \u00b7 " + fmtBytes(size));
        return;
      }
    }
    if (sel.size > 1){
      let bytes = 0;
      for (const p of selPaths()){ const n = node(p); if (n && n.type === "file") bytes += nodeSize(n) || 0; }
      status.textContent = sel.size + " items selected" + (bytes ? " \u00b7 " + fmtBytes(bytes) : "");
      return;
    }
    status.textContent = count + (count === 1 ? " item" : " items") + " \u00b7 " + tilde(cwd) +
      (Clip.paths.length ? "  \u00b7  " + Clip.paths.length + " on the clipboard (" + Clip.mode + ")" : "");
  }
  function activate(name){
    const path = absPath(name, cwd);
    const n = node(path);
    if (!n) return;
    if (n.type === "dir") go(path);
    else if (isHtml(name)) openInBrowser("box:" + path);
    else if (isAudio(name)) openAudio(path);
    else if (isVideo(name)) openImage(path);
    else if (n.kind === "text") openEditor(path);
    else if (fileIsImage(path)) openImage(path);
    else osAlert(name, "No preview available for this file type yet.\n\n" + fmtBytes(nodeSize(n)) + " \u00b7 " + (n.mime || "unknown"));
  }

  /* ---- clipboard and moving ---- */
  function doCopy(){
    if (!sel.size) return;
    Clip.mode = "copy"; Clip.paths = selPaths();
    draw();
  }
  function doCut(){
    if (!sel.size) return;
    Clip.mode = "cut"; Clip.paths = selPaths();
    draw();
  }
  function doPaste(){
    if (!Clip.paths.length) return;
    const done = [];
    for (const p of Clip.paths){
      const placed = Clip.mode === "cut" ? movePath(p, cwd) : copyPath(p, cwd);
      if (placed) done.push(placed);
    }
    if (Clip.mode === "cut"){ Clip.mode = null; Clip.paths = []; }
    sel = new Set(done);
    draw();
    refreshOtherFiles();
    if (done.length) status.textContent = done.length + " item(s) pasted into " + tilde(cwd);
  }
  function dropOnto(dirPath){
    const moving = dragging.slice();
    dragging = [];
    if (!moving.length) return;
    let n = 0;
    for (const p of moving) if (movePath(p, dirPath)) n++;
    draw();
    refreshOtherFiles();
    if (n) notify("Moved", n + " item" + (n === 1 ? "" : "s") + " into " + tilde(dirPath), "\uD83D\uDCC1");
  }
  function refreshOtherFiles(){
    for (const w of windows.values())
      if (w.appId === "files" && w !== win && w.api && w.api.refresh) w.api.refresh();
  }

  async function doRename(){
    const name = only();
    if (!name) return;
    const next = await osPrompt("Rename", 'New name for "' + name + '"', name);
    if (!next || next === name) return;
    if (next.includes("/")) return osAlert("Rename", "A name cannot contain a slash.");
    if (node(cwd).children[next]) return osAlert("Rename", next + " already exists here.");
    const oldPath = absPath(name, cwd);
    if (renamePath(oldPath, next)){
      if (editing && editing.path === oldPath){ editing.path = absPath(next, cwd); edName.textContent = next; }
      for (const sc of State.shortcuts) if (sc.kind === "path" && sc.target === oldPath){ sc.target = absPath(next, cwd); sc.label = next; }
      drawDesktop();
      sel = new Set([next]);
      draw();
    }
  }
  async function doDelete(permanent){
    if (!sel.size) return;
    const paths = selPaths();
    const label = paths.length === 1 ? '"' + baseName(paths[0]) + '"' : paths.length + " items";
    if (permanent){
      const ok = await osConfirm("Delete forever", "Permanently delete " + label + "?\n\nThis cannot be undone.", "Delete forever", true);
      if (!ok) return;
    }
    for (const p of paths){
      if (editing && (editing.path === p || editing.path.startsWith(p + "/"))) closeEditor(true);
      permanent ? removePath(p) : trashPath(p);
    }
    const gone = State.shortcuts.filter(sc => sc.kind === "path" && paths.some(p => sc.target === p || sc.target.startsWith(p + "/")));
    if (gone.length){
      State.shortcuts = State.shortcuts.filter(sc => !gone.includes(sc));
      drawDesktop();
      refreshSettings();
    }
    sel.clear();
    draw();
    refreshOtherFiles();
    if (!permanent) notify("Moved to Trash", label + " can be put back from Trash.", "\uD83D\uDDD1\uFE0F");
  }
  async function doNewDir(){
    const name = await osPrompt("New Folder", "Folder name", "Untitled Folder");
    if (!name) return;
    if (name.includes("/")) return osAlert("New Folder", "A folder name cannot contain a slash.");
    if (node(cwd).children[name]) return osAlert("New Folder", name + " already exists here.");
    ensureDir(absPath(name, cwd));
    sel = new Set([name]);
    draw();
  }
  async function doNewFile(){
    const name = await osPrompt("New File", "File name", "untitled.txt");
    if (!name) return;
    if (node(cwd).children[name]) return osAlert("New File", name + " already exists here.");
    writeFile(absPath(name, cwd), "", "text");
    sel = new Set([name]);
    draw();
    openEditor(absPath(name, cwd));
  }
  function ingest(files){
    if (!files.length) return;
    let pending = files.length;
    const added = [];
    Array.from(files).forEach(f => {
      const kind = kindFor(f.name, f.type || "");
      const r = new FileReader();
      r.onload = () => {
        const name = addUnique(cwd, f.name, r.result, kind, f.type || "application/octet-stream");
        if (name) added.push(name);
        if (--pending === 0) finish();
      };
      r.onerror = () => { if (--pending === 0) finish(); };
      if (kind === "text") r.readAsText(f); else r.readAsDataURL(f);
    });
    function finish(){
      sel = new Set(added);
      draw();
      notify("Import finished",
        added.length + " file" + (added.length === 1 ? "" : "s") + " added to " + tilde(cwd) +
        (added.some(isHtml) ? "\nDouble-click an HTML file to open it in Seahorse." : ""),
        "\uD83D\uDCE5");
    }
  }
  function doImport(){
    const inp = $("#importer");
    inp.value = "";
    inp.onchange = () => { const f = Array.from(inp.files || []); inp.onchange = null; ingest(f); };
    inp.click();
  }
  /* files dragged in from the real desktop */
  let dragDepth = 0;
  list.addEventListener("dragenter", e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes("Files")) return;
    e.preventDefault();
    if (++dragDepth === 1) drop.classList.add("on");
  });
  list.addEventListener("dragover", e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types).includes("Files")) e.preventDefault();
  });
  list.addEventListener("dragleave", () => { if (--dragDepth <= 0){ dragDepth = 0; drop.classList.remove("on"); } });
  list.addEventListener("drop", e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    dragDepth = 0;
    drop.classList.remove("on");
    ingest(e.dataTransfer.files);
  });

  /* ---- editor, with a Markdown preview ---- */
  function setDirty(d){ edit.classList.toggle("dirty", !!d); if (editing) editing.dirty = !!d; }
  function openEditor(path){
    const n = node(path);
    if (!n || n.type !== "file" || n.kind !== "text") return;
    editing = { path, orig: n.content, dirty: false };
    edName.textContent = baseName(path);
    edName.title = path;
    edArea.value = n.content;
    main.classList.add("editing");
    previewing = false;
    applyPreview();
    setDirty(false);

    refreshSel();
    setTimeout(() => edArea.focus(), 0);
  }
  function applyPreview(){
    const md = editing && /\.(md|markdown)$/i.test(editing.path);
    $('[data-e="preview"]', B).style.display = md ? "" : "none";
    edit.classList.toggle("previewing", previewing && md);
    $('[data-e="preview"]', B).classList.toggle("on", previewing && md);
    if (previewing && md) edView.innerHTML = markdownToHtml(edArea.value);
  }
  function updateEdInfo(){
    const v = edArea.value;
    edInfo.textContent = v.split("\n").length + " lines \u00b7 " + v.length + " chars \u00b7 " + (editing ? tilde(editing.path) : "");
  }
  function saveFile(){
    if (!editing) return;
    writeFile(editing.path, edArea.value, "text");
    editing.orig = edArea.value;
    setDirty(false);
    updateEdInfo();
    draw();
    status.textContent = "Saved " + tilde(editing.path);
  }
  async function closeEditor(force){
    if (editing && editing.dirty && !force){
      const ok = await osConfirm("Unsaved changes", baseName(editing.path) + " has unsaved changes.\n\nClose the editor and lose them?", "Discard", true);
      if (!ok) return;
    }
    editing = null;
    previewing = false;
    main.classList.remove("editing");
    edit.classList.remove("previewing");

  }
  edArea.addEventListener("input", () => {
    if (editing) setDirty(edArea.value !== editing.orig);
    updateEdInfo();
    if (previewing) applyPreview();
  });
  edArea.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); saveFile(); }
    if (e.key === "Tab"){
      e.preventDefault();
      const a = edArea.selectionStart, b = edArea.selectionEnd;
      edArea.value = edArea.value.slice(0, a) + "  " + edArea.value.slice(b);

      if (editing) setDirty(edArea.value !== editing.orig);
    }
  });
  $('[data-e="save"]',    B).onclick = saveFile;
  $('[data-e="revert"]',  B).onclick = () => { if (!editing) return; edArea.value = editing.orig; setDirty(false); updateEdInfo(); applyPreview(); };
  $('[data-e="close"]',   B).onclick = () => closeEditor();
  $('[data-e="preview"]', B).onclick = () => { previewing = !previewing; applyPreview(); };

  /* ---- menus, toolbar, keys ---- */
  function rowMenu(e, name){
    e.preventDefault(); e.stopPropagation();
    if (!sel.has(name)) click(name, {});
    const n = node(absPath(name, cwd));
    const many = sel.size > 1;
    const items = [{ icon: n.type === "dir" ? "\uD83D\uDCC2" : "\uD83D\uDCC4", label: many ? "Open " + sel.size + " items" : "Open",
                     run: () => Array.from(sel).forEach(activate) }];
    if (!many && n.type === "file" && n.kind === "text" && isHtml(name))
      items.push({ icon: "\u270F\uFE0F", label: "Edit source", run: () => openEditor(absPath(name, cwd)) });
    if (!many && n.type === "file" && n.kind === "text" && isHtml(name))
      items.push({ icon: "🧪", label: "Open in Playground", run: () => launch("playground", absPath(name, cwd)) },
                 { icon: "🛍️", label: "Install as app", run: () => storeInstallFromPath(absPath(name, cwd)) });
    items.push("-",
      { icon: "\u2702\uFE0F", label: "Cut",  run: doCut },
      { icon: "\uD83D\uDCCB", label: "Copy", run: doCopy },
      { icon: "\uD83D\uDCC4", label: "Paste", disabled: !Clip.paths.length, run: doPaste }, "-",
      { icon: "\u2B07\uFE0F", label: many ? "Save " + sel.size + " to your computer" : "Save to your computer",
        run: () => saveManyToComputer(selPaths()) });
    if (!many && n.type === "file" && n.kind === "image")
      items.push({ icon: "\uD83D\uDDBC\uFE0F", label: "Set as wallpaper", run: () => setWallpaperFrom(absPath(name, cwd)) });
    if (!many && n.type === "file" && isVideo(name))
      items.push({ icon: "\uD83C\uDFAC", label: "Set as wallpaper", run: () => setWallpaperFrom(absPath(name, cwd)) },
                  { icon: "\u23FB", label: "Set as boot screen", run: () => setBootFrom(absPath(name, cwd)) });
    if (!many && n.type === "file" && (isVideo(name) || isAudio(name) || n.kind === "image"))
      items.push({ icon: "🎬", label: "Movie mode", run: () => movieMode(absPath(name, cwd)) });
    items.push("-");
    if (!many) items.push({ icon: "\uD83D\uDCCC", label: "Add to Desktop", run: () => addPathShortcut(absPath(name, cwd)) },
                          { icon: "\u270F\uFE0F", label: "Rename\u2026", run: doRename });
    items.push({ icon: "\uD83D\uDDD1\uFE0F", label: many ? "Move " + sel.size + " to Trash" : "Move to Trash", run: () => doDelete(false) });
    showCtx(e.clientX, e.clientY, items);
  }
  list.addEventListener("contextmenu", e => {
    if (e.target.closest("tr[data-name]")) return;
    e.preventDefault(); e.stopPropagation();
    sel.clear(); refreshSel();
    showCtx(e.clientX, e.clientY, [
      { icon: "\uD83D\uDCC1", label: "New Folder\u2026", run: doNewDir },
      { icon: "\uD83D\uDCC4", label: "New File\u2026",   run: doNewFile },
      "-",
      { icon: "\uD83D\uDCC4", label: "Paste", disabled: !Clip.paths.length, run: doPaste },
      { icon: "\uD83D\uDCE5", label: "Import\u2026",     run: doImport },
      { icon: "\uD83D\uDCCC", label: "Add folder to Desktop", run: () => addPathShortcut(cwd) },
      { icon: "\uD83D\uDD04", label: "Refresh",          run: draw }
    ]);
  });
  btn("back").onclick    = () => { const p = history.pop(); if (p != null) go(p, true); };
  btn("up").onclick      = () => go(dirName(cwd));
  btn("newdir").onclick  = doNewDir;
  btn("newfile").onclick = doNewFile;
  btn("import").onclick  = doImport;

  B.addEventListener("keydown", e => {
    if (e.target === edArea) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "c"){ e.preventDefault(); return doCopy(); }
    if (mod && e.key.toLowerCase() === "x"){ e.preventDefault(); return doCut(); }
    if (mod && e.key.toLowerCase() === "v"){ e.preventDefault(); return doPaste(); }
    if (mod && e.key.toLowerCase() === "a"){
      e.preventDefault();
      sel = new Set(listDir(node(cwd)));
      return refreshSel();
    }
    if (e.key === "Enter" && sel.size){ e.preventDefault(); return Array.from(sel).forEach(activate); }
    if (e.key === "Delete" && sel.size){ e.preventDefault(); return doDelete(e.shiftKey); }
    if (e.key === "F2" && sel.size === 1){ e.preventDefault(); return doRename(); }
    if (e.key === "Backspace"){ e.preventDefault(); return go(dirName(cwd)); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const names = listDir(node(cwd));
      if (!names.length) return;
      const i = anchor ? names.indexOf(anchor) : -1;
      const next = names[clamp(i + (e.key === "ArrowDown" ? 1 : -1), 0, names.length - 1)];
      click(next, { shiftKey: e.shiftKey });
      anchor = next;
      const row = $('tr[data-name="' + next.replace(/"/g, '\\"') + '"]', tbody);
      if (row) row.scrollIntoView({ block: "nearest" });
    }
  });
  B.tabIndex = 0;

  if (startPath){
    const n = node(startPath);
    if (n) cwd = n.type === "dir" ? absPath(startPath) : dirName(startPath);
  }
  draw();
  if (startPath && node(startPath) && node(startPath).type === "file") activate(baseName(startPath));

  return {
    showTrash,
    refreshTrash(){ if (trashUi && main.classList.contains("trashing")) trashUi.refresh(); drawSideSoon(); },
    /* a file dragged in from another window lands in the folder on show */
    dropHere(paths){
      const wanted = paths.filter(p => dirName(p) !== cwd);
      if (!wanted.length) return;
      let n = 0;
      for (const p of wanted) if (movePath(p, cwd)) n++;
      draw();
      refreshOtherFiles();
      if (n) notify("Moved", n + " item" + (n === 1 ? "" : "s") + " into " + tilde(cwd), "\uD83D\uDCC1");
    },
    menus(){
      return {
        File: [
          { label: "New Folder…", run: doNewDir },
          { label: "New File…", run: doNewFile },
          "-",
          { label: "Import from computer…", run: doImport },
          { label: "Save to computer", run: () => saveManyToComputer(selPaths()), disabled: !sel.size },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        Edit: [
          { label: "Cut", run: doCut, disabled: !sel.size },
          { label: "Copy", run: doCopy, disabled: !sel.size },
          { label: "Paste", run: doPaste, disabled: !Clip.paths.length },
          "-",
          { label: "Rename…", run: doRename, disabled: sel.size !== 1 },
          { label: "Move to Trash", run: () => doDelete(false), disabled: !sel.size },
          "-",
          { label: "Select All", run: () => { sel = new Set(listDir(node(cwd))); refreshSel(); } }
        ],
        View: [
          { label: "Home", run: () => go(HOME) },
          { label: "Up one level", run: () => go(dirName(cwd)), disabled: cwd === "/" },
          { label: "Back", run: () => { const p = history.pop(); if (p != null) go(p, true); }, disabled: !history.length },
          "-",
          { label: "Refresh", run: draw }
        ]
      };
    },
    navigate: go,
    refresh: draw,
    reveal(path){
      const n = node(path);
      if (!n) return;
      if (n.type === "dir") go(path);
      else { go(dirName(path)); activate(baseName(path)); }
    },
    onClose(){
      if (editing && editing.dirty){
        osConfirm("Unsaved changes", baseName(editing.path) + " has unsaved changes.\n\nClose Files and lose them?", "Discard", true)
          .then(ok => { if (ok){ editing = null; win.close(); } });
        return false;
      }
      return true;
    }
  };
}

/* ============================================================
   11z. Tide - sites that will not open on their own

   Seahorse can only read sites that agree to be read, and almost none do.
   Tide is the way round that: a small server on a machine you own opens the
   connections, and Scramjet rewrites everything that comes back so the site
   works normally, scripts, logins and all.

   Three pieces, all from Mercury Workshop, sitting in tide/ next to
   index.html: Scramjet 2 itself (scram/), its controller (controller/),
   which runs the tide from this page with a small service worker beside it
   handing requests over, and libcurl (the transport that speaks to the
   server). The server address is an ordinary setting; the key is kept apart
   from settings, so a backup file never carries it.
   ============================================================ */
const TIDE_TOKEN_KEY = "boxos.tide";
const Tide = { token: "", ready: null, ctl: null };
try { if (localStorage.getItem("boxos.on") === "1") Tide.token = localStorage.getItem(TIDE_TOKEN_KEY) || ""; } catch (e){}

/* everything Tide needs sits beside index.html, wherever that is */
function tideBase(){ return location.pathname.replace(/[^/]*$/, ""); }
function tideHost(){
  return String(State.tideHost || "").trim().replace(/^[a-z]+:\/\//i, "").replace(/\/+$/, "");
}
function tideOn(){ return !!(Tide.token && tideHost()); }
function tideWisp(){
  const host = tideHost();
  const secure = location.protocol === "https:" || !/^(localhost|127\.|\[?::1)/i.test(host);
  return (secure ? "wss://" : "ws://") + host + "/wisp/" + encodeURIComponent(Tide.token) + "/";
}
function setTideToken(token){
  Tide.token = String(token || "").trim();
  Tide.ready = null;                 /* the next page reconnects with it */
  Tide.ctl = null;
  try {
    if (!Store.on){}
    else if (Tide.token) localStorage.setItem(TIDE_TOKEN_KEY, Tide.token);
    else localStorage.removeItem(TIDE_TOKEN_KEY);
  } catch (e){}
  refreshSettings();
}
/* a plain connection to the server, which is exactly what it checks for */
function tideTest(){
  return new Promise(resolve => {
    if (!tideOn()) return resolve({ ok: false, why: "Fill in the address and the key first." });
    let done = false;
    const finish = r => { if (!done){ done = true; resolve(r); } };
    let ws;
    try { ws = new WebSocket(tideWisp()); }
    catch (e){ return finish({ ok: false, why: "That address will not do - check it for typing mistakes." }); }
    const timer = setTimeout(() => { try { ws.close(); } catch (e){} finish({ ok: false, why: "No answer from " + tideHost() + ". Is the machine on?" }); }, 9000);
    ws.onopen = () => { clearTimeout(timer); try { ws.close(); } catch (e){} finish({ ok: true, why: tideHost() + " answered, and the key was accepted." }); };
    ws.onerror = ws.onclose = () => { clearTimeout(timer); finish({ ok: false, why: "Turned away. Check the key, and that this address is one the server allows." }); };
  });
}
/* Whether this browser can pass a stream from one page to another. Where it
   cannot - Firefox, as of now - each answer has to be downloaded whole
   before it is handed to the service worker. Pages are fine; video is not,
   because a video is fetched as an open-ended stream that never finishes. */
let tideStreams = null;
function tideCanStream(){
  if (tideStreams !== null) return tideStreams;
  try {
    const ch = new MessageChannel();
    const rs = new ReadableStream();
    ch.port1.postMessage(rs, [rs]);
    tideStreams = true;
  } catch (e){ tideStreams = false; }
  return tideStreams;
}
const SCRIPTS = new Map();
function loadScriptOnce(src, why){
  if (!SCRIPTS.has(src)) SCRIPTS.set(src, new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => ok();
    s.onerror = () => { SCRIPTS.delete(src); fail(new Error(why || baseName(src) + " is missing. Upload the tide folder next to index.html.")); };
    document.head.appendChild(s);
  }));
  return SCRIPTS.get(src);

/* navigator.serviceWorker.ready only settles for a worker that covers the

   for a new tab - and Ctrl-, Shift- or middle-clicks - open in this frame,
   and a link that downloads puts its file in Downloads. */
function tideKeepInFrame(f){
  const patch = () => {
    let win, doc;
    try { win = f.element.contentWindow; doc = win.document; } catch (e){ return; }
    if (!win || !doc || win.__tideKeep) return;
    if (!String(win.location.href).startsWith(f.prefix)) return;
    win.__tideKeep = true;
    /* the real address a link points at, however it is written */
    const realUrl = raw => {
      let url = null;
      try {
        const abs = new URL(String(raw), win.location.href).href;
        url = abs.startsWith(f.prefix) ? f.decode(abs) : new URL(String(raw), f.decode(win.location.href)).href;
      } catch (e){ return null; }
      return /^https?:/i.test(url) ? url : null;
    };
    const opensElsewhere = target => !!target && !/^_(self|parent|top)$/i.test(target);
    win.open = function (url){
      const real = url === undefined || url === null || String(url) === "" ? null : realUrl(url);
      if (real) f.go(real);
      return null;
    };
    catchDownloads(win, raw => {
      const u = String(raw || "");
      return /^(blob|data):/i.test(u) ? "" : (realUrl(u) || "");
    });
    const onClick = e => {
      const a = e.target && e.target.closest && e.target.closest("a[href], area[href]");
      if (!a || a.hasAttribute("download")) return;
      const extra = e.type === "auxclick" ? e.button === 1 : (e.ctrlKey || e.metaKey || e.shiftKey);
      if (!extra && !opensElsewhere(a.getAttribute("target"))) return;
      const real = realUrl(a.getAttribute("href"));
      if (!real) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      f.go(real);
    };
    doc.addEventListener("click", onClick, true);
    doc.addEventListener("auxclick", onClick, true);
    doc.addEventListener("submit", e => {
      const form = e.target;
      const by = e.submitter;
      if (by && opensElsewhere(by.getAttribute("formtarget"))) by.setAttribute("formtarget", "_self");
      if (form && opensElsewhere(form.getAttribute("target"))) form.setAttribute("target", "_self");
    }, true);
  };
  f.element.addEventListener("load", patch);
  /* a frame that has been taken off the page is finished with for good */
  let seen = false;
  const timer = setInterval(() => {
    if (f.element.isConnected){ seen = true; patch(); }
    else if (seen) clearInterval(timer);
  }, 500);
}
/* Links that download - <a download>, and the files pages make on the spot
   (blob: and data: links, the way converters and "save" buttons work) - are
   fetched inside the page and saved into Downloads. That covers a link that
   is clicked, and one a script makes and clicks without ever showing it. */
function catchDownloads(win, sourceOf){
  const take = a => {
    const href = a.getAttribute("href");
    if (!href) return false;
    let abs;
    try { abs = new URL(href, win.location.href).href; } catch (e){ return false; }
    const given = String(a.getAttribute("download") || "").trim();
    notify("Downloading", given || downloadName(sourceOf(abs) || abs, ""), "\u2B07\uFE0F");
    win.fetch(abs).then(r => r.blob())
      .then(b => saveDownload(b, sourceOf(abs) || "", given || undefined))
      .catch(() => notify("Download failed", "That file would not come.", "\u26A0\uFE0F"));
    return true;
  };
  const isDl = a => a && a.hasAttribute && a.hasAttribute("download") && a.getAttribute("href");
  win.document.addEventListener("click", e => {
    const a = e.target && e.target.closest && e.target.closest("a[href]");
    if (!isDl(a)) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    take(a);
  }, true);
  try {
    const A = win.HTMLAnchorElement.prototype;
    const click = A.click, dispatch = win.EventTarget.prototype.dispatchEvent;
    A.click = function (){ if (isDl(this) && !this.isConnected){ take(this); return; } return click.apply(this, arguments); };
    win.EventTarget.prototype.dispatchEvent = function (ev){
      if (ev && ev.type === "click" && win.HTMLAnchorElement && this instanceof win.HTMLAnchorElement && isDl(this) && !this.isConnected){

/* A file a proxied page hands over. It is read here and saved into Downloads,

async function tideDownload(dl){
  const name = dl.filename || downloadName(dl.url || "", dl.type || "");
  if (dl.length && dl.length > DOWNLOAD_MAX){
    try { await dl.body.cancel(); } catch (e){}
    return notify("Too big to download", name + " is " + fmtBytes(dl.length) + ".", "⚠️");
  }
  notify("Downloading", name, "⬇️");
  const parts = [];
  let size = 0;
  try {
    const reader = dl.body.getReader();
    for (;;){
      const { done, value } = await reader.read();
      if (done) break;
      size += value.byteLength;
      if (size > DOWNLOAD_MAX){
        try { await reader.cancel(); } catch (e){}
        return notify("Too big to download", name + " went over " + fmtBytes(DOWNLOAD_MAX) + ".", "⚠️");
      }
      parts.push(value);
    }
  } catch (err){
    return notify("Download failed", name + " stopped partway.", "⚠️");
  }
  await saveDownload(new Blob(parts, { type: dl.type || "application/octet-stream" }), dl.url || "", name);

/* A small session cache so going back, or revisiting a page, is instant

const PageCache = {

  map: new Map(),
  get(url){
    const hit = this.map.get(url);
    if (!hit) return null;
    this.map.delete(url);        /* re-insert so the freshest stays longest */
    this.map.set(url, hit);

  },
  put(url, body){
    if (!body || body.length > this.maxBytes) return;

    while (this.map.size > this.max) this.map.delete(this.map.keys().next().value);

  clear(){ this.map.clear(); }

  try { return DOWNLOAD_EXT.includes(extOf(new URL(url).pathname)); } catch (e){ return false; }

async function saveDownload(blob, url, given){
  const name = downloadName(url, blob.type, given);
  if (blob.size > DOWNLOAD_MAX){
    notify("Too big to download", name + " is " + fmtBytes(blob.size) + ". SEA OS keeps downloads under " +
           fmtBytes(DOWNLOAD_MAX) + ".", "⚠️");
    return null;
  }
  try {
    const dir = HOME + "/Downloads";
    ensureDir(dir);
    const mime = String(blob.type || "").split(";")[0].trim();
    const kind = kindFor(name, mime);
    const content = kind === "text"
      ? await blob.text()
      : await new Promise((done, fail) => {
          const r = new FileReader();
          r.onload = () => done(r.result);
          r.onerror = () => fail(r.error);
          r.readAsDataURL(blob);
        });
    const final = addUnique(dir, name, content, kind, mime);
    if (!final) throw new Error("Downloads would not take the file");
    refreshFilesViews();
    notify("Downloaded", final + " (" + fmtBytes(blob.size) + ") is in Downloads.", "⬇️");
    return dir + "/" + final;

    notify("Download failed", name + " could not be saved (" + ((err && err.message) || err) + ").", "⚠️");
    return null;

      if (!res.ok) return notify("Download failed", name + ": the site answered " + res.status + ".", "\u26A0\uFE0F");

      if (!given && !isFileResponse(res.headers.get("content-type"), url)) return go({ kind: "web", url });
      await saveDownload(await res.blob(), url, given);
    } catch (err){
      notify("Download failed", name + " would not come - that site does not let other pages fetch its files.", "\u26A0\uFE0F");
    }
  }
  function showPage(body, t, host){
    /* an empty answer is a site checking for a real browser, not a blank page */
    if (!body.trim())
      return errorPage(host + " sent back nothing",
        host + " answered, but with an empty page. That is usually a check that only lets real browsers through.", t);
    if (!looksScriptBuilt(body)) return mountFrame(webDocument(body, t.url));
    const p = page();
    const h = el("div", "hero");
    h.append(el("div", "wb-sad", "{ }"), el("h1", null, host + " builds itself with JavaScript"),
      el("p", null, "The page arrived, but it is almost all script and hardly any text. Sites like this put " +
                    "themselves together after they load, using cookies and storage that a page inside SEA OS " +
                    "is not allowed to touch - so here they stay blank, however long you wait."));
    const anyway = el("button", "btn", "Show it anyway");
    anyway.style.cssText = "height:34px;margin:0 4px";
    anyway.onclick = () => mountFrame(webDocument(body, t.url));
    h.appendChild(anyway);
    if (!tideOn() && t && t.kind === "web")
      h.appendChild(el("p", null, brand("Tide opens sites like this one. It is set up on Settings \u203A Developer.")));
    p.appendChild(h);
  }

  /* <base> makes the page's own images and stylesheets load straight from the
     real site, and the click handler gives links
     back to Seahorse instead of the sandboxed frame trying to navigate. */
  function webDocument(body, url){
    const base = '<base href="' + url.replace(/"/g, "&quot;") + '">';
    const doc = /<head[^>]*>/i.test(body)
      ? body.replace(/<head[^>]*>/i, m => m + base)
      : "<!doctype html><html><head>" + base + "</head><body>" + body + "</body></html>";
    return /<\/body>/i.test(doc) ? doc.replace(/<\/body>/i, WIKI_NAV + "</body>") : doc + WIKI_NAV;
  }

  /* bookmarks live with your settings; history is per session */
  function targetLabel(t){
    if (!t) return "Start page";
    if (t.kind === "wiki") return t.title.replace(/_/g, " ");
    if (t.kind === "wikt") return t.title + " (definition)";
    if (t.kind === "local") return baseName(t.path);
    if (t.kind === "search") return t.q;
    if (t.kind === "so") return t.q + " (Stack Overflow)";
    if (t.kind === "sopost") return t.title;
    if (t.kind === "gh") return t.q + " (GitHub)";
    if (t.kind === "ghrepo") return t.repo;
    if (t.kind === "hn") return "Hacker News";
    if (t.kind === "bookmarks") return "Bookmarks";
    if (t.kind === "history") return "History";
    if (t.kind === "web") return t.url;
    return "Page";
  }
  const internal = t => !!t && (t.kind === "bookmarks" || t.kind === "history");
  /* the page's own name when it has told us one, otherwise its address */
  function niceTitle(){
    const t = active && active.title;
    return t && t !== "New tab" && t !== "Seahorse" && t !== brand("Seahorse") ? t : targetLabel(current);
  }
  function bookmarkThis(){
    if (!current || internal(current) || isBookmarked(current)) return;
    const label = niceTitle();
    State.bookmarks = (State.bookmarks || []).concat({ id: uid("bm"), label, t: current });
    saveSettings();
    refreshBrowserViews();
    notify("Bookmarked", label, "\u2B50");
  }
  function toggleStar(){
    if (!current || internal(current)) return;
    if (!isBookmarked(current)) return bookmarkThis();
    const k = tkey(current);
    State.bookmarks = (State.bookmarks || []).filter(b => tkey(b.t) !== k);
    saveSettings();
    refreshBrowserViews();
  }
  function deleteBookmark(b){
    State.bookmarks = (State.bookmarks || []).filter(x => x !== b);
    saveSettings();
    refreshBrowserViews();
  }
  function moveBookmark(b, d){
    const a = (State.bookmarks || []).slice(), i = a.indexOf(b);
    if (i < 0 || i + d < 0 || i + d >= a.length) return;
    a.splice(i + d, 0, a.splice(i, 1)[0]);
    State.bookmarks = a;
    saveSettings();
    refreshBrowserViews();
  }
  function bookmarkCtx(e, b){
    e.preventDefault();
    e.stopPropagation();
    const list = State.bookmarks || [], i = list.indexOf(b);
    showCtx(e.clientX, e.clientY, [
      { icon: "\u25B6", label: "Open", run: () => go(b.t) },
      { icon: "\u2795", label: "Open in a new tab", run: () => newTab(b.t) },
      "-",
      { icon: "\u270F\uFE0F", label: "Rename\u2026", run: () => renameBookmark(b) },
      { icon: "\u2190", label: "Move left", disabled: i <= 0, run: () => moveBookmark(b, -1) },
      { icon: "\u2192", label: "Move right", disabled: i >= list.length - 1, run: () => moveBookmark(b, 1) },
      "-",
      { icon: "\u2716", label: "Delete bookmark", run: () => deleteBookmark(b) }
    ]);
  }
  function drawBmBar(){
    bmbar.innerHTML = "";
    const show = State.bmBar !== false;
    bmbar.style.display = show ? "" : "none";
    if (!show) return;
    const list = State.bookmarks || [];
    if (!list.length){
      bmbar.appendChild(el("span", "wb-bm-none", "Bookmarks you save with \u2606 show up here."));
      return;
    }
    for (const b of list){
      const c = el("button", "wb-bm");
      c.append(el("span", "g", targetIcon(b.t)), el("span", "n", b.label));
      c.title = b.label + "\n" + targetLabel(b.t);
      c.onclick = e => (e.ctrlKey || e.metaKey) ? newTab(b.t) : go(b.t);
      c.onauxclick = e => { if (e.button === 1){ e.preventDefault(); newTab(b.t); } };

    }
  }
  function toggleBar(){
    State.bmBar = State.bmBar === false;
    saveSettings();
    refreshBrowserViews();
  }

  /* ---- the Bookmarks and History pages ---- */
  function mgrPage(title, icon){
    const p = page();
    p.classList.add("wb-mgr");
    const head = el("div", "wb-mgr-head");
    head.append(el("h1", null, icon + " " + title));
    const find = el("input", "wb-mgr-find");
    find.placeholder = "Search " + title.toLowerCase();
    find.spellcheck = false;
    head.appendChild(find);
    const list = el("div", "wb-mgr-list");

  function mgrRow(t, title, sub, when, onX, xTitle){
    const r = el("div", "wb-mgr-row");
    if (when != null) r.appendChild(el("span", "wb-mgr-when", when));
    r.appendChild(el("span", "g", targetIcon(t)));
    const txt = el("div", "wb-mgr-txt");
    txt.append(el("div", "n", title), el("div", "d", sub));
    r.appendChild(txt);
    r.onclick = e => (e.ctrlKey || e.metaKey) ? newTab(t) : go(t);
    r.onauxclick = e => { if (e.button === 1){ e.preventDefault(); newTab(t); } };
    if (onX){
      const x = el("button", "wb-mgr-x", "\u00D7");
      x.title = xTitle;
      x.onclick = e => { e.stopPropagation(); onX(); };
      r.appendChild(x);
    }
    return r;
  }
  function drawBookmarksPage(){
    setAddr("chalk:bookmarks");
    setTitle("Bookmarks");
    const m = mgrPage("Bookmarks", "\u2B50");
    const draw = () => {
      m.list.innerHTML = "";
      const all = State.bookmarks || [], q = m.find.value.trim().toLowerCase();
      const shown = all.filter(b => !q || (b.label + " " + targetLabel(b.t)).toLowerCase().includes(q));
      if (!shown.length){
        m.list.appendChild(el("div", "wb-none", all.length ? "Nothing matches that."
          : "No bookmarks yet. Press \u2606 at the end of the address bar, or Ctrl+D, to keep the page you are on."));
        return;
      }
      for (const b of shown){
        const r = mgrRow(b.t, b.label, targetLabel(b.t), null, () => deleteBookmark(b), "Delete bookmark");
        r.oncontextmenu = e => bookmarkCtx(e, b);
        m.list.appendChild(r);
      }
    };
    m.find.oninput = draw;
    m.head.appendChild(el("span", "wb-mgr-tip", "Right-click one to rename or move it"));
    draw();
    setTimeout(() => m.find.focus(), 30);
  }
  function drawHistoryPage(){
    setAddr("chalk:history");
    setTitle("History");
    const m = mgrPage("History", "\uD83D\uDD58");
    const clear = el("button", "btn", "Clear history");
    clear.onclick = async () => {
      if (!(await osConfirm("Clear history", "Forget every page ChalkBrowser has kept a note of?", "Clear", true))) return;
      State.webHistory = [];
      saveSettings();
      refreshBrowserViews();
    };
    m.head.appendChild(clear);
    const draw = () => {
      m.list.innerHTML = "";
      const all = State.webHistory || [], q = m.find.value.trim().toLowerCase();
      if (State.keepHistory === false)
        m.list.appendChild(el("div", "wb-none", "History is switched off in Settings, so nothing new is being kept."));
      const shown = all.filter(h => !q || ((h.title || "") + " " + targetLabel(h.t)).toLowerCase().includes(q));
      if (!shown.length){
        m.list.appendChild(el("div", "wb-none", all.length ? "Nothing matches that." : "Nowhere yet."));
        return;
      }
      const today = new Date().toDateString(), yday = new Date(Date.now() - 864e5).toDateString();
      let day = "";
      for (const h of shown.slice(0, 300)){
        const d = new Date(h.at), ds = d.toDateString();
        if (ds !== day){
          day = ds;
          m.list.appendChild(el("div", "wb-mgr-day", ds === today ? "Today" : ds === yday ? "Yesterday"
            : d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })));
        }
        m.list.appendChild(mgrRow(h.t, h.title || targetLabel(h.t), targetLabel(h.t),
          d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
          () => { State.webHistory = (State.webHistory || []).filter(x => x !== h); saveWebSoon(); draw(); },
          "Forget this one"));
      }
    };
    m.find.oninput = draw;
    draw();
    setTimeout(() => m.find.focus(), 30);
  }

  /* ---- the menu bar's lists ---- */
  function bookmarkMenu(){
    const items = [{ label: "Bookmark this page", run: bookmarkThis, disabled: !current || internal(current) || isBookmarked(current) }];
    const list = State.bookmarks || [];
    if (list.length){
      items.push("-");
      for (const b of list.slice(0, 12))
        items.push({ label: b.label.length > 42 ? b.label.slice(0, 42) + "\u2026" : b.label, run: () => go(b.t) });
    }
    items.push("-",

    return items;
  }
  function historyMenu(){
    const list = (State.webHistory || []).slice(0, 12);
    const items = list.length
      ? list.map(h => { const l = h.title || targetLabel(h.t); return { label: l.length > 46 ? l.slice(0, 46) + "\u2026" : l, run: () => go(h.t) }; })
      : [{ label: "Nowhere yet", disabled: true, run(){} }];
    items.push("-", { label: "Show all history", run: () => newTab({ kind: "history" }) });
    return items;
  }
  function moreMenu(){
    const r = bb("more").getBoundingClientRect();
    showCtx(r.right - 210, r.bottom + 4, [
      { icon: "\u2795", label: "New tab", run: () => newTab() },
      { icon: "\u21A9\uFE0F", label: "Reopen closed tab", disabled: !closed.length, run: reopenTab },
      "-",
      { icon: "\u2B50", label: "Bookmarks", run: () => newTab({ kind: "bookmarks" }) },
      { icon: "\uD83D\uDD58", label: "History", run: () => newTab({ kind: "history" }) },
      { icon: "\u2630", label: (State.bmBar !== false ? "Hide" : "Show") + " the bookmarks bar", run: toggleBar },
      "-",
      { icon: "\uD83D\uDCE5", label: "Downloads", run: () => { ensureDir(HOME + "/Downloads"); openInFiles(HOME + "/Downloads"); } },
      { icon: "\u2699\uFE0F", label: "Browser settings", run: () => { settingsPage = "browser"; const w = launch("settings"); if (w && w.api && w.api.refresh) w.api.refresh(); refreshSettings(); } }
    ]);
  }
  function seahorseMenus(){
    return {
      File: [
        { label: "New Tab", run: () => newTab() },
        { label: "Reopen Closed Tab", run: reopenTab, disabled: !closed.length },
        { label: "Close Tab", run: () => closeTab(active), disabled: tabs.length < 2 },
        "-",
        { label: brand("New Seahorse window"), run: () => launch("browser") },
        { label: "Open a page from Files\u2026", run: async () => {
            const p = await pickFile({ title: "Open a page", ok: "Open", start: HOME + "/Sites",
                                       accept: name => isHtml(name) });
            if (p) go("box:" + p);
          } },
        "-",
        { label: "Bookmark this page", run: bookmarkThis, disabled: !current || internal(current) || isBookmarked(current) },
        { label: "Save page text to Files", disabled: !current, run: savePageText },
        { label: "Show Downloads", run: () => { ensureDir(HOME + "/Downloads"); openInFiles(HOME + "/Downloads"); } },
        "-",
        { label: "Close Window", run: () => win.close() }
      ],
      Edit: [
        { label: "Copy address", run: () => { addr.select(); document.execCommand("copy"); } },
        { label: "Focus address bar", run: () => addr.focus() }
      ],
      View: [
        { label: "Start page", run: drawHome },
        { label: "Reload", run: () => { if (current) render(current); else drawHome(); } },
        "-",
        { label: "Back", run: () => { if (hi > 0){ hi--; render(hist[hi]); } }, disabled: hi <= 0 },
        { label: "Forward", run: () => { if (hi < hist.length - 1){ hi++; render(hist[hi]); } }, disabled: hi >= hist.length - 1 },
        "-",
        { label: "Bookmarks", run(){}, disabled: true },
        ...bookmarkMenu().slice(1),
        "-",
        { label: "History", run(){}, disabled: true },
        ...historyMenu()
      ]
    };
  }
  async function savePageText(){
    const frameDoc = frame && (() => { try { return frame.contentDocument; } catch (e){ return null; } })();
    let text = "";
    if (frameDoc && frameDoc.body) text = frameDoc.body.innerText;
    else text = stage.innerText || "";
    if (!text.trim()) return notify("Nothing to save", "This page has no text to keep.", "\u2139\uFE0F");
    const name = (targetLabel(current) || "page").replace(/[^\w -]+/g, "").slice(0, 40).trim() || "page";
    ensureDir(HOME + "/Documents");
    const saved = addUnique(HOME + "/Documents", name + ".txt", text, "text", "text/plain");
    notify("Saved to Files", "Documents/" + saved, "\uD83D\uDCC4");
  }

  /* links clicked inside a fetched article come back here as a message */
  const onMsg = e => {
    stash();
    const owner = tabs.find(t => t.frame && e.source === t.frame.contentWindow);
    if (!owner) return;
    const href = e.data && e.data.boxnav;
    if (!href) return;
    if (owner !== active) selectTab(owner);
    const title = wikiTitleFromHref(href);
    if (title){
      /* image pages and citation anchors are not somewhere to navigate to */
      if (/^(File|Image|Media):/i.test(title)) return;
      if (href.includes("#") && current && current.kind === "wiki" && current.title === title) return;
      return go({ kind: "wiki", title });
    }
    /* a relative link on a fetched page is relative to that page */
    let url = href;
    if (!/^https?:/i.test(url) && current && current.kind === "web"){
      try { url = new URL(href, current.url).href; } catch (err){ return; }
    }
    if (!/^https?:/i.test(url)) return;
    if (e.data.boxdl || looksLikeDownload(url)) return downloadInBackground(url, String(e.data.boxdl || "").trim());
    return go({ kind: "web", url });
  };
  addEventListener("message", onMsg);

  bb("back").onclick   = () => { if (hi > 0){ hi--; render(hist[hi]); } };
  bb("fwd").onclick    = () => { if (hi < hist.length - 1){ hi++; render(hist[hi]); } };
  function reload(){
    if (current && current.kind === "web") PageCache.map.delete(current.url);
    if (current) render(current); else drawHome();
  }
  bb("reload").onclick = reload;
  bb("star").onclick = toggleStar;
  bb("more").onclick = moreMenu;
  bb("home").onclick   = drawHome;
  /* as you type: what Enter will do, then bookmarks and places you have been */
  let sgItems = [], sgAt = 0;
  function hideSugg(){ sugg.classList.remove("on"); sgItems = []; }
  function suggest(){
    const raw = addr.value.trim(), q = raw.toLowerCase();
    const first = raw && resolve(raw);
    if (!first){ hideSugg(); return; }
    const eng = ENGINES[State.engine] || ENGINES.ddg;
    sgItems = [{ t: first, n: first.kind === "search" ? raw : targetLabel(first),
                 d: first.kind === "search" ? "Search with " + eng.name : "Go there", icon: first.kind === "search" ? "\uD83D\uDD0D" : "\u2197\uFE0F" }];
    const seen = new Set([tkey(first)]);
    const add = (t, title, icon) => {
      const k = tkey(t);
      if (seen.has(k) || sgItems.length >= 8) return;
      if (!((title || "") + " " + targetLabel(t)).toLowerCase().includes(q)) return;
      seen.add(k);
      sgItems.push({ t, n: title || targetLabel(t), d: targetLabel(t), icon });
    };
    for (const b of State.bookmarks || []) add(b.t, b.label, "\u2B50");
    for (const h of State.webHistory || []) add(h.t, h.title, "\uD83D\uDD58");
    sgAt = 0;
    if (sgItems.length < 2){ hideSugg(); return; }
    drawSugg();
  }
  function drawSugg(){
    sugg.innerHTML = "";
    sgItems.forEach((it, i) => {
      const r = el("div", "wb-sg" + (i === sgAt ? " on" : ""));
      r.append(el("span", "g", it.icon), el("span", "n", it.n), el("span", "d", it.d === it.n ? "" : it.d));
      r.onmousedown = e => { e.preventDefault(); pickSugg(i); };
      sugg.appendChild(r);
    });
    sugg.classList.add("on");
  }
  function pickSugg(i){
    const it = sgItems[i];
    hideSugg();
    if (!it) return;
    addr.blur();
    go(it.t);
  }
  addr.oninput = suggest;
  addr.onblur = () => setTimeout(hideSugg, 120);
  addr.onkeydown = e => {
    const open = sugg.classList.contains("on");
    if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")){
      e.preventDefault();
      sgAt = (sgAt + (e.key === "ArrowDown" ? 1 : -1) + sgItems.length) % sgItems.length;
      drawSugg();
      return;
    }
    if (e.key === "Escape" && open){ e.preventDefault(); e.stopPropagation(); hideSugg(); return; }
    if (e.key === "Enter" || e.key === "Return"){
      if (open && sgAt > 0) return pickSugg(sgAt);
      hideSugg();
      go(addr.value);
    }
  };
  addr.onfocus = () => addr.select();

  drawBmBar();
  const others = Array.from(windows.values()).some(w => w !== win && w.appId === "browser");
  const last = !startTarget && !others && State.webRestore !== false ? (State.webTabs || []).filter(Boolean) : [];
  if (last.length) restoreTabs(last); else newTab(startTarget);
  return {
    go, newTab, menus: seahorseMenus,
    refreshChrome(){ drawBmBar(); syncNav(); drawTabs(); if (internal(current)) render(current); },
    focusAddr(){ addr.focus(); addr.select(); },
    toggleStar, reopen: reopenTab, reload, toggleBar,
    showHistory: () => newTab({ kind: "history" }),
    showBookmarks: () => newTab({ kind: "bookmarks" }),
    selectIndex(n){ const t = n >= 9 ? tabs[tabs.length - 1] : tabs[n - 1]; if (t) selectTab(t); },
    back(){ if (hi > 0){ hi--; render(hist[hi]); } },
    fwd(){ if (hi < hist.length - 1){ hi++; render(hist[hi]); } },
    closeTab: () => closeTab(active),
    cycleTab(step){ const i = tabs.indexOf(active);
                    if (tabs.length > 1) selectTab(tabs[(i + step + tabs.length) % tabs.length]); },
    onClose(){ removeEventListener("message", onMsg); return true; }
  };
}

/* what this is running on, for neofetch and uname */
function browserName(){
  const u = navigator.userAgent;
  const m = /Edg\/([\d]+)/.exec(u) || /OPR\/([\d]+)/.exec(u) || /Firefox\/([\d]+)/.exec(u) ||
            /Chrome\/([\d]+)/.exec(u) || /Version\/([\d]+).*Safari/.exec(u);
  const name = /Edg\//.test(u) ? "Edge" : /OPR\//.test(u) ? "Opera" : /Firefox\//.test(u) ? "Firefox"
             : /Chrome\//.test(u) ? "Chrome" : /Safari\//.test(u) ? "Safari" : "a browser";
  return name + (m ? " " + m[1] : "");
}
function osName(){
  const u = navigator.userAgent;
  return /Windows NT 10/.test(u) ? "Windows 10/11" : /Windows/.test(u) ? "Windows" : /CrOS/.test(u) ? "ChromeOS"
       : /Android/.test(u) ? "Android" : /iPhone|iPad/.test(u) ? "iOS" : /Mac OS X/.test(u) ? "macOS" : /Linux/.test(u) ? "Linux" : "an unknown system";
}
function jsEngine(){
  const u = navigator.userAgent;
  return (/Firefox\//.test(u) ? "SpiderMonkey" : /Chrome\//.test(u) ? "V8" : /Safari\//.test(u) ? "JavaScriptCore" : "JavaScript") +
         " - " + (navigator.hardwareConcurrency || "?") + " threads";
}
function terminalApp(win){
  const B = win.body;
  B.innerHTML =
    '<div class="term-wrap"><div class="term-out"></div>' +
    '<div class="term-in-row"><span class="ps1"></span>' +
    '<input class="term-in" spellcheck="false" autocomplete="off" autocapitalize="off"></div></div>';
  const wrap = $(".term-wrap", B), ps1 = $(".ps1", B), inp = $(".term-in", B);
  /* A command writes to "out". That is the screen, except in the middle of a
     pipe or a redirect, when it is a box whose text goes on to the next
     command or into a file. Errors always go to the screen. */
  const screen = $(".term-out", B);
  let out = screen;
  const who = () => "box@" + theBrand().host;
  const TERM_THEMES = ["classic", "green", "amber", "ocean", "paper"];
  function applyLook(){
    for (const t of TERM_THEMES) B.classList.toggle("term-" + t, (State.termTheme || "classic") === t);
    wrap.style.fontSize = (Number(State.termFont) || 13) + "px";
  }
  applyLook();

  let cwd = HOME;
  const hist = [];
  let hi = 0;

  const scroll = () => { wrap.scrollTop = wrap.scrollHeight; };
  function line(parts, cls){
    const row = el("div", "term-row" + (cls ? " " + cls : ""));
    if (typeof parts === "string") row.textContent = parts;
    else for (const [txt, c] of parts) row.appendChild(el("span", c || null, txt));
    brandTree(row);
    out.appendChild(row);
    return row;
  }
  function block(text, cls){
    const pre = el("div", cls || null);
    pre.style.whiteSpace = "pre-wrap";
    pre.textContent = brand(text);
    out.appendChild(pre);
  }
  let failed = false;
  const err = m => { failed = true; const o = out; out = screen; line([[m, "t-err"]]); out = o; };
  /* text as it is - a file's contents are never renamed by the brand pass */
  function plain(text){
    const pre = el("div");
    pre.style.whiteSpace = "pre-wrap";
    pre.textContent = String(text).replace(/\n$/, "");
    out.appendChild(pre);
  }
  /* what a filter reads: the files it is given, or what was piped into it */
  function input(args, stdin, cmd){
    const files = args.filter(x => !/^-/.test(x));
    if (!files.length){
      if (stdin == null){ err(cmd + ": give it a file, or pipe something into it"); return null; }
      return stdin;
    }
    let text = "";
    for (const f of files){
      const n = node(absPath(f, cwd));
      if (!n){ err(cmd + ": " + f + ": no such file or directory"); continue; }
      if (n.type === "dir"){ err(cmd + ": " + f + ": is a directory"); continue; }
      if (n.kind !== "text"){ err(cmd + ": " + f + ": binary file"); continue; }
      text += n.content.endsWith("\n") || !n.content ? n.content : n.content + "\n";
    }
    return text;
  }
  const linesOf = t => String(t).replace(/\n$/, "").split("\n");
  /* -n 5, -n5 and -5 all mean five */
  function countFlag(args, dflt){
    for (let i = 0; i < args.length; i++){
      const a = args[i];
      if (a === "-n" && args[i + 1] != null){ const v = parseInt(args[i + 1], 10); args.splice(i, 2); return isNaN(v) ? dflt : v; }
      const m = /^-n?(\d+)$/.exec(a);
      if (m){ args.splice(i, 1); return parseInt(m[1], 10); }
    }
    return dflt;
  }

  function drawPs1(){
    ps1.innerHTML = "";
    ps1.append(el("span", "ps1-u", who()), el("span", "ps1-s", ":"),
               el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "));
  }
  function refreshFiles(){

      if (w.appId === "files" && w.api && w.api.navigate) w.api.navigate(".", true);
  }

  const CMDS = {
    help(a){
      const text =
"Files\n" +
"  ls [-l] [-a] [path]  list a directory      cd [path]         change directory\n" +

"\n" +
"Text - these read files, or whatever is piped into them\n" +

"\n" +
"The desktop\n" +
"  open <path>           in the right app     edit <file>       in the Files editor\n" +
"  play <song>           a file, or words     web <url|words>   in Seahorse\n" +
"  wget <url> [-O name]  download into ~/Downloads\n" +

"  launch <app>          start an app         apps              list them\n" +
"  shortcut <thing>      put it on the desktop notify <text>    raise a notification\n" +
"  wallpaper <file>      bootscreen <file>    backup            theme [light|dark]\n" +
"\n" +
"This terminal\n" +
"  termtheme [classic|green|amber|ocean|paper]  fontsize [10-24]   clear   exit\n" +
"  neofetch   uname [-a]   whoami   date   uptime   history   help <command>\n" +
"\n" +
"Put | between commands to pipe:    ls ~/Music | grep -i mp3 | wc -l\n" +
"> writes to a file, >> adds to it: ls > list.txt     echo more >> list.txt\n" +
"; runs the next command anyway, && only if the last one worked.\n" +

      if (a && a[0]){
        const want = a[0].toLowerCase();
        const hits = text.split("\n").filter(l => new RegExp("(^|\\s)" + want.replace(/[^\w]/g, "") + "(\\s|$|\\[|<)").test(l));
        if (hits.length) return block(hits.join("\n"));
        return err("help: nothing on " + a[0]);
      }
      block(text);
    },

    history(){ hist.forEach((h, i) => line(String(i + 1).padStart(4) + "  " + h)); },
    apps(){
      for (const id in APPS)
        if (!APPS[id].hidden) line([[id.padEnd(12), "t-key"], [APPS[id].name + " - " + APPS[id].desc, ""]]);
    },
    uname(a){ line(a[0] === "-a" ? "SEA OS " + theBrand().host + " " + VERSION + " single-file " + (navigator.platform || "web") + " " + browserName() : "SEA OS"); },
    theme(a){
      const t = (a[0] || "").toLowerCase();
      const next = (t === "l" || t === "light") ? "light" : (t === "d" || t === "dark") ? "dark" : (State.theme === "dark" ? "light" : "dark");
      setTheme(next, $("#traytheme"));

  CMDS.mv = function(a){

    const dest = absPath(a[a.length - 1], cwd);
    const srcs = a.slice(0, -1).map(x => absPath(x, cwd));
    const destNode = node(dest);
    if (srcs.length > 1 && (!destNode || destNode.type !== "dir"))
      return err("mv: " + a[a.length - 1] + ": not a directory");
    for (const src of srcs){
      if (!node(src)){ err("mv: " + tilde(src) + ": no such file or directory"); continue; }
      if (destNode && destNode.type === "dir"){
        if (!movePath(src, dest)) err("mv: cannot move " + tilde(src) + " in there");
      } else {
        if (!node(dirName(dest))){ err("mv: no such directory"); continue; }
        const moved = movePath(src, dirName(dest));
        if (moved) renamePath(dirName(dest) + "/" + moved, baseName(dest));
        else err("mv: cannot move " + tilde(src));

  CMDS.unbox = async function(a, raw){
    const words = raw.trim();
    if (!words || words === "help"){
      block(
"unbox - bring music, video and pictures in from the open web\n\n" +
"  unbox <words>            find audio and install the best match\n" +
"  unbox search <words>     list what is out there, without installing\n" +
"  unbox video <words>      look for video\n" +
"  unbox image <words>      look for pictures\n" +
"  unbox search video <w>   the words above combine, in any order\n" +
"  unbox list               what you have brought in so far\n" +
"  unbox remove <words>     take one back out\n\n" +
"Sources are Openverse (which covers Jamendo, Freesound and ccMixter),\n" +
"Wikimedia Commons and the Internet Archive. Everything is freely licensed.\n" +
"Files are linked rather than copied - they play straight from the source\n" +
"and use none of your storage.");
      return;
    }
    /* Leading words choose the mode and the kind, in whatever order, and the
       rest is the search. Only leading ones count, so "unbox video game
       music" still searches video for "game music" rather than guessing. */
    let mode = "install", kind = "audio";
    const tokens = words.split(/\s+/);
    while (tokens.length){
      const t = tokens[0].toLowerCase();
      if (t === "search" || t === "find") mode = "search";
      else if (t === "list") mode = "list";
      else if (t === "remove" || t === "rm") mode = "remove";
      else if (t === "video" || t === "videos" || t === "film") kind = "video";
      else if (t === "image" || t === "images" || t === "picture" || t === "pictures") kind = "image";
      else if (t === "audio" || t === "music" || t === "song" || t === "songs") kind = "audio";
      else break;
      tokens.shift();
    }
    const query = tokens.join(" ");
    const kindWord = kind === "audio" ? "" : kind + " ";

    if (mode === "list"){
      const have = unboxInstalled();
      if (!have.length) return line([["nothing brought in yet", "t-dim"]]);
      have.forEach(h => line([[tilde(h.path), ""],
                              ["  " + (h.url.match(/\/\/([^/]+)/) || [, "?"])[1], "t-dim"]]));
      line([[have.length + " item(s)", "t-dim"]]);
      return;
    }
    if (mode === "remove"){
      if (!query) return err("unbox remove: which one? try unbox list");
      const hit = unboxInstalled().find(h => h.name.toLowerCase().includes(query.toLowerCase()));
      if (!hit) return err("unbox remove: nothing matching " + query);
      removePath(hit.path);
      refreshFilesViews();
      for (const w of windows.values())
        if ((w.appId === "music" || w.appId === "videos") && w.api.refresh) w.api.refresh();
      return line([["removed ", "t-dim"], [hit.name, "t-ok"]]);
    }
    if (!query) return err("unbox: what should I look for?");

    line([["searching for ", "t-dim"], [query, "t-key"],
          [kind === "audio" ? "" : " (" + kind + ")", "t-dim"], ["\u2026", "t-dim"]]);
    let found;
    try { found = await unboxSearch(query, kind); }
    catch (e){ return err("unbox: could not reach the catalogues (" + e.name + ")"); }
    if (!found.length) return err("unbox: nothing found for " + query);

    const mins = s => s ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : "";
    if (mode === "search"){
      found.slice(0, 12).forEach((f, i) => {
        line([[String(i + 1).padStart(3) + "  ", "t-dim"],
              [f.title.length > 40 ? f.title.slice(0, 40) + "\u2026" : f.title, ""],
              ["  " + (f.seconds ? mins(f.seconds) : fmtBytes(f.bytes)), "t-dim"],
              ["  " + f.from + (f.license ? " " + f.license : ""), "t-img"]]);
      });
      line([[found.length + " found - run ", "t-dim"],
            ["unbox " + kindWord + query, "t-key"], [" to install the first", "t-dim"]]);
      return;
    }
    const already = unboxInstalled().find(h => h.url === found[0].url);
    if (already) return line([["already here: ", "t-dim"], [tilde(already.path), "t-ok"]]);

    const at = unboxInstall(found[0], kind);
    const f = found[0];
    line([["installed ", "t-dim"], [baseName(at), "t-ok"],
          ["  " + (f.seconds ? mins(f.seconds) : fmtBytes(f.bytes)) + "  " + f.from +
           (f.license ? " " + f.license : ""), "t-dim"]]);
    if (found.length > 1)
      line([[found.length - 1 + " other matches - ", "t-dim"],
            ["unbox search " + kindWord + query, "t-key"]]);
    notify("Unboxed", baseName(at) + " is in " + tilde(dirName(at)) + ".", "\uD83D\uDCE6");
  };

  /* ---- text: the filters ---- */
  CMDS.grep = function(a, raw, stdin){
    const flags = a.filter(x => /^-[a-z]+$/.test(x)).join("");
    const rest = a.filter(x => !/^-[a-z]+$/.test(x));
    if (!rest.length) return err("grep: what should it look for?");
    const pat = rest.shift();
    const text = input(rest, stdin, "grep");
    if (text == null) return;
    let re;
    try { re = new RegExp(pat, flags.includes("i") ? "gi" : "g"); }
    catch (e){ re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), flags.includes("i") ? "gi" : "g"); }
    const invert = flags.includes("v"), num = flags.includes("n"), count = flags.includes("c");
    let hits = 0;
    linesOf(text).forEach((l, i) => {
      re.lastIndex = 0;
      const m = re.test(l);
      if (m === invert) return;
      hits++;
      if (count) return;
      const row = el("div");
      row.style.whiteSpace = "pre-wrap";
      if (num) row.appendChild(el("span", "t-dim", (i + 1) + ":"));
      if (invert) row.appendChild(document.createTextNode(l));
      else {
        re.lastIndex = 0;
        let at = 0, mm;
        while ((mm = re.exec(l)) && mm[0].length){
          row.appendChild(document.createTextNode(l.slice(at, mm.index)));
          row.appendChild(el("span", "t-hit", mm[0]));
          at = mm.index + mm[0].length;
        }
        row.appendChild(document.createTextNode(l.slice(at)));
      }
      out.appendChild(row);
    });
    if (count) line(String(hits));
    if (!hits) failed = true;             /* grep "fails" when nothing matched, so && stops */
  };

  CMDS.wc = function(a, raw, stdin){
    const flags = a.filter(x => /^-[lwc]+$/.test(x)).join("");
    const text = input(a.filter(x => !/^-[lwc]+$/.test(x)), stdin, "wc");
    if (text == null) return;
    const l = text ? linesOf(text).length : 0, w = (text.match(/\S+/g) || []).length, c = text.length;
    if (!flags) return line(String(l).padStart(7) + String(w).padStart(8) + String(c).padStart(9));
    line([flags.includes("l") ? l : null, flags.includes("w") ? w : null, flags.includes("c") ? c : null]
      .filter(x => x !== null).join(" "));

  CMDS.sort = function(a, raw, stdin){
    const flags = a.filter(x => /^-[rnu]+$/.test(x)).join("");
    const text = input(a.filter(x => !/^-[rnu]+$/.test(x)), stdin, "sort");
    if (text == null) return;
    let ls = linesOf(text);
    ls.sort(flags.includes("n") ? (x, y) => parseFloat(x) - parseFloat(y) : (x, y) => x.localeCompare(y, undefined, { numeric: true }));
    if (flags.includes("r")) ls.reverse();
    if (flags.includes("u")) ls = ls.filter((x, i) => ls.indexOf(x) === i);
    plain(ls.join("\n"));
  };
  CMDS.uniq = function(a, raw, stdin){
    const c = a.includes("-c");
    const text = input(a.filter(x => x !== "-c"), stdin, "uniq");
    if (text == null) return;
    const outl = [];
    for (const l of linesOf(text)){
      const last = outl[outl.length - 1];
      if (last && last.l === l) last.n++; else outl.push({ l, n: 1 });
    }
    plain(outl.map(x => (c ? String(x.n).padStart(7) + " " : "") + x.l).join("\n"));
  };

  /* ---- files: sizes and what things are ---- */
  const sizeOf = n => n.type === "dir" ? Object.values(n.children).reduce((t, c) => t + sizeOf(c), 0) : (nodeSize(n) || 0);
  CMDS.du = function(a){
    const p = absPath(a.find(x => !x.startsWith("-")) || ".", cwd), n = node(p);
    if (!n) return err("du: no such file or directory");

      for (const [sz, name, c] of rows) line([[fmtBytes(sz).padStart(10) + "  ", "t-dim"], [name + (c.type === "dir" ? "/" : ""), tint(name, c)]]);
    }

  };
  CMDS.df = async function(){
    const used = storageUsage() + (Disk.ok ? diskBytes() : 0);
    line([["Saving     ", "t-key"], [Store.on ? "on" : "off - everything resets when you reload", Store.on ? "t-ok" : "t-err"]]);
    line([["Kept in    ", "t-key"], [Store.on ? (Disk.ok ? "the browser's file storage (big files) and localStorage" : "localStorage") : "nowhere", ""]]);
    line([["Used       ", "t-key"], [fmtBytes(used) + ", " + countFiles() + " files", ""]]);

      const e = navigator.storage && navigator.storage.estimate && await navigator.storage.estimate();

  CMDS.stat = function(a){

  /* ---- the desktop from here ---- */
  CMDS.play = function(a, raw){

  CMDS.wget = async function(a){

  CMDS.bookmarks = function(a){

      ["  " + (b.t.url || b.t.kind), "t-dim"]]));

  CMDS.tide = async function(a){
