  /* ---- this terminal ---- */
  CMDS.termtheme = function(a){
    const t = (a[0] || "").toLowerCase();
    if (!t) return line([["themes: ", "t-dim"], [TERM_THEMES.join("  "), "t-key"], ["  (now " + (State.termTheme || "classic") + ")", "t-dim"]]);
    if (!TERM_THEMES.includes(t)) return err("termtheme: no theme called " + t);
    State.termTheme = t;
    saveSettings();
    for (const w of windows.values()) if (w.appId === "terminal" && w.api && w.api.look) w.api.look();
    line([["theme ", "t-dim"], [t, "t-ok"]]);
  };
  CMDS.fontsize = function(a){
    const n = parseInt(a[0], 10);
    if (!n) return line([["text is ", "t-dim"], [(Number(State.termFont) || 13) + "px", "t-ok"]]);
    State.termFont = Math.max(10, Math.min(24, n));
    saveSettings();
    for (const w of windows.values()) if (w.appId === "terminal" && w.api && w.api.look) w.api.look();
    line([["text is now ", "t-dim"], [State.termFont + "px", "t-ok"]]);
  };
  CMDS.ll = a => CMDS.ls(["-l"].concat(a));
  CMDS.man = CMDS.help;
  CMDS.dir = CMDS.ls;
  CMDS["?"] = CMDS.help;

  /* a command line can hold several commands: ";" runs the next one whatever
     happened, "&&" only if the one before it worked */
  function splitChain(s){
    const outp = [];
    let buf = "", sep = ";", quote = "";
    for (let i = 0; i < s.length; i++){
      const c = s[i];
      if (quote){ if (c === quote) quote = ""; buf += c; continue; }
      if (c === '"' || c === "'"){ quote = c; buf += c; continue; }
      if (c === "&" && s[i + 1] === "&"){ outp.push({ sep, text: buf.trim() }); buf = ""; sep = "&&"; i++; continue; }
      if (c === ";"){ outp.push({ sep, text: buf.trim() }); buf = ""; sep = ";"; continue; }
      buf += c;
    }
    outp.push({ sep, text: buf.trim() });
    return outp.filter(x => x.text);
  }
  /* the closest command by edit distance, for "did you mean"; swapped
     letters count as one slip, so "hlep" still finds "help" */
  function nearest(word){
    const dist = (a, b) => {
      const d = Array.from({ length: a.length + 1 }, (_, i) => [i].concat(new Array(b.length).fill(0)));
      for (let j = 0; j <= b.length; j++) d[0][j] = j;
      for (let i = 1; i <= a.length; i++)
        for (let j = 1; j <= b.length; j++){
          d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
          if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1])
            d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
        }
      return d[a.length][b.length];
    };
    let best = null, score = 99;
    for (const c of Object.keys(CMDS)){
      const n = dist(word.toLowerCase(), c);
      if (n < score){ score = n; best = c; }
    }
    return score <= (word.length <= 3 ? 1 : 2) ? best : null;
  }

  /* words, with "quoted phrases" kept together and the quotes taken off */
  function words(str){
    const w = [];
    let buf = "", quote = "", any = false;
    for (const c of str){
      if (quote){ if (c === quote) quote = ""; else buf += c; continue; }
      if (c === '"' || c === "'"){ quote = c; any = true; continue; }
      if (/\s/.test(c)){ if (buf || any) w.push(buf); buf = ""; any = false; continue; }
      buf += c;
    }
    if (buf || any) w.push(buf);
    return w;
  }
  /* where a character stands outside quotes */
  function unquoted(str, test){
    let quote = "";
    for (let i = 0; i < str.length; i++){
      const c = str[i];
      if (quote){ if (c === quote) quote = ""; continue; }
      if (c === '"' || c === "'"){ quote = c; continue; }
      if (test(c, i)) return i;
    }
    return -1;
  }
  function splitPipes(str){
    const parts = [];
    let rest = str, i;
    while ((i = unquoted(rest, c => c === "|")) >= 0){ parts.push(rest.slice(0, i)); rest = rest.slice(i + 1); }
    parts.push(rest);
    return parts.map(x => x.trim());
  }
  /* the text a command wrote, one line a row - a row of names, as ls makes, one name a line */
  function textOf(box){
    const ls = [];
    for (const row of box.children){
      const kids = Array.from(row.children);
      if (kids.length > 1 && kids.every(k => k.tagName === "SPAN" && k.style.marginRight)) ls.push(...kids.map(k => k.textContent));
      else ls.push(row.textContent.replace(/\n+$/, ""));
    }
    return ls.length ? ls.join("\n") + "\n" : "";
  }

  async function runOne(cmdline, stdin, capture){
    const argv = words(cmdline), cmd = argv[0];
    if (!cmd) return { ok: true, text: stdin || "" };
    const args = argv.slice(1), rest = args.join(" ");
    if (!CMDS[cmd]){
      err("bsh: command not found: " + cmd);
      const guess = nearest(cmd);
      const o = out; out = screen;
      if (guess) line([["Did you mean ", "t-dim"], [guess, "t-key"], ["?", "t-dim"]]);
      else line([["Type ", "t-dim"], ["help", "t-key"], [" for a list of commands.", "t-dim"]]);
      out = o;
      return { ok: false, text: "" };
    }
    failed = false;
    const box = capture ? el("div") : null;
    if (box) out = box;
    try { await CMDS[cmd](args, rest, stdin); }
    catch (e){ err(cmd + ": " + e.message); }
    finally { out = screen; }
    return { ok: !failed, text: box ? textOf(box) : "" };
  }
  /* a | b | c > file */
  async function runPipeline(text){
    const stages = splitPipes(text);
    let redirect = null;
    const lastI = stages.length - 1;
    const gt = unquoted(stages[lastI], c => c === ">");
    if (gt >= 0){
      const append = stages[lastI][gt + 1] === ">";
      const file = words(stages[lastI].slice(gt + (append ? 2 : 1))).join(" ");
      if (!file){ err("bsh: nothing after " + (append ? ">>" : ">")); return false; }
      redirect = { append, file };
      stages[lastI] = stages[lastI].slice(0, gt).trim();
    }
    let stdin = null, ok = true;
    for (let i = 0; i < stages.length; i++){
      const r = await runOne(stages[i], stdin, i < lastI || !!redirect);
      stdin = r.text;
      ok = r.ok;
    }
    if (redirect){
      const p = absPath(redirect.file, cwd);
      if (!node(dirName(p))){ err("bsh: " + redirect.file + ": no such directory"); return false; }
      const had = node(p);
      if (had && had.type === "dir"){ err("bsh: " + redirect.file + ": is a directory"); return false; }
      const before = redirect.append && had && had.kind === "text" ? had.content : "";
      writeFile(p, before + (stdin || ""), "text", "text/plain");
      refreshFiles();
    }
    return ok;
  }
  async function run(raw){
    let cmdline = raw.trim();
    /* !! repeats the last command and !3 the third, the way a real shell does */
    if (cmdline === "!!") cmdline = hist[hist.length - 1] || "";
    else if (/^!\d+$/.test(cmdline)) cmdline = hist[parseInt(cmdline.slice(1), 10) - 1] || "";
    const echoRow = el("div", "term-row");
    echoRow.append(el("span", "ps1-u", who()), el("span", "ps1-s", ":"),
                   el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "), el("span", null, cmdline));
    screen.appendChild(echoRow);
    if (!cmdline) return;
    hist.push(cmdline);
    hi = hist.length;
    let ok = true;
    for (const step of splitChain(cmdline)){
      if (step.sep === "&&" && !ok) continue;    /* the rest of this chain is skipped */
      if (step.sep === ";") ok = true;
      ok = await runPipeline(step.text);
      scroll();
    }
  }

  inp.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === "Return"){
      const v = inp.value;
      inp.value = "";
      run(v);
      drawPs1();
      scroll();
    } else if (e.key === "ArrowUp"){
      e.preventDefault();
      if (hi > 0){ hi--; inp.value = hist[hi] || ""; setTimeout(() => inp.setSelectionRange(999, 999), 0); }
    } else if (e.key === "ArrowDown"){
      e.preventDefault();
      if (hi < hist.length - 1){ hi++; inp.value = hist[hi] || ""; }
      else { hi = hist.length; inp.value = ""; }
    } else if (e.key === "Tab"){
      e.preventDefault();
      const value = inp.value;
      /* only the command being typed now - after the last |, ; or && */
      const cut = Math.max(value.lastIndexOf("|"), value.lastIndexOf(";"), value.lastIndexOf("&&") + 1);
      const seg = value.slice(cut + 1).replace(/^\s+/, "");
      const parts = seg.split(/\s+/);
      const word = parts[parts.length - 1] || "";
      const head = value.slice(0, value.length - word.length);
      let options;
      if (parts.length <= 1){
        options = Object.keys(CMDS).filter(c => c.startsWith(word)).sort();
      } else {
        /* complete a path: split off the directory already typed */
        const slash = word.lastIndexOf("/");
        const dirPart = slash >= 0 ? word.slice(0, slash + 1) : "";
        const stem = slash >= 0 ? word.slice(slash + 1) : word;
        const dir = node(absPath(dirPart || ".", cwd));
        if (!dir || dir.type !== "dir") return;
        options = listDir(dir)
          .filter(nm => nm.toLowerCase().startsWith(stem.toLowerCase()))
          .map(nm => dirPart + nm + (dir.children[nm].type === "dir" ? "/" : ""));
      }
      if (!options.length) return;
      /* one match completes, several fill in the shared start and are listed */
      let insert = options[0];
      if (options.length > 1){
        let prefix = options[0];
        for (const o of options) while (!o.toLowerCase().startsWith(prefix.toLowerCase())) prefix = prefix.slice(0, -1);
        insert = prefix.length >= word.length ? prefix : word;
        const row = el("div", "term-row");
        options.forEach(o => {
          const sp = el("span", o.endsWith("/") ? "t-dir" : null, o);
          sp.style.marginRight = "18px";
          row.appendChild(sp);
        });
        screen.appendChild(row);
        scroll();
      }
      inp.value = head + insert + (options.length === 1 && !insert.endsWith("/") ? " " : "");
      setTimeout(() => inp.setSelectionRange(999, 999), 0);
    } else if (e.ctrlKey && !e.altKey && !e.metaKey){
      /* the line-editing keys a real shell gives you */
      const k = (e.key || "").toLowerCase();
      const pos = inp.selectionStart;
      const put = (v, caret) => {
        inp.value = v;
        const c = caret === undefined ? v.length : caret;
        setTimeout(() => inp.setSelectionRange(c, c), 0);
      };
      if (k === "l"){ e.preventDefault(); screen.innerHTML = ""; }
      else if (k === "a"){ e.preventDefault(); inp.setSelectionRange(0, 0); }
      else if (k === "e"){ e.preventDefault(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      else if (k === "u"){ e.preventDefault(); put(inp.value.slice(pos), 0); }
      else if (k === "k"){ e.preventDefault(); put(inp.value.slice(0, pos), pos); }
      else if (k === "w"){
        e.preventDefault();
        const head = inp.value.slice(0, pos).replace(/\S+\s*$/, "");
        put(head + inp.value.slice(pos), head.length);
      }
      else if (k === "c" && !getSelection().toString()){
        /* nothing to copy, so treat it as abandoning the line */
        e.preventDefault();
        const row = el("div", "term-row");
        row.append(el("span", "ps1-u", who()), el("span", "ps1-s", ":"),
                   el("span", "ps1-p", tilde(cwd)), el("span", "ps1-s", "$ "),
                   el("span", null, inp.value + "^C"));
        screen.appendChild(row);
        inp.value = "";
        hi = hist.length;
        scroll();
      }
    }
  });
  wrap.addEventListener("pointerdown", e => {
    if (!e.target.closest("input") && !getSelection().toString()) setTimeout(() => inp.focus(), 0);
  });

  const motd = node("/etc/motd");
  block(motd ? motd.content : "SEA OS", "t-dim");
  line(Store.on
    ? [["  * Your files are saved in this browser (", "t-dim"], [State.storage === "local" ? "localStorage" : "file storage", "t-ok"], [").", "t-dim"]]
    : [["  * Saving is off, so nothing here survives a reload. Settings \u203A Storage turns it on.", "t-err"]]);
  line(" ");
  drawPs1();
  setTimeout(() => inp.focus(), 30);
  return {
    focusInput: () => inp.focus(),
    look: applyLook,
    /* a file dropped on the terminal types its path at the prompt */
    insert(text){
      inp.value += (inp.value && !/\s$/.test(inp.value) ? " " : "") + text;
      inp.focus();
      setTimeout(() => inp.setSelectionRange(inp.value.length, inp.value.length), 0);
    },
    menus(){
      return {
        File: [
          { label: "New Terminal", run: () => launch("terminal") },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        Edit: [
          { label: "Clear screen", run: () => { screen.innerHTML = ""; } },
          { label: "Copy", run: () => document.execCommand("copy") }
        ],
        View: [
          { label: "Go home", run: () => { cwd = HOME; drawPs1(); } },
          { label: "Show help", run: () => { run("help"); drawPs1(); scroll(); } },
          "-",
          ...TERM_THEMES.map(t => ({ label: (State.termTheme || "classic") === t ? "\u2022 " + t : "   " + t,
                                     run: () => { run("termtheme " + t); drawPs1(); scroll(); } })),
          "-",
          { label: "Bigger text", run: () => { run("fontsize " + ((Number(State.termFont) || 13) + 1)); drawPs1(); scroll(); } },
          { label: "Smaller text", run: () => { run("fontsize " + ((Number(State.termFont) || 13) - 1)); drawPs1(); scroll(); } }
        ]
      };
    }
  };
}

/* ============================================================
   12e. Trash - real, with restore, shown inside Files
   ============================================================ */
/* the Trash, drawn into the place Files keeps for it */
function trashView(B, setTitle){
  B.innerHTML =
    '<div class="fm-tb">' +
      '<span class="tr-count"></span><span class="ed-sp"></span>' +
      '<button class="tb-btn" data-t="restore" disabled>Put back</button>' +
      '<button class="tb-btn" data-t="del" disabled>Delete forever</button>' +
      '<button class="tb-btn" data-t="empty">Empty Trash</button>' +
    '</div>' +
    '<div class="fm-list"><table class="fm-tab">' +
      '<thead><tr><th>Name</th><th class="col-type">Was in</th><th class="col-size">Deleted</th></tr></thead><tbody></tbody>' +
    '</table></div>' +
    '<div class="fm-status"></div>';
  const tbody = $("tbody", B), status = $(".fm-status", B);
  let sel = null;

  function draw(){
    tbody.innerHTML = "";
    for (const t of Trash.items){
      const tr = el("tr");
      tr.dataset.id = t.id;
      const td = el("td", "col-name");
      td.append(el("span", "fi", nodeIcon(t.name, t.node)), document.createTextNode(t.name));
      tr.append(td, el("td", "col-type", tilde(t.from)), el("td", "col-size", fmtAgo(t.when)));
      if (t.id === sel) tr.classList.add("sel");
      tr.onclick = () => { sel = t.id; draw(); };
      tr.ondblclick = () => putBack(t.id);
      tbody.appendChild(tr);
    }
    if (!Trash.items.length){
      const tr = el("tr"), td = el("td", "fm-empty", "Trash is empty");
      td.colSpan = 3;
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
    $(".tr-count", B).textContent = Trash.items.length + (Trash.items.length === 1 ? " item" : " items");
    $('[data-t="restore"]', B).disabled = !sel;
    $('[data-t="del"]', B).disabled = !sel;
    $('[data-t="empty"]', B).disabled = !Trash.items.length;
    status.textContent = Trash.items.length
      ? Trash.items.length + " item(s) \u00b7 " + fmtBytes(trashBytes()) + " \u00b7 double-click to put something back"
      : "Nothing here. Deleted files land in Trash until you empty it.";
    setTitle("Trash" + (Trash.items.length ? " (" + Trash.items.length + ")" : ""));
  }
  function putBack(id){
    const to = restoreTrash(id);
    sel = null;
    draw();
    refreshFilesViews();
    if (to) notify("Put back", tilde(to), "\u21A9\uFE0F");
  }
  $('[data-t="restore"]', B).onclick = () => sel && putBack(sel);
  $('[data-t="del"]', B).onclick = async () => {
    const t = Trash.items.find(x => x.id === sel);
    if (!t) return;
    if (!(await osConfirm("Delete forever", "Permanently delete " + t.name + "?", "Delete forever", true))) return;
    Trash.items = Trash.items.filter(x => x.id !== sel);
    sel = null;
    saveTrash();
    draw();
  };
  $('[data-t="empty"]', B).onclick = async () => {
    if (!Trash.items.length) return;
    if (!(await osConfirm("Empty Trash", "Permanently delete all " + Trash.items.length + " item(s)?\n\nThis cannot be undone.", "Empty Trash", true))) return;
    emptyTrash();
    sel = null;
    draw();
  };
  draw();
  return { refresh: draw };
}

function openAudio(path){

/* ============================================================
   links Media can play: YouTube, and direct links to media files
   ============================================================ */
/* YouTube links arrive in every shape they get shared in */
function parseYouTube(raw){
  let u;
  try { u = new URL(String(raw || "").trim()); } catch (e){ return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, "");
  let id = null;
  const list = u.searchParams.get("list") || null;
  if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
  else if (host === "youtube.com" || host === "youtube-nocookie.com"){
    if (u.pathname === "/watch") id = u.searchParams.get("v");
    else {
      const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]+)/);
      if (m) id = m[1];
    }
  } else return null;
  if (id && !/^[\w-]{6,20}$/.test(id)) id = null;
  if (!id && !list) return null;
  return { id, list };
}
let youTubeApiLoading = null;
function loadYouTubeApi(){
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (!youTubeApiLoading){
    youTubeApiLoading = new Promise((ok, fail) => {
      const before = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (typeof before === "function") before(); ok(); };
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      s.onerror = () => { youTubeApiLoading = null; fail(new Error("YouTube's player would not load. Check you are online.")); };
      document.head.appendChild(s);
    });
  }
  return youTubeApiLoading;
}
/* YouTube lets any page ask for a video's title, channel and thumbnail */
async function youTubeInfo(url){
  try {
    const res = await fetch("https://www.youtube.com/oembed?format=json&url=" + encodeURIComponent(url));
    if (!res.ok) return null;
    const j = await res.json();
    return { title: j.title || "", author: j.author_name || "", thumb: j.thumbnail_url || "" };
  } catch (e){ return null; }
}
function rememberWebMedia(item){
  State.webMedia = [item].concat((State.webMedia || []).filter(x => x.url !== item.url)).slice(0, 60);
  saveSettings();

/* ---- video sites with a player of their own ----
   Each of these hands out a player that other pages are allowed to show.
   All a site needs here is a rule that turns the link people share into the
   address of that player. Anything not on the list is still tried: the page
   itself goes in a frame, which works for sites that allow it. */
const EMBED_SITES = [
  { name: "Vimeo", test(u, h){
      if (!/(^|\.)vimeo\.com$/.test(h)) return null;
      const m = u.pathname.match(/(?:^|\/)(\d{5,})(?:\/([0-9a-f]{6,}))?/);
      if (!m) return null;
      const hash = m[2] || u.searchParams.get("h");
      return "https://player.vimeo.com/video/" + m[1] + "?autoplay=1" + (hash ? "&h=" + hash : "");
    } },
  { name: "Dailymotion", test(u, h){
      let id = null;
      if (h === "dai.ly") id = u.pathname.slice(1);
      else if (/(^|\.)dailymotion\.com$/.test(h)){
        const m = u.pathname.match(/\/(?:embed\/)?video\/([a-z0-9]+)/i);
        id = m && m[1];
      }
      return id ? "https://www.dailymotion.com/embed/video/" + id + "?autoplay=1" : null;
    } },
  { name: "Twitch", test(u, h){
      /* Twitch insists on knowing which site shows it */
      const parent = "&parent=" + encodeURIComponent(location.hostname || "localhost");
      if (h === "clips.twitch.tv"){
        const slug = u.pathname.split("/").filter(Boolean).pop();
        return slug ? "https://clips.twitch.tv/embed?clip=" + encodeURIComponent(slug) + parent : null;
      }
      if (!/(^|\.)twitch\.tv$/.test(h)) return null;
      const seg = u.pathname.split("/").filter(Boolean);
      if (seg[0] === "videos" && seg[1]) return "https://player.twitch.tv/?video=v" + seg[1].replace(/^v/, "") + parent;
      if (seg[1] === "clip" && seg[2]) return "https://clips.twitch.tv/embed?clip=" + encodeURIComponent(seg[2]) + parent;
      if (seg.length === 1 && /^\w+$/.test(seg[0])) return "https://player.twitch.tv/?channel=" + seg[0] + parent;
      return null;
    } },
  { name: "Kick", test(u, h){
      if (!/(^|\.)kick\.com$/.test(h)) return null;
      const seg = u.pathname.split("/").filter(Boolean);
      return seg.length === 1 ? "https://player.kick.com/" + encodeURIComponent(seg[0]) : null;
    } },
  { name: "Streamable", test(u, h){
      if (!/(^|\.)streamable\.com$/.test(h)) return null;
      const seg = u.pathname.split("/").filter(Boolean);
      const id = seg[0] === "e" || seg[0] === "o" ? seg[1] : seg[0];
      return id ? "https://streamable.com/e/" + encodeURIComponent(id) : null;
    } },
  { name: "Internet Archive", test(u, h){
      if (!/(^|\.)archive\.org$/.test(h)) return null;
      const m = u.pathname.match(/^\/(?:details|embed)\/(.+)$/);
      return m ? "https://archive.org/embed/" + m[1] : null;
    } },
  { name: "Bilibili", test(u, h){
      if (!/(^|\.)bilibili\.com$/.test(h)) return null;
      const m = u.pathname.match(/\/video\/(BV\w+|av\d+)/i);
      if (!m) return null;
      return "https://player.bilibili.com/player.html?autoplay=1&" +
             (/^av/i.test(m[1]) ? "aid=" + m[1].slice(2) : "bvid=" + m[1]);
    } },
  { name: "Odysee", test(u, h){
      if (!/(^|\.)odysee\.com$/.test(h) || !u.pathname.startsWith("/@")) return null;
      return "https://odysee.com/$/embed" + u.pathname;
    } },
  { name: "Rumble", test(u, h){
      if (!/(^|\.)rumble\.com$/.test(h)) return null;
      const m = u.pathname.match(/^\/embed\/([\w]+)/);
      return m ? "https://rumble.com/embed/" + m[1] + "/?autoplay=2" : null;
    } },
  { name: "TED", test(u, h){
      if (!/(^|\.)ted\.com$/.test(h)) return null;
      const m = u.pathname.match(/^\/talks\/([\w-]+)/);
      return m ? "https://embed.ted.com/talks/" + m[1] : null;
    } },
  { name: "Loom", test(u, h){
      if (!/(^|\.)loom\.com$/.test(h)) return null;
      const m = u.pathname.match(/^\/(?:share|embed)\/([0-9a-f]+)/i);
      return m ? "https://www.loom.com/embed/" + m[1] : null;
    } },
  { name: "TikTok", test(u, h){
      if (!/(^|\.)tiktok\.com$/.test(h)) return null;
      const m = u.pathname.match(/\/video\/(\d+)/);
      return m ? "https://www.tiktok.com/player/v1/" + m[1] + "?autoplay=1" : null;
    } },
  { name: "Facebook", test(u, h){
      if (h !== "fb.watch" && !(/(^|\.)facebook\.com$/.test(h) && /\/(videos|watch|reel)\b/.test(u.pathname + u.search))) return null;
      return "https://www.facebook.com/plugins/video.php?show_text=false&autoplay=true&href=" + encodeURIComponent(u.href);
    } },
  { name: "PeerTube", test(u){
      /* PeerTube runs on thousands of servers, all with the same paths */
      const m = u.pathname.match(/^\/(?:w|videos\/watch|videos\/embed)\/([\w-]{6,})$/);
      return m ? u.origin + "/videos/embed/" + m[1] + "?autoplay=1" : null;
    } },
  { name: "Spotify", audio: true, test(u, h){
      if (!/(^|\.)spotify\.com$/.test(h)) return null;
      /* a playlist, an album, one song, a podcast - all the same shape */
      const m = u.pathname.match(/^\/(?:intl-[a-z]{2}\/)?(playlist|album|track|episode|show|artist)\/([A-Za-z0-9]+)/);
      return m ? "https://open.spotify.com/embed/" + m[1] + "/" + m[2] + "?utm_source=generator" : null;
    } },
  { name: "SoundCloud", audio: true, test(u, h){
      if (!/(^|\.)soundcloud\.com$/.test(h) || h.startsWith("w.")) return null;
      return "https://w.soundcloud.com/player/?auto_play=true&visual=true&url=" + encodeURIComponent(u.href);
    } }
];
function parseEmbed(raw){
  let u;
  try { u = new URL(String(raw || "").trim()); } catch (e){ return null; }
  if (!/^https?:$/.test(u.protocol)) return null;
  const host = u.hostname.replace(/^(www|m)\./, "").toLowerCase();
  for (const s of EMBED_SITES){
    const embed = s.test(u, host);
    if (embed) return { site: s.name, embed, audio: !!s.audio };
  }
  return null;
}
/* the player address for any web item, YouTube included */
function embedUrlOf(t){
  if (t.kind === "yt"){
    return t.id
      ? "https://www.youtube-nocookie.com/embed/" + t.id + "?autoplay=1&playsinline=1&rel=0" + (t.list ? "&list=" + encodeURIComponent(t.list) : "")
      : "https://www.youtube-nocookie.com/embed/videoseries?autoplay=1&list=" + encodeURIComponent(t.list);
  }
  return t.embed || t.url;
}
function siteOf(t){ return t.kind === "yt" ? "YouTube" : t.site || ""; }
/* A site's own player in a frame. It gets its own origin so it keeps its
   cookies and logins, but it may not steer SEA OS anywhere, and a page that
   is not a known player cannot open windows either. */
function webPlayerFrame(t){
  const f = document.createElement("iframe");
  f.src = embedUrlOf(t);
  f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  /* no popups: a player's "watch on the site" button stays put rather than opening a real tab */
  f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
  return f;
}
/* Title and picture for a link. noembed.com answers for hundreds of sites
   and only ever sees the link itself. */
async function webInfo(url){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 5000);
  try {
    const res = await fetch("https://noembed.com/embed?url=" + encodeURIComponent(url), { signal: ctl.signal });
    const j = await res.json();
    if (j.error) return null;
    return { title: j.title || "", author: j.author_name || j.provider_name || "", thumb: j.thumbnail_url || "" };
  } catch (e){ return null; } finally { clearTimeout(timer); }
}
/* Spotify names its own playlists, and hands over the cover picture with it */
async function spotifyInfo(url){
  try {
    const res = await fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(url));
    if (!res.ok) return null;
    const j = await res.json();

}
/* the Internet Archive is not on noembed, but describes its items itself */
async function archiveInfo(embed){
  const id = embed.replace(/^https:\/\/archive\.org\/embed\//, "").split("/")[0];
  try {
    const res = await fetch("https://archive.org/metadata/" + id + "/metadata");
    const j = await res.json();
    const m = j.result || {};
    const one = v => (Array.isArray(v) ? v[0] : v) || "";
    return { title: one(m.title), author: one(m.creator) || "Internet Archive", thumb: "https://archive.org/services/img/" + id };
  } catch (err){ return null; }
}
/* what to call a link when its site will not say: "Spotify playlist",
   "SoundCloud track", "Vimeo video" */
function linkKind(u, e){
  if (e.site === "Spotify"){
    const m = u.pathname.match(/\/(playlist|album|track|episode|show|artist)\//);
    return m ? { track: "song", show: "podcast", episode: "episode" }[m[1]] || m[1] : "link";
  }
  return e.audio ? "track" : "video";
}
/* turn whatever was pasted into something Media or Videos can play */
async function resolveWebLink(raw){
  const url = String(raw || "").trim();
  const y = parseYouTube(url);
  if (y){
    const canonical = y.id
      ? "https://www.youtube.com/watch?v=" + y.id + (y.list ? "&list=" + encodeURIComponent(y.list) : "")
      : "https://www.youtube.com/playlist?list=" + encodeURIComponent(y.list);
    const info = await youTubeInfo(canonical);
    return { kind: "yt", url: canonical, id: y.id, list: y.list,
             title: (info && info.title) || (y.id ? "YouTube video" : "YouTube playlist"),
             author: (info && info.author) || "YouTube", thumb: (info && info.thumb) || "" };
  }
  let u;
  try { u = new URL(url); } catch (e){ return null; }
  if (!/^https?:$/.test(u.protocol)) return null;
  const host = u.hostname.replace(/^www\./, "");
  const path = decodeURIComponent(u.pathname);
  if (isAudio(path) || isVideo(path))
    return { kind: "file", url, title: baseName(path) || url, author: host };
  const e = parseEmbed(url);
  const info = (e && e.site === "Internet Archive" ? await archiveInfo(e.embed)
             : e && e.site === "Spotify" ? await spotifyInfo(url) : null) || await webInfo(url);
  const item = { kind: "embed", url, site: e ? e.site : host, embed: e ? e.embed : url, audio: e ? e.audio : false,
                 title: (info && info.title) || (e ? e.site + " " + linkKind(u, e) : host),
                 author: (info && info.author) || (e ? e.site : host), thumb: (info && info.thumb) || "" };
  if (!e) item.generic = true;
  return item;
}
/* the question Add media asks when you choose Paste a link */
/* every web address in a piece of text - one a line, or run together */
function linksIn(text){
  const out = [];
  for (const tok of String(text || "").split(/\s+/)){
    const t = tok.trim().replace(/^[<("']+|[>)"',.]+$/g, "");
    if (!/^https?:\/\//i.test(t)) continue;
    try { new URL(t); if (!out.includes(t)) out.push(t); } catch (e){}
  }
  return out;
}
const isAudioItem = item => !!item && (item.audio || (item.kind === "file" && !isVideo(pathOfLink(item.url))));
/* Look links up and keep them, in the order they were given. */
async function addMediaLinks(urls, videoOnly){
  const added = [], skipped = [];
  if (urls.length > 1) notify("Adding " + urls.length + " links", "Looking each one up\u2026", "\uD83D\uDD17");
  for (const url of urls){
    const item = await resolveWebLink(url);
    if (!item || (videoOnly && isAudioItem(item))){ skipped.push(url); continue; }
    added.push(item);
  }
  /* the list keeps the newest first, so they go in backwards */
  for (let i = added.length - 1; i >= 0; i--) rememberWebMedia(added[i]);
  if (skipped.length)
    notify(skipped.length === 1 ? "One link was left out" : skipped.length + " links were left out",
      videoOnly ? "Videos only plays video. Audio links belong in Media or the MP3 Player."
                : "Those were not web addresses that play.", "\u26A0\uFE0F");
  return added;
}
/* the question Add media asks when you choose Paste links */
async function askMediaLinks(videoOnly){

    title: "Paste links", input: true, multiline: true, ok: "Add",
    message: "One link a line, as many as you like - Ctrl+Enter adds them. Videos from YouTube, Vimeo, " +
      "Dailymotion, Twitch, Kick, Streamable, the Internet Archive, Bilibili, Odysee, TED, TikTok, Facebook or " +
      "any PeerTube server" + (videoOnly ? "" : "; Spotify playlists, albums and songs; SoundCloud tracks") +
      "; or direct links to media files. Other sites are tried too."
  });
  if (!raw) return [];
  const urls = linksIn(raw);

/* ---- the three players, and getting things into them ---- */
const MEDIA_APPS = new Set(["music", "videos"]);
/* the player's window if one is open, a new one if not */
function mediaWin(appId){
  for (const w of windows.values()) if (w.appId === appId){ focusWin(w); return w; }
  return launch(appId);
}
/* real files, from the computer, copied into ~/Music or ~/Videos */
async function importMediaFiles(files, appId){
  const want = appId === "videos" ? n => isVideo(n) || IMG_EXT.includes(extOf(n)) : n => isAudio(n) || isVideo(n);
  const ok = files.filter(f => want(f.name)), paths = [];
  for (const f of ok){
    const dir = HOME + (isVideo(f.name) ? "/Videos" : IMG_EXT.includes(extOf(f.name)) ? "/Pictures" : "/Music");
    const name = await importMediaFile(f, dir);
    if (name) paths.push(dir + "/" + name);
  }
  if (files.length > ok.length)
    notify("Some files were left out", (files.length - ok.length) + " of them " +
      (appId === "videos" ? "were not videos or pictures." : "were not audio or video."), "\u26A0\uFE0F");
  if (paths.length){
    refreshFilesViews();
    notify(paths.length === 1 ? "Added " + baseName(paths[0]) : "Added " + paths.length + " files",
      "Kept in " + tilde(dirName(paths[0])) + ", inside SEA OS.", isVideo(paths[0]) ? "\uD83C\uDFAC" : "\uD83C\uDFB5");
  }
  return paths;
}
/* Whatever arrives from outside - dropped from the desktop, dragged from
   another tab, pasted - goes to the right player. Read before anything is
   awaited: the browser empties a drop's contents once the event is over. */
function mediaTakeIn(appId, files, text, w){
  const links = linksIn(text);
  if (!files.length && !links.length) return false;
  const win = w && windows.has(w.id) ? w : mediaWin(appId);
  if (!win || !win.api) return false;
  focusWin(win);
  (async () => {
    if (files.length){
      const paths = await importMediaFiles(files, appId);
      if (paths.length && win.api.play) win.api.play(paths[0]);
    } else if (win.api.addLinks) win.api.addLinks(links);
  })();
  return true;
}
const carriesMedia = dt => !!dt && Array.from(dt.types || []).some(t => t === "Files" || t === "text/uri-list");
/* Ctrl+V in a player: a link, several links, or a copied file */
document.addEventListener("paste", e => {
  const w = activeWin;
  if (!w || !MEDIA_APPS.has(w.appId)) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const cd = e.clipboardData;
  if (!cd) return;
  if (mediaTakeIn(w.appId, Array.from(cd.files || []), cd.getData("text/plain") || "", w)) e.preventDefault();
});

/* ---- media keys ----
   Whichever player last started something owns the keyboard's play, pause
   and skip keys, and tells the computer what is playing - Windows shows the
   song and its cover in its own media pop-up. */
const MediaKeys = { owner: null };
function claimMediaKeys(owner, info, actions){
  if (!("mediaSession" in navigator)) return;
  MediaKeys.owner = owner;
  const ms = navigator.mediaSession;
  try {
    ms.metadata = new MediaMetadata({
      title: info.title || "", artist: info.artist || "", album: info.album || "",
      artwork: info.art ? [{ src: info.art, sizes: "512x512" }] : []
    });
  } catch (e){}
  const bind = (name, fn) => { try { ms.setActionHandler(name, fn || null); } catch (e){} };
  bind("play", actions.play);
  bind("pause", actions.pause);
  bind("stop", actions.pause);
  bind("previoustrack", actions.prev);
  bind("nexttrack", actions.next);
  bind("seekto", actions.seek ? d => actions.seek(d.seekTime) : null);
  /* the play event can fire before this claim, so say where things stand now */
  try { if (actions.playing) ms.playbackState = actions.playing() ? "playing" : "paused"; } catch (e){}
}
function mediaKeysPlaying(owner, playing){
  if (MediaKeys.owner !== owner || !("mediaSession" in navigator)) return;
  try { navigator.mediaSession.playbackState = playing ? "playing" : "paused"; } catch (e){}
}
function releaseMediaKeys(owner){
  if (MediaKeys.owner !== owner || !("mediaSession" in navigator)) return;
  MediaKeys.owner = null;
  try { navigator.mediaSession.metadata = null; navigator.mediaSession.playbackState = "none"; } catch (e){}
  for (const n of ["play", "pause", "stop", "previoustrack", "nexttrack", "seekto"])
    try { navigator.mediaSession.setActionHandler(n, null); } catch (e){}
}
function pathOfLink(url){ try { return decodeURIComponent(new URL(url).pathname); } catch (e){ return ""; } }
/* Import from this computer: the file is copied into SEA OS, never the other way */
function importMediaFromComputer(videoOnly){
  return new Promise(resolve => {
    const inp = $("#mediapicker");
    inp.value = "";
    inp.accept = videoOnly ? "video/*" : "audio/*,video/*";
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      inp.onchange = null;
      if (!f) return resolve(null);
      if (videoOnly ? !isVideo(f.name) : !(isAudio(f.name) || isVideo(f.name))){
        osAlert("Not a media file", f.name + " is not " + (videoOnly ? "a video" : "an audio or video file") + " SEA OS can play.");
        return resolve(null);
      }
      const dir = HOME + (isVideo(f.name) ? "/Videos" : "/Music");
      const name = await importMediaFile(f, dir);
      if (!name){ osAlert("Could not read that", "The file could not be loaded."); return resolve(null); }
      refreshFilesViews();
      notify("Added to " + tilde(dir), name, isVideo(name) ? "🎬" : "🎵");
      resolve(dir + "/" + name);
    };

  });
}

/* ============================================================
   12g2. Covers and tags - what Media shows while a song plays

   A song carries its own name, artist, album and cover inside it, in ID3
   tags. They are read here, out of the file itself, and shown on the disc
   that turns while it plays. Failing that, a picture sitting next to the
   song is used.
   ============================================================ */
const ID3 = new Map();          /* path -> promise of { title, artist, album, art } */

function id3Text(bytes){
  if (!bytes.length) return "";
  const enc = bytes[0];
  const body = bytes.subarray(1);
  const label = enc === 1 ? "utf-16" : enc === 2 ? "utf-16be" : enc === 3 ? "utf-8" : "iso-8859-1";
  let out = "";
  try { out = new TextDecoder(label).decode(body); }
  catch (e){ out = new TextDecoder("iso-8859-1").decode(body); }
  return out.replace(/\u0000+$/, "").trim();
}
function id3Picture(bytes){
  if (bytes.length < 4) return "";
  const enc = bytes[0];
  let i = 1;
  while (i < bytes.length && bytes[i] !== 0) i++;          /* the MIME type */
  const mime = new TextDecoder("iso-8859-1").decode(bytes.subarray(1, i)) || "image/jpeg";
  i++;                                                     /* its terminator */
  i++;                                                     /* what kind of picture it is */
  if (enc === 1 || enc === 2){                             /* two-byte text, so a two-byte terminator */
    while (i + 1 < bytes.length && !(bytes[i] === 0 && bytes[i + 1] === 0)) i += 2;
    i += 2;
  } else {
    while (i < bytes.length && bytes[i] !== 0) i++;
    i++;
  }
  if (i >= bytes.length) return "";
  const blob = new Blob([bytes.slice(i)], { type: mime.includes("/") ? mime : "image/" + mime.toLowerCase() });
  return URL.createObjectURL(blob);
}
/* Only what the player shows: the title, who made it, the album and the cover */
function parseId3(b){
  if (b.length < 10 || b[0] !== 0x49 || b[1] !== 0x44 || b[2] !== 0x33) return null;
  const ver = b[3];
  if (ver < 3) return null;                                /* the 1998 layout, rare enough to skip */
  const size = (b[6] << 21) | (b[7] << 14) | (b[8] << 7) | b[9];
  const end = Math.min(b.length, 10 + size);
  const out = {};
  let i = 10;
  while (i + 10 <= end){
    const id = String.fromCharCode(b[i], b[i + 1], b[i + 2], b[i + 3]);
    if (!/^[A-Z][A-Z0-9]{3}$/.test(id)) break;
    const fs = ver >= 4
      ? (b[i + 4] << 21) | (b[i + 5] << 14) | (b[i + 6] << 7) | b[i + 7]
      : (b[i + 4] << 24) | (b[i + 5] << 16) | (b[i + 6] << 8) | b[i + 7];
    if (fs <= 0 || i + 10 + fs > end) break;
    const data = b.subarray(i + 10, i + 10 + fs);
    if (id === "TIT2") out.title = id3Text(data);
    else if (id === "TPE1") out.artist = id3Text(data);
    else if (id === "TALB") out.album = id3Text(data);
    else if (id === "APIC" && !out.art) out.art = id3Picture(data);
    i += 10 + fs;
  }
  return out;
}
function id3Of(path){
  if (ID3.has(path)) return ID3.get(path);
  const p = (async () => {
    const n = node(path);
    if (!n || n.type !== "file" || !n.content) return null;
    try {
      const res = await fetch(n.content);
      const buf = new Uint8Array(await res.arrayBuffer());
      return parseId3(buf);
    } catch (e){ return null; }
  })();
  ID3.set(path, p);
  return p;
}
/* a picture sitting next to the song, the way album folders usually keep one */
function coverBeside(path){
  const dir = node(dirName(path));
  if (!dir || dir.type !== "dir") return "";
  const names = Object.keys(dir.children).filter(n => IMG_EXT.includes(extOf(n)));
  const pick = names.find(n => /^(cover|folder|album|front|art)\b/i.test(n))
            || names.find(n => n.replace(/\.[^.]+$/, "") === baseName(path).replace(/\.[^.]+$/, ""))
            || names[0];
  return pick ? (dir.children[pick].content || "") : "";
}

/* ============================================================
   12g. Media - plays local audio and video, YouTube links and
   direct links to media files, all from one list
   ============================================================ */
function mp3App(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<button class="tb-btn m3-swap" data-m="media" title="Back to all of Media: links, videos and the list">☰ Media</button>' +
    '<div class="m3-stage"><div class="m3-card">' +
      '<div class="m3-discwrap"><canvas class="m3-vis"></canvas>' +
        '<div class="m3-disc"><div class="m3-art letter"></div><span class="m3-hole"></span></div>' +
      '</div>' +
      '<div class="m3-text"><div class="m3-title">Nothing playing</div><div class="m3-sub">Pick something from Up next</div></div>' +
    '</div></div>' +
    '<div class="m3-bar">' +
      '<input class="m3-seek" type="range" min="0" max="1000" value="0" title="Seek">' +
      '<div class="m3-times"><span class="m3-at">0:00</span><span class="m3-of">0:00</span></div>' +
    '</div>' +
    '<div class="m3-ctl">' +
      '<button data-m="shuffle" title="Shuffle">🔀</button>' +
      '<button data-m="prev" title="Previous">&#9198;</button>' +
      '<button class="m3-play" data-m="play" title="Play or pause">&#9654;</button>' +
      '<button data-m="next" title="Next">&#9197;</button>' +
      '<button data-m="repeat" title="Repeat">🔁</button>' +
    '</div>' +
    '<div class="m3-vol"><span>🔈</span><input class="m3-v" type="range" min="0" max="100" value="90" title="Volume"></div>' +
    '<button class="m3-next" data-m="queue">' +
      '<span class="m3-next-l">Playing next</span><span class="m3-next-t">—</span><span class="m3-chev">⌃</span>' +
    '</button>' +
    '<div class="m3-queue">' +
      '<div class="m3-q-head"><span class="t">Up next</span>' +
        '<select class="m3-lists wb-eng"></select>' +
        '<span class="ed-sp"></span>' +
        '<button class="tb-btn" data-m="add" title="Add a link, a file already in SEA OS, or a file from this computer">➕</button>' +
        '<button class="tb-btn" data-m="shut" title="Close">✕</button>' +
      '</div>' +
      '<div class="m3-q-list"></div>' +
    '</div>';

  const audio = new Audio();
  const card = $(".m3-card", B), art = $(".m3-art", B);
  const vis = visualizer(win, $(".m3-vis", B), "ring");
  const titleEl = $(".m3-title", B), subEl = $(".m3-sub", B);
  const seek = $(".m3-seek", B), atEl = $(".m3-at", B), ofEl = $(".m3-of", B), vol = $(".m3-v", B);
  const listSel = $(".m3-lists", B), qList = $(".m3-q-list", B), nextT = $(".m3-next-t", B);
  const mb = k => $('[data-m="' + k + '"]', B);
  let lists = [], tracks = [], at = -1, order = [], seeking = false, slideTok = 0;

  const fmt = s => (Number.isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00");
  const isWeb = t => typeof t !== "string";
  const nameOf = t => (isWeb(t) ? t.title : baseName(t).replace(/\.[^.]+$/, ""));
  const whereOf = t => (isWeb(t) ? t.author || "a link" : tilde(dirName(t)));

  /* ---- what there is to play, grouped by the folder it lives in ---- */
  function build(){
    const byDir = new Map();
    walkFS((p, n, name) => {
      if (n.type !== "file" || !isAudio(name)) return;
      const d = dirName(p);
      if (!byDir.has(d)) byDir.set(d, []);
      byDir.get(d).push(p);
    });
    const every = [];
    for (const arr of byDir.values()) every.push(...arr);
    const web = (State.webMedia || []).filter(t => t.kind === "file" && isAudio(pathOfLink(t.url)));
    lists = [{ id: "all", name: "Everything", tracks: every.concat(web) }];
    for (const [d, arr] of byDir) lists.push({ id: d, name: baseName(d) || "/", tracks: arr });
    if (web.length) lists.push({ id: "web", name: "From the web", tracks: web });
    const want = lists.find(l => l.id === State.mp3List) || lists[0];
    State.mp3List = want.id;
    const current = at >= 0 ? tracks[at] : null;
    tracks = want.tracks;
    at = current == null ? -1 : tracks.indexOf(current);
    drawLists();
    reorder();
    drawQueue();
    drawNext();
  }
  function drawLists(){
    listSel.innerHTML = "";
    for (const l of lists){
      const o = el("option", null, l.name + " (" + l.tracks.length + ")");
      o.value = l.id;
      listSel.appendChild(o);
    }
    listSel.value = State.mp3List;
  }
  /* shuffle keeps its own running order so Previous still goes back */
  function reorder(){
    order = tracks.map((t, i) => i);
    if (State.mp3Shuffle){
      for (let i = order.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      if (at >= 0){
        const k = order.indexOf(at);
        if (k > 0){ order.splice(k, 1); order.unshift(at); }
      }
    }
  }
  function stepIndex(dir){
    if (!tracks.length) return -1;
    if (at < 0) return order[0];
    const k = order.indexOf(at);
    if (k < 0) return order[0];
    if (State.mp3Repeat === "one") return at;
    const n = k + dir;
    if (n < 0) return order[order.length - 1];
    if (n >= order.length) return State.mp3Repeat === "all" ? order[0] : -1;
    return order[n];
  }
  function drawNext(){
    const i = stepIndex(1);
    nextT.textContent = i >= 0 && tracks[i] && i !== at ? nameOf(tracks[i])
      : State.mp3Repeat === "one" && at >= 0 ? nameOf(tracks[at]) + " again"
      : tracks.length ? "Nothing - this is the last one" : "Nothing yet";
  }
  function drawQueue(){
    qList.innerHTML = "";
    if (!tracks.length){
      qList.appendChild(el("div", "m3-none",
        "No music in this playlist yet. Press ➕ to add a song, or put .mp3 files in the repo's music/ folder."));
      return;
    }
    order.forEach(i => {
      const t = tracks[i];
      const b = el("button", "m3-row" + (i === at ? " on" : ""));
      b.append(el("span", "g", i === at && !audio.paused ? "▶" : isWeb(t) ? "🔗" : "🎵"),
               el("span", "n", nameOf(t)), el("span", "d", whereOf(t)));
      b.onclick = () => play(i);
      qList.appendChild(b);
    });
  }

  /* ---- the sliding change of track ---- */
  function slide(dir, fill){
    if (!State.animations || !card.animate) return fill();
    const tok = ++slideTok;
    const out = card.animate(
      [{ transform: "none", opacity: 1 }, { transform: "translateX(" + (-dir * 70) + "px)", opacity: 0 }],
      { duration: 190, easing: "ease-in", fill: "forwards" });
    let swapped = false;
    const swap = () => {
      /* a hidden window stops animating, so the swap also runs on a timer */
      if (swapped || tok !== slideTok) return;
      swapped = true;
      fill();
      out.cancel();
      card.animate(
        [{ transform: "translateX(" + (dir * 70) + "px)", opacity: 0 }, { transform: "none", opacity: 1 }],
        { duration: 280, easing: "cubic-bezier(.2,.8,.3,1)" });
    };
    out.onfinish = swap;
    setTimeout(swap, 230);
  }
  async function dressUp(t){
    /* the words first, then the cover when it has been dug out of the file */
    let title = nameOf(t), sub = whereOf(t), cover = isWeb(t) ? t.thumb || "" : "";
    titleEl.textContent = title;
    subEl.textContent = sub;
    setArt(cover, title);
    win.setTitle(title);
    keys({ title, artist: isWeb(t) ? sub : "", art: cover });
    if (isWeb(t)) return;
    const tag = await id3Of(t);
    if (tracks[at] !== t) return;
    if (tag && tag.title) titleEl.textContent = tag.title;
    if (tag && (tag.artist || tag.album))
      subEl.textContent = [tag.artist, tag.album].filter(Boolean).join(" \u2014 ");
    const art = (tag && tag.art) || coverBeside(t);
    setArt(art, titleEl.textContent);
    keys({ title: titleEl.textContent, artist: (tag && tag.artist) || "", album: (tag && tag.album) || "", art });
  }
  /* the keyboard's media keys, and what Windows shows in its pop-up */
  const keys = info => claimMediaKeys(win, info, {
    play: () => audio.play().catch(() => {}),
    pause: () => audio.pause(),
    next: () => step(1),
    prev: () => step(-1),
    seek: t => { if (audio.duration) audio.currentTime = t; },
    playing: () => !audio.paused
  });
  function setArt(url, title){
    if (url){
      art.classList.remove("letter");
      art.textContent = "";
      art.style.backgroundImage = 'url("' + String(url).replace(/"/g, "%22") + '")';
    } else {
      art.classList.add("letter");
      art.style.backgroundImage = "";
      art.textContent = (title || "?").trim().charAt(0).toUpperCase() || "?";
    }
  }
  function play(i, dir){
    if (i < 0 || i >= tracks.length) return;
    const back = dir != null ? dir : (i < at ? -1 : 1);
    at = i;
    const t = tracks[i];
    const src = isWeb(t) ? t.url : (node(t) ? node(t).content : "");
    if (!src) return build();
    visCors(audio, src);
    audio.src = src;
    audio.play().catch(() => {});
    slide(back, () => dressUp(t));
    drawQueue();
    drawNext();
  }
  function toggle(){
    if (at < 0) return play(order.length ? order[0] : 0);
    audio.paused ? audio.play().catch(() => {}) : audio.pause();
  }
  function step(dir){
    if (!tracks.length) return;
    /* going back in the first seconds means the start of this song */
    if (dir < 0 && audio.currentTime > 4){ audio.currentTime = 0; return; }
    const i = stepIndex(dir);
    if (i < 0) return;
    play(i, dir);
  }
  function openQueue(on){
    B.classList.toggle("queued", on == null ? !B.classList.contains("queued") : !!on);
  }

  /* ---- adding music, the same three ways Media offers ---- */
  /* only links straight to a song can play here; the rest stay in Media's list */
  function takeLinks(items){
    const songs = items.filter(it => it.kind === "file" && isAudio(pathOfLink(it.url)));
    if (!songs.length){
      if (items.length) osAlert("Not a song", "The MP3 Player plays audio files - links straight to a song. " +
        "Those links are in Media's list instead, where " + (siteOf(items[0]) || "they") + " can play.");
      return;
    }
    State.mp3List = "all";
    build();
    const i = tracks.findIndex(x => isWeb(x) && x.url === songs[0].url);
    if (i >= 0) play(i);
  }
  const addLink = async () => takeLinks(await askMediaLinks(false));
  async function addFromFiles(){
    const p = await pickFile({ title: "Add a song", ok: "Play", start: HOME + "/Music", hint: "Audio",
                               accept: nm => isAudio(nm) });
    if (p) openPath(p);
  }
  async function addFromComputer(){
    const p = await importMediaFromComputer(false);
    if (p) openPath(p);
  }
  function openPath(p){
    if (!isAudio(baseName(p))) return osAlert("Not a song", baseName(p) + " is not an audio file.");
    State.mp3List = dirName(p);
    build();
    const i = tracks.indexOf(p);
    if (i >= 0) play(i); else { State.mp3List = "all"; build(); play(tracks.indexOf(p)); }
  }

  mb("media").onclick = () => mediaSwap(win, "list");
  mb("play").onclick = toggle;
  mb("next").onclick = () => step(1);
  mb("prev").onclick = () => step(-1);
  mb("queue").onclick = () => openQueue();
  mb("shut").onclick = () => openQueue(false);
  mb("add").onclick = () => showAddMedia(mb("add"), { link: addLink, files: addFromFiles, computer: addFromComputer });
  mb("shuffle").onclick = () => {
    State.mp3Shuffle = !State.mp3Shuffle;
    saveSettings();
    mb("shuffle").classList.toggle("on", State.mp3Shuffle);
    reorder();
    drawQueue();
    drawNext();
  };
  mb("repeat").onclick = () => {
    State.mp3Repeat = State.mp3Repeat === "off" ? "all" : State.mp3Repeat === "all" ? "one" : "off";
    saveSettings();
    mb("repeat").classList.toggle("on", State.mp3Repeat !== "off");
    mb("repeat").textContent = State.mp3Repeat === "one" ? "🔂" : "🔁";
    mb("repeat").title = State.mp3Repeat === "one" ? "Repeat this song"
                       : State.mp3Repeat === "all" ? "Repeat the playlist" : "Repeat";
    drawNext();
  };
  listSel.onchange = () => { State.mp3List = listSel.value; saveSettings(); build(); };
  seek.oninput = () => { seeking = true; };
  seek.onchange = () => {
    seeking = false;
    if (audio.duration) audio.currentTime = audio.duration * (seek.value / 1000);
  };
  vol.oninput = () => { audio.volume = vol.value / 100; };
  audio.volume = 0.9;
  audio.onplay = audio.onpause = () => {
    if (!audio.paused) vis.follow(audio);
    mediaKeysPlaying(win, !audio.paused);
    B.classList.toggle("playing", !audio.paused);
    mb("play").innerHTML = audio.paused ? "&#9654;" : "&#10074;&#10074;";
    drawQueue();
    nowPlaying(win, at >= 0 ? titleEl.textContent : "", !audio.paused);
  };
  audio.ontimeupdate = () => {
    if (!seeking && audio.duration) seek.value = String(Math.round(audio.currentTime / audio.duration * 1000));
    atEl.textContent = fmt(audio.currentTime);
    ofEl.textContent = fmt(audio.duration);
  };
  audio.onended = () => {
    if (State.mp3Repeat === "one"){ audio.currentTime = 0; audio.play().catch(() => {}); return; }
    const i = stepIndex(1);
    if (i >= 0) play(i, 1); else { B.classList.remove("playing"); drawNext(); }
  };
  audio.onerror = () => { if (at >= 0) subEl.textContent = "That file would not play."; };
  B.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === " "){ e.preventDefault(); toggle(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); step(1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
  });
  B.tabIndex = 0;

  mb("shuffle").classList.toggle("on", !!State.mp3Shuffle);
  mb("repeat").classList.toggle("on", State.mp3Repeat !== "off");
  if (State.mp3Repeat === "one") mb("repeat").textContent = "🔂";
  build();
  if (startPath) openPath(startPath);

  return {
    play: openPath,
    addLinks: async urls => takeLinks(await addMediaLinks(urls, false)),
    refresh: build,
    pause: () => audio.pause(),
    visKick(){ if (!audio.paused) vis.follow(audio); },
    toggle,
    next: () => step(1),
    menus(){
      return {
        File: [
          { label: "Add media…", run: () => mb("add").click() },
          { label: "Paste a link…", run: addLink },
          { label: "Open from Files…", run: addFromFiles },
          { label: "Import from this computer…", run: addFromComputer },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: B.classList.contains("queued") ? "Hide Up next" : "Show Up next", run: () => openQueue() },
          { label: "All of Media", run: () => mediaSwap(win, "list") },
          { label: (State.visualizer !== false ? "Hide" : "Show") + " the visualizer", run: toggleVisualizer },
          { label: "Rescan music", run: build },
          "-",
          { label: State.mp3Shuffle ? "Stop shuffling" : "Shuffle", run: () => mb("shuffle").click() },
          { label: "Repeat: " + (State.mp3Repeat === "one" ? "this song" : State.mp3Repeat === "all" ? "playlist" : "off"),
            run: () => mb("repeat").click() }
        ]
      };
    },
    onClose(){
      if (NowPlaying.win === win) nowPlaying(null);
      releaseMediaKeys(win);
      vis.stop();
      audio.pause();
      audio.src = "";
      return true;
    }
  };
}

/* Playlists of saved links. A link lives once, in the list of everything
   you have added; a playlist is a name and the order of the links in it, so
   one link can sit in as many playlists as you like. */
function linkList(id){ return (State.linkLists || []).find(l => l.id === id) || null; }
function mediaViewNow(){
  const v = State.mediaView || "all";
  return v === "all" || v === "links" || linkList(v) ? v : "all";
}
function refreshMediaViews(){
  saveSettings();
  for (const w of windows.values()) if (w.appId === "music" && w.api && w.api.refresh) w.api.refresh();
}
/* a link that is forgotten leaves every playlist too */
function forgetWebMedia(url){
  State.webMedia = (State.webMedia || []).filter(x => x.url !== url);
  State.linkLists = (State.linkLists || []).map(l => Object.assign({}, l, { urls: l.urls.filter(u => u !== url) }));
}
async function newLinkList(urls){
  const name = await osPrompt("New playlist", "What should it be called?", "");
  if (!name || !String(name).trim()) return null;
  const l = { id: uid("pl"), name: String(name).trim().slice(0, 40), urls: [] };
  State.linkLists = (State.linkLists || []).concat(l);
  State.mediaView = l.id;
  if (urls && urls.length) l.urls = urls.slice();
  else {
    /* made out of nothing: paste its links now, or add them later from any link's menu */
    const items = await askMediaLinks(false);
    for (const it of items) if (!l.urls.includes(it.url)) l.urls.push(it.url);
  }
  refreshMediaViews();
  return l;
}
async function renameLinkList(l){
  const name = await osPrompt("Rename playlist", "A new name for " + l.name + ".", l.name);
  if (!name || !String(name).trim()) return;
  l.name = String(name).trim().slice(0, 40);
  refreshMediaViews();
}
async function deleteLinkList(l){
  if (!(await osConfirm("Delete " + l.name, "The playlist goes; its links stay saved in Links.", "Delete", true))) return;
  State.linkLists = (State.linkLists || []).filter(x => x.id !== l.id);
  if (State.mediaView === l.id) State.mediaView = "links";
  refreshMediaViews();
}
function addToLinkList(l, url){
  if (!l.urls.includes(url)) l.urls.push(url);
  refreshMediaViews();
}

/* ============================================================
   The visualizer: the music, drawn - bars behind what is playing in
   Media, and a ring round the turning cover in the MP3 Player.

   It listens to a copy of the sound (captureStream) rather than the
   sound itself, so a song the browser will not let it hear - from a
   site that does not allow it - still plays exactly as before, only
   without the drawing. It draws nothing while paused, minimised,
   hidden, or behind Game or Movie mode.
   ============================================================ */
const Vis = { ctx: null, sink: null };
function visTap(media){
  if (!media || typeof media.captureStream !== "function") return null;
  try {
    if (!Vis.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      Vis.ctx = new AC();
      Vis.sink = Vis.ctx.createGain();
      Vis.sink.gain.value = 0;           /* heard nowhere - it only has to be listened to */
      Vis.sink.connect(Vis.ctx.destination);
    }
    if (Vis.ctx.state === "suspended") Vis.ctx.resume().catch(() => {});
    const tracks = media.captureStream().getAudioTracks();
    if (!tracks.length) return null;
    const src = Vis.ctx.createMediaStreamSource(new MediaStream([tracks[0]]));
    const an = Vis.ctx.createAnalyser();
    an.fftSize = 256;
    an.smoothingTimeConstant = 0.78;
    src.connect(an);
    an.connect(Vis.sink);
    return { src, an };
  } catch (e){ return null; }
}
/* GitHub Pages lets other sites listen to its files, but only when asked
   up front - so a song from the repository is asked for that way, and the
   visualizer can hear it. Anything else is fetched as it always was. */
function visCors(media, src){
  if (/^https:\/\/[\w.-]+\.github\.io\//i.test(String(src || ""))) media.crossOrigin = "anonymous";
  else media.removeAttribute("crossorigin");
}
function visBars(g, w, h, bins, color){
  const n = 48, gap = Math.max(1, w / n * 0.28), bw = w / n - gap;
  g.fillStyle = color;
  for (let i = 0; i < n; i++){
    /* low notes get more of the width, the way they are heard */
    const b = Math.min(bins.length - 1, Math.floor(Math.pow(i / n, 1.6) * 100) + 1);
    const v = bins[b] / 255;
    const bh = Math.max(2, v * v * h * 0.95);
    g.globalAlpha = 0.35 + v * 0.65;
    g.fillRect(i * (bw + gap) + gap / 2, h - bh, bw, bh);
  }
  g.globalAlpha = 1;
}
function visRing(g, w, h, bins, color){
  /* the canvas is 136% of the cover, so this is the cover's own edge */
  const cx = w / 2, cy = h / 2, half = Math.min(w, h) / 2, r0 = half / 1.36 * 1.03;
  const n = 72, room = half - r0 - 2;
  g.strokeStyle = color;
  g.lineCap = "round";
  g.lineWidth = Math.max(2, 2 * Math.PI * r0 / n * 0.42);
  for (let i = 0; i < n; i++){
    /* mirrored left and right, the low notes at the top */
    const m = i < n / 2 ? i : n - 1 - i;
    const b = Math.min(bins.length - 1, Math.floor(Math.pow(m / (n / 2), 1.5) * 90) + 1);
    const v = bins[b] / 255;
    const len = 2 + v * v * room;
    const a = i / n * Math.PI * 2 - Math.PI / 2;
    g.globalAlpha = 0.4 + v * 0.6;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    g.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len));
    g.stroke();
  }
  g.globalAlpha = 1;
}
function visualizer(win, canvas, style){
  const g = canvas.getContext("2d"), bins = new Uint8Array(128);
  let tap = null, media = null, raf = 0, color = "#8bae5a", colorAt = -1e9, tryAt = 0;
  const drop = () => { if (tap){ try { tap.src.disconnect(); tap.an.disconnect(); } catch (e){} tap = null; } };
  const clear = () => g.clearRect(0, 0, canvas.width, canvas.height);
  function frame(t){
    raf = 0;
    if (!media || media.paused || !canvas.isConnected || State.visualizer === false){ clear(); return; }
    raf = requestAnimationFrame(frame);
    if (win.min || document.hidden || (Focus.win && Focus.win !== win)) return;
    /* the copy only has sound once the song is really playing, so keep asking until then */
    if (!tap && t - tryAt > 400){ tryAt = t; tap = visTap(media); }
    if (!tap) return;
    if (t - colorAt > 1000){
      colorAt = t;
      color = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || color;
    }
    const dpr = Math.min(2, devicePixelRatio || 1);
    const cw = Math.round(canvas.clientWidth * dpr), ch = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== cw || canvas.height !== ch){ canvas.width = cw; canvas.height = ch; }
    tap.an.getByteFrequencyData(bins);
    clear();
    (style === "ring" ? visRing : visBars)(g, cw, ch, bins, color);
  }
  return {
    /* a new song means a new copy of the sound */
    follow(m){
      drop();
      media = m;
      tryAt = 0;
      if (!raf) raf = requestAnimationFrame(frame);
    },
    stop(){
      drop();
      media = null;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      clear();
    }
  };
}

function mediaSwap(win, to){
