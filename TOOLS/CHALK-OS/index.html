      if (d.type === "out") log("log", d.text);
      else if (d.type === "err") log("warn", d.text);
      else if (d.type === "status") log("info", d.text);
      else if (d.type === "done"){ busy(false); log("info", "Finished in " + ((performance.now() - pyStarted) / 1000).toFixed(2) + " s"); }
      else if (d.type === "fail"){ busy(false); log("error", pyTrace(d.text)); }
    };
    py.onerror = e => {
      busy(false);
      log("error", "Python could not start (" + (e.message || "the worker failed") + "). Check you are online - Python is downloaded the first time it runs.");
      try { py.terminate(); } catch (x){}
      py = null;
      showMode();
    };
    return py;
  }
  function busy(on){
    gb("run").disabled = on;
    gb("stop").disabled = !on;
    B.classList.toggle("running", on);
  }
  function runPython(){
    pyStarted = performance.now();
    busy(true);
    pyWorker().postMessage({ code: pyText, input: stdin.value ? stdin.value.split("\n") : [] });
  }
  function stopPython(){
    if (!py) return;
    py.terminate();
    py = null;
    busy(false);
    log("warn", "Stopped. Python starts fresh on the next run.");
  }

  function changed(){
    if (kind === "python") pyText = area.value; else bufs[tab] = area.value;
    paint();
    status();
    if (kind === "web" && live.checked){
      clearTimeout(timer);
      timer = setTimeout(run, 650);
    }
  }

  /* ---- files ---- */
  async function guard(what){
    return !dirty() || osConfirm("Unsaved changes", what + " and lose your changes?", "Discard", true);
  }
  function load(p){
    const n = node(p);
    if (!n || n.type !== "file" || typeof n.content !== "string" || n.kind === "link")
      return osAlert("Cannot open that", baseName(p) + " is not a text file Playground can edit.");
    setDoc(/\.py$/i.test(p) ? "python" : "web", n.content, p);
  }
  function mime(){ return kind === "python" ? "text/x-python" : "text/html"; }
  function doSave(){
    if (!path) return doSaveAs();
    writeFile(path, docText(), "text", mime());
    savedSig = sig();
    status();
    refreshFilesViews();
    notify("Saved", tilde(path), "💾");
  }
  async function doSaveAs(){
    let name = await osPrompt("Save As", "File name", path ? baseName(path) : (kind === "python" ? "script.py" : "page.html"));
    if (!name) return;
    if (kind === "python" && !/\.py$/i.test(name)) name += ".py";
    if (kind === "web" && !/\.(html?|css|js|txt|md)$/i.test(name)) name += ".html";
    const dir = path ? dirName(path) : HOME + (kind === "python" ? "/Documents" : "/Sites");
    ensureDir(dir);
    const final = addUnique(dir, name, docText(), "text", mime());
    if (!final) return osAlert("Could not save", "That folder would not take the file.");
    path = dir + "/" + final;
    savedSig = sig();
    status();
    refreshFilesViews();
    notify("Saved", tilde(path), "💾");
  }
  function layout(mode){
    main.className = "pg-main " + mode;
    $$(".pg-lay button", B).forEach(b => b.classList.toggle("on", b.dataset.l === mode));
  }
  function log(level, text){
    let t = String(text);
    if (level === "error" && jsFromLine && kind === "web"){
      t = t.replace(/\(line (\d+)\)$/, (all, n) => (+n > jsFromLine ? "(JS tab, line " + (n - jsFromLine) + ")" : all));
    }
    const row = el("div", "pg-log " + level, t.slice(0, 4000));
    conList.appendChild(row);
    while (conList.children.length > 300) conList.firstChild.remove();
    conList.scrollTop = conList.scrollHeight;
    if (level === "error"){ errors++; conN.textContent = errors + (errors === 1 ? " error" : " errors"); }
  }
  const onMsg = e => {
    if (e.source !== frame.contentWindow || !e.data || typeof e.data.pgconsole !== "string") return;
    log(e.data.pgconsole, String(e.data.text).slice(0, 2000));
  };
  addEventListener("message", onMsg);

  /* ---- editing keys: indent with Tab, keep indentation on Enter ---- */
  function insert(text){
    area.focus();
    if (!document.execCommand("insertText", false, text)) area.setRangeText(text, area.selectionStart, area.selectionEnd, "end");
  }
  area.addEventListener("keydown", e => {
    const unit = indentUnit();
    if (e.key === "Tab"){
      e.preventDefault();
      const start = area.value.lastIndexOf("\n", area.selectionStart - 1) + 1;
      if (e.shiftKey){
        const lead = new RegExp("^ {1," + unit.length + "}").exec(area.value.slice(start));
        if (lead){
          area.setSelectionRange(start, start + lead[0].length);
          insert("");
        }
      } else insert(unit);
    } else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey){
      e.preventDefault();
      const start = area.value.lastIndexOf("\n", area.selectionStart - 1) + 1;
      const indent = /^[ \t]*/.exec(area.value.slice(start))[0];
      const before = area.value.slice(start, area.selectionStart);
      let more = false;
      if (lang() === "py") more = /:\s*(#.*)?$/.test(before);
      else if (lang() === "html"){
        const opens = /<([a-z][\w-]*)(?:\s[^>]*)?>\s*$/i.exec(before);
        more = !!opens && !/^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/i.test(opens[1]);
      } else more = /[{(\[]\s*$/.test(before);
      insert("\n" + indent + (more ? unit : ""));
    } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){
      e.preventDefault();
      run();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")){
      e.preventDefault();
      e.shiftKey ? doSaveAs() : doSave();
    }
  });
  area.addEventListener("input", changed);
  area.addEventListener("scroll", syncScroll);
  area.addEventListener("keyup", status);
  area.addEventListener("click", status);

  $$(".pg-tabs button", B).forEach(b => { b.onclick = () => pickTab(b.dataset.t); });
  gb("new").onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const start = async key => {
      if (await guard("Start something new")) setDoc(key === "python" ? "python" : "web", PG_TEMPLATES[key], null);
    };
    showCtx(r.left, r.bottom + 2, [
      { icon: "📄", label: "Blank page", run: () => start("page") },
      { icon: "🖱️", label: "Page with a script", run: () => start("starter") },
      { icon: "🧩", label: "SEA OS app", run: () => start("app") },
      "-",
      { icon: "🐍", label: "Python script", run: () => start("python") }
    ]);
  };
  gb("open").onclick = async () => {
    if (!(await guard("Open another file"))) return;
    const p = await pickFile({ title: "Open in Playground", start: path ? dirName(path) : HOME + "/Sites",
                               accept: (nm, n) => n.kind === "text" && (isHtml(nm) || /\.(css|js|py|txt|md)$/i.test(nm)) });
    if (p) load(p);
  };
  gb("save").onclick = doSave;
  gb("run").onclick = run;
  gb("stop").onclick = stopPython;
  gb("clear").onclick = () => { conList.innerHTML = ""; errors = 0; conN.textContent = ""; };
  gb("more").onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const web = kind === "web";
    showCtx(r.left, r.bottom + 2, [
      { icon: "💾", label: "Save As…", run: doSaveAs },
      { icon: "🌊", label: "Open in Seahorse", disabled: !web, run: () => {
          if (!path || dirty()) return osAlert("Save it first", "Seahorse opens the saved file, so save your changes first.");
          openInBrowser("box:" + path);
        } },
      { icon: "🛍️", label: "Install as app", disabled: !web, run: () => {
          if (!path || dirty()) return osAlert("Save it first", "An installed app runs from its saved file, so save your changes first.");
          storeInstallFromPath(path);
        } },
      "-",
      { icon: "📁", label: "Show in Files", disabled: !path, run: () => openInFiles(path) }
    ]);
  };
  $$(".pg-lay button", B).forEach(b => { b.onclick = () => layout(b.dataset.l); });
  live.onchange = () => { if (live.checked && kind === "web") run(); };

  if (startPath && node(startPath)) load(startPath);
  else setDoc("web", PG_TEMPLATES.starter, null);
  busy(false);

  return {
    open: p => { guard("Open another file").then(ok => { if (ok) load(p); }); },
    menus(){
      return {
        File: [
          { label: "New…", run: () => gb("new").click() },
          { label: "Open…", run: () => gb("open").click() },
          { label: "Save", run: doSave },
          { label: "Save As…", run: doSaveAs },
          "-",
          { label: "Install as app", disabled: kind !== "web",
            run: () => (path && !dirty() ? storeInstallFromPath(path) : osAlert("Save it first", "Save your changes, then install.")) },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "Run now", run },
          { label: "Stop", disabled: !py, run: stopPython },
          "-",
          { label: "HTML tab", disabled: kind !== "web", run: () => pickTab("html") },
          { label: "CSS tab", disabled: kind !== "web", run: () => pickTab("css") },
          { label: "JS tab", disabled: kind !== "web", run: () => pickTab("js") },
          "-",
          { label: "Side by side", run: () => layout("side") },
          { label: "Stacked", run: () => layout("stack") },
          { label: "Code only", run: () => layout("code") },
          { label: "Output only", run: () => layout("view") }
        ]
      };
    },
    onClose(){
      if (dirty()){
        osConfirm("Unsaved changes", (path ? baseName(path) : "This file") + " has changes that are not saved. Close anyway?", "Close", true)
          .then(ok => { if (ok){ savedSig = sig(); win.close(); } });
        return false;
      }
      if (py){ py.terminate(); py = null; }
      Bridged.delete(bridge);
      removeEventListener("message", onMsg);
      clearTimeout(timer);
      return true;
    }
  };
}

/* ============================================================
   12k. Games - a library of small games, each one an HTML file

   They live in the repo's games/ folder and run exactly like Store apps,
   sandboxed and speaking window.box. Two calls exist for them:
   box.getHighScore() and box.submitScore(n). Best scores are kept in
   settings, so the library can show them on the tiles.
   ============================================================ */
let gamesCatalogue = null;
/* Games written in here, needing nothing uploaded. Everything else comes
   from games/manifest.js or from Games > Add a game. */
const LINKED_GAMES = [];
/* ============================================================
   12k2. Games that live at an address

   A game can be a whole page somewhere else: a Unity build, an emulator,
   Eaglercraft. Those open in a window as they are, with their own address,
   rather than being copied in.
   ============================================================ */
/* A game that is a page somewhere else. It keeps its own address - which is
   what lets a Unity build find its data files and save its progress - and
   gets full screen, the mouse and a gamepad, but may not download anything
   onto the real computer. */
/* A game runs from CHALK OS's own site. One that only lives somewhere else -
   the repository's Pages site, when CHALK OS is served from another address -
   is fetched and started from here, so the game window never opens an
   outside address, and its saves stay with CHALK OS. A copy is kept for the
   session, so a second window does not fetch 20 MB again. */
const GAME_COPIES = new Map();
async function gameSource(url){
  let abs;
  try { abs = new URL(url, location.href); } catch (e){ return url; }
  if (abs.origin === location.origin) return abs.href;
  if (GAME_COPIES.has(abs.href)) return GAME_COPIES.get(abs.href);
  const res = await fetch(abs.href);
  if (!res.ok) throw new Error("the site answered " + res.status);
  if (!/html/i.test(res.headers.get("content-type") || "")) throw new Error("that is not a page");
  let html = await res.text();
  /* anything the game loads beside itself still comes from where it lives */
  const base = '<base href="' + abs.href.replace(/[^/]*$/, "").replace(/"/g, "&quot;") + '">';
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + base) : base + html;
  const copy = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  GAME_COPIES.set(abs.href, copy);
  return copy;
}
/* A page CHALK OS runs itself - a game, Chat - stays inside it. A link or a
   window.open that wants a new tab opens in ChalkBrowser instead of a real
   tab, and a file it hands over goes into Downloads rather than onto the real
   computer. The frames are sandboxed without popups or downloads as well, so
   anything this misses is refused rather than let out. */
function keepInside(frame){
  const patch = () => {
    let win;
    try { win = frame.contentWindow; if (!win || !win.document) return; } catch (e){ return; }
    if (win.__chalkKeep) return;
    win.__chalkKeep = true;
    const abs = raw => { try { return new URL(String(raw), win.location.href).href; } catch (e){ return null; } };
    const toBrowser = u => {
      /* a game in Game mode keeps the screen; the page waits in ChalkBrowser */
      const back = Focus.win;
      openInBrowser({ kind: "web", url: u });
      if (back && windows.has(back.id)){ focusWin(back); notify("Opened in ChalkBrowser", u, "\uD83C\uDF10"); }
    };
    win.open = function (url){
      const u = url === undefined || url === null || String(url) === "" ? null : abs(url);
      if (u && /^https?:/i.test(u)) toBrowser(u);
      return null;
    };
    catchDownloads(win, u => (/^(blob|data):/i.test(u) ? "" : u));
    win.document.addEventListener("click", e => {
      const a = e.target && e.target.closest && e.target.closest("a[href]");
      if (!a || a.hasAttribute("download")) return;
      const t = a.getAttribute("target");
      if (!(t && !/^_(self|parent|top)$/i.test(t)) && !(e.ctrlKey || e.metaKey || e.shiftKey)) return;
      const u = abs(a.getAttribute("href"));
      if (!u || !/^https?:/i.test(u)) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      toBrowser(u);
    }, true);
  };
  frame.addEventListener("load", patch);
  patch();
}
function pageGameRun(win, g){
  const B = win.body;
  B.innerHTML = "";
  const wrap = el("div", "ext-wrap");
  const msg = el("div", "ext-msg", "Opening " + g.name + "\u2026");
  wrap.appendChild(msg);
  B.appendChild(wrap);
  const frame = el("iframe", "ext-frame");
  frame.title = g.name;
  frame.allow = "fullscreen; autoplay; gamepad; clipboard-write; accelerometer; gyroscope";
  frame.allowFullscreen = true;
  frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-modals");
  keepInside(frame);
  frame.addEventListener("load", () => { if (activeWin === win) try { frame.contentWindow.focus(); } catch (x){} });
  let src = "";
  const start = async () => {
    try { src = await gameSource(g.url); }
    catch (err){
      /* the other site will not hand the game over; it still plays, framed in this window */
      src = new URL(g.url, location.href).href;
    }
    if (!frame.isConnected){ wrap.innerHTML = ""; wrap.appendChild(frame); }
    frame.src = src;
  };
  start();
  return {
    focusFrame(){ try { frame.contentWindow.focus(); } catch (x){} },
    menus(){
      return {
        File: [
          { label: "Reload " + g.name, run: () => { if (src) frame.src = src; } },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "Game mode", run: () => enterFocus(win, "game") },
          { label: "Full screen", run: () => { if (frame.requestFullscreen) frame.requestFullscreen().catch(() => {}); } }
        ]
      };
    }
  };
}
/* manifest entries that are not a file in games/: a page ({ url }) */
function gameFromEntry(e){
  if (!e || typeof e !== "object") return null;
  let target = e.url;
  if (!target || !e.name) return null;
  /* a name like games/thing.html means the repository, wherever that is */
  if (!/^[a-z]+:/i.test(target)) target = repoBase() + String(target).replace(/^\.?\//, "");
  const size = /^(\d{3,4})\s*x\s*(\d{3,4})$/i.exec(String(e.size || ""));
  return {
    id: "game:" + String(e.name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""),
    kind: "page",
    url: target,
    name: String(e.name).slice(0, 40),
    desc: String(e.desc || ("A game on " + ((() => { try { return new URL(target, location.href).hostname; } catch (x){ return "the web"; } })()))).slice(0, 120),
    icon: String(e.icon || "🎮").replace(/[<>]/g, "").slice(0, 8),
    color: /^#[0-9a-f]{3,8}$/i.test(e.color || "") ? e.color : "",
    w: size ? Math.min(1400, Math.max(320, +size[1])) : 960,
    h: size ? Math.min(1000, Math.max(240, +size[2])) : 640
  };
}
/* Games added from inside SEA OS: links kept in settings, and .html
   files kept in ~/Games - so they need nothing from the repository and come
   back after a reload like any other file. */
const MY_GAMES_DIR = () => HOME + "/Games";
function myGames(){
  const out = [];
  for (const e of State.myGames || []){
    const g = gameFromEntry(e);
    if (g){ g.id = "game:mine-" + g.id.slice(5); g.mine = "link"; out.push(g); }
  }
  const dir = node(MY_GAMES_DIR());
  if (dir && dir.type === "dir") for (const name of listDir(dir)){
    const p = MY_GAMES_DIR() + "/" + name, n = dir.children[name];
    if (!n || n.type !== "file") continue;
    let g = null;
    if (isHtml(name)){
      try { g = storeMeta(String(n.content), "fs:" + p, "game"); } catch (e){ g = null; }
      if (g && g.desc === "An app from the SEA Store") g.desc = "A game in ~/Games";
    }
    if (g){ g.mine = "file"; g.path = p; out.push(g); }
  }
  return out;
}
function registerGame(g){
  if (APPS[g.id] && !APPS[g.id].game) return;
  APPS[g.id] = { name: g.name, desc: g.desc, icon: g.icon, w: g.w, h: g.h, game: true, cls: "app-ext",
                 run: g.kind === "page" ? win => pageGameRun(win, g) : win => storeAppRun(win, g) };
}
/* Pages named in games/manifest.js are read on every host, because GitHub's
   listing only knows about files. */
async function gameExtras(){
  const out = [];
  for (const e of await loadFolderManifest("games", "BOXOS_GAMES")){
    const g = typeof e === "string" ? null : gameFromEntry(e);
    if (g) out.push(g);
  }
  return out;
}
/* A game in games/ is a page of its own: it runs with its own storage, the
   way a game that saves needs to, and is named after its file - never after
   its <title>, which some games dress up as something else entirely. The page
   is not fetched just to be listed, so a 20 MB game costs nothing until it
   is played. A game known by name can be given its proper details here. */
const KNOWN_GAMES = {};
async function discoverGameFiles(skip){
  let paths = null;
  const names = await repoList("games");
  if (names) paths = names.filter(isHtml).map(n => "games/" + n);
  if (!paths) paths = (await loadFolderManifest("games", "BOXOS_GAMES"))
    .filter(p => typeof p === "string" && isHtml(p)).map(p => p.replace(/^\.?\//, ""));
  return paths.filter(p => !(skip && skip.has(p))).map(p => {
    const file = baseName(p).replace(/\.html?$/i, "");
    const slug = file.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "game";
    const known = KNOWN_GAMES[slug] || {};
    return {
      id: "game:" + slug, kind: "page", url: repoBase() + p,
      name: known.name || file.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase()).slice(0, 40),
      desc: known.desc || "A game in the games folder",
      icon: known.icon || "\uD83C\uDFAE", color: known.color || "",
      w: known.w || 960, h: known.h || 640
    };
  });
}
async function discoverGames(){
  /* A game named in games/manifest.js comes with its own details, and wins
     over the same file found by looking in the folder - so a big page game
     like Eaglercraft can be listed as a page, with its own storage, and is
     never downloaded just to read its title. */
  const extras = await gameExtras();
  const named = new Set(extras.map(g => g.url.replace(repoBase(), "").replace(/^\.\//, "")));
  const found = await discoverGameFiles(named);
  /* your own first, then the built-in links, then what the manifest names, then whatever else is in games/ */
  const all = [];
  for (const g of myGames().concat(LINKED_GAMES, extras, found)) if (g && !all.some(x => x.id === g.id)) all.push(g);
  all.forEach(registerGame);
  gamesCatalogue = all;
  drawDock();
  return all;
}
/* ============================================================
   Game mode and Movie mode. Right-click a game, or something to
   watch, and that one thing takes the whole screen while everything
   else stops: other players are paused, the other windows, the
   desktop and the wallpaper are taken out of the page altogether, and
   the desktop's own clocks stop ticking until you come back.
   ============================================================ */
const Focus = { win: null, kind: "", bar: null, hot: null, hideT: 0, idleT: 0 };
/* true while nothing of the desktop is on show, so there is nothing to keep up to date */
function focusQuiet(){ return !!Focus.win || document.hidden; }
function hushEverything(keep){
  for (const w of windows.values()){
    if (w === keep || !w.api || typeof w.api.pause !== "function") continue;
    try { w.api.pause(); } catch (e){}
  }
  for (const m of $$("video, audio"))
    if (!m.paused && !(keep && keep.el.contains(m))) m.pause();
}
function enterFocus(w, kind){
  if (!w || !windows.has(w.id)) return;
  if (Focus.win && Focus.win !== w) leaveFocus();
  hideCtx();
  if (menuOpen) closeMenu();
  if (w.min) restoreWin(w);
  focusWin(w);
  hushEverything(w);
  Focus.win = w;
  Focus.kind = kind;
  w.el.classList.add("focus-target", "focus-" + kind);
  document.body.classList.add("focus-mode");
  syncWallVideo();
  if (!Focus.bar) buildFocusBar();
  const what = w.el.querySelector(".win-title .t");
  $(".fb-what", Focus.bar).textContent = (kind === "game" ? "\uD83C\uDFAE Game mode" : "\uD83C\uDFAC Movie mode") +
    (what && what.textContent ? " \u00b7 " + what.textContent : "");
  askFullscreen();
  showFocusBar(2600);
  setTimeout(() => { if (Focus.win === w && w.api && w.api.focusFrame) w.api.focusFrame(); }, 60);
  focusIdle();
}
function leaveFocus(){
  const w = Focus.win;
  if (!w) return;
  Focus.win = null;
  clearTimeout(Focus.hideT);
  clearTimeout(Focus.idleT);
  w.el.classList.remove("focus-target", "focus-game", "focus-movie");
  document.body.classList.remove("focus-mode", "focus-idle");
  if (Focus.bar){ Focus.bar.remove(); Focus.hot.remove(); Focus.bar = Focus.hot = null; }
  try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e){}
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  syncWallVideo();
  if (windows.has(w.id)) focusWin(w);
}
function askFullscreen(){
  const root = document.documentElement;
  if (document.fullscreenElement || !root.requestFullscreen) return afterFullscreen();
  try {
    const p = root.requestFullscreen({ navigationUI: "hide" });
    if (p && p.then) p.then(afterFullscreen, afterFullscreen); else afterFullscreen();
  } catch (e){ afterFullscreen(); }
}
function afterFullscreen(){
  if (!Focus.win || !Focus.bar) return;
  const full = !!document.fullscreenElement;
  const lock = Focus.kind === "game" && navigator.keyboard && navigator.keyboard.lock;
  /* in a game Esc belongs to the game, so leaving full screen means holding it */
  if (full && lock) navigator.keyboard.lock(["Escape"]).catch(() => {});
  Focus.bar.classList.toggle("windowed", !full);
  $(".fb-hint", Focus.bar).textContent = !full ? "" : lock ? "Hold Esc to leave" : "Esc leaves";
  if (!full) showFocusBar(0);
}
document.addEventListener("fullscreenchange", () => {
  if (!Focus.win) return;
  /* a film is over when full screen is; a game only steps back, so Esc in it is not fatal */
  if (!document.fullscreenElement && Focus.kind === "movie") return leaveFocus();
  afterFullscreen();
});
function buildFocusBar(){
  const hot = el("div");
  hot.id = "focus-hot";
  const bar = el("div");
  bar.id = "focus-bar";
  const full = el("button", "fb-full", "\u26F6 Full screen");
  const out = el("button", "fb-out", "Leave");
  bar.append(el("span", "fb-what"), el("small", "fb-hint"), full, out);
  full.onclick = askFullscreen;
  out.onclick = leaveFocus;
  /* the game's page swallows the mouse, so a strip along the top edge brings the bar back */
  hot.onpointerenter = () => showFocusBar(0);
  bar.onpointerenter = () => clearTimeout(Focus.hideT);
  bar.onpointerleave = () => showFocusBar(900);
  document.body.append(hot, bar);
  Focus.bar = bar;
  Focus.hot = hot;
}
function showFocusBar(ms){
  clearTimeout(Focus.hideT);
  if (!Focus.bar) return;
  Focus.bar.classList.add("show");
  if (ms && document.fullscreenElement)
    Focus.hideT = setTimeout(() => { if (Focus.bar) Focus.bar.classList.remove("show"); }, ms);

/* in a film the controls and the pointer get out of the way when the mouse is still */
function focusIdle(){

addEventListener("pointerdown", () => { if (Focus.win && Focus.kind === "movie") focusIdle(); }, { passive: true });

/* A moving wallpaper nobody can see is still decoded, frame by frame, on the
   same thread the games run on. It waits while something covers it. */
function syncWallVideo(){
  const v = $("#wallvideo");
  if (!v || !v.classList.contains("on")) return;
  const covered = Focus.win || document.hidden ||
    Array.from(windows.values()).some(w => w.max && !w.min);

  else if (v.paused) v.play().catch(() => {});
}

/* ============================================================
   The performance meter. Frames a second and the worst frame, how
   long the page was busy, and how long a key or click waited before
   anything answered it - on the desktop, and inside a game's page
   when it is the window in front and lives on the same site.
   ============================================================ */
const Perf = { el: null, raf: 0, timer: 0, frames: [], last: 0, worst: 0, delays: [], busy: [], seen: new WeakSet() };
function perfWatch(win){
  if (!win || Perf.seen.has(win)) return;
  let PO;
  try { PO = win.PerformanceObserver; } catch (e){ return; }   /* another site's page - not ours to look at */
  if (!PO) return;
  Perf.seen.add(win);
  try {
    new PO(l => { for (const e of l.getEntries()) Perf.delays.push([Date.now(), Math.max(0, e.processingStart - e.startTime)]); })
      .observe({ type: "event", durationThreshold: 16, buffered: false });
  } catch (e){}
  try {
    new PO(l => { for (const e of l.getEntries()) Perf.busy.push([Date.now(), e.duration]); })
      .observe({ type: "longtask", buffered: false });
  } catch (e){}
}
function perfFrame(t){
  if (!Perf.el) return;
  if (Perf.last) Perf.worst = Math.max(Perf.worst, t - Perf.last);
  Perf.last = t;
  Perf.frames.push(t);
  Perf.raf = requestAnimationFrame(perfFrame);
}
function perfDraw(){
  if (!Perf.el) return;
  const now = performance.now(), wall = Date.now();
  Perf.frames = Perf.frames.filter(t => now - t < 1000);
  Perf.delays = Perf.delays.filter(d => wall - d[0] < 5000);
  Perf.busy = Perf.busy.filter(d => wall - d[0] < 5000);
  /* the window in front may be a game on this site - watch its page too */
  if (activeWin){
    const f = activeWin.el.querySelector("iframe");
    if (f) try { perfWatch(f.contentWindow); } catch (e){}
  }
  const fps = Perf.frames.length;
  const input = Perf.delays.reduce((m, d) => Math.max(m, d[1]), 0);
  const busy = Perf.busy.reduce((a, d) => a + d[1], 0);
  const grade = (v, ok, bad) => v <= ok ? "good" : v >= bad ? "bad" : "meh";
  Perf.el.innerHTML = "";
  const item = (label, value, g) => { const s = el("span", "ph-" + g); s.append(el("b", null, value), document.createTextNode(" " + label)); Perf.el.appendChild(s); };
  item("fps", String(fps), fps >= 55 ? "good" : fps >= 30 ? "meh" : "bad");
  item("worst frame", Math.round(Perf.worst) + " ms", grade(Perf.worst, 34, 100));
  item("input wait", Math.round(input) + " ms", grade(input, 16, 100));
  item("busy", Math.round(busy / 50) + "%", grade(busy / 50, 10, 40));
  Perf.worst = 0;
}
function perfHud(on){
  if (on && !Perf.el){
    Perf.el = el("div");
    Perf.el.id = "perf-hud";
    Perf.el.title = "Frames a second, the slowest frame, the longest a key or click waited, and how much of the last 5 seconds the page was busy";
    document.body.appendChild(Perf.el);
    perfWatch(window);
    Perf.last = 0;
    Perf.raf = requestAnimationFrame(perfFrame);
    Perf.timer = setInterval(perfDraw, 500);
  } else if (!on && Perf.el){
    cancelAnimationFrame(Perf.raf);
    clearInterval(Perf.timer);
    Perf.el.remove();
    Perf.el = null;
  }
}

/* ---- game mode: boot straight into one game, as big as it will go ---- */
function goFullscreen(){
  const root = document.documentElement;
  if (!root.requestFullscreen || document.fullscreenElement) return;
  const ask = () => { try { const p = root.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e){} };
  ask();
  /* browsers hand out full screen only off a gesture, so try again on the
     first click as well and then stop asking */
  const once = () => {
    document.removeEventListener("pointerdown", once, true);
    if (!document.fullscreenElement) ask();
  };
  document.addEventListener("pointerdown", once, true);
}
async function startGameMode(){
  const id = State.startMode === "game" ? String(State.gameApp || "") : "";
  if (!id) return false;
  if (!APPS[id]) await discoverGames();

    notify("Game mode", "The game it opens is not there any more. Pick another in Settings \u203A Startup.", "\uD83C\uDFAE");
    return false;
  }
  /* full screen needs a click first, so until then the bar offers it */
  gameMode(id);
  return true;
}

      el("p", null, "Add a game, at the top, takes a game on a website by its address, or an .html file - " +
                    "from Files or from this computer. They are kept in SEA OS itself, and nothing needs uploading."),
      el("p", null, "An .html game can also go in the games/ folder of the repository. It shows up here named " +
                    "after its file, and runs as a page of its own, so games that save keep what they save."),
      el("p", null, "A game you add yourself can carry these tags for its name, icon, colour and size:"),
      el("pre", "hp-code", '<title>My Game</title>\n<meta name="description" content="What you do">\n' +
                           '<meta name="box-icon" content="🎯">\n<meta name="box-color" content="#3a7bd5">\n' +

    body.appendChild(how);

  async function refresh(){

  /* ---- adding your own ---- */
  async function addLink(){
    const vals = await modal({ title: "A game on a website", ok: "Add",
      message: "Its name, and the address of the page that plays it.",
      fields: [{ label: "Name", placeholder: "My Game" }, { label: "Address", placeholder: "https://" }] });
    if (!vals) return;

    State.myGames = (State.myGames || []).filter(e => e.name !== name).concat({ name, url, icon: "\uD83C\uDFAE" });

  function keep(name, content, kind, mime){

/* ============================================================
   12h. Text Editor - a standalone one, rather than only inside Files
   ============================================================ */
function editorApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="te-tb">' +
      '<button class="tb-btn" data-t="open">Open\u2026</button>' +
      '<button class="tb-btn" data-t="save">Save</button>' +
      '<button class="tb-btn" data-t="saveas">Save As\u2026</button>' +
      '<span class="te-name"></span><span class="ed-dot">&bull;</span>' +
      '<span class="ed-sp"></span>' +
      '<button class="tb-btn" data-t="find">Find</button>' +
      '<button class="tb-btn" data-t="wrap">Wrap</button>' +
    '</div>' +
    '<div class="te-find">' +
      '<input class="te-q" placeholder="Find" spellcheck="false">' +
      '<input class="te-r" placeholder="Replace with" spellcheck="false">' +
      '<button class="tb-btn" data-t="next">Next</button>' +
      '<button class="tb-btn" data-t="rep">Replace</button>' +
      '<button class="tb-btn" data-t="repall">All</button>' +
      '<span class="te-hits"></span>' +
      '<button class="tb-btn" data-t="closefind">&#10005;</button>' +
    '</div>' +
    '<textarea class="te-area" spellcheck="false" wrap="off"></textarea>' +
    '<div class="te-foot"><span class="te-pos"></span><span class="ed-sp"></span><span class="te-info"></span></div>';

  const area = $(".te-area", B), findBar = $(".te-find", B);
  const q = $(".te-q", B), rep = $(".te-r", B), hits = $(".te-hits", B);
  const nameEl = $(".te-name", B), posEl = $(".te-pos", B), infoEl = $(".te-info", B);
  const btn = k => $('[data-t="' + k + '"]', B);
  let path = null, saved = "", wrap = false;

  const dirty = () => area.value !== saved;
  function retitle(){
    const label = path ? baseName(path) : "Untitled";
    nameEl.textContent = label;
    nameEl.title = path || "not saved yet";
    B.classList.toggle("dirty", dirty());
    win.setTitle(label + (dirty() ? " \u2022" : ""));
  }
  function status(){
    const upto = area.value.slice(0, area.selectionStart);
    const line = upto.split("\n").length;
    const col = upto.length - upto.lastIndexOf("\n");
    posEl.textContent = "Line " + line + ", column " + col;
    infoEl.textContent = area.value.split("\n").length + " lines \u00b7 " +
      area.value.length + " chars" + (path ? " \u00b7 " + tilde(path) : "");
    retitle();
  }
  function load(p){
    const n = node(p);
    if (!n || n.type !== "file" || n.kind !== "text")
      return osAlert("Cannot open that", baseName(p) + " is not a text file.");
    path = p;
    area.value = n.content;
    saved = n.content;
    status();
    area.focus();
  }
  async function doOpen(){
    if (dirty() && !(await osConfirm("Unsaved changes", "Open another file and lose your changes?", "Discard", true))) return;
    const p = await pickFile({ title: "Open a file", ok: "Open", start: HOME + "/Documents",
                               accept: (nm, n) => n.kind === "text" });
    if (p) load(p);
  }
  function doSave(){
    if (!path) return doSaveAs();
    writeFile(path, area.value, "text");
    saved = area.value;
    status();
    refreshFilesViews();
    notify("Saved", tilde(path), "\uD83D\uDCBE");
  }
  async function doSaveAs(){
    const name = await osPrompt("Save As", "File name", path ? baseName(path) : "untitled.txt");
    if (!name) return;
    const dir = path ? dirName(path) : HOME + "/Documents";
    ensureDir(dir);
    const final = addUnique(dir, name, area.value, "text", "text/plain");
    if (!final) return osAlert("Could not save", "That folder would not take the file.");
    path = dir + "/" + final;
    saved = area.value;
    status();
    refreshFilesViews();
    notify("Saved", tilde(path), "\uD83D\uDCBE");
  }

  /* find and replace, working off the live selection */
  function countHits(){
    const needle = q.value;
    if (!needle) return void (hits.textContent = "");
    let n = 0, i = area.value.toLowerCase().indexOf(needle.toLowerCase());
    while (i >= 0){ n++; i = area.value.toLowerCase().indexOf(needle.toLowerCase(), i + needle.length); }
    hits.textContent = n ? n + " found" : "none";
  }
  function findNext(){
    const needle = q.value;
    if (!needle) return;
    const hay = area.value.toLowerCase(), want = needle.toLowerCase();
    let from = area.selectionEnd;
    let i = hay.indexOf(want, from);
    if (i < 0) i = hay.indexOf(want);          /* wrap around */
    if (i < 0) return void (hits.textContent = "none");
    area.focus();
    area.setSelectionRange(i, i + needle.length);
    status();
  }
  function replaceOne(){
    const needle = q.value;
    if (!needle) return;
    const sel = area.value.slice(area.selectionStart, area.selectionEnd);
    if (sel.toLowerCase() === needle.toLowerCase()){
      const at = area.selectionStart;
      area.setRangeText(rep.value, at, area.selectionEnd, "end");
      status();
      countHits();
    }
    findNext();
  }
  function replaceAll(){
    const needle = q.value;
    if (!needle) return;
    /* walked by hand rather than with a regex, so the search text never has
       to be escaped and characters like . or ( behave literally */
    const want = needle.toLowerCase();
    let out = "", rest = area.value, n = 0;
    for (;;){
      const i = rest.toLowerCase().indexOf(want);
      if (i < 0){ out += rest; break; }
      out += rest.slice(0, i) + rep.value;
      rest = rest.slice(i + needle.length);
      n++;
    }
    if (!n) return void (hits.textContent = "none");
    area.value = out;
    status();
    countHits();
    notify("Replaced", n + " occurrence" + (n === 1 ? "" : "s") + " changed.", "\u270F\uFE0F");
  }
  function toggleFind(on){
    const show = on === undefined ? !findBar.classList.contains("on") : on;
    findBar.classList.toggle("on", show);
    if (show){ q.focus(); q.select(); countHits(); }
    else area.focus();
  }

  btn("open").onclick   = doOpen;
  btn("save").onclick   = doSave;
  btn("saveas").onclick = doSaveAs;
  btn("find").onclick   = () => toggleFind();
  btn("wrap").onclick   = () => {
    wrap = !wrap;
    area.wrap = wrap ? "soft" : "off";
    area.style.whiteSpace = wrap ? "pre-wrap" : "pre";
    btn("wrap").classList.toggle("on", wrap);
  };
  btn("next").onclick      = findNext;
  btn("rep").onclick       = replaceOne;
  btn("repall").onclick    = replaceAll;
  btn("closefind").onclick = () => toggleFind(false);
  q.oninput = countHits;
  q.onkeydown = e => { if (e.key === "Enter" || e.key === "Return"){ e.preventDefault(); findNext(); } };

  area.addEventListener("input", status);
  area.addEventListener("keyup", status);
  area.addEventListener("click", status);
  area.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "s"){ e.preventDefault(); doSave(); }
    if (mod && e.key.toLowerCase() === "o"){ e.preventDefault(); doOpen(); }
    if (mod && e.key.toLowerCase() === "f"){ e.preventDefault(); toggleFind(true); }
    if (e.key === "Escape" && findBar.classList.contains("on")){ e.preventDefault(); toggleFind(false); }
    if (e.key === "Tab"){
      e.preventDefault();
      const a = area.selectionStart, b = area.selectionEnd;
      area.setRangeText("  ", a, b, "end");
      status();
    }
  });

  if (startPath) load(startPath); else status();
  setTimeout(() => area.focus(), 30);

  return {
    open: load,
    menus(){
      return {
        File: [
          { label: "New", run: async () => {
              if (dirty() && !(await osConfirm("Unsaved changes", "Start a new file and lose your changes?", "Discard", true))) return;
              path = null; area.value = ""; saved = ""; status();
            } },
          { label: "Open\u2026", run: doOpen },
          "-",
          { label: "Save", run: doSave, disabled: !dirty() && !!path },
          { label: "Save As\u2026", run: doSaveAs },
          { label: "Save to computer", run: () => path ? saveToComputer(path) : doSaveAs(), disabled: dirty() },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        Edit: [
          { label: "Undo", run: () => { area.focus(); document.execCommand("undo"); status(); } },
          { label: "Redo", run: () => { area.focus(); document.execCommand("redo"); status(); } },
          "-",
          { label: "Find and replace", run: () => toggleFind(true) },
          { label: "Select All", run: () => { area.focus(); area.select(); } }
        ],
        View: [
          { label: (wrap ? "Stop wrapping" : "Wrap long lines"), run: () => btn("wrap").click() }
        ]
      };
    },
    onClose(){
      if (!dirty()) return true;
      osConfirm("Unsaved changes", (path ? baseName(path) : "This file") +
                " has unsaved changes.\n\nClose and lose them?", "Discard", true)
        .then(ok => { if (ok){ saved = area.value; win.close(); } });
      return false;
    }
  };
}

/* ============================================================
   13b. screen saver - the boot porthole, a clock, and nothing else

   It comes up after a spell with no mouse or keyboard, and never while
   something is being watched or played: a video or song playing, a site's
   player open in Media or Videos, full screen, or you working inside an app
   or game frame (which swallows the mouse, so it would look idle).
   ============================================================ */
const SAVER_PORT = ["#boot .sea-port", "#boot .chalk-art"].map(q => { const p = $(q); return p ? p.outerHTML : ""; }).join("");
const Saver = { el: null, idleAt: Date.now(), tick: 0, drift: 0, from: null };

function saverBlocked(){
  if (Focus.win || $("#boot") || document.fullscreenElement || document.visibilityState !== "visible") return true;
  const a = document.activeElement;
  if (a && a.tagName === "IFRAME") return true;
  if (NowPlaying.playing) return true;
  if ($$("video").some(v => !v.paused && !v.closest("#wallpaper"))) return true;
  return !!$(".mu-yt iframe, .vd-web iframe");
}
function showSaver(){
  if (Saver.el) return;
  const s = el("div");
  s.id = "saver";
  const wrap = el("div", "sv-wrap");
  wrap.innerHTML = SAVER_PORT;
  const time = el("div", "sv-time"), date = el("div", "sv-date");
  wrap.append(time, date);
  s.appendChild(wrap);
  document.body.appendChild(s);
  Saver.el = s;
  Saver.from = null;
  const clock = () => {
    const d = new Date();
    const h = State.clock24 ? d.getHours() : (d.getHours() % 12 || 12);
    time.textContent = (State.clock24 ? String(h).padStart(2, "0") : h) + ":" + String(d.getMinutes()).padStart(2, "0");
    date.textContent = d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  };
  /* wander a little, so nothing sits in one place on the screen for long */
  const move = () => {
    wrap.style.left = (30 + Math.random() * 40) + "%";
    wrap.style.top = (32 + Math.random() * 36) + "%";
  };
  clock();
  wrap.style.left = "50%";
  wrap.style.top = "50%";
  Saver.tick = setInterval(clock, 1000);
  Saver.drift = setInterval(move, 14000);
  requestAnimationFrame(() => s.classList.add("on"));
}
function hideSaver(){
  const s = Saver.el;
  Saver.idleAt = Date.now();
  if (!s) return;
  Saver.el = null;
  clearInterval(Saver.tick);
  clearInterval(Saver.drift);
  s.classList.remove("on");
  setTimeout(() => s.remove(), 500);
}
function saverActivity(e){
  Saver.idleAt = Date.now();
  if (!Saver.el) return;
  /* a mouse that settles by a pixel is not someone coming back */
  if (e.type === "pointermove"){
    if (!Saver.from){ Saver.from = { x: e.clientX, y: e.clientY }; return; }
    if (Math.abs(e.clientX - Saver.from.x) + Math.abs(e.clientY - Saver.from.y) < 12) return;
  }
  if (e.type === "keydown" || e.type === "pointerdown"){ e.preventDefault(); e.stopPropagation(); }
  hideSaver();
}
for (const t of ["pointermove", "pointerdown", "keydown", "wheel", "touchstart"])
  addEventListener(t, saverActivity, { capture: true, passive: t !== "keydown" && t !== "pointerdown" });
setInterval(() => {
  const mins = Number(State.screensaver) || 0;
  if (!mins || Saver.el) return;
  if (saverBlocked()){ Saver.idleAt = Date.now(); return; }
  if (Date.now() - Saver.idleAt >= mins * 60000) showSaver();
}, 5000);

/* Settings > Desktop > Transparency: the Dock or taskbar, the menu bar and the
   windows can each be made see-through. The colours they start from are read
   back from whatever the theme and desktop style make them, so it works in
   every style and in light and dark alike. Windows that redraw all the time -
   games, pages, video - stay solid, the same as with Liquid Glass. */
function applyTransparency(){
  const root = document.documentElement, body = document.body;
  if (!body) return;
  const clear = v => Math.max(0, Math.min(100, Number(v) || 0));
  const panel = clear(State.tpPanel), bar = clear(State.tpBar), win = clear(State.tpWin);
  body.classList.remove("tp-panel", "tp-bar", "tp-win", "tp-blur");
  const bgOf = sel => { const e = $(sel); return e ? getComputedStyle(e).backgroundColor : ""; };
  const cs = getComputedStyle(root);
  root.style.setProperty("--tp-panel-bg", bgOf("#panel") || "rgb(44,44,44)");
  root.style.setProperty("--tp-bar-bg", bgOf("#menubar") || "rgb(240,240,240)");
  for (const v of ["--surface", "--surface-2", "--surface-3", "--title", "--title-off", "--bg"])
    root.style.setProperty("--tp" + v, cs.getPropertyValue(v).trim());
  root.style.setProperty("--tp-panel", (100 - panel) + "%");
  root.style.setProperty("--tp-bar", (100 - bar) + "%");
  root.style.setProperty("--tp-win", (100 - win) + "%");
  body.classList.toggle("tp-panel", panel > 0);
  body.classList.toggle("tp-bar", bar > 0);
  body.classList.toggle("tp-win", win > 0);
  body.classList.toggle("tp-blur", State.tpBlur !== false && (panel > 0 || bar > 0 || win > 0));
  body.classList.toggle("tp-abs", !!State.tpAbs);
}

  document.documentElement.dataset.theme = State.theme;

function applyWallpaper(){
  const w = $("#wallpaper"), v = $("#wallvideo");
  document.documentElement.style.setProperty("--wall", State.wallColor);

  /* your own choice first, then anything sitting beside box-os.html */
  const chosen = mediaSource(State.wallVideo);
  const src = chosen ? chosen.content
            : (!State.customWall && Sibling.wall && Sibling.wall.video) ? Sibling.wall.url
            : null;
  if (src){
    if (v.dataset.src !== src){
      v.src = src;
      v.dataset.src = src;
    }
    v.style.objectFit = State.wallFit === "tile" ? "cover" : State.wallFit;
    v.classList.add("on");

      v.pause();

      delete v.dataset.src;
    }
  }
  /* a path that no longer resolves should not leave the setting dangling */
  if (State.wallVideo && !chosen) State.wallVideo = null;

  const still = State.customWall ? State.customWall
              : (!src && Sibling.wall && !Sibling.wall.video) ? Sibling.wall.url

    w.style.backgroundRepeat = State.wallFit === "tile" ? "repeat" : "no-repeat";

/* ============================================================
   13b. desktop environments

   A shell is mostly CSS. The parts that cannot be done in CSS - where the
   clock lives, and a dock of app launchers instead of a window list - are

const SHELLS = {
  mint:  { name: "Mint",   desc: "Panel along the bottom, window list, menu button" },
  macos: { name: "macOS",  desc: "Menu bar on top, dock at the bottom, traffic lights" },
  hypr:  { name: "Hyprland", desc: "Tiling. Windows share the screen instead of stacking" }
};
/* A shell can come in more than one style. A style is a class on the body
   and a block of CSS; the shell's own layout never changes. The first one
   listed is the default. */
const SUBTHEMES = {
  macos: {
    classic: { name: "Classic", desc: "Solid windows under a frosted menu bar and Dock." },

function currentSubtheme(shell){
  const styles = SUBTHEMES[shell];

  return styles[want] ? want : Object.keys(styles)[0];
}

function applyShell(){
  const shell = SHELLS[State.shell] ? State.shell : "mint";
  for (const id in SHELLS) document.body.classList.toggle("shell-" + id, id === shell);
  const style = currentSubtheme(shell);
  for (const sh in SUBTHEMES)
    for (const id in SUBTHEMES[sh]) document.body.classList.toggle("sub-" + id, sh === shell && id === style);

  const tray = $("#tray"), panel = $("#panel"), menubar = $("#menubar");
  if (shell === "macos" || shell === "hypr"){

    $(".mb-logo", menubar).onclick = e => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); };
  } else {
    if (tray.parentElement !== panel) panel.appendChild(tray);

  updateMenuBarApp();

/* the dock lists what you have pinned, plus anything running that is not */
function drawDock(){
  updateDeskBtn();
  const dock = $("#dock");
  if (!dock) return;
  dock.innerHTML = "";
  if (State.shell !== "macos") return;

  const running = new Set(Array.from(windows.values()).map(w => w.appId));
  const pinned = (State.dock || []).filter(id => APPS[id] && !APPS[id].hidden);
  const extra = Array.from(running).filter(id => APPS[id] && !APPS[id].hidden && !pinned.includes(id));

  const add = (id, isPinned) => {
    const a = APPS[id];
    const b = el("button", "dock-app" + (running.has(id) ? " running" : ""));
    setAppIcon(b, a.icon);
    if (id === "chat" && Chat.unread){
      const badge = el("span", "dock-badge", Chat.unread > 99 ? "99+" : String(Chat.unread));
      b.appendChild(badge);
    }
    b.title = a.name + (id === "chat" && Chat.unread ? " - " + Chat.unread + " unread" : "");
    b.dataset.app = id;
    b.onclick = () => {
      const mine = Array.from(windows.values()).filter(w => w.appId === id);
      if (!mine.length) return launch(id);
      const hidden = mine.find(w => w.min);
      if (hidden) return focusWin(hidden);
      /* already looking at it? then put it away again */
      if (mine.includes(activeWin)) return minimizeWin(activeWin);
      focusWin(mine[mine.length - 1]);
    };
    b.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      const open = Array.from(windows.values()).filter(w => w.appId === id);
      showCtx(e.clientX, e.clientY, [
        { icon: "\u25B6", label: open.length ? "Show " + a.name : "Open " + a.name,
          run: () => open.length ? focusWin(open[open.length - 1]) : launch(id) },
        { icon: "\u2795", label: "New window", run: () => launch(id, null, true) },
        ...(a.game ? [{ icon: "🎮", label: "Game mode", run: () => gameMode(id) }] : []),
        "-",
        isPinned
          ? { icon: "\u2716", label: "Remove from Dock", run: () => { State.dock = State.dock.filter(x => x !== id); saveSettings(); drawDock(); } }
          : { icon: "\uD83D\uDCCC", label: "Keep in Dock", run: () => { State.dock = (State.dock || []).concat(id); saveSettings(); drawDock(); } },
        { icon: "\u274C", label: open.length ? "Quit (" + open.length + " open)" : "Quit", disabled: !open.length,
          run: () => open.forEach(w => w.close()) }
      ]);
    };
    makeDropTarget(b, () => id,
                   () => Array.from(windows.values()).filter(w => w.appId === id).pop() || null);
    dock.appendChild(b);
  };
  pinned.forEach(id => add(id, true));
  if (extra.length){
    dock.appendChild(el("div", "dock-sep"));
    extra.forEach(id => add(id, false));
  }

  brandTree(dock);
  if (dockIntroPending) runDockIntro();
}

/* boot: the dock slides up, then the icons hop in one after another */
let dockIntroPending = false;
function runDockIntro(){
  const panel = $("#panel"), dock = $("#dock");
  if (!panel || !dock || !dock.children.length) return;
  dockIntroPending = false;
  if (!State.animations || State.shell !== "macos") return;
  panel.classList.remove("dock-in");
  void panel.offsetWidth;
  panel.classList.add("dock-in");
  Array.from(dock.children).forEach((c, i) => {
    if (!c.classList.contains("dock-app")) return;
    c.style.animation = "none";
    void c.offsetWidth;
    c.style.animation = "dockHop .42s cubic-bezier(.3,1.5,.5,1) " + (260 + i * 55) + "ms both";
  });
  setTimeout(() => {
    panel.classList.remove("dock-in");
    Array.from(dock.children).forEach(c => { c.style.animation = ""; });
  }, 260 + dock.children.length * 55 + 500);
}

function settingsApp(win){

    /* --- the Store --- */

      };

      dv.appendChild(dvRow);
      dv.appendChild(toggle("Performance meter",
        "A strip in the corner with frames a second, the slowest frame, how long keys and clicks wait, and how busy " +
        "the page is. It follows a game's page too, when that game is the window in front. It stays up in Game mode.",
        !!State.perfHud,
        v => { State.perfHud = v; saveSettings(); perfHud(v); render(); }));
      const dvBits = el("dl", "about");
      for (const [k, v] of [["Version", VERSION],
                            ["Repository", repoName() || "none"],
                            ["Files from", repoBase() || "beside index.html"],
                            ["Disk", Disk.ok ? "the browser's file storage" : Disk.blocked ? "paused" : "localStorage only"],

        dvBits.appendChild(el("dd", null, v));
      }
      dv.appendChild(dvBits);
    }

    /* --- storage --- */
    const st = section("Storage", "storage");
    st.appendChild(toggle("Save my files",
      Store.available
        ? "Keep files, settings and shortcuts in this browser. Turning this off deletes everything SEA OS has stored."
        : "Unavailable - this browser is blocking storage for local files.",
      Store.on,
      v => setSaving(v),
      Store.available ? null : "unavailable"));
    if (Store.on){
      const whereRow = row("Keep files in");
      whereRow.appendChild(seg([["disk", "File storage"], ["local", "localStorage"]], State.storage === "local" ? "local" : "disk",
        v => switchStorage(v).then(render)));
      st.appendChild(whereRow);
      st.appendChild(el("div", "store-note", State.storage === "local"
        ? "Everything in localStorage: simple and plain, but only 5 to 10 MB for the lot, so big songs and videos will not fit."
        : "Big files go in the browser's own file storage, which holds gigabytes; localStorage keeps the list of them."));
    }
    st.appendChild(toggle("Use the repository's files",
      "Music, videos, pictures, apps and games kept in a GitHub repository. Off, SEA OS uses only what you " +
      "have added to it, and asks GitHub nothing. Takes effect the next time SEA OS starts.",
      State.useRepo !== false,
      v => { State.useRepo = v; saveSettings(); render(); notify(v ? "Using the repository" : "Not using the repository",
        "Takes effect the next time SEA OS starts.", "\uD83D\uDCE6"); }));
    if (State.useRepo !== false){
      const rRow = row("Repository");
      const rIn = el("input", "modal-in");
      rIn.value = State.repo || "";
      rIn.placeholder = repoName() + " (the default)";
      rIn.spellcheck = false;
      rIn.style.cssText = "flex:1;min-width:170px;margin:0";
      rIn.onchange = () => {
        State.repo = rIn.value.trim();

        saveSettings();
        render();
      };
      rRow.appendChild(rIn);
      st.appendChild(rRow);
      const where = repoName();
      st.appendChild(el("div", "store-note", where
        ? "Asking GitHub what is in " + where + ", so music/, videos/, pictures/, apps/ and games/ need no " +
          "manifest files listing them. Answers are kept for a few hours" +
          (repoBase() ? ", and the files themselves come from " + repoBase() + "." : ".") +
          (State.repo ? "" : " Left blank, this is CHALK OS's own repository; name another to use yours.")
        : "Name a repository as user/repository - Guernica4u/CHALK-OS, say - and SEA OS asks GitHub what is in " +
          "its folders. Without one it falls back to the manifest.js files beside index.html."));
    }

    if (Store.on){
      const used = storageUsage() + (Disk.ok ? diskBytes() : 0);
      const pct = Math.min(100, Math.round(used / LS_GAUGE * 100));
      const barRow = row("Used");
      const bar = el("div", "store-bar" + (Store.unsaved.size ? " full" : ""));
      const fill = el("i");
      fill.style.width = Math.max(2, Disk.ok ? 2 : pct) + "%";
      bar.appendChild(fill);
      const usedEl = el("span", null, fmtBytes(used));
      barRow.append(bar, usedEl);
      st.appendChild(barRow);

      const when = Store.lastSaved ? fmtAgo(Store.lastSaved) : "not yet";
      const note = el("div", "store-note", "Last saved " + when + ". " + (Disk.ok
        ? "Files are kept in this browser's own file storage, which can hold gigabytes."
        : Disk.blocked
        ? "Saving is paused: the storage holding your bigger files would not open. Reload to try again."
        : "This browser has no file storage for SEA OS, so everything shares the usual 5 to 10 MB."));
      /* the real ceiling depends on the disk, and only the browser knows it */
      if (Disk.ok && navigator.storage && navigator.storage.estimate){
        navigator.storage.estimate().then(e => {
          if (!e || !e.quota || !bar.isConnected) return;
          fill.style.width = Math.max(2, Math.min(100, Math.round(used / e.quota * 100))) + "%";
          usedEl.textContent = fmtBytes(used) + " of " + fmtBytes(e.quota);
        }).catch(() => {});
      }
      if (Store.unsaved.size){
        note.textContent += " " + Store.unsaved.size +
          (Store.unsaved.size === 1 ? " file is" : " files are") +
          " too big to save and will be gone after a reload.";
      }
      st.appendChild(note);
    } else {
      st.appendChild(el("div", "store-note",
        "Nothing is being written. Everything resets when you reload."));
    }

    st.appendChild(toggle("Developer mode",
      "Adds a Developer page: Tide, the repository's workings, and what SEA OS is running on.",
      !!State.devMode,
      v => { State.devMode = v; if (!v && settingsPage === "dev") settingsPage = "storage"; perfHud(v && State.perfHud); saveSettings(); render(); }));

    const backupRow = row(null);
    backupRow.style.marginTop = "13px";
    const bk = el("button", "btn", "Back up to a file");
    bk.onclick = downloadBackup;
    const rs = el("button", "btn", "Restore from a file\u2026");

    st.appendChild(backupRow);
    st.appendChild(el("div", "store-note",
      "A backup holds every file, setting and shortcut. It works whether or not saving is on, and it is the only copy that survives clearing your browser data."));

    const dangerRow = row(null);
    dangerRow.style.marginTop = "13px";
    const reset = el("button", "btn danger", "Reset to factory");
    reset.onclick = async () => {
      const ok = await osConfirm("Reset to factory",
        "Delete every file, setting and shortcut, wipe anything saved in this browser, and start over from scratch?",
        "Erase everything", true);
      if (!ok) return;
      Store.on = false;
      for (const k in K){ try { localStorage.removeItem(K[k]); } catch (e){} }
      location.reload();
    };
    dangerRow.appendChild(reset);
    st.appendChild(dangerRow);

    /* --- about --- */
    const ab = section("About this system", "about");
    const dl = el("dl", "about");
    const pairs = [
      ["System", "SEA OS " + VERSION + " \u2014 a desktop in one HTML file"],
      ["Session", "\u2014"], ["Windows", "\u2014"], ["Disk", "\u2014"],
      ["Shortcuts", "\u2014"], ["Display", "\u2014"],
      ["Storage", "-"]
    ];
    for (const [k, v] of pairs){
      dl.appendChild(el("dt", null, k));
      dl.appendChild(el("dd", null, v));
    }
    ab.appendChild(dl);
    const rr = row(null);
    rr.style.marginTop = "14px";
    const restart = el("button", "btn", "Restart SEA OS");
    restart.onclick = async () => {
      if (await osConfirm("Restart", restartMessage(), "Restart", !Store.on)) location.reload();
    };
    rr.appendChild(restart);
    ab.appendChild(rr);
    brandTree(B);
    dds = Array.from(dl.querySelectorAll("dd"));
    tick();
  }

  let dds = [];
  function tick(){
    if (!dds.length || !B.isConnected) return;
    dds[1].textContent = fmtDuration(Date.now() - BOOT_TIME);
    dds[2].textContent = windows.size + " open";
    dds[3].textContent = countFiles() + " files";
    dds[4].textContent = State.shortcuts.length + " custom, " +
      BUILTIN_ICONS.filter(b => State.builtins[b.id]).length + " default";
    dds[5].textContent = innerWidth + " x " + innerHeight;
    dds[6].textContent = !Store.available ? "Unavailable in this browser"
      : Store.on ? "Saving to this browser"
      : "Volatile - everything resets on reload";
  }
  const timer = setInterval(tick, 1000);

  /* import a media file from the real computer, then hand back its VFS path */
  function chooseMedia(kind, then){
    const inp = $("#mediapicker");
    inp.value = "";
    inp.accept = kind === "video" ? "video/*" : "video/*,image/*";
    inp.onchange = async () => {
      const f = inp.files && inp.files[0];
      inp.onchange = null;
      if (!f) return;
      const dir = isVideo(f.name) ? HOME + "/Videos" : HOME + "/Pictures";
      const name = await importMediaFile(f, dir);
      if (!name) return osAlert("Could not read that", "The file could not be loaded.");
      then(dir + "/" + name);
      render();
    };
    inp.click();
  }

  function pickWallpaper(){
    const inp = $("#wallpicker");
    inp.value = "";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      inp.onchange = null;
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        State.customWall = r.result;
        applyWallpaper();
        render();
        notify("Wallpaper changed", f.name, "\uD83D\uDDBC\uFE0F");
      };
      r.readAsDataURL(f);
    };
    inp.click();
  }

  render();
  return { refresh: render, onClose(){ clearInterval(timer); return true; } };
}

/* ============================================================
   15. shell: menu, panel, clock, notification centre
   ============================================================ */
const menuEl = $("#menu"), menuBtn = $("#menubtn"), searchEl = $("#msearch"), appsEl = $("#mapps");
const npEl = $("#npanel"), clockBtn = $("#clockbtn");
let menuOpen = false, npOpen = false;

function drawMenu(filter){
  appsEl.innerHTML = "";
  const q = (filter || "").toLowerCase();
  const ids = Object.keys(APPS).filter(id => !APPS[id].hidden && (!APPS[id].game || q) &&
    (!q || APPS[id].name.toLowerCase().includes(q) || APPS[id].desc.toLowerCase().includes(q) || id.includes(q)));

  /* a query searches the filesystem as well as the app list */
  const hits = [];
  if (q) walkFS((p, n, name) => {
    if (hits.length < 8 && name.toLowerCase().includes(q)) hits.push([p, n, name]);
  });

  if (!ids.length && !hits.length){
    appsEl.appendChild(el("div", "fm-empty", "Nothing matches that"));
    return;
  }
  ids.forEach((id, i) => {
    const a = APPS[id];
    const b = el("button", "mapp" + (i === 0 && q ? " hl" : ""));
    const txt = el("span");
    txt.append(el("div", "n", a.name), el("div", "d", a.desc));
    const gi = el("span", "g");
    setAppIcon(gi, a.icon);
    b.append(gi, txt);
    b.onclick = () => { closeMenu(); launch(id); };
    b.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      showCtx(e.clientX, e.clientY, [
        { icon: a.icon, label: "Open " + a.name, run: () => { closeMenu(); launch(id); } },
        { icon: "\uD83D\uDCCC", label: "Add to Desktop", run: () => {
            closeMenu();
            if (State.shortcuts.some(s => s.kind === "app" && s.target === id))
              return notify("Already there", a.name + " is already on the desktop.", "\u2139\uFE0F");
            addShortcut({ kind: "app", target: id, icon: a.icon, label: a.name });
          } }
      ]);
    };
    appsEl.appendChild(b);
  });

  if (hits.length){
    const head = el("div", "side-h", "Files");
    head.style.padding = "10px 10px 3px";
    appsEl.appendChild(head);
    for (const [p, n, name] of hits){
      const b = el("button", "mapp" + (!ids.length && hits[0][0] === p ? " hl" : ""));
      const txt = el("span");
      txt.append(el("div", "n", name), el("div", "d", tilde(dirName(p))));
      b.append(el("span", "g", nodeIcon(name, n)), txt);
      b.onclick = () => { closeMenu(); openNode(p); };
      appsEl.appendChild(b);
    }
  }
  brandTree(appsEl);
}

function openMenu(){
  closeNp();
  menuOpen = true;
  menuEl.classList.remove("hidden");
  menuBtn.classList.add("on");
  searchEl.value = "";
  drawMenu("");
  setTimeout(() => searchEl.focus(), 0);
}
function closeMenu(){
  menuOpen = false;
  menuEl.classList.add("hidden");
  menuBtn.classList.remove("on");
}
function openNp(){
  closeMenu();
  npOpen = true;
  npEl.classList.remove("hidden");
  clockBtn.classList.add("on");
  clockBtn.classList.remove("unread");
  drawCalendar();
  drawNotifications();
  npTick();
}
function closeNp(){
  npOpen = false;
  npEl.classList.add("hidden");
  clockBtn.classList.remove("on");
}
function npTick(){
  if (!npOpen) return;
  const d = new Date();
  $("#np-time").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: !State.clock24 });
  $("#np-date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}
menuBtn.onclick = e => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); };
clockBtn.onclick = e => { e.stopPropagation(); npOpen ? closeNp() : openNp(); };
menuEl.addEventListener("pointerdown", e => e.stopPropagation());
npEl.addEventListener("pointerdown", e => e.stopPropagation());
$("#np-clear").onclick = () => { State.notifications = []; drawNotifications(); };
searchEl.addEventListener("input", () => drawMenu(searchEl.value));
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === "Return"){ const f = $(".mapp", appsEl); if (f) f.click(); }
  else if (e.key === "Escape") closeMenu();
});
$("#mset").onclick     = () => { closeMenu(); launch("settings"); };
$("#mterm").onclick    = () => { closeMenu(); launch("terminal"); };
$("#mrestart").onclick = async () => {
  closeMenu();
  if (await osConfirm("Restart", restartMessage(), "Restart", !Store.on)) location.reload();
};

document.addEventListener("pointerdown", e => {
  if (menuOpen && !e.target.closest("#menu") && !e.target.closest("#menubtn")) closeMenu();
  if (npOpen && !e.target.closest("#npanel") && !e.target.closest("#clockbtn")) closeNp();
  if (!e.target.closest("#ctx")) hideCtx();
  if (!e.target.closest(".dicon")) $$(".dicon").forEach(d => d.classList.remove("sel"));
});
document.addEventListener("keydown", e => {
  if (Focus.win){
    if (e.key === "Escape" && (Focus.kind === "movie" || !document.fullscreenElement)) leaveFocus();
    return;
  }
  if (e.key === "Escape"){ hideCtx(); if (menuOpen) closeMenu(); if (npOpen) closeNp(); }

  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "") || e.target.isContentEditable;

  /* Ctrl+Alt+... : tile, launch, show desktop. Chosen over the Super key
     because Windows swallows that one before the page ever sees it. */
  if (e.ctrlKey && e.altKey && !e.shiftKey){
    const w = activeWin;
    const zone = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "max", ArrowDown: "bottom" }[e.key];
    if (zone && w){ e.preventDefault(); return applySnap(w, zone); }
    const k = (e.key || "").toLowerCase();
    if (k === "t"){ e.preventDefault(); return launch("terminal"); }
    if (k === "f"){ e.preventDefault(); return launch("files"); }
    if (k === "b"){ e.preventDefault(); return launch("browser"); }
    if (k === "d"){ e.preventDefault(); return $("#traydesk").click(); }
  }
  /* browser tab keys, but only while the browser has focus, so Ctrl+W
     does not get taken away from the rest of the page */
  if ((e.ctrlKey || e.metaKey) && !e.altKey && activeWin && activeWin.appId === "browser"){
    const k = (e.key || "").toLowerCase();
    const api = activeWin.api || {};
    if (e.shiftKey && k === "t" && api.reopen){ e.preventDefault(); api.reopen(); return; }
    if (e.shiftKey && k === "b" && api.toggleBar){ e.preventDefault(); api.toggleBar(); return; }
    if (e.shiftKey && k === "o" && api.showBookmarks){ e.preventDefault(); api.showBookmarks(); return; }
    if (k === "t" && api.newTab){ e.preventDefault(); api.newTab(); return; }
    if (k === "l" && api.focusAddr){ e.preventDefault(); api.focusAddr(); return; }
    if (k === "d" && api.toggleStar){ e.preventDefault(); api.toggleStar(); return; }
    if (k === "h" && api.showHistory){ e.preventDefault(); api.showHistory(); return; }
    if (k === "r" && api.reload){ e.preventDefault(); api.reload(); return; }
    if (/^[1-9]$/.test(k) && api.selectIndex){ e.preventDefault(); api.selectIndex(Number(k)); return; }
    if (k === "w" && api.closeTab){ e.preventDefault(); api.closeTab(); return; }
    if (k === "tab" && api.cycleTab){ e.preventDefault(); api.cycleTab(e.shiftKey ? -1 : 1); return; }
  }
  /* Alt+Left and Alt+Right: back and forward in ChalkBrowser */
  if (e.altKey && !e.ctrlKey && !e.metaKey && !typing && activeWin && activeWin.appId === "browser" &&
      (e.key === "ArrowLeft" || e.key === "ArrowRight") && activeWin.api && activeWin.api.back){
    e.preventDefault();
    return e.key === "ArrowLeft" ? activeWin.api.back() : activeWin.api.fwd();
  }
  /* Alt+Tab cycles the open windows */
  if (e.altKey && e.key === "Tab"){
    e.preventDefault();
    const list = Array.from(windows.values()).filter(o => !o.min);
    if (list.length < 2) return;
    const i = list.indexOf(activeWin);
    focusWin(list[(i + (e.shiftKey ? -1 : 1) + list.length) % list.length]);
    return;
  }
  /* a bare Super press opens the menu, the way Mint does */
  if (e.key === "Meta" && !typing && !menuOpen){ e.preventDefault(); openMenu(); }
  /* focus had wandered off the game's page - a click on its title bar, say; send it back */
  if (!typing && e.target === document.body && !e.ctrlKey && !e.altKey && !e.metaKey &&
      activeWin && activeWin.api && activeWin.api.focusFrame) activeWin.api.focusFrame();
});
addEventListener("contextmenu", e => {

      e.target.closest("#menu") || e.target.closest("#npanel") || e.target.closest(".dicon")) return;
