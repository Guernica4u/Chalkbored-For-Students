  $('[data-m="link"]', B).onclick = addMedia;
  $('[data-m="gallery"]', B).onclick = () => launch("videos");
  $('[data-m="mp3"]', B).onclick = () => mediaSwap(win, "mp3");
  for (const m of [audio, video]){
    m.onplay = m.onpause = () => {
      if (m !== media || mode !== "file") return;
      if (!m.paused) vis.follow(m);
      mediaKeysPlaying(win, !m.paused);
      B.classList.toggle("playing", !m.paused);
      playBtn.innerHTML = m.paused ? "&#9654;" : "&#10074;&#10074;";
      drawList();
      nowPlaying(win, at >= 0 ? titleOf(tracks[at]) : "", !m.paused);
    };
    m.onended = () => { if (m === media && mode === "file" && at + 1 < tracks.length) playIndex(at + 1); };
    m.ontimeupdate = () => {
      if (m !== media || mode !== "file" || seeking || !m.duration) return;
      seek.value = String(Math.round(m.currentTime / m.duration * 1000));
      timeEl.textContent = fmtTime(m.currentTime) + " / " + fmtTime(m.duration);
    };
    m.onerror = () => {
      if (m !== media || mode !== "file" || at < 0) return;
      $(".mu-sub", B).textContent = isWeb(tracks[at])
        ? "That link would not play - the file may be gone, or the site blocks playing it elsewhere."
        : "That file could not be played.";
    };
    m.volume = 0.9;
  }
  seek.oninput = () => { seeking = true; };
  seek.onchange = () => {
    if (mode === "yt"){
      if (yt && yt.getDuration && yt.getDuration()) yt.seekTo(seek.value / 1000 * yt.getDuration(), true);
    } else if (mode === "file" && media.duration) media.currentTime = seek.value / 1000 * media.duration;
    seeking = false;
  };
  vol.oninput = () => {
    audio.volume = video.volume = vol.value / 100;
    if (yt && yt.setVolume) yt.setVolume(Number(vol.value));
  };

  scan();
  if (startPath) play(startPath);
  return {
    play,
    addLinks: async urls => takeLinks(await addMediaLinks(urls, only === "video")),
    refresh: scan,
    pause(){
      if (mode === "yt"){ if (yt && yt.pauseVideo) yt.pauseVideo(); }
      else if (mode === "embed") stopAll();     /* a site's own player cannot be told to wait */
      else media.pause();
    },
    menus(){
      return {
        File: [
          { label: "Add media\u2026", run: addMedia },
          { label: "Paste a link…", run: playLink },
          { label: "Open from Files…", run: fromFiles },
          { label: "Import from this computer…", run: importMedia },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "MP3 Player", run: () => mediaSwap(win, "mp3") },
          { label: (State.visualizer !== false ? "Hide" : "Show") + " the visualizer", run: toggleVisualizer },
          { label: "Rescan library", run: scan },
          { label: "Next", run: () => step(1) },
          { label: "Previous", run: () => step(-1) }
        ]
      };
    },
    toggle,
    next: () => step(1),
    visKick(){ if (mode === "file" && !media.paused) vis.follow(media); },
    onClose(){
      if (NowPlaying.win === win) nowPlaying(null);
      releaseMediaKeys(win);
      stopAll();
      audio.src = "";
      video.removeAttribute("src");
      return true;
    }
  };
}

/* ============================================================
   12g. Chat - runs chat.html, which lives beside this file

   This one is first-party: it ships with SEA OS rather than being
   something you imported, so it gets same-origin privileges and can
   talk to its Supabase server normally. Files you import stay in an opaque-origin
   sandbox as before.
   ============================================================ */
function chatApp(win){
  const B = win.body;
  B.innerHTML = '<div class="chat-wrap"><div class="chat-loading">Opening Chat\u2026</div></div>';
  const wrap = $(".chat-wrap", B);
  let frame = null, settled = false, themeSent = "";

  function missing(why){
    if (settled) return;
    settled = true;
    wrap.innerHTML = "";
    const p = el("div", "chat-missing");
    p.append(
      el("div", "chat-missing-g", "\uD83D\uDCAC"),
      el("h2", null, "Chat could not open"),
      el("p", null, why || "Chat lives in chat.html, next to index.html. Put it there and open Chat again."));
    const again = el("button", "btn primary", "Try again");
    again.onclick = () => { win.close(); launch("chat"); };
    p.appendChild(again);
    wrap.appendChild(p);
  }
  /* the chat wears the desktop's colours, and changes when they do */
  function sendTheme(){
    if (!frame || !frame.contentWindow) return;
    const cs = getComputedStyle(document.documentElement);
    const v = n => cs.getPropertyValue(n).trim();
    const dark = State.theme === "dark";
    try {
      frame.contentWindow.postMessage({ boxtheme: {
        bg: v("--bg"), panel: v("--surface"), panel2: v("--surface-2"), panel3: v("--surface-3"),
        border: v("--border-soft"), accent: v("--accent"), accentInk: v("--accent-fg"),
        text: v("--text"), muted: v("--dim"), mine: v("--accent") + (dark ? "33" : "22"),
        danger: "#c9534b", mode: State.theme, brand: State.brand === "sea" ? "sea" : "chalk"
      } }, "*");
    } catch (e){}
  }
  const themeWatch = setInterval(() => {
    if (focusQuiet()) return;
    const now = State.theme + State.accent + State.brand;
    if (themeSent !== now){ themeSent = now; sendTheme(); }
  }, 600);

  function mount(src){
    wrap.innerHTML = "";
    frame = el("iframe", "chat-frame");
    frame.title = "Chat";
    /* first-party: it ships with CHALK OS, so it runs as itself and can reach
       its chat server. Pages you import yourself stay sandboxed. */
    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-modals");
    keepInside(frame);
    frame.addEventListener("load", () => {
      settled = true;
      themeSent = "";
      sendTheme();
      chatSeen();
    });
    frame.src = src;
    wrap.appendChild(frame);
    setTimeout(() => { if (!settled) missing("chat.html did not finish loading. Check the internet connection and try again."); }, 12000);
  }

  /* Beside index.html first; from the repository when CHALK OS is served
     from somewhere that has no copy of its own. */
  (async () => {
    const tries = ["chat.html"];
    if (repoBase()) tries.push(repoBase() + "chat.html");
    for (const src of tries){
      try {
        const res = await fetch(src, { method: "HEAD", cache: "no-store" });
        if (res.ok) return mount(src);
      } catch (e){
        /* opened straight off a disk, where asking first is not allowed - just try it */
        if (location.protocol === "file:") return mount(src);
      }
    }
    missing();
  })();

  return {
    focusFrame(){ try { if (frame) frame.contentWindow.focus(); } catch (e){} },
    menus(){
      return {
        File: [
          { label: "Reload Chat", run: () => { if (frame){ settled = false; frame.src = frame.src; } } },
          "-",
          { label: "Close Window", run: () => win.close() }
        ]
      };
    },
    onClose(){ clearInterval(themeWatch); return true; }
  };
}

/* ============================================================
   12g2. Videos - a library with posters and a player meant for
   watching, rather than the track list Media uses
   ============================================================ */
function galleryApp(win, startPath){
  const B = win.body;
  B.innerHTML =
    '<div class="vd-bar">' +
      '<button class="tb-btn vd-back" title="Back to the library">&#8592;</button>' +
      '<span class="vd-title">Gallery</span>' +
      '<span style="flex:1"></span>' +
      '<input class="vd-find" spellcheck="false" autocomplete="off" placeholder="Filter">' +
      '<button class="tb-btn" data-v="refresh" title="Look again">&#8635;</button>' +
      '<button class="tb-btn" data-v="add" title="Add a link, a file already in SEA OS, or a file from this computer">➕ Add media</button>' +
    '</div>' +
    '<div class="vd-grid"></div>' +
    '<div class="vd-player">' +
      '<video playsinline></video>' +
      '<img class="vd-img" alt="">' +
      '<div class="vd-web"></div>' +
      '<div class="vd-resume"><span></span><button class="tb-btn" data-v="over">Start over</button></div>' +
      '<div class="vd-oops"><b>This one will not play here</b>' +
      'Your browser has no decoder for this format. Ogg Theora (.ogv) is the usual ' +
      'culprit - Chrome dropped it, and Wikimedia Commons is full of it.<br>' +
      '<small>MP4 and WebM both work. Try another result from unbox.</small></div>' +
      '<div class="vd-ctl">' +
        '<button class="tb-btn" data-v="prev" title="Previous">&#9198;</button>' +
        '<button class="tb-btn accent" data-v="play" title="Play or pause">&#9654;</button>' +
        '<button class="tb-btn" data-v="next" title="Next">&#9197;</button>' +
        '<input class="vd-seek" type="range" min="0" max="1000" value="0" title="Seek">' +
        '<span class="vd-time">0:00 / 0:00</span>' +
        '<input class="vd-vol" type="range" min="0" max="100" value="90" title="Volume">' +
        '<span class="vd-web-note"></span>' +
        '<button class="tb-btn" data-v="show" title="Slideshow">&#9654; Slideshow</button>' +
        '<button class="tb-btn" data-v="site">Open on site</button>' +
        '<button class="tb-btn" data-v="full" title="Full screen">&#9974;</button>' +
      '</div>' +
    '</div>';

  const grid = $(".vd-grid", B), video = $(".vd-player video", B), img = $(".vd-img", B);
  const seek = $(".vd-seek", B), vol = $(".vd-vol", B), timeEl = $(".vd-time", B);
  const find = $(".vd-find", B), titleEl = $(".vd-title", B);
  const vb = k => $('[data-v="' + k + '"]', B);
  let all = [], shown = [], at = -1, seeking = false;

  const fmtTime = s => (Number.isFinite(s)
    ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0")
    : "0:00");
  const watching = () => B.classList.contains("playing");
  const webBox = $(".vd-web", B);
  const isWeb = t => typeof t !== "string";
  const isPic = t => !isWeb(t) && IMG_EXT.includes(extOf(baseName(t)));
  let showing = 0;   /* the slideshow timer */
  const nameOf = t => (isWeb(t) ? t.title || t.url : baseName(t));
  const whereOf = t => (isWeb(t) ? t.author || siteOf(t) || hostOf(t.url) : tilde(dirName(t)));
  const hostOf = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e){ return ""; } };
  /* where each video was left, so it picks up there next time */
  const keyOf = t => (isWeb(t) ? t.url : t);
  const resumeBox = $(".vd-resume", B);
  let lastKept = 0;
  function progressBar(shot, t){
    const r = (State.resume || {})[keyOf(t)];
    if (!r || !r.d) return;
    const bar = el("div", "vd-prog");
    bar.style.width = Math.min(100, Math.max(3, r.t / r.d * 100)) + "%";
    shot.appendChild(bar);
  }
  function keepPlace(force){
    const t = shown[at];
    if (at < 0 || !t || B.classList.contains("webplay") || !video.duration) return;
    const now = Date.now();
    if (!force && now - lastKept < 5000) return;
    lastKept = now;
    const all = Object.assign({}, State.resume);
    const key = keyOf(t);
    delete all[key];
    /* the first few seconds and the last stretch are not worth remembering */
    if (video.currentTime > 10 && video.duration - video.currentTime > 15)
      all[key] = { t: Math.round(video.currentTime), d: Math.round(video.duration) };
    const keys = Object.keys(all);
    for (const k of keys.slice(0, Math.max(0, keys.length - 40))) delete all[k];
    State.resume = all;
    saveSettings();
  }

  function scan(){
    all = [];
    /* videos and pictures, from your files. Links live in Media. */
    walkFS((p, n, name) => {
      if (n.type !== "file") return;
      if (isVideo(name) || IMG_EXT.includes(extOf(name))) all.push(p);
    });
    draw();
  }
  function draw(){
    const q = find.value.trim().toLowerCase();
    const playingPath = at >= 0 ? shown[at] : null;
    shown = q ? all.filter(p => nameOf(p).toLowerCase().includes(q)) : all.slice();
    at = playingPath ? shown.indexOf(playingPath) : -1;
    grid.innerHTML = "";
    if (!shown.length){
      grid.appendChild(el("div", "vd-none", all.length
        ? "Nothing here matches that."
        : "Nothing here yet. Press Add media, or put files in the repository's " +
          "videos/ and pictures/ folders."));
      return;
    }
    const jobs = [];
    shown.forEach((p, i) => {
      if (isWeb(p)){ grid.appendChild(webTile(p, i)); return; }
      if (isPic(p)){ grid.appendChild(picTile(p, i)); return; }
      const tile = el("button", "vd-tile" + (i === at ? " on" : ""));
      const shot = el("div", "vd-shot");
      const cv = el("canvas");
      shot.append(cv, el("span", "ph", "🎬"), el("span", "vd-dur", ""));
      const cap = el("div", "vd-cap");
      cap.append(el("div", "vd-n", baseName(p)), el("div", "vd-w", tilde(dirName(p))));
      progressBar(shot, p);
      tile.append(shot, cap);
      tile.title = baseName(p);
      tile.onclick = () => openAt(i);
      tile.oncontextmenu = e => {
        e.preventDefault(); e.stopPropagation();
        showCtx(e.clientX, e.clientY, [
          { icon: "▶", label: "Play", run: () => openAt(i) },
          { icon: "🎬", label: "Movie mode", run: () => { openAt(i); enterFocus(win, "movie"); } },
          { icon: "📁", label: "Show in Files", run: () => openInFiles(p) },
          "-",
          { icon: "🖼️", label: "Set as wallpaper", run: () => setWallpaperFrom(p) },
          { icon: "⏻", label: "Set as boot screen", run: () => setBootFrom(p) }
        ]);
      };
      grid.appendChild(tile);
      jobs.push({ path: p, cv, tile });
    });
    queuePosters(jobs);
  }
  function picTile(p, i){
    const tile = el("button", "vd-tile" + (i === at ? " on" : ""));
    const shot = el("div", "vd-shot");
    const im = el("img");
    im.alt = "";
    im.loading = "lazy";
    im.src = node(p) ? node(p).content : "";
    shot.append(im, el("span", "vd-dur", "picture"));
    const cap = el("div", "vd-cap");
    cap.append(el("div", "vd-n", baseName(p)), el("div", "vd-w", tilde(dirName(p))));
    tile.append(shot, cap);
    tile.title = baseName(p);
    tile.onclick = () => openAt(i);
    tile.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      showCtx(e.clientX, e.clientY, [
        { icon: "\uD83D\uDDBC\uFE0F", label: "Open", run: () => openAt(i) },
        { icon: "🎬", label: "Movie mode", run: () => { openAt(i); enterFocus(win, "movie"); } },
        { icon: "\uD83D\uDCC1", label: "Show in Files", run: () => openInFiles(p) },
        "-",
        { icon: "\uD83D\uDDBC\uFE0F", label: "Set as wallpaper", run: () => setWallpaperFrom(p) }
      ]);
    };
    return tile;
  }
  function webTile(t, i){
    const tile = el("button", "vd-tile" + (i === at ? " on" : ""));
    const shot = el("div", "vd-shot");
    shot.appendChild(el("span", "ph", t.kind === "file" ? "🔗" : "🌐"));
    if (t.thumb){
      const img = el("img");
      img.alt = "";
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.onerror = () => img.remove();
      img.src = t.thumb;
      shot.appendChild(img);
    }
    shot.appendChild(el("span", "vd-dur", siteOf(t) || hostOf(t.url)));
    progressBar(shot, t);
    const cap = el("div", "vd-cap");
    cap.append(el("div", "vd-n", nameOf(t)), el("div", "vd-w", whereOf(t)));
    tile.append(shot, cap);
    tile.title = nameOf(t);
    tile.onclick = () => openAt(i);
    tile.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      showCtx(e.clientX, e.clientY, [
        { icon: "▶", label: "Play", run: () => openAt(i) },
        { icon: "🎬", label: "Movie mode", run: () => { openAt(i); enterFocus(win, "movie"); } },
        { icon: "↗️", label: siteOf(t) ? "Open on " + siteOf(t) : "Open the link", run: () => openInBrowser({ kind: "web", url: t.url }) },
        "-",
        { icon: "✖", label: "Remove from Videos and Media", run: () => {
            if (i === at) library();
            forgetWebMedia(t.url);
            saveSettings();
            scan();
          } }
      ]);
    };
    return tile;
  }

  /* posters are taken one video at a time, in the order the tiles are laid
     out, so a dozen of them do not all seek at once and stall the desktop */
  const queue = [];
  let busy = false, generation = 0;
  function queuePosters(jobs){
    const mine = ++generation;
    queue.length = 0;
    jobs.slice(0, 60).forEach(j => queue.push(Object.assign({ gen: mine }, j)));
    pump();
  }
  function pump(){
    if (busy) return;
    const job = queue.shift();
    if (!job) return;
    if (job.gen !== generation) return pump();
    const n = node(job.path);
    if (!n) return pump();
    busy = true;
    const v = document.createElement("video");
    v.preload = "metadata";
    v.muted = true;
    v.playsInline = true;
    let over = false;
    const timer = setTimeout(() => done(), 9000);
    function done(){
      if (over) return;
      over = true;
      clearTimeout(timer);
      try { v.removeAttribute("src"); v.load(); } catch (e){}
      busy = false;
      pump();
    }
    function shoot(){
      try {
        const w = v.videoWidth || 16, h = v.videoHeight || 9;
        job.cv.width = 320;
        job.cv.height = Math.round(320 * h / w);
        /* a frame from another origin taints the canvas, but it is only ever
           shown and never read back, so drawing it is still allowed */
        job.cv.getContext("2d").drawImage(v, 0, 0, job.cv.width, job.cv.height);
        job.cv.classList.add("got");
        const d = $(".vd-dur", job.tile);
        if (d && Number.isFinite(v.duration) && v.duration) d.textContent = fmtTime(v.duration);
      } catch (e){ /* a frame that will not paint just leaves the placeholder */ }
      done();
    }
    v.onloadeddata = () => {
      const want = Math.min(4, (v.duration || 8) / 5);
      if (Number.isFinite(want) && want > 0.1){ try { v.currentTime = want; return; } catch (e){} }
      shoot();
    };
    v.onseeked = shoot;
    v.onerror = () => {
      /* nothing to show for a format this browser will not decode */
      const d = $(".vd-dur", job.tile);
      if (d) d.textContent = "—";
      job.tile.classList.add("unplayable");
      job.tile.title = baseName(job.path) + " - this browser cannot play this format";
      done();
    };
    v.src = n.content;
  }

  function stopWeb(){
    webBox.innerHTML = "";
    B.classList.remove("webplay");
  }
  function openAt(i){
    if (i < 0 || i >= shown.length) return;
    keepPlace(true);
    resumeBox.classList.remove("on");
    at = i;
    const p = shown[i];
    stopWeb();
    B.classList.add("playing");
    B.classList.remove("badmedia");
    B.classList.toggle("picture", isPic(p));
    if (isPic(p)){
      const n = node(p);
      if (!n) return scan();
      video.pause();
      video.removeAttribute("src");
      video.load();
      releaseMediaKeys(win);
      img.src = n.content;
      vb("site").hidden = true;
      vb("prev").disabled = i <= 0;
      vb("next").disabled = i >= shown.length - 1;
      titleEl.textContent = baseName(p);
      win.setTitle(baseName(p));
      drawMenuBar();
      return;
    }
    img.removeAttribute("src");
    if (isWeb(p) && p.kind !== "file"){
      /* a site's own player, with its own controls - and its own media keys */
      releaseMediaKeys(win);
      video.pause();
      video.removeAttribute("src");
      video.load();
      B.classList.add("webplay");
      webBox.appendChild(webPlayerFrame(p));
      $(".vd-web-note", B).textContent = "Playing in " + siteOf(p) + "'s own player - use its controls.";
      vb("site").textContent = "Open on " + siteOf(p);
      vb("site").onclick = () => openInBrowser({ kind: "web", url: p.url });
    } else {
      const n = isWeb(p) ? null : node(p);
      if (!isWeb(p) && !n) return scan();
      video.src = isWeb(p) ? p.url : n.content;
      claimMediaKeys(win, { title: nameOf(p), artist: whereOf(p), art: isWeb(p) ? p.thumb || "" : "" }, {
        play: () => video.play().catch(() => {}),
        pause: () => video.pause(),
        next: () => openAt(at + 1),
        prev: () => openAt(at - 1),
        seek: t => { if (video.duration) video.currentTime = t; },
        playing: () => !video.paused
      });
      const r = (State.resume || {})[keyOf(p)];
      if (r) video.addEventListener("loadedmetadata", () => {
        if (shown[at] !== p || !(r.t < video.duration - 5)) return;
        video.currentTime = r.t;
        $("span", resumeBox).textContent = "Picked up at " + fmtTime(r.t);
        resumeBox.classList.add("on");
        clearTimeout(resumeBox.hideT);
        resumeBox.hideT = setTimeout(() => resumeBox.classList.remove("on"), 6000);
      }, { once: true });
      video.play().catch(() => {});
    }
    vb("site").hidden = !isWeb(p) || p.kind === "file";
    titleEl.textContent = nameOf(p);
    win.setTitle(nameOf(p));
    vb("prev").disabled = i <= 0;
    vb("next").disabled = i >= shown.length - 1;
    drawMenuBar();
  }
  function slideshow(on){
    clearInterval(showing);
    showing = 0;
    if (on){
      showing = setInterval(() => {
        const next = shown.findIndex((p, i) => i > at && isPic(p));
        openAt(next >= 0 ? next : shown.findIndex(isPic));
      }, 4000);
    }
    vb("show").classList.toggle("on", !!showing);
  }
  function library(){
    slideshow(false);
    keepPlace(true);
    resumeBox.classList.remove("on");
    stopWeb();
    video.pause();
    B.classList.remove("playing");
    titleEl.textContent = "Videos";
    win.setTitle("Videos");
    draw();
    drawMenuBar();
  }
  function play(path){
    scan();
    let i = shown.indexOf(path);
    if (i < 0 && find.value){        /* it may be hidden by the filter */
      find.value = "";
      draw();
      i = shown.indexOf(path);
    }
    if (i >= 0) openAt(i);
  }

  function takeLinks(items){
    if (!items.length) return;
    find.value = "";
    play(items[0]);
  }
  const addLink = async () => takeLinks(await askMediaLinks(true));
  async function addFromFiles(){
    const p = await pickFile({ title: "Add media", ok: "Play", start: HOME + "/Videos", hint: "Videos",
                               accept: nm => isVideo(nm) });
    if (p) play(p);
  }
  async function addFromComputer(){
    const p = await importMediaFromComputer(true);
    if (p){ find.value = ""; play(p); }
  }
  const addMedia = () => showAddMedia(vb("add"), { link: addLink, files: addFromFiles, computer: addFromComputer });

  $(".vd-back", B).onclick = library;
  vb("refresh").onclick = scan;
  vb("show").onclick = () => slideshow(!showing);
  vb("add").onclick = addMedia;
  vb("play").onclick = () => { if (video.paused) video.play().catch(() => {}); else video.pause(); };
  vb("prev").onclick = () => openAt(at - 1);
  vb("next").onclick = () => openAt(at + 1);
  vb("full").onclick = () => {
    const box = $(".vd-player", B);
    if (document.fullscreenElement) document.exitFullscreen();
    else if (box.requestFullscreen) box.requestFullscreen().catch(() => {});
  };
  find.oninput = draw;
  video.onerror = () => { if (video.src) B.classList.add("badmedia"); };
  video.onloadeddata = () => B.classList.remove("badmedia");
  video.onplay = () => { vb("play").innerHTML = "&#10073;&#10073;"; mediaKeysPlaying(win, true); };
  video.onended = () => {
    if (at >= 0 && shown[at] && State.resume && State.resume[keyOf(shown[at])]){
      const all = Object.assign({}, State.resume);
      delete all[keyOf(shown[at])];
      State.resume = all;
      saveSettings();
    }
    if (at < shown.length - 1) openAt(at + 1);
  };
  video.onpause = () => { vb("play").innerHTML = "&#9654;"; keepPlace(true); mediaKeysPlaying(win, false); };
  vb("over").onclick = () => { video.currentTime = 0; video.play().catch(() => {}); resumeBox.classList.remove("on"); };
  video.ontimeupdate = () => {
    keepPlace(false);
    if (!seeking && video.duration) seek.value = String(Math.round(video.currentTime / video.duration * 1000));
    timeEl.textContent = fmtTime(video.currentTime) + " / " + fmtTime(video.duration);
  };
  seek.oninput = () => { seeking = true; };
  seek.onchange = () => {
    seeking = false;
    if (video.duration) video.currentTime = video.duration * (seek.value / 1000);
  };
  vol.oninput = () => { video.volume = vol.value / 100; };
  video.volume = 0.9;

  scan();
  if (startPath) play(startPath);

  return {
    play,
    addLinks: async urls => takeLinks(await addMediaLinks(urls, true)),
    refresh: scan,
    pause(){ slideshow(false); video.pause(); },
    menus(){
      return {
        File: [
          { label: "Add media\u2026", run: addMedia },
          { label: "Paste links\u2026", run: addLink },
          { label: "Open a video from Files…", run: addFromFiles },
          { label: "Import from this computer…", run: addFromComputer },
          "-",
          { label: "Look for videos again", run: scan },
          "-",
          { label: "Close Window", run: () => win.close() }
        ],
        View: [
          { label: "Library", run: library, disabled: !watching() },
          { label: "Full screen", run: () => vb("full").click(), disabled: !watching() },
          "-",
          { label: "Slideshow", run: () => slideshow(!showing) },
          "-",
          { label: "Set as wallpaper", disabled: at < 0 || isWeb(shown[at]), run: () => setWallpaperFrom(shown[at]) },
          { label: "Set as boot screen", disabled: at < 0 || isWeb(shown[at]), run: () => setBootFrom(shown[at]) }
        ]
      };
    },
    onClose(){ keepPlace(true); releaseMediaKeys(win); slideshow(false); generation++; stopWeb(); video.pause(); return true; }
  };
}

    ["p", "The default. A menu bar across the top that changes with whichever app has focus, and a floating Dock at the bottom. Windows go where you put them. The three coloured buttons at the top left of a window are close, minimise and maximise. The small arrow after the menus folds File, Edit, View and Window away, and Settings › Desktop environment › Style switches to Liquid Glass: see-through glass, rounder corners and a clear menu bar."],
    ["h", "Mint"],
    ["p", "A single panel at the bottom holding the menu, a task list and the tray. Desktop icons live on the wallpaper. Closer to a traditional Linux desktop, and the one to pick if you want everything in one bar."],

  { id: "files", icon: "📁", title: "Files and dragging", body: [
    ["h", "Selecting"],
    ["l", ["Click to select, Ctrl+click to add one, Shift+click for a run of them.",
           "Ctrl+C, Ctrl+X and Ctrl+V copy, cut and paste. Ctrl+A selects everything.",
           "Delete moves to Trash. Shift+Delete skips the Trash.",
           "The Trash is in the Files sidebar: put things back, delete them for good, or empty it."]],
    ["h", "Dragging a file somewhere useful"],
    ["p", "Pick a file up in Files and it can be dropped on almost anything that would know what to do with it."],
    ["l", ["A Dock icon, or a taskbar button - that app opens it. A picture or a video goes to the Gallery, a song to Media, a page to Seahorse.",
           "An open window - the app takes it there and then, without opening another window.",
           "The Trash - it goes in the Trash.",

    ["p", "An app with no use for what you are holding will not light up, and will not take the drop. Dropping a .txt on Media does nothing at all, which is the intended answer."],
    ["h", "Getting files in and out"],

  { id: "seahorse", icon: "🌊", title: "Seahorse, the browser", body: [
    ["p", "Seahorse reads what it can reach. That is more than you would expect, and less than a real browser."],
    ["h", "Tabs"],
    ["l", ["Ctrl+T opens one, Ctrl+W closes one, Ctrl+Tab moves along, and Ctrl+1 to Ctrl+9 jump straight to one.",
           "The + at the right of the tab strip opens one too, and so does double-clicking the empty strip.",
           "Drag a tab along the strip to move it. Middle-click one to close it.",
           "Right-click a tab to reload, duplicate or bookmark it, or to close the others or the ones to its right.",
           "Ctrl+Shift+T brings back the last tab you closed.",
           "Each tab keeps its own history and its own page, so going back to a tab finds it where you left it.",

    ["h", "Bookmarks and history"],
    ["l", ["The \u2606 at the end of the address bar keeps the page you are on; press it again to let it go. Ctrl+D does the same.",

    ["h", "What you can type in the address bar"],
    ["l", ["Anything that looks like a web address.",

           "wiki:Seahorse for a Wikipedia article.",
           "so:closures for Stack Overflow, gh:jquery/jquery for a repository README.",
           "define:serendipity for a dictionary entry, hn for Hacker News.",

    ["h", "Why some sites will not load"],
    ["p", "A page in a browser cannot read another site unless that site says it may. Most big sites refuse, and a page served from GitHub Pages cannot fetch on your behalf. Wikipedia, Stack Overflow, GitHub and a handful of others do allow it, which is why those work and Google does not."],
    ["h", "Downloads"],
    ["p", "Click a link to a file and it is saved into Downloads inside SEA OS, never onto the real computer. File › Show Downloads opens the folder."]
  ]},
  { id: "unbox", icon: "📦", title: "unbox: music, video, pictures", body: [
    ["p", "unbox is a terminal command that brings freely licensed media in from the open web. Openverse (which covers Jamendo, Freesound and ccMixter), Wikimedia Commons and the Internet Archive."],
    ["h", "How to use it"],
    ["c", "unbox piano"],
    ["p", "Finds music and installs the best match into ~/Music."],
    ["c", "unbox search video ocean"],
    ["p", "Lists what is out there and installs nothing. The words combine in any order: search, video, image, audio, list, remove."],
    ["c", "unbox image mountain lake"],
    ["p", "Pictures, straight into ~/Pictures."],
    ["c", "unbox list\nunbox remove ocean"],
    ["p", "What you have brought in, and how to take one back out."],
    ["h", "Things worth knowing"],
    ["l", ["Files are linked, not copied. A 200 MB video costs you nothing against your storage.",

           "Results are ranked on length and on whether the name has anything to do with what you asked.",

  { id: "term", icon: "⌨️", title: "The Terminal", body: [
    ["p", "A shell over the same filesystem the Files app shows. Type help for the full list, or help and a command's name for just that one."],
    ["h", "Pipes and files"],
    ["l", ["Put | between commands and the words one prints go into the next: ls ~/Music | grep -i mp3 | wc -l.",
           "> writes what a command prints into a file, and >> adds it to the end: ls > list.txt.",
           "grep, head, tail, wc, sort, uniq and cat read the files you name, or whatever is piped into them.",
           "Quotes keep words together: grep \"two words\" notes.md."]],
    ["h", "The desktop from here"],
    ["l", ["play finds a song by a word in its name. wget saves a web address into ~/Downloads.",
           "bookmarks lists, adds, opens and removes Seahorse's bookmarks. tide says how Tide is doing, tests it, or switches Scramjet.",
           "du shows what takes the room, df where your files are kept and how much space there is, stat what one thing is.",

    ["h", "Its look"],
    ["l", ["termtheme picks classic, green, amber, ocean or paper; fontsize sets the text size. Both are in the View menu too."]],
    ["h", "Editing the line"],
    ["l", ["Tab completes commands, paths and app names. Press it twice to see the choices.",

    ["h", "Worth trying"],
    ["c", "neofetch\nls ~ | grep -i md\ncat notes.md | grep Tide > tide.txt\nplay piano\ntree ~"],
    ["p", "Commands can be chained with && and separated with ;."]
  ]},
  { id: "saving", icon: "💾", title: "Saving, and what is lost", body: [
    ["p", "By default SEA OS keeps nothing. Reload the page and you get a fresh machine."],
    ["p", "Settings › Storage › Save my files turns on browser storage. Your files, settings and shortcuts then survive a reload, in this browser on this computer only."],
    ["p", "Keep files in chooses where. File storage, the default, puts big files in the browser's own file storage, which holds gigabytes. localStorage keeps everything in one plain place, but only 5 to 10 MB of it, so big songs and videos will not fit. Switching moves what you have, and lets go of the old copy only once the new one is written."],
    ["h", "The repository"],
    ["p", "SEA OS can take music, videos, pictures, apps and games from a GitHub repository. It asks GitHub what is in those folders, so anything you put there shows up on its own - no manifest.js listing files by hand. Settings › Storage names the repository, as user/repository, and works that out for itself when SEA OS is served from that repository's own Pages site. Left blank anywhere else, it is CHALK OS's own repository, Guernica4u/CHALK-OS."],
    ["l", ["GitHub allows sixty questions an hour from one network, so each answer is kept for a few hours, and an old answer is used rather than none when they run out.",
           "Read from anywhere else - chalkbored.win, say - the files themselves come from the repository's Pages site.",
           "The manifest.js files beside index.html are only a fallback now: for when no repository is named, GitHub cannot be reached, or index.html is opened straight off a disk.",
           "Use the repository's files, in the same place, switches the whole lot off. Then SEA OS asks GitHub nothing and only what you have added from inside is there. It takes effect the next time SEA OS starts."]],
    ["h", "The limits"],
    ["l", ["Your files go into the browser's own file storage, which holds gigabytes - songs, videos and all. The list of what is where stays in ordinary browser storage, which is small but instant.",
           "How much fits depends on the free space on this computer; Settings › Storage shows it. When it is on, SEA OS asks the browser not to clear it away when space runs short.",
           "A few browsers have no file storage for pages - Firefox in a private window, or opening index.html straight off the disk. There everything shares the old 5 MB, and a file that does not fit is marked in the Files list rather than lost quietly.",
           "Anything brought in by unbox is a link, so it costs nothing and always survives.",
           "Terminal: backup writes everything to a file you can keep, and restore reads it back."]]
  ]},
  { id: "look", icon: "🎨", title: "Making it yours", body: [
    ["l", ["Settings keeps a button for every page down its left side: Appearance, Wallpaper, Desktop, Widgets, Panel & clock, Seahorse, the SEA Store, Startup, Storage and About - and Developer, once Developer mode is on in Storage. A narrow Settings window keeps the buttons as icons.",
           "Settings › Developer › Performance meter puts frames a second, the slowest frame, how long keys and clicks wait, and how busy the page is in the corner. It watches a game's own page too, when the game is in front, and stays up in Game mode - so a slow game can be told apart from a slow desktop.",
           "Settings › Appearance › Call it switches the whole desktop between CHALK OS and SEA OS. CHALK OS has the chalk logo, the chalkboard boot screen and ChalkBrowser; SEA OS brings back the sailboat, the porthole and Seahorse. The menu bar, the Terminal, the Store and this help follow along, and your files and settings stay as they are.",
           "Settings › Appearance for light and dark and the accent colour; Settings › Wallpaper for the picture behind it all.",
           "A wallpaper can be a video. It loops behind everything.",
           "Settings › Startup takes a boot screen of your own - a video or a picture - and chooses what opens first.",
           "Settings › Appearance › Screen saver shows the porthole and a big clock after a few minutes of nothing. It waits while anything is playing, and any key or mouse move brings the desktop back.",
           "Right-click any picture or video in Files to set either from there.",
           "Settings › Desktop chooses the shell, the desktop icons and what sits in the Dock.",
           "Settings › Desktop › Transparency makes the Dock or taskbar, the menu bar and the windows see-through, with or without a frosted blur. Absolute transparency takes the Dock or taskbar away altogether and leaves only its icons. Games, Seahorse, video and the Terminal stay solid so they stay quick.",
           "Drop an .mp4 into the videos folder of the repository and it appears in Videos without any importing."]]
  ]},
  { id: "tide", icon: "\uD83C\uDF0A", title: "Tide", body: [
    ["p", "Tide lives in Settings › Developer, which appears once Developer mode is on in Settings › Storage."],
    ["p", "Almost every site refuses to be shown inside another page, which is why Seahorse can only read a handful of them on its own. Tide is the way round it: a small server on a machine you own opens the connection, and what comes back is rewritten so the site behaves normally - scripts, logins and all."],
    ["h", "Setting it up"],
    ["l", ["The server runs on a machine of your own. Once it is up it prints a key.",
           "Put its address and that key into Settings \u203A Developer \u203A Tide, press Test, then Save.",
           "Scramjet, on the same page, chooses what does the rewriting: Scramjet 2, the default, or 1.1.0 if 2 misbehaves. Switching reloads SEA OS.",
           "Type any address into Seahorse and it opens through Tide from then on.",
           "The tide folder has to sit next to index.html on the site, and the site has to be https. Tide cannot run from a file on disk."]],
    ["h", "What to expect"],
    ["l", ["Everything the site asks for afterwards comes through the same machine, so pages that build themselves in the browser work.",
           "Every site you open sees that machine's address as the visitor, not yours.",
           "Downloads land in ~/Downloads inside SEA OS, never on the real computer - links marked as downloads, files a page makes on the spot, and anything a browser would save rather than show. Anything over 100 MB is refused.",
           "A page can never open a tab in your real browser: links that want one open in the same frame.",
           "If a page will not load, Settings \u203A Developer \u203A Tide \u203A Test says whether the machine is answering.",
           "Clear what it cached, in the same place, throws away the helper Tide installs in this browser and starts it fresh."]],
    ["h", "Video"],
    ["p", "Sites load in any browser, but video through Tide needs one that can pass a half-finished download between pages. Chrome and Edge can; Firefox cannot yet, so YouTube opens but a video says an error occurred. Media plays YouTube links directly without Tide, which is the easier way to watch something."]
  ]},
  { id: "store", icon: "🛍️", title: "SEA Store and making apps", body: [
    ["p", "The SEA Store is a page of Settings now, under Apps. An app is one HTML file: install one from Files, build one in Playground and choose Install as app, or put it in the apps/ folder of the repository."],
    ["h", "Naming it"],
    ["c", "<title>My App</title>\n<meta name=\"description\" content=\"What it does\">\n<meta name=\"box-icon\" content=\"🧩\">\n<meta name=\"box-size\" content=\"640x480\">"],
    ["h", "What an app can do"],
    ["p", "Apps run in a sandbox. They cannot reach SEA OS or the rest of your files. Instead they get window.box, where every call returns a promise:"],
    ["c", "await box.notify(\"Title\", \"Body\")\nawait box.saveFile(\"notes.json\", data)   // into ~/Documents/<App name>/\nawait box.readFile(\"notes.json\")\nawait box.listFiles()\nawait box.openFile()                      // only a file you pick"],
    ["p", "CSS variables such as --box-bg, --box-surface, --box-text and --box-accent follow the desktop theme, and a boxtheme event fires when it changes."],
    ["h", "Off GitHub Pages"],
    ["p", "On Pages the Store asks GitHub what is in apps/. Anywhere else it reads apps/manifest.js, so add a line there for each app."]
  ]},
  { id: "gallery", icon: "\uD83D\uDDBC\uFE0F", title: "Gallery", body: [
    ["p", "The Gallery holds your videos and your pictures together - whatever is on the disk, wherever it sits."],
    ["l", ["Click one to watch or look at it. The arrows either side move to the next and the last.",
           "Slideshow steps through the pictures on its own, every few seconds.",
           "A video remembers where you stopped and picks up there, with Start over if you would rather not.",
           "Right-click a picture to show it in Files or make it the wallpaper.",
           "Add media brings in videos and pictures: from a link, from your files, or from this computer."]]
  ]},
  { id: "playground", icon: "🧪", title: "Playground", body: [
    ["p", "Write a web page, or Python, and run it right here. A web page runs on the right as you type; untick Live to run only when you press Run or Ctrl+Enter."],
    ["h", "Web pages"],
    ["l", ["HTML, CSS and JS each get a tab. A dot on a tab means it has something in it.",
           "They are saved together as one .html file, so Open in Seahorse and Install as app work on the whole page. Opening that file again puts each part back in its own tab.",
           "The console under the preview shows console.log output and errors. An error in the JS tab says which line of that tab it came from.",
           "The preview gets window.box too, so an app behaves the same before and after you install it."]],
    ["h", "Python"],
    ["l", ["New › Python script starts one. Opening any .py file does too.",
           "Python downloads the first time it runs, which takes a few seconds, and is quick after that.",
           "print() goes to the console. input() reads the Input box above it, one line for each call.",
           "Importing a package that ships with Pyodide, like numpy, downloads it the first time you use it.",
           "Stop ends a script that runs too long, including one that never finishes.",
           "Python scripts save to ~/Documents unless they already live somewhere."]],
    ["h", "Saving"],
    ["p", "Ctrl+S saves and Ctrl+Shift+S saves as. A new web page goes in ~/Sites."]
  ]},
  { id: "media", icon: "\uD83C\uDFB5", title: "Media", body: [
    ["p", "Media is the music player: your songs, and links from the web. Videos and pictures live in the Gallery, which the picture button at the top opens."],
    ["h", "The visualizer"],
    ["l", ["Bars rise behind the song in Media, and a ring pulses round the cover in the MP3 Player.",
           "View \u203A Hide the visualizer turns it off, in either.",
           "It draws your own songs and the repository's. A song from a site that will not let other pages listen still plays, just without the drawing.",
           "It stops drawing while the music is paused or the window is out of sight."]],
    ["h", "The MP3 Player"],
    ["l", ["The disc button at the top of Media turns it into the MP3 Player: one song at a time, the cover turning like a record, and what plays next along the bottom.",
           "Click that bar for the tracklist, with a playlist for everything, one for each folder and one for links, plus shuffle and repeat.",
           "\u2630 Media, at its top left, turns it back. Media opens next time the way you left it."]],
    ["h", "Playlists of links"],
    ["l", ["The pills above the list pick what it shows: Everything, just your Links, or one of your playlists.",
           "+ Playlist makes one out of nothing but links: name it, paste its links, and it is ready. Leave the paste empty to fill it later.",
           "Right-click any link to add it to a playlist, or to start a new one with it. One link can be in as many playlists as you like.",
           "Inside a playlist, right-click a link to move it up or down or take it out. Links pasted with Add media while a playlist is open go straight into it.",
           "Right-click a playlist's pill to play it from the top, paste more links in, rename it or delete it. Deleting a playlist keeps its links in Links; Forget this link takes one out of everything."]],
    ["h", "Movie mode"],
    ["l", ["Right-click anything in Media or the Gallery, or a video, song or picture in Files, and choose Movie mode.",
           "Everything else stops - other players pause, and the rest of the desktop is put away - and that one thing fills the whole screen.",
           "The controls and the pointer fade when the mouse is still. Esc, or Leave at the top, brings the desktop back."]],
    ["h", "Songs"],
    ["l", ["A song's name, artist, album and cover are read out of the file itself, so a song called 01.mp3 still shows properly.",
           "The cover turns while it plays. With no cover in the file, a picture named cover or folder beside it is used, and failing that the first letter of its name.",
           "Without any tags at all it falls back to the file name."]],
    ["h", "Adding something"],
    ["l", ["Add media offers three ways in: paste links, play a file already in SEA OS, or bring a file over from this computer.",
           "Paste links takes as many as you like, one a line. Enter starts a new line; Ctrl+Enter adds them all.",
           "Ctrl+V anywhere in Media or the Gallery adds whatever link - or links - you copied.",
           "Drag files from your computer's desktop, or a link from another browser tab, onto either player or its Dock icon.",
           "An imported file lands in ~/Music, ~/Videos or ~/Pictures and stays in SEA OS. Nothing is written to the real computer."]],
    ["h", "Links"],
    ["l", ["Links all live in Media, whether they are music or video, so nothing turns up in the Gallery that does not belong there.",
           "YouTube, Vimeo, Dailymotion, Twitch, Kick, Streamable, the Internet Archive, Bilibili, Odysee, TED, TikTok, Facebook, Loom, PeerTube, SoundCloud and Spotify all play in their own players.",
           "A Spotify playlist, album, song or podcast plays whole songs when you are signed in to Spotify in this browser, and thirty-second tastes when you are not.",
           "The play, pause and skip keys on your keyboard work whichever player you used last, and Windows shows the song and its cover in its own media pop-up.",
           "Everything you add stays in the list under From the web. Right-click one to remove it.",
           "Links need the internet, and nothing from those sites is saved into your files."]]
  ]},
  { id: "widgets", icon: "🧩", title: "Widgets", body: [
    ["l", ["Right-click the desktop and choose Widgets, or open Settings › Widgets.",
           "Drag a widget anywhere and it stays there.",
           "Right-click a widget to change the weather place, switch between °C and °F, or remove it.",
           "Now playing follows Media, with play, pause and next.",
           "Weather comes from Open-Meteo, and the only thing sent is the place you choose.",
           "Widgets are hidden in the Hyprland shell, where windows cover the whole desktop."]]

function helpApp(win, startTopic){
  const B = win.body;
  B.innerHTML =
    '<div class="hp-side"><div class="side-h">Help</div><div class="hp-list"></div></div>' +
    '<div class="hp-main"><input class="hp-find" spellcheck="false" autocomplete="off" ' +
    'placeholder="Search the help"><div class="hp-body"></div></div>';
  const list = $(".hp-list", B), body = $(".hp-body", B), find = $(".hp-find", B);
  let at = startTopic || HELP_TOPICS[0].id;

  const textOf = t => t.title + " " + t.body.map(b =>
    Array.isArray(b[1]) ? b[1].join(" ") : b[1]).join(" ");

  function drawList(){
    const q = find.value.trim().toLowerCase();
    list.innerHTML = "";
    const hits = q ? HELP_TOPICS.filter(t => textOf(t).toLowerCase().includes(q)) : HELP_TOPICS;
    if (!hits.length){
      list.appendChild(el("div", "hp-none", "Nothing about that."));
      return;
    }
    hits.forEach(t => {
      const b = el("button", "place" + (t.id === at ? " on" : ""));
      b.append(el("span", "g", t.icon), el("span", null, t.title));
      b.onclick = () => { at = t.id; drawList(); drawBody(); };
      list.appendChild(b);
    });
    brandTree(list);
  }
  function drawBody(){
    setTimeout(() => brandTree(body), 0);
    const t = HELP_TOPICS.find(x => x.id === at) || HELP_TOPICS[0];
    body.innerHTML = "";
    body.appendChild(el("h1", null, t.title));
    t.body.forEach(part => {
      const [kind, val] = part;
      if (kind === "h") return body.appendChild(el("h2", null, val));
      if (kind === "p") return body.appendChild(el("p", null, val));
      if (kind === "c"){
        const pre = el("pre", "hp-code", val);
        return body.appendChild(pre);
      }
      if (kind === "l"){
        const ul = el("ul");
        val.forEach(li => ul.appendChild(el("li", null, li)));
        body.appendChild(ul);
      }
    });
    body.scrollTop = 0;
    win.setTitle("Help - " + t.title);
  }
  find.oninput = () => {
    drawList();
    const q = find.value.trim().toLowerCase();
    if (!q) return;
    const first = HELP_TOPICS.find(t => textOf(t).toLowerCase().includes(q));
    if (first && first.id !== at){ at = first.id; drawList(); drawBody(); }
  };
  drawList();
  drawBody();

  return {
    show(id){ at = id; drawList(); drawBody(); },
    menus(){
      return {
        File: [{ label: "Close Window", run: () => win.close() }],
        View: HELP_TOPICS.map(t => ({
          label: (t.id === at ? "• " : "   ") + t.title,
          run: () => { at = t.id; drawList(); drawBody(); }
        }))
      };
    }
  };
}
/* ============================================================
   12i. SEA Store - apps that are just HTML files

   An app is one .html file in the repo's apps/ folder, or one you made
   yourself and installed from Files. Its <title> is its name; optional
   <meta name="description">, <meta name="box-icon" content="emoji"> and
   <meta name="box-size" content="640x480"> fill in the rest.

   Apps run in the same opaque-origin sandbox as any imported page, so they
   cannot touch SEA OS or its storage. What they can do goes
   through window.box, and every call is answered here:
     box.notify(title, body)
     box.saveFile(name, text)   into ~/Documents/<App name>/
     box.readFile(name)         from that same folder
     box.listFiles()
     box.openFile()             only what you pick in a dialog
   plus --box-* CSS variables that follow the desktop theme.
   ============================================================ */
const Bridged = new Set();      /* { frame, app, win } for each frame speaking window.box */

const BOX_BRIDGE = "\x3Cscript>(function(){" +
  "var n=0,wait={};" +
  "function call(op,args){return new Promise(function(ok,no){var id=++n;wait[id]=[ok,no];" +
    "parent.postMessage({boxapp:op,id:id,args:args||{}},'*');});}" +
  "addEventListener('message',function(e){if(e.source!==parent)return;var d=e.data||{};" +
    "if(d.boxtheme){var s=document.documentElement.style;for(var k in d.boxtheme)s.setProperty('--box-'+k,d.boxtheme[k]);" +
      "window.box.theme=d.boxtheme;try{dispatchEvent(new CustomEvent('boxtheme',{detail:d.boxtheme}));}catch(x){}return;}" +
    "var w=d.boxreply&&wait[d.boxreply];if(!w)return;delete wait[d.boxreply];" +
    "if(d.error)w[1](new Error(d.error));else w[0](d.value);});" +
  "window.box={theme:null," +
    "notify:function(t,b){return call('notify',{title:t,body:b});}," +
    "openFile:function(){return call('openFile');}," +
    "saveFile:function(name,content){return call('saveFile',{name:name,content:content});}," +
    "readFile:function(name){return call('readFile',{name:name});}," +
    "listFiles:function(){return call('listFiles');}," +
    "getHighScore:function(){return call('getHighScore');}," +
    "submitScore:function(n){return call('submitScore',{score:n});}};" +
  "parent.postMessage({boxapp:'hello',id:0,args:{}},'*');" +
  "})();</scr" + "ipt>";

function withBridge(html, base){
  const inject = (base ? '<base href="' + base.replace(/"/g, "%22") + '">' : "") + BOX_BRIDGE;
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + inject) : inject + html;
}
function boxPalette(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  return { bg: v("--bg"), surface: v("--surface"), "surface-2": v("--surface-2"), text: v("--text"),
           dim: v("--dim"), accent: v("--accent"), "accent-fg": v("--accent-fg"), border: v("--border-soft"),
           mode: State.theme };
}
function postTheme(b){
  try { if (b.frame && b.frame.contentWindow) b.frame.contentWindow.postMessage({ boxtheme: boxPalette() }, "*"); } catch (e){}
}
let bridgeThemeSent = "";
setInterval(() => {
  if (!Bridged.size || focusQuiet()) return;
  for (const b of Bridged) if (b.frame && !b.frame.isConnected) Bridged.delete(b);
  const now = State.theme + State.accent;
  if (now === bridgeThemeSent) return;
  bridgeThemeSent = now;
  Bridged.forEach(postTheme);
}, 700);

/* a name an app hands us becomes one plain file name, never a path */
const safeName = x => String(x || "").replace(/[\\/:*?"<>|]/g, "-").replace(/^[.\s]+/, "").trim().slice(0, 80);

addEventListener("message", async e => {
  const d = e.data;
  if (!d || typeof d.boxapp !== "string") return;
  const hit = Array.from(Bridged).find(b => b.frame && b.frame.contentWindow === e.source);
  if (!hit) return;
  const app = hit.app, args = d.args || {};
  const answer = (value, error) => {
    if (!d.id) return;
    try { e.source.postMessage({ boxreply: d.id, value: value === undefined ? null : value, error: error || null }, "*"); } catch (x){}
  };
  const dir = HOME + "/Documents/" + (safeName(app.name) || "App");
  try {
    switch (d.boxapp){
      case "hello":
        return postTheme(hit);
      case "notify":
        notify(String(args.title || app.name).slice(0, 80), String(args.body || "").slice(0, 300), app.icon);
        return answer(true);
      case "saveFile": {
        const name = safeName(args.name);
        if (!name) return answer(null, "saveFile needs a file name");
        ensureDir(dir);
        const text = typeof args.content === "string" ? args.content : JSON.stringify(args.content, null, 2);
        writeFile(dir + "/" + name, text, "text", "text/plain");
        refreshFilesViews();
        return answer(tilde(dir + "/" + name));
      }
      case "readFile": {
        const n = node(dir + "/" + safeName(args.name));
        return answer(n && n.type === "file" ? String(n.content) : null);
      }
      case "listFiles": {
        const n = node(dir);
        return answer(n && n.type === "dir" ? listDir(n).filter(k => n.children[k].type === "file") : []);
      }
      case "openFile": {
        const p = await pickFile({ title: app.name + " wants to open a file", ok: "Give it to " + app.name, start: HOME + "/Documents" });
        if (!p) return answer(null);
        const n = node(p);
        return answer({ name: baseName(p), kind: n.kind, mime: n.mime || "", content: n.content });
      }
      case "getHighScore":
        return answer((State.highScores || {})[app.id] || 0);
      case "submitScore": {
        const score = Math.max(0, Math.min(1e9, Math.floor(Number(args.score) || 0)));
        const old = (State.highScores || {})[app.id] || 0;
        if (score > old){
          State.highScores = Object.assign({}, State.highScores, { [app.id]: score });
          saveSettings();
          refreshGamesViews();
        }
        return answer({ best: Math.max(old, score), isNew: score > old });
      }
      default:
        return answer(null, "box." + d.boxapp + " does not exist");
    }
  } catch (err){
    answer(null, String((err && err.message) || err));
  }
});

/* ---- the catalogue ---- */
function storeMeta(html, src, prefix){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const meta = n => { const m = doc.querySelector('meta[name="' + n + '"]'); return m ? (m.getAttribute("content") || "").trim() : ""; };
  const size = /^(\d{3,4})\s*x\s*(\d{3,4})$/i.exec(meta("box-size"));
  const file = baseName(src.replace(/^fs:/, "")).replace(/\.html?$/i, "");
  /* an icon is text only - setAppIcon would render markup, and markup from
     an app has no business running in the desktop itself */
  const icon = meta("box-icon").replace(/[<>]/g, "").slice(0, 8);
  const title = doc.querySelector("title");
  const color = /^#[0-9a-f]{3,8}$/i.test(meta("box-color")) ? meta("box-color") : "";
  return {
    color,
    id: (prefix || "app") + ":" + (src.startsWith("fs:") ? "my-" : "") + (file.toLowerCase().replace(/[^a-z0-9]+/g, "-") || "app"),
    src,
    name: ((title && title.textContent) || "").trim().slice(0, 40) || file,
    desc: (meta("description") || "An app from the SEA Store").slice(0, 120),
    icon: icon || "🧩",
    w: size ? Math.min(1400, Math.max(280, +size[1])) : 720,
    h: size ? Math.min(1000, Math.max(200, +size[2])) : 520
  };
}
/* the file names in a repo folder: GitHub's API on a Pages site, the folder's
   manifest.js anywhere else */
function loadFolderManifest(dir, globalName){
  if (repoOff()) return Promise.resolve([]);
  return new Promise(resolve => {
    if (Array.isArray(window[globalName])) return resolve(window[globalName]);
    const s = document.createElement("script");
    s.src = dir + "/manifest.js";
    s.onload = () => resolve(Array.isArray(window[globalName]) ? window[globalName] : []);
    s.onerror = () => resolve([]);
    document.head.appendChild(s);
  });
}
/* What GitHub says is in a folder of the repository - only on a Pages site,
   and asked once per folder, since GitHub allows only sixty questions an hour */
const REPO_LISTS = new Map();
/* Which repository the files come from. "user/name"; worked out on its own
   when SEA OS is served from a repository's own Pages site, and CHALK OS's
   own repository everywhere else - localhost, another domain, a file on disk. */
const DEFAULT_REPO = "Guernica4u/CHALK-OS";
function repoName(){
  const set = String(State.repo || "").trim()
    .replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/i, "").replace(/^\/+|\/+$/g, "");
  if (/^[\w.-]+\/[\w.-]+$/.test(set)) return set;
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/i);
  if (!m) return DEFAULT_REPO;
  const seg = location.pathname.split("/").filter(Boolean);
  return m[1] + "/" + (seg.length ? seg[0] : m[1] + ".github.io");
}
/* Where those files actually sit. On the repository's own Pages site they
   are next to index.html; read from anywhere else, they come from it. */
function repoBase(){
  if (/^[\w-]+\.github\.io$/i.test(location.hostname)) return "";
  const repo = repoName();
  if (!repo) return "";
  const cut = repo.split("/");
  return "https://" + cut[0].toLowerCase() + ".github.io/" +
         (cut[1].toLowerCase() === (cut[0] + ".github.io").toLowerCase() ? "" : cut[1] + "/");
}
/* GitHub answers sixty questions an hour per network, so each answer is
   kept for a few hours - and an old one is better than none when it runs out. */
const REPO_TTL = 6 * 3600 * 1000;
const REPO_CACHE_KEY = "boxos.repolist";
function repoCache(){ try { return JSON.parse(localStorage.getItem(REPO_CACHE_KEY) || "{}"); } catch (e){ return {}; } }
function repoRemember(key, names){
  try {
    const all = repoCache();
    all[key] = { at: Date.now(), names };
    localStorage.setItem(REPO_CACHE_KEY, JSON.stringify(all));
  } catch (e){}
}
function repoList(dir){
  if (repoOff()) return Promise.resolve(null);
  if (!REPO_LISTS.has(dir)) REPO_LISTS.set(dir, (async () => {
    const repo = repoName();
    if (!repo) return null;
    const key = repo + "/" + dir;
    const known = repoCache()[key];
    if (known && Date.now() - known.at < REPO_TTL) return known.names;
    try {
      const r = await fetch("https://api.github.com/repos/" + repo + "/contents/" + dir);
      if (!r.ok) throw new Error(String(r.status));
      const list = await r.json();
      if (!Array.isArray(list)) throw new Error("not a folder");
      const names = list.filter(f => f.type === "file").map(f => f.name);
      repoRemember(key, names);
      return names;
    } catch (err){
      return known ? known.names : null;   /* rate limited or offline; the manifest is the last resort */
    }
  })());
  const p = REPO_LISTS.get(dir);
  p.then(v => { if (!v) REPO_LISTS.delete(dir); });   /* a failed look is tried again next time */
  return p;
}
async function discoverHtmlFolder(dir, globalName, prefix, skip){
  let paths = null;
  const names = await repoList(dir);
  if (names) paths = names.filter(isHtml).map(n => repoBase() + dir + "/" + n);
  /* a manifest may also name games on other sites - only its pages are read here */
  if (!paths) paths = (await loadFolderManifest(dir, globalName)).filter(p => typeof p === "string" && isHtml(p));
  /* Each page is fetched whole just to read its title, which is wasteful for
     a big one - so anything named elsewhere with its own details is left out */
  if (skip) paths = paths.filter(p => !skip.has(p) && !skip.has(p.replace(repoBase(), "")));
  const found = await Promise.all(paths.map(async p => {
    try {
      const res = await fetch(p, { cache: "no-store" });
      return res.ok ? storeMeta(await res.text(), p, prefix) : null;
    } catch (err){ return null; }
  }));
  return found.filter(Boolean);
}
let storeCatalogue = null;
async function discoverStoreApps(){
  storeCatalogue = await discoverHtmlFolder("apps", "BOXOS_APPS", "app");
  return storeCatalogue;
}

/* ---- installing ---- */
function registerStoreApp(a){
  APPS[a.id] = { name: a.name, desc: a.desc, icon: a.icon, w: a.w, h: a.h, cls: "app-ext", store: true,
                 run: win => storeAppRun(win, a) };
}
function refreshStoreViews(){
  /* the Store is a page of Settings, so that is what redraws */
  if (storeHost && storeHost.isConnected) storeSection(storeHost); else refreshSettings();
}
function storeInstall(a){
  const rec = { id: a.id, src: a.src, name: a.name, desc: a.desc, icon: a.icon, w: a.w, h: a.h };
  const had = State.installed.some(x => x.id === a.id);
  State.installed = had ? State.installed.map(x => (x.id === a.id ? rec : x)) : State.installed.concat(rec);
  registerStoreApp(rec);
  if (!had && !State.dock.includes(a.id)) State.dock = State.dock.concat(a.id);
  saveSettings();
  drawDock();
  refreshStoreViews();
  notify(had ? "Updated" : "Installed", had ? a.name + " was reinstalled." : a.name + " is in the menu and the Dock.", a.icon);
}
function storeRemove(id){
  const a = APPS[id];
  for (const w of Array.from(windows.values())) if (w.appId === id) closeWin(w);
  delete APPS[id];
  State.installed = State.installed.filter(x => x.id !== id);
  State.dock = State.dock.filter(x => x !== id);
  State.shortcuts = State.shortcuts.filter(s => !(s.kind === "app" && s.target === id));
  saveSettings();
  drawDock();
  drawDesktop();
  refreshStoreViews();
  if (a) notify("Removed", a.name + " is gone from the menu and the Dock.", a.icon);
}
function storeInstallFromPath(path){
  const n = node(path);
  if (!n || n.type !== "file" || !isHtml(baseName(path)) || typeof n.content !== "string")
    return osAlert("Not an app", baseName(path) + " is not an HTML file SEA OS can install.");
  const a = storeMeta(n.content, "fs:" + path);
  storeInstall(a);
  return a;
}

/* ---- running one ---- */
async function storeSource(a){
  if (a.src.startsWith("fs:")){
    const n = node(a.src.slice(3));
    if (!n || n.type !== "file")
      throw new Error(a.name + " was installed from " + tilde(a.src.slice(3)) + ", which is not there any more.");
    return String(n.content);
  }
  const res = await fetch(a.src, { cache: "no-store" });
  if (!res.ok) throw new Error(a.name + " could not be loaded - the server answered " + res.status + ".");
  return res.text();
}
function storeAppRun(win, a){
  const B = win.body;
  B.innerHTML = "";
  const wrap = el("div", "ext-wrap");
  wrap.appendChild(el("div", "ext-msg", "Opening " + a.name + "…"));
  B.appendChild(wrap);
  const entry = { frame: null, app: a, win };
  (async () => {
    let html;
    try { html = await storeSource(a); }
    catch (err){
      wrap.innerHTML = "";
      wrap.appendChild(el("div", "ext-msg", err.message));
      return;
    }
    const frame = el("iframe", "ext-frame");
    frame.title = a.name;
    /* no allow-same-origin: the app cannot reach SEA OS, only window.box */
    frame.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-pointer-lock");
    const base = a.src.startsWith("fs:") ? "" : new URL(a.src, location.href).href.replace(/[^/]*$/, "");
    frame.srcdoc = withBridge(html, base);
    wrap.innerHTML = "";
    wrap.appendChild(frame);
    entry.frame = frame;
    Bridged.add(entry);
    frame.addEventListener("load", () => { if (activeWin === win) try { frame.contentWindow.focus(); } catch (x){} });
  })();
  return {
    focusFrame(){ try { if (entry.frame) entry.frame.contentWindow.focus(); } catch (x){} },
    menus(){
      return {
        File: [
          { label: "Reload " + a.name, run: () => { Bridged.delete(entry); win.api = storeAppRun(win, a); } },
          { label: "Show its files", run: () => { const d = HOME + "/Documents/" + safeName(a.name); ensureDir(d); openInFiles(d); } },
          "-",
          { label: "Close Window", run: () => win.close() }
        ]
      };
    },
    onClose(){ Bridged.delete(entry); return true; }
  };
}

/* The Store lives in Settings now rather than in a window of its own. */
let storeHost = null;
function storeSection(host){
  storeHost = host;
  host.innerHTML = "";
  const bar = el("div", "st-bar");
  const find = el("input", "vd-find st-find");
  find.placeholder = "Filter";
  find.spellcheck = false;
  const add = el("button", "tb-btn", "Install from Files\u2026");
  const again = el("button", "tb-btn", "\u21BB");
  again.title = "Look again";
  bar.append(find, el("span", "ed-sp"), add, again);
  const body = el("div", "st-body");
  host.append(bar, body);
  let loading = false;

  function card(a, installed){
    const c = el("div", "st-card");
    const t = el("div", "st-txt");
    t.append(el("div", "st-n", a.name), el("div", "st-d", a.desc),
             el("div", "st-src", a.src.startsWith("fs:") ? "from " + tilde(a.src.slice(3)) : a.src));
    const acts = el("div", "st-acts");
    if (installed){
      const open = el("button", "btn primary", "Open");
      open.onclick = () => launch(a.id);

      else body.appendChild(el("div", "st-none",

                    "Install as app, or put it in the apps/ folder of the repository. These tags at the top name it:"),
      el("pre", "hp-code", '<title>My App</title>\n<meta name="description" content="What it does">\n' +
                           '<meta name="box-icon" content="\uD83E\uDDE9">\n<meta name="box-size" content="640x480">'),

const pgEsc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const PG_JS_WORDS = new Set(("await async break case catch class const continue default delete do else export extends " +
  "false finally for function if import in instanceof let new null of return static super switch this throw true try " +
  "typeof undefined var void while yield").split(" "));

function pgHighlightJs(src){
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?|`(?:[^`\\]|\\.)*`?)|(\b\d[\d.]*\b)|([A-Za-z_$][\w$]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))){
    out += pgEsc(src.slice(last, m.index));
    const t = pgEsc(m[0]);
    if (m[1]) out += '<span class="c">' + t + "</span>";
    else if (m[2]) out += '<span class="s">' + t + "</span>";
    else if (m[3]) out += '<span class="n">' + t + "</span>";
    else out += PG_JS_WORDS.has(m[4]) ? '<span class="k">' + t + "</span>" : t;
    last = re.lastIndex;
  }
  return out + pgEsc(src.slice(last));
}
function pgHighlightCss(src){
  const re = /(\/\*[\s\S]*?(?:\*\/|$))|("[^"\n]*"?|'[^'\n]*'?)|([\w-]+)(\s*:)(?![^{]*\{)|(#[0-9a-fA-F]{3,8}\b|\b\d[\d.]*(?:px|em|rem|%|vh|vw|s|ms|deg)?\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))){
    out += pgEsc(src.slice(last, m.index));
    if (m[1]) out += '<span class="c">' + pgEsc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="s">' + pgEsc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="a">' + pgEsc(m[3]) + "</span>" + pgEsc(m[4]);
    else out += '<span class="n">' + pgEsc(m[5]) + "</span>";
    last = re.lastIndex;
  }
  return out + pgEsc(src.slice(last));
}
function pgHighlightTag(tag){
  /* tag is the whole "<name attr=value ...>" text */
  const m = /^(<\/?)([\w:-]*)([\s\S]*?)(\/?>)?$/.exec(tag);
  if (!m) return pgEsc(tag);
  const attrs = m[3].replace(/([^\s=]+)(\s*=\s*)?("[^"]*"?|'[^']*'?|[^\s>]+)?/g, (all, name, eq, val) =>
    '<span class="a">' + pgEsc(name) + "</span>" + (eq ? pgEsc(eq) : "") + (val ? '<span class="s">' + pgEsc(val) + "</span>" : ""));
  return '<span class="t">' + pgEsc(m[1] + m[2]) + "</span>" + attrs + (m[4] ? '<span class="t">' + pgEsc(m[4]) + "</span>" : "");
}
function pgHighlight(src){
  let out = "", i = 0;
  const re = /\x3C!--[\s\S]*?(?:--\x3E|$)|\x3C![^>]*>?|\x3C\/?[A-Za-z][^>]*>?/g;
  let m;
  while ((m = re.exec(src))){
    out += pgEsc(src.slice(i, m.index));
    const tok = m[0];
    if (tok.startsWith("\x3C!--")) out += '<span class="c">' + pgEsc(tok) + "</span>";
    else if (tok.startsWith("<!")) out += '<span class="t">' + pgEsc(tok) + "</span>";
    else {
      out += pgHighlightTag(tok);
      /* the inside of a script or style element is its own language */
      const open = /^<(script|style)\b/i.exec(tok);
      if (open && !tok.endsWith("/>")){
        const close = new RegExp("</" + open[1] + "\\s*>", "i");
        const rest = src.slice(re.lastIndex);
        const end = rest.search(close);
        const body = end < 0 ? rest : rest.slice(0, end);
        out += open[1].toLowerCase() === "script" ? pgHighlightJs(body) : pgHighlightCss(body);
        re.lastIndex += body.length;
      }
    }
    i = re.lastIndex;
  }
  return out + pgEsc(src.slice(i));
}

/* ---- Python: Pyodide in a worker ----
   Off the desktop's own thread, so a slow or endless script can be stopped
   instead of freezing SEA OS. Pyodide's current build only loads as a
   module, so this is a module worker. */
const PY_VERSION = "314.0.6";
const PY_BASE = "https://cdn.jsdelivr.net/npm/pyodide@" + PY_VERSION + "/";
const PY_WORKER_SRC =
  "const base = " + JSON.stringify(PY_BASE) + ";\n" +
  "let py = null, lines = [];\n" +
  "self.onmessage = async e => {\n" +
  "  const code = e.data.code;\n" +
  "  try {\n" +
  "    if (!py){\n" +
  "      postMessage({ type: 'status', text: 'Loading Python - the first time takes a few seconds.' });\n" +
  "      const { loadPyodide } = await import(base + 'pyodide.mjs');\n" +
  "      py = await loadPyodide({ indexURL: base });\n" +
  "      py.setStdout({ batched: s => postMessage({ type: 'out', text: s }) });\n" +
  "      py.setStderr({ batched: s => postMessage({ type: 'err', text: s }) });\n" +
  "      py.setStdin({ stdin: () => (lines.length ? lines.shift() : null) });\n" +
  "    }\n" +
  "    lines = (e.data.input || []).slice();\n" +
  "    await py.loadPackagesFromImports(code, {\n" +
  "      messageCallback: m => postMessage({ type: 'status', text: m }),\n" +
  "      errorCallback: m => postMessage({ type: 'err', text: m })\n" +
  "    });\n" +
  "    const result = await py.runPythonAsync(code);\n" +
  "    if (result !== undefined && result !== null) postMessage({ type: 'out', text: String(result) });\n" +
  "    postMessage({ type: 'done' });\n" +
  "  } catch (err){\n" +
  "    postMessage({ type: 'fail', text: String((err && err.message) || err) });\n" +
  "  }\n" +
  "};\n";
/* A traceback starts with Pyodide's own frames; the user's begin at <exec> */
function pyTrace(text){
  const t = String(text || "");
  const i = t.indexOf('File "<exec>"');
  if (i < 0) return t.trim();
  return ("Traceback (most recent call last):\n" + t.slice(t.lastIndexOf("\n", i) + 1)).trim();
}
const PG_PY_WORDS = new Set(("False None True and as assert async await break case class continue def del elif " +
  "else except finally for from global if import in is lambda match nonlocal not or pass raise return self " +
  "try while with yield").split(" "));
function pgHighlightPy(src){
  const re = /(#[^\n]*)|([rbfu]{0,2}(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?))|(\b\d[\d_.]*(?:e[+-]?\d+)?j?\b)|(@[\w.]+)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))){
    out += pgEsc(src.slice(last, m.index));
    const t = pgEsc(m[0]);
    if (m[1]) out += '<span class="c">' + t + "</span>";
    else if (m[2]) out += '<span class="s">' + t + "</span>";
    else if (m[3]) out += '<span class="n">' + t + "</span>";
    else if (m[4]) out += '<span class="a">' + t + "</span>";
    else out += PG_PY_WORDS.has(m[5]) ? '<span class="k">' + t + "</span>" : t;
    last = re.lastIndex;
  }

/* ---- a web page kept as three tabs, saved as one file ----
   The CSS and JS tabs are written into the page inside tagged blocks, and
   read back out of them when the file is opened again. A page without the
   tags simply opens with everything in the HTML tab. */
const PG_CSS_OPEN = '<style data-playground="css">';
const PG_JS_OPEN = '<script data-playground="js">';
function pgJoin(bufs){
  let page = bufs.html;
  const css = bufs.css.trim() ? PG_CSS_OPEN + "\n" + bufs.css.replace(/\s+$/, "") + "\n\x3C/style>\n" : "";
  const js = bufs.js.trim() ? PG_JS_OPEN + "\n" + bufs.js.replace(/\s+$/, "") + "\n\x3C/script>\n" : "";
  if (css) page = /\x3C\/head>/i.test(page) ? page.replace(/\x3C\/head>/i, css + "\x3C/head>") : css + page;
  if (js) page = /\x3C\/body>/i.test(page) ? page.replace(/\x3C\/body>/i, js + "\x3C/body>") : page + (page.endsWith("\n") ? "" : "\n") + js;
  return page;
}
function pgSplit(text){
  const out = { html: String(text), css: "", js: "" };
  const cssRe = /\x3Cstyle data-playground="css">\n?([\s\S]*?)\n?\x3C\/style>\n?/i;
  const jsRe = /\x3Cscript data-playground="js">\n?([\s\S]*?)\n?\x3C\/script>\n?/i;
  let m;
  if ((m = cssRe.exec(out.html))){ out.css = m[1] + "\n"; out.html = out.html.replace(m[0], ""); }
  if ((m = jsRe.exec(out.html))){ out.js = m[1] + "\n"; out.html = out.html.replace(m[0], ""); }
  return out;
}
