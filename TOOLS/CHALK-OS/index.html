<script>
"use strict";
/* ============================================================
   0. helpers
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
let idSeq = 0;
/* The version, in one place. Everything that shows it reads this, and the
   system files a saved disk carries are rewritten at startup when they were
   written by an older one - otherwise the Terminal would go on greeting you
   with the version you first installed. */
const VERSION = "ALPHA 1.0";
const uid = p => (p || "id") + "_" + (++idSeq) + "_" + Math.random().toString(36).slice(2, 6);

function fmtBytes(n){
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
  if (n < 1024 * 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n < 1024 * 1073741824) return (n / 1073741824).toFixed(1) + " GB";
  return (n / 1099511627776).toFixed(1) + " TB";
}
function fmtDuration(ms){
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h) return h + "h " + m + "m";
  if (m) return m + "m " + sec + "s";
  return sec + "s";
}
function fmtAgo(t){
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 90) return "a minute ago";
  if (s < 3600) return Math.floor(s / 60) + " minutes ago";
  if (s < 7200) return "an hour ago";
  return Math.floor(s / 3600) + " hours ago";
}

/* ============================================================
   1. virtual file system  (in memory, session only)
   ============================================================ */
const HOME = "/home/box";
const FS = { root: { type: "dir", children: {} } };

const dirNode  = () => ({ type: "dir", children: {} });
const fileNode = (content, kind, mime) => ({ type: "file", content, kind: kind || "text", mime: mime || "text/plain" });

function expand(p){
  if (p === "~") return HOME;
  if (p.startsWith("~/")) return HOME + p.slice(1);
  return p;
}
function segs(path, cwd){
  path = expand(String(path));
  const abs = path.startsWith("/") ? path : (cwd || "/").replace(/\/+$/, "") + "/" + path;
  const out = [];
  for (const s of abs.split("/")){
    if (!s || s === ".") continue;
    if (s === ".."){ out.pop(); continue; }
    out.push(s);
  }
  return out;
}
const joinSegs = parts => "/" + parts.join("/");
function absPath(path, cwd){ return joinSegs(segs(path, cwd)); }
function baseName(path){ const p = segs(path, "/"); return p.length ? p[p.length - 1] : "/"; }
function dirName(path){ const p = segs(path, "/"); p.pop(); return joinSegs(p); }
function tilde(path){ return path === HOME ? "~" : path.startsWith(HOME + "/") ? "~" + path.slice(HOME.length) : path; }

function node(path, cwd){
  let n = FS.root;
  for (const s of segs(path, cwd || "/")){
    if (n.type !== "dir") return null;
    n = n.children[s];
    if (!n) return null;
  }
  return n;
}
function ensureDir(path){
  let n = FS.root;
  for (const s of segs(path, "/")){
    if (!n.children[s]) n.children[s] = dirNode();
    n = n.children[s];
    if (n.type !== "dir") return null;
  }
  markDirty();
  return n;
}

/* the two places that used to poke children{} directly now come through here,
   so nothing can change the disk without the save layer noticing */
function addUnique(parentPath, name, content, kind, mime){
  const parent = node(parentPath);
  if (!parent || parent.type !== "dir") return null;
  const final = uniqueName(parent, name);
  parent.children[final] = fileNode(content, kind, mime);
  markDirty();
  return final;
}
function writeFile(path, content, kind, mime){
  const p = segs(path, "/"), name = p.pop();
  const parent = node(joinSegs(p));
  if (!parent || parent.type !== "dir" || !name) return false;
  const prev = parent.children[name];
  parent.children[name] = fileNode(content, kind || (prev && prev.kind) || "text", mime || (prev && prev.mime));
  markDirty();
  return true;
}
function removePath(path){
  const p = segs(path, "/"), name = p.pop();
  const parent = node(joinSegs(p));
  if (!parent || !parent.children[name]) return false;
  delete parent.children[name];
  markDirty();
  return true;
}
function renamePath(path, newName){
  const p = segs(path, "/"), name = p.pop();
  const parent = node(joinSegs(p));
  if (!parent || !parent.children[name] || parent.children[newName]) return false;
  const rebuilt = {};
  for (const [k, v] of Object.entries(parent.children)) rebuilt[k === name ? newName : k] = v;
  parent.children = rebuilt;
  markDirty();
  return true;
}
function uniqueName(parent, name){
  if (!parent.children[name]) return name;
  const dot = name.lastIndexOf(".");
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext  = dot > 0 ? name.slice(dot) : "";
  let i = 1;
  while (parent.children[stem + " (" + i + ")" + ext]) i++;
  return stem + " (" + i + ")" + ext;
}
function countFiles(n = FS.root){
  let c = 0;
  if (n.type === "dir") for (const k in n.children) c += countFiles(n.children[k]);
  else c = 1;
  return c;
}
function listDir(n){
  return Object.keys(n.children).sort((a, b) => {
    const A = n.children[a].type === "dir", B = n.children[b].type === "dir";
    if (A !== B) return A ? -1 : 1;
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
  });
}
function walkFS(fn, n = FS.root, path = ""){
  if (n.type !== "dir") return;
  for (const name of listDir(n)){
    const child = n.children[name], p = path + "/" + name;
    fn(p, child, name);
    walkFS(fn, child, p);
  }
}

const TEXT_EXT = ["txt","md","markdown","html","htm","css","js","mjs","json","csv","tsv","xml","log","sh","py","rb","c","h","cpp","java","ts","tsx","jsx","yml","yaml","ini","conf","cfg","sql","rs","go","php"];
const IMG_EXT  = ["png","jpg","jpeg","gif","webp","svg","bmp","ico","avif"];
const HTML_EXT = ["html","htm"];
const extOf    = name => (name.includes(".") ? name.split(".").pop().toLowerCase() : "");
const isHtml   = name => HTML_EXT.includes(extOf(name));

function kindFor(name, mime){
  const e = extOf(name);
  if ((mime && mime.startsWith("image/")) || IMG_EXT.includes(e)) return "image";
  if ((mime && (mime.startsWith("text/") || /json|xml|javascript|ecmascript/.test(mime))) || TEXT_EXT.includes(e)) return "text";
  return "binary";
}
function nodeSize(n){
  if (n.type === "dir") return null;
  if (n.kind === "link") return null;      /* it lives in the repo, not here */
  if (n.kind === "text") return new Blob([n.content]).size;
  const i = n.content.indexOf(",");
  return Math.max(0, Math.round((n.content.length - i - 1) * 3 / 4));
}
function nodeIcon(name, n){
  if (!n) return "\u2753";
  if (n.type === "dir") return "\uD83D\uDCC1";
  if (n.kind === "image" || IMG_EXT.includes(extOf(name))) return "\uD83D\uDDBC\uFE0F";
  if (isVideo(name)) return "\uD83C\uDFAC";
  if (isAudio(name)) return "\uD83C\uDFB5";
  if (n.kind === "binary") return "\uD83D\uDCE6";
  const e = extOf(name);
  if (isHtml(name)) return "\uD83C\uDF10";
  if (e === "md" || e === "markdown") return "\uD83D\uDCDD";
  if (e === "js" || e === "mjs" || e === "json") return "\uD83D\uDCDC";
  if (e === "css") return "\uD83C\uDFA8";
  return "\uD83D\uDCC4";
}
function typeLabel(name, n){
  if (n.type === "dir") return "Folder";
  if (n.kind === "link")
    return (isVideo(name) ? "Video" : isAudio(name) ? "Audio"
            : IMG_EXT.includes(extOf(name)) ? "Picture" : "File") +
           (/^https?:/i.test(n.content) ? " from the web" : " in repo");
  const e = extOf(name);
  if (n.kind === "image") return (e ? e.toUpperCase() : "Image") + " image";
  if (isVideo(name)) return (e ? e.toUpperCase() : "Video") + " video";
  if (isAudio(name)) return (e ? e.toUpperCase() : "Audio") + " audio";
  if (n.kind === "binary") return (e ? e.toUpperCase() + " file" : "Binary");
  if (isHtml(name)) return "Web page";
  return e ? e.toUpperCase() + " text" : "Text";
}

/* ---- video: wallpapers, boot screens and playback ---- */
const VIDEO_EXT = ["mp4","webm","ogv","m4v","mov","mkv"];
const isVideo = name => VIDEO_EXT.includes(extOf(name));

/* Videos are far too big to sit in a settings string, so they live in the
   filesystem like any other file and the setting just points at the path.
   That way the existing "too big to save" handling applies to them too. */
function mediaSource(path){
  if (!path) return null;
  const n = node(path);
  return (n && n.type === "file") ? n : null;
}
function importMediaFile(file, dir){
  return new Promise(resolve => {
    ensureDir(dir);
    const r = new FileReader();
    r.onload = () => resolve(addUnique(dir, file.name, r.result, isVideo(file.name) ? "binary" : kindFor(file.name, file.type || ""), file.type || ""));
    r.onerror = () => resolve(null);
    r.readAsDataURL(file);
  });
}

/* ---- seed the disk ---- */
function seedDisk(){
  /* written with whatever the desktop is called right now */
  ensureDir(HOME + "/Documents");
  ensureDir(HOME + "/Pictures");
  ensureDir(HOME + "/Downloads");
  ensureDir(HOME + "/Sites");
  ensureDir(HOME + "/Music");
  ensureDir(HOME + "/Videos");
  ensureDir("/etc");

  writeFile(HOME + "/readme.txt", brand(readmeText()));
  writeFile(HOME + "/notes.md", brand(notesText()));
  State.sysRev = SYS_REV;

  writeFile(HOME + "/Documents/welcome.md",
"# Hello from SEA OS\n\n" +
"This file lives in a filesystem that exists only in your browser.\n\n" +
"Files, Terminal and the editor all read and write the same tree, so if you\n" +
"create a file in the shell it shows up in the file list a moment later.\n\n" +
"Try it:\n\n" +
"    mkdir demo\n" +
"    echo hello there > demo/hi.txt\n" +
"    open demo/hi.txt\n");

  writeFile(HOME + "/Documents/todo.txt",
"- water the plants\n- rebuild the window manager (done)\n- make the windows wobble (done)\n- think about persistence\n");

  ensureDir(HOME + "/Sites");

  writeFile("/etc/motd", brand(motdText()));
  writeFile("/etc/os-release", brand(osReleaseText()));
}
const readmeText = () =>
"SEA OS " + VERSION + "\n" +
"==========\n\n" +
"Welcome. This whole desktop is one HTML file.\n\n" +
"Make it yours\n" +
"-------------\n" +
"  * Settings keeps a button for every page down its left side.\n" +
"  * Wallpaper and boot screen can be a video or a picture of your own.\n" +
"  * Settings > Desktop > Transparency makes the Dock, menu bar and windows see-through.\n" +
"  * Right-click any picture or video in Files to set it from there.\n\n" +
"Files\n" +
"-----\n" +
"  * Drag files in from your real desktop to import them.\n" +

const Clip = { mode: null, paths: [] };
const Trash = { items: [] };   /* {id, name, node, from, when} */

const cloneNode = n => JSON.parse(JSON.stringify(n));

/* put a node into a directory, never overwriting something already there */
function placeNode(dirPath, name, n){
  const parent = node(dirPath);
  if (!parent || parent.type !== "dir") return null;
  const final = uniqueName(parent, name);
  parent.children[final] = n;
  markDirty();
  return final;
}
function copyPath(from, toDir){
  const n = node(from);
  if (!n) return null;
  return placeNode(toDir, baseName(from), cloneNode(n));
}
function movePath(from, toDir){
  const n = node(from);
  if (!n) return null;
  if (dirName(from) === toDir) return baseName(from);
  /* refuse to drop a folder inside itself */
  if (n.type === "dir" && (toDir === from || toDir.startsWith(from + "/"))) return null;
  const placed = placeNode(toDir, baseName(from), n);
  if (placed) removePath(from);
  return placed;
}
function trashPath(p){
  const n = node(p);
  if (!n) return false;
  Trash.items.unshift({ id: uid("tr"), name: baseName(p), node: n, from: dirName(p), when: Date.now() });
  removePath(p);
  saveTrash();
  return true;
}
function restoreTrash(id){
  const i = Trash.items.findIndex(t => t.id === id);
  if (i < 0) return null;
  const t = Trash.items[i];
  let dest = t.from;
  if (!node(dest) || node(dest).type !== "dir"){ ensureDir(HOME); dest = HOME; }
  const placed = placeNode(dest, t.name, t.node);
  Trash.items.splice(i, 1);
  saveTrash();
  return placed ? dest + "/" + placed : null;
}
function emptyTrash(){ Trash.items = []; saveTrash(); }
function trashBytes(){
  let n = 0;
  const walk = x => {
    if (x.type === "dir") for (const k in x.children) walk(x.children[k]);
    else n += nodeSize(x) || 0;
  };
  Trash.items.forEach(t => walk(t.node));
  return n;
}
function saveTrash(){
  /* the views must refresh even when nothing is being persisted, or the
     Trash count on the desktop silently stops matching reality */
  if (Store.on && !Disk.blocked){
    if (Disk.ok) saveFS();
    else try {
      localStorage.setItem(K.trash, JSON.stringify(Trash.items));
      Store.lastSaved = Date.now();
    } catch (e){ storageFull(); }

}

function brandTree(root){
  if (theBrand() === BRANDS.sea || !root) return root;

  const hits = [];
  /* anything inside data-nobrand keeps the words it was written with - the
     switch that picks the name has to be able to say both of them */
  while (walk.nextNode()){
    const n = walk.currentNode;
    if (BRAND_WORDS.test(n.nodeValue) && !(n.parentElement && n.parentElement.closest("[data-nobrand]"))) hits.push(n);

    for (const a of ["title", "placeholder", "aria-label"]){
      const v = e.getAttribute(a);
      if (v && BRAND_WORDS.test(v)) e.setAttribute(a, brand(v));

/* serialise the tree, optionally leaving out paths that blew the quota */
function serializeFS(skip){
  if (!skip || !skip.size) return JSON.stringify(FS.root);
  const prune = (n, path) => {
    if (n.type !== "dir") return n;
    const out = { type: "dir", children: {} };
    for (const name in n.children){
      const p = path + "/" + name;
      if (skip.has(p)) continue;
      out.children[name] = prune(n.children[name], p);

/* ============================================================

   localStorage is quick and synchronous, but it tops out at around 5 MB,
   which is one song. So the files themselves live in the browser's own
   private file system (OPFS), which holds gigabytes, and localStorage keeps
   only the shape of the tree - names, folders, and for each big file a
   short reference to where its bytes are.

   Nothing changes in memory: every file still holds its whole content, so
   no app needs to know any of this. The bytes are written once, when a file
   arrives or changes, and the tree after them, so a tab closed halfway
   leaves the last good tree pointing at files that exist. Browsers without
   OPFS carry on the old way, everything in localStorage.
   ============================================================ */
const DISK_DIR = "chalkos-disk";
const INLINE_TEXT_MAX = 256 * 1024;   /* text bigger than this goes to disk as well */
const Disk = {
  ok: false,
  blocked: false,          /* the disk would not open, so saving would lose files */
  dir: null,
  ids: new WeakMap(),      /* node -> { id, type } for bytes already on disk */
  failed: new WeakSet(),   /* nodes whose bytes would not write */
  writing: new Set(),      /* ids being written right now - never swept up */
  chain: Promise.resolve(),
  swept: 0
};
const diskId = () => (crypto.randomUUID ? crypto.randomUUID() : uid("b") + Date.now().toString(36));
/* what belongs on disk rather than in the tree */
const toDisk = n => n && n.type === "file" && n.kind !== "link" && typeof n.content === "string" &&

async function diskOpen(){
  try {
    if (!Store.available || !window.isSecureContext || !navigator.storage || !navigator.storage.getDirectory) return false;
    if (typeof FileSystemFileHandle === "undefined" || !("createWritable" in FileSystemFileHandle.prototype)) return false;
    const root = await navigator.storage.getDirectory();
    Disk.dir = await root.getDirectoryHandle(DISK_DIR, { create: true });
    /* some browsers hand over the folder and then refuse the write */
    const probe = await Disk.dir.getFileHandle(".probe", { create: true });
    const w = await probe.createWritable();
    await w.write("ok");
    await w.close();
    Disk.ok = true;
  } catch (e){
    Disk.ok = false;
    Disk.dir = null;
  }
  return Disk.ok;
}
/* in the tree, a file on disk is written as a reference instead of its bytes */
function diskReplacer(key, value){
  if (!value || value.type !== "file" || !Disk.ok || !toDisk(value)) return value;
  const rec = Disk.ids.get(value);
  if (!rec) return undefined;          /* not on disk yet - the next save brings it */
  const out = {};
  for (const k in value) if (k !== "content") out[k] = value[k];
  out.blob = rec.id;
  out.btype = rec.type;
  return out;
}
function diskEach(fn){
  const visit = n => {
    if (!n) return;
    if (n.type === "dir"){ for (const k in n.children) visit(n.children[k]); return; }
    fn(n);
  };

async function diskWrite(n){

                                    : await (await fetch(n.content)).blob();   /* a data: address decodes itself */
    const fh = await Disk.dir.getFileHandle(id, { create: true });
    const w = await fh.createWritable();
    await w.write(bytes);
    await w.close();
    Disk.ids.set(n, { id, type: bytes.type || n.mime || "" });
    Disk.failed.delete(n);
  } catch (e){
    Disk.failed.add(n);
    try { await Disk.dir.removeEntry(id); } catch (x){}
  } finally {
    Disk.writing.delete(id);
  }
}
function diskRead(blob, type){
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => fail(r.error);
    r.readAsDataURL(type ? new Blob([blob], { type }) : blob);
  });
}
/* After the tree is read, put each file's bytes back into it. A file whose
   bytes have gone - storage cleared by the browser - is taken out of the
   tree rather than left as an empty shell that opens to nothing. */
async function diskHydrate(){
  const want = [];
  Trash.items = Trash.items.filter(t => t && t.node);   /* one caught mid-save */
  diskEach(n => { if (n.type === "file" && n.blob) want.push(n); });
  if (!want.length) return;
  /* The tree says the bytes are on disk, but the disk will not open this
     time. Saving now would write a tree without those files and lose them
     for good, so hold off saving altogether until a reload that can read
     them. */
  if (!Disk.ok){
    Disk.blocked = true;
    setTimeout(() => notify("Saving is paused",
      "This browser would not open the storage that holds your bigger files, so SEA OS is not saving " +
      "anything this time rather than risk losing them. Reload to try again.", "⚠️"), 1500);
  }
  let next = 0;
  const worker = async () => {
    while (next < want.length){
      const n = want[next++];
      try {
        if (!Disk.ok) throw new Error("no disk");
        const file = await (await Disk.dir.getFileHandle(n.blob)).getFile();
        n.content = n.kind === "text" ? await file.text() : await diskRead(file, n.btype);
        Disk.ids.set(n, { id: n.blob, type: n.btype || "" });
      } catch (e){ n.lost = true; }
      delete n.blob;
      delete n.btype;
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  let lost = 0;
  const prune = n => {
    if (!n || n.type !== "dir") return;
    for (const k of Object.keys(n.children)){
      const c = n.children[k];
      if (c.lost){ delete n.children[k]; lost++; } else prune(c);
    }
  };
  prune(FS.root);
  Trash.items = Trash.items.filter(t => {
    if (t.node && t.node.lost){ lost++; return false; }
    prune(t.node);
    return true;
  });
  if (lost) setTimeout(() => notify("Some files could not be restored",
    lost + (lost === 1 ? " file's" : " files'") + " contents were missing from this browser's storage, " +
    "so " + (lost === 1 ? "it was" : "they were") + " left out.", "⚠️"), 1500);
}
/* Bytes nothing points to any more - deleted, replaced, emptied from the
   Trash - are cleared away now and then, never while something is writing. */
async function diskSweep(){
  if (!Disk.ok || Disk.writing.size || Date.now() - Disk.swept < 60000) return;
  Disk.swept = Date.now();
  const keep = new Set();
  diskEach(n => { const r = Disk.ids.get(n); if (r) keep.add(r.id); });
  try {
    for await (const name of Disk.dir.keys()){
      if (name === ".probe" || keep.has(name) || Disk.writing.has(name)) continue;
      try { await Disk.dir.removeEntry(name); } catch (e){}
    }
  } catch (e){}
}
async function diskWipe(){
  Disk.ids = new WeakMap();
  Disk.failed = new WeakSet();
  if (!Disk.dir) return;
  try {
    const root = await navigator.storage.getDirectory();
    await root.removeEntry(DISK_DIR, { recursive: true });
    Disk.dir = await root.getDirectoryHandle(DISK_DIR, { create: true });
  } catch (e){}
}
/* Settings > Storage > Keep files in: move everything to the other place, and
   only let go of the old copy once the new one is written. */
async function switchStorage(to){
  const now = State.storage === "local" ? "local" : "disk";
  if (now === to) return;
  if (to === "local"){
    let big = 0;
    walkFS((p, n) => { if (n.type === "file" && n.kind !== "text" && n.kind !== "link") big += nodeSize(n) || 0; });
    const ok = await osConfirm("Keep files in localStorage",
      "localStorage is simple and plain, but it holds only 5 to 10 MB for everything." +
      (big > 3.5e6 ? "\n\nYour files come to " + fmtBytes(big) + ", so the biggest ones will only last until you reload." : "") +
      "\n\nMove everything there?", "Move");
    if (!ok) return;
    await Disk.chain;                 /* let anything half-written finish */
    State.storage = "local";
    saveSettings();
    Disk.ok = false;
    if (Store.on && saveFSInline()) await diskWipe();
    notify("Files in localStorage", "Everything SEA OS keeps is now in localStorage.", "\uD83D\uDCBE");
  } else {
    State.storage = "disk";
    saveSettings();
    if (!(await diskOpen())){
      State.storage = "local";
      saveSettings();
      return osAlert("File storage is not available", "This browser will not give SEA OS its own file storage, so files stay in localStorage.");
    }
    if (Store.on) saveFS();
    notify("Files in file storage", "Big files now go in the browser's own file storage, which holds gigabytes.", "\uD83D\uDCBE");
  }
}
/* what is on disk now, for Settings */
function diskBytes(){
  let n = 0;
  diskEach(x => { if (Disk.ids.has(x)) n += nodeSize(x) || 0; });
  return n;
}

/* Save the tree. With a disk, new bytes go there first and the tree after
   them; writes and clean-ups share one queue so they never overlap. */
function saveFS(){
  if (!Store.on || Disk.blocked) return false;
  clearTimeout(Store.timer);
  if (!Disk.ok) return saveFSInline();
  const todo = [];
  diskEach(n => { if (toDisk(n) && !Disk.ids.has(n) && !Disk.failed.has(n)) todo.push(n); });
  if (!todo.length) return writeTree();
  Disk.chain = Disk.chain.then(async () => {
    for (const n of todo) if (!Disk.ids.has(n)) await diskWrite(n);
    writeTree();
  });
  return true;
}
function writeTree(){
  try {
    localStorage.setItem(K.fs, JSON.stringify(FS.root, diskReplacer));
    localStorage.setItem(K.trash, JSON.stringify(Trash.items, diskReplacer));
  } catch (e){ storageFull(); return false; }
  Store.lastSaved = Date.now();
  /* anything whose bytes would not write is open for this session only */
  const skip = new Set();
  walkFS((p, n) => { if (Disk.failed.has(n)) skip.add(p); });
  const fresh = Array.from(skip).filter(p => !Store.unsaved.has(p));
  const changed = skip.size !== Store.unsaved.size || fresh.length > 0;
  Store.unsaved = skip;
  if (fresh.length) notifyTooBig(fresh);
  if (changed) refreshFilesViews();
  refreshSettings();
  Disk.chain = Disk.chain.then(diskSweep);
  return true;
}
/* the old way, for browsers without a disk: the whole tree in localStorage,
   dropping the biggest files first when it will not fit */
function saveFSInline(){
  if (!Store.on) return false;
  clearTimeout(Store.timer);
  /* biggest non-text files first - they are the only things that can blow 5 MB */
  const heavy = [];
  walkFS((p, n) => { if (n.type === "file" && n.kind !== "text") heavy.push([p, nodeSize(n)]); });
  heavy.sort((a, b) => b[1] - a[1]);
  const skip = new Set();
  for (let i = 0; i <= heavy.length; i++){
    try {
      localStorage.setItem(K.fs, serializeFS(skip));
      Store.lastSaved = Date.now();
      const fresh = Array.from(skip).filter(p => !Store.unsaved.has(p));
      const changed = skip.size !== Store.unsaved.size || fresh.length > 0;
      Store.unsaved = skip;
      if (fresh.length) notifyTooBig(fresh);
      if (changed) refreshFilesViews();
      refreshSettings();
      return true;
    } catch (e){
      if (i === heavy.length){ storageFull(); return false; }
      skip.add(heavy[i][0]);
    }
  }
}
function notifyTooBig(paths){
  const names = paths.map(baseName).join(", ");
  notify("Too big to save",
    names + (paths.length === 1 ? " is" : " are") + " open for this session only. " +
    "They did not fit in this browser's storage limit.", "\u26A0\uFE0F");
}
function storageFull(){
  notify("Could not save", "Browser storage is full, so this change was not written to disk.", "\u26A0\uFE0F");
}
function saveSettings(){
  if (!Store.on) return;
  const o = {};
  for (const k of SETTING_KEYS) o[k] = State[k];
  try { localStorage.setItem(K.set, JSON.stringify(o)); Store.lastSaved = Date.now(); }
  catch (e){ storageFull(); }
}
function saveShortcuts(){
  if (!Store.on) return;
  try {
    localStorage.setItem(K.sc, JSON.stringify({ shortcuts: State.shortcuts, builtins: State.builtins }));
    Store.lastSaved = Date.now();
  } catch (e){ storageFull(); }
}
/* returns true when a saved disk was restored, so boot knows not to seed */
function loadState(){
  if (!Store.available) return false;
  let restored = false;
  try {
    if (localStorage.getItem(K.on) !== "1") return false;
    Store.on = true;
    const set = localStorage.getItem(K.set);
    if (set){
      const o = JSON.parse(set);
      for (const k of SETTING_KEYS) if (o[k] !== undefined) State[k] = o[k];
      /* 0.93 and 0.94 kept a plain on/off for booting into a game */
      if (o.startMode === undefined && o.gameMode) State.startMode = "game";
    }
    const sc = localStorage.getItem(K.sc);
    if (sc){
      const o = JSON.parse(sc);
      if (Array.isArray(o.shortcuts)) State.shortcuts = o.shortcuts;
      if (o.builtins) State.builtins = Object.assign(State.builtins, o.builtins);
    }
    const tr = localStorage.getItem(K.trash);
    if (tr){
      const items = JSON.parse(tr);
      if (Array.isArray(items)) Trash.items = items;
    }
    const fs = localStorage.getItem(K.fs);
    if (fs){
      const tree = JSON.parse(fs);
      if (tree && tree.type === "dir"){ FS.root = tree; restored = true; }
    }
  } catch (e){
    /* a corrupt or half-written disk must not brick the desktop */
    console.warn("SEA OS: could not read saved state -", e.message);
    return false;
  }
  return restored;
}
function setSaving(on){
  if (on){
    if (!Store.available) return;
    Store.on = true;
    try { localStorage.setItem(K.on, "1"); }
    catch (e){ Store.on = false; return storageFull(); }
    /* ask the browser not to clear it away when space runs short */
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    saveSettings(); saveShortcuts(); saveTrash(); saveFS();
    notify("Saving is on", "Your files, settings and shortcuts will be here next time you open SEA OS.", "\uD83D\uDCBE");
  } else {
    Store.on = false;
    clearTimeout(Store.timer);
    for (const k in K){ try { localStorage.removeItem(K[k]); } catch (e){} }
    diskWipe();
    Store.unsaved = new Set();
    refreshFilesViews();
    notify("Saving is off", "SEA OS deleted everything it had stored. This session keeps working as normal.", "\uD83D\uDEAB");
  }
  refreshSettings();
}
function refreshFilesViews(){
  for (const w of windows.values())
    if (w.appId === "files" && w.api && w.api.refresh) w.api.refresh();
}
/* last chance to flush before the tab goes away */
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveFS(); });
addEventListener("pagehide", () => { saveFS(); });

/* ============================================================
   2c. media sitting beside box-os.html

   Drop wallpaper.mp4 or boot.mp4 in the same folder (or the same repo)
   and SEA OS picks them up as defaults. We load them rather than probe
   with fetch, because fetch is blocked on file:// - this way it works
   both from a plain folder and from GitHub Pages. Anything you choose
   in Settings always wins over these.
   ============================================================ */
const SIBLING_NAMES = {
  wall: ["wallpaper.mp4", "wallpaper.webm", "wallpaper.jpg", "wallpaper.jpeg", "wallpaper.png", "wallpaper.gif"],
  boot: ["boot.mp4", "boot.webm", "boot.jpg", "boot.jpeg", "boot.png", "boot.gif"]
};
const Sibling = { wall: null, boot: null };

function probeMedia(url){
  return new Promise(resolve => {
    const video = /\.(mp4|webm|ogv|m4v|mov)$/i.test(url);
    const t = setTimeout(() => { cleanup(); resolve(null); }, 4000);
    const e = video ? document.createElement("video") : new Image();
    const ok = () => { cleanup(); resolve({ url, video }); };
    const no = () => { cleanup(); resolve(null); };
    function cleanup(){
      clearTimeout(t);
      e.onerror = null;
      if (video){ e.onloadeddata = null; e.removeAttribute("src"); }
      else e.onload = null;
    }
    e.onerror = no;
    if (video){
      e.muted = true;
      e.preload = "auto";
      e.onloadeddata = ok;
    } else {
      e.onload = ok;
    }
    e.src = url;
  });
}
async function findSibling(which){
  for (const name of SIBLING_NAMES[which]){
    const hit = await probeMedia(name);
    if (hit) return hit;
  }
  return null;
}
/* started immediately so boot does not have to wait long for an answer */
/* Whether to look at the files that sit beside index.html at all. It is read
   straight from what is saved as well, because some of the looking happens
   before the saved settings are loaded. */
function repoOff(){
  if (State.useRepo === false) return true;
  try {
    return localStorage.getItem("boxos.on") === "1" &&
           JSON.parse(localStorage.getItem("boxos.settings") || "{}").useRepo === false;
  } catch (e){ return false; }
}
const siblingReady = (async () => {
  if (repoOff()) return Sibling;
  const [wall, boot] = await Promise.all([findSibling("wall"), findSibling("boot")]);
  Sibling.wall = wall;
  Sibling.boot = boot;
  return Sibling;
})();

/* ============================================================
   2d. media that ships with the repo

   videos/ and music/ in the repository are mounted into the filesystem as
   *links*, not copies: a node holds the path, not the bytes. A 200 MB video
   therefore costs nothing in browser storage and simply streams from the
   repo. A browser cannot list a folder over HTTP, so the file names come
   from GitHub's API when running on Pages, or from media/manifest.js
   otherwise - a .js file because <script> works on file:// where fetch does not.
   ============================================================ */
const MEDIA_DIRS = { videos: "/Videos", music: "/Music", pictures: "/Pictures" };

function linkNode(url, name){
  const ext = extOf(name);
  const mime = isVideo(name) ? "video/" + ext : isAudio(name) ? "audio/" + ext
             : IMG_EXT.includes(ext) ? "image/" + (ext === "jpg" ? "jpeg" : ext === "svg" ? "svg+xml" : ext) : "";
  return { type: "file", kind: "link", content: url, mime };
}
/* ask GitHub what is in the folders, which only works on a Pages site */
async function discoverViaGitHub(){
  const found = [];
  for (const dir in MEDIA_DIRS){
    const names = await repoList(dir);
    if (!names) continue;
    for (const name of names)
      if (isVideo(name) || isAudio(name) || IMG_EXT.includes(extOf(name))) found.push(dir + "/" + name);
  }
  return found.length ? found : null;
}
/* media/manifest.js sets window.BOXOS_MEDIA = ["videos/a.mp4", ...] */
function loadMediaManifest(){
  return new Promise(resolve => {
    if (Array.isArray(window.BOXOS_MEDIA)) return resolve(window.BOXOS_MEDIA);
    const s = document.createElement("script");
    s.src = "media/manifest.js";
    s.onload = () => resolve(Array.isArray(window.BOXOS_MEDIA) ? window.BOXOS_MEDIA : null);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}
function mountMedia(paths){
  let added = 0;
  for (const p of paths){
    const clean = String(p).replace(/^\.?\//, "");
    const slash = clean.indexOf("/");
    if (slash < 0) continue;
    const dir = clean.slice(0, slash), name = clean.slice(slash + 1);
    const target = MEDIA_DIRS[dir];
    if (!target || !name || name.includes("/")) continue;
    const home = HOME + target;
    ensureDir(home);
    const parent = node(home);
    if (parent.children[name]) continue;      /* already mounted, or you own a file by that name */
    parent.children[name] = linkNode(repoBase() + clean, name);
    added++;
  }
  if (added){
    refreshFilesViews();
    for (const w of windows.values())
      if ((w.appId === "music" || w.appId === "videos" || w.appId === "photos") && w.api.refresh) w.api.refresh();
  }
  return added;
}
/* With the repository switched off, the links it left in ~/Music, ~/Videos
   and ~/Pictures come out too - they would only point at files nobody is
   reading any more. Switched back on, the next start puts them back. */
function unmountRepoMedia(){
  let gone = 0;
  for (const dir in MEDIA_DIRS){
    const d = node(HOME + MEDIA_DIRS[dir]);
    if (!d || d.type !== "dir") continue;
    for (const name of Object.keys(d.children)){
      const n = d.children[name];
      if (n.type === "file" && n.kind === "link" && !/^[a-z]+:/i.test(String(n.content || ""))){ delete d.children[name]; gone++; }
    }
  }
  if (gone){ markDirty(); refreshFilesViews(); }
  return gone;
}
async function mountRepoMedia(){
  if (repoOff()){ unmountRepoMedia(); return 0; }
  const list = (await discoverViaGitHub()) || (await loadMediaManifest());
  if (!list || !list.length) return 0;
  return mountMedia(list);
}

/* ============================================================
   2e. sound

   Every sound is synthesised with Web Audio, so nothing is downloaded and
   the file stays self-contained. Browsers refuse to start audio before you
   interact with the page, so the context is resumed on your first click and
   anything that tries to play before then is quietly skipped.
   ============================================================ */
const Sfx = {
  ctx: null,
  ready: false,
  enabled(){ return State.sounds !== false; },
  wake(){
    if (!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ctx = new AC(); } catch (e){ return null; }
    }
    if (this.ctx.state === "suspended") this.ctx.resume().then(() => { this.ready = true; }).catch(() => {});
    else this.ready = true;
    return this.ctx;
  },
  /* one shaped note; several of these make up each sound */
  note(freq, at, dur, peak, type){
    const c = this.ctx;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, c.currentTime + at);
    gain.gain.setValueAtTime(0.0001, c.currentTime + at);
    gain.gain.exponentialRampToValueAtTime(peak, c.currentTime + at + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + at + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(c.currentTime + at);
    osc.stop(c.currentTime + at + dur + 0.02);
  },
  play(name){
    if (!this.enabled()) return;
    const c = this.wake();
    if (!c || c.state !== "running") return;    /* not allowed to make noise yet */
    const V = 0.09;
    if (name === "boot"){
      [[392, 0], [523.25, 0.13], [659.25, 0.26], [783.99, 0.39]]
        .forEach(([f, t]) => this.note(f, t, t === 0.39 ? 1.1 : 0.45, V, "sine"));
    } else if (name === "notify"){
      this.note(880, 0, 0.18, V * 0.8, "sine");
      this.note(1174.7, 0.09, 0.3, V * 0.6, "sine");
    } else if (name === "error"){
      this.note(220, 0, 0.16, V, "triangle");
      this.note(155.6, 0.08, 0.28, V, "triangle");
    } else if (name === "trash"){
      this.note(300, 0, 0.09, V * 0.7, "square");
      this.note(180, 0.06, 0.14, V * 0.5, "square");
    } else if (name === "open"){
      this.note(523.25, 0, 0.1, V * 0.45, "sine");
      this.note(784, 0.05, 0.14, V * 0.35, "sine");
    } else if (name === "close"){
      this.note(440, 0, 0.09, V * 0.4, "sine");
      this.note(294, 0.05, 0.13, V * 0.35, "sine");
    }
  }
};
/* the first interaction is what earns us permission to make noise */
addEventListener("pointerdown", () => Sfx.wake(), { once: true });
addEventListener("keydown", () => Sfx.wake(), { once: true });

/* ============================================================
   3. notifications
   ============================================================ */
function notify(title, body, icon){
  const n = { id: uid("n"), title: brand(title), body: brand(body || ""), icon: icon || "\u2139\uFE0F", time: Date.now() };
  State.notifications.unshift(n);
  if (State.notifications.length > 60) State.notifications.length = 60;
  $("#clockbtn").classList.add("unread");
  Sfx.play(/warn|could not|too big|full/i.test(title + " " + (body || "")) ? "error" : "notify");
  drawNotifications();
  showToast(n);
  return n;
}
function showToast(n){
  const t = el("div", "toast");
  const body = el("div");
  body.append(el("div", "nt", n.title));
  if (n.body) body.append(el("div", "nb", n.body));
  t.append(el("span", "g", n.icon), body);
  const kill = () => {
    t.classList.add("out");
    setTimeout(() => t.remove(), 220);
  };
  t.onclick = kill;
  $("#toasts").appendChild(t);
  setTimeout(kill, 4600);
}
function drawNotifications(){
  const list = $("#np-list"), count = $("#np-count");
  list.innerHTML = "";
  if (!State.notifications.length){
    list.appendChild(el("div", "np-empty", "Nothing to report.\nNotifications from SEA OS show up here."));
    count.textContent = "No notifications";
    $("#np-clear").disabled = true;
    return;
  }
  count.textContent = State.notifications.length + (State.notifications.length === 1 ? " notification" : " notifications");
  $("#np-clear").disabled = false;
  for (const n of State.notifications){
    const row = el("div", "note");
    const body = el("div", "body");
    body.append(el("div", "nt", n.title));
    if (n.body) body.append(el("div", "nb", n.body));
    body.append(el("div", "nw", fmtAgo(n.time)));
    const x = el("button", "x", "\u2715");
    x.title = "Dismiss";
    x.onclick = e => {
      e.stopPropagation();
      State.notifications = State.notifications.filter(o => o.id !== n.id);
      drawNotifications();
    };
    row.append(el("span", "g", n.icon), body, x);
    list.appendChild(row);
  }
}
function drawCalendar(){
  const cal = $("#np-cal");
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const prev = new Date(y, m, 0).getDate();
  const tbl = el("table");
  const head = el("tr");
  for (const d of ["S","M","T","W","T","F","S"]) head.appendChild(el("th", null, d));
  tbl.appendChild(head);
  let day = 1, next = 1;
  for (let r = 0; r < 6; r++){
    const tr = el("tr");
    for (let c = 0; c < 7; c++){
      const i = r * 7 + c;
      let td;
      if (i < first) td = el("td", "out", String(prev - first + i + 1));
      else if (day > days) td = el("td", "out", String(next++));
      else { td = el("td", day === today ? "today" : null, String(day)); day++; }
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
    if (day > days && r >= 4) break;
  }
  cal.innerHTML = "";
  cal.appendChild(tbl);
}

/* ============================================================
   4. modal dialogs
   ============================================================ */
function modal(opts){
  return new Promise(resolve => {
    const layer = $("#modals");
    layer.innerHTML = "";
    const box = el("div", "modal");
    const b = el("div", "modal-b");
    const f = el("div", "modal-f");
    if (opts.message) b.appendChild(el("p", "modal-msg", opts.message));
    const inputs = [];
    for (const fd of (opts.fields || (opts.input ? [{ label: "", value: opts.value }] : []))){
      if (fd.label) b.appendChild(el("label", "modal-lab", fd.label));
      const i = el(opts.multiline ? "textarea" : "input", "modal-in" + (opts.multiline ? " modal-area" : ""));
      if (!opts.multiline) i.type = "text";
      i.spellcheck = !opts.multiline;
      i.value = fd.value || "";
      if (fd.placeholder) i.placeholder = fd.placeholder;
      b.appendChild(i);
      inputs.push(i);
    }
    const done = v => {
      document.removeEventListener("keydown", onKey, true);
      layer.style.display = "none";
      layer.innerHTML = "";
      resolve(v);
    };
    if (opts.cancel !== false){
      const c = el("button", "btn", opts.cancelText || "Cancel");
      c.onclick = () => done(null);
      f.appendChild(c);
    }
    const ok = el("button", "btn " + (opts.danger ? "danger" : "primary"), opts.ok || "OK");
    ok.onclick = () => {
      if (!inputs.length) return done(true);
      const vals = inputs.map(i => i.value.trim());
      if (!vals[0]) return done(null);
      done(opts.fields ? vals : vals[0]);
    };
    f.appendChild(ok);
    const onKey = e => {
      if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); done(null); }
      /* in a box of several lines, Enter is a new line and Ctrl+Enter is OK */
      else if (e.key === "Enter" && (!opts.multiline || e.ctrlKey || e.metaKey)){ e.preventDefault(); e.stopPropagation(); ok.click(); }
    };
    document.addEventListener("keydown", onKey, true);
    box.append(el("div", "modal-t", opts.title || "SEA OS"), b, f);
    brandTree(box);
    layer.appendChild(box);
    layer.style.display = "flex";
    setTimeout(() => { if (inputs[0]){ inputs[0].focus(); inputs[0].select(); } else ok.focus(); }, 0);
  });
}

const windows = new Map();
let winSeq = 0, zTop = 10, cascade = 0, activeWin = null;

/* --- wobbly windows: a spring that skews the frame while it is dragged --- */
function wobbleStart(w){
  if (!State.wobbly || w.max) return;
  w.wob = { sx: 0, sy: 0, vx: 0, vy: 0, tx: 0, ty: 0, held: true, raf: 0 };
  w.el.style.transformOrigin = "50% 0%";
  const step = () => {
    const o = w.wob;
    if (!o) return;
    const k = 0.22, damp = 0.76;
    o.vx = (o.vx + (o.tx - o.sx) * k) * damp;
    o.vy = (o.vy + (o.ty - o.sy) * k) * damp;
    o.sx += o.vx;
    o.sy += o.vy;
    const settled = Math.abs(o.sx) < 0.03 && Math.abs(o.vx) < 0.03 &&
                    Math.abs(o.sy) < 0.03 && Math.abs(o.vy) < 0.03;
    if (settled && !o.held){
      w.el.style.transform = "";
      w.wob = null;
      return;
    }
    w.el.style.transform = "skew(" + o.sx.toFixed(2) + "deg," + o.sy.toFixed(2) + "deg)";
    o.raf = requestAnimationFrame(step);
  };
  w.wob.raf = requestAnimationFrame(step);
}
function wobblePull(w, vx, vy){
  if (!w.wob) return;
  w.wob.tx = clamp(-vx * 0.42, -15, 15);
  w.wob.ty = clamp(-vy * 0.14, -6, 6);
}
function wobbleRelease(w){
  if (!w.wob) return;
  w.wob.held = false;
  w.wob.tx = 0;
  w.wob.ty = 0;
}

function dragify(handle, onStart, onMove, onEnd){
  handle.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    if (e.target.closest("button")) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let lx = sx, ly = sy, lt = performance.now();
    const ctx = onStart(e) || {};
    if (ctx.abort) return;
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add("dragging");
    const move = ev => {
      const now = performance.now();
      const dt = Math.max(1, now - lt);
      const vx = (ev.clientX - lx) * 16 / dt, vy = (ev.clientY - ly) * 16 / dt;
      lx = ev.clientX; ly = ev.clientY; lt = now;
      onMove(ev.clientX - sx, ev.clientY - sy, ctx, vx, vy, ev);
    };
    const up = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      document.body.classList.remove("dragging");
      if (onEnd) onEnd(ctx);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
}

function createWindow(opts){
  const area = $("#windows");
  const id = "w" + (++winSeq);
  /* guard against being called before the viewport has been laid out */
  const aw = Math.max(area.clientWidth, 480), ah = Math.max(area.clientHeight, 340);
  const W = clamp(opts.w || 620, 340, Math.max(340, aw - 20));
  const H = clamp(opts.h || 420, 190, Math.max(190, ah - 20));
  const off = (cascade++ % 7) * 26;
  const x = clamp(Math.round((aw - W) / 2) - 70 + off, 8, Math.max(8, aw - W - 8));
  const y = clamp(Math.round((ah - H) / 2) - 60 + off, 8, Math.max(8, ah - H - 8));

  const root = el("div", "win" + (opts.cls ? " " + opts.cls : ""));
  root.style.cssText = "left:" + x + "px;top:" + y + "px;width:" + W + "px;height:" + H + "px;z-index:" + (++zTop);
  if (State.animations){
    root.classList.add("opening");
    setTimeout(() => root.classList.remove("opening"), 220);
  }

  const bar = el("div", "win-title");
  const tt = el("span", "t", opts.title || "Window");
  const bMin = el("button", "wb", "\u2212"); bMin.title = "Minimize";
  const bMax = el("button", "wb", "\u2610"); bMax.title = "Maximize";
  const bCls = el("button", "wb close", "\u2715"); bCls.title = "Close";
  const titleIcon = el("span", "g");
  setAppIcon(titleIcon, opts.icon || "▫️");
  bar.append(titleIcon, tt, bMin, bMax, bCls);

  const body = el("div", "win-body");
  root.append(bar, body);
  area.appendChild(root);

  const task = el("button", "task");
  const taskIcon = el("span", "g");
  setAppIcon(taskIcon, opts.icon || "▫️");
  task.append(taskIcon, el("span", "t", opts.title || "Window"));
  task.title = opts.title || "Window";
  $("#tasks").appendChild(task);

  const w = {
    id, el: root, body, task, appId: opts.appId, api: {},
    min: false, max: false, prev: null, wob: null,
    setTitle(t){ t = brand(t); tt.textContent = t; task.querySelector(".t").textContent = t; task.title = t; },
    close(){ closeWin(w); }
  };
  windows.set(id, w);
  /* a file dropped on a window goes to that window's app, and a file
     dropped on its taskbar button does the same thing */
  makeDropTarget(root, () => w.appId, () => w);
  makeDropTarget(task, () => w.appId, () => w);
  drawDock();
  applyShellSizing();
  setTimeout(retile, 0);

  root.addEventListener("pointerdown", () => focusWin(w), true);
  bCls.onclick = () => closeWin(w);
  bMin.onclick = () => minimizeWin(w);
  bMax.onclick = () => toggleMax(w);
  bar.addEventListener("dblclick", e => { if (!e.target.closest("button")) toggleMax(w); });

  dragify(bar,
    () => {
      if (w.max) return { abort: true };
      w.snapZone = null;
      wobbleStart(w);
      return { x: root.offsetLeft, y: root.offsetTop };
    },
    (dx, dy, c, vx, vy, ev) => {
      const maxX = area.clientWidth - 60, maxY = area.clientHeight - 34;
      root.style.left = clamp(c.x + dx, -(root.offsetWidth - 60), maxX) + "px";
      root.style.top  = clamp(c.y + dy, 0, maxY) + "px";
      wobblePull(w, vx, vy);
      c.snap = snapZoneFor(ev);
      showSnapGhost(c.snap);
    },
    c => {
      wobbleRelease(w);
      hideSnapGhost();
      if (State.shell === "hypr") return retile();   /* the layout decides, not you */
      if (c.snap) applySnap(w, c.snap);
    });

  /* every edge and corner. West and north move the origin as they size. */
  const RESIZE_DIRS = [["n",0,-1],["s",0,1],["w",-1,0],["e",1,0],
                       ["nw",-1,-1],["ne",1,-1],["sw",-1,1],["se",1,1]];
  for (const [cls, ex, ey] of RESIZE_DIRS){
    const h = el("div", "rz " + cls);
    root.appendChild(h);
    dragify(h,
      () => w.max ? { abort: true }
                  : { x: root.offsetLeft, y: root.offsetTop, w: root.offsetWidth, h: root.offsetHeight },
      (dx, dy, c) => {
        let nx = c.x, ny = c.y, nw = c.w, nh = c.h;
        if (ex > 0) nw = Math.max(340, c.w + dx);
        if (ex < 0){ nw = Math.max(340, c.w - dx); nx = c.x + (c.w - nw); }
        if (ey > 0) nh = Math.max(190, c.h + dy);
        if (ey < 0){
          nh = Math.max(190, c.h - dy);
          ny = c.y + (c.h - nh);
          if (ny < 0){ nh += ny; ny = 0; }   /* do not push the title bar off screen */
        }
        root.style.left = nx + "px";
        root.style.top = ny + "px";
        root.style.width = nw + "px";
        root.style.height = nh + "px";
      },
      () => { w.snapZone = null; });
  }

  task.onclick = () => {
    if (w.min) { restoreWin(w); focusWin(w); }
    else if (activeWin === w) minimizeWin(w);
    else focusWin(w);
  };
  return w;
}

/* ---- tiling, for the Hyprland shell ----
   Windows share the screen instead of stacking: the first gets a master
   column, the rest split what is left. Anything maximised or minimised sits
   out. Called whenever the set of open windows changes. */
function retile(){
  if (State.shell !== "hypr") return;
  const area = $("#windows");
  const W = area.clientWidth, H = area.clientHeight;
  if (W < 80 || H < 80) return;
  const cs = getComputedStyle(document.body);
  const gap = parseInt(cs.getPropertyValue("--hypr-gap"), 10) || 9;
  const edge = parseInt(cs.getPropertyValue("--hypr-edge"), 10) || 11;

  const list = Array.from(windows.values()).filter(w => !w.min && !w.max);
  if (!list.length) return;

  const put = (w, x, y, ww, hh) => {
    w.el.style.left = Math.round(x) + "px";
    w.el.style.top = Math.round(y) + "px";
    w.el.style.width = Math.round(Math.max(160, ww)) + "px";
    w.el.style.height = Math.round(Math.max(90, hh)) + "px";
  };
  if (list.length === 1){
    put(list[0], edge, edge, W - edge * 2, H - edge * 2);
    return;
  }
  /* master column on the left, everything else stacked beside it */
  const masterW = Math.round((W - edge * 2 - gap) * 0.56);
  put(list[0], edge, edge, masterW, H - edge * 2);
  const stack = list.slice(1);
  const sx = edge + masterW + gap;
  const sw = W - edge - sx;
  const sh = (H - edge * 2 - gap * (stack.length - 1)) / stack.length;
  stack.forEach((w, i) => put(w, sx, edge + i * (sh + gap), sw, sh));
}
/* minimum sizes would fight the layout, so relax them while tiling */
function applyShellSizing(){
  const tiling = State.shell === "hypr";
  for (const w of windows.values()){
    w.el.style.minWidth = tiling ? "0" : "";
    w.el.style.minHeight = tiling ? "0" : "";
  }
}

/* ---- edge snapping: shove a window at a screen edge to tile it ---- */
function snapZoneFor(ev){
  const r = $("#windows").getBoundingClientRect();
  const edge = 14;
  if (ev.clientY <= r.top + edge) return "max";
  if (ev.clientX <= r.left + edge) return "left";
  if (ev.clientX >= r.right - edge) return "right";
  if (ev.clientY >= r.bottom - edge) return "bottom";
  return null;
}
function snapRect(zone){
  const a = $("#windows");
  const W = a.clientWidth, H = a.clientHeight;
  if (zone === "max")    return { left: 0, top: 0, width: W, height: H };
  if (zone === "left")   return { left: 0, top: 0, width: Math.round(W / 2), height: H };
  if (zone === "right")  return { left: Math.round(W / 2), top: 0, width: W - Math.round(W / 2), height: H };
  if (zone === "bottom") return { left: 0, top: Math.round(H / 2), width: W, height: H - Math.round(H / 2) };
  return null;
}
function showSnapGhost(zone){
  const g = $("#snapghost");
  const r = snapRect(zone);
  if (!r){ g.classList.remove("on"); return; }
  g.style.left = r.left + "px";
  g.style.top = r.top + "px";
  g.style.width = r.width + "px";
  g.style.height = r.height + "px";
  g.classList.add("on");
}
function hideSnapGhost(){ $("#snapghost").classList.remove("on"); }
function applySnap(w, zone, silent){
  const r = snapRect(zone);
  if (!r) return;
  w.snapZone = zone;
  if (w.max){ w.max = false; w.el.classList.remove("max"); }
  if (!w.prev) w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
  if (State.animations && !silent) w.el.style.transition = "left .13s ease, top .13s ease, width .13s ease, height .13s ease";
  w.el.style.left = r.left + "px";
  w.el.style.top = r.top + "px";
  w.el.style.width = r.width + "px";
  w.el.style.height = r.height + "px";
  setTimeout(() => { w.el.style.transition = ""; }, 160);
}
function focusWin(w){
  if (!w || !windows.has(w.id)) return;
  if (w.min) restoreWin(w);
  for (const o of windows.values()){ o.el.classList.remove("active"); o.task.classList.remove("active"); }
  w.el.style.zIndex = ++zTop;
  w.el.classList.add("active");
  w.task.classList.add("active");
  activeWin = w;
  if (w.appId === "chat") chatSeen();
  /* after the click that did this has finished moving focus about */
  if (w.api && w.api.focusFrame) setTimeout(() => { if (activeWin === w) w.api.focusFrame(); }, 0);
  updateMenuBarApp();
  syncWallVideo();
}
/* A click inside a window's iframe never reaches this document, so the
   window underneath would stay behind. Focus leaving for the frame is the
   one thing that is visible here - use that to bring its window forward. */
addEventListener("blur", () => {
  setTimeout(() => {
    const f = document.activeElement;
    if (!f || f.tagName !== "IFRAME") return;
    for (const w of windows.values()) if (w.el.contains(f) && activeWin !== w) return focusWin(w);
  }, 0);
});
/* the genie: fly the frame down into its taskbar button, then hide it */
/* The genie: the window flies to its taskbar button and back. Both halves
   set the starting state, force the browser to work it out, then set the
   end state - no requestAnimationFrame, because a frame callback never
   arrives in a background tab and the window would be left mid-flight. A
   timer always puts the styles back, so the worst case is no animation
   rather than a window you cannot see. */
function genieBox(w){
  const r = w.el.getBoundingClientRect(), t = taskTargetFor(w).getBoundingClientRect();
  if (!r.width || !t.width) return null;
  return {
    sx: Math.max(0.06, t.width / r.width),
    sy: Math.max(0.04, t.height / r.height),
    dx: t.left + t.width / 2 - (r.left + r.width / 2),
    dy: t.top + t.height / 2 - (r.top + r.height / 2)
  };
}
function minimizeWin(w){
  setTimeout(syncWallVideo, 0);
  if (w.min) return;
  w.min = true;
  updateDeskBtn();
  w.el.classList.remove("active");
  w.task.classList.add("min");
  w.task.classList.remove("active");
  if (activeWin === w) activeWin = null;
  const finish = () => {
    w.el.style.display = "none";
    w.el.style.transition = "none";
    w.el.style.transform = "";
    w.el.style.opacity = "";
    void w.el.offsetHeight;
    w.el.style.transition = "";
    focusTopmost();
    retile();
  };
  const g = State.animations && genieBox(w);
  if (!g) return finish();
  w.el.style.transformOrigin = "50% 50%";
  w.el.style.transition = "transform .21s cubic-bezier(.4,0,.7,.4), opacity .21s ease-in";
  void w.el.offsetHeight;
  w.el.style.transform = "translate(" + g.dx + "px," + g.dy + "px) scale(" + g.sx + "," + g.sy + ")";
  w.el.style.opacity = "0";
  setTimeout(finish, 230);
}
function restoreWin(w){
  if (!w.min) return;
  w.min = false;
  updateDeskBtn();
  w.task.classList.remove("min");
  w.el.style.display = "";
  retile();
  const clear = () => {
    /* kill the transition before dropping the inline values: if one is still
       running - and in a background tab it may never have started - removing
       them mid-flight freezes the window at whatever size it had reached */
    w.el.style.transition = "none";
    w.el.style.transform = "";
    w.el.style.opacity = "";
    void w.el.offsetHeight;
    w.el.style.transition = "";
  };
  const g = State.animations && genieBox(w);
  if (!g) return clear();
  w.el.style.transition = "none";
  w.el.style.transformOrigin = "50% 50%";
  w.el.style.transform = "translate(" + g.dx + "px," + g.dy + "px) scale(" + g.sx + "," + g.sy + ")";
  w.el.style.opacity = "0";
  /* the shrunk state has to be one the browser has actually worked out
     before the end state is set, or the two collapse into one calculation
     and the window simply appears with nothing in between */
  void w.el.offsetHeight;
  w.el.style.transition = "transform .21s cubic-bezier(.3,.6,.4,1), opacity .18s ease-out";
  w.el.style.transform = "";
  w.el.style.opacity = "1";
  setTimeout(clear, 260);
}
function toggleMax(w){
  setTimeout(syncWallVideo, 0);
  const area = $("#windows");
  if (w.max){
    w.max = false;
    w.el.classList.remove("max");
    Object.assign(w.el.style, w.prev);
    retile();
  } else {
    w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
    w.max = true;
    w.el.classList.add("max");
    Object.assign(w.el.style, { left: "0px", top: "0px", width: area.clientWidth + "px", height: area.clientHeight + "px" });
    retile();
  }
}
function closeWin(w){
  if (w.api && typeof w.api.onClose === "function" && w.api.onClose() === false) return;
  if (Focus.win === w) leaveFocus();
  setTimeout(syncWallVideo, 250);
  const done = () => {
    Sfx.play("close");
    w.el.remove();
    w.task.remove();
    windows.delete(w.id);
    if (activeWin === w) activeWin = null;
    focusTopmost();
    drawDock();
    updateMenuBarApp();
    retile();
  };
  if (State.animations && !w.min){
    w.el.classList.add("closing");
    setTimeout(done, 150);
  } else done();
}
function focusTopmost(){
  let best = null;
  for (const o of windows.values())
    if (!o.min && (!best || +o.el.style.zIndex > +best.el.style.zIndex)) best = o;
  if (best) focusWin(best);
}
addEventListener("resize", () => {
  if (State.shell === "hypr") return retile();
  const area = $("#windows");
  for (const w of windows.values()){
    if (w.max){
      w.el.style.width  = area.clientWidth + "px";
      w.el.style.height = area.clientHeight + "px";
    } else if (w.snapZone){
      applySnap(w, w.snapZone, true);
    } else {
      w.el.style.left = clamp(w.el.offsetLeft, -(w.el.offsetWidth - 60), area.clientWidth - 60) + "px";
      w.el.style.top  = clamp(w.el.offsetTop, 0, area.clientHeight - 34) + "px";
    }
  }
});

/* apps that were folded into others - a Dock pin or shortcut still works */
const APP_ALIAS = { paint: "videos", photos: "videos", viewer: "videos", mp3: "music", store: "settings", flash: "files", vault: "files", mines: "games", calc: "files" };
function launch(appId, arg, forceNew){
  /* the old names still open the right face or page */
  if (appId === "mp3") State.mediaMode = "mp3";
  if (appId === "store") settingsPage = "apps";
  /* the Trash is a place in Files now */
  if (appId === "trash") return openTrash();
  appId = APP_ALIAS[appId] || appId;
  const app = APPS[appId];
  if (!app) return null;
  if (app.single && !forceNew){
    for (const w of windows.values())
      if (w.appId === appId){ focusWin(w); return w; }
  }
  const w = createWindow({ title: app.name, icon: app.icon, w: app.w, h: app.h, appId, cls: app.cls });
  w.api = app.run(w, arg) || {};
  focusWin(w);
  Sfx.play("open");
  return w;
}
function openTrash(){
  let w = null;
  for (const o of windows.values()) if (o.appId === "files") w = o;
  if (w) focusWin(w); else w = launch("files");
  if (w && w.api && w.api.showTrash) w.api.showTrash();
  return w;
}
function openInFiles(path){
  let target = null;
  for (const w of windows.values()) if (w.appId === "files") target = w;
  if (target){ focusWin(target); target.api.reveal(path); return target; }
  const w = launch("files");
  w.api.reveal(path);
  return w;
}
/* pictures and videos both open in the Gallery */
function openImage(path){
  for (const w of windows.values())
    if (w.appId === "videos"){ focusWin(w); w.api.play(path); return w; }
  return launch("videos", path);
}
function openInBrowser(target){
  let reuse = null;
  for (const w of windows.values()) if (w.appId === "browser") reuse = w;
  /* a second page belongs in a tab of the window that is already open */
  if (reuse){ focusWin(reuse); (reuse.api.newTab || reuse.api.go)(target); return reuse; }
  return launch("browser", target);
}
/* one place that decides what opening a thing means */
function openNode(path){
  const n = node(path);
  if (!n) return;
  if (n.type === "dir") openInFiles(path);
  else if (isHtml(baseName(path))) openInBrowser("box:" + path);
  else if (isAudio(baseName(path))) openAudio(path);
  else if (isVideo(baseName(path))) openImage(path);
  else if (n.kind === "text") openInFiles(path);
  else if (fileIsImage(path)) openImage(path);
  else osAlert(baseName(path), "No preview available for this file type yet.\n\n" + fmtBytes(nodeSize(n)) + " \u00b7 " + (n.mime || "unknown"));
}

/* ============================================================
   8. desktop shortcuts
   ============================================================ */
function runShortcut(s){
  if (s.kind === "trash") return launch("trash");
  if (s.kind === "app")   return launch(s.target);
  if (s.kind === "url")   return openInBrowser(s.target);
  if (s.kind === "path"){
    if (!node(s.target)) return osAlert("Broken shortcut", "\u201c" + s.label + "\u201d points at " + s.target + ", which no longer exists.");
    return openNode(s.target);
  }
}
function guessShortcut(target, label){
  target = target.trim();
  if (/^https?:\/\//i.test(target))
    return { kind: "url", target, icon: "\uD83C\uDF10", label: label || target.replace(/^https?:\/\//, "").split("/")[0] };
  if (APPS[target.toLowerCase()] && !APPS[target.toLowerCase()].hidden){
    const id = target.toLowerCase();
    return { kind: "app", target: id, icon: APPS[id].icon, label: label || APPS[id].name };
  }
  if (target.startsWith("/") || target.startsWith("~")){
    const p = absPath(target, HOME);
    const n = node(p);
    if (!n) return null;
    return { kind: "path", target: p, icon: nodeIcon(baseName(p), n), label: label || baseName(p) };
  }
  if (/^[\w-]+\.[a-z]{2,}(\/|$)/i.test(target))
    return { kind: "url", target: "https://" + target, icon: "\uD83C\uDF10", label: label || target.split("/")[0] };
  return null;
}
function addShortcut(s){
  if (!s) return null;
  const item = { id: uid("sc"), label: s.label, icon: s.icon, kind: s.kind, target: s.target };
  State.shortcuts.push(item);
  drawDesktop();
  refreshSettings();
  notify("Shortcut added", "\u201c" + item.label + "\u201d is on your desktop.", item.icon);
  return item;
}
function addPathShortcut(path){
  const n = node(path);
  if (!n) return;
  if (State.shortcuts.some(s => s.kind === "path" && s.target === path))
    return notify("Already there", "\u201c" + baseName(path) + "\u201d is already on the desktop.", "\u2139\uFE0F");
  addShortcut({ kind: "path", target: path, icon: nodeIcon(baseName(path), n), label: baseName(path) });
}
/* dropping a file on the desktop leaves a shortcut to it there */
(function desktopDrop(){
  const box = $("#icons");
  if (!box) return;
  box.addEventListener("dragover", e => {
    if (!dragging.length) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "link";
    box.classList.add("drop-on");
  });
  box.addEventListener("dragleave", () => box.classList.remove("drop-on"));
  box.addEventListener("drop", e => {
    box.classList.remove("drop-on");
    if (!dragging.length) return;
    e.preventDefault();
    const paths = dragging.slice();
    dragging = [];
    paths.forEach(addPathShortcut);
  });
})();
function removeShortcut(id){
  State.shortcuts = State.shortcuts.filter(s => s.id !== id);
  drawDesktop();
  refreshSettings();
}
async function newShortcutDialog(){
  const vals = await modal({
    title: "New Shortcut",
    message: "Point it at an app, a file or a web address.",
    fields: [
      { label: "Target", value: "", placeholder: "browser  /  ~/notes.md  /  duckduckgo.com" },
      { label: "Name (optional)", value: "" }
    ],
    ok: "Create"
  });
  if (!vals) return;
  const s = guessShortcut(vals[0], vals[1]);
  if (!s) return osAlert("New Shortcut", "Could not work out what \u201c" + vals[0] + "\u201d is.\n\nTry an app name (files, browser, terminal, settings), a path like ~/notes.md, or a web address.");
  addShortcut(s);
}
/* everything on the desktop, built-ins and user shortcuts together */
function desktopItems(){
  const out = [];
  for (const b of BUILTIN_ICONS) if (State.builtins[b.id]){
    const item = Object.assign({ builtin: true }, b);
    if (b.kind === "trash" && Trash.items.length) item.label = "Trash (" + Trash.items.length + ")";
    out.push(item);
  }
  for (const s of State.shortcuts) out.push(s);
  return out;
}
function drawDesktop(){
  saveShortcuts();
  const box = $("#icons");
  box.innerHTML = "";
  for (const s of desktopItems()){
    const d = el("div", "dicon");
    const di = el("span", "g");
    setAppIcon(di, s.icon);
    d.append(di, el("span", "l", s.label));
    d.title = s.kind === "app" ? (APPS[s.target] ? APPS[s.target].name : s.label) : (s.target || s.label);
    d.addEventListener("pointerdown", () => {
      $$(".dicon").forEach(o => o.classList.remove("sel"));
      d.classList.add("sel");
    });
    d.addEventListener("dblclick", () => runShortcut(s));
    /* a shortcut that points at a file can be dragged onto an app, the
       same way a row in Files can */
    if (s.kind === "path" && node(s.target)){
      d.draggable = true;
      d.addEventListener("dragstart", e => {
        dragging = [s.target];
        e.dataTransfer.effectAllowed = "all";
        e.dataTransfer.setData("text/plain", s.target);
      });
      d.addEventListener("dragend", () => { dragging = []; });
    }
    d.addEventListener("contextmenu", e => {
      e.preventDefault(); e.stopPropagation();
      $$(".dicon").forEach(o => o.classList.remove("sel"));
      d.classList.add("sel");
      const items = [{ icon: "\uD83D\uDCC2", label: "Open", run: () => runShortcut(s) }, "-"];
      if (s.builtin){
        items.push({ icon: "\uD83D\uDC41\uFE0F", label: "Hide this icon", run: () => {
          State.builtins[s.id] = false; drawDesktop(); refreshSettings();
          notify("Icon hidden", "Turn \u201c" + s.label + "\u201d back on in Settings \u203a Desktop.", s.icon);
        }});
      } else {
        items.push({ icon: "\u270F\uFE0F", label: "Rename\u2026", run: async () => {
          const name = await osPrompt("Rename shortcut", "New name", s.label);
          if (name){ s.label = name; drawDesktop(); refreshSettings(); }
        }});
        items.push({ icon: "\uD83D\uDDD1\uFE0F", label: "Remove from desktop", run: () => removeShortcut(s.id) });
      }
      showCtx(e.clientX, e.clientY, items);
    });
    box.appendChild(d);
  }
}


/* ============================================================
   8b. shared odds and ends: drag state, markdown, backup
   ============================================================ */
let dragging = [];          /* paths currently being dragged between folders */

const AUDIO_EXT = ["mp3","wav","ogg","oga","m4a","aac","flac","opus","weba"];
const isAudio = name => AUDIO_EXT.includes(extOf(name));

/* ---- dragging a file out of Files and onto something else -------------
   `dragging` holds the paths picked up in the Files list. Every drop
   target - dock icon, window, desktop - asks the same two questions:
   would this app do anything useful with these, and if so, do it. */
function fileIsImage(p){
  const n = node(p);
  if (!n || n.type !== "file") return false;
  return n.kind === "image" || IMG_EXT.includes(extOf(p)) || String(n.mime || "").startsWith("image/");
}
function fileIsText(p){
  const n = node(p);
  return !!n && n.type === "file" && n.kind === "text";
}
function appAccepts(appId, paths){
  if (!paths || !paths.length) return false;
  const all = fn => paths.every(fn);
  const isFile = p => { const n = node(p); return !!n && n.type === "file"; };
  switch (appId){
    case "files":
    case "trash":
    case "terminal": return true;
    case "browser":  return all(p => isHtml(p) || fileIsText(p));
    case "editor":   return all(fileIsText);
    case "music":    return all(p => isFile(p) && (isAudio(p) || isVideo(p)));
    case "videos":   return all(p => isFile(p) && (isVideo(p) || fileIsImage(p)));

    case "playground": return paths.length === 1 && fileIsText(paths[0]) && isHtml(paths[0]);
    default:         return false;
  }
}
/* w is the window dropped on, where there is one; otherwise the app is
   asked to open a window of its own */
function dropOnApp(appId, paths, w){
  if (!appAccepts(appId, paths)) return false;
  const api = (w && w.api) || {};
  const each = fn => paths.forEach(fn);
  if (w && appId !== "trash") focusWin(w);
  switch (appId){
    case "trash":
      each(trashPath);
      refreshFilesViews();
      notify("In the Trash", paths.length === 1 ? baseName(paths[0]) : paths.length + " items", "\uD83D\uDDD1\uFE0F");
      break;
    case "files":
      if (api.dropHere) api.dropHere(paths); else openInFiles(paths[0]);
      break;
    case "browser":
      if (api.newTab) each(p => api.newTab("box:" + p));
      else each(p => openInBrowser("box:" + p));
      break;
    case "editor":
      if (api.open) api.open(paths[0]); else launch("editor", paths[0]);
      each((p, i) => { if (i) launch("editor", p); });
      break;
    case "viewer":
      each(openImage);
      break;
    case "music":
    case "videos":
      (w || mediaWin(appId)).api.play(paths[0]);
      break;
    case "playground":
      if (api.open) api.open(paths[0]); else launch("playground", paths[0]);
      break;
    case "terminal":
      if (api.insert) api.insert(paths.map(p => tilde(p)).join(" "));
      else launch("terminal");
      break;
    default: return false;
  }
  Sfx.play("open");
  return true;
}
/* one set of handlers, wired onto anything that should take a file */
function makeDropTarget(elm, appIdOf, onWin){
  elm.addEventListener("dragover", e => {
    /* from outside SEA OS - files off the desktop, links from another tab - only the players take them */
    if (!dragging.length){
      if (!MEDIA_APPS.has(appIdOf()) || !carriesMedia(e.dataTransfer)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      elm.classList.add("drop-on");
      return;
    }
    const id = appIdOf();
    if (!appAccepts(id, dragging)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = id === "trash" ? "move" : "copy";
    elm.classList.add("drop-on");
  });
  elm.addEventListener("dragleave", () => elm.classList.remove("drop-on"));
  elm.addEventListener("drop", e => {
    elm.classList.remove("drop-on");
    if (!dragging.length){
      const id = appIdOf(), dt = e.dataTransfer;
      if (!MEDIA_APPS.has(id) || !carriesMedia(dt)) return;
      e.preventDefault();
      e.stopPropagation();
      mediaTakeIn(id, Array.from(dt.files || []), dt.getData("text/uri-list") || dt.getData("text/plain") || "", onWin ? onWin() : null);
      return;
    }
    const paths = dragging.slice();
    e.preventDefault();
    e.stopPropagation();
    dragging = [];
    dropOnApp(appIdOf(), paths, onWin ? onWin() : null);
  });
}

/* a deliberately small Markdown renderer - headings, emphasis, code,
   links, lists, quotes and rules. Everything is escaped first. */
/* Strip the actively dangerous bits. The frame is already sandboxed with an
   opaque origin so it cannot reach SEA OS, but README HTML is still someone
   else's markup and there is no reason to run its scripts. */
function sanitizeHtml(html){
  return String(html)
    .replace(/<script\b[\s\S]*?<\/script\s*>/gi, "")
    .replace(/<iframe\b[\s\S]*?<\/iframe\s*>/gi, "")
    .replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, "")
    .replace(/\son[a-z]+\s*=\s*'[^']*'/gi, "")
    .replace(/\son[a-z]+\s*=\s*[^\s>]+/gi, "")
    .replace(/(href|src)\s*=\s*(["'])\s*javascript:[^"']*\2/gi, '$1="#"');
}
function markdownToHtml(src, allowHtml){
  /* GitHub READMEs freely mix raw HTML into Markdown, so callers that trust
     the source can let those blocks through instead of showing them as text */
  const esc = t => allowHtml ? String(t) : String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const blocks = [];
  let text = String(src).replace(/\r\n/g, "\n");
  text = text.replace(/```([\s\S]*?)```/g, (m, code) => {
    blocks.push("<pre><code>" + esc(code.replace(/^\n/, "")) + "</code></pre>");
    return "\u0000B" + (blocks.length - 1) + "\u0000";
  });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  const out = [];
  let list = null;
  const closeList = () => { if (list){ out.push("</" + list + ">"); list = null; } };
  const lines = text.split("\n");
  for (let li = 0; li < lines.length; li++){
    const raw = lines[li];
    const line = raw.replace(/\s+$/, "");
    let m;
    if (/^\u0000B\d+\u0000$/.test(line)){ closeList(); out.push(blocks[+line.slice(2, -1)]); continue; }
    if (allowHtml && /^\s*<\/?[a-zA-Z][\w-]*(\s|\/?>)/.test(line)){ closeList(); out.push(line); continue; }
    if (!line.trim()){ closeList(); continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())){ closeList(); out.push("<hr>"); continue; }
    /* GFM tables: a header row, a dashed divider, then the body rows */
    if (line.includes("|")){
      const nxt = lines[li + 1] || "";
      if (/^\s*\|?[\s:|-]*-[\s:|-]*$/.test(nxt) && nxt.includes("-") && nxt.includes("|")){
        closeList();
        const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
        const head = cells(line);
        const rows = [];
        li += 2;
        while (li < lines.length && lines[li].includes("|") && lines[li].trim()){
          rows.push(cells(lines[li]));
          li++;
        }
        li--;
        out.push("<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") +
          "</tr></thead><tbody>" +
          rows.map(r => "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") +
          "</tbody></table>");
        continue;
      }
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))){
      closeList();
      out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">");
      continue;
    }
    if ((m = line.match(/^\s*>\s?(.*)$/))){ closeList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); continue; }
    if ((m = line.match(/^\s*[-*+]\s+\[( |x|X)\]\s+(.*)$/))){
      if (list !== "ul"){ closeList(); out.push("<ul>"); list = "ul"; }
      out.push('<li class="md-task"><input type="checkbox" disabled' + (m[1] === " " ? "" : " checked") + "> " + inline(m[2]) + "</li>");
      continue;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))){
      if (list !== "ul"){ closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>");
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))){
      if (list !== "ol"){ closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>");
      continue;
    }
    closeList();
    out.push("<p>" + inline(line) + "</p>");
  }
  closeList();
  return out.join("\n");
}

/* ---- backup and restore: the whole machine in one file ---- */
function backupBlob(){
  const settings = {};
  for (const k of SETTING_KEYS) settings[k] = State[k];
  return JSON.stringify({
    boxos: 1, version: VERSION, saved: new Date().toISOString(),
    fs: FS.root, settings, shortcuts: State.shortcuts, builtins: State.builtins, trash: Trash.items
  });
}
function downloadBackup(){
  const name = "boxos-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  const blob = new Blob([backupBlob()], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  notify("Backup saved", name + " went to your downloads.", "\uD83D\uDCBE");
}
async function restoreBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e){ return osAlert("Restore failed", "That file is not readable JSON."); }
  if (!data || !data.boxos || !data.fs || data.fs.type !== "dir")
    return osAlert("Restore failed", "That does not look like a SEA OS backup.");
  const ok = await osConfirm("Restore backup",
    "Replace everything currently in SEA OS with the contents of this backup?\n\n" +
    "Saved " + (data.saved ? new Date(data.saved).toLocaleString() : "at an unknown time") + ".",
    "Replace everything", true);
  if (!ok) return;
  FS.root = data.fs;
  if (data.settings) for (const k of SETTING_KEYS) if (data.settings[k] !== undefined) State[k] = data.settings[k];
  if (Array.isArray(data.shortcuts)) State.shortcuts = data.shortcuts;
  if (data.builtins) State.builtins = Object.assign({}, State.builtins, data.builtins);
  Trash.items = Array.isArray(data.trash) ? data.trash : [];
  applyBrand(); applyTheme(); applyAccent(); applyWallpaper(); applyChrome();
  drawDesktop();
  markDirty(); saveSettings(); saveShortcuts(); saveTrash();
  for (const w of windows.values()) if (w.appId === "files" && w.api.navigate) w.api.navigate(HOME);
  refreshTrashViews();
  refreshSettings();
  notify("Backup restored", "Everything was replaced with the contents of the backup.", "\uD83D\uDCE6");
}

/* ============================================================
   8c. exporting files, and a shared Open... dialog
   ============================================================ */
function dataUrlToBlob(url){
  const comma = url.indexOf(",");
  const meta = url.slice(0, comma), body = url.slice(comma + 1);
  const mime = (meta.match(/^data:([^;,]+)/) || [, "application/octet-stream"])[1];
  if (!/;base64/i.test(meta)) return new Blob([decodeURIComponent(body)], { type: mime });
  const bin = atob(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
/* hand a file back to the real computer */
function saveToComputer(path){
  const n = node(path);
  if (!n || n.type !== "file") return false;
  const blob = n.kind === "text"
    ? new Blob([n.content], { type: n.mime || "text/plain" })
    : dataUrlToBlob(n.content);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = baseName(path);
  document.body.appendChild(a);
  a.click();
