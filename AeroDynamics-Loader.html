<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chalkbored - AeroDynamics</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #player-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>

    <!-- Ruffle Emulator CDN Script -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <script>
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = "100%";
            player.style.height = "100%";
            document.getElementById("player-container").appendChild(player);
            
            // Replace "YOUR_SWF_FILE_NAME.swf" with your actual uploaded file name!
            player.load("AeroDynamics.swf");
        });
    </script>
</body>
</html>
